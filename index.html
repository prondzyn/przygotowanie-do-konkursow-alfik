eć: *(4 pkt)*\n    - A) posypały się iskry\n    - B) koń okulał\n    - C) koń poruszał się wolno\n    - D) słychać było tętent konia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — słychać było tętent konia<br>„Zagrzmiała” mówi o głośnym dźwięku — to stukot końskich kopyt (tętent) galopujących koni.<\/details><br>\n17. Osoba mówiąca: *(4 pkt)*\n    - A) nie bierze udziału w wydarzeniu\n    - B) jest strażnikiem zamku\n    - C) to jeden ze zbrojnych\n    - D) to mieszkaniec zamku\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — nie bierze udziału w wydarzeniu<br>Mówiący opisuje wszystko z boku i nie mówi o sobie („ja”, „my”). O rycerzach i strażnikach mówi w trzeciej osobie.<\/details><br>\n18. Opowiadając swoją wiedzę czerpie z: *(4 pkt)*\n    - A) informacji od innych osób\n    - B) posiadanej wszechwiedzy\n    - C) własnej obserwacji\n    - D) umiejętności czytania w myślach\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — własnej obserwacji<br>Mówiący widzi z daleka biegnące postacie i zgaduje: „muszą być na koniach”, „muszą być pancerni”. Gdyby wiedział wszystko, nie musiałby zgadywać.<\/details><br>\n19. Sformułowanie ***most zwodzony z łoskotem opada*** informuje, że most opada: *(4 pkt)*\n    - A) wolno\n    - B) majestatycznie\n    - C) efektownie\n    - D) głośno\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — głośno<br>Łoskot to głośny huk, trzask. „Z łoskotem” znaczy więc „głośno”.<\/details><br>\n20. Podkreślone wyrazy w sformułowaniu ***świecą mocno, <u>muszą być<\/u> pancerni*** świadczą o tym, że mówiący: *(4 pkt)*\n    - A) wie z pewnością\n    - B) wyciąga wnioski\n    - C) niczego nie wie\n    - D) nie rozumie tego, co widzi\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — wyciąga wnioski<br>Mówiący widzi, że coś mocno świeci, i z tego wnioskuje, że to zbroje. „Muszą być” znaczy tu „na pewno są, skoro…” — to wniosek z obserwacji, a nie pewna wiedza.<\/details><br>\n\n## Pytania za 5 punktów\n\n21. W sformułowaniu ***coraz to ciemniej***: *(5 pkt)*\n    - A) jest przymiotnik\n    - B) są dwa przysłówki\n    - C) jest czasownik\n    - D) jest rzeczownik\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — są dwa przysłówki<br>Przysłówek odpowiada na pytania jak? kiedy? gdzie? i się nie odmienia. „Coraz” i „ciemniej” (stopień wyższy od „ciemno”) to przysłówki, a „to” jest tu partykułą. Pułapka: „ciemniej” to nie przymiotnik — przymiotnik brzmiałby „ciemniejszy”.<\/details><br>\n22. Wyrazy ***wiatr północny***: *(5 pkt)*\n    - A) są w różnych przypadkach\n    - B) nie odmieniają się przez przypadki\n    - C) to dwa rzeczowniki\n    - D) to rzeczownik i przymiotnik\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — to rzeczownik i przymiotnik<br>„Wiatr” to rzeczownik (co?), a „północny” to przymiotnik (jaki wiatr?). Oba są w mianowniku i oba się odmieniają (wiatru północnego).<\/details><br>\n23. W wyrazie ***sklepionego***: *(5 pkt)*\n    - A) są cztery sylaby\n    - B) jest pięć spółgłosek\n    - C) są trzy sylaby\n    - D) jest siedem samogłosek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — są cztery sylaby<br>Skle-pio-ne-go — 4 sylaby. Samogłoski są 4 (e, o, e, o), bo „i” w „pio” tylko zmiękcza p. Spółgłosek jest 6: s, k, l, p, n, g.<\/details><br>\n24. Związek wyrazów ***we mgle***: *(5 pkt)*\n    - A) to zaimek i przyimek\n    - B) zawiera rzeczownik w dopełniaczu\n    - C) to wyrażenie przyimkowe\n    - D) nie zawiera rzeczownika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — to wyrażenie przyimkowe<br>Wyrażenie przyimkowe to przyimek + rzeczownik (lub inny wyraz odmienny): „we” to przyimek, „mgle” to rzeczownik. „Mgle” jest w miejscowniku (o czym? o mgle), nie w dopełniaczu.<\/details><br>\n25. Wypowiedzenie ***Zarżały konie***: *(5 pkt)*\n    - A) nie ma podmiotu\n    - B) zawiera orzeczenie\n    - C) nie jest zdaniem\n    - D) zawiera dopełnienie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — zawiera orzeczenie<br>Orzeczenie mówi, co robi podmiot: „zarżały”. Podmiot to „konie” (kto? co?). Skoro jest orzeczenie, to jest zdanie. Dopełnienia nie ma.<\/details><br>\n26. Użyte w tekście wyrazy ***miesiąc*** i ***księżyc***: *(5 pkt)*\n    - A) znaczą to samo\n    - B) mają znaczenia przeciwstawne\n    - C) mają tę samą liczbę spółgłosek\n    - D) nie mają tyle samo sylab\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — znaczą to samo<br>„Miesiąc” to dawna, poetycka nazwa księżyca — to synonimy. Oba mają po 2 sylaby (mie-siąc, księ-życ), więc D odpada.<\/details><br>\n27. W zdaniu ***Wtem się coś z dala na polu ukaże***: *(5 pkt)*\n    - A) jest podmiot domyślny\n    - B) podmiotem jest wyraz *coś*\n    - C) podmiotem jest rzeczownik\n    - D) nie ma orzeczenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — podmiotem jest wyraz *coś*<br>Pytamy orzeczenie „ukaże się”: kto? co? — coś. Podmiot jest więc wyrażony, ale to zaimek, a nie rzeczownik. „Polu” to rzeczownik, ale w miejscowniku (na czym?).<\/details><br>\n28. W wyrazach ***spało*** i ***zgasły***: *(5 pkt)*\n    - A) są trzy sylaby\n    - B) jest tyle samo spółgłosek\n    - C) jest tyle samo samogłosek i spółgłosek\n    - D) jest tyle samo samogłosek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — jest tyle samo samogłosek<br>Spało: samogłoski a, o; zgasły: a, y — po dwie. Spółgłosek jest 3 (s, p, ł) i 4 (z, g, s, ł), a sylaby są po dwie (spa-ło, zga-sły).<\/details><br>\n29. Wyrazem jednosylabowym jest wyraz: *(5 pkt)*\n    - A) baszty\n    - B) trzeci\n    - C) ognie\n    - D) trzej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — trzej<br>„Trzej” ma tylko jedną samogłoskę (e), więc jedną sylabę. Pozostałe mają po dwie: basz-ty, trze-ci, og-nie.<\/details><br>\n30. Wyraz ***niecałe*** piszemy łącznie, ponieważ: *(5 pkt)*\n    - A) rzeczowniki z *nie-* piszemy łącznie\n    - B) tak piszemy wszystkie przysłówki\n    - C) to *nie-* z przymiotnikiem w stopniu równym\n    - D) jest to wyjątek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — to *nie-* z przymiotnikiem w stopniu równym<br>„Nie” z przymiotnikami w stopniu równym piszemy łącznie (niecały, niedobry), a w stopniu wyższym i najwyższym osobno (nie większy). „Całe” to przymiotnik (jakie?), nie rzeczownik ani przysłówek.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. D — jest utworem poetyckim\n2. B — rozbudowany opis\n3. B — w średniowieczu\n4. D — noc\n5. A — na górze\n6. B — otaczała fosa\n7. D — księżyca\n8. C — wprowadza ponury nastrój\n9. A — ma charakter przenośny\n10. B — było mgliście\n11. B — przybycie rycerzy do zamku\n12. D — jak zachowywała się straż zamku\n13. A — nie zawsze była otwarta\n14. A — jaka była liczba zbrojnych\n15. C — przybyli mieli na sobie zbroje\n16. D — słychać było tętent konia\n17. A — nie bierze udziału w wydarzeniu\n18. C — własnej obserwacji\n19. D — głośno\n20. B — wyciąga wnioski\n21. B — są dwa przysłówki\n22. D — to rzeczownik i przymiotnik\n23. A — są cztery sylaby\n24. C — to wyrażenie przyimkowe\n25. B — zawiera orzeczenie\n26. A — znaczą to samo\n27. B — podmiotem jest wyraz *coś*\n28. D — jest tyle samo samogłosek\n29. D — trzej\n30. C — to *nie-* z przymiotnikiem w stopniu równym\n"}, {"path": "humanistyczny/klasa-5/testy-przeszle/alfik-2023.md", "id": "hum5/alfik-2023", "kind": "przeszly", "short": "Alfik 2023", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Alfik 2023\n\n<div class=\"test\" data-minuty=\"45\" data-start=\"30\"><\/div>\n\n**Oryginalny arkusz** XXVII edycji konkursu Alfik Humanistyczny, klasa 5 szkoły podstawowej, grudzień 2023.\nŹródło: [arkusz PDF](https://jersz.pl/wp-content/uploads/2023/12/5.pdf) i [klucz odpowiedzi](https://jersz.pl/wp-content/uploads/2024/01/AlfikHumanistyczny2324klucz.docx) na stronie organizatora, jersz.pl.\n30 pytań, 45 minut. Na start masz 30 pkt, za błędną odpowiedź tracisz ¼ punktów pytania.\nOdpowiedź E znaczy: żadna z odpowiedzi A–D nie jest poprawna. Wyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n## Tekst\n\n**Kornel Makuszyński, _O dwóch takich, co ukradli Księżyc_ (fragment)**\n\n> (…) wszyscy się spodziewali, że życie tych dwóch chłopców napełni ciche miasteczko zgiełkiem i wrzawą, ale rzeczywistość przeszła najśmielsze oczekiwania. Ilekroć przybył im rok życia, tylekroć miasteczku ubywało sto lat spokoju. Byli oni nad podziw sprytni, ruchliwi jak małpiątka, a w Zapiecku i w okolicy na sto mil dookoła nie było dziury, w którą by nie wleźli, ani nie było kamienia, pod który by nie zajrzeli. Dwie wrony, które zapragnęły na starość spokoju i postanowiły się przenieść na mieszkanie w okolice Zapiecka, zdołały zaledwie ujść z życiem, ale bez ogonów, za sprawą tych dwóch chłopców, i dały o tym znać w najdalsze strony, aby żadne stworzenie, któremu życie jest miłe, nie zbliżało się do tych okolic. Krety chowały się głęboko w ziemi, a jeden jedyny zając, który od wielu lat mieszkał w parowie, o dwie mile za Zapieckiem, miły i dobry zając, nazwiskiem Michał Kapusta, szczuty i goniony przez Jacka i Placka jakby przez kąśliwe ogary, porwał się z głębokiego snu i zaczął uciekać tak nieprzytomnie, że go jeszcze we dwa lata potem widziano uciekającego, choć ubiegł już trzy tysiące mil. Był to mądry zwierzak i wiedział, że każdy zając jest podobny do innego, nigdy jednak nie widział tak podobnych do siebie chłopców i to go właśnie tak przeraziło, bo nie mógł zrozumieć, co się dzieje. Uciekał przed jednym chłopakiem w czerwonych porteczkach i z twarzą pełną piegów, a nagle u wyjścia z kotliny zastąpił mu drogę ten sam, który go gonił z tyłu, w takich samych spodenkach i z taką samą twarzą. Kiedy biedny zając zawrócił, znów takiego samego zobaczył, pomyślał więc, że są to straszliwe czary i że już nie ujdzie z życiem. Cudem tylko ocalał, ale mu się coś w rozumie pomieszało i dlatego ucieka do tej chwili.\n>\n> Ciężkie jednak życie miały zwierzęta domowe, które swoje przyszłe nieszczęścia przeczuły w dzień urodzin Jacka i Placka. Nieszczęsny kogut miał wyrwany piękny ogon, ochrypł z żałości i z powodu ciągłych prześladowań stracił rachubę czasu, tak że słońce wschodziło nieporządnie, wedle swojego widzimisię, raz wcześniej, raz później, tym bardziej że na kościelnej wieży od wielu lat popsuł się zegar. Wskutek tych nieszczęść nikt nigdy nie wiedział w Zapiecku, która jest godzina. Ponieważ jednak pianie koguta potrzebne jest nieodzownie, aby dzieci wiedziały, czy już czas wstawać i zbierać się do szkoły, więc burmistrz nakazał, aby muzykant Zapiecka, Barnaba Baraniakiszka, codziennie udawał koguta; biedny człowiek czynił to bardzo pięknie, ale nikt nie wstawał, wszyscy bowiem wiedzieli, że to nie kogut pieje, lecz pan Barnaba, który miał czerwoną gębę, więc dlatego mianowano go Kogutem.\n>\n> Nieszczęśliwy baran, który z przyrodzenia miał wyłupiaste oczy, bo wśród baranów takie oczy są warunkiem wielkiej urody, stracił ją niemal zupełnie, bo wszelka przesada niszczy przyrodzony wdzięk. Oczy barana, wskutek ustawicznego strachu i wypatrywania, czy spoza jakiegoś węgła nie zbliża się straszliwy wróg w dwóch egzemplarzach, tak wylazły na wierzch ozdobnej głowy, że jej poza nimi wcale nie było widać. Już prawie nie było na tym świecie barana, tylko te oczy wytrzeszczone i wypukłe, przerażone i pełne niepokoju. Baran ten, szczęśliwy dotąd, teraz tak czasem beknął żałośnie bez powodu, że się ludziom serce krajało. Widać, że mu obrzydło życie, więc się czasem rozpędzał i głową uderzał w ścianę domu, jakby się sam tego miłego życia chciał pozbawić.\n>\n> Najsmutniejszym jednak stał się los psa Łapserdaka. Jacek i Placek najbardziej na niego się zawzięli i ciężkim czynili jego psie życie. Wrzucali go do studni albo przywiązywali mu do ogona, co się tylko dało. Straszyli go w nocy, budzili go we dnie; czasem rzucali przed niego tłustą kość, uwiązaną na sznurku; kiedy się do niej zbliżył, kość uciekała jak żywa, co przyprawiało biedne psisko o ogłupiałe zdumienie. Toteż cichy ten dotąd pies wył wciąż smutno, jak gdyby błagał kogoś o sprawiedliwość.\n\n## Pytania za 3 punkty\n\n1. Powyższy tekst: *(3 pkt)*\n   - A) opowiada o psotach Jacka i Placka\n   - B) opisuje życia w miasteczku\n   - C) opisuje miasteczko\n   - D) przedstawia spokojne życie mieszkańców\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — opowiada o psotach Jacka i Placka<br>Cały fragment to wyliczanie, co chłopcy zrobili wronom, zającowi, kogutowi, baranowi i psu. Pułapka: miasteczko jest tylko tłem, a jego życie wcale nie jest spokojne („miasteczku ubywało sto lat spokoju”).<\/details><br>\n2. Narrator wyraża: *(3 pkt)*\n   - A) akceptację dla działań Jacka i Placka\n   - B) niezrozumienie dla reakcji mieszkańców miasta\n   - C) współczucie dla wszystkich istot dręczonych przez bohaterów\n   - D) rozbawienie działaniami bohaterów\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — współczucie dla wszystkich istot dręczonych przez bohaterów<br>Narrator pisze o „biednym zającu”, „nieszczęsnym kogucie”, „nieszczęśliwym baranie” i „biednym psisku”. Te określenia pokazują, że żal mu zwierząt.<\/details><br>\n3. Prawdą jest, że bohaterowie: *(3 pkt)*\n   - A) robili dobre żarty\n   - B) rozumieli innych\n   - C) byli przez wszystkich lubiani\n   - D) byli uciążliwi dla całego otoczenia\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — byli uciążliwi dla całego otoczenia<br>Przez nich miasteczko traciło spokój, a zwierzęta uciekały albo cierpiały. Nikt nie miał z nimi łatwo.<\/details><br>\n4. Z tekstu wynika, że Jacek i Placek: *(3 pkt)*\n   - A) byli bliźniakami\n   - B) byli kolegami\n   - C) różnili się wyglądem\n   - D) lubili zwierzęta\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — byli bliźniakami<br>Zając „nigdy nie widział tak podobnych do siebie chłopców”: obaj mieli takie same spodenki i taką samą twarz. Mają też wspólne urodziny („w dzień urodzin Jacka i Placka”). Pułapka: „kolegami” to za mało — to bracia.<\/details><br>\n5. Pierwsze zdanie fragmentu świadczy o tym, że ludzie nie spodziewali się: *(3 pkt)*\n   - A) zgiełku i wrzawy\n   - B) tego, że są ponurakami\n   - C) tego, że nie bawią ich wesołe żarty\n   - D) rozmiarów zamieszania\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — rozmiarów zamieszania<br>Wszyscy spodziewali się zgiełku i wrzawy, „ale rzeczywistość przeszła najśmielsze oczekiwania” — zamieszanie okazało się dużo większe. Pułapka: zgiełku i wrzawy akurat się spodziewali, więc A odpada.<\/details><br>\n6. Narrator, charakteryzując bohaterów: *(3 pkt)*\n   - A) przedstawia fakty\n   - B) przytacza słowa innych\n   - C) wybiega w przyszłość\n   - D) czyta w myślach Jacka i Placka\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — przedstawia fakty<br>O chłopcach narrator opowiada przez to, co zrobili: gdzie weszli, kogo przestraszyli, co zrobili psu. Nie cytuje nikogo i nie mówi, co chłopcy myślą.<\/details><br>\n7. Opowiadając o Michale Kapuście, narrator: *(3 pkt)*\n   - A) wyłącznie opisuje jego zachowania\n   - B) wspomina o jego odczuciach\n   - C) przedstawia głównie własne opinie\n   - D) przedstawia opinie świadków\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — wspomina o jego odczuciach<br>Narrator mówi, że zająca to „tak przeraziło”, że „nie mógł zrozumieć, co się dzieje” i „pomyślał więc, że są to straszliwe czary”. Pułapka: A ma słowo „wyłącznie”, a narrator opisuje nie tylko zachowanie.<\/details><br>\n8. Zła sława chłopców wykroczyła poza granice miasteczka dzięki: *(3 pkt)*\n   - A) opowiadającemu\n   - B) zającowi\n   - C) dwóm wronom, które ledwo uszły z życiem\n   - D) Łapserdakowi\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — dwóm wronom, które ledwo uszły z życiem<br>Wrony „dały o tym znać w najdalsze strony, aby żadne stworzenie (…) nie zbliżało się do tych okolic”.<\/details><br>\n9. Zdanie „***w okolicy na sto mil dookoła nie było dziury, w którą by nie wleźli***” wyraża <u>**w tym tekście**<\/u>: *(3 pkt)*\n   - A) zdziwienie i zaniepokojenie działaniami bohaterów\n   - B) podziw dla pomysłowości bohaterów\n   - C) uznanie dla ciekawości bohaterów\n   - D) fascynację ciekawością świata Jacka i Placka\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — zdziwienie i zaniepokojenie działaniami bohaterów<br>Zdanie stoi w części o tym, jak chłopcy odbierali miasteczku spokój, a zaraz potem uciekają przed nimi wrony i zając. Narrator dziwi się, że wszędzie ich pełno, i niepokoi się tym. Pułapka: w tym tekście chodzi o kłopoty, a nie o pochwałę ciekawości.<\/details><br>\n10. Porównanie ***ruchliwi jak małpiątka*** ma <u>**w tym tekście**<\/u>: *(3 pkt)*\n    - A) wywołać współczucie dla bohaterów\n    - B) wzbudzić sympatię dla bohaterów\n    - C) usprawiedliwić bohaterów\n    - D) ośmieszyć bohaterów\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — ośmieszyć bohaterów<br>Porównanie chłopców do małpek, które nie mogą usiedzieć w miejscu, pokazuje ich w zabawny, trochę prześmiewczy sposób. Uwaga: to pytanie jest dość dyskusyjne — zdrobnienie „małpiątka” brzmi też trochę czule, więc ktoś mógłby wybrać B. Oficjalna odpowiedź to D.<\/details><br>\n\n## Pytania za 4 punkty\n\n11. Postępowanie bohaterów wobec psa należy nazwać: *(4 pkt)*\n    - A) okrutnym i karygodnym\n    - B) zabawnym\n    - C) pomysłowym\n    - D) zachęcającym do naśladowania\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — okrutnym i karygodnym<br>Chłopcy wrzucali psa do studni, przywiązywali mu coś do ogona i straszyli go w nocy. Dręczenie zwierzęcia to okrucieństwo, za które należy się kara (karygodne = zasługujące na karę).<\/details><br>\n12. Zdanie „***wył wciąż smutno, jak gdyby błagał kogoś o sprawiedliwość***” wyraża: *(4 pkt)*\n    - A) bezradność\n    - B) wściekłość\n    - C) potrzebę zwracania na siebie uwagi\n    - D) wieczne pretensje do świata\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — bezradność<br>Kto błaga o sprawiedliwość, sam nie potrafi się obronić i prosi o pomoc. Wycie jest smutne, a nie gniewne, więc to nie wściekłość.<\/details><br>\n13. W mieście nikt nie wiedział, która jest godzina, gdyż: *(4 pkt)*\n    - A) nie było to nikomu potrzebne\n    - B) nigdy nie było tam zegara\n    - C) nie było widać słońca\n    - D) dręczony kogut ochrypł i pogubił się\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — dręczony kogut ochrypł i pogubił się<br>Kogut „ochrypł z żałości i (…) stracił rachubę czasu”, a „wskutek tych nieszczęść nikt nigdy nie wiedział (…), która jest godzina”. Pułapka: zegar na wieży był, tylko się popsuł — więc B jest nieprawdą.<\/details><br>\n14. Pan Barnaba: *(4 pkt)*\n    - A) bez powodzenia udawał koguta, chociaż bardzo się starał\n    - B) w ogóle nie znał się na muzyce\n    - C) był blady\n    - D) był wiarygodny w roli koguta\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — bez powodzenia udawał koguta, chociaż bardzo się starał<br>„Biedny człowiek czynił to bardzo pięknie, ale nikt nie wstawał”, bo wszyscy wiedzieli, że to nie kogut. Pułapka: był muzykantem i miał „czerwoną gębę”, więc B i C odpadają.<\/details><br>\n15. Zdanie „***czasem beknął żałośnie bez powodu, że się ludziom serce krajało***”: *(4 pkt)*\n    - A) zawiera stały związek wyrazów oznaczający *rozpacz*\n    - B) nie zawiera czasowników\n    - C) zawiera tylko jeden rzeczownik\n    - D) nie ma orzeczenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — zawiera stały związek wyrazów oznaczający *rozpacz*<br>„Serce się kraje” to związek frazeologiczny: tak mówimy o wielkim żalu i smutku. Czasowniki są (beknął, krajało), rzeczowniki są trzy (powodu, ludziom, serce), a orzeczenie to np. „beknął”.<\/details><br>\n16. W wyrazie ***wszyscy***: *(4 pkt)*\n    - A) jest jedna sylaba\n    - B) jest jedna samogłoska\n    - C) jest więcej liter niż głosek\n    - D) jest pięć spółgłosek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest więcej liter niż głosek<br>Liter jest 7 (w-s-z-y-s-c-y), a głosek 6, bo „sz” to dwie litery, ale jedna głoska. Sylaby są dwie (wszy-scy), samogłoski dwie (y, y), a spółgłoski cztery: w (czytane jak f), sz, s, c. Pułapka: liter spółgłoskowych jest 5, ale głosek tylko 4.<\/details><br>\n17. Sformułowanie *rzeczywistość przeszła najśmielsze oczekiwania* <u>**w tym tekście**<\/u> oznacza: *(4 pkt)*\n    - A) było jeszcze gorzej\n    - B) było lepiej\n    - C) nic się nie zmieniło\n    - D) wszystko przemija\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — było jeszcze gorzej<br>Ludzie spodziewali się zgiełku i wrzawy, a wyszło jeszcze więcej hałasu i kłopotów. Pułapka: zwykle to zdanie mówi o czymś dobrym, ale w tym tekście chodzi o psoty, więc „gorzej”.<\/details><br>\n18. Sformułowanie ***życie chłopców***: *(4 pkt)*\n    - A) zawiera czasownik\n    - B) składa się z wyrazów o różnej liczbie sylab\n    - C) składa się z dwóch rzeczowników\n    - D) składa się z dwóch rzeczowników w tym samym przypadku\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — składa się z dwóch rzeczowników<br>„Życie” i „chłopców” to rzeczowniki (kto? co?). Pułapka: są w różnych przypadkach — „życie” w mianowniku, „chłopców” w dopełniaczu (kogo?), więc D odpada. Oba wyrazy mają po 2 sylaby (ży-cie, chłop-ców).<\/details><br>\n19. Podkreślony wyraz w sformułowaniu ***<u>ciche<\/u> miasteczko***: *(4 pkt)*\n    - A) nie jest określeniem\n    - B) jest przymiotnikiem\n    - C) jest nieodmienny\n    - D) ma formę dopełniacza\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest przymiotnikiem<br>Przymiotnik odpowiada na pytania jaki? jaka? jakie? — jakie miasteczko? ciche. Odmienia się (cichego, cichemu…), a tu stoi w mianowniku.<\/details><br>\n20. Wyraz ***miasteczko*** odnosi się do miasta, które jest: *(4 pkt)*\n    - A) brzydkie\n    - B) stare\n    - C) małe\n    - D) sławne\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — małe<br>„Miasteczko” to zdrobnienie od „miasto” (przyrostek -eczko), a zdrobnienia mówią, że coś jest małe.<\/details><br>\n\n## Pytania za 5 punktów\n\n21. Wyraz ***wszyscy***: *(5 pkt)*\n    - A) odmienia się przez przypadki\n    - B) ma formę celownika\n    - C) jest rzeczownikiem\n    - D) ma formę liczby pojedynczej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — odmienia się przez przypadki<br>Wszyscy, wszystkich, wszystkim… — wyraz się odmienia. To zaimek w mianowniku liczby mnogiej, więc B, C i D są nieprawdziwe.<\/details><br>\n22. Wyrazy ***wleźli*** i ***zajrzeli***: *(5 pkt)*\n    - A) nie odmieniają się przez osoby\n    - B) mają formę czasu teraźniejszego\n    - C) to czasowniki\n    - D) są w stronie biernej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — to czasowniki<br>Oba wyrazy mówią, co ktoś zrobił, więc to czasowniki. Są w czasie przeszłym (3. osoba liczby mnogiej) i w stronie czynnej, a przez osoby się odmieniają (wlazłem, wlazłeś…).<\/details><br>\n23. Jedna sylaba znajduje się w wyrazie: *(5 pkt)*\n    - A) tych\n    - B) wieży\n    - C) wielu\n    - D) zegar\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — tych<br>Sylab jest tyle, ile samogłosek. „Tych” ma jedną samogłoskę (y). Pułapka: w „wie-ży” i „wie-lu” litera i tylko zmiękcza w, więc są tam po dwie sylaby; „ze-gar” też ma dwie.<\/details><br>\n24. Podkreślony wyraz w zdaniu ***<u>Ciężkie<\/u> jednak życie miały zwierzęta domowe*** można zastąpić wyrazem: *(5 pkt)*\n    - A) wesołe\n    - B) pracowite\n    - C) ważne\n    - D) trudne\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — trudne<br>„Ciężkie życie” to życie pełne kłopotów, czyli trudne. Pułapka: „ciężki” może też znaczyć „dużo ważący”, ale tu chodzi o znaczenie przenośne.<\/details><br>\n25. ***Zgiełk*** i ***wrzawa*** to wyrazy: *(5 pkt)*\n    - A) o podobnym znaczeniu\n    - B) należące do różnych części mowy\n    - C) dwusylabowe\n    - D) nieodmienne przez przypadki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — o podobnym znaczeniu<br>Oba znaczą hałas, gwar — to synonimy. Oba są rzeczownikami i odmieniają się (zgiełku, wrzawy). „Zgiełk” ma tylko jedną sylabę.<\/details><br>\n26. Wypowiedzenie ***goniony przez Jacka i Placka jakby przez kąśliwe ogary***: *(5 pkt)*\n    - A) oznacza: biegł wolno\n    - B) nie zawiera epitetu\n    - C) zawiera porównanie\n    - D) nie zawiera rzeczownika w formie biernika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — zawiera porównanie<br>Porównanie zestawia dwie rzeczy za pomocą słów jak, jakby, niczym — tu chłopców porównano do psów myśliwskich („jakby przez kąśliwe ogary”). Epitet jest („kąśliwe”), a po „przez” stoi biernik (przez kogo? co? — Jacka, ogary).<\/details><br>\n27. Sformułowanie ***coś mu się w rozumie pomieszało*** oznacza: *(5 pkt)*\n    - A) ucieszył się\n    - B) wystraszył się\n    - C) roześmiał się\n    - D) oszalał\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — oszalał<br>Komu „pomieszało się w rozumie”, ten stracił rozum, czyli oszalał. Pułapka: zając był przestraszony, ale samo sformułowanie mówi o szaleństwie, nie o strachu.<\/details><br>\n28. Wyrazy ***pianie*** i ***koguta***: *(5 pkt)*\n    - A) mają tyle samo liter\n    - B) są różnymi częściami mowy\n    - C) są w tym samym przypadku\n    - D) mają tyle samo sylab\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — mają tyle samo liter<br>P-i-a-n-i-e i k-o-g-u-t-a — po 6 liter. Oba to rzeczowniki, ale „pianie” jest w mianowniku, a „koguta” w dopełniaczu. Sylab jest 2 (pia-nie) i 3 (ko-gu-ta).<\/details><br>\n29. Określenie ***wróg w dwóch egzemplarzach***: *(5 pkt)*\n    - A) nie zawiera wyrazu nieodmiennego\n    - B) dotyczy bliźniaków\n    - C) nie mówi o liczebności wroga\n    - D) nie zawiera liczebnika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — dotyczy bliźniaków<br>Baran bał się Jacka i Placka, którzy wyglądali jak jedna osoba „w dwóch egzemplarzach”. Przyimek „w” jest nieodmienny, a „dwóch” to liczebnik, więc A i D odpadają.<\/details><br>\n30. Wyraz ***uciekającego*** ma: *(5 pkt)*\n    - A) więcej sylab niż wyraz *przywiązywali*\n    - B) sześć spółgłosek\n    - C) postać mianownika\n    - D) postać czasu przeszłego\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — więcej sylab niż wyraz *przywiązywali*<br>U-cie-ka-ją-ce-go ma 6 sylab, a przy-wią-zy-wa-li — 5. Spółgłosek jest 5 (ć, k, j, c, g), a wyraz stoi w dopełniaczu lub bierniku (kogo?), nie w mianowniku.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. A — opowiada o psotach Jacka i Placka\n2. C — współczucie dla wszystkich istot dręczonych przez bohaterów\n3. D — byli uciążliwi dla całego otoczenia\n4. A — byli bliźniakami\n5. D — rozmiarów zamieszania\n6. A — przedstawia fakty\n7. B — wspomina o jego odczuciach\n8. C — dwóm wronom, które ledwo uszły z życiem\n9. A — zdziwienie i zaniepokojenie działaniami bohaterów\n10. D — ośmieszyć bohaterów\n11. A — okrutnym i karygodnym\n12. A — bezradność\n13. D — dręczony kogut ochrypł i pogubił się\n14. A — bez powodzenia udawał koguta, chociaż bardzo się starał\n15. A — zawiera stały związek wyrazów oznaczający *rozpacz*\n16. C — jest więcej liter niż głosek\n17. A — było jeszcze gorzej\n18. C — składa się z dwóch rzeczowników\n19. B — jest przymiotnikiem\n20. C — małe\n21. A — odmienia się przez przypadki\n22. C — to czasowniki\n23. A — tych\n24. D — trudne\n25. A — o podobnym znaczeniu\n26. C — zawiera porównanie\n27. D — oszalał\n28. A — mają tyle samo liter\n29. B — dotyczy bliźniaków\n30. A — więcej sylab niż wyraz *przywiązywali*\n"}, {"path": "humanistyczny/klasa-5/testy-przeszle/alfik-2022.md", "id": "hum5/alfik-2022", "kind": "przeszly", "short": "Alfik 2022", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Alfik 2022\n\n<div class=\"test\" data-minuty=\"45\" data-start=\"30\"><\/div>\n\n**Oryginalny arkusz** XXVI edycji konkursu Alfik Humanistyczny, klasa 5 szkoły podstawowej, grudzień 2022.\nŹródło: [arkusz PDF](https://jersz.pl/wp-content/uploads/2022/12/5-1.pdf) i [klucz odpowiedzi](https://jersz.pl/wp-content/uploads/2024/12/AH_2022_klucz.pdf) na stronie organizatora, jersz.pl.\n30 pytań, 45 minut. Na start masz 30 pkt, za błędną odpowiedź tracisz ¼ punktów pytania.\nOdpowiedź E znaczy: żadna z odpowiedzi A–D nie jest poprawna. Wyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n## Tekst\n\n**Kornel Makuszyński, _Awantura o Basię_**\n\n> Człowiek-upiór był zasadniczo człowiekiem nieszczęśliwym, a na dodatek aktorem w teatrze. Nic mu się w życiu nie udawało, co go nastroiło wojowniczo wobec całego świata, jak gdyby cały świat był temu winien. Dlatego stroił takie okropne miny, aby przerazić Europę i Amerykę. Całe szczęście, że ani Europa, ani Ameryka nie wiedziały o tym, że ściągnęły na siebie niechęć tego męża. W teatrze też mu się nie wiodło; nieforemna jego postać nie nadawała się do ról znakomitych bohaterów, odznaczających się zawsze w teatrze wspaniałością gestu i pięknością oblicza. Jedynie król Ryszard III w tragedii Szekspira ma prawo nosić garb i chromać na jedną nogę i w tej roli pan Walicki, gdyż takie było jego miano, mógłby odnieść zwycięstwo, cokolwiek postać swoją odmieniwszy. Nigdy jednak nie dano mu jej odegrać. Dawano mu do odgrywania role małe, ale należycie krwawe; ponieważ miał w spojrzeniu śmierć, a głos wychodził z niego jak z grobu, grywał wszystkich opryszków, zbójców, morderców i innych przeraźliwców. Wiadomo było powszechnie, że skoro Walicki ukaże się na scenie, musi się w sztuce zdarzyć nieszczęście i że będzie miał na rozkładzie dwa lub trzy trupy. Słodkim i tajemnym jego marzeniem było odegranie postaci szlachetnej, nadobnie mówiącej wierszami, ale nie dożył tego.\n>\n> „Czyś pan zmysły postradał? – mówiono mu.\n>\n> – Z tą diabelską gębą chce pan grać anioła?”\n>\n> Pan Walicki jęczał głucho i wychodził na scenę ze sztyletem lub trucizną, którą komuś wsypywał do napoju.\n\n## Pytania za 3 punkty\n\n1. Powyższy tekst należy do: *(3 pkt)*\n   - A) dramatu\n   - B) poezji\n   - C) literatury pięknej\n   - D) publicystyki\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — literatury pięknej<br>To fragment powieści, czyli dzieło literackie z wymyśloną historią — literatura piękna. Pułapka A: tekst opowiada o aktorze i teatrze, ale sam nie jest dramatem — ma narratora i jest pisany prozą.<\/details><br>\n2. Osobą mówiącą jest: *(3 pkt)*\n   - A) narrator pierwszoosobowy\n   - B) narrator znający również myśli bohatera\n   - C) narrator posługujący się wyłącznie obserwacją\n   - D) pan Walicki\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — narrator znający również myśli bohatera<br>Narrator wie, jakie było „słodkie i tajemne” marzenie Walickiego — a tajemnicy nie da się zobaczyć z zewnątrz. Mówi o bohaterze w 3. osobie, więc A i D odpadają.<\/details><br>\n3. Pan Walicki specjalizuje się w grywaniu: *(3 pkt)*\n   - A) czarnych charakterów\n   - B) postaci komicznych\n   - C) kochanków\n   - D) głównych ról\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — czarnych charakterów<br>„Grywał wszystkich opryszków, zbójców, morderców i innych przeraźliwców” — to czarne charaktery, czyli złe postacie. Pułapka D: dawano mu „role małe”.<\/details><br>\n4. Kariera pana Walickiego: *(3 pkt)*\n   - A) pełna była sukcesów\n   - B) była godna podziwu\n   - C) osładzała mu życiowe porażki\n   - D) nie była czymś imponującym\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — nie była czymś imponującym<br>„W teatrze też mu się nie wiodło”, grał tylko „role małe”, a o roli marzeń „nie dożył”. Pułapka C: teatr nie osładzał mu porażek — był kolejną z nich („też”).<\/details><br>\n5. Bohatera cechuje: *(3 pkt)*\n   - A) optymizm\n   - B) znakomita prezencja\n   - C) poczucie niespełnienia\n   - D) szeroki wachlarz możliwości\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — poczucie niespełnienia<br>Walicki był „człowiekiem nieszczęśliwym”, „nic mu się w życiu nie udawało”, a jego marzenie się nie spełniło. Pułapka B: prezencja to wygląd, a on miał „nieforemną postać” i „diabelską gębę”.<\/details><br>\n6. Pan Walicki był stworzony do grywania: *(3 pkt)*\n   - A) skomplikowanych ról\n   - B) ról charakterystycznych\n   - C) dawnych bohaterów\n   - D) ludzi szlachetnych\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — ról charakterystycznych<br>Rola charakterystyczna to postać o wyrazistym, często dziwnym wyglądzie i zachowaniu — jak garbaty Ryszard III albo groźny zbójca. Walicki pasował do nich swoją „nieforemną postacią” i grobowym głosem. Pułapka D: postać szlachetną chciał zagrać, ale do niej nie pasował.<\/details><br>\n7. Zdanie ***Nigdy jednak nie dano mu jej*** (roli) ***odegrać***: *(3 pkt)*\n   - A) odnosi się do roli w jednej ze sztuk Szekspira\n   - B) informuje o decyzji bohatera\n   - C) odnosi się do roli drugoplanowej\n   - D) informuje o roli w komedii\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — odnosi się do roli w jednej ze sztuk Szekspira<br>Zdanie wcześniej jest mowa o królu Ryszardzie III „w tragedii Szekspira” — to tej roli Walickiemu nie dano zagrać. To była decyzja innych („nie dano mu”), nie jego (B), a tragedia to nie komedia (D).<\/details><br>\n8. Postacie odznaczające się ***wspaniałością gestu i pięknością oblicza***: *(3 pkt)*\n   - A) to szlachetni bohaterowie\n   - B) to role dla nieutalentowanych aktorów\n   - C) to role, które pan Walicki odrzuca\n   - D) to role we wspomnianej sztuce Szekspira\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — to szlachetni bohaterowie<br>Tekst mówi o „rolach znakomitych bohaterów” — pięknych i wspaniałych, czyli szlachetnych. Pułapka C: Walicki ich nie odrzuca, tylko nie dostaje, bo „nie nadaje się” do nich jego postać.<\/details><br>\n9. Z tekstu wynika, że król Ryszard III: *(3 pkt)*\n   - A) imponuje urodą\n   - B) jest rolą idealną dla pana Walickiego\n   - C) jest postacią szlachetną\n   - D) to w istocie mała rola\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — jest rolą idealną dla pana Walickiego<br>Ryszard III „ma prawo nosić garb i chromać”, więc wygląd Walickiego by tu pasował — „w tej roli pan Walicki mógłby odnieść zwycięstwo”. Pułapka A: z garbem i kulejący król nie imponuje urodą.<\/details><br>\n10. Pan Walicki marzy o: *(3 pkt)*\n    - A) pełnym wykorzystaniu swoich warunków zewnętrznych\n    - B) rolach postaci dwuznacznych\n    - C) zmianie charakteru grywanych ról\n    - D) uznaniu krytyki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — zmianie charakteru grywanych ról<br>„Słodkim i tajemnym jego marzeniem było odegranie postaci szlachetnej” — zamiast zbójców i morderców chciał zagrać kogoś dobrego.<\/details><br>\n\n## Pytania za 4 punkty\n\n11. Głos pana Walickiego ***wychodził z niego jak z grobu*** czyli: *(4 pkt)*\n    - A) był donośny\n    - B) przerażał\n    - C) zadziwiał\n    - D) miał piękną barwę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — przerażał<br>Grób kojarzy się ze śmiercią. Głos „jak z grobu” jest głuchy, ponury i straszny — taki, jaki pasował do ról morderców. Pułapka A: grobowy głos nie musi być głośny.<\/details><br>\n12. Z tekstu można wywnioskować, że pan Walicki: *(4 pkt)*\n    - A) czuje sympatię do granych przez siebie postaci\n    - B) traktuje swój zawód jak powołanie\n    - C) nie przykłada się do swoich ról\n    - D) nie lubi postaci, które odgrywa\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — nie lubi postaci, które odgrywa<br>Walicki marzy o roli szlachetnej, a słysząc odmowę, „jęczał głucho i wychodził na scenę ze sztyletem lub trucizną” — gra zbójców, bo musi, a nie dlatego, że ich lubi.<\/details><br>\n13. Sformułowanie ***Czyś pan zmysły postradał?*** oznacza: *(4 pkt)*\n    - A) zachwyt\n    - B) odmowę\n    - C) rozbawienie\n    - D) poparcie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — odmowę<br>Tak odpowiadano Walickiemu, gdy chciał zagrać szlachetną postać: „Z tą diabelską gębą chce pan grać anioła?”. „Postradać zmysły” to oszaleć — mówiono mu, że jego pomysł jest szalony, czyli odmawiano.<\/details><br>\n14. Osoba mówiąca współczuje bohaterowi, ale: *(4 pkt)*\n    - A) nie rozumie jego pragnień\n    - B) jednocześnie potępia jego wybujałą ambicję\n    - C) traktuje go z przymrużeniem oka\n    - D) jednocześnie go nie lubi\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — traktuje go z przymrużeniem oka<br>Narrator pisze z humorem: Walicki stroił miny, „aby przerazić Europę i Amerykę”, a w każdej sztuce miał „na rozkładzie dwa lub trzy trupy”. Patrzy na niego z życzliwym uśmiechem, a nie z potępieniem czy niechęcią.<\/details><br>\n15. Sformułowanie ***Słodkim i tajemnym jego marzeniem było*** świadczy o tym, że: *(4 pkt)*\n    - A) osoba mówiąca wie to, co wiedzą wszyscy\n    - B) mówiący zna myśli bohatera\n    - C) mówiący zna przyszłość\n    - D) mówiący drwi z bohatera\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — mówiący zna myśli bohatera<br>Marzenie było „tajemne”, czyli nikt o nim nie wiedział — a narrator je zna. Wie więc, co bohater myśli. Pułapka A: skoro tajemne, to nie wiedzieli o nim wszyscy.<\/details><br>\n16. W wypowiedzeniu ***był (…) aktorem w teatrze***: *(4 pkt)*\n    - A) są dwa rzeczowniki\n    - B) wszystkie wyrazy należą do odmiennych części mowy\n    - C) jest rzeczownik w dopełniaczu\n    - D) nie ma czasownika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — są dwa rzeczowniki<br>Rzeczowniki to *aktorem* (narzędnik) i *teatrze* (miejscownik), więc C odpada. *Był* to czasownik, a *w* to przyimek — część mowy nieodmienna, więc B też odpada.<\/details><br>\n17. Wyrazy ***zasadniczo*** oraz ***nieszczęśliwym***: *(4 pkt)*\n    - A) to dwa przymiotniki\n    - B) nie mają tyle samo sylab\n    - C) to przysłówek i przymiotnik\n    - D) mają tyle samo liter co głosek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — to przysłówek i przymiotnik<br>*Zasadniczo* odpowiada na pytanie jak? — to przysłówek. *Nieszczęśliwym* odpowiada na pytanie jakim? — to przymiotnik. Oba mają po 4 sylaby (za-sad-ni-czo, nie-szczę-śli-wym), a dwuznaki *cz*, *sz* sprawiają, że liter jest więcej niż głosek.<\/details><br>\n18. Wyraz ***nic***: *(4 pkt)*\n    - A) ma dwie sylaby\n    - B) ma dwie samogłoski\n    - C) jest jednosylabowy\n    - D) nie odmienia się przez przypadki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest jednosylabowy<br>W *nic* jest jedna samogłoska — i, więc jedna sylaba. Pułapka D: *nic* się odmienia: niczego, niczemu, niczym.<\/details><br>\n19. W wypowiedzeniu ***W teatrze też mu się nie wiodło***: *(4 pkt)*\n    - A) nie ma orzeczenia\n    - B) nie ma czasownika\n    - C) występuje jeden rzeczownik\n    - D) nie ma wyrazów jednosylabowych\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — występuje jeden rzeczownik<br>Jedyny rzeczownik to *teatrze*. *Nie wiodło się* to czasownik w funkcji orzeczenia, a wyrazy *w*, *też*, *mu*, *się*, *nie* są jednosylabowe.<\/details><br>\n20. Rzeczownikiem jest wyraz: *(4 pkt)*\n    - A) odnieść\n    - B) niechęć\n    - C) temu\n    - D) całego\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — niechęć<br>*Niechęć* nazywa uczucie i odpowiada na pytanie co? — to rzeczownik. *Odnieść* to czasownik (bezokolicznik), *temu* — zaimek, *całego* — przymiotnik.<\/details><br>\n\n## Pytania za 5 punktów\n\n21. Podkreślony wyraz w sformułowaniu ***Dawano mu do odgrywania role <u>małe<\/u>*** jest: *(5 pkt)*\n    - A) dopełnieniem\n    - B) okolicznikiem\n    - C) przydawką\n    - D) podmiotem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — przydawką<br>Przydawka określa rzeczownik i odpowiada na pytania jaki? który? czyj? — role (jakie?) *małe*. Pułapka A: dopełnieniem jest *role* (dawano co?), a nie *małe*.<\/details><br>\n22. Podkreślony wyraz w zdaniu ***nieforemna jego <u>postać<\/u> nie nadawała się do ról znakomitych bohaterów***: *(5 pkt)*\n    - A) to podmiot gramatyczny\n    - B) jest rzeczownikiem w formie dopełniacza\n    - C) jest dopełnieniem\n    - D) to podmiot logiczny\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — to podmiot gramatyczny<br>Kto? co? nie nadawała się? — *postać*. To podmiot w mianowniku, czyli zwykły podmiot gramatyczny, z którym orzeczenie zgadza się formą (postać nadawała się).<\/details><br>\n23. Wyraz ***jego***: *(5 pkt)*\n    - A) nie odmienia się przez przypadki\n    - B) jest przyimkiem\n    - C) jest zaimkiem\n    - D) ma więcej samogłosek niż spółgłosek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest zaimkiem<br>Zaimek zastępuje inną część mowy: *jego* postać = postać Walickiego. To forma zaimka *on* (on, jego, jemu), więc się odmienia. Samogłoski e, o i spółgłoski j, g — po dwie.<\/details><br>\n24. Wyrazy ***ról*** i ***bohaterów***: *(5 pkt)*\n    - A) są w formie dopełniacza\n    - B) nie mają liczby pojedynczej\n    - C) są w różnych przypadkach\n    - D) w mianowniku l. poj. mają tę samą końcówkę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — są w formie dopełniacza<br>Nie nadawała się do (czego?) ról (kogo?) bohaterów — oba w dopełniaczu liczby mnogiej. Liczba pojedyncza istnieje: rola, bohater — i ma różne końcówki (-a i końcówka zerowa).<\/details><br>\n25. Podkreślony wyraz w zdaniu ***<u>Dawano<\/u> mu***: *(5 pkt)*\n    - A) jest czasownikiem w formie osobowej\n    - B) jest czasownikiem w formie bezokolicznika\n    - C) jest czasownikiem w formie nieosobowej\n    - D) nie jest czasownikiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest czasownikiem w formie nieosobowej<br>Formy na *-no* i *-to* (dawano, mówiono, zrobiono) to nieosobowe formy czasownika — nie wiadomo, kto dawał. Bezokolicznik to „dawać”.<\/details><br>\n26. Przysłówkiem jest wyraz: *(5 pkt)*\n    - A) głucho\n    - B) prawo\n    - C) wiodło\n    - D) udawało\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — głucho<br>Przysłówek określa czasownik i odpowiada na pytanie jak? — jęczał (jak?) *głucho*. Pułapka B: *prawo* („mieć prawo”) to rzeczownik. *Wiodło* i *udawało* to czasowniki.<\/details><br>\n27. W wypowiedzeniu ***<u>stroił<\/u> okropne miny*** podkreślony wyraz można zastąpić wyrazem: *(5 pkt)*\n    - A) przybierał\n    - B) ubierał\n    - C) zakładał\n    - D) robił\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — robił<br>„Stroić miny” to związek frazeologiczny znaczący „robić miny”, wykrzywiać twarz. Pułapka B: „stroić” kojarzy się ze strojem, ale tu nie chodzi o ubieranie. Uwaga: „przybierał okropne miny” też brzmi sensownie, ale organizator uznał tylko D.<\/details><br>\n28. Wyrazy: ***opryszków, zbójców, morderców*** mają formę: *(5 pkt)*\n    - A) miejscownika\n    - B) biernika\n    - C) dopełniacza\n    - D) liczby pojedynczej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — dopełniacza<br>Opryszków, zbójców, morderców to forma dopełniacza liczby mnogiej (nie ma kogo? czego? — opryszków). Uwaga: w tekście czytamy „grywał (kogo? co?) opryszków, zbójców, morderców”, czyli wyrazy te pełnią rolę biernika; u rzeczowników męskoosobowych biernik liczby mnogiej brzmi tak samo jak dopełniacz, więc B też da się obronić. Organizator uznał C.<\/details><br>\n29. Do nieodmiennej części mowy należy wyraz: *(5 pkt)*\n    - A) ukaże się\n    - B) wojowniczo\n    - C) szczęście\n    - D) odegrać\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — wojowniczo<br>*Wojowniczo* to przysłówek (jak?), a przysłówki się nie odmieniają. *Ukaże się* i *odegrać* to czasowniki, a *szczęście* to rzeczownik — części mowy odmienne. Pułapka D: bezokolicznik się nie zmienia, ale czasownik jako część mowy jest odmienny.<\/details><br>\n30. Zdaniem nie jest wypowiedzenie: *(5 pkt)*\n    - A) mógłby odnieść zwycięstwo\n    - B) jęczał głucho\n    - C) nadobnie mówiącej wierszami\n    - D) wychodził na scenę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — nadobnie mówiącej wierszami<br>Zdanie musi mieć czasownik w formie osobowej (orzeczenie). W A, B i D są: *mógłby odnieść*, *jęczał*, *wychodził*. W C *mówiącej* to imiesłów, a nie osobowa forma czasownika, więc to nie jest zdanie.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. C — literatury pięknej\n2. B — narrator znający również myśli bohatera\n3. A — czarnych charakterów\n4. D — nie była czymś imponującym\n5. C — poczucie niespełnienia\n6. B — ról charakterystycznych\n7. A — odnosi się do roli w jednej ze sztuk Szekspira\n8. A — to szlachetni bohaterowie\n9. B — jest rolą idealną dla pana Walickiego\n10. C — zmianie charakteru grywanych ról\n11. B — przerażał\n12. D — nie lubi postaci, które odgrywa\n13. B — odmowę\n14. C — traktuje go z przymrużeniem oka\n15. B — mówiący zna myśli bohatera\n16. A — są dwa rzeczowniki\n17. C — to przysłówek i przymiotnik\n18. C — jest jednosylabowy\n19. C — występuje jeden rzeczownik\n20. B — niechęć\n21. C — przydawką\n22. A — to podmiot gramatyczny\n23. C — jest zaimkiem\n24. A — są w formie dopełniacza\n25. C — jest czasownikiem w formie nieosobowej\n26. A — głucho\n27. D — robił\n28. C — dopełniacza\n29. B — wojowniczo\n30. C — nadobnie mówiącej wierszami\n"}, {"path": "humanistyczny/klasa-5/testy-przeszle/alfik-2021.md", "id": "hum5/alfik-2021", "kind": "przeszly", "short": "Alfik 2021", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Alfik 2021\n\n<div class=\"test\" data-minuty=\"45\" data-start=\"30\"><\/div>\n\n**Oryginalny arkusz** XXV edycji konkursu Alfik Humanistyczny, klasa 5 szkoły podstawowej, grudzień 2021.\nŹródło: [arkusz PDF](https://jersz.pl/wp-content/uploads/2020/08/Alfik-Humanistyczny-5-SP-2021-2022.pdf) i [klucz odpowiedzi](https://jersz.pl/wp-content/uploads/2020/08/Alfik-Humanistyczny-2021-2022-klucz.pdf) na stronie organizatora, jersz.pl.\n30 pytań, 45 minut. Na start masz 30 pkt, za błędną odpowiedź tracisz ¼ punktów pytania.\nOdpowiedź E znaczy: żadna z odpowiedzi A–D nie jest poprawna. Wyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n## Tekst\n\n**Adam Mickiewicz, _Lis i kozieł_**\n\n> Już był w ogródku, już witał się z gąską:<br>\n> Kiedy skok robiąc wpadł w beczkę wkopaną,<br>\n> Gdzie wodę zbierano;<br>\n> Ani pomyśleć o wyskoczeniu.<br>\n> Chociaż wody nie było i nawet nie grząsko:<br>\n> Studnia na półczwarta łokcia,<br>\n> Za wysokie progi<br>\n> Na lisie nogi;<br>\n> Zrąb tak gładki, że nigdzie nie wścibić paznokcia.<br>\n> Postaw się teraz w tego lisa położeniu!<br>\n> Inny zwierz pewno załamałby łapy<br>\n> I bił się w chrapy,<br>\n> Wołając gromu, ażeby go dobił:<br>\n> Nasz lis takich głupstw nie robił;<br>\n> Wie, że rozpaczać jest to zło przydawać do zła.<br>\n> Za czym maca wkoło zębem,<br>\n> A patrzy w górę; jakoż wkrótce ujrzał kozła,<br>\n> Stojącego tuż nad zrębem<br>\n> I patrzącego z ciekawością w studnię.<br>\n> Lis wnet spuścił pysk na dno, udając, że pije;<br>\n> Cmoka mocno, głośno chłepce<br>\n> I tak sam do siebie szepce:<br>\n> „Oto mi woda, takiej nie piłem, jak żyję!<br>\n> Smak lodu, a czysta cudnie.<br>\n> Chce mi się całemu spłukać,<br>\n> Ale mi ją szkoda zbrukać,<br>\n> Szkoda!<br>\n> Bo co też to za woda!”<br>\n> Kozieł, który tam właśnie przyszedł wody szukać:<br>\n> „Ej! – krzyknął z góry – ej, ty ryży kudła,<br>\n> Wara od źródła!”<br>\n> I hop w dół. Lis mu na kark, a z karku na rogi,<br>\n> A z rogów na zrąb i w nogi.\n\n## Pytania za 3 punkty\n\n1. Powyższy tekst: *(3 pkt)*\n   - A) jest pisany prozą\n   - B) nie zawiera rymów\n   - C) przedstawia wydarzenia prawdziwe\n   - D) jest utworem poetyckim\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — jest utworem poetyckim<br>Tekst jest zapisany wersami i ma rymy (progi – nogi, łokcia – paznokcia, pije – żyję). To bajka, czyli utwór poetycki, a gadające zwierzęta nie są wydarzeniem prawdziwym.<\/details><br>\n2. Tytuł przedstawionego utworu: *(3 pkt)*\n   - A) zapowiada wydarzenie\n   - B) wskazuje na bohaterów\n   - C) określa czas akcji\n   - D) wskazuje na miejsce akcji\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — wskazuje na bohaterów<br>„Lis i kozieł” to dwaj bohaterowie bajki. Tytuł nie mówi nic o tym, co się stanie, kiedy ani gdzie.<\/details><br>\n3. Historia w przywołanym tekście: *(3 pkt)*\n   - A) dotyczy jednego wydarzenia\n   - B) opowiada o wydarzeniach rozgrywających się w różnych miejscach\n   - C) dzieje się w ciągu wielu dni\n   - D) składa się z wielu wydarzeń rozciągniętych w czasie\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — dotyczy jednego wydarzenia<br>Cała bajka opowiada jedną przygodę: lis wpada do studni i wydostaje się z niej dzięki kozłowi. Wszystko dzieje się w jednym miejscu i w krótkim czasie.<\/details><br>\n4. Opowiadający tę historię: *(3 pkt)*\n   - A) bierze udział w wydarzeniach\n   - B) zna przyszłość\n   - C) nie komentuje działań bohaterów\n   - D) nie bierze udziału w wydarzeniach\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — nie bierze udziału w wydarzeniach<br>Narrator mówi o lisie i kozle w 3. osobie, sam nic nie robi. Pułapka C: komentuje, i to nawet zwraca się do czytelnika — „Postaw się teraz w tego lisa położeniu!”, „Nasz lis takich głupstw nie robił”.<\/details><br>\n5. Występujące w tekście zwierzęta: *(3 pkt)*\n   - A) jedynie wyglądają jak ludzie\n   - B) w zachowaniu przypominają ludzi\n   - C) w ogóle nie przypominają ludzi\n   - D) żyją w doskonałej zgodzie\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — w zachowaniu przypominają ludzi<br>Lis myśli, udaje, mówi do siebie, a kozieł krzyczy „Wara od źródła!” — zachowują się jak ludzie, choć wyglądają jak zwierzęta. Tak jest w bajkach.<\/details><br>\n6. Stwierdzenie ***już witał się z gąską*** należy rozumieć: *(3 pkt)*\n   - A) lisowi prawie udało się upolować gęś\n   - B) lis był oczekiwanym gościem\n   - C) lis jest kulturalny\n   - D) lis nie lubi gęsi\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — lisowi prawie udało się upolować gęś<br>„Już był w ogródku, już witał się z gąską” — lis był tuż przy gęsi, ale w ostatniej chwili wpadł do beczki. Powiedzenie oznacza, że ktoś był bardzo blisko celu i mu się nie udało. Lis nie „wita się” grzecznie — chce gęś zjeść.<\/details><br>\n7. Prawdą jest, że lis: *(3 pkt)*\n   - A) wszystko przewidział\n   - B) jest niezdarny\n   - C) nie wiedział o wkopanej beczce\n   - D) umie działać jedynie na krótką metę\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — nie wiedział o wkopanej beczce<br>Lis „skok robiąc wpadł w beczkę wkopaną” — gdyby o niej wiedział, ominąłby ją. Pułapka A: skoro wpadł, to nie wszystko przewidział.<\/details><br>\n8. Położenie, w którym znalazł się lis, gdy wpadł do beczki, można nazwać: *(3 pkt)*\n   - A) wielce zabawnym\n   - B) oczekiwanym\n   - C) dyskusyjnym\n   - D) rozpaczliwym\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — rozpaczliwym<br>„Ani pomyśleć o wyskoczeniu” — ściany wysokie i gładkie, nie ma jak wyjść. Narrator mówi, że inne zwierzę „załamałoby łapy”, czyli wpadłoby w rozpacz.<\/details><br>\n9. Lis nie mógł wydostać się z beczki, gdyż: *(3 pkt)*\n   - A) słabo pływał\n   - B) zrąb nie był gładki\n   - C) było zbyt grząsko\n   - D) miała ona bardzo wysokie ściany\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — miała ona bardzo wysokie ściany<br>„Studnia na półczwarta łokcia, / Za wysokie progi / Na lisie nogi”. Pozostałe odpowiedzi przeczą tekstowi: wody nie było, nie było grząsko, a zrąb był „tak gładki, że nigdzie nie wścibić paznokcia”.<\/details><br>\n10. Określenie ***rozpaczać jest to zło przydawać do zła*** oznacza: *(3 pkt)*\n    - A) czasem dobrze jest nie posłuchać podszeptów rozumu\n    - B) w trudnym położeniu rozpacz jedynie pogarsza sprawę\n    - C) trzeba działać spontanicznie\n    - D) są w życiu sytuacje bez wyjścia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — w trudnym położeniu rozpacz jedynie pogarsza sprawę<br>„Przydawać zła do zła” to dokładać jedno nieszczęście do drugiego. Kto rozpacza, zamiast szukać wyjścia, tylko pogarsza swoją sytuację.<\/details><br>\n\n## Pytania za 4 punkty\n\n11. O lisie możemy powiedzieć, że: *(4 pkt)*\n    - A) potrafi zachować zimną krew\n    - B) jest w gorącej wodzie kąpanym\n    - C) lubi dmuchać na zimne\n    - D) lubi mącić wodę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — potrafi zachować zimną krew<br>Zachować zimną krew to nie panikować w trudnej sytuacji. Lis nie rozpacza („Nasz lis takich głupstw nie robił”), tylko spokojnie szuka wyjścia. Pułapka B: „w gorącej wodzie kąpany” to ktoś niecierpliwy, porywczy.<\/details><br>\n12. Działanie lisa można nazwać: *(4 pkt)*\n    - A) sztuczką magiczną\n    - B) wołaniem o pomoc\n    - C) fortelem\n    - D) wygłupem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — fortelem<br>Fortel to sprytny podstęp. Lis udaje, że pije wyśmienitą wodę, żeby kozieł wskoczył do studni, a potem wychodzi po jego grzbiecie i rogach.<\/details><br>\n13. Prawdą jest, że: *(4 pkt)*\n    - A) woda w beczce miała niezwykły smak\n    - B) beczka po brzegi była wypełniona wodą\n    - C) lis był zachwycony smakiem wody\n    - D) w beczce w rzeczywistości prawie nie było wody\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — w beczce w rzeczywistości prawie nie było wody<br>Narrator mówi: „Chociaż wody nie było i nawet nie grząsko”. Pułapka A i C: lis tylko udawał zachwyt nad wodą, żeby oszukać kozła.<\/details><br>\n14. Kozioł charakteryzuje się: *(4 pkt)*\n    - A) łatwowiernością\n    - B) bystrością\n    - C) przebiegłością\n    - D) zapobiegliwością\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — łatwowiernością<br>Łatwowierny to ktoś, kto łatwo wierzy w to, co słyszy. Kozieł uwierzył lisowi i bez zastanowienia skoczył do studni. Przebiegły (C) był lis, nie kozieł.<\/details><br>\n15. Zakończenie historii z perspektywy lisa można podsumować powiedzeniem: *(4 pkt)*\n    - A) na dwoje babka wróżyła\n    - B) raz tak – raz siak\n    - C) między młotem a kowadłem\n    - D) uszło mu płazem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — uszło mu płazem<br>„Uszło mu płazem” znaczy: wyszedł z tego bez szkody i bez kary. Lis wydostał się ze studni, a w niej został kozieł. Pułapka C: „między młotem a kowadłem” to ktoś w sytuacji bez wyjścia — tak było z lisem na początku, a nie na końcu.<\/details><br>\n16. Forma ***kozieł*** ma taką postać w tytule ponieważ: *(4 pkt)*\n    - A) to nazwa własna\n    - B) jest to rzeczownik nazywający dawne zwierzę\n    - C) to forma współczesna\n    - D) jest to dawna postać wyrazu *kozioł*\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — jest to dawna postać wyrazu *kozioł*<br>Mickiewicz pisał prawie 200 lat temu i używał dawnych form wyrazów. Dziś mówimy „kozioł”. To nie imię (A) ani nazwa wymarłego zwierzęcia (B).<\/details><br>\n17. W tytule mamy: *(4 pkt)*\n    - A) spójnik\n    - B) czasownik\n    - C) jeden rzeczownik\n    - D) przyimek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — spójnik<br>„Lis i kozieł” — *i* to spójnik, łączy dwa rzeczowniki. Rzeczowniki są dwa, czasownika ani przyimka brak.<\/details><br>\n18. W tytule znajduje się wyraz: *(4 pkt)*\n    - A) trzysylabowy\n    - B) dwusylabowy\n    - C) czterosylabowy\n    - D) niedający podzielić się na sylaby\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — dwusylabowy<br>Ko-zieł ma 2 sylaby (samogłoski o i e; *i* tylko zmiękcza). *Lis* i *i* mają po jednej sylabie.<\/details><br>\n19. Wyrazy ***był*** i ***witał*** są: *(4 pkt)*\n    - A) nieosobowymi formami czasownika\n    - B) czasownikami w formie bezokoliczników\n    - C) czasownikami w czasie przeszłym\n    - D) czasownikami w formie 2.os.l.poj.\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — czasownikami w czasie przeszłym<br>(On) był, (on) witał — 3. osoba liczby pojedynczej czasu przeszłego. Bezokoliczniki to „być” i „witać”, a 2. osoba to „byłeś”, „witałeś”.<\/details><br>\n20. W pierwszym wersie znajduje się: *(4 pkt)*\n    - A) porównanie\n    - B) przenośnia\n    - C) wyraz zdrobniały\n    - D) wyraz zgrubiały\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — wyraz zdrobniały<br>*Gąska* to zdrobnienie od „gęś”, a *ogródek* — od „ogród”. Zdrobnienia tworzymy przyrostkami -ek, -ka, -ko i podobnymi. Uwaga: „witał się z gąską” to też wyrażenie przenośne (por. pytanie 6.), więc można bronić odpowiedzi B, ale organizator uznał tylko C.<\/details><br>\n\n## Pytania za 5 punktów\n\n21. Podkreślony wyraz w sformułowaniu ***wodę <u>zbierano<\/u>***: *(5 pkt)*\n    - A) to czasownik w formie nieosobowej\n    - B) to czasownik w formie bezokolicznika\n    - C) to czasownik w formie liczby mnogiej\n    - D) nie jest orzeczeniem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — to czasownik w formie nieosobowej<br>Formy na *-no* i *-to* (zbierano, zrobiono, umyto) to nieosobowe formy czasownika — nie wiadomo, kto zbierał. W zdaniu pełnią funkcję orzeczenia, więc D jest fałszywe.<\/details><br>\n22. W wypowiedzeniu ***Postaw się teraz w tego lisa położeniu!***: *(5 pkt)*\n    - A) nie ma podmiotu\n    - B) występuje podmiot domyślny\n    - C) nie ma orzeczenia\n    - D) podmiotem jest wyraz *lisa*\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — występuje podmiot domyślny<br>*Postaw się* to orzeczenie w trybie rozkazującym, w 2. osobie: (ty) postaw się. Podmiotu „ty” nie ma w zdaniu, ale go się domyślamy — to podmiot domyślny. *Lisa* to przydawka (położeniu czyim?).<\/details><br>\n23. W wypowiedzeniu ***wody nie było***: *(5 pkt)*\n    - A) występuje podmiot domyślny\n    - B) podmiot nie jest wyrażony za pomocą rzeczownika\n    - C) podmiot ma formę mianownika\n    - D) podmiotem jest rzeczownik w dopełniaczu\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — podmiotem jest rzeczownik w dopełniaczu<br>Porównaj: „Woda była” (podmiot w mianowniku) i „Wody nie było”. Po zaprzeczeniu „nie było” podmiot zmienia formę na dopełniacz (kogo? czego? — wody).<\/details><br>\n24. W wyrazie ***wody***: *(5 pkt)*\n    - A) mamy jedną sylabę\n    - B) są dwie sylaby\n    - C) jest więcej sylab niż w wyrazie *było*\n    - D) jest więcej sylab niż spółgłosek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — są dwie sylaby<br>Wo-dy: samogłoski o i y, więc 2 sylaby. *By-ło* też ma 2 sylaby, a spółgłoski w *wody* są 2 (w, d) — tyle samo, co sylab.<\/details><br>\n25. Sformułowanie ***smak lodu*** składa się z: *(5 pkt)*\n    - A) dwóch rzeczowników\n    - B) rzeczownika i przymiotnika\n    - C) dwóch rzeczowników w tym samym przypadku\n    - D) dwóch rzeczowników w dopełniaczu\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — dwóch rzeczowników<br>*Smak* (mianownik) i *lodu* (dopełniacz: smak czego?) to rzeczowniki, ale w różnych przypadkach, więc C i D odpadają. Przymiotnika tu nie ma.<\/details><br>\n26. W wyrazie ***lodu*** końcówką fleksyjną (w odmianie) jest: *(5 pkt)*\n    - A) -odu\n    - B) -du\n    - C) -u\n    - D) brak końcówki (zero fleksyjne)\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — -u<br>Końcówka to część wyrazu, która zmienia się w odmianie: lod-u, lod-em, lod-zie. Stała część *lod-* to temat. Końcówkę zerową ma mianownik: lód.<\/details><br>\n27. W wypowiedzeniu ***Nasz lis takich głupstw nie robił***: *(5 pkt)*\n    - A) podmiotem jest wyraz *głupstw*\n    - B) nie ma określeń rzeczownika\n    - C) tylko jeden rzeczownik ma określenie\n    - D) podmiotem jest wyraz *lis*\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — podmiotem jest wyraz *lis*<br>Kto nie robił? — *lis*. *Głupstw* to dopełnienie (nie robił czego?). Oba rzeczowniki mają określenia: lis (czyj?) *nasz*, głupstw (jakich?) *takich*, więc B i C odpadają.<\/details><br>\n28. Wyrazem trzysylabowym jest forma: *(5 pkt)*\n    - A) patrzącego\n    - B) całemu\n    - C) cmoka\n    - D) przyszedł\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — całemu<br>Ca-łe-mu — 3 samogłoski, 3 sylaby. *Pa-trzą-ce-go* ma 4 sylaby, *cmo-ka* i *przy-szedł* po 2.<\/details><br>\n29. Sformułowanie ***w nogi*** oznacza: *(5 pkt)*\n    - A) upaść\n    - B) wyskoczyć\n    - C) uciekać\n    - D) przechytrzyć\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — uciekać<br>„Rzucić się w nogi”, „wziąć nogi za pas”, „w nogi!” — to związki frazeologiczne znaczące „uciekać”.<\/details><br>\n30. Podkreślony wyraz w zdaniu ***ale mi ją szkoda <u>zbrukać<\/u>*** można zastąpić formą: *(5 pkt)*\n    - A) zabrudzić\n    - B) wypić\n    - C) posmakować\n    - D) stracić\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — zabrudzić<br>*Zbrukać* to staranniej powiedziane „zabrudzić”, „splamić”. Lis mówi, że chciałby się wykąpać, ale szkoda mu brudzić tak czystą wodę.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. D — jest utworem poetyckim\n2. B — wskazuje na bohaterów\n3. A — dotyczy jednego wydarzenia\n4. D — nie bierze udziału w wydarzeniach\n5. B — w zachowaniu przypominają ludzi\n6. A — lisowi prawie udało się upolować gęś\n7. C — nie wiedział o wkopanej beczce\n8. D — rozpaczliwym\n9. D — miała ona bardzo wysokie ściany\n10. B — w trudnym położeniu rozpacz jedynie pogarsza sprawę\n11. A — potrafi zachować zimną krew\n12. C — fortelem\n13. D — w beczce w rzeczywistości prawie nie było wody\n14. A — łatwowiernością\n15. D — uszło mu płazem\n16. D — jest to dawna postać wyrazu *kozioł*\n17. A — spójnik\n18. B — dwusylabowy\n19. C — czasownikami w czasie przeszłym\n20. C — wyraz zdrobniały\n21. A — to czasownik w formie nieosobowej\n22. B — występuje podmiot domyślny\n23. D — podmiotem jest rzeczownik w dopełniaczu\n24. B — są dwie sylaby\n25. A — dwóch rzeczowników\n26. C — -u\n27. D — podmiotem jest wyraz *lis*\n28. B — całemu\n29. C — uciekać\n30. A — zabrudzić\n"}, {"path": "humanistyczny/klasa-5/testy-przeszle/alfik-2019.md", "id": "hum5/alfik-2019", "kind": "przeszly", "short": "Alfik 2019", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Alfik 2019\n\n<div class=\"test\" data-minuty=\"45\" data-start=\"30\"><\/div>\n\n**Oryginalny arkusz** XXIII edycji konkursu Alfik Humanistyczny, klasa 5 szkoły podstawowej, grudzień 2019.\nŹródło: [arkusz PDF](https://jersz.pl/wp-content/uploads/2020/08/AH-5-SP-2019.pdf) i [klucz odpowiedzi](https://jersz.pl/wp-content/uploads/2020/08/AH-2019-klucz.pdf) na stronie organizatora, jersz.pl.\n30 pytań, 45 minut. Na start masz 30 pkt, za błędną odpowiedź tracisz ¼ punktów pytania.\nOdpowiedź E znaczy: żadna z odpowiedzi A–D nie jest poprawna. Wyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n## Tekst\n\n**Kornel Makuszyński, _Szaleństwa Panny Ewy_ (fragment)**\n\n> Przeniosłem baczne spojrzenie z psa na panienkę, która zdołała już zapomnieć o gadaniu na temat swojego niewydarzonego kundla i z żywością muchy przeniosła się na inny temat.\n>\n> – Jak tu u pana ładnie! – rzekła, patrząc na ściany zawieszone natłokiem obrazów.\n>\n> – Tak sobie – bąknąłem.\n>\n> – Wcale nie „tak sobie”! – zawołał z przekonaniem „zadarty nos”. – Ślicznie jest u pana!\n>\n> Nagle ją coś poderwało. Zbliżyła się szybko do ściany, na której złocił się i czerwienił, i gorzał żywą purpurą obrazek malarza, który sam był płomieniem gorejącym i zdawało się, że malował płomieniem. Malarz ten od dawna już malował świty i zachody na niebie, bo od dnia jego śmierci niebo było świetniej niż zazwyczaj kolorowe i grało kolorami. Obraz nie był podpisany, panienka zaś wymówiła nazwisko, w którym drżało wzruszenie i tkliwość. Zdumiało mnie to cokolwiek.\n>\n> – Widziała pani kiedy jego obrazy?\n>\n> – Tak. Widziałam dwa, a ten jest trzeci. To był cudowny malarz!\n>\n> – Mój przyjaciel – rzekłem cicho. – Umarł młodo...\n>\n> – Ja wiem.\n>\n> – Skąd pani o tym wie?\n>\n> – O, ja wiem bardzo wiele o malarzach. Wszystko panu opowiem, ale nie tak od razu. A ten obrazek... Boże miły! Przecie to Zawidzki...\n>\n> – Tak, to Zawidzki. Ładny, prawda?\n>\n> – Śliczny, a nie ładny. Przepraszam pana... Czy pan kupił ten obraz?\n>\n> – Niestety nie. Dostałem go od malarza. „Zadarty nos” spojrzał na mnie jak gdyby z wyrzutem i rzekł niby do siebie:\n>\n> – Potem się ludzie dziwią, że malarze chodzą bez butów! Niech się pan nie gniewa – dodała głośniej – ja właściwie nie do pana to mówię. Malarz i literat to jedna rodzina, więc sobie robią podarunki, chociaż żaden malarz jeszcze w życiu swoim nie przeczytał książki, którą dostał od literata. Czasem nią tylko pali w piecu albo rzuci za psem...\n\n## Pytania za 3 punkty\n\n1. Przedstawiony fragment utworu pochodzi z: *(3 pkt)*\n   - A) utworu poetyckiego\n   - B) tekstu dramatu\n   - C) powieści\n   - D) reportażu\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — powieści<br>Tekst jest napisany prozą, ma narratora („Przeniosłem baczne spojrzenie”) i wymyślonych bohaterów. Pułapka: dużo tu rozmów, ale w dramacie nie ma narratora, tylko didaskalia i imiona przed kwestiami.<\/details><br>\n2. Formą dominującą w przywołanym tekście jest: *(3 pkt)*\n   - A) dialog\n   - B) opis\n   - C) streszczenie\n   - D) sprawozdanie\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — dialog<br>Większą część tekstu zajmuje rozmowa bohatera z panienką — kolejne wypowiedzi zaczynają się od myślnika. Opis obrazu to tylko jeden akapit.<\/details><br>\n3. Miejscem akcji jest: *(3 pkt)*\n   - A) muzeum\n   - B) mieszkanie bohatera\n   - C) galeria\n   - D) pracownia malarza\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — mieszkanie bohatera<br>Panienka mówi: „Jak tu u pana ładnie!” i „Ślicznie jest u pana!” — jest w gościach u narratora. Pułapka: obrazów jest dużo, ale narrator nie jest malarzem, tylko dostaje obrazy w prezencie.<\/details><br>\n4. Z tekstu można wywnioskować, że bohater jest: *(3 pkt)*\n   - A) młodzieńcem\n   - B) malarzem\n   - C) człowiekiem niebywałym w kręgach artystycznych\n   - D) pisarzem\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — pisarzem<br>Panienka mówi, że malarz i literat robią sobie podarunki, i zaraz dodaje „ja właściwie nie do pana to mówię” — czyli to bohater jest literatem, który dostał obraz od malarza. Literat to pisarz. Pułapka: przyjaźnił się z malarzem, ale sam nie maluje.<\/details><br>\n5. Bohater tekstu jest jednocześnie: *(3 pkt)*\n   - A) podmiotem lirycznym\n   - B) narratorem\n   - C) narratorem wszechwiedzącym\n   - D) gościem w miejscu akcji\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — narratorem<br>Bohater opowiada w 1. osobie: „Przeniosłem”, „bąknąłem”, „rzekłem”. Nie jest wszechwiedzący — dziwi się, że panienka zna malarza („Zdumiało mnie to cokolwiek”). Gościem jest panienka, a nie on.<\/details><br>\n6. Dziewczynie najbardziej spodobały się: *(3 pkt)*\n   - A) meble\n   - B) dywany\n   - C) książki\n   - D) obrazy wiszące na ścianach\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — obrazy wiszące na ścianach<br>Mówi „Jak tu u pana ładnie!”, „patrząc na ściany zawieszone natłokiem obrazów”, a potem podbiega do obrazu Zawidzkiego.<\/details><br>\n7. Z tekstu możemy wywnioskować, że bohater: *(3 pkt)*\n   - A) był w przyjacielskich stosunkach z wieloma malarzami\n   - B) nie przywiązuje wagi do wiszących na ścianach obrazów\n   - C) ma krytyczny stosunek do obrazów\n   - D) nie lubi malarzy\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — był w przyjacielskich stosunkach z wieloma malarzami<br>Ściany są „zawieszone natłokiem obrazów”, Zawidzki był jego przyjacielem i podarował mu obraz, a panienka mówi, że malarze i literaci „robią sobie podarunki”. Z tego wnioskujemy, że obrazy dostał od wielu zaprzyjaźnionych malarzy. B, C i D przeczą temu, jak ciepło mówi o zmarłym przyjacielu.<\/details><br>\n8. Dziewczyna zwróciła szczególną uwagę na obraz malarza, który: *(3 pkt)*\n   - A) już umarł\n   - B) maluje bardzo nowocześnie\n   - C) jest raczej pozbawiony talentu\n   - D) jest debiutantem\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — już umarł<br>W tekście: „od dnia jego śmierci niebo było świetniej niż zazwyczaj kolorowe” i „Umarł młodo...”.<\/details><br>\n9. Z tekstu wynika, że dziewczyna: *(3 pkt)*\n   - A) nigdy nie widziała *na żywo* obrazu\n   - B) nie zna się na sztuce\n   - C) rozpoznała twórcę obrazu, ponieważ znała jego inne prace\n   - D) zna obrazy, ale nie wie, kto jest ich autorem\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — rozpoznała twórcę obrazu, ponieważ znała jego inne prace<br>Obraz „nie był podpisany”, a ona wymówiła nazwisko malarza i powiedziała: „Widziałam dwa, a ten jest trzeci”. Pułapka D: wiedziała, kto jest autorem — sama go nazwała.<\/details><br>\n10. W ocenie panienki: *(3 pkt)*\n    - A) malarz rozpoznanego obrazu był utalentowany\n    - B) obraz jest mały, ale ładny\n    - C) artysta powinien jeszcze popracować nad sobą\n    - D) obrazy powinny być przede wszystkim kolorowe\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — malarz rozpoznanego obrazu był utalentowany<br>Panienka mówi: „To był cudowny malarz!” i że obraz jest „śliczny, a nie ładny”. Pułapka B: nic nie mówi o wielkości obrazu, a „ładny” poprawia na „śliczny”.<\/details><br>\n\n## Pytania za 4 punkty\n\n11. Opinia, że artysta ***malował płomieniem***: *(4 pkt)*\n    - A) jest żartem\n    - B) oznacza, że artysta przedstawiał sceny walki\n    - C) ma charakter pozytywny\n    - D) jest sądem krytycznym\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — ma charakter pozytywny<br>To pochwała: obrazy „złociły się, czerwieniły i gorzały żywą purpurą”, a malarz malował z ogniem, z pasją. Pułapka B: płomień nie oznacza tu walki, tylko żywe kolory i zapał.<\/details><br>\n12. Reakcja dziewczyny na widok obrazu Zawidzkiego wskazuje, że: *(4 pkt)*\n    - A) obraz ten jej się podoba\n    - B) już widziała ten obraz\n    - C) nie ceni sobie akurat tego malarza\n    - D) obraz kiedyś należał do jej rodziny\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — obraz ten jej się podoba<br>Woła „Boże miły!” i mówi, że obraz jest „śliczny, a nie ładny”. Pułapka B: widziała dwa inne obrazy tego malarza, a ten jest „trzeci”, czyli nowy dla niej.<\/details><br>\n13. Malarzy w opinii bohaterki cechuje: *(4 pkt)*\n    - A) pazerność\n    - B) samouwielbienie\n    - C) brak praktycznego myślenia\n    - D) rozwaga\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — brak praktycznego myślenia<br>„Potem się ludzie dziwią, że malarze chodzą bez butów!” — malarze rozdają obrazy zamiast je sprzedawać, więc nie mają pieniędzy. To przeciwieństwo pazerności i rozwagi.<\/details><br>\n14. Literatów i malarzy w opinii bohaterki różni: *(4 pkt)*\n    - A) uprawiana dyscyplina sztuki\n    - B) warsztat artystyczny\n    - C) stosunek do sławy\n    - D) sposób traktowania otrzymanych dzieł\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — sposób traktowania otrzymanych dzieł<br>Literat wiesza obrazy od malarza na ścianach, a malarz książki od literata nie czyta — „czasem nią tylko pali w piecu albo rzuci za psem”. Pułapka A: to, że jeden maluje, a drugi pisze, jest oczywiste, ale bohaterka mówi właśnie o podarunkach.<\/details><br>\n15. W przedstawionym fragmencie nie znajdziemy informacji: *(4 pkt)*\n    - A) o tym, skąd dziewczyna tyle wie o malarzach\n    - B) jak znalazł się obraz Zawidzkiego w posiadaniu bohatera\n    - C) o emocjach dziewczyny\n    - D) dokładnej ilości obrazów w pomieszczeniu\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Tekstu brakuje aż dwóch informacji: skąd dziewczyna tyle wie („Wszystko panu opowiem, ale nie tak od razu”) i ile dokładnie jest obrazów (jest tylko „natłok obrazów”). Skoro pasują dwie odpowiedzi, a ma być jedna, zaznaczamy E. B i C w tekście są: „Dostałem go od malarza”, „drżało wzruszenie i tkliwość”.<\/details><br>\n16. Podkreślony wyraz w sformułowaniu ***<u>baczne<\/u> spojrzenie*** oznacza: *(4 pkt)*\n    - A) nieufne\n    - B) uważne\n    - C) przelotne\n    - D) zalotne\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — uważne<br>*Baczny* znaczy uważny, czujny (pokrewne: baczność, zwracać baczną uwagę). Pułapka C: przelotne spojrzenie jest krótkie i nieuważne — to prawie przeciwieństwo.<\/details><br>\n17. (…) ***z żywością muchy przeniosła się na inny temat*** czyli: *(4 pkt)*\n    - A) niezręcznie wspomniała o czymś\n    - B) mówiła wolno\n    - C) krążyła wokół jakiejś kwestii\n    - D) szybko zmieniła temat\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — szybko zmieniła temat<br>Mucha jest żywa i szybka, przelatuje z miejsca na miejsce. „Przenieść się na inny temat” to zmienić temat rozmowy, a „z żywością muchy” — bardzo szybko.<\/details><br>\n18. Podkreślony wyraz we fragmencie ***– Tak sobie – <u>bąknąłem<\/u>*** oznacza: *(4 pkt)*\n    - A) zdecydowanie zabrać głos\n    - B) zaznaczyć swoją obecność\n    - C) powiedzieć coś od niechcenia\n    - D) wyrazić niezadowolenie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — powiedzieć coś od niechcenia<br>*Bąknąć* to powiedzieć coś cicho, niewyraźnie, mimochodem. Pułapka A: zdecydowanie zabrać głos to przeciwieństwo bąknięcia.<\/details><br>\n19. W zdaniu ***Zbliżyła się szybko do ściany***: *(4 pkt)*\n    - A) występuje przysłówek\n    - B) nie ma czasownika w formie osobowej\n    - C) nie ma przyimka\n    - D) jest przymiotnik w stopniu równym\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — występuje przysłówek<br>*Szybko* to przysłówek — określa czasownik i odpowiada na pytanie jak? *Zbliżyła się* to forma osobowa, *do* to przyimek, a przymiotnika tu nie ma.<\/details><br>\n20. Wyraz ***ściany*** w zdaniu z pyt. 19.: *(4 pkt)*\n    - A) w tym zdaniu ma formę liczby mnogiej\n    - B) jest rzeczownikiem w formie dopełniacza\n    - C) ma tyle samo liter co głosek\n    - D) jest jednosylabowy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest rzeczownikiem w formie dopełniacza<br>Zbliżyła się do (czego?) ściany — dopełniacz liczby pojedynczej. Pułapka A: „ściany” może być liczbą mnogą (te ściany), ale tu chodzi o jedną ścianę. Wyraz ma 2 sylaby i 6 liter, a 5 głosek (*ci* to jedna głoska).<\/details><br>\n\n## Pytania za 5 punktów\n\n21. Czasownik ***zbliżyła się*** ma formę: *(5 pkt)*\n    - A) nieosobową\n    - B) bezokolicznika\n    - C) 3. os. l. poj. cz. przeszłego\n    - D) 2 os. l. poj.\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — 3. os. l. poj. cz. przeszłego<br>(Ona) zbliżyła się — 3. osoba, liczba pojedyncza, czas przeszły. Bezokolicznik to „zbliżyć się”, a 2. osoba — „(ty) zbliżyłaś się”.<\/details><br>\n22. W zdaniu ***Nagle ją coś poderwało***: *(5 pkt)*\n    - A) nie ma podmiotu\n    - B) jest podmiot domyślny\n    - C) podmiotem jest wyraz *nagle*\n    - D) podmiotem jest wyraz *coś*\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — podmiotem jest wyraz *coś*<br>Podmiot odpowiada na pytanie kto? co? wykonuje czynność: co poderwało? — *coś*. *Ją* to dopełnienie (poderwało kogo?), a *nagle* to okolicznik (jak?).<\/details><br>\n23. Zaznaczone określenie ***malarza, który sam był <u>płomieniem gorejącym<\/u>***: *(5 pkt)*\n    - A) nie zawiera epitetu\n    - B) jest porównaniem\n    - C) ma charakter przenośny\n    - D) należy rozumieć dosłownie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — ma charakter przenośny<br>Malarz nie był prawdziwym ogniem — „płomień” oznacza tu jego zapał i żywiołowość, to przenośnia. Pułapka B: porównanie miałoby słowo „jak” (był jak płomień). *Gorejącym* to epitet, więc A odpada.<\/details><br>\n24. ***Obraz nie był podpisany*** czyli był: *(5 pkt)*\n    - A) anonimowy\n    - B) bezwartościowy\n    - C) namalowany na płótnie\n    - D) nieoprawiony\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — anonimowy<br>Malarz podpisuje obraz swoim nazwiskiem. Bez podpisu nie widać, kto go namalował — dzieło jest anonimowe, czyli bez podanego autora. Pułapka D: nieoprawiony znaczy bez ramy, a to co innego.<\/details><br>\n25. Podkreślony wyraz w zdaniu ***To był <u>cudowny<\/u> malarz!*** oznacza: *(5 pkt)*\n    - A) dziwny\n    - B) niezrozumiały\n    - C) uduchowiony\n    - D) znakomity\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — znakomity<br>*Cudowny* znaczy tu wspaniały, świetny, znakomity — to pochwała. Pułapka A: „cud” to coś niezwykłego, ale „cudowny malarz” nie znaczy „dziwny”.<\/details><br>\n26. Podkreślony wyraz w zdaniu z pyt. 25 występuje w funkcji: *(5 pkt)*\n    - A) dopełnienia\n    - B) przydawki\n    - C) podmiotu\n    - D) orzeczenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — przydawki<br>Przydawka określa rzeczownik i odpowiada na pytania jaki? który? czyj? — malarz (jaki?) *cudowny*.<\/details><br>\n27. W wyrazie ***cudowny***: *(5 pkt)*\n    - A) jest równa ilość spółgłosek i samogłosek\n    - B) jest więcej spółgłosek niż samogłosek\n    - C) więcej jest samogłosek\n    - D) są cztery samogłoski\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest więcej spółgłosek niż samogłosek<br>C-u-d-o-w-n-y: samogłoski u, o, y (3), spółgłoski c, d, w, n (4). Pamiętaj: *y* to samogłoska.<\/details><br>\n28. Podkreślone sformułowanie w zdaniu ***malarze <u>chodzą bez butów<\/u>***: *(5 pkt)*\n    - A) chodzą boso\n    - B) są skąpi\n    - C) oznacza *są biedni*\n    - D) zachowują się dziwnie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — oznacza *są biedni*<br>Kto nie ma pieniędzy nawet na buty, jest bardzo biedny. Pułapka A: to znaczenie dosłowne, a tu chodzi o przenośnię — malarze rozdają obrazy i nic na nich nie zarabiają.<\/details><br>\n29. Wyrazy ***literat*** i ***pisarz
