niki, więc dwa ważenia dają najwyżej 3 · 3 = 9 różnych zakończeń, a podejrzanych monet jest 10. Pułapka: przy 9 monetach wystarczyłyby 2 ważenia.<\/details><br>\n24. Mamy wagę szalkową i trzy odważniki: 1 g, 3 g i 9 g. Odważniki można kłaść na obie szalki. Ile różnych mas (w pełnych gramach) można odważyć tymi odważnikami? *(5 pkt)*\n    - A) 7\n    - B) 9\n    - C) 10\n    - D) 12\n    - E) 13\n    <details><summary>rozwiązanie<\/summary>E — 13<br>Kładąc odważniki tylko na jedną szalkę, odważymy: 1, 3, 4, 9, 10, 12, 13 g (7 mas). Ale odważnik położony obok towaru „odejmuje się”: 2 = 3 − 1, 5 = 9 − 3 − 1, 6 = 9 − 3, 7 = 9 + 1 − 3, 8 = 9 − 1, 11 = 9 + 3 − 1. Razem wychodzą wszystkie masy od 1 g do 13 g, czyli 13 mas (więcej nie da się, bo 1 + 3 + 9 = 13). Pułapka: 7 — gdy zapomni się, że wolno używać obu szalek.<\/details><br>\n\n## E. Przelewanie i przeprawy\n\nZapisuj stan po każdym ruchu. Szukaj najkrótszego sposobu — i pamiętaj, że ktoś (lub coś) musi wrócić, żeby przewieźć resztę.\n\n25. W każdym z pięciu akwariów pływają cztery rybki. Ile co najmniej rybek trzeba przełożyć do innego akwarium, żeby doprowadzić do sytuacji, gdy w każdym akwarium jest inna liczba rybek? *(3 pkt)* *(Alfik 2018, zad. 6)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>A — 3<br>Rybek jest 20. Można osiągnąć 2, 3, 4, 5, 6: z jednego akwarium przekładamy 2 rybki (do akwarium, które ma mieć 6), z drugiego 1 (do tego, które ma mieć 5) — razem 3 rybki. Mniej się nie da: liczby mają być różne, więc najwyżej jedno akwarium zostaje z 4 rybkami. Jeśli mniej niż 4 rybki mają mieć dwa akwaria, to różne liczby, np. 3 i 2 — trzeba z nich zabrać co najmniej 1 + 2 = 3. Jeśli tylko jedno albo żadne, to co najmniej trzy akwaria mają więcej niż 4 (5, 6, 7 lub więcej) — trzeba dołożyć co najmniej 1 + 2 + 3 = 6. A trzy lub więcej akwariów z mniej niż 4 rybkami to zabranie co najmniej 1 + 2 + 3 = 6.<\/details><br>\n26. Mamy kran z wodą, pusty dzbanek o pojemności 5 litrów i pusty dzbanek o pojemności 3 litrów. Jeden ruch to: napełnienie dzbanka do pełna z kranu, wylanie całej wody z dzbanka albo przelewanie z jednego dzbanka do drugiego (aż jeden się opróżni albo drugi napełni). Ile co najmniej ruchów trzeba, żeby w jednym z dzbanków były dokładnie 4 litry wody? *(4 pkt)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 7\n    - E) 8\n    <details><summary>rozwiązanie<\/summary>C — 6<br>Zapisujemy (duży, mały): 1) napełniamy duży (5, 0); 2) przelewamy do małego (2, 3); 3) wylewamy mały (2, 0); 4) przelewamy 2 l do małego (0, 2); 5) napełniamy duży (5, 2); 6) dolewamy do małego, aż będzie pełny — przeleje się tylko 1 litr (4, 3). Mamy 4 litry. Szybciej się nie da (sprawdzone wszystkimi możliwymi ruchami). Pułapka: zaczynając od napełnienia małego dzbanka, potrzeba aż 8 ruchów.<\/details><br>\n27. Ile co najmniej dwulitrowych butelek potrzeba, żeby przelać do nich wodę z 12 pełnych półtoralitrowych butelek? *(4 pkt)* *(Alfik 2018, zad. 15)*\n    - A) 8\n    - B) 9\n    - C) 10\n    - D) 11\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>B — 9<br>Wody jest 12 · 1,5 = 18 litrów. 18 : 2 = 9 butelek dwulitrowych.<\/details><br>\n28. W nocy czworo dzieci musi przejść przez wąski most. Most wytrzyma najwyżej 2 osoby naraz, a iść trzeba z latarką — jest tylko jedna latarka, więc ktoś musi ją odnosić z powrotem. Dzieci przechodzą przez most w czasie: 1 minuta, 2 minuty, 4 minuty i 8 minut. Gdy idą we dwoje, idą w tempie wolniejszego. W ile co najmniej minut wszyscy mogą znaleźć się po drugiej stronie? *(5 pkt)*\n    - A) 14\n    - B) 15\n    - C) 16\n    - D) 17\n    - E) 18\n    <details><summary>rozwiązanie<\/summary>B — 15<br>Najlepiej, żeby dwoje najwolniejszych szło razem. Przechodzą 1 i 2 (2 min), wraca 1 z latarką (1 min), przechodzą 4 i 8 (8 min), wraca 2 (2 min), przechodzą 1 i 2 (2 min). Razem 2 + 1 + 8 + 2 + 2 = 15 minut. Pułapka: gdy najszybszy odprowadza po kolei każdego, wychodzi 2 + 1 + 4 + 1 + 8 = 16 minut.<\/details><br>\n29. Na stole leży 11 monet, wszystkie reszkami do góry. W każdym ruchu wybieramy dowolne 5 monet i odwracamy je. Jaka jest najmniejsza liczba ruchów pozwalająca odwrócić wszystkie monety orłami do góry? *(5 pkt)* *(Alfik 2016, zad. 30)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) jest to niemożliwe\n    <details><summary>rozwiązanie<\/summary>B — 3<br>W 2 ruchach odwracamy tylko 10 razy, a każda z 11 monet musi być odwrócona choć raz — za mało. W 3 ruchach się da: monety X i Y odwracamy w każdym ruchu, a do nich dokładamy kolejno monety 1–3, 4–6, 7–9. X i Y są odwrócone 3 razy (kończą orłem), pozostałe po razie.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. A — 3\n2. C — 7\n3. D — 6 *(Alfik 2019, zad. 5)*\n4. D — 9 *(Alfik 2016, zad. 8)*\n5. D — 13\n6. E — 10 *(Alfik 2025, zad. 17)*\n7. E — 10 *(Alfik 2023, zad. 20)*\n8. D — 6 *(Alfik 2022, zad. 20)*\n9. E — 29\n10. D — 17 *(Alfik 2019, zad. 28)*\n11. A — 6 *(Alfik 2018, zad. 24)*\n12. A — tylko Adam\n13. B — 1\n14. D — 3\n15. E — Ewa\n16. B — 13\n17. A — czerwonego\n18. B — 26 *(Alfik 2017, zad. 13)*\n19. B — 1 *(Alfik 2015, zad. 15)*\n20. D — Darek\n21. D — 13 *(Alfik 2018, zad. 26)*\n22. A — spóźnia się o 3 minuty *(Alfik 2017, zad. 26)*\n23. C — 3\n24. E — 13\n25. A — 3 *(Alfik 2018, zad. 6)*\n26. C — 6\n27. B — 9 *(Alfik 2018, zad. 15)*\n28. B — 15\n29. B — 3 *(Alfik 2016, zad. 30)*\n\n## Ściąga\n\n| Typ | Sposób |\n|---|---|\n| Para tego samego koloru (k kolorów) | k + 1 |\n| n sztuk tego samego koloru (k kolorów, każdego dużo) | k · (n − 1) + 1 |\n| Na pewno jest kolor X / wszystkie kolory | wyjmij w myślach wszystkie „złe” kulki (największe grupy) i dodaj 1 |\n| Rycerze i łotrzy | zakładaj „X jest rycerzem” i szukaj sprzeczności; kilka zdań, które się wykluczają → najwyżej jedno prawdziwe |\n| Pozycja w szeregu | k-ty od lewej i m-ty od prawej → k + m − 1 osób |\n| Kolejność | rysuj kreskę; zaczynaj od „zaraz za / zaraz przed” |\n| Fałszywa (lżejsza) moneta | dziel na 3 grupy; k ważeń wystarcza dla najwyżej 3, 9, 27… monet (3, 3·3, 3·3·3) |\n| Odważniki na obu szalkach | odważnik obok towaru odejmuje się; 1, 3, 9 g → wszystko od 1 do 13 g |\n| Przelewanie | zapisuj (duży, mały) po każdym ruchu; próbuj zaczynać od obu dzbanków |\n| Most z latarką | dwoje najwolniejszych idzie razem; latarkę odnoszą najszybsi |\n", "dawne": "06-logika-i-szufladki"}, {"path": "matematyczny/klasa-5/zadania-wg-typu/07-geometria-pola-i-obwody.md", "id": "mat5/07-geometria-pola-i-obwody", "kind": "dzial", "short": "07 Geometria: pola, obwody, jednostki", "sek": "mat5", "sekNazwa": "Matematyczny · kl. 5", "md": "# 07. Geometria: pola, obwody, jednostki\n\n**Dlaczego warto:** W każdym arkuszu Alfika są 3–5 zadań z geometrii: pole i obwód kwadratu, sklejanie prostokątów, jednostki (ar, hektar), kąty na zegarze albo pomalowane kostki. Rachunki są łatwe, ale łatwo pomylić pole z obwodem albo „cm” z „cm²”.\n\n- **W pliku:** 44 zadań: 15 nowych i 29 z prawdziwych arkuszy Alfika (14 za 3 pkt, 16 za 4 pkt, 14 za 5 pkt).\n\n**Wskazówki**\n- Zawsze rób szybki rysunek — nawet byle jaki. Przy sklejaniu i rozcinaniu od razu widać, które boki „znikają”, a które się pojawiają.\n- Pole kwadratu = bok · bok, obwód = 4 · bok. Gdy znasz obwód, najpierw podziel go przez 4, żeby mieć bok.\n- Gdy każdy bok powiększysz 2 razy, pole rośnie 2 · 2 = 4 razy; gdy 3 razy — pole rośnie 9 razy.\n- Rozcięcie figury nie zmienia pola, ale zawsze zwiększa sumę obwodów (każde cięcie daje dwa nowe brzegi).\n- Na zegarze między sąsiednimi liczbami jest 30°. Wskazówka godzinowa też się przesuwa: w ciągu pół godziny o 15°.\n- Pomalowana kostka n×n×n: 8 kostek w rogach ma 3 ściany pomalowane, na każdej z 12 krawędzi jest n − 2 kostek z 2 ścianami, a w środku zostaje sześcian (n − 2)×(n − 2)×(n − 2) bez farby.\n\n**Spis treści**\n\n- [A. Pole i obwód prostokąta](#a-pole-i-obwód-prostokąta)\n- [B. Jednostki pola](#b-jednostki-pola)\n- [C. Kąty: trójkąt i zegar](#c-kąty-trójkąt-i-zegar)\n- [D. Pomalowane kostki](#d-pomalowane-kostki)\n- [Klucz odpowiedzi](#klucz-odpowiedzi)\n- [Ściąga](#ściąga)\n\n---\n\n## A. Pole i obwód prostokąta\n\nTu trzeba szybko przechodzić od obwodu do pola i odwrotnie oraz zauważać, co się dzieje przy sklejaniu, rozcinaniu i powiększaniu figur.\n\n1. Obwód kwadratu wynosi 36 cm. Jakie jest pole tego kwadratu? *(3 pkt)*\n   - A) 9 cm²\n   - B) 36 cm²\n   - C) 54 cm²\n   - D) 81 cm²\n   - E) 324 cm²\n   <details><summary>rozwiązanie<\/summary>D — 81 cm²<br>Kwadrat ma 4 równe boki, więc bok = 36 : 4 = 9 cm. Pole = 9 · 9 = 81 cm². Pułapka: 9 to długość boku, a nie pole.<\/details><br>\n2. Prostokąt ma wymiary 8 cm na 5 cm. Każdy z jego boków wydłużono 3 razy. Ile razy zwiększyło się pole prostokąta? *(3 pkt)*\n   - A) 3\n   - B) 6\n   - C) 9\n   - D) 12\n   - E) 27\n   <details><summary>rozwiązanie<\/summary>C — 9<br>Stare pole: 8 · 5 = 40 cm². Nowy prostokąt ma 24 cm na 15 cm, więc pole 360 cm². 360 : 40 = 9. Długość rośnie 3 razy i szerokość rośnie 3 razy, więc pole rośnie 3 · 3 = 9 razy. Pułapka: odpowiedź 3.<\/details><br>\n3. Jaka jest długość obwodu kwadratu o polu 25 cm²? *(3 pkt)* *(Alfik 2022, zad. 1)*\n   - A) 5 cm\n   - B) 10 cm\n   - C) 15 cm\n   - D) 20 cm\n   - E) 25 cm\n   <details><summary>rozwiązanie<\/summary>D — 20 cm<br>5 · 5 = 25, więc bok kwadratu ma 5 cm. Obwód to 4 boki: 4 · 5 = 20 cm. Pułapka: 25 to pole, a nie obwód.<\/details><br>\n4. Kwadrat o obwodzie długości 12 cm rozcięto na cztery jednakowe kwadraty. Jaki jest łączny obwód otrzymanych kwadratów? *(3 pkt)* *(Alfik 2018, zad. 5)*\n   - A) 6 cm\n   - B) 12 cm\n   - C) 24 cm\n   - D) 36 cm\n   - E) 48 cm\n   <details><summary>rozwiązanie<\/summary>C — 24 cm<br>Bok dużego kwadratu to 12 : 4 = 3 cm, a małego — 1,5 cm. Obwód małego kwadratu to 4 · 1,5 = 6 cm, a czterech — 24 cm.<\/details><br>\n5. Dwa boki prostokąta skrócono o 2 cm, a pozostałe dwa boki wydłużono o 3 cm, otrzymując kwadrat o polu 16 cm². Jakie pole miał początkowy prostokąt? *(3 pkt)* *(Alfik 2018, zad. 9)*\n   - A) 6 cm²\n   - B) 8 cm²\n   - C) 12 cm²\n   - D) 16 cm²\n   - E) 18 cm²\n   <details><summary>rozwiązanie<\/summary>A — 6 cm²<br>Kwadrat o polu 16 cm² ma bok 4 cm. Boki prostokąta przed zmianą: 4 + 2 = 6 cm i 4 − 3 = 1 cm. Pole: 6 · 1 = 6 cm².<\/details><br>\n6. Prostokąt o wymiarach 12 cm × 14 cm rozcięto na 21 jednakowych prostokątnych kawałków. Jakie jest pole każdego kawałka? *(3 pkt)* *(Alfik 2015, zad. 6)*\n   - A) 6 cm²\n   - B) 8 cm²\n   - C) 10 cm²\n   - D) 12 cm²\n   - E) 14 cm²\n   <details><summary>rozwiązanie<\/summary>B — 8 cm²<br>Pole prostokąta to 12 · 14 = 168 cm². Dzielimy na 21 równych części: 168 : 21 = 8 cm².<\/details><br>\n7. Ola ma dwa jednakowe prostokąty o wymiarach 7 cm na 3 cm. Przyłożyła je do siebie dłuższymi bokami tak, że powstał jeden większy prostokąt. Jaki jest obwód tego prostokąta? *(4 pkt)*\n   - A) 20 cm\n   - B) 26 cm\n   - C) 34 cm\n   - D) 40 cm\n   - E) 42 cm\n   <details><summary>rozwiązanie<\/summary>B — 26 cm<br>Gdy przykładamy prostokąty dłuższymi bokami (po 7 cm), powstaje prostokąt 7 cm na 6 cm. Jego obwód to 7 + 6 + 7 + 6 = 26 cm. Pułapka: 40 cm to suma obwodów dwóch prostokątów — ale sklejone boki są teraz w środku i nie liczą się do obwodu. 34 cm wyszłoby przy sklejeniu krótszymi bokami (14 cm na 3 cm).<\/details><br>\n8. Kwadrat o boku 12 cm rozcięto dwoma cięciami na trzy jednakowe prostokątne paski. O ile suma obwodów trzech pasków jest większa od obwodu kwadratu? *(4 pkt)*\n   - A) 0 cm\n   - B) 12 cm\n   - C) 24 cm\n   - D) 48 cm\n   - E) 96 cm\n   <details><summary>rozwiązanie<\/summary>D — 48 cm<br>Każdy pasek ma wymiary 12 cm na 4 cm, więc obwód 12 + 4 + 12 + 4 = 32 cm. Trzy paski: 3 · 32 = 96 cm. Obwód kwadratu: 4 · 12 = 48 cm. Różnica: 96 − 48 = 48 cm. Prościej: każde cięcie o długości 12 cm tworzy dwa nowe brzegi, czyli dodaje 24 cm, a cięcia są dwa. Pułapka: pole się nie zmienia, ale obwód — tak!<\/details><br>\n9. Z 22 zapałek, żadnej nie łamiąc i wykorzystując je wszystkie, ułożono prostokąt o największym możliwym polu. Z ilu zapałek składał się dłuższy bok tego prostokąta? *(4 pkt)* *(Alfik 2023, zad. 11)*\n   - A) 4\n   - B) 5\n   - C) 6\n   - D) 7\n   - E) 8\n   <details><summary>rozwiązanie<\/summary>C — 6<br>Obwód to 22 zapałki, więc długość + szerokość = 11. Możliwe pola: 10·1 = 10, 9·2 = 18, 8·3 = 24, 7·4 = 28, 6·5 = 30. Największe pole ma prostokąt 6 × 5, dłuższy bok to 6 zapałek.<\/details><br>\n10. Długość obwodu dużego kwadratu jest dwa razy większa niż długość obwodu małego kwadratu. Ile razy większe jest pole dużego kwadratu od pola małego kwadratu? *(4 pkt)* *(Alfik 2022, zad. 17)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 6\n    - E) 8\n    <details><summary>rozwiązanie<\/summary>C — 4<br>Skoro obwód jest 2 razy większy, to bok też jest 2 razy dłuższy. Np. boki 1 cm i 2 cm: pola 1 cm² i 4 cm². Duży kwadrat mieści 4 małe. Pułapka: odpowiedź 2.<\/details><br>\n11. Z 9 zapałek, nie łamiąc żadnej z nich i wykorzystując je wszystkie, ułożono trójkąt, którego każdy bok był innej długości. Z ilu zapałek składał się najdłuższy bok tego trójkąta? *(4 pkt)* *(Alfik 2018, zad. 19)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>B — 4<br>Trzy różne długości o sumie 9: 1+2+6, 1+3+5, 2+3+4. W trójkącie najdłuższy bok musi być krótszy niż suma dwóch pozostałych — pasuje tylko 2, 3, 4. Najdłuższy bok ma 4 zapałki.<\/details><br>\n12. Z 16 zapałek (wykorzystując je wszystkie i żadnej nie łamiąc) ułożono prostokąt, który nie jest kwadratem. Każdy bok prostokąta składa się z parzystej liczby zapałek. Jaka jest długość dłuższego boku prostokąta? *(4 pkt)* *(Alfik 2017, zad. 15)*\n    - A) 2 zapałki\n    - B) 3 zapałki\n    - C) 4 zapałki\n    - D) 6 zapałek\n    - E) 8 zapałek\n    <details><summary>rozwiązanie<\/summary>D — 6 zapałek<br>Obwód to 16 zapałek, więc dwa sąsiednie boki mają razem 8 zapałek. Parzyste i różne: 2 + 6 (4 + 4 to kwadrat). Dłuższy bok ma 6 zapałek.<\/details><br>\n13. Jeśli szerokość pewnego prostokąta zwiększymy o 3 cm, a długość zmniejszymy o 4 cm, to otrzymamy kwadrat o polu 25 cm². Jakie pole ma wyjściowy prostokąt? *(4 pkt)* *(Alfik 2015, zad. 13)*\n    - A) 12 cm²\n    - B) 18 cm²\n    - C) 21 cm²\n    - D) 24 cm²\n    - E) 32 cm²\n    <details><summary>rozwiązanie<\/summary>B — 18 cm²<br>Kwadrat o polu 25 cm² ma bok 5 cm. Szerokość prostokąta była o 3 cm mniejsza: 2 cm, a długość o 4 cm większa: 9 cm. Pole: 2 · 9 = 18 cm².<\/details><br>\n14. Każdy bok kwadratu wydłużono o 2 cm. Pole kwadratu zwiększyło się wtedy o 36 cm². Jaki był bok kwadratu przed wydłużeniem? *(5 pkt)*\n    - A) 8 cm\n    - B) 9 cm\n    - C) 10 cm\n    - D) 16 cm\n    - E) 18 cm\n    <details><summary>rozwiązanie<\/summary>A — 8 cm<br>Narysuj stary kwadrat i dorysuj z prawej pasek o szerokości 2 cm, a na górze drugi pasek o szerokości 2 cm. Dochodzą: dwa paski o długości boku i szerokości 2 cm oraz mały kwadracik 2 × 2 w rogu (4 cm²). Paski mają razem 36 − 4 = 32 cm², więc jeden pasek ma 16 cm², a jego długość to 16 : 2 = 8 cm. Sprawdzenie: 10 · 10 − 8 · 8 = 100 − 64 = 36. Pułapka: 9 cm (36 : 4) — zapomniany kwadracik w rogu.<\/details><br>\n15. Kwadrat o polu 36 cm² rozcięto na dwa prostokąty, których stosunek pól wynosił 1 : 2. Jaki był stosunek długości obwodów tych prostokątów? *(5 pkt)* *(Alfik 2025, zad. 29)*\n    - A) 1 : 2\n    - B) 1 : 4\n    - C) 2 : 3\n    - D) 3 : 5\n    - E) 4 : 5\n    <details><summary>rozwiązanie<\/summary>E — 4 : 5<br>Kwadrat ma bok 6 cm. Prostokąty mają pola 12 cm² i 24 cm², więc wymiary 6 × 2 i 6 × 4. Obwody: 2 · (6 + 2) = 16 cm i 2 · (6 + 4) = 20 cm, a 16 : 20 = 4 : 5. Pułapka: obwody nie są w tym samym stosunku co pola.<\/details><br>\n16. Z jakiej najmniejszej liczby zapałek można ułożyć trójkąt, którego każdy bok będzie miał inną długość? Zapałek nie wolno łamać i trzeba je wykorzystać wszystkie. *(5 pkt)* *(Alfik 2024, zad. 21)*\n    - A) 6\n    - B) 7\n    - C) 8\n    - D) 9\n    - E) 10\n    <details><summary>rozwiązanie<\/summary>D — 9<br>Najkrótsze różne boki to 1, 2, 3 zapałki, ale 1 + 2 = 3 — trójkąt się „spłaszczy”. Najdłuższy bok musi być krótszy niż suma dwóch pozostałych. Najmniejszy dobry zestaw to 2, 3, 4 (bo 2 + 3 > 4), czyli 9 zapałek. Sprawdzenie: dla 7 i 8 zapałek nie ma trzech różnych boków tworzących trójkąt (1 + 2 + 4, 1 + 2 + 5 i 1 + 3 + 4 nie działają).<\/details><br>\n17. Kwadrat rozcięto na dwa jednakowe prostokąty, o obwodzie 12 cm każdy. Jaką długość miał obwód tego kwadratu? *(5 pkt)* *(Alfik 2024, zad. 29)*\n    - A) 16 cm\n    - B) 18 cm\n    - C) 20 cm\n    - D) 24 cm\n    - E) 36 cm\n    <details><summary>rozwiązanie<\/summary>A — 16 cm<br>Prostokąt ma jeden bok równy bokowi kwadratu, a drugi równy połowie boku. Jego obwód to bok + bok + pół + pół = 3 boki kwadratu = 12 cm, więc bok kwadratu ma 4 cm, a obwód kwadratu 4 · 4 = 16 cm.<\/details><br>\n18. Długość prostokąta zmniejszono o 2 cm, a jego szerokość zwiększono o 2 cm, otrzymując kwadrat o polu 25 cm². Jakie pole miał wyjściowy prostokąt? *(5 pkt)* *(Alfik 2023, zad. 27)*\n    - A) 20 cm²\n    - B) 21 cm²\n    - C) 24 cm²\n    - D) 25 cm²\n    - E) 30 cm²\n    <details><summary>rozwiązanie<\/summary>B — 21 cm²<br>Kwadrat ma bok 5 cm. Długość prostokąta była o 2 cm większa: 7 cm, a szerokość o 2 cm mniejsza: 3 cm. Pole: 7 · 3 = 21 cm². Pułapka: pole nie zostaje takie samo (25).<\/details><br>\n19. Łącząc środki boków kwadratu otrzymano mniejszy kwadrat. Jaki jest stosunek pól obu kwadratów? *(5 pkt)* *(Alfik 2021, zad. 29)*\n    - A) 2 : 1\n    - B) 3 : 1\n    - C) 3 : 2\n    - D) 4 : 1\n    - E) 4 : 3\n    <details><summary>rozwiązanie<\/summary>A — 2 : 1<br>Narysuj obie przekątne małego kwadratu (łączą środki przeciwległych boków). Dzielą duży kwadrat na 4 mniejsze kwadraty, a każdy z nich bok małego kwadratu przecina na pół — połowa jest w małym kwadracie, połowa poza nim. Mały kwadrat ma więc połowę pola dużego: stosunek 2 : 1.<\/details><br>\n20. Kwadrat o obwodzie 20 cm rozcięto na dwa prostokąty. Ile wynosi łączny obwód obu tych prostokątów? *(5 pkt)* *(Alfik 2021, zad. 30)*\n    - A) 20 cm\n    - B) 25 cm\n    - C) 30 cm\n    - D) 35 cm\n    - E) zależy od sposobu podziału\n    <details><summary>rozwiązanie<\/summary>C — 30 cm<br>Bok kwadratu to 20 : 4 = 5 cm. Żeby powstały dwa prostokąty, cięcie musi być prostą równoległą do boku, długości 5 cm. Oba obwody razem to obwód kwadratu plus dwa razy linia cięcia (należy do obu prostokątów): 20 + 2 · 5 = 30 cm — niezależnie od tego, gdzie tniemy.<\/details><br>\n\n## B. Jednostki pola\n\nNajważniejsze: 1 m² = 10 000 cm², 1 ar = 100 m² (kwadrat 10 m × 10 m), 1 hektar = 100 arów = 10 000 m².\n\n21. Ile kwadracików o boku 1 cm potrzeba, aby szczelnie wyłożyć kwadrat o boku 1 m? *(3 pkt)*\n    - A) 100\n    - B) 1000\n    - C) 10 000\n    - D) 100 000\n    - E) 1 000 000\n    <details><summary>rozwiązanie<\/summary>C — 10 000<br>1 m = 100 cm, więc w jednym rzędzie mieści się 100 kwadracików, a rzędów jest też 100. Razem 100 · 100 = 10 000. Pułapka: odpowiedź 100 — liczymy tylko jeden rząd.<\/details><br>\n22. Hektar to pole kwadratu o boku 100 metrów, zaś ar to pole kwadratu o boku 10 metrów. Jeden hektar – ile to arów? *(3 pkt)* *(Alfik 2025, zad. 7)*\n    - A) 10\n    - B) 100\n    - C) 1000\n    - D) 10 000\n    - E) 100 000\n    <details><summary>rozwiązanie<\/summary>B — 100<br>Wzdłuż boku 100 m mieści się 10 boków po 10 m, więc w kwadracie hektarowym jest 10 · 10 = 100 kwadratów arowych. Pułapka: 10 to stosunek boków, a nie pól.<\/details><br>\n23. Jeśli hektar to pole kwadratu o boku długości 100 metrów, to 1 km² – ile to hektarów? *(3 pkt)* *(Alfik 2024, zad. 2)*\n    - A) 1\n    - B) 10\n    - C) 100\n    - D) 1000\n    - E) 10 000\n    <details><summary>rozwiązanie<\/summary>C — 100<br>1 km² to kwadrat o boku 1000 m. Wzdłuż każdego boku mieści się 1000 : 100 = 10 kwadratów hektarowych, więc w całym kilometrze kwadratowym jest 10 · 10 = 100 hektarów.<\/details><br>\n24. Jeśli hektar to pole kwadratu o boku długości 100 metrów, to 1 km² – ile to hektarów? *(3 pkt)* *(Alfik 2023, zad. 5)*\n    - A) 10\n    - B) 100\n    - C) 1000\n    - D) 10 000\n    - E) 100 000\n    <details><summary>rozwiązanie<\/summary>B — 100<br>1 km = 1000 m, czyli 10 razy więcej niż bok hektara. Kwadrat 1 km × 1 km mieści 10 · 10 = 100 kwadratów 100 m × 100 m.<\/details><br>\n25. Hektar to pole kwadratu o boku długości 100 metrów, zaś ar to pole kwadratu o boku długości 10 metrów. W takim razie jeden hektar to ile arów? *(3 pkt)* *(Alfik 2022, zad. 7)*\n    - A) 10\n    - B) 20\n    - C) 100\n    - D) 1000\n    - E) 10 000\n    <details><summary>rozwiązanie<\/summary>C — 100<br>Hektar to 100 · 100 = 10 000 m², ar to 10 · 10 = 100 m². 10 000 : 100 = 100. Pułapka: bok jest 10 razy dłuższy, ale pole jest 10 · 10 = 100 razy większe.<\/details><br>\n26. Działka pana Nowaka jest prostokątem o wymiarach 50 m na 80 m. Ile arów ma ta działka? *(4 pkt)*\n    - A) 4 a\n    - B) 40 a\n    - C) 400 a\n    - D) 4000 a\n    - E) 40 000 a\n    <details><summary>rozwiązanie<\/summary>B — 40 a<br>Pole działki: 50 · 80 = 4000 m². Jeden ar to kwadrat 10 m × 10 m, czyli 100 m². 4000 : 100 = 40 arów. Pułapka: 4000 to liczba metrów kwadratowych, a nie arów.<\/details><br>\n27. Moc elektrowni mierzy się w gigawatach. Jeden gigawat to tysiąc megawatów, jeden megawat to tysiąc kilowatów, a jeden kilowat to tysiąc watów. Jeden gigawat – ile to watów? *(4 pkt)* *(Alfik 2025, zad. 12)*\n    - A) 100 000\n    - B) 1 000 000\n    - C) 10 000 000\n    - D) 100 000 000\n    - E) 1 000 000 000\n    <details><summary>rozwiązanie<\/summary>E — 1 000 000 000<br>Trzy razy mnożymy przez tysiąc: 1000 · 1000 · 1000 = 1 000 000 000 (miliard) watów. Pułapka: 1 000 000 to dopiero waty w jednym megawacie.<\/details><br>\n28. Jaką powierzchnię na mapie o skali 1 : 20 000 zajmuje kwadratowe pole uprawne o powierzchni 4 km²? *(4 pkt)* *(Alfik 2023, zad. 16)*\n    - A) 10 cm²\n    - B) 20 cm²\n    - C) 100 cm²\n    - D) 200 cm²\n    - E) 1000 cm²\n    <details><summary>rozwiązanie<\/summary>C — 100 cm²<br>Kwadrat o polu 4 km² ma bok 2 km = 200 000 cm. W skali 1 : 20 000 to 200 000 : 20 000 = 10 cm. Na mapie mamy kwadrat 10 cm × 10 cm = 100 cm². Pułapka: nie dzielimy pola przez 20 000 — skala dotyczy długości.<\/details><br>\n29. Dwa miasta na mapie o skali 1 : 15 000 000 są odległe o 1 cm. Jaka jest ich odległość w rzeczywistości? *(4 pkt)* *(Alfik 2019, zad. 14)*\n    - A) 1,5 km\n    - B) 15 km\n    - C) 150 km\n    - D) 1500 km\n    - E) 15 000 km\n    <details><summary>rozwiązanie<\/summary>C — 150 km<br>1 cm na mapie to 15 000 000 cm w terenie. 15 000 000 cm = 150 000 m = 150 km.<\/details><br>\n30. Ile kafelków wielkości 25 cm × 20 cm potrzeba do wyłożenia podłogi w prostokątnym pomieszczeniu o wymiarach 4 m × 3 m? *(4 pkt)* *(Alfik 2016, zad. 16)*\n    - A) 200\n    - B) 240\n    - C) 280\n    - D) 300\n    - E) 320\n    <details><summary>rozwiązanie<\/summary>B — 240<br>Wzdłuż 4 m = 400 cm mieści się 400 : 25 = 16 kafelków, wzdłuż 3 m = 300 cm mieści się 300 : 20 = 15 kafelków. Razem 16 · 15 = 240.<\/details><br>\n31. Ścieżka rowerowa ma szerokość pół metra i długość 4 km. Ile arów ma powierzchnia tej ścieżki? *(5 pkt)*\n    - A) 0,2 a\n    - B) 2 a\n    - C) 20 a\n    - D) 200 a\n    - E) 2000 a\n    <details><summary>rozwiązanie<\/summary>C — 20 a<br>4 km = 4000 m. Pole: 4000 m · ½ m = 2000 m². Jeden ar to 100 m², więc 2000 : 100 = 20 arów. Pułapka: 2000 to metry kwadratowe; a 200 a wyjdzie, jeśli ktoś pomyli 1 km z 10 000 m.<\/details><br>\n32. Kwadratowa działka o polu 100 m² na mapie o skali 1 : 20 jest kwadratem o polu: *(5 pkt)* *(Alfik 2025, zad. 24)*\n    - A) 5 cm²\n    - B) 25 cm²\n    - C) 250 cm²\n    - D) 500 cm²\n    - E) 2500 cm²\n    <details><summary>rozwiązanie<\/summary>E — 2500 cm²<br>Działka ma bok 10 m = 1000 cm. Na mapie bok jest 20 razy krótszy: 1000 : 20 = 50 cm. Pole na mapie: 50 · 50 = 2500 cm². Pułapka: dzielenie pola przez 20 zamiast przez 20 · 20 = 400.<\/details><br>\n33. Narysowano plan prostokątnego pokoju o powierzchni 27 m² w skali 1 : 30. Jakie pole miał prostokąt przedstawiający ów pokój? *(5 pkt)* *(Alfik 2024, zad. 23)*\n    - A) 3 cm²\n    - B) 300 cm²\n    - C) 900 cm²\n    - D) 30 000 cm²\n    - E) 90 000 cm²\n    <details><summary>rozwiązanie<\/summary>B — 300 cm²<br>W skali 1 : 30 każda długość jest 30 razy mniejsza, więc pole jest 30 · 30 = 900 razy mniejsze. 27 m² = 270 000 cm², a 270 000 : 900 = 300 cm². Pułapka: pola nie dzieli się przez 30, tylko przez 900.<\/details><br>\n\n## C. Kąty: trójkąt i zegar\n\nSuma kątów w trójkącie to 180°. Cała tarcza zegara to 360°, a między sąsiednimi liczbami jest 360° : 12 = 30°.\n\n34. Jaki jest mniejszy z kątów między wskazówkami zegara o godzinie 10:00? *(3 pkt)*\n    - A) 60°\n    - B) 90°\n    - C) 100°\n    - D) 120°\n    - E) 300°\n    <details><summary>rozwiązanie<\/summary>A — 60°<br>O 10:00 wskazówka minutowa jest na 12, a godzinowa na 10. Między 10 a 12 są dwa „odstępy” po 30°, czyli 60°. Pułapka: 300° to większy kąt (z drugiej strony tarczy), a 100° wychodzi, gdy pomyślimy „10 · 10”.<\/details><br>\n35. Przekątna dzieli kwadrat na dwa trójkąty. Każdy z nich jest trójkątem: *(3 pkt)* *(Alfik 2024, zad. 7)*\n    - A) równobocznym\n    - B) ostrokątnym równoramiennym\n    - C) prostokątnym równoramiennym\n    - D) rozwartokątnym równoramiennym\n    - E) różnobocznym (trójkątem o każdym boku innej długości)\n    <details><summary>rozwiązanie<\/summary>C — prostokątnym równoramiennym<br>Każdy trójkąt ma jeden kąt prosty (róg kwadratu), a dwa jego boki to boki kwadratu, czyli są równe. Jest więc prostokątny i równoramienny.<\/details><br>\n36. Jeden z kątów trójkąta ma 30°, a z dwóch pozostałych jeden jest dwa razy większy od drugiego. Ile stopni ma największy kąt tego trójkąta? *(4 pkt)*\n    - A) 50°\n    - B) 60°\n    - C) 75°\n    - D) 100°\n    - E) 120°\n    <details><summary>rozwiązanie<\/summary>D — 100°<br>Dwa pozostałe kąty mają razem 180° − 30° = 150°. Mniejszy to „jedna część”, większy to „dwie części” — razem trzy części, więc jedna część to 150° : 3 = 50°. Kąty: 30°, 50° i 100°. Największy ma 100°. Pułapka: 50° to najmniejszy z tych dwóch kątów.<\/details><br>\n37. Jaki jest mniejszy z kątów między wskazówkami zegara o godzinie 7:30? *(5 pkt)*\n    - A) 30°\n    - B) 45°\n    - C) 60°\n    - D) 75°\n    - E) 90°\n    <details><summary>rozwiązanie<\/summary>B — 45°<br>Wskazówka minutowa stoi na 6. Godzinowa NIE stoi na 7 — o wpół do ósmej jest dokładnie w połowie drogi między 7 a 8. Od 6 do 7 jest 30°, a od 7 do połowy drogi do 8 jest jeszcze 15°. Razem 45°. Pułapka: 30° wychodzi, gdy zapomnimy, że wskazówka godzinowa też się przesuwa.<\/details><br>\n38. Jeden z kątów trójkąta równoramiennego ostrokątnego ma miarę 30°. Jaka jest miara największego kąta tego trójkąta? *(5 pkt)* *(Alfik 2024, zad. 26)*\n    - A) 30°\n    - B) 45°\n    - C) 60°\n    - D) 75°\n    - E) 120°\n    <details><summary>rozwiązanie<\/summary>D — 75°<br>Gdyby 30° miały oba kąty przy podstawie, trzeci kąt miałby 180° − 60° = 120°, a trójkąt byłby rozwartokątny — sprzeczne z treścią. Więc 30° to kąt między ramionami, a kąty przy podstawie mają po (180° − 30°) : 2 = 75°. Pułapka: 120° odpada, bo trójkąt jest ostrokątny.<\/details><br>\n\n## D. Pomalowane kostki\n\nDuży sześcian (albo prostopadłościan) z małych kostek malujemy z zewnątrz i rozkładamy. Pytanie: ile małych kostek ma pomalowane 0, 1, 2 lub 3 ściany? Pomyśl o rogach, krawędziach, środkach ścian i „wnętrzu”.\n\n39. Sześcian sklejony z 27 jednakowych kostek (3 × 3 × 3) pomalowano z zewnątrz na czerwono, a potem rozłożono na małe kostki. Ile małych kostek ma pomalowane dokładnie dwie ściany? *(3 pkt)*\n    - A) 1\n    - B) 6\n    - C) 8\n    - D) 9\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>E — 12<br>Dwie ściany pomalowane mają kostki leżące na krawędzi dużego sześcianu, ale nie w rogu. Sześcian ma 12 krawędzi, a na każdej jest dokładnie jedna taka kostka (środkowa z trzech). Razem 12. Dla porównania: 8 kostek w rogach ma 3 ściany, 6 kostek (środki ścian) ma 1 ścianę, a 1 kostka w samym środku nie ma farby.<\/details><br>\n40. Sześcian zbudowany z 64 jednakowych kostek (4 × 4 × 4) zanurzono całkowicie w niebieskiej farbie, a potem rozłożono. Ile małych kostek nie ma ani odrobiny farby? *(4 pkt)*\n    - A) 8\n    - B) 16\n    - C) 24\n    - D) 27\n    - E) 56\n    <details><summary>rozwiązanie<\/summary>A — 8<br>Farby nie mają tylko kostki ukryte w środku. Gdy „zdejmiemy” zewnętrzną warstwę z każdej strony, z 4 kostek w rzędzie zostają 2. W środku jest więc sześcian 2 × 2 × 2 = 8 kostek. Pułapka: 56 = 64 − 8 to kostki pomalowane; 27 = 3 · 3 · 3 wychodzi, gdy zdejmiemy warstwę tylko z jednej strony.<\/details><br>\n41. Sześcian o krawędzi długości 4 cm pomalowano na czerwono, a następnie rozcięto na sześcianiki o krawędzi długości 1 cm. Ile z otrzymanych sześcianików nie ma żadnej czerwonej ściany? *(4 pkt)* *(Alfik 2025, zad. 13)*\n    - A) 1\n    - B) 2\n    - C) 4\n    - D) 6\n    - E) 8\n    <details><summary>rozwiązanie<\/summary>E — 8<br>Niepomalowane są sześcianiki ze środka, które nie dotykają żadnej ściany. Po zdjęciu „skórki” z każdej strony zostaje sześcian 2 × 2 × 2, czyli 2 · 2 · 2 = 8 sześcianików.<\/details><br>\n42. Sześcian o krawędzi długości 2 cm rozcięto na mniejsze sześcianiki, każdy o krawędzi długości 1 cm. Ile mniejszych sześcianików otrzymano? *(4 pkt)* *(Alfik 2024, zad. 12)*\n    - A) 4\n    - B) 6\n    - C) 7\n    - D) 8\n    - E) 9\n    <details><summary>rozwiązanie<\/summary>D — 8<br>Sześcian dzielimy na dwie warstwy, a każda warstwa to 2 · 2 = 4 sześcianiki. Razem 2 · 4 = 8.<\/details><br>\n43. Prostopadłościan o wymiarach 3 × 4 × 5 ułożono z 60 jednakowych małych kostek, pomalowano z zewnątrz i rozłożono. Ile małych kostek ma pomalowaną dokładnie jedną ścianę? *(5 pkt)*\n    - A) 6\n    - B) 12\n    - C) 16\n    - D) 20\n    - E) 22\n    <details><summary>rozwiązanie<\/summary>E — 22<br>Jedną ścianę pomalowaną mają kostki ze „środka” każdej ściany (bez brzegów). Ściana 3 × 4 ma w środku 1 · 2 = 2 kostki, ściana 3 × 5 ma 1 · 3 = 3, ściana 4 × 5 ma 2 · 3 = 6. Każda ściana występuje dwa razy (góra i dół, przód i tył, lewo i prawo): 2 · (2 + 3 + 6) = 22. Pułapka: 6 to kostki bez żadnej farby (wnętrze 1 × 2 × 3).<\/details><br>\n44. Duży sześcian zbudowano z jednakowych małych kostek, pomalowano z zewnątrz i rozłożono. Okazało się, że dokładnie 96 małych kostek ma pomalowaną tylko jedną ścianę. Z ilu małych kostek zbudowany był duży sześcian? *(5 pkt)*\n    - A) 16\n    - B) 64\n    - C) 96\n    - D) 125\n    - E) 216\n    <details><summary>rozwiązanie<\/summary>E — 216<br>Sześcian ma 6 ścian, więc na każdej ścianie jest 96 : 6 = 16 kostek z jedną pomalowaną ścianą. To środek ściany bez brzegów, czyli kwadrat 4 × 4. Cała ściana ma więc 4 + 2 = 6 kostek w rzędzie (dochodzą dwie brzegowe). Duży sześcian to 6 × 6 × 6 = 216 kostek. Pułapka: 125 wychodzi, gdy dodamy tylko jedną kostkę brzegową zamiast dwóch.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. D — 81 cm²\n2. C — 9\n3. D — 20 cm *(Alfik 2022, zad. 1)*\n4. C — 24 cm *(Alfik 2018, zad. 5)*\n5. A — 6 cm² *(Alfik 2018, zad. 9)*\n6. B — 8 cm² *(Alfik 2015, zad. 6)*\n7. B — 26 cm\n8. D — 48 cm\n9. C — 6 *(Alfik 2023, zad. 11)*\n10. C — 4 *(Alfik 2022, zad. 17)*\n11. B — 4 *(Alfik 2018, zad. 19)*\n12. D — 6 zapałek *(Alfik 2017, zad. 15)*\n13. B — 18 cm² *(Alfik 2015, zad. 13)*\n14. A — 8 cm\n15. E — 4 : 5 *(Alfik 2025, zad. 29)*\n16. D — 9 *(Alfik 2024, zad. 21)*\n17. A — 16 cm *(Alfik 2024, zad. 29)*\n18. B — 21 cm² *(Alfik 2023, zad. 27)*\n19. A — 2 : 1 *(Alfik 2021, zad. 29)*\n20. C — 30 cm *(Alfik 2021, zad. 30)*\n21. C — 10 000\n22. B — 100 *(Alfik 2025, zad. 7)*\n23. C — 100 *(Alfik 2024, zad. 2)*\n24. B — 100 *(Alfik 2023, zad. 5)*\n25. C — 100 *(Alfik 2022, zad. 7)*\n26. B — 40 a\n27. E — 1 000 000 000 *(Alfik 2025, zad. 12)*\n28. C — 100 cm² *(Alfik 2023, zad. 16)*\n29. C — 150 km *(Alfik 2019, zad. 14)*\n30. B — 240 *(Alfik 2016, zad. 16)*\n31. C — 20 a\n32. E — 2500 cm² *(Alfik 2025, zad. 24)*\n33. B — 300 cm² *(Alfik 2024, zad. 23)*\n34. A — 60°\n35. C — prostokątnym równoramiennym *(Alfik 2024, zad. 7)*\n36. D — 100°\n37. B — 45°\n38. D — 75° *(Alfik 2024, zad. 26)*\n39. E — 12\n40. A — 8\n41. E — 8 *(Alfik 2025, zad. 13)*\n42. D — 8 *(Alfik 2024, zad. 12)*\n43. E — 22\n44. E — 216\n\n## Ściąga\n\n| Co | Wzór / fakt |\n|---|---|\n| Kwadrat o boku a | pole = a · a, obwód = 4 · a |\n| Prostokąt a × b | pole = a · b, obwód = 2 · (a + b) |\n| Boki k razy dłuższe | obwód k razy większy, pole k · k razy większe |\n| Sklejanie dwóch figur | obwód = suma obwodów − 2 · długość sklejonego boku |\n| Rozcinanie | pole bez zmian, każde cięcie dodaje 2 · (długość cięcia) do sumy obwodów |\n| Jednostki długości | 1 m = 10 dm = 100 cm, 1 km = 1000 m |\n| Jednostki pola | 1 m² = 10 000 cm², 1 a = 100 m², 1 ha = 100 a = 10 000 m² |\n| Trójkąt | suma kątów = 180° |\n| Zegar | 30° między sąsiednimi liczbami; godzinowa przesuwa się o 30° na godzinę, czyli o ½° na minutę |\n| Kostka n × n × n | 3 ściany: 8; 2 ściany: 12 · (n − 2); 1 ściana: 6 · (n − 2) · (n − 2); 0 ścian: (n − 2) · (n − 2) · (n − 2) |\n", "dawne": "07-geometria-pola-i-obwody"}, {"path": "matematyczny/klasa-5/zadania-wg-typu/08-kratki-szachownice-ciecie.md", "id": "mat5/08-kratki-szachownice-ciecie", "kind": "dzial", "short": "08 Kratki, szachownice i cięcie", "sek": "mat5", "sekNazwa": "Matematyczny · kl. 5", "md": "# 08. Kratki, szachownice i cięcie\n\n**Dlaczego warto:** W prawie każdym arkuszu Alfika pojawia się szachownica, kratka do policzenia, cięcie figury albo kostka do gry. Te zadania wymagają mało rachunków, za to porządnego liczenia „po kolei” i jednego sprytnego spostrzeżenia (np. kolorowania).\n\n- **W pliku:** 53 zadań: 14 nowych i 39 z prawdziwych arkuszy Alfika (20 za 3 pkt, 22 za 4 pkt, 11 za 5 pkt).\n\n**Wskazówki**\n- Na szachownicy sąsiednie pola mają różne kolory. Jeśli liczba pól jest nieparzysta, pól w kolorze narożnika jest o 1 więcej.\n- Kwadraty na kratce licz według wielkości: najpierw 1×1, potem 2×2, 3×3… Na kratce n×n kwadratów k×k jest (n − k + 1) · (n − k + 1).\n- Kostka domino zawsze zakrywa jedno pole białe i jedno czarne — to pozwala szybko wykazać, że coś jest niemożliwe.\n- Cięcia równoległe: 3 cięcia wzdłuż dają 4 paski, a 4 cięcia w poprzek dzielą każdy pasek na 5 części.\n- Na kostce do gry przeciwległe ściany sumują się do 7: 1 i 6, 2 i 5, 3 i 4. Suma wszystkich oczek to 21.\n- Na siatce sześcianu w kształcie krzyża co druga ściana w „długim” pasku jest przeciwległa.\n\n**Spis treści**\n\n- [A. Szachownice i kolorowanie](#a-szachownice-i-kolorowanie)\n- [B. Ile kwadratów na kratce](#b-ile-kwadratów-na-kratce)\n- [C. Cięcie i układanie](#c-cięcie-i-układanie)\n- [D. Kostka do gry i siatki sześcianu](#d-kostka-do-gry-i-siatki-sześcianu)\n- [Klucz odpowiedzi](#klucz-odpowiedzi)\n- [Ściąga](#ściąga)\n\n---\n\n## A. Szachownice i kolorowanie\n\nPola szachownicy, przemalowywanie wierszy i kolumn, malowanie tak, żeby spełnić warunek.\n\n1. Szachownica ma wymiary 11 × 11, a jej narożne pola są czarne. O ile więcej jest na niej pól czarnych niż białych? *(3 pkt)*\n   - A) 0\n   - B) 1\n   - C) 2\n   - D) 11\n   - E) 22\n   <details><summary>rozwiązanie<\/summary>B — 1<br>Szachownica ma 11 · 11 = 121 pól. Kolory się przeplatają, więc pól jest prawie po równo, a „nadmiarowe” pole ma kolor narożnika. Czarnych jest 61, białych 60 — różnica 1. Pułapka: 11 — myślenie, że w każdym wierszu czarnych jest o jedno więcej (a w co drugim wierszu jest odwrotnie).<\/details><br>\n2. Pole w prawym górnym rogu kwadratowej szachownicy złożonej z 25 pól jest czarne. Ile jest takich czarnych pól na tej szachownicy, które sąsiadują z czterema białymi polami? *(3 pkt)* *(Alfik 2023, zad. 3)*\n   - A) 4\n   - B) 5\n   - C) 6\n   - D) 8\n   - E) 9\n   <details><summary>rozwiązanie<\/summary>B — 5<br>Szachownica ma 5×5 pól, a wszystkie 4 rogi są czarne. Cztery sąsiadów (z każdej strony) mają tylko pola wewnętrzne — środkowy kwadrat 3×3. Jego rogi i środek są czarne: to 5 pól, a każde czarne pole ma dookoła tylko białe.<\/details><br>\n3. Narożne pola szachownicy rozmiaru 9×9 są białe. Jeśli szachownicę tę rozetniemy na kwadratowe szachownice rozmiaru 3×3, to ile z otrzymanych szachownic będzie miało narożne pola białe? *(3 pkt)* *(Alfik 2022, zad. 9)*\n   - A) 4\n   - B) 5\n   - C) 6\n   - D) 8\n   - E) 9\n   <details><summary>rozwiązanie<\/summary>B — 5<br>Powstaje 9 małych szachownic ułożonych też jak 3×3. Sąsiednie małe szachownice mają narożniki w przeciwnych kolorach (przesunięcie o 3 pola, czyli o liczbę nieparzystą). Więc małe szachownice też ułożą się „w szachownicę”: białe narożniki mają te w rogach i w środku — 5 sztuk.<\/details><br>\n4. Na każdym białym polu biało-czarnej szachownicy o wymiarach 4×4 ustawiono 1 czarny pionek, a na każdym czarnym polu ustawiono 2 białe pionki. Ile łącznie pionków obu kolorów ustawiono na całej szachownicy? *(3 pkt)* *(Alfik 2019, zad. 10)*\n   - A) 16\n   - B) 18\n   - C) 20\n   - D) 24\n   - E) 32\n   <details><summary>rozwiązanie<\/summary>D — 24<br>Szachownica 4×4 ma 16 pól: 8 białych i 8 czarnych. Na białych stoi 8 · 1 = 8 pionków, na czarnych 8 · 2 = 16. Razem 24.<\/details><br>\n5. Ile białych pól jest na szachownicy o wymiarach 7×7, której pole w lewym górnym rogu jest czarne? *(3 pkt)* *(Alfik 2017, zad. 5)*\n   - A) 21\n   - B) 22\n   - C) 23\n   - D) 24\n   - E) 25\n   <details><summary>rozwiązanie<\/summary>D — 24<br>Pól jest 49 — liczba nieparzysta, więc jednego koloru jest o 1 więcej. Wszystkie rogi mają kolor lewego górnego, czyli czarny, i to czarnych jest więcej: 25 czarnych i 24 białe.<\/details><br>\n6. Ile białych pól ma szachownica o wymiarach 8×8? *(3 pkt)* *(Alfik 2015, zad. 4)*\n   - A) 24\n   - B) 30\n   - C) 32\n   - D) 36\n   - E) 48\n   <details><summary>rozwiązanie<\/summary>C — 32<br>Szachownica ma 8 · 8 = 64 pola, a białych i czarnych jest po równo: 64 : 2 = 32.<\/details><br>\n7. Wszystkie pola tablicy 5 × 5 są białe. Jeden ruch to zmiana koloru wszystkich pól w jednym wierszu albo w jednej kolumnie (białe stają się czarne, czarne — białe). Kuba przemalował kolejno pierwszy wiersz, drugi wiersz i pierwszą kolumnę. Ile czarnych pól jest teraz na tablicy? *(4 pkt)*\n   - A) 9\n   - B) 10\n   - C) 11\n   - D) 13\n   - E) 15\n   <details><summary>rozwiązanie<\/summary>C — 11<br>Po przemalowaniu dwóch wierszy czarnych jest 5 + 5 = 10 pól. Pierwsza kolumna ma 5 pól: 2 z nich (w dwóch pierwszych wierszach) były czarne i stają się białe, a 3 były białe i stają się czarne. 10 − 2 + 3 = 11. Pułapka: 15 = 10 + 5 — zapomniane, że czarne pola zmieniają się z powrotem na białe.<\/details><br>\n8. Chcemy pokolorować wszystkie wierzchołki pięciokąta, malując każdy wierzchołek jednym z dostępnych kolorów. Ile co najmniej kolorów musimy użyć, żeby każdy bok miał końce różnego koloru? *(4 pkt)* *(Alfik 2023, zad. 13)*\n   - A) 2\n   - B) 3\n   - C) 4\n   - D) 5\n   - E) 6\n   <details><summary>rozwiązanie<\/summary>B — 3<br>Dwoma kolorami musielibyśmy malować na przemian: biały, czarny, biały, czarny, biały — ale piąty wierzchołek sąsiaduje z pierwszym, a oba byłyby białe. Pięć to liczba nieparzysta, więc 2 kolory nie wystarczą. Trzy wystarczą: B, C, B, C, Z.<\/details><br>\n9. Na biało-czarnej szachownicy o rozmiarach 4×4 niektóre z czarnych pól chcemy przemalować na czerwono tak, by każde białe pole szachownicy sąsiadowało z przynajmniej jednym polem czerwonym. Ile co najmniej pól musimy przemalować? *(4 pkt)* *(Alfik 2021, zad. 17)*\n   - A) 2\n   - B) 3\n   - C) 4\n   - D) 5\n   - E) 6\n   <details><summary>rozwiązanie<\/summary>B — 3<br>Białych pól jest 8, a czarne pole sąsiaduje (bokiem) najwyżej z 4 białymi. Biały narożnik sąsiaduje tylko z czarnymi polami brzegowymi, a te mają najwyżej 3 białych sąsiadów — więc 2 czerwone pola obejmą najwyżej 3 + 4 = 7 białych, za mało. 3 wystarczą: np. gdy lewy górny róg jest biały, czerwone pola to (rząd 1, kolumna 2), (rząd 3, kolumna 2) i (rząd 3, kolumna 4) — sprawdziliśmy też programem.<\/details><br>\n10. Niektóre pola biało-czarnej szachownicy o wymiarach 8×8 pomalowano na czerwono tak, aby w każdym rzędzie tej szachownicy i w każdej kolumnie tej szachownicy było dokładnie jedno czerwone pole. Ile pól pomalowano na czerwono? *(4 pkt)* *(Alfik 2019, zad. 13)*\n    - A) 6\n    - B) 8\n    - C) 10\n    - D) 12\n    - E) 16\n    <details><summary>rozwiązanie<\/summary>B — 8<br>Rzędów jest 8 i w każdym jest dokładnie jedno czerwone pole, więc czerwonych pól jest 8 (i wtedy w każdej kolumnie też jest po jednym, np. na przekątnej).<\/details><br>\n11. Jakie wymiary może mieć biało-czarna prostokątna szachownica złożona z 36 pól, której wszystkie 4 narożne pola są białe? *(4 pkt)* *(Alfik 2019, zad. 15)*\n    - A) 6×6\n    - B) 4×9\n    - C) 3×12\n    - D) 2×18\n    - E) taka szachownica nie istnieje\n    <details><summary>rozwiązanie<\/summary>E — taka szachownica nie istnieje<br>Idąc wzdłuż rzędu kolory się zmieniają. Żeby oba końce rzędu były tego samego koloru, rząd musi mieć nieparzystą liczbę pól; tak samo kolumna. Wtedy liczba wszystkich pól = nieparzysta · nieparzysta = nieparzysta. A 36 jest parzyste, więc takiej szachownicy nie ma.<\/details><br>\n12. W każde pole szachownicy o wymiarach 8×8 wpisujemy iloczyn numeru kolumny i numeru rzędu, w których znajduje się to pole (zarówno kolumny jak i rzędy numerujemy kolejnymi liczbami od 1 do 8). Jaka jest największa możliwa różnica dwóch liczb wpisanych w sąsiadujące pola (tzn. pola mające wspólny bok)? *(4 pkt)* *(Alfik 2018, zad. 16)*\n    - A) 5\n    - B) 6\n    - C) 7\n    - D) 8\n    - E) 9 lub więcej\n    <details><summary>rozwiązanie<\/summary>D — 8<br>Sąsiednie pola różnią się numerem kolumny (albo rzędu) o 1, przy tym samym drugim numerze. Różnica liczb jest więc równa temu drugiemu numerowi, czyli najwyżej 8 — np. 8 · 8 = 64 i 8 · 7 = 56.<\/details><br>\n13. Na szachownicy o wymiarach 6×6 ustawiono 18 pionków białych i 18 pionków czarnych, ustawiając po jednym pionku na każdym polu. Jeśli na białych polach ustawiono 7 białych pionków, to ile czarnych pionków ustawiono na czarnych polach? *(4 pkt)* *(Alfik 2018, zad. 17)*\n    - A) 7\n    - B) 8\n    - C) 9\n    - D) 11\n    - E) zależy od ustawienia pionków\n    <details><summary>rozwiązanie<\/summary>A — 7<br>Białych pionków jest 18; 7 stoi na białych polach, więc 11 na czarnych. Czarnych pól jest 18, zajętych przez 11 białych pionków — na pozostałych 7 czarnych polach stoją czarne pionki.<\/details><br>\n14. Na szachownicy o wymiarach 8×8 ustawiamy pionki – każdy na innym polu. Ile najwięcej pionków możemy ustawić, jeśli chcemy, by w każdej kolumnie był najwyżej jeden pionek i w każdym wierszu były najwyżej dwa pionki? *(4 pkt)* *(Alfik 2017, zad. 17)*\n    - A) 8\n    - B) 9\n    - C) 12\n    - D) 15\n    - E) 16\n    <details><summary>rozwiązanie<\/summary>A — 8<br>Kolumn jest 8, a w każdej może stać najwyżej jeden pionek — więc więcej niż 8 się nie da. 8 łatwo ustawić, np. wszystkie na przekątnej. Warunek o wierszach nic tu nie zmienia. Pułapka: 16 wychodzi, gdy patrzy się tylko na wiersze.<\/details><br>\n15. Ruch polega na przemalowaniu każdego pola (białego na czarne, a czarnego na białe) w wybranym wierszu albo w wybranej kolumnie szachownicy. Ile co najmniej ruchów potrzeba, by przemalować całą szachownicę rozmiaru 8×8 na czarno? *(4 pkt)* *(Alfik 2016, zad. 11)*\n    - A) 4\n    - B) 8\n    - C) 12\n    - D) 16\n    - E) inna liczba\n    <details><summary>rozwiązanie<\/summary>B — 8<br>Przemalowujemy co drugi wiersz (4 ruchy) — wtedy każda kolumna jest jednokolorowa, na przemian biała i czarna. Teraz przemalowujemy 4 białe kolumny — razem 8 ruchów. Mniej się nie da: w każdej kolumnie są pola obu kolorów, więc samymi ruchami kolumnowymi jej nie wyrównamy — trzeba ruszyć wiersze, i to tak, by każda kolumna stała się jednokolorowa (co drugi wiersz: 4 ruchy). Wtedy 4 kolumny są białe i każdą trzeba przemalować osobno. Sprawdzenie komputerem wszystkich możliwości też daje 8.<\/details><br>\n16. Plansza ma wymiary 5 × 5. Ile najmniej pól trzeba pomalować na czerwono, aby w każdym kwadracie 2 × 2 złożonym z czterech pól tej planszy było co najmniej jedno czerwone pole? *(5 pkt)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 9\n    <details><summary>rozwiązanie<\/summary>B — 4<br>Mniej niż 4 się nie da: w czterech rogach planszy leżą cztery kwadraty 2 × 2, które nie mają wspólnych pól, a każdy z nich potrzebuje własnego czerwonego pola. 4 wystarczą: pomaluj pola w 2. i 4. wierszu, które są w 2. i 4. kolumnie. Każdy kwadrat 2 × 2 zawiera jeden z wierszy 2 lub 4 i jedną z kolumn 2 lub 4, więc trafia na czerwone pole.<\/details><br>\n17. Kwadratowa szachownica składa się z 36 pól. Ruch polega na wybraniu jednego rzędu albo jednej kolumny i przemalowaniu wszystkich pól w wybranym rzędzie (albo w wybranej kolumnie): pola białe przemalowujemy na czarno, a czarne – na biało. Ile najmniej ruchów potrzeba wykonać, aby wszystkie 36 pól było koloru czarnego? *(5 pkt)* *(Alfik 2022, zad. 25)*\n    - A) 6\n    - B) 7\n    - C) 8\n    - D) 9\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>A — 6<br>Szachownica ma 6×6 pól. Przemalowujemy co drugi rząd (3 ruchy) — wtedy każda kolumna staje się jednokolorowa, na przemian biała i czarna. Teraz przemalowujemy 3 białe kolumny — razem 6 ruchów. Mniej się nie da: dwa sąsiednie pola w rzędzie mają różne kolory, więc z każdej pary kolumn 1–2, 3–4, 5–6 dokładnie jedną trzeba przemalować — to co najmniej 3 ruchy kolumnami. Tak samo co najmniej 3 ruchy rzędami. Razem co najmniej 6.<\/details><br>\n18. Przez ile pól szachownicy o rozmiarze 3×4 będzie przechodził odcinek łączący prawy dolny róg szachownicy z lewym górnym rogiem szachownicy? *(5 pkt)* *(Alfik 2021, zad. 22)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>D — 6<br>Idąc wzdłuż odcinka, wchodzimy do nowego pola za każdym razem, gdy przecinamy linię siatki. W poziomie przecinamy 3 linie pionowe, w pionie 2 linie poziome, i nigdy obie naraz (3 i 4 nie mają wspólnego dzielnika większego niż 1, więc odcinek nie trafia w żaden wewnętrzny wierzchołek). Pól jest 1 + 3 + 2 = 6.<\/details><br>\n19. Ile najwięcej pól może mieć prostokątna szachownica, która ma dokładnie 20 pól brzegowych (tzn. leżących w pierwszym wierszu, w pierwszej kolumnie, w ostatnim wierszu lub w ostatniej kolumnie)? *(5 pkt)* *(Alfik 2016, zad. 24)*\n    - A) 24\n    - B) 25\n    - C) 32\n    - D) 35\n    - E) 36\n    <details><summary>rozwiązanie<\/summary>E — 36<br>Szachownica a × b (obie co najmniej 2) ma 2 · (a + b) − 4 pól brzegowych, więc a + b = 12. Możliwe: 2 × 10 (20 pól), 3 × 9 (27), 4 × 8 (32), 5 × 7 (35), 6 × 6 (36). Najwięcej ma kwadrat 6 × 6: 36 pól.<\/details><br>\n20. Trzy kwadratowe czarno-białe szachownice (każda innej wielkości) rozcięto na pojedyncze pola otrzymując łącznie 22 czarne kwadraciki. Ile białych kwadracików otrzymano? *(5 pkt)* *(Alfik 2016, zad. 28)*\n    - A) 20\n    - B) 21\n    - C) 22\n    - D) 23\n    - E) 24\n    <details><summary>rozwiązanie<\/summary>D — 23<br>Szachownica 2 × 2 ma 2 czarne pola, 4 × 4 — 8 czarnych, a 5 × 5 może mieć 12 czarnych i 13 białych. Razem czarnych 2 + 8 + 12 = 22, białych 2 + 8 + 13 = 23. ⚠ Uwaga: jeśli uznać „szachownicę” 1 × 1 (jedno pole), pasują też inne zestawy: 1 × 1, 3 × 3, 6 × 6 (0 + 4 + 18 czarnych, 24 białe) albo 1 × 1, 4 × 4, 5 × 5 (1 + 8 + 13 czarnych, 20 białych). Odpowiedź 23 zgodna z kluczem wymaga przyjęcia, że szachownica ma co najmniej 2 × 2 pola.<\/details><br>\n\n## B. Ile kwadratów na kratce\n\nLicz porządnie: najpierw najmniejsze figury, potem coraz większe. Nie zapomnij o całej kratce!\n\n21. Ile jest wszystkich kwadratów (różnej wielkości) na kratce 3 × 3? *(3 pkt)*\n    - A) 9\n    - B) 10\n    - C) 13\n    - D) 14\n    - E) 16\n    <details><summary>rozwiązanie<\/summary>D — 14<br>Kwadratów 1 × 1 jest 9. Kwadratów 2 × 2 jest 4 (lewy górny róg może być w 2 miejscach w poziomie i 2 w pionie). Kwadrat 3 × 3 jest 1 — cała kratka. Razem 9 + 4 + 1 = 14. Pułapka: 10 — pominięte kwadraty 2 × 2.<\/details><br>\n22. Ile jest wszystkich kwadratów (różnej wielkości) na kratce 4 × 4? *(4 pkt)*\n    - A) 16\n    - B) 20\n    - C) 25\n    - D) 26\n    - E) 30\n    <details><summary>rozwiązanie<\/summary>E — 30<br>1 × 1: 4 · 4 = 16. 2 × 2: 3 · 3 = 9. 3 × 3: 2 · 2 = 4. 4 × 4: 1. Razem 16 + 9 + 4 + 1 = 30. Pułapka: 26 — zapomniane kwadraty 3 × 3.<\/details><br>\n23. Ile jest wszystkich prostokątów na kratce 3 × 3? Kwadraty też liczymy jako prostokąty. *(5 pkt)*\n    - A) 9\n    - B) 14\n    - C) 30\n    - D) 36\n    - E) 45\n    <details><summary>rozwiązanie<\/summary>D — 36<br>Liczymy według kształtu. 1 × 1: 9. Paski 1 × 2: 6 poziomych i 6 pionowych, czyli 12. Paski 1 × 3: 3 poziome i 3 pionowe, czyli 6. 2 × 2: 4. Prostokąty 2 × 3: 2 poziome i 2 pionowe, czyli 4. 3 × 3: 1. Razem 9 + 12 + 6 + 4 + 4 + 1 = 36. Pułapka: 14 to tylko kwadraty.<\/details><br>\n\n## C. Cięcie i układanie\n\nCięcia wzdłuż linii, układanie kostek domino. Gdy coś „nie chce wyjść”, pomaluj planszę w szachownicę.\n\n24. Prostokątną kartkę o wymiarach 8 cm na 12 cm pocięto na kwadraty o boku 2 cm. Ile kwadratów otrzymano? *(3 pkt)*\n    - A) 24\n    - B) 40\n    - C) 48\n    - D) 96\n    - E) 192\n    <details><summary>rozwiązanie<\/summary>A — 24<br>Wzdłuż boku 8 cm mieszczą się 8 : 2 = 4 kwadraty, a wzdłuż boku 12 cm — 12 : 2 = 6 kwadratów. Razem 4 · 6 = 24. Pułapka: 48 = 96 : 2 — ale kwadrat 2 × 2 ma pole 4 cm², a nie 2 cm².<\/details><br>\n25. Prostokątne ciasto pocięto prostymi cięciami od brzegu do brzegu: 3 cięcia wzdłuż i 4 cięcia w poprzek. Na ile kawałków podzielono ciasto? *(3 pkt)*\n    - A) 7\n    - B) 12\n    - C) 19\n    - D) 20\n    - E) 24\n    <details><summary>rozwiązanie<\/summary>D — 20<br>3 cięcia wzdłuż dzielą ciasto na 4 paski. Każde z 4 cięć w poprzek przecina wszystkie paski, więc każdy pasek dzieli się na 5 kawałków. Razem 4 · 5 = 20. Pułapka: 12 = 3 · 4 — liczba cięć to nie liczba kawałków (kawałków jest zawsze o 1 więcej niż cięć).<\/details><br>\n26. Kwadrat o boku długości 4 cm rozcięto na kwadraty o boku długości 1 cm. Ile części otrzymano? *(3 pkt)* *(Alfik 2025, zad. 1)*\n    - A) 4\n    - B) 8\n    - C) 12\n    - D) 16\n    - E) 64\n    <details><summary>rozwiązanie<\/summary>D — 16<br>W każdym rzędzie mieszczą się 4 kwadraciki, a rzędów jest 4. Razem 4 · 4 = 16. Pułapka: 4 to liczba kwadracików w jednym rzędzie, a 64 to liczba sześcianików, gdyby to był sześcian.<\/details><br>\n27. Narysowano trzy różne średnice pewnego koła. Na ile części podzieliły one to koło? *(3 pkt)* *(Alfik 2024, zad. 4)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>D — 6<br>Wszystkie średnice przechodzą przez środek koła. Trzy średnice to 6 „promieni” wychodzących ze środka, a one dzielą koło na 6 kawałków jak tort.<\/details><br>\n28. Dla każdej pary boków kwadratu narysowano odcinek łączący środki tych boków. Rozcinając kwadrat wzdłuż narysowanych odcinków otrzymano pewną liczbę trójkątów. Ile części otrzymano? *(3 pkt)* *(Alfik 2022, zad. 8)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 8\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>D — 8<br>Kwadrat ma 4 boki, więc par boków jest 6. Cztery odcinki łączą środki sąsiednich boków i tworzą „romb” w środku, odcinając 4 trójkąty w rogach. Dwa odcinki łączą środki przeciwległych boków — tworzą krzyż, który tnie środkowy kwadrat na 4 trójkąty. Razem 4 + 4 = 8.<\/details><br>\n29. Kwadrat o boku długości 12 cm rozcięto na 4 jednakowe kwadraty. Jaka jest długość boku każdego z otrzymanych kwadratów? *(3 pkt)* *(Alfik 2019, zad. 3)*\n    - A) 2 cm\n    - B) 3 cm\n    - C) 4 cm\n    - D) 6 cm\n    - E) 8 cm\n    <details><summary>rozwiązanie<\/summary>D — 6 cm<br>4 jednakowe kwadraty układają się 2 na 2, więc bok małego kwadratu to połowa boku dużego: 12 : 2 = 6 cm. Pułapka: 12 : 4 = 3 cm byłoby dobre, gdyby kwadraty leżały w jednym rzędzie — ale wtedy nie złożyłyby się w kwadrat.<\/details><br>\n30. Kwadrat o boku długości 5 cm rozcięto na kwadrat o boku długości 4 cm i pewną liczbę kwadracików o boku długości 1 cm. Ile części otrzymano z tego rozcięcia? *(3 pkt)* *(Alfik 2017, zad. 4)*\n    - A) 8\n    - B) 9\n    - C) 10\n    - D) 11\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>C — 10<br>Duży kwadrat ma pole 25 cm², kwadrat 4 cm ma pole 16 cm². Zostaje 9 cm², czyli 9 kwadracików. Razem z kwadratem 4 cm to 10 części. Pułapka: nie zapomnij policzyć dużego kawałka.<\/details><br>\n31. Prostokąt o szerokości 6 cm rozcięto na trzy kwadraty, wśród których dwa były jednakowe, a trzeci inny. Jaką długość miał ten prostokąt? *(3 pkt)* *(Alfik 2016, zad. 6)*\n    - A) 7 cm\n    - B) 8 cm\n    - C) 9 cm\n    - D) 10 cm\n    - E) 12 cm\n    <details><summary>rozwiązanie<\/summary>C — 9 cm<br>Duży kwadrat ma bok 6 cm (cała szerokość), a obok, jeden nad drugim, leżą dwa kwadraty o boku 3 cm. Długość: 6 + 3 = 9 cm.<\/details><br>\n32. Kwadrat o boku 24 cm rozcięto na kwadraty o boku 4 cm. Ile kwadratów otrzymano? *(3 pkt)* *(Alfik 2015, zad. 2)*\n    - A) 4\n    - B) 6\n    - C) 12\n    - D) 16\n    - E) 36\n    <details><summary>rozwiązanie<\/summary>E — 36<br>Wzdłuż jednego boku mieści się 24 : 4 = 6 małych kwadratów, więc jest 6 rzędów po 6 kwadratów: 6 · 6 = 36. Pułapka: odpowiedź 6 to tylko jeden rząd.<\/details><br>\n33. Z planszy 5 × 5 kratek wycinamy wzdłuż linii kratki prostokąty 1 × 2 (kostki domino). Ile najwięcej takich prostokątów można wyciąć? *(4 pkt)*\n    - A) 10\n    - B) 11\n    - C) 12\n    - D) 13\n    - E) 14\n    <details><summary>rozwiązanie<\/summary>C — 12<br>Plansza ma 25 pól, a każda kostka zabiera 2 pola, więc 13 kostek (26 pól) na pewno się nie zmieści. 12 się da: w każdym z 5 wierszy wycinamy 2 poziome kostki z pierwszych 4 pól (to 10 kostek), a z ostatniej kolumny (5 pól) wycinamy jeszcze 2 pionowe kostki. 10 + 2 = 12, zostaje jedno pole.<\/details><br>\n34. Prostokąt chcemy rozciąć na mniejsze prostokąty prowadząc 7 cięć tak, by każde cięcie było równoległe do dwóch boków tego prostokąta. Ile najwięcej części możemy otrzymać z takiego rozcięcia? *(4 pkt)* *(Alfik 2025, zad. 16)*\n    - A) 8\n    - B) 10\n    - C) 14\n    - D) 18\n    - E) 20\n    <details><summary>rozwiązanie<\/summary>E — 20<br>Jeśli zrobimy a cięć poziomych i b pionowych (a + b = 7), dostaniemy (a + 1) · (b + 1) części. Najwięcej, gdy cięcia są podzielone możliwie po równo: 3 poziome i 4 pionowe dają 4 · 5 = 20 części. Pułapka: 7 cięć w jedną stronę daje tylko 8 części.<\/details><br>\n35. Jaka jest największa liczba części, na jaką można rozciąć koło trzema odcinkami? *(4 pkt)* *(Alfik 2022, zad. 12)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>E — 7<br>Pierwszy odcinek dzieli koło na 2 części. Drugi, przecinając pierwszy, dokłada 2 części (razem 4). Trzeci może przeciąć oba poprzednie w dwóch różnych punktach i wtedy przechodzi przez 3 części, dzieląc każdą — dokłada 3. Razem 4 + 3 = 7.<\/details><br>\n36. Z prostokąta o długości 19 cm i szerokości 12 cm odcięto największy możliwy kwadrat, otrzymując mniejszy prostokąt. Z otrzymanego prostokąta znów odcięto największy możliwy kwadrat, otrzymując jeszcze mniejszy prostokąt. Procedurę tę kontynuowano tak długo, aż otrzymano prostokąt będący kwadratem. Jaka była długość boku tego kwadratu? *(4 pkt)* *(Alfik 2022, zad. 14)*\n    - A) 1 cm\n    - B) 2 cm\n    - C) 3 cm\n    - D) 4 cm\n    - E) 5 cm\n    <details><summary>rozwiązanie<\/summary>A — 1 cm<br>Śledzimy wymiary: 19×12 → 12×7 → 7×5 → 5×2 → 3×2 → 2×1 → 1×1. Na końcu zostaje kwadrat o boku 1 cm.<\/details><br>\n37. Jeśli prostokąt o wymiarach 6 cm × 8 cm rozetniemy na prostokąty o wymiarach 2 cm × 3 cm, to ile części otrzymamy? *(4 pkt)* *(Alfik 2022, zad. 19)*\n    - A) 8\n    - B) 9\n    - C) 10\n    - D) 11\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>A — 8<br>Pole dużego prostokąta: 6 · 8 = 48 cm², małego: 2 · 3 = 6 cm². 48 : 6 = 8 części. Takie cięcie jest możliwe: prostokąt 6 cm × 8 cm to dwa paski 3 cm × 8 cm, a każdy pasek tniemy na 4 kawałki 3 cm × 2 cm.<\/details><br>\n38. Na ile najwięcej części można podzielić kwadrat trzema prostymi? *(4 pkt)* *(Alfik 2017, zad. 16)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) więcej niż 6\n    <details><summary>rozwiązanie<\/summary>E — więcej niż 6<br>Pierwsza prosta daje 2 części, druga (przecinająca pierwszą wewnątrz kwadratu) dodaje 2 — razem 4. Trzecia, jeśli przetnie obie poprzednie wewnątrz kwadratu w różnych punktach, przechodzi przez 3 części i każdą dzieli na dwie — razem 7.<\/details><br>\n39. Z szachownicy 8 × 8 wycięto dwa przeciwległe narożne pola (lewe górne i prawe dolne). Ile kostek domino 1 × 2 potrzeba, aby dokładnie przykryć pozostałe pola (bez nakładania i bez wystawania poza planszę)? *(5 pkt)*\n    - A) 30\n    - B) 31\n    - C) 32\n    - D) 62\n    - E) nie da się tak przykryć tej planszy\n    <details><summary>rozwiązanie<\/summary>E — nie da się tak przykryć tej planszy<br>Pomaluj planszę jak szachownicę. Przeciwległe narożniki mają ten sam kolor, np. oba są czarne. Zostaje więc 30 pól czarnych i 32 białe. Każda kostka domino zakrywa jedno pole czarne i jedno białe, więc kostki zawsze zakrywają tyle samo czarnych co białych pól. 30 ≠ 32, więc się nie da. Pułapka: 31 = 62 : 2 — liczba pól się zgadza, ale kolory nie.<\/details><br>\n40. Jeśli prostokąt o wymiarach 12 cm × 17 cm rozetniemy na prostokąty o wymiarach 3 cm × 4 cm, to ile części otrzymamy? *(5 pkt)* *(Alfik 2023, zad. 23)*\n    - A) 14\n    - B) 15\n    - C) 16\n    - D) 17\n    - E) nie da się przeprowadzić takiego rozcięcia\n    <details><summary>rozwiązanie<\/summary>D — 17<br>Pole: 12 · 17 = 204 cm², jedna część 3 · 4 = 12 cm², 204 : 12 = 17. Cięcie jest możliwe: bok 17 cm dzielimy na 8 + 9. Pasek 12 × 8 tniemy na 4 · 2 = 8 prostokątów (3 cm wzdłuż boku 12, 4 cm wzdłuż boku 8), a pasek 12 × 9 na 3 · 3 = 9 prostokątów (4 cm wzdłuż boku 12, 3 cm wzdłuż boku 9). Razem 8 + 9 = 17.<\/details><br>\n\n## D. Kostka do gry i siatki sześcianu\n\nNa zwykłej kostce do gry liczby na przeciwległych ścianach sumują się do 7.\n\n41. Zwykła kostka do gry leży na stole. Widać trzy jej ściany: na górnej jest 5, na przedniej 3, a na prawej 1. Jaka jest suma liczb na trzech ścianach, których nie widać? *(3 pkt)*\n    - A) 9\n    - B) 12\n    - C) 13\n    - D) 15\n    - E) 21\n    <details><summary>rozwiązanie<\/summary>B — 12<br>Wszystkie ściany kostki mają razem 1 + 2 + 3 + 4 + 5 + 6 = 21 oczek. Widać 5 + 3 + 1 = 9, więc niewidocznych jest 21 − 9 = 12. Można też tak: naprzeciw 5 jest 2, naprzeciw 3 jest 4, naprzeciw 1 jest 6, a 2 + 4 + 6 = 12.<\/details><br>\n42. Jeśli od liczby krawędzi sześcianu odejmiemy liczbę jego wierzchołków, to otrzymamy wynik: *(3 pkt)* *(Alfik 2024, zad. 10)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>D — 4<br>Sześcian ma 12 krawędzi (4 na górze, 4 na dole i 4 pionowe) oraz 8 wierzchołków. 12 − 8 = 4.<\/details><br>\n43. Jedną krawędź sześcianu pomalowano na niebiesko. Pozostałe trzy krawędzie każdej ściany z niebieską krawędzią pomalowano na czerwono. Wszystkie pozostałe krawędzie sześcianu pomalowano na zielono. Ile zielonych krawędzi ma ten sześcian? *(3 pkt)* *(Alfik 2023, zad. 7)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 7\n    - E) 8\n    <details><summary>rozwiązanie<\/summary>B — 5<br>Sześcian ma 12 krawędzi. Każda krawędź należy do 2 ścian, więc niebieska krawędź leży na 2 ścianach. Na każdej z nich 3 pozostałe krawędzie są czerwone — razem 6 czerwonych. Zielonych: 12 − 1 − 6 = 5.<\/details><br>\n44. Ania w pięciu rzutach sześcienną kostką do gry (której ściany opisane są liczbami od 1 do 6) uzyskała łączny wynik 14. Ile najwięcej szóstek mogła wyrzucić? *(3 pkt)* *(Alfik 2018, zad. 2)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>A — 1<br>Dwie szóstki to 12, a pozostałe trzy rzuty dają co najmniej 1 + 1 + 1 = 3 — razem co najmniej 15, za dużo. Jedna szóstka wystarczy, np. 6 + 2 + 2 + 2 + 2 = 14.<\/details><br>\n45. Trzy zwykłe kostki do gry ustawiono jedna na drugiej w wieżę na stole. Na samej górze wieży widać 4. Jaka jest suma liczb na wszystkich ścianach, które dotykają innej kostki albo stołu? *(4 pkt)*\n    - A) 14\n    - B) 15\n    - C) 17\n    - D) 18\n    - E) 21\n    <details><summary>rozwiązanie<\/summary>C — 17<br>Górna kostka ma na górze 4, więc jej dolna ściana to 7 − 4 = 3. Środkowa kostka dotyka górą i dołem — to dwie przeciwległe ściany, razem 7. Dolna kostka dotyka górą środkowej kostki, a dołem stołu — znowu przeciwległe ściany, razem 7. Suma: 3 + 7 + 7 = 17. Pułapka: 14 — pominięta ściana stojąca na stole.<\/details><br>\n46. Na rysunku jest siatka zwykłej kostki do gry. Jaką liczbę trzeba wpisać w pole ze znakiem zapytania?<br><svg width=\"122\" height=\"92\" viewBox=\"-1 -1 122 92\" fill=\"none\" stroke=\"currentColor\"><rect x=\"0\" y=\"30\" width=\"30\" height=\"30\"/><rect x=\"30\" y=\"30\" width=\"30\" height=\"30\"/><rect x=\"60\" y=\"30\" width=\"30\" height=\"30\"/><rect x=\"90\" y=\"30\" width=\"30\" height=\"30\"/><rect x=\"30\" y=\"0\" width=\"30\" height=\"30\"/><rect x=\"30\" y=\"60\" width=\"30\" height=\"30\"/><g fill=\"currentColor\" stroke=\"none\" font-size=\"16\" text-anchor=\"middle\"><text x=\"15\" y=\"51\">3<\/text><text x=\"45\" y=\"51\">2<\/text><text x=\"75\" y=\"51\">4<\/text><text x=\"105\" y=\"51\">5<\/text><text x=\"45\" y=\"21\">6<\/text><text x=\"45\" y=\"81\">?<\/text><\/g><\/svg> *(4 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>A — 1<br>Złóż w myślach siatkę: długi pasek czterech ścian (3, 2, 4, 5) owija się wokół kostki, więc co druga ściana jest przeciwległa: 3 naprzeciw 4 i 2 naprzeciw 5 (obie pary dają 7). Ściana nad „2” i ściana pod „2” stają się górą i dołem kostki — są przeciwległe. Naprzeciw 6 musi być 7 − 6 = 1. Zresztą 1 to jedyna liczba, której jeszcze nie ma na siatce.<\/details><br>\n47. Każdą ścianę sześcianu chcemy pomalować na jednolity kolor. Ile co najmniej kolorów potrzebujemy użyć, żeby każde dwie sąsiednie ściany różniły się kolorem? *(4 pkt)* *(Alfik 2024, zad. 20)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>B — 3<br>Przeciwległe ściany nie są sąsiednie, więc mogą mieć ten sam kolor: góra i dół — kolor 1, przód i tył — kolor 2, lewa i prawa — kolor 3. Mniej się nie da, bo w jednym rogu sześcianu stykają się trzy ściany, każda z każdą.<\/details><br>\n48. Na każdej ścianie kostki do gry jest od 1 do 6 oczek (na każdej ścianie inna liczba). Na czterech ścianach sąsiadujących ze ścianą z 3 oczkami łącznie jest 14 oczek. Ile oczek jest na ścianie leżącej naprzeciw ściany z 3 oczkami? *(4 pkt)* *(Alfik 2021, zad. 20)*\n    - A) 1\n    - B) 2\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>C — 4<br>Na całej kostce jest 1 + 2 + 3 + 4 + 5 + 6 = 21 oczek. Ściana z 3 oczkami, jej 4 sąsiadki i ściana naprzeciwko to wszystkie 6 ścian. Naprzeciwko jest więc 21 − 3 − 14 = 4 oczka. (Zgadza się to z prawdziwą kostką, gdzie przeciwległe ściany dają razem 7.)<\/details><br>\n49. Ściany sześciennej kostki do gry ponumerowane są liczbami od 1 do 6 (każda ściana inną liczbą). Jacek rzucił trzema kostkami i pomnożył trzy otrzymane liczby. Która z poniższych liczb nie mogła być wynikiem tego mnożenia? *(4 pkt)* *(Alfik 2019, zad. 12)*\n    - A) 48\n    - B) 64\n    - C) 72\n    - D) 81\n    - E) 96\n    <details><summary>rozwiązanie<\/summary>D — 81<br>81 = 3 · 3 · 3 · 3. Na kostce „trójkę w środku” mają tylko 3 i 6, i to tylko jedną, więc trzy kostki dadzą najwyżej trzy trójki w iloczynie — za mało. Pozostałe się da: 48 = 2 · 4 · 6, 64 = 4 · 4 · 4, 72 = 2 · 6 · 6, 96 = 4 · 4 · 6.<\/details><br>\n50. Każdą z sześciu ścian sześciennej kostki do gry pomalowano na niebiesko albo na biało tak, że w każdym wierzchołku kostki schodziły się dwie ściany niebieskie i jedna biała. Ile niebieskich ścian miała ta kostka? *(4 pkt)* *(Alfik 2019, zad. 19)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>D — 4<br>Kostka ma 8 wierzchołków, a każda ściana ma 4 wierzchołki. Biała ściana „obsługuje” 4 wierzchołki, a każdy wierzchołek ma dokładnie jedną białą ścianę, więc białych ścian jest 8 : 4 = 2. Niebieskich jest 6 − 2 = 4 (np. białe góra i dół, niebieskie boki).<\/details><br>\n51. Zwykła kostka do gry stoi na stole tak, że na górze jest 1, z przodu (od strony Zosi) 2, a po prawej stronie 3. Zosia przetacza kostkę po stole przez krawędź: najpierw do siebie, potem w prawo, potem znowu do siebie i znowu w prawo. Jaka liczba jest teraz na górze? *(5 pkt)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>A — 2<br>Najpierw ustal, co jest na niewidocznych ścianach: dół 6, tył 5, lewa 4. Przy przetoczeniu do siebie na górę wchodzi ściana z tyłu; przy przetoczeniu w prawo na górę wchodzi ściana z lewej. Krok 1 (do siebie): góra 5, przód 1, tył 6, lewa 4. Krok 2 (w prawo): góra 4, lewa 2 (dawny dół), dół 3, przód 1, tył 6. Krok 3 (do siebie): góra 6 (dawny tył), lewa 2. Krok 4 (w prawo): na górę wchodzi lewa ściana, czyli 2.<\/details><br>\n52. Chcemy przygotować kostkę do gry, naklejając „oczka” na 6 ścian pustej kostki. Łącznie chcemy nakleić 22 oczka tak, żeby na każdej ścianie była inna liczba oczek i na każdej ścianie było przynajmniej jedno oczko. Ściana z największą liczbą oczek będzie zawierała: *(5 pkt)* *(Alfik 2021, zad. 23)*\n    - A) 4 oczka\n    - B) 5 oczek\n    - C) 6 oczek\n    - D) 7 oczek\n    - E) 8 oczek\n    <details><summary>rozwiązanie<\/summary>D — 7 oczek<br>Sześć różnych liczb od 1 w górę daje co najmniej 1 + 2 + 3 + 4 + 5 + 6 = 21. Mamy 22, czyli jedno oczko „za dużo”. Dodać je można tylko do największej liczby (inaczej powtórzyłyby się dwie liczby): 1, 2, 3, 4, 5, 7. Największa ściana ma 7 oczek.<\/details><br>\n53. Kasia ma cztery nietypowe sześcienne kostki do gry – każda z nich ma ściany opisane liczbami 1, 2, 4, 8, 16, 32 (każdą ścianę jedną liczbą). Kasia wykonała rzut tymi czterema kostkami i suma czterech liczb, które wypadły wyniosła 48. Która z poniższych liczb na pewno wypadła na jednej z kostek? *(5 pkt)* *(Alfik 2015, zad. 28)*\n    - A) 2\n    - B) 4\n    - C) 8\n    - D) 16\n    - E) 32\n    <details><summary>rozwiązanie<\/summary>C — 8<br>Bez 16 i 32 cztery kostki dadzą najwyżej 4 · 8 = 32, za mało. Jeśli wypadło 32, pozostałe trzy kostki dają 16: tylko 8 + 4 + 4. Jeśli nie ma 32, to są szesnastki: 16 + 16 + 8 + 8. Są więc tylko dwa rozkłady (32, 8, 4, 4) i (16, 16, 8, 8) — w obu jest 8.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. B — 1\n2. B — 5 *(Alfik 2023, zad. 3)*\n3. B — 5 *(Alfik 2022, zad. 9)*\n4. D — 24 *(Alfik 2019, zad. 10)*\n5. D — 24 *(Alfik 2017, zad. 5)*\n6. C — 32 *(Alfik 2015, zad. 4)*\n7. C — 11\n8. B — 3 *(Alfik 2023, zad. 13)*\n9. B — 3 *(Alfik 2021, zad. 17)*\n10. B — 8 *(Alfik 2019, zad. 13)*\n11. E — taka szachownica nie istnieje *(Alfik 2019, zad. 15)*\n12. D — 8 *(Alfik 2018, zad. 16)*\n13. A — 7 *(Alfik 2018, zad. 17)*\n14. A — 8 *(Alfik 2017, zad. 17)*\n15. B — 8 *(Alfik 2016, zad. 11)*\n16. B — 4\n17. A — 6 *(Alfik 2022, zad. 25)*\n18. D — 6 *(Alfik 2021, zad. 22)*\n19. E — 36 *(Alfik 2016, zad. 24)*\n20. D — 23 *(Alfik 2016, zad. 28)*\n21. D — 14\n22. E — 30\n23. D — 36\n24. A — 24\n25. D — 20\n26. D — 16 *(Alfik 2025, zad. 1)*\n27. D — 6 *(Alfik 2024, zad. 4)*\n28. D — 8 *(Alfik 2022, zad. 8)*\n29. D — 6 cm *(Alfik 2019, zad. 3)*\n30. C — 10 *(Alfik 2017, zad. 4)*\n31. C — 9 cm *(Alfik 2016, zad. 6)*\n32. E — 36 *(Alfik 2015, zad. 2)*\n33. C — 12\n34. E — 20 *(Alfik 2025, zad. 16)*\n35. E — 7 *(Alfik 2022, zad. 12)*\n36. A — 1 cm *(Alfik 2022, zad. 14)*\n37. A — 8 *(Alfik 2022, zad. 19)*\n38. E — więcej niż 6 *(Alfik 2017, zad. 16)*\n39. E — nie da się tak przykryć tej planszy\n40. D — 17 *(Alfik 2023, zad. 23)*\n41. B — 12\n42. D — 4 *(Alfik 2024, zad. 10)*\n43. B — 5 *(Alfik 2023, zad. 7)*\n44. A — 1 *(Alfik 2018, zad. 2)*\n45. C — 17\n46. A — 1\n47. B — 3 *(Alfik 2024, zad. 20)*\n48. C — 4 *(Alfik 2021, zad. 20)*\n49. D — 81 *(Alfik 2019, zad. 12)*\n50. D — 4 *(Alfik 2019, zad. 19)*\n51. A — 2\n52. D — 7 oczek *(Alfik 2021, zad. 23)*\n53. C — 8 *(Alfik 2015, zad. 28)*\n\n## Ściąga\n\n| Co | Fakt / sposób |\n|---|---|\n| Szachownica m × n | gdy m · n parzyste — po równo; gdy nieparzyste — kolor narożnika ma o 1 pole więcej |\n| Kwadraty na kratce n × n | 1 · 1 + 2 · 2 + … + n · n (dla 3 × 3: 14, dla 4 × 4: 30, dla 5 × 5: 55, dla 8 × 8: 204) |\n| Kwadraty k × k na kratce n × n | (n − k + 1) · (n − k + 1) |\n| Cięcia równoległe | k cięć daje k + 1 kawałków; cięcia w dwóch kierunkach: (a + 1) · (b + 1) |\n| Domino | zakrywa zawsze 1 pole białe i 1 czarne; nieparzysta liczba pól → zawsze zostaje co najmniej 1 pole |\n| Przemalowanie wiersza | czarne → białe, białe → czarne; pole na skrzyżowaniu dwóch przemalowanych linii wraca do koloru wyjściowego |\n| Kostka do gry | 1–6, 2–5, 3–4 naprzeciw siebie; suma wszystkich oczek 21 |\n| Siatka „krzyż” | w pasku 4 ścian: 1. naprzeciw 3., 2. naprzeciw 4.; dwie ściany doklejone z boków paska są naprzeciw siebie |\n", "dawne": "08-kratki-szachownice-ciecie"}, {"path": "matematyczny/klasa-5/zadania-wg-typu/09-dzialania-i-wzorki.md", "id": "mat5/09-dzialania-i-wzorki", "kind": "dzial", "short": "09 Działania, ciągi i wzorki", "sek": "mat5", "sekNazwa": "Matematyczny · kl. 5", "md": "# 09. Działania, ciągi i wzorki\n\n**Dlaczego warto:** Zadania z działaniami są w Alfiku co roku: wstawianie znaków i nawiasów, sumy kolejnych liczb, „która liczba będzie na 100. miejscu”, ułamki. Liczenie „na piechotę” zajmuje za dużo czasu — trzeba zauważyć sprytny skrót (pary, powtarzający się wzorek, parzystość).\n\n- **W pliku:** 40 zadań: 15 nowych i 25 z prawdziwych arkuszy Alfika (18 za 3 pkt, 10 za 4 pkt, 12 za 5 pkt).\n\n**Wskazówki**\n- Mnożenie i dzielenie wykonujemy przed dodawaniem i odejmowaniem — chyba że nawiasy mówią inaczej.\n- Zmiana znaku + na − zmienia wynik o liczbę parzystą (o dwa razy tę liczbę). Dlatego parzystość wyniku się nie zmienia!\n- Sumę kolejnych liczb licz parami: pierwsza + ostatnia, druga + przedostatnia… Suma kilku kolejnych liczb = liczba środkowa · ile ich jest.\n- Gdy wzorek się powtarza co k miejsc, podziel numer miejsca przez k i patrz na resztę (reszta 0 = ostatni element wzorku).\n- „Połowa z jednej trzeciej” to mnożenie: ½ · ⅓ = 1/6. Kolejność nie ma znaczenia: połowa z jednej trzeciej = jedna trzecia z połowy.\n\n**Spis treści**\n\n- [A. Łamigłówki z działaniami](#a-łamigłówki-z-działaniami)\n- [B. Sumy i sprytne liczenie](#b-sumy-i-sprytne-liczenie)\n- [C. Ciągi i wzorki](#c-ciągi-i-wzorki)\n- [D. Ułamki: „połowa z jednej trzeciej”](#d-ułamki-połowa-z-jednej-trzeciej)\n- [Klucz odpowiedzi](#klucz-odpowiedzi)\n- [Ściąga](#ściąga)\n\n---\n\n## A. Łamigłówki z działaniami\n\nKwadraty magiczne, nawiasy i wstawianie znaków + oraz −.\n\n1. W kwadracie magicznym 3 × 3 suma liczb w każdym wierszu, w każdej kolumnie i na obu przekątnych jest taka sama. Ala wpisała do takiego kwadratu liczby 5, 6, 7, 8, 9, 10, 11, 12 i 13 (każdą raz). Ile wynosi suma liczb w jednym wierszu? *(3 pkt)*\n   - A) 27\n   - B) 30\n   - C) 36\n   - D) 45\n   - E) 81\n   <details><summary>rozwiązanie<\/summary>A — 27<br>Wszystkie liczby razem: 5 + 6 + … + 13 = 81. Kwadrat ma 3 wiersze o tej samej sumie, a każda liczba leży w dokładnie jednym wierszu. Jeden wiersz ma więc 81 : 3 = 27. Pułapka: 81 to suma całego kwadratu.<\/details><br>\n2. Na każdej ścianie kostki do gry jest od 1 do 6 oczek. Bartek w pięciu rzutach kostką uzyskał łącznie 28 oczek. Ile szóstek wyrzucił, jeśli wiemy, że nie wyrzucił ani jednej piątki? *(3 pkt)* *(Alfik 2025, zad. 2)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) 5\n   <details><summary>rozwiązanie<\/summary>D — 4<br>Pięć szóstek dałoby 30, czyli o 2 za dużo. Brakujące 2 oczka muszą „zniknąć” z jednego rzutu (zamiana 6 na 4) albo z dwóch (6 na 5 i 6 na 5), ale piątek nie było. Zostaje 6 + 6 + 6 + 6 + 4 = 28, czyli 4 szóstki.<\/details><br>\n3. W działaniu 28 + 37 = 69 chcemy zmienić jedną z cyfr tak, aby otrzymać prawdziwą równość. Którą cyfrę musimy zmienić? *(3 pkt)* *(Alfik 2023, zad. 1)*\n   - A) 3\n   - B) 6\n   - C) 7\n   - D) 8\n   - E) 9\n   <details><summary>rozwiązanie<\/summary>E — 9<br>Naprawdę 28 + 37 = 65. Wystarczy zmienić 9 na 5: 28 + 37 = 65. Żeby lewa strona dała 69, trzeba by zwiększyć ją o 4, a zmiana jednej cyfry dziesiątek zmienia sumę o pełne dziesiątki; zmiana 8 na 12 lub 7 na 11 jest niemożliwa — więc zmienić trzeba cyfrę 9.<\/details><br>\n4. Spośród trzech dodatnich liczb jednocyfrowych, druga liczba jest dwa razy większa niż pierwsza, a trzecia liczba jest trzy razy większa niż druga. Ile wynosi suma tych trzech liczb? *(3 pkt)* *(Alfik 2015, zad. 7)*\n   - A) 6\n   - B) 8\n   - C) 9\n   - D) 10\n   - E) 12\n   <details><summary>rozwiązanie<\/summary>C — 9<br>Trzecia liczba jest 2 · 3 = 6 razy większa od pierwszej. Musi być jednocyfrowa, więc pierwsza to 1 (bo 6 · 2 = 12 ma już dwie cyfry). Liczby to 1, 2, 6, a ich suma to 9.<\/details><br>\n5. W wyrażeniu 2 + 4 · 5 − 3 wstawiamy jedną parę nawiasów. Jaki największy wynik możemy otrzymać? *(4 pkt)*\n   - A) 19\n   - B) 21\n   - C) 25\n   - D) 27\n   - E) 30\n   <details><summary>rozwiązanie<\/summary>D — 27<br>Bez nawiasów: 2 + 20 − 3 = 19. Mnożenie powiększa najbardziej, gdy mnożymy coś dużego — wstawmy nawias wokół dodawania: (2 + 4) · 5 − 3 = 30 − 3 = 27. Inne możliwości dają mniej, np. 2 + 4 · (5 − 3) = 10. Pułapka: 30 — zapomniane odjęcie 3 na końcu.<\/details><br>\n6. W wyrażeniu 9 □ 8 □ 7 □ 6 □ 5 w każde okienko wstawiamy znak + albo −. Który z wyników NIE może wyjść? *(4 pkt)*\n   - A) 5\n   - B) 10\n   - C) 13\n   - D) 19\n   - E) 25\n   <details><summary>rozwiązanie<\/summary>B — 10<br>Same plusy dają 35 — liczbę nieparzystą. Zamiana + na − przed liczbą odbiera ją dwa razy (raz nie dodajemy, raz odejmujemy), czyli zmienia wynik o liczbę parzystą. Dlatego wynik zawsze jest nieparzysty i 10 nie może wyjść. Pozostałe wychodzą, np. 9 + 8 + 7 − 6 − 5 = 13, 9 − 8 + 7 + 6 + 5 = 19, 9 + 8 + 7 + 6 − 5 = 25, 9 − 8 − 7 + 6 + 5 = 5.<\/details><br>\n7. Pewną liczbę jednocyfrową pomnożyłem przez 4, a od wyniku mnożenia odjąłem 6. W ten sposób otrzymałem liczbę dwucyfrową o sumie cyfr 5. Jaką liczbę otrzymałem? *(4 pkt)* *(Alfik 2021, zad. 11)*\n   - A) 14\n   - B) 23\n   - C) 32\n   - D) 41\n   - E) 50\n   <details><summary>rozwiązanie<\/summary>A — 14<br>Wynik + 6 musi być wielokrotnością 4 (najwyżej 4 · 9 = 36). Sprawdzamy opcje: 14 + 6 = 20 = 4 · 5 — pasuje. 23 + 6 = 29, 32 + 6 = 38, 41 + 6 = 47 nie dzielą się przez 4, a 50 + 6 = 56 = 4 · 14, ale 14 nie jest jednocyfrowa.<\/details><br>\n8. W miejsce każdej gwiazdki w schemacie 6 * 5 * 4 * 3 * 2 * 1 = 7 chcemy wpisać znak „+” lub „–” tak, aby otrzymać prawdziwe działanie. Ile najwięcej minusów możemy wpisać? *(4 pkt)* *(Alfik 2017, zad. 19)*\n   - A) 4\n   - B) 3\n   - C) 2\n   - D) 1\n   - E) 0\n   <details><summary>rozwiązanie<\/summary>B — 3<br>Same plusy dają 21. Każda liczba ze znakiem minus zmniejsza wynik o dwa razy swoją wartość, więc liczby z minusem muszą mieć sumę (21 − 7) : 2 = 7. Z liczb 5, 4, 3, 2, 1 najwięcej składników daje 4 + 2 + 1 = 7: 6 + 5 − 4 + 3 − 2 − 1 = 7. Czterech liczb o sumie 7 nie wybierzemy (najmniejsza czwórka to 1 + 2 + 3 + 4 = 10).<\/details><br>\n9. W kwadracie magicznym 3 × 3 sumy w każdym wierszu, w każdej kolumnie i na obu przekątnych są równe. W lewym górnym rogu jest liczba 13, w prawym górnym 11, a w lewym dolnym 9. Jaka liczba jest w prawym dolnym rogu? *(5 pkt)*\n   - A) 3\n   - B) 5\n   - C) 6\n   - D) 7\n   - E) 8\n   <details><summary>rozwiązanie<\/summary>D — 7<br>Warto znać sztuczkę: w kwadracie magicznym 3 × 3 suma każdej linii jest 3 razy większa od liczby w środku. Przekątna z prawego górnego do lewego dolnego rogu to 11 + środek + 9, a to ma być równe trzem środkom. Zatem 20 = dwa środki, czyli w środku jest 10, a każda suma wynosi 30. Druga przekątna: 13 + 10 + ? = 30, więc ? = 7. Cały kwadrat: 13, 6, 11 / 8, 10, 12 / 9, 14, 7.<\/details><br>\n10. W działaniu: 1 + 2 + 3 + 4 + 5 + 6 + 7 = 8 niektóre znaki „+” chcemy zamienić na znaki „–” tak, by równość była prawdziwa. Jaka jest najmniejsza liczba zamian, która pozwoli to osiągnąć? *(5 pkt)* *(Alfik 2025, zad. 22)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>A — 2<br>Teraz lewa strona to 28, a ma być 8 — trzeba „zabrać” 20. Zamiana „+ n” na „− n” zmniejsza wynik o 2 · n, więc liczby ze zmienionym znakiem muszą dawać razem 10. Jedna liczba nie wystarczy (największa to 7), ale dwie tak: 3 + 7 = 10. Np. 1 + 2 − 3 + 4 + 5 + 6 − 7 = 8.<\/details><br>\n11. W działaniu: 2 + 3 + 4 + 5 + 6 + 7 + 8 + 9 = 10 należy niektóre ze znaków „+” zastąpić znakami „–” tak, aby otrzymać prawdziwą równość. Ile najmniej znaków trzeba zamienić? *(5 pkt)* *(Alfik 2022, zad. 21)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>B — 2<br>Suma wszystkich liczb to 44. Zmiana „+” na „–” przed liczbą zmniejsza wynik o dwa razy tę liczbę. Trzeba zmniejszyć o 44 − 10 = 34, czyli liczby ze znakiem „–” mają dać razem 17. Jedna liczba to za mało (największa to 9), ale dwie wystarczą: 8 + 9 = 17. Sprawdzenie: 2 + 3 + 4 + 5 + 6 + 7 − 8 − 9 = 10.<\/details><br>\n12. Ile co najmniej znaków „+” w działaniu: 7 + 6 + 5 + 4 + 3 + 2 + 1 = 12 trzeba zastąpić znakami „–”, aby otrzymać prawdziwe działanie? *(5 pkt)* *(Alfik 2021, zad. 24)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>B — 2<br>Teraz lewa strona to 28, a ma być 12 — trzeba zmniejszyć o 16. Zamiana „+ a” na „− a” zmniejsza wynik o 2 · a, więc zamienione liczby muszą dawać razem 8. Jedna liczba z 1–6 nie wystarczy, ale dwie tak: 6 + 2 lub 5 + 3. Np. 7 − 6 + 5 + 4 + 3 − 2 + 1 = 12.<\/details><br>\n\n## B. Sumy i sprytne liczenie\n\nZamiast dodawać po kolei — łącz w pary albo szukaj liczby środkowej.\n\n13. Ile wynosi suma 1 + 2 + 3 + … + 19 + 20? *(3 pkt)*\n    - A) 210\n    - B) 220\n    - C) 231\n    - D) 400\n    - E) 420\n    <details><summary>rozwiązanie<\/summary>A — 210<br>Łączymy w pary: 1 + 20 = 21, 2 + 19 = 21, …, 10 + 11 = 21. Par jest 10, więc suma to 10 · 21 = 210. Pułapka: 420 = 20 · 21 — tyle wyjdzie, gdy zapomnimy, że par jest tylko 10, a nie 20.<\/details><br>\n14. Suma siedmiu kolejnych liczb naturalnych wynosi 98. Jaka jest największa z tych liczb? *(3 pkt)*\n    - A) 14\n    - B) 15\n    - C) 16\n    - D) 17\n    - E) 18\n    <details><summary>rozwiązanie<\/summary>D — 17<br>Liczba środkowa (czwarta z siedmiu) to średnia: 98 : 7 = 14. Liczby to 11, 12, 13, 14, 15, 16, 17 — największa to 17. Sprawdzenie: 11 + 17 = 28, 12 + 16 = 28, 13 + 15 = 28 i jeszcze 14, razem 98. Pułapka: 14 to liczba środkowa, a nie największa.<\/details><br>\n15. Pierwsza godzina parkowania kosztuje 3 zł, a każda kolejna godzina jest o złotówkę droższa od poprzedniej. Ile kosztuje pięciogodzinne parkowanie? *(3 pkt)* *(Alfik 2025, zad. 4)*\n    - A) 24 zł\n    - B) 25 zł\n    - C) 26 zł\n    - D) 27 zł\n    - E) 28 zł\n    <details><summary>rozwiązanie<\/summary>B — 25 zł<br>Kolejne godziny kosztują 3, 4, 5, 6 i 7 zł. Razem 3 + 4 + 5 + 6 + 7 = 25 zł (środkowa cena 5 zł razy 5 godzin).<\/details><br>\n16. Cennik parkingu pewnej galerii handlowej jest następujący: pierwsza godzina parkowania kosztuje 1 zł, a każda kolejna godzina jest o 2 zł droższa od poprzedniej. Ile kosztuje 4-godzinne parkowanie? *(3 pkt)* *(Alfik 2024, zad. 5)*\n    - A) 12 zł\n    - B) 1
