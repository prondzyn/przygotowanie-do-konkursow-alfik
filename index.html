pka D: „kość” to dopełnienie (zakopał co?), a „nasz” to przydawka (pies czyj?).<\/details><br>\n2. W zdaniu ***Poszliśmy wieczorem nad jezioro.***: *(3 pkt)*\n   - A) podmiotem jest wyraz *wieczorem*\n   - B) nie ma orzeczenia\n   - C) podmiot jest domyślny\n   - D) orzeczeniem jest wyraz *jezioro*\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — podmiot jest domyślny<br>Kto poszedł? — my. Wyrazu „my” nie ma w zdaniu, ale poznajemy go po końcówce czasownika „poszliśmy”, więc podmiot jest domyślny. Orzeczeniem jest „poszliśmy”, a „wieczorem” to okolicznik czasu.<\/details><br>\n3. Podmiot wyrażony zaimkiem występuje w zdaniu: *(3 pkt)*\n   - A) ***Kot spał na kanapie.***\n   - B) ***Zobaczyłem ją w parku.***\n   - C) ***Babcia podarowała mi szalik.***\n   - D) ***Nikt nie zapukał do drzwi.***\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — ***Nikt nie zapukał do drzwi.***<br>Kto nie zapukał? — nikt. „Nikt” to zaimek. Pułapka B: „ją” to zaimek, ale jest dopełnieniem (zobaczyłem kogo?); podmiot „ja” jest tam domyślny. W C zaimek „mi” też jest dopełnieniem.<\/details><br>\n4. W zdaniu ***Grzmi.***: *(4 pkt)*\n   - A) podmiotem jest wyraz *grzmi*\n   - B) jest orzeczenie\n   - C) jest podmiot domyślny\n   - D) nie ma czasownika w formie osobowej\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — jest orzeczenie<br>„Grzmi” to czasownik w formie osobowej, więc jest orzeczeniem. Podmiotu nie ma i nie da się go dopowiedzieć (nie wiadomo, kto grzmi) — to zdanie bezpodmiotowe, a nie zdanie z podmiotem domyślnym.<\/details><br>\n5. W zdaniu ***Tomek grał w piłkę, a Kuba odrabiał lekcje.***: *(4 pkt)*\n   - A) są dwa podmioty i dwa orzeczenia\n   - B) jest jeden podmiot i jedno orzeczenie\n   - C) są dwa podmioty i jedno orzeczenie\n   - D) jest jeden podmiot i dwa orzeczenia\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — są dwa podmioty i dwa orzeczenia<br>Kto grał? — Tomek (orzeczenie: grał). Kto odrabiał? — Kuba (orzeczenie: odrabiał). To zdanie złożone z dwóch zdań składowych.<\/details><br>\n6. W zdaniu ***Mamie bardzo spodobał się twój rysunek.***: *(4 pkt)*\n   - A) podmiotem jest wyraz *mamie*\n   - B) podmiotem jest wyraz *twój*\n   - C) orzeczeniem jest wyraz *bardzo*\n   - D) podmiot jest domyślny\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Co się spodobało? — rysunek. To on jest podmiotem, a orzeczeniem jest „spodobał się”. Pułapka A: „mamie” stoi na początku, ale jest w celowniku (komu?), więc to dopełnienie. „Twój” to przydawka, „bardzo” — okolicznik.<\/details><br>\n7. W zdaniu ***Naturalny porządek rzeczy został zachowany***: *(4 pkt)* *(Alfik 2016, zad. 20)*\n   - A) nie ma podmiotu\n   - B) mamy podmiot domyślny\n   - C) podmiot jest wyrażony rzeczownikiem\n   - D) podmiot nie jest wyrażony rzeczownikiem\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — podmiot jest wyrażony rzeczownikiem<br>Co zostało zachowane? — „porządek”. To rzeczownik w mianowniku.<\/details><br>\n8. W zdaniu ***Kaloszy nie było***: *(4 pkt)* *(Alfik 2015, zad. 20)*\n   - A) podmiot wyrażony jest rzeczownikiem w mianowniku\n   - B) nie ma podmiotu\n   - C) podmiot nie jest wyrażony rzeczownikiem\n   - D) podmiot jest wyrażony rzeczownikiem w dopełniaczu\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — podmiot jest wyrażony rzeczownikiem w dopełniaczu<br>Zdanie twierdzące brzmiałoby „Kalosze były” — podmiotem są kalosze. Po zaprzeczeniu „nie było” rzeczownik przechodzi do dopełniacza (kogo? czego? — kaloszy). Uwaga: w szkole często uczy się, że podmiot jest zawsze w mianowniku, i wtedy takie zdanie nazywa się bezpodmiotowym (odpowiedź B); organizator uznał jednak podmiot w dopełniaczu.<\/details><br>\n9. W wypowiedzeniu ***wszyscy kochali (się) w trzynastoletniej artystce:*** *(4 pkt)* *(Alfik 2014, zad. 18)*\n   - A) podmiot nie jest wyrażony rzeczownikiem\n   - B) brak podmiotu\n   - C) podmiot jest domyślny\n   - D) podmiotem jest rzeczownik w mianowniku\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — podmiot nie jest wyrażony rzeczownikiem<br>Podmiot odpowiada na pytanie kto? co? — kto kochał? „wszyscy”. „Wszyscy” to zaimek, nie rzeczownik. Pułapka C: podmiot jest wypowiedziany w zdaniu, więc nie jest domyślny.<\/details><br>\n10. Orzeczeniem w zdaniu ***Jutro będziemy pisać sprawdzian.*** jest: *(5 pkt)*\n    - A) jutro\n    - B) będziemy\n    - C) będziemy pisać\n    - D) pisać sprawdzian\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — będziemy pisać<br>To czasownik w czasie przyszłym złożonym — dwa wyrazy tworzą razem jedno orzeczenie. Pułapka D: „sprawdzian” to dopełnienie (będziemy pisać co?).<\/details><br>\n11. W zdaniu ***Na drzewie za oknem siedziały dwie sroki.***: *(5 pkt)*\n    - A) podmiotem jest wyraz *drzewie*\n    - B) podmiot stoi po orzeczeniu\n    - C) podmiot jest domyślny\n    - D) nie ma orzeczenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — podmiot stoi po orzeczeniu<br>Kto siedział? — sroki. Orzeczenie „siedziały” stoi przed podmiotem. Pułapka: podmiot nie musi być na początku zdania, a „drzewie” nie jest w mianowniku (na czym? — na drzewie).<\/details><br>\n12. Podkreślony wyraz w zdaniu ***Przed nowym władcą stanęło <u>zadanie<\/u> zintegrowania rozległego terytorium*** jest: *(5 pkt)* *(Alfik 2025, zad. 24)*\n    - A) podmiotem\n    - B) orzeczeniem\n    - C) przydawką\n    - D) czasownikiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — podmiotem<br>Pytamy orzeczenie „stanęło”: kto? co stanęło? — zadanie. To podmiot. „Zadanie” to rzeczownik, nie czasownik.<\/details><br>\n13. Wypowiedzenie ***Zarżały konie***: *(5 pkt)* *(Alfik 2024, zad. 25)*\n    - A) nie ma podmiotu\n    - B) zawiera orzeczenie\n    - C) nie jest zdaniem\n    - D) zawiera dopełnienie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — zawiera orzeczenie<br>Orzeczenie mówi, co robi podmiot: „zarżały”. Podmiot to „konie” (kto? co?). Skoro jest orzeczenie, to jest zdanie. Dopełnienia nie ma.<\/details><br>\n14. W zdaniu ***Wtem się coś z dala na polu ukaże***: *(5 pkt)* *(Alfik 2024, zad. 27)*\n    - A) jest podmiot domyślny\n    - B) podmiotem jest wyraz *coś*\n    - C) podmiotem jest rzeczownik\n    - D) nie ma orzeczenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — podmiotem jest wyraz *coś*<br>Pytamy orzeczenie „ukaże się”: kto? co? — coś. Podmiot jest więc wyrażony, ale to zaimek, a nie rzeczownik. „Polu” to rzeczownik, ale w miejscowniku (na czym?).<\/details><br>\n15. Podkreślony wyraz w zdaniu ***nieforemna jego <u>postać<\/u> nie nadawała się do ról znakomitych bohaterów***: *(5 pkt)* *(Alfik 2022, zad. 22)*\n    - A) to podmiot gramatyczny\n    - B) jest rzeczownikiem w formie dopełniacza\n    - C) jest dopełnieniem\n    - D) to podmiot logiczny\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — to podmiot gramatyczny<br>Kto? co? nie nadawała się? — *postać*. To podmiot w mianowniku, czyli zwykły podmiot gramatyczny, z którym orzeczenie zgadza się formą (postać nadawała się).<\/details><br>\n16. W wypowiedzeniu ***Postaw się teraz w tego lisa położeniu!***: *(5 pkt)* *(Alfik 2021, zad. 22)*\n    - A) nie ma podmiotu\n    - B) występuje podmiot domyślny\n    - C) nie ma orzeczenia\n    - D) podmiotem jest wyraz *lisa*\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — występuje podmiot domyślny<br>*Postaw się* to orzeczenie w trybie rozkazującym, w 2. osobie: (ty) postaw się. Podmiotu „ty” nie ma w zdaniu, ale go się domyślamy — to podmiot domyślny. *Lisa* to przydawka (położeniu czyim?).<\/details><br>\n17. W wypowiedzeniu ***wody nie było***: *(5 pkt)* *(Alfik 2021, zad. 23)*\n    - A) występuje podmiot domyślny\n    - B) podmiot nie jest wyrażony za pomocą rzeczownika\n    - C) podmiot ma formę mianownika\n    - D) podmiotem jest rzeczownik w dopełniaczu\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — podmiotem jest rzeczownik w dopełniaczu<br>Porównaj: „Woda była” (podmiot w mianowniku) i „Wody nie było”. Po zaprzeczeniu „nie było” podmiot zmienia formę na dopełniacz (kogo? czego? — wody).<\/details><br>\n18. W wypowiedzeniu ***Nasz lis takich głupstw nie robił***: *(5 pkt)* *(Alfik 2021, zad. 27)*\n    - A) podmiotem jest wyraz *głupstw*\n    - B) nie ma określeń rzeczownika\n    - C) tylko jeden rzeczownik ma określenie\n    - D) podmiotem jest wyraz *lis*\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — podmiotem jest wyraz *lis*<br>Kto nie robił? — *lis*. *Głupstw* to dopełnienie (nie robił czego?). Oba rzeczowniki mają określenia: lis (czyj?) *nasz*, głupstw (jakich?) *takich*, więc B i C odpadają.<\/details><br>\n19. W zdaniu ***Nagle ją coś poderwało***: *(5 pkt)* *(Alfik 2019, zad. 22)*\n    - A) nie ma podmiotu\n    - B) jest podmiot domyślny\n    - C) podmiotem jest wyraz *nagle*\n    - D) podmiotem jest wyraz *coś*\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — podmiotem jest wyraz *coś*<br>Podmiot odpowiada na pytanie kto? co? wykonuje czynność: co poderwało? — *coś*. *Ją* to dopełnienie (poderwało kogo?), a *nagle* to okolicznik (jak?).<\/details><br>\n20. Podmiotem w wypowiedzeniu ***(…) postępki twoje budzą niepokój w ludziach prostego ducha*** jest wyraz: *(5 pkt)* *(Alfik 2018, zad. 25)*\n    - A) twoje\n    - B) postępki\n    - C) niepokój\n    - D) ludziach\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — postępki<br>Podmiot odpowiada na pytanie kto? co? wykonuje czynność: co budzi niepokój? — *postępki*. Pułapka: *niepokój* to dopełnienie (budzą co?), a *twoje* to przydawka (postępki czyje?).<\/details><br>\n21. W zdaniu ***Reumatyzmy jakieś łupią***: *(5 pkt)* *(Alfik 2017, zad. 26)*\n    - A) jest podmiot domyślny\n    - B) podmiotem jest wyraz *reumatyzmy*\n    - C) brak podmiotu\n    - D) brak orzeczenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — podmiotem jest wyraz *reumatyzmy*<br>Co łupie? — „reumatyzmy”: rzeczownik w mianowniku, więc to podmiot. Orzeczenie to „łupią” (łupać — tu: boleć, łamać w kościach).<\/details><br>\n22. W zdaniu ***Irenka myślała o nim często***: *(5 pkt)* *(Alfik 2016, zad. 27)*\n    - A) podmiot wyrażony jest zaimkiem\n    - B) mamy podmiot domyślny\n    - C) jest podmiot gramatyczny\n    - D) nie ma podmiotu\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest podmiot gramatyczny<br>Kto myślała? — „Irenka”: rzeczownik w mianowniku, czyli podmiot gramatyczny. Pułapka A: zaimkiem jest „nim”, ale to nie podmiot, tylko dopełnienie (o kim?).<\/details><br>\n23. W zdaniu ***Wtedy pytała wiatru, kto kogo przegoni***: *(5 pkt)* *(Alfik 2016, zad. 28)*\n    - A) jest jedno orzeczenie\n    - B) są dwa orzeczenia\n    - C) orzeczenie wyrażone jest czasownikiem w formie nieosobowej\n    - D) nie ma orzeczenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — są dwa orzeczenia<br>Orzeczenie to czasownik w formie osobowej mówiący, co robi podmiot. Tu są dwa: „pytała” i „przegoni” — to zdanie złożone.<\/details><br>\n24. W zdaniu ***Na widok wchodzącego Partacza wszyscy zastygli nieruchomo***: *(5 pkt)* *(Alfik 2015, zad. 28)*\n    - A) orzeczeniem nie jest czasownik w formie osobowej\n    - B) podmiotem nie jest rzeczownik\n    - C) są dwa orzeczenia\n    - D) brakuje orzeczenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — podmiotem nie jest rzeczownik<br>Kto zastygł? — „wszyscy”. To zaimek, nie rzeczownik. Orzeczenie jest jedno: „zastygli” (czasownik w formie osobowej). Pułapka C: „wchodzącego” to imiesłów, nie orzeczenie.<\/details><br>\n\n## B. Przydawka, dopełnienie, okolicznik\n\nPrzydawka określa rzeczownik, a dopełnienie i okolicznik — czasownik. Pomagają pytania.\n\n25. Wyraz ***ciekawą*** w zdaniu ***Ania czyta ciekawą książkę.*** jest: *(3 pkt)*\n    - A) dopełnieniem\n    - B) okolicznikiem\n    - C) orzeczeniem\n    - D) przydawką\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — przydawką<br>Książkę jaką? — ciekawą. Wyraz określa rzeczownik, więc jest przydawką. Dopełnieniem jest „książkę” (czyta co?).<\/details><br>\n26. Dopełnieniami w zdaniu ***Kupiłem bratu nowy rower.*** są wyrazy: *(3 pkt)*\n    - A) kupiłem, rower\n    - B) bratu, rower\n    - C) nowy, rower\n    - D) bratu, nowy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — bratu, rower<br>Kupiłem komu? — bratu. Kupiłem co? — rower. Oba wyrazy określają czasownik i odpowiadają na pytania przypadków, więc są dopełnieniami. „Nowy” to przydawka (rower jaki?), a „kupiłem” — orzeczenie.<\/details><br>\n27. Okolicznik miejsca występuje w zdaniu: *(3 pkt)*\n    - A) ***Babcia mieszka nad morzem.***\n    - B) ***Rano zjadłam owsiankę.***\n    - C) ***Piotr szybko biegał.***\n    - D) ***Zuzia dostała list od kuzynki.***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — ***Babcia mieszka nad morzem.***<br>Mieszka gdzie? — nad morzem. To okolicznik miejsca. „Rano” to okolicznik czasu (kiedy?), „szybko” — sposobu (jak?), a „od kuzynki” to dopełnienie (od kogo?).<\/details><br>\n28. Wyraz ***wczoraj*** w zdaniu ***Wczoraj babcia upiekła szarlotkę.*** jest: *(4 pkt)*\n    - A) przydawką\n    - B) dopełnieniem\n    - C) okolicznikiem miejsca\n    - D) okolicznikiem sposobu\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Upiekła kiedy? — wczoraj. To okolicznik czasu, a takiej odpowiedzi wśród A–D nie ma.<\/details><br>\n29. Przydawka NIE występuje w zdaniu: *(4 pkt)*\n    - A) ***Mój brat gra na gitarze.***\n    - B) ***Zjedliśmy trzy pączki.***\n    - C) ***Zielona żaba skoczyła do stawu.***\n    - D) ***Wieczorem padał deszcz.***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — ***Wieczorem padał deszcz.***<br>Tu „deszcz” to podmiot, „padał” — orzeczenie, a „wieczorem” — okolicznik czasu; nic nie określa rzeczownika. W pozostałych są przydawki: brat czyj? — mój; pączki ile? — trzy; żaba jaka? — zielona.<\/details><br>\n30. W zdaniu ***Zgubiłem wczoraj klucze od domu.*** wyrażenie ***od domu*** jest: *(4 pkt)*\n    - A) dopełnieniem\n    - B) okolicznikiem miejsca\n    - C) przydawką\n    - D) podmiotem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — przydawką<br>Klucze jakie? (od czego?) — od domu. Wyrażenie określa rzeczownik „klucze”, więc jest przydawką. Pułapka B: nie mówi, skąd zgubiłem, tylko jakie to klucze.<\/details><br>\n31. Wyrażenie ***z powodu choroby*** w zdaniu ***Z powodu choroby Kasia nie przyszła na urodziny.*** jest: *(5 pkt)*\n    - A) okolicznikiem przyczyny\n    - B) okolicznikiem czasu\n    - C) okolicznikiem celu\n    - D) dopełnieniem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — okolicznikiem przyczyny<br>Nie przyszła dlaczego? z jakiego powodu? — z powodu choroby. Okolicznik celu odpowiadałby na pytanie „po co?”.<\/details><br>\n32. W zdaniu ***Tata podarował mamie piękne kwiaty.***: *(5 pkt)*\n    - A) są dwie przydawki\n    - B) nie ma dopełnienia\n    - C) są dwa dopełnienia\n    - D) nie ma przydawki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — są dwa dopełnienia<br>Podarował komu? — mamie. Podarował co? — kwiaty. To dwa dopełnienia. Przydawka jest jedna: kwiaty jakie? — piękne.<\/details><br>\n33. Podkreślony wyraz w sformułowaniu ***Dawano mu do odgrywania role <u>małe<\/u>*** jest: *(5 pkt)* *(Alfik 2022, zad. 21)*\n    - A) dopełnieniem\n    - B) okolicznikiem\n    - C) przydawką\n    - D) podmiotem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — przydawką<br>Przydawka określa rzeczownik i odpowiada na pytania jaki? który? czyj? — role (jakie?) *małe*. Pułapka A: dopełnieniem jest *role* (dawano co?), a nie *małe*.<\/details><br>\n34. W wypowiedzeniu ***Bóg to tylko wiedzieć raczy***: *(5 pkt)* *(Alfik 2017, zad. 28)*\n    - A) występuje dopełnienie\n    - B) jest tylko jeden czasownik\n    - C) nie występuje czasownik w formie osobowej\n    - D) wszystkie czasowniki mają formę osobową\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — występuje dopełnienie<br>Dopełnienie odpowiada na pytania przypadków zależnych (kogo? czego? co?…). Raczy wiedzieć co? — „to”. Czasowniki są dwa: „raczy” (forma osobowa) i „wiedzieć” (bezokolicznik), więc B, C i D odpadają.<\/details><br>\n\n## C. Rodzaje zdań i wypowiedzeń\n\nZdanie ma orzeczenie, równoważnik zdania — nie ma. Ile orzeczeń, tyle zdań składowych.\n\n35. Wypowiedzenie ***Cisza na sali!*** jest: *(3 pkt)*\n    - A) zdaniem pojedynczym\n    - B) równoważnikiem zdania\n    - C) zdaniem złożonym\n    - D) zdaniem pytającym\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — równoważnikiem zdania<br>W tym wypowiedzeniu nie ma czasownika w formie osobowej, czyli nie ma orzeczenia. Takie wypowiedzenie to równoważnik zdania.<\/details><br>\n36. Zdaniem złożonym jest wypowiedzenie: *(3 pkt)*\n    - A) ***Wieczorem długo czytałam książkę.***\n    - B) ***Uwaga, zły pies!***\n    - C) ***Mój starszy brat świetnie pływa.***\n    - D) ***Zadzwonił dzwonek i wszyscy wybiegli na korytarz.***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — ***Zadzwonił dzwonek i wszyscy wybiegli na korytarz.***<br>Są tu dwa orzeczenia: „zadzwonił” i „wybiegli”, więc to zdanie złożone. A i C mają po jednym orzeczeniu (zdania pojedyncze), a B nie ma żadnego (równoważnik zdania).<\/details><br>\n37. Zdaniem nierozwiniętym jest: *(3 pkt)*\n    - A) ***Kot śpi.***\n    - B) ***Mały kot śpi.***\n    - C) ***Kot śpi na fotelu.***\n    - D) ***Nasz kot śpi.***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — ***Kot śpi.***<br>Zdanie nierozwinięte ma tylko podmiot i orzeczenie. W pozostałych są dodatkowe określenia: „mały” i „nasz” (przydawki), „na fotelu” (okolicznik miejsca).<\/details><br>\n38. Wypowiedzenie ***Zrobiło się ciemno, więc zapaliliśmy lampę.*** jest: *(4 pkt)*\n    - A) zdaniem pojedynczym\n    - B) zdaniem złożonym współrzędnie\n    - C) zdaniem złożonym podrzędnie\n    - D) równoważnikiem zdania\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — zdaniem złożonym współrzędnie<br>Są dwa orzeczenia (zrobiło się, zapaliliśmy). Obie części są równorzędne — żadna nie odpowiada na pytanie zadane drugiej — a spójnik „więc” wskazuje na wynik. To zdanie złożone współrzędnie.<\/details><br>\n39. Wypowiedzenie ***Nie wiem, gdzie położyłem zeszyt.*** jest: *(4 pkt)*\n    - A) zdaniem pojedynczym\n    - B) zdaniem złożonym współrzędnie\n    - C) równoważnikiem zdania\n    - D) zdaniem złożonym podrzędnie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — zdaniem złożonym podrzędnie<br>Są dwa orzeczenia (nie wiem, położyłem). Druga część odpowiada na pytanie zadane pierwszej: nie wiem czego? — gdzie położyłem zeszyt. Zależy więc od pierwszej, czyli zdanie jest złożone podrzędnie.<\/details><br>\n40. W wypowiedzeniu ***Na stole kolorowe kwiaty w wazonie.***: *(4 pkt)*\n    - A) jest orzeczenie\n    - B) jest podmiot domyślny\n    - C) są dwa zdania składowe\n    - D) nie ma czasownika w formie osobowej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — nie ma czasownika w formie osobowej<br>W tym wypowiedzeniu nie ma żadnego czasownika, więc nie ma też orzeczenia — to równoważnik zdania. Pułapka: wypowiedzenie jest długie i ma sens, ale to nie wystarczy, żeby było zdaniem.<\/details><br>\n41. Wypowiedzenie ***Upłynęła jednak dłuższa chwila, zanim Partacz wszedł do sali zajęć***: *(4 pkt)* *(Alfik 2015, zad. 16)*\n    - A) jest zdaniem złożonym współrzędnie\n    - B) jest równoważnikiem zdania\n    - C) jest zdaniem złożonym podrzędnie\n    - D) jest zdaniem pojedynczym\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest zdaniem złożonym podrzędnie<br>Są dwa orzeczenia (upłynęła, wszedł), więc to zdanie złożone. Druga część zaczyna się od „zanim” i odpowiada na pytanie „kiedy upłynęła chwila?” — zależy od pierwszej, czyli zdanie jest złożone podrzędnie.<\/details><br>\n42. Ile orzeczeń jest w wypowiedzeniu ***Kiedy wróciłem do domu, mama gotowała obiad, a tata czytał gazetę.***? *(5 pkt)*\n    - A) jedno\n    - B) dwa\n    - C) trzy\n    - D) cztery\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — trzy<br>Orzeczenia to: „wróciłem”, „gotowała” i „czytał”. To zdanie złożone z trzech zdań składowych. Pułapka: „kiedy” to nie czasownik, tylko wyraz łączący zdania.<\/details><br>\n43. Równoważnikiem zdania jest wypowiedzenie: *(5 pkt)*\n    - A) ***Mama piecze ciasto.***\n    - B) ***Chodźmy już!***\n    - C) ***Zaczęło padać.***\n    - D) ***Gdzie jesteś?***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Każde z tych wypowiedzeń ma czasownik w formie osobowej: „piecze”, „chodźmy”, „zaczęło”, „jesteś”. Wszystkie są więc zdaniami. Pułapka: krótkie wypowiedzenie (B, D) też może być zdaniem — liczy się orzeczenie, nie długość.<\/details><br>\n44. Zdaniem nie jest wypowiedzenie: *(5 pkt)* *(Alfik 2022, zad. 30)*\n    - A) mógłby odnieść zwycięstwo\n    - B) jęczał głucho\n    - C) nadobnie mówiącej wierszami\n    - D) wychodził na scenę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — nadobnie mówiącej wierszami<br>Zdanie musi mieć czasownik w formie osobowej (orzeczenie). W A, B i D są: *mógłby odnieść*, *jęczał*, *wychodził*. W C *mówiącej* to imiesłów, a nie osobowa forma czasownika, więc to nie jest zdanie.<\/details><br>\n45. Zdanie ***(…) dzisiaj jest pierwszy dzień wakacji***: *(5 pkt)* *(Alfik 2018, zad. 22)*\n    - A) nie zawiera przydawki\n    - B) zawiera jedną przydawkę\n    - C) jest zdaniem złożonym współrzędnie\n    - D) jest zdaniem pojedynczym\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — jest zdaniem pojedynczym<br>Jest tu tylko jedno orzeczenie (*jest*), więc to zdanie pojedyncze. Przydawka określa rzeczownik i odpowiada na pytania jaki? który? czyj? czego? — tu są dwie: dzień (który?) *pierwszy* i dzień (czego?) *wakacji*, więc A i B odpadają.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. A — pies\n2. C — podmiot jest domyślny\n3. D — ***Nikt nie zapukał do drzwi.***\n4. B — jest orzeczenie\n5. A — są dwa podmioty i dwa orzeczenia\n6. E — żadna z powyższych\n7. C — podmiot jest wyrażony rzeczownikiem *(Alfik 2016, zad. 20)*\n8. D — podmiot jest wyrażony rzeczownikiem w dopełniaczu *(Alfik 2015, zad. 20)*\n9. A — podmiot nie jest wyrażony rzeczownikiem *(Alfik 2014, zad. 18)*\n10. C — będziemy pisać\n11. B — podmiot stoi po orzeczeniu\n12. A — podmiotem *(Alfik 2025, zad. 24)*\n13. B — zawiera orzeczenie *(Alfik 2024, zad. 25)*\n14. B — podmiotem jest wyraz *coś* *(Alfik 2024, zad. 27)*\n15. A — to podmiot gramatyczny *(Alfik 2022, zad. 22)*\n16. B — występuje podmiot domyślny *(Alfik 2021, zad. 22)*\n17. D — podmiotem jest rzeczownik w dopełniaczu *(Alfik 2021, zad. 23)*\n18. D — podmiotem jest wyraz *lis* *(Alfik 2021, zad. 27)*\n19. D — podmiotem jest wyraz *coś* *(Alfik 2019, zad. 22)*\n20. B — postępki *(Alfik 2018, zad. 25)*\n21. B — podmiotem jest wyraz *reumatyzmy* *(Alfik 2017, zad. 26)*\n22. C — jest podmiot gramatyczny *(Alfik 2016, zad. 27)*\n23. B — są dwa orzeczenia *(Alfik 2016, zad. 28)*\n24. B — podmiotem nie jest rzeczownik *(Alfik 2015, zad. 28)*\n25. D — przydawką\n26. B — bratu, rower\n27. A — ***Babcia mieszka nad morzem.***\n28. E — żadna z powyższych\n29. D — ***Wieczorem padał deszcz.***\n30. C — przydawką\n31. A — okolicznikiem przyczyny\n32. C — są dwa dopełnienia\n33. C — przydawką *(Alfik 2022, zad. 21)*\n34. A — występuje dopełnienie *(Alfik 2017, zad. 28)*\n35. B — równoważnikiem zdania\n36. D — ***Zadzwonił dzwonek i wszyscy wybiegli na korytarz.***\n37. A — ***Kot śpi.***\n38. B — zdaniem złożonym współrzędnie\n39. D — zdaniem złożonym podrzędnie\n40. D — nie ma czasownika w formie osobowej\n41. C — jest zdaniem złożonym podrzędnie *(Alfik 2015, zad. 16)*\n42. C — trzy\n43. E — żadna z powyższych\n44. C — nadobnie mówiącej wierszami *(Alfik 2022, zad. 30)*\n45. D — jest zdaniem pojedynczym *(Alfik 2018, zad. 22)*\n\n## Ściąga\n\n| Część zdania / rodzaj | Jak rozpoznać |\n|---|---|\n| Orzeczenie | czasownik w formie osobowej: co robi? co się z nim dzieje? (*czyta*, *będziemy pisać*) |\n| Podmiot | kto? co? — w mianowniku; może stać po orzeczeniu (*Siedziały <u>sroki<\/u>.*) |\n| Podmiot domyślny | brak w zdaniu, widać go po końcówce czasownika (*Poszliśmy* → my) |\n| Zdanie bezpodmiotowe | podmiotu nie da się dopowiedzieć (*Grzmi.*, *Zrobiło się ciemno.*) |\n| Przydawka | określa rzeczownik: jaki? który? czyj? ile? z czego? (*ciekawą książkę*, *klucze od domu*) |\n| Dopełnienie | określa czasownik, pytania przypadków: kogo? czego? komu? co? z kim? o czym? |\n| Okolicznik | określa czasownik: gdzie? (miejsca), kiedy? (czasu), jak? (sposobu), dlaczego? (przyczyny), po co? (celu) |\n| Zdanie nierozwinięte / rozwinięte | tylko podmiot i orzeczenie / także inne określenia |\n| Zdanie pojedyncze / złożone | jedno orzeczenie / dwa lub więcej (ile orzeczeń, tyle zdań składowych) |\n| Złożone współrzędnie | części równorzędne: *i, a, ale, lecz, więc, albo* |\n| Złożone podrzędnie | jedna część odpowiada na pytanie drugiej: *że, gdy, kiedy, gdzie, bo, który, jeśli* |\n| Równoważnik zdania | brak czasownika w formie osobowej (*Cisza na sali!*, *Uwaga, zły pies!*) |\n"}, {"path": "humanistyczny/klasa-5/zadania-wg-typu/07-gloski-litery-sylaby-ortografia.md", "id": "hum5/07-gloski-litery-sylaby-ortografia", "kind": "dzial", "short": "07 Głoski, litery, sylaby i ortografia", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# 07. Głoski, litery, sylaby i ortografia\n\n**Dlaczego warto:** Pod koniec prawie każdego arkusza Alfika jest pytanie za 5 punktów o liczbę sylab, głosek albo samogłosek w wyrazie, a czasem także o pisownię (*nie* z różnymi częściami mowy). Pułapki są zawsze te same: dwuznaki (*sz*, *rz*, *ch*…) i litera *i*, która często tylko zmiękcza, a nie jest samogłoską.\n\n- **W pliku:** 53 zadań: 24 nowych i 29 z prawdziwych arkuszy Alfika (9 za 3 pkt, 14 za 4 pkt, 30 za 5 pkt).\n\n**Wskazówki**\n- Litery piszemy, głoski słyszymy. Dwuznak (*ch, cz, dz, dź, dż, rz, sz*) to dwie litery, ale jedna głoska.\n- Litera *i* przed samogłoską tylko zmiękcza: *siano* = [ś-a-n-o], *dziecko* = [dź-e-c-k-o]. Wtedy nie jest ani osobną głoską, ani samogłoską.\n- Samogłoski: *a, ą, e, ę, i, o, ó, u, y*. Litery *j* i *ł* to spółgłoski.\n- Sylab w wyrazie jest tyle, ile samogłosek (licząc tylko te *i*, które nie zmiękczają): *wio-sna* — 2 sylaby.\n- *Nie* z czasownikami piszemy osobno (*nie wiem*), z przymiotnikami i przysłówkami od nich utworzonymi w stopniu równym — łącznie (*nieładny*, *niedaleko*), w stopniu wyższym i najwyższym — osobno (*nie szybciej*).\n- *Ó* piszemy, gdy wymienia się na *o* (*stół – stoły*), a *rz* — gdy wymienia się na *r* (*morze – morski*) albo stoi po spółgłoskach *b, p, d, t, g, k, ch, j, w* (*brzoza, krzak*).\n- Przecinek stawiamy przed *że, bo, który, gdzie, jeśli, a, ale, więc*; przed pojedynczym *i* — nie.\n\n**Spis treści**\n\n- [A. Głoski i litery](#a-głoski-i-litery)\n- [B. Samogłoski, spółgłoski i sylaby](#b-samogłoski-spółgłoski-i-sylaby)\n- [C. Ortografia i interpunkcja](#c-ortografia-i-interpunkcja)\n- [Klucz odpowiedzi](#klucz-odpowiedzi)\n- [Ściąga](#ściąga)\n\n---\n\n## A. Głoski i litery\n\nGłoska to dźwięk, litera to znak pisma. Czasem jedną głoskę zapisujemy dwiema literami.\n\n1. Dwuznak występuje w wyrazie: *(3 pkt)*\n   - A) dach\n   - B) koza\n   - C) okno\n   - D) lato\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — dach<br>W wyrazie „dach” jest dwuznak „ch” — dwie litery oznaczające jedną głoskę. Pozostałe wyrazy zapisano pojedynczymi literami.<\/details><br>\n2. Wyraz ***szkoła*** ma: *(3 pkt)*\n   - A) 6 liter i 6 głosek\n   - B) 6 liter i 5 głosek\n   - C) 5 liter i 6 głosek\n   - D) 5 liter i 5 głosek\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — 6 liter i 5 głosek<br>Litery: s-z-k-o-ł-a (6). Głoski: sz-k-o-ł-a (5), bo „sz” to dwie litery, ale jedna głoska.<\/details><br>\n3. Tyle samo liter co głosek jest w wyrazie: *(3 pkt)*\n   - A) rzeka\n   - B) cień\n   - C) mama\n   - D) chata\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — mama<br>„Mama” ma 4 litery i 4 głoski. W „rzeka” i „chata” są dwuznaki (rz, ch), a w „cień” litera i tylko zmiękcza c — tam liter jest więcej niż głosek.<\/details><br>\n4. Litera ***i*** oznacza tylko zmiękczenie (nie jest samogłoską) w wyrazie: *(4 pkt)*\n   - A) igła\n   - B) kino\n   - C) mysz\n   - D) siano\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — siano<br>W „siano” po i stoi samogłoska a, więc i tylko zmiękcza s: słyszymy [śano]. W „igła” i „kino” i jest samogłoską (i-gła, ki-no). W „mysz” nie ma litery i.<\/details><br>\n5. Wyraz ***dziecko*** ma: *(4 pkt)*\n   - A) 7 liter i 5 głosek\n   - B) 7 liter i 6 głosek\n   - C) 6 liter i 5 głosek\n   - D) 7 liter i 7 głosek\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — 7 liter i 5 głosek<br>Litery: d-z-i-e-c-k-o (7). Głoski: dź-e-c-k-o (5). Trzy litery „dzi” zapisują tu jedną głoskę [dź], bo i tylko zmiękcza.<\/details><br>\n6. W wyrazie ***wszyscy***: *(4 pkt)* *(Alfik 2023, zad. 16)*\n   - A) jest jedna sylaba\n   - B) jest jedna samogłoska\n   - C) jest więcej liter niż głosek\n   - D) jest pięć spółgłosek\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — jest więcej liter niż głosek<br>Liter jest 7 (w-s-z-y-s-c-y), a głosek 6, bo „sz” to dwie litery, ale jedna głoska. Sylaby są dwie (wszy-scy), samogłoski dwie (y, y), a spółgłoski cztery: w (czytane jak f), sz, s, c. Pułapka: liter spółgłoskowych jest 5, ale głosek tylko 4.<\/details><br>\n7. Głoska zapisywana za pomocą dwóch liter znajduje się w wyrazie: *(4 pkt)* *(Alfik 2016, zad. 18)*\n   - A) zdrowym\n   - B) porządek\n   - C) nagle\n   - D) młodość\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — porządek<br>W „porządek” jest dwuznak „rz” — dwie litery, jedna głoska [ż]. Pułapka A: w „zdrowym” z i d to osobne głoski. W „młodość” ś i ć zapisano pojedynczymi literami.<\/details><br>\n8. Najwięcej głosek ma wyraz: *(5 pkt)*\n   - A) chrząszcz\n   - B) szczyt\n   - C) lato\n   - D) mrówka\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — mrówka<br>Mrówka: m-r-ó-w-k-a — 6 głosek. Chrząszcz: ch-rz-ą-sz-cz — tylko 5 głosek, szczyt: sz-cz-y-t — 4, lato — 4. Pułapka A: „chrząszcz” ma najwięcej liter (9), ale aż cztery dwuznaki.<\/details><br>\n9. Głoskę [ś] zapisano literą ***ś*** w wyrazie: *(5 pkt)*\n   - A) siano\n   - B) siwy\n   - C) prosiak\n   - D) Kasia\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>We wszystkich czterech wyrazach głoskę [ś] zapisano literą s, po której stoi i (si), a nie literą „ś”. Literę ś piszemy na końcu wyrazu lub przed spółgłoską (np. ktoś, świat).<\/details><br>\n10. Wyrazy ***pianie*** i ***koguta***: *(5 pkt)* *(Alfik 2023, zad. 28)*\n    - A) mają tyle samo liter\n    - B) są różnymi częściami mowy\n    - C) są w tym samym przypadku\n    - D) mają tyle samo sylab\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — mają tyle samo liter<br>P-i-a-n-i-e i k-o-g-u-t-a — po 6 liter. Oba to rzeczowniki, ale „pianie” jest w mianowniku, a „koguta” w dopełniaczu. Sylab jest 2 (pia-nie) i 3 (ko-gu-ta).<\/details><br>\n11. W wyrazie ***pisarz***: *(5 pkt)* *(Alfik 2019, zad. 30)*\n    - A) są trzy sylaby\n    - B) są cztery spółgłoski\n    - C) są trzy samogłoski\n    - D) jest więcej liter niż głosek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — jest więcej liter niż głosek<br>Pi-sarz ma 6 liter (p, i, s, a, r, z), ale 5 głosek, bo dwuznak *rz* to jedna głoska. Sylaby są 2, samogłoski 2 (i, a), spółgłoski 3 (p, s, rz).<\/details><br>\n12. Więcej liter niż głosek jest w wyrazie: *(5 pkt)* *(Alfik 2017, zad. 23)*\n    - A) byle\n    - B) zna\n    - C) fircykować\n    - D) czasami\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — czasami<br>W „czasami” jest dwuznak „cz” — dwie litery, jedna głoska. Liter jest 7, głosek 6. W pozostałych wyrazach każda litera to osobna głoska.<\/details><br>\n\n## B. Samogłoski, spółgłoski i sylaby\n\nSamogłosek jest w polskim dziewięć, a sylab w wyrazie jest tyle, ile samogłosek.\n\n13. Ile sylab ma wyraz ***pomarańcza***? *(3 pkt)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — 4<br>Po-ma-rań-cza: cztery samogłoski (o, a, a, a), więc cztery sylaby.<\/details><br>\n14. Same samogłoski są w zestawie: *(3 pkt)*\n    - A) a, e, ł\n    - B) y, j, i\n    - C) o, ó, u\n    - D) ą, ć, e\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — o, ó, u<br>Samogłoski to: a, ą, e, ę, i, o, ó, u, y. Litery ł, j i ć oznaczają spółgłoski. Pułapka: „ó” też jest samogłoską.<\/details><br>\n15. Poprawnie podzielono na sylaby wyraz: *(3 pkt)*\n    - A) mal-ina\n    - B) dom-ek\n    - C) ko-tl-et\n    - D) ma-li-na\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — ma-li-na<br>Każda sylaba musi mieć jedną samogłoskę: ma-li-na. W „ko-tl-et” środkowa część nie ma samogłoski, a w „mal-ina” i „dom-ek” druga sylaba zaczyna się od samogłoski, choć przed nią stoi pojedyncza spółgłoska (powinno być: do-mek).<\/details><br>\n16. Wyraz ***wiosna*** ma: *(4 pkt)*\n    - A) dwie sylaby\n    - B) trzy sylaby\n    - C) trzy samogłoski\n    - D) tyle samo liter co głosek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — dwie sylaby<br>Wio-sna: samogłoski to tylko o i a, bo i przed o tylko zmiękcza w. Liter jest 6, a głosek 5. Pułapka B i C: litera i nie tworzy tu osobnej sylaby.<\/details><br>\n17. Więcej samogłosek niż spółgłosek jest w wyrazie: *(4 pkt)*\n    - A) okno\n    - B) aleja\n    - C) kotek\n    - D) szafa\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — aleja<br>A-l-e-j-a: samogłoski a, e, a (3), spółgłoski l, j (2). W „okno” i „szafa” jest po równo (2 i 2; „sz” to jedna głoska), a w „kotek” więcej jest spółgłosek. Pułapka: j to spółgłoska.<\/details><br>\n18. Wyrazem trzysylabowym jest: *(4 pkt)*\n    - A) księżyc\n    - B) kwiat\n    - C) ziemniaki\n    - D) pociąg\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — ziemniaki<br>Ziem-nia-ki — trzy sylaby. Księ-życ i po-ciąg mają po dwie, a kwiat — jedną. Pułapka: w „ziemniaki” są trzy litery i, ale tylko ostatnie i jest samogłoską; dwa pierwsze tylko zmiękczają.<\/details><br>\n19. Wyraz ***nic***: *(4 pkt)* *(Alfik 2022, zad. 18)*\n    - A) ma dwie sylaby\n    - B) ma dwie samogłoski\n    - C) jest jednosylabowy\n    - D) nie odmienia się przez przypadki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest jednosylabowy<br>W *nic* jest jedna samogłoska — i, więc jedna sylaba. Pułapka D: *nic* się odmienia: niczego, niczemu, niczym.<\/details><br>\n20. W zdaniu ***Irence przybyło trzy lata***: *(4 pkt)* *(Alfik 2016, zad. 16)*\n    - A) jest jeden wyraz jednosylabowy\n    - B) są dwa wyrazy dwusylabowe\n    - C) są dwa wyrazy dwusylabowe\n    - D) jest jeden wyraz trzysylabowy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — jest jeden wyraz jednosylabowy<br>I-ren-ce (3 sylaby), przy-by-ło (3), trzy (1), la-ta (2). Jednosylabowy jest tylko „trzy”. Dwusylabowy jest jeden wyraz, a trzysylabowe są dwa. (Odpowiedzi B i C w arkuszu są takie same.)<\/details><br>\n21. Poprawnie podzielono na sylaby wyraz: *(4 pkt)* *(Alfik 2016, zad. 17)*\n    - A) ub-yło\n    - B) podo-bnie\n    - C) sza-leń-stwo\n    - D) Iren-ka\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — sza-leń-stwo<br>Każda sylaba ma jedną samogłoskę: sza-leń-stwo. Pozostałe podziały są złe: u-by-ło (3 sylaby), po-dob-nie (3), I-ren-ka (3).<\/details><br>\n22. Jednosylabowy jest wyraz: *(5 pkt)*\n    - A) dziadek\n    - B) niebo\n    - C) piasek\n    - D) Kasia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Wszystkie wyrazy mają po dwie sylaby: dzia-dek, nie-bo, pia-sek, Ka-sia. Litera i w każdym z nich tylko zmiękcza, ale druga samogłoska i tak tworzy drugą sylabę.<\/details><br>\n23. W wyrazie ***chrząszcz***: *(5 pkt)*\n    - A) jest jedna samogłoska\n    - B) są dwie sylaby\n    - C) jest tyle samo liter co głosek\n    - D) są trzy spółgłoski\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — jest jedna samogłoska<br>Głoski: ch-rz-ą-sz-cz. Samogłoska jest jedna (ą), więc sylaba też jedna. Spółgłoski są cztery (ch, rz, sz, cz), a liter jest 9, głosek tylko 5.<\/details><br>\n24. Wyrazem zakończonym na spółgłoskę jest wyraz: *(5 pkt)* *(Alfik 2025, zad. 23)*\n    - A) im\n    - B) terminu\n    - C) możliwe\n    - D) do\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — im<br>„Im” kończy się na m, a to spółgłoska. Pozostałe kończą się samogłoskami: u, e, o.<\/details><br>\n25. ***Przed*** jest wyrazem: *(5 pkt)* *(Alfik 2025, zad. 27)*\n    - A) dwusylabowym\n    - B) składającym się z sześciu głosek\n    - C) jednosylabowym\n    - D) należącym do odmiennej części mowy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jednosylabowym<br>„Przed” ma jedną samogłoskę (e), więc jedną sylabę. Liter jest 5, a głosek 4 (p, rz, e, d), bo „rz” to jedna głoska. To przyimek, czyli wyraz nieodmienny.<\/details><br>\n26. W wyrazie ***sklepionego***: *(5 pkt)* *(Alfik 2024, zad. 23)*\n    - A) są cztery sylaby\n    - B) jest pięć spółgłosek\n    - C) są trzy sylaby\n    - D) jest siedem samogłosek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — są cztery sylaby<br>Skle-pio-ne-go — 4 sylaby. Samogłoski są 4 (e, o, e, o), bo „i” w „pio” tylko zmiękcza p. Spółgłosek jest 6: s, k, l, p, n, g.<\/details><br>\n27. W wyrazach ***spało*** i ***zgasły***: *(5 pkt)* *(Alfik 2024, zad. 28)*\n    - A) są trzy sylaby\n    - B) jest tyle samo spółgłosek\n    - C) jest tyle samo samogłosek i spółgłosek\n    - D) jest tyle samo samogłosek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — jest tyle samo samogłosek<br>Spało: samogłoski a, o; zgasły: a, y — po dwie. Spółgłosek jest 3 (s, p, ł) i 4 (z, g, s, ł), a sylaby są po dwie (spa-ło, zga-sły).<\/details><br>\n28. Wyrazem jednosylabowym jest wyraz: *(5 pkt)* *(Alfik 2024, zad. 29)*\n    - A) baszty\n    - B) trzeci\n    - C) ognie\n    - D) trzej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — trzej<br>„Trzej” ma tylko jedną samogłoskę (e), więc jedną sylabę. Pozostałe mają po dwie: basz-ty, trze-ci, og-nie.<\/details><br>\n29. Jedna sylaba znajduje się w wyrazie: *(5 pkt)* *(Alfik 2023, zad. 23)*\n    - A) tych\n    - B) wieży\n    - C) wielu\n    - D) zegar\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — tych<br>Sylab jest tyle, ile samogłosek. „Tych” ma jedną samogłoskę (y). Pułapka: w „wie-ży” i „wie-lu” litera i tylko zmiękcza w, więc są tam po dwie sylaby; „ze-gar” też ma dwie.<\/details><br>\n30. Wyraz ***uciekającego*** ma: *(5 pkt)* *(Alfik 2023, zad. 30)*\n    - A) więcej sylab niż wyraz *przywiązywali*\n    - B) sześć spółgłosek\n    - C) postać mianownika\n    - D) postać czasu przeszłego\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — więcej sylab niż wyraz *przywiązywali*<br>U-cie-ka-ją-ce-go ma 6 sylab, a przy-wią-zy-wa-li — 5. Spółgłosek jest 5 (ć, k, j, c, g), a wyraz stoi w dopełniaczu lub bierniku (kogo?), nie w mianowniku.<\/details><br>\n31. W wyrazie ***wody***: *(5 pkt)* *(Alfik 2021, zad. 24)*\n    - A) mamy jedną sylabę\n    - B) są dwie sylaby\n    - C) jest więcej sylab niż w wyrazie *było*\n    - D) jest więcej sylab niż spółgłosek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — są dwie sylaby<br>Wo-dy: samogłoski o i y, więc 2 sylaby. *By-ło* też ma 2 sylaby, a spółgłoski w *wody* są 2 (w, d) — tyle samo, co sylab.<\/details><br>\n32. Wyrazem trzysylabowym jest forma: *(5 pkt)* *(Alfik 2021, zad. 28)*\n    - A) patrzącego\n    - B) całemu\n    - C) cmoka\n    - D) przyszedł\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — całemu<br>Ca-łe-mu — 3 samogłoski, 3 sylaby. *Pa-trzą-ce-go* ma 4 sylaby, *cmo-ka* i *przy-szedł* po 2.<\/details><br>\n33. W wyrazie ***cudowny***: *(5 pkt)* *(Alfik 2019, zad. 27)*\n    - A) jest równa ilość spółgłosek i samogłosek\n    - B) jest więcej spółgłosek niż samogłosek\n    - C) więcej jest samogłosek\n    - D) są cztery samogłoski\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest więcej spółgłosek niż samogłosek<br>C-u-d-o-w-n-y: samogłoski u, o, y (3), spółgłoski c, d, w, n (4). Pamiętaj: *y* to samogłoska.<\/details><br>\n34. W wyrazach ***rozumiem*** i ***zdumienie***: *(5 pkt)* *(Alfik 2018, zad. 21)*\n    - A) jest różna ilość sylab\n    - B) jest tyle samo samogłosek\n    - C) jest różna ilość spółgłosek\n    - D) nie występuje ***i*** zmiękczające\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest tyle samo samogłosek<br>Ro-zu-miem ma samogłoski o, u, e, a zdu-mie-nie: u, e, e — po 3. W obu wyrazach *i* tylko zmiękcza (mie, nie), więc nie jest samogłoską. Sylab jest po 3, spółgłosek po 4 (r, z, mi, m oraz z, d, mi, ni), więc A, C i D są fałszywe.<\/details><br>\n35. Wyraz ***dzień***: *(5 pkt)* *(Alfik 2018, zad. 23)*\n    - A) jest jednosylabowy\n    - B) należy do nieodmiennej części mowy\n    - C) jest rodzaju nijakiego\n    - D) ma dwie sylaby\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — jest jednosylabowy<br>Ile samogłosek, tyle sylab. W *dzień* jest jedna samogłoska — e (i tylko zmiękcza). To rzeczownik rodzaju męskiego (ten dzień), który się odmienia (dnia, dniem).<\/details><br>\n36. Dwie sylaby znajdują się w wyrazie: *(5 pkt)* *(Alfik 2018, zad. 29)*\n    - A) chciał\n    - B) wejść\n    - C) ludziach\n    - D) przykrości\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — ludziach<br>Lu-dziach: samogłoski u i a (i tylko zmiękcza „dz”). *Chciał* i *wejść* mają po jednej sylabie, a *przy-kro-ści* — trzy.<\/details><br>\n37. Wyrazem czterosylabowym jest forma: *(5 pkt)* *(Alfik 2017, zad. 25)*\n    - A) doświadczona\n    - B) małżeńskim\n    - C) niekontent\n    - D) zniecierpliwiony\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — doświadczona<br>Do-świad-czo-na — cztery sylaby. Mał-żeń-skim i nie-kon-tent mają trzy, znie-cier-pli-wio-ny — pięć. Pułapka: w „świad”, „nie”, „wio” litera i tylko zmiękcza i nie tworzy osobnej sylaby.<\/details><br>\n38. Więcej samogłosek niż spółgłosek znajduje się w wyrazie: *(5 pkt)* *(Alfik 2016, zad. 29)*\n    - A) ona\n    - B) co\n    - C) nim\n    - D) miody\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — ona<br>O-n-a: dwie samogłoski (o, a), jedna spółgłoska (n). Pułapka D: w „miody” litera i tylko zmiękcza m, nie jest samogłoską — głoski to m′-o-d-y: dwie samogłoski i dwie spółgłoski.<\/details><br>\n39. Wyrazem jednosylabowym jest słowo: *(5 pkt)* *(Alfik 2015, zad. 29)*\n    - A) jego\n    - B) chwila\n    - C) zanim\n    - D) czas\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — czas<br>Liczba sylab to liczba samogłosek. „Czas” ma jedną samogłoskę (a). Je-go, chwi-la, za-nim mają po dwie sylaby.<\/details><br>\n40. W wyrazie ***kalosze***: *(5 pkt)* *(Alfik 2015, zad. 30)*\n    - A) jest tyle samo liter co głosek\n    - B) jest tyle samo spółgłosek co samogłosek\n    - C) są cztery spółgłoski\n    - D) są cztery samogłoski\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest tyle samo spółgłosek co samogłosek<br>Głoski: k-a-l-o-sz-e. Spółgłoski: k, l, sz (trzy), samogłoski: a, o, e (trzy). Pułapka A: liter jest 7, a głosek 6, bo „sz” to dwie litery, ale jedna głoska.<\/details><br>\n41. W wyrazie ***słowo***: *(5 pkt)* *(Alfik 2014, zad. 24)*\n    - A) jest tylko jedna samogłoska\n    - B) jest jedna sylaba\n    - C) występują trzy spółgłoski\n    - D) więcej jest samogłosek niż spółgłosek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — występują trzy spółgłoski<br>S-ł-o-w-o: spółgłoski s, ł, w (trzy), samogłoski o, o (dwie). Są więc dwie sylaby (sło-wo), bo w wyrazie jest tyle sylab, ile samogłosek.<\/details><br>\n42. Wyrazem czterosylabowym jest słowo: *(5 pkt)* *(Alfik 2014, zad. 25)*\n    - A) najmilszym\n    - B) kochali\n    - C) lwowskiego\n    - D) zagraliśmy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — zagraliśmy<br>Za-gra-li-śmy — cztery sylaby. Naj-mil-szym, ko-cha-li i lwow-skie-go mają po trzy. Pułapka: w „lwowskiego” litera i po k tylko zmiękcza, nie tworzy osobnej sylaby.<\/details><br>\n\n## C. Ortografia i interpunkcja\n\nGdy nie wiesz, jak napisać wyraz, poszukaj formy, w której *ó* zamienia się na *o*, a *rz* na *r*.\n\n43. Poprawnie napisano wyraz: *(3 pkt)*\n    - A) ksiąszka\n    - B) ksiąrzka\n    - C) ksionżka\n    - D) książka\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — książka<br>Piszemy „książka” — z ą i ż (tak samo jak „księga”, „książę”).<\/details><br>\n44. Pisownię ***ó*** w wyrazie ***stół*** uzasadnia wyraz: *(3 pkt)*\n    - A) stoły\n    - B) krzesło\n    - C) blat\n    - D) meble\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — stoły<br>Ó piszemy, gdy w innej formie tego samego wyrazu wymienia się na o: stół – stoły.<\/details><br>\n45. Błąd ortograficzny jest w wyrazie: *(3 pkt)*\n    - A) wróbel\n    - B) półka\n    - C) żółty\n    - D) kożuch\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Wszystkie wyrazy napisano poprawnie: wróbel, półka, żółty, kożuch. Pułapka: „ó” i „ż” w tych wyrazach wyglądają podejrzanie, ale to właściwa pisownia.<\/details><br>\n46. Łącznie z ***nie*** należy napisać wyraz z nawiasu: *(4 pkt)*\n    - A) (nie)wiem\n    - B) (nie)szybciej\n    - C) (nie)ładny\n    - D) (nie)czytam\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — (nie)ładny<br>„Ładny” to przymiotnik w stopniu równym, więc piszemy łącznie: nieładny. Z czasownikami (nie wiem, nie czytam) piszemy osobno, a z przysłówkiem w stopniu wyższym też osobno: nie szybciej.<\/details><br>\n47. We wszystkich wyrazach brakuje ***rz*** w zestawie: *(4 pkt)*\n    - A) ..aba, t..y, k..yczy\n    - B) b..oza, g..yb, d..ewo\n    - C) ..ółw, p..yjaciel, wie..a\n    - D) k..ak, ..yrafa, p..ecież\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — b..oza, g..yb, d..ewo<br>Brzoza, grzyb, drzewo — rz po spółgłoskach b, g, d. W innych zestawach jest też ż: żaba, żółw, wieża, żyrafa.<\/details><br>\n48. Poprawnie zapisano wszystkie wyrazy w zestawie: *(4 pkt)*\n    - A) hleb, herbata, ruch\n    - B) herbata, chleb, ruh\n    - C) cherbata, chleb, ruch\n    - D) herbata, chleb, ruch\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — herbata, chleb, ruch<br>Wyraz „herbata” piszemy przez h, a „chleb” i „ruch” przez ch. Na końcu wyrazu prawie zawsze piszemy ch (ruch, dach, mech).<\/details><br>\n49. Przecinek postawiono poprawnie w zdaniu: *(4 pkt)*\n    - A) ***Mama, i tata poszli do kina.***\n    - B) ***Kupiłam jabłka, i gruszki.***\n    - C) ***Wiem, że jutro będzie padać.***\n    - D) ***Mój, brat jest wysoki.***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — ***Wiem, że jutro będzie padać.***<br>Przed „że” zawsze stawiamy przecinek. Przed pojedynczym „i” przecinka nie stawiamy, a w D przecinek rozdziela wyrazy, które się łączą (mój brat).<\/details><br>\n50. Przecinka brakuje w zdaniu: *(5 pkt)*\n    - A) ***Lubię placki i naleśniki.***\n    - B) ***Pójdę na spacer jeśli przestanie padać.***\n    - C) ***Ola czyta książkę, a Janek rysuje.***\n    - D) ***Zjadłem obiad.***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — ***Pójdę na spacer jeśli przestanie padać.***<br>To zdanie złożone z dwóch części, a druga zaczyna się od „jeśli” — przed nim stawiamy przecinek: Pójdę na spacer, jeśli przestanie padać. W A przed „i” przecinka nie trzeba, a w C przecinek przed „a” już jest.<\/details><br>\n51. Wielką literą piszemy wszystkie wyrazy w zestawie: *(5 pkt)*\n    - A) poniedziałek, maj, polska\n    - B) wisła, kraków, bałtyk\n    - C) polak, polski, polka\n    - D) grudzień, warszawa, tatry\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — wisła, kraków, bałtyk<br>Wisła (rzeka), Kraków (miasto), Bałtyk (morze) to nazwy własne, więc wszystkie piszemy wielką literą. Nazwy dni i miesięcy (poniedziałek, maj, grudzień) piszemy małą literą, tak samo przymiotnik „polski” — choć Polak i Polka wielką.<\/details><br>\n52. Wyraz ***niecałe*** piszemy łącznie, ponieważ: *(5 pkt)* *(Alfik 2024, zad. 30)*\n    - A) rzeczowniki z *nie-* piszemy łącznie\n    - B) tak piszemy wszystkie przysłówki\n    - C) to *nie-* z przymiotnikiem w stopniu równym\n    - D) jest to wyjątek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — to *nie-* z przymiotnikiem w stopniu równym<br>„Nie” z przymiotnikami w stopniu równym piszemy łącznie (niecały, niedobry), a w stopniu wyższym i najwyższym osobno (nie większy). „Całe” to przymiotnik (jakie?), nie rzeczownik ani przysłówek.<\/details><br>\n53. Sprawdzając pisownię wyrazu ***niemłody*** odwołasz się do zasady pisowni *nie* z: *(5 pkt)* *(Alfik 2017, zad. 29)*\n    - A) przysłówkami\n    - B) rzeczownikami\n    - C) przymiotnikami\n    - D) zaimkami\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — przymiotnikami<br>„Młody” to przymiotnik (jaki?), a „nie” z przymiotnikami w stopniu równym piszemy łącznie: niemłody, niestary.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. A — dach\n2. B — 6 liter i 5 głosek\n3. C — mama\n4. D — siano\n5. A — 7 liter i 5 głosek\n6. C — jest więcej liter niż głosek *(Alfik 2023, zad. 16)*\n7. B — porządek *(Alfik 2016, zad. 18)*\n8. D — mrówka\n9. E — żadna z powyższych\n10. A — mają tyle samo liter *(Alfik 2023, zad. 28)*\n11. D — jest więcej liter niż głosek *(Alfik 2019, zad. 30)*\n12. D — czasami *(Alfik 2017, zad. 23)*\n13. C — 4\n14. C — o, ó, u\n15. D — ma-li-na\n16. A — dwie sylaby\n17. B — aleja\n18. C — ziemniaki\n19. C — jest jednosylabowy *(Alfik 2022, zad. 18)*\n20. A — jest jeden wyraz jednosylabowy *(Alfik 2016, zad. 16)*\n21. C — sza-leń-stwo *(Alfik 2016, zad. 17)*\n22. E — żadna z powyższych\n23. A — jest jedna samogłoska\n24. A — im *(Alfik 2025, zad. 23)*\n25. C — jednosylabowym *(Alfik 2025, zad. 27)*\n26. A — są cztery sylaby *(Alfik 2024, zad. 23)*\n27. D — jest tyle samo samogłosek *(Alfik 2024, zad. 28)*\n28. D — trzej *(Alfik 2024, zad. 29)*\n29. A — tych *(Alfik 2023, zad. 23)*\n30. A — więcej sylab niż wyraz *przywiązywali* *(Alfik 2023, zad. 30)*\n31. B — są dwie sylaby *(Alfik 2021, zad. 24)*\n32. B — całemu *(Alfik 2021, zad. 28)*\n33. B — jest więcej spółgłosek niż samogłosek *(Alfik 2019, zad. 27)*\n34. B — jest tyle samo samogłosek *(Alfik 2018, zad. 21)*\n35. A — jest jednosylabowy *(Alfik 2018, zad. 23)*\n36. C — ludziach *(Alfik 2018, zad. 29)*\n37. A — doświadczona *(Alfik 2017, zad. 25)*\n38. A — ona *(Alfik 2016, zad. 29)*\n39. D — czas *(Alfik 2015, zad. 29)*\n40. B — jest tyle samo spółgłosek co samogłosek *(Alfik 2015, zad. 30)*\n41. C — występują trzy spółgłoski *(Alfik 2014, zad. 24)*\n42. D — zagraliśmy *(Alfik 2014, zad. 25)*\n43. D — książka\n44. A — stoły\n45. E — żadna z powyższych\n46. C — (nie)ładny\n47. B — b..oza, g..yb, d..ewo\n48. D — herbata, chleb, ruch\n49. C — ***Wiem, że jutro będzie padać.***\n50. B — ***Pójdę na spacer jeśli przestanie padać.***\n51. B — wisła, kraków, bałtyk\n52. C — to *nie-* z przymiotnikiem w stopniu równym *(Alfik 2024, zad. 30)*\n53. C — przymiotnikami *(Alfik 2017, zad. 29)*\n\n## Ściąga\n\n| Reguła | Przykład |\n|---|---|\n| Dwuznaki: *ch, cz, dz, dź, dż, rz, sz* — 2 litery, 1 głoska | *szkoła*: 6 liter, 5 głosek |\n| *i* przed samogłoską tylko zmiękcza | *siano* [śano], *dziecko* [dźecko] |\n| Samogłoski: *a, ą, e, ę, i, o, ó, u, y* | *j* i *ł* to spółgłoski |\n| Ile samogłosek, tyle sylab | *po-ma-rań-cza* (4), *chrząszcz* (1) |\n| *ś, ć, ń, ź, dź* z kreską: na końcu wyrazu i przed spółgłoską; przed samogłoską — *si, ci, ni, zi, dzi* | *koń – konie*, *ktoś – Kasia* |\n| *ó* wymienne na *o* | *stół – stoły*, *wróg – wrogowie* |\n| *rz* wymienne na *r* lub po *b, p, d, t, g, k, ch, j, w* | *morze – morski*, *brzoza, krzak* |\n| *ch* na końcu wyrazu (prawie zawsze) | *ruch, dach, mech* |\n| *nie* + czasownik — osobno | *nie wiem, nie czytam* |\n| *nie* + przymiotnik/przysłówek w stopniu równym — łącznie; w wyższym i najwyższym — osobno | *nieładny, niedaleko*; *nie szybciej* |\n| Przecinek przed *że, bo, który, gdzie, jeśli, a, ale, więc*; przed pojedynczym *i* — nie | *Wiem, że…*; *jabłka i gruszki* |\n| Wielka litera: imiona, nazwy miast, rzek, gór, mórz, mieszkańców krajów | *Wisła, Kraków, Tatry, Polak* (ale: *polski*, *maj*) |\n"}, {"path": "humanistyczny/klasa-5/testy-przeszle/alfik-2025.md", "id": "hum5/alfik-2025", "kind": "przeszly", "short": "Alfik 2025", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Alfik 2025\n\n<div class=\"test\" data-minuty=\"45\" data-start=\"30\"><\/div>\n\n**Oryginalny arkusz** XXIX edycji konkursu Alfik Humanistyczny, klasa 5 szkoły podstawowej, 10 grudnia 2025.\nŹródło: [arkusz PDF](https://jersz.pl/wp-content/uploads/2025/12/AH-2025-5.pdf) i [klucz odpowiedzi](https://jersz.pl/wp-content/uploads/2026/01/AH_2025_klucz.pdf) na stronie organizatora, jersz.pl.\n30 pytań, 45 minut. Na start masz 30 pkt, za błędną odpowiedź tracisz ¼ punktów pytania.\nOdpowiedź E znaczy: żadna z odpowiedzi A–D nie jest poprawna. Wyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n## Tekst\n\n> Mieszko objął tron książęcy po śmierci ojca w latach 950–960, prawdopodobnie bliżej terminu końcowego. Ze względu na brak źródeł nie można dokładnie określić, jakie odziedziczył (…) ziemie. Na pewno należały do nich tereny zamieszkane przez Polan i Goplan, a także ziemia sieradzko-łęczycka. Możliwe, że do państwa należały także ziemie Mazowszan i Pomorze Wschodnie. Przed nowym władcą stanęło zadanie zintegrowania dość rozległego, niejednolitego etnicznie i kulturowo terytorium. Wprawdzie mieszkańcy terenów kontrolowanych przez Mieszka mówili w większości jednym językiem, mieli podobne wierzenia i osiągnęli podobny stopień rozwoju gospodarczego i cywilizacyjnego, ale podstawową formą łączących ich więzi społecznych były struktury plemienne. Można sądzić, że współpracujący z księciem możni pierwsi poczuli jedność ponadplemienną. Zależało im na zjednoczeniu kraju ze względu na możliwość poszerzenia swoich wpływów.\n>\n> Jako pierwszy o księciu Polan wspomniał żydowski podróżnik Ibrahim ibn Jakub. Informacje o nim zdobył prawdopodobnie w 966 roku, kiedy przebywał na dworze cesarza Ottona I. Mieszka przedstawił jako księcia panującego na rozległym obszarze, posiadającego dobrze zorganizowaną drużynę. Precyzyjniejsze są zapiski współczesnego Mieszkowi Widukinda z Korbei i tworzącego pół wieku później biskupa merseburskiego Thietmara.\n>\n> Źródło: pl.wikipedia.org. https://pl.wikipedia.org/wiki/Mieszko_I\n\n## Pytania za 3 punkty\n\n1. Powyższy tekst przedstawia: *(3 pkt)*\n   - A) legendę\n   - B) wydarzenia historyczne\n   - C) streszczenie fabuły powieści\n   - D) wydarzenia fikcyjne\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — wydarzenia historyczne<br>Tekst podaje daty (950–960, 966), prawdziwe postacie i powołuje się na źródła — to fragment artykułu o historii, nie legenda ani powieść.<\/details><br>\n2. Adresatem powyższego tekstu są: *(3 pkt)*\n   - A) wyłącznie naukowcy\n   - B) pasjonaci historii\n   - C) miłośnicy fantastyki\n   - D) znawcy literatury\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — pasjonaci historii<br>To tekst z encyklopedii internetowej o pierwszym władcy Polski, więc trafi do każdego, kto interesuje się historią. Pułapka: słowo „wyłącznie” w A — z Wikipedii korzystają nie tylko naukowcy.<\/details><br>\n3. Temat tekstu najlepiej określa sformułowanie: *(3 pkt)*\n   - A) ocena króla Polski\n   - B) początki państwa polskiego\n   - C) wizja przyszłości państwa\n   - D) wpływ przeszłości na teraźniejszość\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — początki państwa polskiego<br>Tekst mówi, jakie ziemie objął Mieszko, jak łączył plemiona i kto pierwszy o nim napisał — to opowieść o początkach Polski. Pułapka: Mieszko był księciem, nie królem, a tekst go nie ocenia.<\/details><br>\n4. Przedstawiane wydarzenia: *(3 pkt)*\n   - A) dzieją się w IX wieku\n   - B) dzieją się przed naszą erą\n   - C) nie miały miejsca\n   - D) dzieją się w X w.\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — dzieją się w X w.<br>Lata 950–966 to X wiek (lata 901–1000). Pułapka: rok zaczynający się od 9 to nie IX wiek — do numeru z setek trzeba dodać 1.<\/details><br>\n5. Z powyższego tekstu wynika, że Mieszko I: *(3 pkt)*\n   - A) był księciem\n   - B) był królem\n   - C) panował w latach 950 - 960\n   - D) był pierwszym władcą w swoim rodzie\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — był księciem<br>„Mieszko objął tron książęcy”, a Ibrahim ibn Jakub wspomniał o „księciu Polan”. Pułapka: w latach 950–960 Mieszko dopiero objął tron, a panował dłużej. Rządził też po ojcu, więc nie był pierwszym władcą w rodzie.<\/details><br>\n6. Prawdą jest, że: *(3 pkt)*\n   - A) wiemy, jak zmarł ojciec Mieszka\n   - B) mamy bogate źródła historyczne z tamtego okresu\n   - C) nie wiemy dokładnie, jakie ziemie odziedziczył Mieszko I po ojcu\n   - D) jest pewne, że Mieszko odziedziczył ziemie Mazowszan\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — nie wiemy dokładnie, jakie ziemie odziedziczył Mieszko I po ojcu<br>W tekście: „Ze względu na brak źródeł nie można dokładnie określić, jakie odziedziczył (…) ziemie”. O Mazowszu tekst mówi tylko „możliwe”, więc D nie jest pewne.<\/details><br>\n7. Z tekstu nie dowiemy się: *(3 pkt)*\n   - A) jak nazywał się ojciec Mieszka I\n   - B) do kogo należały ziemie Goplan\n   - C) czy poddani Mieszka mieli podobne wierzenia\n   - D) czy poddani Mieszka I byli na podobnym stopniu rozwoju gospodarczego\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — jak nazywał się ojciec Mieszka I<br>Tekst wspomina o „śmierci ojca”, ale nie podaje jego imienia. Pozostałe informacje w tekście są: ziemie Goplan należały do Mieszka, a jego poddani mieli podobne wierzenia i podobny stopień rozwoju.<\/details><br>\n8. Najważniejszym zadaniem Mieszka I było: *(3 pkt)*\n   - A) uszanowanie odrębności poszczególnych plemion\n   - B) obrona wiary w słowiańskich bogów\n   - C) zjednoczenie poszczególnych plemion w jeden organizm państwowy\n   - D) pokonanie rywali w walce o tron\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — zjednoczenie poszczególnych plemion w jeden organizm państwowy<br>„Przed nowym władcą stanęło zadanie zintegrowania (…) terytorium” — zintegrować to połączyć w całość.<\/details><br>\n9. Poważną trudność w realizacji zadania stanowił fakt, że: *(3 pkt)*\n   - A) plemiona były zróżnicowane pod względem kulturowym i etnicznym\n   - B) miał mało wojska\n   - C) więzi plemienne były jeszcze bardzo silne\n   - D) dysponował ograniczonymi środkami finansowymi\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — więzi plemienne były jeszcze bardzo silne<br>Tekst mówi, że ludzie mówili jednym językiem i mieli podobne wierzenia, „ale podstawową formą łączących ich więzi społecznych były struktury plemienne” — każdy czuł się najpierw członkiem swojego plemienia. Uwaga: tekst nazywa też terytorium „niejednolitym etnicznie i kulturowo”, więc odpowiedź A również ma oparcie w tekście. Oficjalna odpowiedź to C.<\/details><br>\n10. Z tekstu można wywnioskować, że możni: *(3 pkt)*\n    - A) byli zainteresowani zjednoczeniem kraju\n    - B) robili Mieszkowi trudności\n    - C) rywalizowali między sobą\n    - D) buntowali się\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — byli zainteresowani zjednoczeniem kraju<br>„Zależało im na zjednoczeniu kraju ze względu na możliwość poszerzenia swoich wpływów”. Możni współpracowali z księciem, a nie się buntowali.<\/details><br>\n\n## Pytania za 4 punkty\n\n11. Sformułowanie ***Można sądzić*** wyraża: *(4 pkt)*\n    - A) zdziwienie\n    - B) pewność\n    - C) przypuszczenie\n    - D) wątpliwość\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — przypuszczenie<br>„Można sądzić” znaczy „prawdopodobnie tak było” — piszący przypuszcza, ale nie ma pewności. Pułapka: to nie wątpliwość, bo piszący skłania się ku temu, że tak było.<\/details><br>\n12. Ibrahim ibn Jakub: *(4 pkt)*\n    - A) najechał ziemie Mieszka\n    - B) jako pierwszy opisał państwo Mieszka I\n    - C) krytykował rządy Mieszka\n    - D) pochodził z Indii\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jako pierwszy opisał państwo Mieszka I<br>„Jako pierwszy o księciu Polan wspomniał żydowski podróżnik Ibrahim ibn Jakub” i przedstawił go jako władcę rozległego obszaru. Był podróżnikiem, a nie najeźdźcą, i nie krytykował Mieszka.<\/details><br>\n13. Sformułowanie ***dobrze zorganizowaną drużynę***: *(4 pkt)*\n    - A) nie wyraża oceny\n    - B) jest tylko informacją\n    - C) zawiera krytykę\n    - D) wyraża ocenę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — wyraża ocenę<br>Słowo „dobrze” to ocena — ktoś uznał, że drużyna była zorganizowana dobrze. Ocena jest pozytywna, więc to nie krytyka.<\/details><br>\n14. Widukind z Korbei i Thietmar: *(4 pkt)*\n    - A) tworzyli równolegle\n    - B) nie pisali swoich kronik w tym samym czasie\n    - C) pisali na dworze Mieszka\n    - D) nie wspomnieli o Mieszku I\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — nie pisali swoich kronik w tym samym czasie<br>Widukind był „współczesny Mieszkowi”, a Thietmar tworzył „pół wieku później”. Obaj pisali o Mieszku, więc D odpada.<\/details><br>\n15. Piszący w swoim tekście: *(4 pkt)*\n    - A) koncentruje się na faktach\n    - B) przedstawia wyłącznie własne poglądy i oceny\n    - C) prezentuje nowe ustalenia\n    - D) przedstawia jedynie teorie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — koncentruje się na faktach<br>Tekst podaje daty, nazwy plemion i źródła historyczne. Przypuszczenia też się pojawiają („prawdopodobnie”, „możliwe”), ale nie „jedynie” — dlatego D odpada.<\/details><br>\n16. W zdaniu ***Mieszko objął tron książęcy po śmierci ojca***: *(4 pkt)*\n    - A) są dwa rzeczowniki\n    - B) nie ma czasownika\n    - C) są cztery czasowniki\n    - D) są cztery rzeczowniki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — są cztery rzeczowniki<br>Rzeczowniki (kto? co?) to: Mieszko, tron, śmierci, ojca. Czasownik jest jeden: objął. „Książęcy” to przymiotnik, a „po” to przyimek.<\/details><br>\n17. Wyraz ***książęcy***: *(4 pkt)*\n    - A) to przysłówek\n    - B) jest przymiotnikiem\n    - C) nie odmienia się przez przypadki\n    - D) podlega stopniowaniu\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest przymiotnikiem<br>Jaki tron? książęcy — przymiotnik odpowiada na pytanie jaki? Odmienia się (książęcego, książęcemu), ale nie da się go stopniować (nie mówimy „bardziej książęcy”, „najbardziej książęcy”).<\/details><br>\n18. Wyraz ***śmierci*** (w zdaniu z pyt. 16.): *(4 pkt)*\n    - A) jest w liczbie mnogiej\n    - B) ma formę miejscownika\n    - C) nie ma liczby pojedynczej\n    - D) ma formę dopełniacza\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — ma formę dopełniacza<br>Według klucza „śmierci” to dopełniacz liczby pojedynczej (nie ma kogo? czego? — śmierci). Uwaga: w zdaniu „po śmierci” przyimek „po” łączy się z miejscownikiem (o kim? o czym? — o śmierci), a dopełniacz i miejscownik mają tu taką samą formę, więc poprawna wydaje się raczej odpowiedź B. Oficjalna odpowiedź to D.<\/details><br>\n19. Tematem w odmianie przez przypadki wyrazu ***ojca*** jest: *(4 pkt)*\n    - A) ojc-\n    - B) -a\n    - C) oj-\n    - D) ojca\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — ojc-<br>Temat to część wyrazu, która zostaje, gdy odetniemy końcówkę: ojc-a, ojc-u, ojc-em. „-a” to końcówka, nie temat.<\/details><br>\n20. Do nieodmiennej części mowy zalicza się wyraz: *(4 pkt)*\n    - A) po\n    - B) im\n    - C) pierwszy\n    - D) żydowski\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — po<br>„Po” to przyimek, a przyimki się nie odmieniają. „Im” to zaimek (oni, ich, im), „pierwszy” to liczebnik, a „żydowski” przymiotnik — wszystkie się odmieniają.<\/details><br>\n\n## Pytania za 5 punktów\n\n21. W zdaniu ***Na pewno należały do nich tereny zamieszkane przez Polan i Goplan***: *(5 pkt)*\n    - A) są trzy zaimki\n    - B) są trzy przyimki\n    - C) jest jeden przyimek\n    - D) nie ma zaimka\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — są trzy przyimki<br>Przyimki to: na, do, przez. Zaimek jest jeden: nich. Uwaga: „na pewno” to stałe wyrażenie znaczące „pewnie”; jeśli nie liczyć w nim „na” jako osobnego przyimka, wyszłyby tylko dwa przyimki. Oficjalna odpowiedź to B.<\/details><br>\n22. Wyraz ***tereny***: *(5 pkt)*\n    - A) ma formę liczby mnogiej\n    - B) ma końcówkę -eny\n    - C) nie odmienia się przez przypadki\n    - D) jest w liczbie pojedynczej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — ma formę liczby mnogiej<br>Jeden teren, wiele terenów — „tereny” to liczba mnoga. Końcówka to tylko „-y” (temat: teren-).<\/details><br>\n23. Wyrazem zakończonym na spółgłoskę jest wyraz: *(5 pkt)*\n    - A) im\n    - B) terminu\n    - C) możliwe\n    - D) do\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — im<br>„Im” kończy się na m, a to spółgłoska. Pozostałe kończą się samogłoskami: u, e, o.<\/details><br>\n24. Podkreślony wyraz w zdaniu ***Przed nowym władcą stanęło <u>zadanie<\/u> zintegrowania rozległego terytorium*** jest: *(5 pkt)*\n    - A) podmiotem\n    - B) orzeczeniem\n    - C) przydawką\n    - D) czasownikiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — podmiotem<br>Pytamy orzeczenie „stanęło”: kto? co stanęło? — zadanie. To podmiot. „Zadanie” to rzeczownik, nie czasownik.<\/details><br>\n25. Wyraz ***rozległego***: *(5 pkt)*\n    - A) jest przysłówkiem\n    - B) nie odmienia się\n    - C) należy do tej samej części mowy co wyraz *terenu*\n    - D) należy do tej samej części mowy co wyraz *nowym*\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — należy do tej samej części mowy co wyraz *nowym*<br>„Rozległego” i „nowym” to przymiotniki (jakiego? jakim?). „Terenu” to rzeczownik.<\/details><br>\n26. Wyraz ***zintegrowania*** można zastąpić formą: *(5 pkt)*\n    - A) złączenia\n    - B) rozdzielenia\n    - C) podboju\n    - D) panowania\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — złączenia<br>Zintegrować znaczy połączyć w jedną całość. Pułapka: „rozdzielenie” to wyraz o przeciwnym znaczeniu.<\/details><br>\n27. ***Przed*** jest wyrazem: *(5 pkt)*\n    - A) dwusylabowym\n    - B) składającym się z sześciu głosek\n    - C) jednosylabowym\n    - D) należącym do odmiennej części mowy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jednosylabowym<br>„Przed” ma jedną samogłoskę (e), więc jedną sylabę. Liter jest 5, a głosek 4 (p, rz, e, d), bo „rz” to jedna głoska. To przyimek, czyli wyraz nieodmienny.<\/details><br>\n28. W zdaniu ***Zależało im na zjednoczeniu kraju ze względu na możliwość poszerzenia swoich wpływów***: *(5 pkt)*\n    - A) są dwa czasowniki\n    - B) jest jeden czasownik\n    - C) są dwa orzeczenia\n    - D) jest przydawka\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest jeden czasownik<br>Jedyny czasownik to „zależało”. „Zjednoczeniu” i „poszerzenia” wyglądają podobnie do czasowników, ale to rzeczowniki (co? zjednoczenie, poszerzenie). Uwaga: w zdaniu jest też przydawka — „swoich” (czyich wpływów?) — więc D wydaje się również prawdziwe. Oficjalna odpowiedź to B.<\/details><br>\n29. Wyraz ***im*** to: *(5 pkt)*\n    - A) zaimek *oni* w formie celownika\n    - B) przyimek\n    - C) przysłówek\n    - D) partykuła\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — zaimek *oni* w formie celownika<br>Oni, ich, im — „im” to celownik (komu? czemu?) zaimka „oni”.<\/details><br>\n30. Wyraz ***możliwość*** jest: *(5 pkt)*\n    - A) rzeczownikiem\n    - B) czasownikiem w formie bezokolicznika\n    - C) czasownikiem w formie osobowej\n    - D) zaimkiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — rzeczownikiem<br>Co? możliwość — to rzeczownik. Pułapka: zakończenie „-ść” przypomina bezokolicznik (np. nieść, kraść), ale „możliwość” nie nazywa czynności, tylko to, że coś jest możliwe.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. B — wydarzenia historyczne\n2. B — pasjonaci historii\n3. B — początki państwa polskiego\n4. D — dzieją się w X w.\n5. A — był księciem\n6. C — nie wiemy dokładnie, jakie ziemie odziedziczył Mieszko I po ojcu\n7. A — jak nazywał się ojciec Mieszka I\n8. C — zjednoczenie poszczególnych plemion w jeden organizm państwowy\n9. C — więzi plemienne były jeszcze bardzo silne\n10. A — byli zainteresowani zjednoczeniem kraju\n11. C — przypuszczenie\n12. B — jako pierwszy opisał państwo Mieszka I\n13. D — wyraża ocenę\n14. B — nie pisali swoich kronik w tym samym czasie\n15. A — koncentruje się na faktach\n16. D — są cztery rzeczowniki\n17. B — jest przymiotnikiem\n18. D — ma formę dopełniacza\n19. A — ojc-\n20. A — po\n21. B — są trzy przyimki\n22. A — ma formę liczby mnogiej\n23. A — im\n24. A — podmiotem\n25. D — należy do tej samej części mowy co wyraz *nowym*\n26. A — złączenia\n27. C — jednosylabowym\n28. B — jest jeden czasownik\n29. A — zaimek *oni* w formie celownika\n30. A — rzeczownikiem\n"}, {"path": "humanistyczny/klasa-5/testy-przeszle/alfik-2024.md", "id": "hum5/alfik-2024", "kind": "przeszly", "short": "Alfik 2024", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Alfik 2024\n\n<div class=\"test\" data-minuty=\"45\" data-start=\"30\"><\/div>\n\n**Oryginalny arkusz** XXVIII edycji konkursu Alfik Humanistyczny, klasa 5 szkoły podstawowej, 11 grudnia 2024.\nŹródło: [arkusz PDF](https://jersz.pl/wp-content/uploads/2024/12/AH-2024-5.pdf) i [klucz odpowiedzi](https://jersz.pl/wp-content/uploads/2025/01/AH_2024_klucz.pdf) na stronie organizatora, jersz.pl.\n30 pytań, 45 minut. Na start masz 30 pkt, za błędną odpowiedź tracisz ¼ punktów pytania.\nOdpowiedź E znaczy: żadna z odpowiedzi A–D nie jest poprawna. Wyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n## Tekst\n\n**Adam Mickiewicz, _Grażyna_ (fragment)**\n\n> Coraz to ciemniej, wiatr północny chłodzi,<br>\n> Na dole tuman, a miesiąc wysoko<br>\n> Pośród krążącej czarnych chmur powodzi<br>\n> We mgle niecałe pokazował oko;<br>\n> I świat był na kształt gmachu sklepionego,<br>\n> A niebo na kształt sklepu ruchomego,<br>\n> Księżyc jak okno, którędy dzień schodzi.\n>\n> Zamek na barkach nowogródzkiej góry<br>\n> Od miesięcznego brał pozłotę blasku,<br>\n> Po wałach z darni i po sinym piasku<br>\n> Olbrzymim słupem łamał się cień bury,<br>\n> Spadając w fosę, gdzie wśród wiecznych cieśni<br>\n> Dyszała woda spod zielonych pleśni.\n>\n> Miasto już spało, w zamku ognie zgasły,<br>\n> Tylko po wałach i po basztach straże<br>\n> Powtarzanymi płoszą senność hasły;<br>\n> Wtem się coś z dala na polu ukaże,<br>\n> Jakowiś ludzie biegą tu po błoniach,<br>\n> A gałąź cieniu za każdym się czerni,<br>\n> A biegą prędko, muszą być na koniach;<br>\n> A świecą mocno, muszą być pancerni.\n>\n> Zarżały konie, zagrzmiała podkowa:<br>\n> Trzej to rycerze jadą wzdłuż parowa,<br>\n> Zjechali, stają, a pierwszy z rycerzy<br>\n> Krzyknie, i w trąbkę mosiężną uderzy.<br>\n> Uderzył potem raz drugi i trzeci,<br>\n> Strażnik mu z baszty rogiem odpowiada;<br>\n> Brzękły wrzeciądze, pochodnia zaświeci<br>\n> I most zwodzony z łoskotem opada.\n\n## Pytania za 3 punkty\n\n1. Tekst powyższy: *(3 pkt)*\n   - A) jest dramatem\n   - B) napisano prozą\n   - C) nie jest wierszem\n   - D) jest utworem poetyckim\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — jest utworem poetyckim<br>Tekst jest napisany wierszem: ma wersy, zwrotki i rymy (chłodzi – powodzi, wysoko – oko). Utwór pisany wierszem to utwór poetycki. Dramat to tekst do wystawienia na scenie, z rolami i dialogami — tu ich nie ma.<\/details><br>\n2. W tekście znajdujemy: *(3 pkt)*\n   - A) morał\n   - B) rozbudowany opis\n   - C) zwrot do czytelnika\n   - D) refren\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — rozbudowany opis<br>Dwie pierwsze zwrotki to długi opis nocy, nieba i zamku na górze. Morału, refrenu (powtarzanych wersów) ani zwrotu do czytelnika nie ma.<\/details><br>\n3. Zdanie ***most zwodzony z łoskotem opada*** świadczy o tym, że akcja rozgrywa się: *(3 pkt)*\n   - A) w przyszłości\n   - B) w średniowieczu\n   - C) współcześnie\n   - D) w świecie fantastycznym\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — w średniowieczu<br>Mosty zwodzone nad fosą, baszty i rycerze w zbrojach to obraz średniowiecznego zamku.<\/details><br>\n4. Z tekstu możemy wywnioskować, że jest: *(3 pkt)*\n   - A) dzień świąteczny\n   - B) południe\n   - C) poranek\n   - D) noc\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — noc<br>Jest „coraz to ciemniej”, na niebie świeci miesiąc, a „miasto już spało, w zamku ognie zgasły”.<\/details><br>\n5. Przedstawiony zamek położony jest: *(3 pkt)*\n   - A) na górze\n   - B) w kotlinie\n   - C) w gęstym lesie\n   - D) na skraju urwiska\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — na górze<br>W tekście: „Zamek na barkach nowogródzkiej góry”.<\/details><br>\n6. Prawdą jest, że zamek: *(3 pkt)*\n   - A) był zaczarowany\n   - B) otaczała fosa\n   - C) był opuszczony\n   - D) był ruinami\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — otaczała fosa<br>Cień zamku spada „w fosę, gdzie (…) dyszała woda”. Zamek nie był opuszczony — pilnowały go straże.<\/details><br>\n7. Zamek rozjaśniało światło: *(3 pkt)*\n   - A) pochodni\n   - B) słoneczne\n   - C) magiczne\n   - D) księżyca\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — księżyca<br>Zamek „od miesięcznego brał pozłotę blasku” — miesiąc to dawna nazwa księżyca. Pułapka: pochodnia zapala się dopiero na końcu, przy bramie.<\/details><br>\n8. Sformułowanie ***czarnych chmur powodzi***: *(3 pkt)*\n   - A) jest komiczne\n   - B) wprowadza radosny nastrój\n   - C) wprowadza ponury nastrój\n   - D) nie buduje nastroju\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — wprowadza ponury nastrój<br>Mnóstwo czarnych chmur kojarzy się z ciemnością i groźną pogodą, więc nastrój jest ponury.<\/details><br>\n9. Sformułowanie ***chmur powodzi***: *(3 pkt)*\n   - A) ma charakter przenośny\n   - B) należy rozumieć dosłownie\n   - C) nie zawiera epitetu\n   - D) zawiera przymiotnik\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — ma charakter przenośny<br>Nie chodzi o prawdziwą powódź, tylko o ogromną masę chmur, która zalewa niebo jak woda — to przenośnia (metafora). Oba wyrazy to rzeczowniki, więc przymiotnika nie ma. Uwaga: skoro nie ma tu przymiotnika, można uznać, że nie ma też epitetu, i wtedy C też byłoby prawdziwe. Oficjalna odpowiedź to A.<\/details><br>\n10. Z tekstu wynika, że: *(3 pkt)*\n    - A) widoczność była znakomita\n    - B) było mgliście\n    - C) wiał ciepły wiatr\n    - D) nie było widać Księżyca\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — było mgliście<br>„Na dole tuman” (tuman to gęsta mgła albo kurz), a miesiąc pokazywał oko „we mgle”. Pułapka: księżyc było widać, choć nie cały („niecałe pokazywał oko”), a wiatr był północny i chłodny.<\/details><br>\n\n## Pytania za 4 punkty\n\n11. Wydarzeniem przedstawionym w tekście jest: *(4 pkt)*\n    - A) wyjazd rycerzy\n    - B) przybycie rycerzy do zamku\n    - C) oblężenie zamku\n    - D) budowa zamku\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — przybycie rycerzy do zamku<br>Trzej rycerze nadjeżdżają, trąbią pod zamkiem, a strażnik opuszcza most. Nikt zamku nie atakuje, więc to nie oblężenie.<\/details><br>\n12. Z tekstu możemy dowiedzieć się: *(4 pkt)*\n    - A) czyj był to zamek\n    - B) kim byli zbrojni ludzie\n    - C) skąd pochodzili zbrojni ludzie\n    - D) jak zachowywała się straż zamku\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — jak zachowywała się straż zamku<br>Straże czuwały na wałach i basztach, „powtarzanymi płoszą senność hasły”, a strażnik odpowiedział rogiem i otworzył bramę. Imion i pochodzenia rycerzy ani właściciela zamku tekst nie podaje.<\/details><br>\n13. Z tekstu wynika, że brama do zamku: *(4 pkt)*\n    - A) nie zawsze była otwarta\n    - B) była gościnnie otwarta\n    - C) nie była pilnowana\n    - D) była bardzo wąska\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — nie zawsze była otwarta<br>Rycerz musiał zatrąbić, a dopiero wtedy most zwodzony opadł. Czyli w nocy wejście było zamknięte i pilnowane.<\/details><br>\n14. Z tekstu dowiemy się: *(4 pkt)*\n    - A) jaka była liczba zbrojnych\n    - B) jak brzmiały hasła straży\n    - C) ilu było strażników\n    - D) jaka jest nazwa zamku\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — jaka była liczba zbrojnych<br>„Trzej to rycerze jadą wzdłuż parowa”. Haseł, liczby strażników ani nazwy zamku tekst nie podaje.<\/details><br>\n15. Prawdą jest, że: *(4 pkt)*\n    - A) stojący przed bramą byli zaniepokojeni\n    - B) zbrojni zachowywali się cicho\n    - C) przybyli mieli na sobie zbroje\n    - D) zbrojni nie zachowywali się jak rycerze\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — przybyli mieli na sobie zbroje<br>„Świecą mocno, muszą być pancerni” — błyszczą, bo mają metalowe pancerze. Cicho nie było: konie zarżały, a rycerz zatrąbił.<\/details><br>\n16. Sformułowanie ***zagrzmiała podkowa*** należy rozumi
