<script id="pages" type="application/json">[{"path": "README.md", "id": "start", "kind": "info", "short": "Start", "md": "# [Alfik: trening](https://prondzyn.github.io/przygotowanie-do-konkursow-alfik/)\n\nZadania do nauki przed konkursami **Alfik** (Łowcy Talentów – JERSZ). Wybierz konkurs i klasę.\nKażda odpowiedź w zadaniach matematycznych została sprawdzona programem komputerowym.\n\n<div class=\"menu\">\n\n## Alfik Matematyczny\n\n- [Klasa 5](matematyczny/klasa-5/README.md) 431 zadań w 9 działach, 10 arkuszy z lat 2015–2025, 2 testy próbne\n\n## Alfik Humanistyczny\n\n- [Klasa 5](humanistyczny/klasa-5/README.md) 331 pytań w 7 działach, 11 arkuszy z lat 2014–2025, 2 testy próbne\n\n<\/div>\n\nPostęp zapisuje się w przeglądarce, osobno dla każdej strony. Przycisk u góry czyści tylko bieżącą stronę.\n\n<details><summary>Dla rodzica: jak zbudowane są katalogi<\/summary>\n\nKażda klasa ma swój katalog <code>&lt;konkurs&gt;/klasa-&lt;N&gt;/<\/code>, np. <code>matematyczny/klasa-5/<\/code>.\nW środku jest <code>README.md<\/code> (strona startowa klasy) i dowolne z trzech podkatalogów:\n\n<pre>\nmatematyczny/klasa-5/\n  README.md\n  zadania-wg-typu/   README.md, 01-….md, 02-….md, …\n  testy-przeszle/    README.md, alfik-2015.md, alfik-2016.md, …\n  testy-probne/      README.md, test-1.md, test-2.md, …\n  klasyfikacja.json  (który oryginał trafia do którego działu)\n<\/pre>\n\nSkrypt <code>zbuduj.py<\/code> sam znajduje wszystkie takie katalogi. Nowa klasa albo nowy konkurs:\nutwórz katalog, np. <code>humanistyczny/klasa-6/<\/code>, z plikiem <code>README.md<\/code> i dopisz link\nw menu na tej stronie (w pliku <code>README.md<\/code> w głównym katalogu). Nowy rok: dodaj plik\n<code>testy-przeszle/alfik-RRRR.md<\/code> i wiersz w tabeli w <code>testy-przeszle/README.md<\/code>.\n\n<\/details>\n\n<details><summary>Dla rodzica: jak dodać własne zadanie<\/summary>\n\nPliki z zadaniami to zwykłe pliki <code>.md<\/code> w katalogach <code>zadania-wg-typu<\/code> i <code>testy-probne<\/code>.\nZadanie wygląda tak (5 opcji A–E, pod nimi pole z odpowiedzią w jednej linii):\n\n<pre>\n7. Treść zadania. *(4 pkt)*\n   - A) 10\n   - B) 12\n   - C) 14\n   - D) 16\n   - E) 18\n   &lt;details&gt;&lt;summary&gt;rozwiązanie&lt;/summary&gt;C — 14&lt;br&gt;Wyjaśnienie.&lt;/details&gt;&lt;br&gt;\n<\/pre>\n\nJeśli zmieniasz arkusz w <code>testy-przeszle<\/code>, najpierw uruchom\n<code>python narzedzia/scal_oryginaly.py matematyczny/klasa-5<\/code>.\nSkrypt przeniesie zmiany do działów według <code>klasyfikacja.json<\/code> z katalogu klasy.\nPo zmianach uruchom <code>python zbuduj.py<\/code>. Skrypt złoży wszystko na nowo w plik <code>index.html<\/code>.\nNa GitHubie nie trzeba tego robić ręcznie, bo po każdym pushu na <code>main<\/code> akcja „Strona” sama\nprzebudowuje i publikuje stronę.\n\n<\/details>\n\n<details><summary>Dla rodzica: jak uruchomić stronę na GitHub Pages<\/summary>\n\n1. Wrzuć cały katalog do nowego repozytorium na GitHubie (gałąź <code>main<\/code>).\n2. W repozytorium wejdź w <b>Settings → Pages<\/b> i w <b>Source<\/b> wybierz <b>GitHub Actions<\/b>.\n3. Po minucie strona będzie pod adresem <code>https://&lt;login&gt;.github.io/&lt;nazwa-repozytorium&gt;/<\/code>.\n\nSam plik <code>index.html<\/code> działa też bez GitHuba, po dwukliku na komputerze (potrzebny internet do czcionek).\n\n<\/details>\n"}, {"path": "humanistyczny/klasa-5/README.md", "id": "hum5/start", "kind": "info", "short": "Start", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Alfik Humanistyczny, klasa 5: trening\n\nZadania do nauki przed Ogólnopolskim Konkursem Humanistycznym **Alfik Humanistyczny** dla klasy 5\nszkoły podstawowej. Strona zawiera 330 oryginalnych pytań z 11 arkuszy z lat 2014–2025 i 232 nowe\npytania w stylu Alfika. Odpowiedzi do arkuszy pochodzą z oficjalnych kluczy organizatora.\n\n- **[Zadania według typu](zadania-wg-typu/README.md)** to 7 działów, od czytania tekstu po ortografię.\n  Pytania z prawdziwych arkuszy są wymieszane z nowymi i oznaczone odznaką z rokiem.\n  Klikasz odpowiedź: zielona jest dobra i od razu pokazuje się wyjaśnienie, czerwona jest zła\n  i możesz próbować dalej.\n- **[Testy przeszłe](testy-przeszle/README.md)** to 11 oryginalnych arkuszy dla klasy 5\n  (2014–2025) do rozwiązania na czas, z punktacją jak na konkursie.\n- **[Testy próbne](testy-probne/README.md)** to pełne arkusze: tekst, 30 pytań, 45 minut, punktacja\n  jak na konkursie.\n\nPostęp zapisuje się w przeglądarce, osobno dla każdej strony. Przycisk u góry czyści tylko bieżącą stronę.\n\n---\n\n## Jak wygląda konkurs (klasa 5)\n\n| | |\n|---|---|\n| Czas | **45 minut** |\n| Arkusz | jeden tekst (fragment książki, wiersz albo tekst popularnonaukowy) i **30 pytań** do niego |\n| Odpowiedzi | w arkuszu A–D. Jeśli żadna nie jest dobra, zaznaczasz **E** |\n| Punkty | na start dostajesz **30 pkt**. Pytania 1–10 po **3 pkt**, 11–20 po **4 pkt**, 21–30 po **5 pkt** (razem najwyżej 150) |\n| Brak odpowiedzi | 0 pkt |\n| Zła odpowiedź | **minus ¼** punktów pytania (−0,75 / −1 / −1,25) |\n| Termin | w 2026 roku **9 grudnia**. Dokładne informacje podaje szkoła i organizator na [jersz.pl](https://jersz.pl/alfik-humanistyczny/) |\n\n### Co jest w arkuszu\n\nPierwsza połowa pytań dotyczy **tekstu**: o czym jest, kto jest narratorem, co wynika z tekstu, co czuje bohater.\nDruga połowa to **język**: części mowy, odmiana, części zdania, głoski i sylaby, znaczenie wyrazów.\nWyrazy i zdania do tych pytań są wzięte z tekstu.\n\n### Czy zgadywać?\n\nPoliczmy dla pytania za 4 pkt. Jeśli strzelasz na ślepo spośród 5 odpowiedzi (A–E), trafiasz średnio\nraz na 5 razy: +4 raz, −1 cztery razy, czyli średnio **0 pkt**. Strzelanie w ciemno nic nie daje.\n\nAle gdy **odrzucisz choć jedną** odpowiedź, strzał już się opłaca. Przy 4 pozostałych:\n+4 raz, −1 trzy razy, średnio +¼ pkt. Przy 3 pozostałych: +4 raz, −1 dwa razy, średnio +⅔ pkt.\n\n**Zasada:** nie zgaduj na ślepo. Jeśli umiesz skreślić choć jedną odpowiedź, zaznacz którąś z pozostałych.\n\n### Wskazówki na sam test\n\n1. Przeczytaj tekst **raz, uważnie**, zanim zaczniesz pytania (ok. 5 minut). Potem wracaj do niego przy każdym pytaniu o treść.\n2. Odpowiedź na pytanie o tekst musi wynikać **z tekstu**, a nie z tego, co wiesz albo co wydaje się prawdopodobne.\n3. Pytania językowe rozwiązuj **pytaniami pomocniczymi**: kto? co? (rzeczownik), co robi? (czasownik), jaki? (przymiotnik), jak? (przysłówek)…\n4. Uważaj na słowa „nie”, „wyłącznie”, „tylko”, „wszystkie”, „prawdą jest, że” w pytaniu i w odpowiedziach.\n5. **E** nie jest odpowiedzią „na wszelki wypadek”. Zaznacz E dopiero, gdy sprawdzisz, że każda z odpowiedzi A–D jest zła.\n6. 45 minut na 30 pytań to półtorej minuty na pytanie. Nie utykaj na jednym, wrócisz do niego na końcu.\n\n---\n\n## Plan na 5 tygodni\n\n| Tydzień | Co robić |\n|---|---|\n| 1 | Działy 04–05 (części mowy, odmiana). To podstawa połowy arkusza. Ściągi z końca działów do zeszytu. |\n| 2 | Działy 06–07 (zdanie, głoski i ortografia) i **Test próbny 1** na czas. |\n| 3 | Działy 01–03 (czytanie, literatura, słownictwo) i **Test próbny 2**. |\n| 4 | **Testy przeszłe** od najnowszego: Alfik 2025, 2024, 2023, 2022. |\n| 5 | Kolejne testy przeszłe i powtórka działów, w których było najwięcej błędów. |\n\nPo każdym teście przejrzyj pytania, w których straciłeś punkty, i wróć do ich działu.\n\n## Oryginalne arkusze\n\nWszystkie arkusze dla klasy 5 z lat 2014–2025 są w zakładce [Testy przeszłe](testy-przeszle/README.md).\nOryginały w PDF są na stronie organizatora, [jersz.pl](https://jersz.pl/alfik-humanistyczny/).\nArkusze i klucze są własnością organizatora konkursu (Łowcy Talentów – JERSZ).\n"}, {"path": "humanistyczny/klasa-5/zadania-wg-typu/README.md", "id": "hum5/dzialy", "kind": "info", "short": "Zadania wg typu", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Zadania według typu\n\n331 pytań w 7 działach. Na każdy typ pytań, który pojawia się w Alfiku Humanistycznym, przypada jeden plik.\nW każdym dziale są dwa rodzaje pytań:\n\n- **nowe**, napisane w stylu Alfika (172 pytania),\n- **oryginalne** z arkuszy Alfika dla klasy 5 z lat 2014–2025 (159 pytań). Mają kratkowane tło\n  i odznakę z rokiem, np. „Alfik 2019 · zad. 25”. Kliknięcie odznaki otwiera cały arkusz.\n\nDo działów trafiły tylko te pytania z arkuszy, które da się rozwiązać bez czytania tekstu z arkusza.\nPytania o sam tekst są w [testach przeszłych](../testy-przeszle/README.md).\n\nNa górze działu możesz wybrać, które pytania widać: wszystkie, tylko z arkuszy albo tylko nowe.\nW każdym podrozdziale pytania idą od łatwych (3 pkt) do trudnych (5 pkt). Na końcu działu jest\n**klucz odpowiedzi** i **ściąga** z najważniejszymi regułami.\n\n| # | Dział | Pytań (w tym z arkuszy) | Co w środku |\n|---|---|---|---|\n| 01 | [Czytanie ze zrozumieniem](01-czytanie-ze-zrozumieniem.md) | 39 (5) | 4 krótkie teksty z pytaniami: temat, adresat, fakty i opinie, wnioski, intencje |\n| 02 | [Literatura i środki artystyczne](02-literatura-i-srodki-artystyczne.md) | 28 (6) | rodzaje i gatunki, narrator i podmiot liryczny, epitet, porównanie, przenośnia, uosobienie |\n| 03 | [Słownictwo i frazeologia](03-slownictwo-i-frazeologia.md) | 58 (36) | znaczenie wyrazów, synonimy i antonimy, związki frazeologiczne, budowa wyrazów |\n| 04 | [Części mowy](04-czesci-mowy.md) | 64 (42) | odmienne i nieodmienne części mowy, ile ich jest w zdaniu |\n| 05 | [Odmiana wyrazów](05-odmiana-wyrazow.md) | 44 (20) | przypadki, liczba i rodzaj, osoba, czas i tryb, stopniowanie, temat i końcówka |\n| 06 | [Zdanie i jego części](06-zdanie-i-jego-czesci.md) | 45 (21) | podmiot i orzeczenie, przydawka, dopełnienie, okolicznik, rodzaje zdań |\n| 07 | [Głoski, litery, sylaby i ortografia](07-gloski-litery-sylaby-ortografia.md) | 53 (29) | głoski i litery, samogłoski i spółgłoski, podział na sylaby, pisownia |\n\n**Jak pracować z działem**\n\n1. Najpierw przeczytaj **wskazówki** na górze działu. Dopiero potem klikaj odpowiedzi.\n   Licznik u góry pokazuje też, ile pytań wyszło **za pierwszym razem**, bo tylko to liczy się na konkursie.\n2. Po złej odpowiedzi nie klikaj od razu następnej. Najpierw zastanów się, gdzie był błąd.\n3. Po każdym pytaniu przeczytaj wyjaśnienie, nawet jeśli odpowiedź była dobra. Często jest tam reguła, która przyda się dalej.\n4. Ściągę z końca działu przepisz do zeszytu.\n"}, {"path": "humanistyczny/klasa-5/testy-przeszle/README.md", "id": "hum5/przeszle", "kind": "info", "short": "Testy przeszłe", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Testy przeszłe\n\nOryginalne arkusze Alfika Humanistycznego dla **klasy 5** z 11 edycji konkursu. Rozwiązujesz je\njak na konkursie: tekst, 30 pytań, 45 minut, 30 pkt na start, punkty ujemne za złe odpowiedzi,\nwynik od razu po zakończeniu. W 2020 roku nie było konkursu dla klasy 5.\n\n| Arkusz | Edycja | Tekst |\n|---|---|---|\n| [Alfik 2025](alfik-2025.md) | XXIX | tekst historyczny o Mieszku I (Wikipedia) |\n| [Alfik 2024](alfik-2024.md) | XXVIII | Adam Mickiewicz, *Grażyna* (fragment) |\n| [Alfik 2023](alfik-2023.md) | XXVII | Kornel Makuszyński, *O dwóch takich, co ukradli Księżyc* |\n| [Alfik 2022](alfik-2022.md) | XXVI | Kornel Makuszyński, *Awantura o Basię* |\n| [Alfik 2021](alfik-2021.md) | XXV | Adam Mickiewicz, *Lis i kozieł* |\n| [Alfik 2019](alfik-2019.md) | XXIII | Kornel Makuszyński, *Szaleństwa Panny Ewy* |\n| [Alfik 2018](alfik-2018.md) | XXII | Kornel Makuszyński, *Szatan z siódmej klasy* |\n| [Alfik 2017](alfik-2017.md) | XXI | Aleksander Fredro, *Zemsta* |\n| [Alfik 2016](alfik-2016.md) | XX | Kornel Makuszyński, *Panna z mokrą głową* |\n| [Alfik 2015](alfik-2015.md) | XIX | Edmund Niziurski, *Siódme wtajemniczenie* |\n| [Alfik 2014](alfik-2014.md) | XVIII | Kornel Makuszyński, *Bezgrzeszne lata* |\n\nOdpowiedzi pochodzą z oficjalnych kluczy organizatora. Wyjaśnienia pod pytaniami są nasze, nie organizatora.\n\n**Jak z tego korzystać**\n\n- Zacznij od najnowszych arkuszy. Najlepiej oddają to, czego można się spodziewać w tym roku.\n- Rób jeden arkusz na raz, przy biurku, bez przerw. Najpierw przeczytaj tekst, potem pytania.\n- Po teście przejrzyj pytania, w których straciłeś punkty. Pytania językowe są też w\n  [działach według typu](../zadania-wg-typu/README.md), oznaczone odznaką z rokiem.\n\nArkusze i klucze są własnością organizatora konkursu, Łowcy Talentów – JERSZ. Oryginały w PDF są\nna stronie [jersz.pl](https://jersz.pl/alfik-humanistyczny/).\n"}, {"path": "humanistyczny/klasa-5/testy-probne/README.md", "id": "hum5/testy", "kind": "info", "short": "Testy próbne", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Testy próbne\n\nPełne arkusze ułożone jak na prawdziwym Alfiku Humanistycznym: tekst i 30 pytań do niego, 45 minut,\n10 pytań za 3 pkt, 10 za 4 pkt i 10 za 5 pkt. Na start dostajesz 30 pkt, za złą odpowiedź tracisz\n¼ punktów pytania. Najwięcej można zdobyć 150 pkt.\n\n| Test | Tekst | Poziom |\n|---|---|---|\n| [Test próbny 1](test-1.md) | Janusz Korczak, *Król Maciuś Pierwszy* (fragment) | jak typowy arkusz |\n| [Test próbny 2](test-2.md) | Adam Mickiewicz, *Powrót taty* (fragment ballady) | trochę trudniejszy |\n\n**Jak to działa na stronie**\n\n- Zegar rusza po kliknięciu **Start** albo po pierwszej odpowiedzi. Gdy czas się skończy, test sprawdzi się sam.\n- Odpowiedź zaznaczasz kliknięciem. Drugie kliknięcie ją odznacza, bo puste pole to 0 pkt, a nie minus.\n- Rozwiązania i klucz pokazują się dopiero po kliknięciu **Zakończ i sprawdź**.\n- Wyniki kolejnych podejść zapisują się w przeglądarce, więc widać postęp.\n\n**Najlepiej:** siądź przy biurku, wyłącz inne rzeczy i rób test za jednym zamachem, jak na konkursie.\nPo teście omów z rodzicem każde pytanie, w którym straciłeś punkty.\n"}, {"path": "humanistyczny/klasa-5/zadania-wg-typu/01-czytanie-ze-zrozumieniem.md", "id": "hum5/01-czytanie-ze-zrozumieniem", "kind": "dzial", "short": "01 Czytanie ze zrozumieniem", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# 01. Czytanie ze zrozumieniem\n\n**Dlaczego warto:** Każdy arkusz Alfika Humanistycznego zaczyna się od tekstu — fragmentu powieści, wiersza albo artykułu — i pierwszych kilkanaście pytań dotyczy właśnie jego: tematu, adresata, faktów, wniosków i znaczenia sformułowań. Najłatwiej pomylić się, gdy odpowiedź „brzmi rozsądnie”, ale w tekście jej nie ma, albo gdy zdanie trzeba zrozumieć w przenośni, a nie dosłownie.\n\n- **W pliku:** 39 zadań: 34 nowych i 5 z prawdziwych arkuszy Alfika (12 za 3 pkt, 17 za 4 pkt, 10 za 5 pkt).\n\n**Wskazówki**\n- Zanim zaznaczysz odpowiedź, znajdź w tekście zdanie, które ją potwierdza. Jeśli takiego zdania nie ma, odpowiedź jest zła — nawet gdy w życiu bywa prawdziwa.\n- Uważaj na słowa *zawsze, nigdy, wyłącznie, na pewno, każdy* w odpowiedziach. Często wystarczą, żeby odpowiedź stała się fałszywa.\n- Fakt da się sprawdzić (daty, liczby, miejsca), a opinia wyraża czyjąś ocenę: *najpiękniejszy, sympatyczny, warto, uważam*.\n- *Prawdopodobnie, chyba, być może, zapewne, można sądzić, wydaje się* wyrażają przypuszczenie, a nie pewność.\n- Znaczenie wyrazu sprawdzaj w zdaniu, w którym stoi. Ten sam wyraz w innym kontekście może znaczyć co innego.\n- Pytaj, po co ktoś coś mówi. *Czy możesz zamknąć okno?* to prośba, a nie pytanie o umiejętności, a *No pięknie!* po spóźnieniu to ironia, a nie pochwała.\n- Odpowiedź E wybieraj dopiero wtedy, gdy sprawdzisz w tekście każdą z odpowiedzi A–D.\n\n**Spis treści**\n\n- [A. Tekst 1: Katarynka](#a-tekst-1-katarynka)\n- [B. Tekst 2: Zegar w sieni](#b-tekst-2-zegar-w-sieni)\n- [C. Tekst 3: Jeż przed zimą](#c-tekst-3-jeż-przed-zimą)\n- [D. Tekst 4: Noc w bibliotece](#d-tekst-4-noc-w-bibliotece)\n- [E. Sformułowania i intencje](#e-sformułowania-i-intencje)\n- [Klucz odpowiedzi](#klucz-odpowiedzi)\n- [Ściąga](#ściąga)\n\n---\n\n## A. Tekst 1: Katarynka\n\nPrzeczytaj fragment noweli Bolesława Prusa *Katarynka* (tekst z wolnelektury.pl) i odpowiedz na pytania.\n\n> Dziewczynka zwykle siedziała przy oknie. Było to dziecko z ciemnymi włosami i ładną twarzyczką, ale blade i jakieś nieruchawe. Czasami dziewczynka za pomocą dwu drutów wiązała pasek z bawełnianych nici. Niekiedy bawiła się lalką, którą ubierała i rozbierała powoli, jakby z trudnością. Czasami nie robiła nic, tylko siedząc w oknie przysłuchiwała się czemuś.\n>\n> Pan Tomasz nie widział nigdy, ażeby dziecię to śpiewało lub biegało po pokoju, nie widział nawet uśmiechu na bledziutkich ustach i nieruchomej twarzy.\n>\n> „Dziwne dziecko!” — mówił do siebie mecenas i począł przypatrywać się jej uważniej.\n>\n> (…)\n>\n> Jednego dnia mecenas znalazł się w swoim gabinecie około czwartej. W tej godzinie słońce stało naprzeciw mieszkania jego sąsiadek, a świeciło i dogrzewało bardzo mocno. Pan Tomasz spojrzał na drugą stronę podwórza i widać zobaczył coś niezwykłego, gdyż z pośpiechem założył na nos binokle.\n>\n> Oto co spostrzegł:\n>\n> Mizerna dziewczynka oparłszy głowę na ręku położyła się prawie na wznak w swoim oknie — i — szeroko otwartymi oczyma patrzyła prosto w słońce. Na jej twarzyczce, zwykle tak nieruchomej, grały teraz jakieś uczucia: niby radość, a niby żal…\n>\n> — Ona nie widzi! — szepnął mecenas opuszczając binokle. W tej chwili doświadczył kłucia w oczach na samą myśl, że ktoś może wpatrywać się w słońce, które ziało żywym ogniem.\n\n1. Bohaterami fragmentu są: *(3 pkt)*\n   - A) pan Tomasz i dziewczynka z mieszkania po drugiej stronie podwórza\n   - B) mecenas i jego służąca\n   - C) dziewczynka i jej ojciec\n   - D) kataryniarz i dziewczynka\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — pan Tomasz i dziewczynka z mieszkania po drugiej stronie podwórza<br>Mecenas to pan Tomasz, a dziewczynka mieszka naprzeciwko — mecenas patrzy na nią, spoglądając „na drugą stronę podwórza”. Ojciec dziewczynki ani kataryniarz w tym fragmencie się nie pojawiają.<\/details><br>\n2. Narrator tego fragmentu: *(3 pkt)*\n   - A) jest jednym z bohaterów\n   - B) jest dziewczynką\n   - C) nie bierze udziału w wydarzeniach\n   - D) jest kataryniarzem\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — nie bierze udziału w wydarzeniach<br>Narrator opowiada w trzeciej osobie: „szepnął mecenas”, „Dziewczynka zwykle siedziała”. Nie mówi „ja” i nie jest postacią opowieści.<\/details><br>\n3. Z tekstu wynika, że dziewczynka: *(3 pkt)*\n   - A) często śpiewała i biegała po pokoju\n   - B) miała jasne włosy\n   - C) codziennie chodziła do szkoły\n   - D) bawiła się lalką powoli, jakby z trudnością\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — bawiła się lalką powoli, jakby z trudnością<br>„Niekiedy bawiła się lalką, którą ubierała i rozbierała powoli, jakby z trudnością”. Pan Tomasz nigdy nie widział, żeby śpiewała lub biegała, a włosy miała ciemne.<\/details><br>\n4. Mecenas z pośpiechem założył binokle, ponieważ: *(4 pkt)*\n   - A) chciał przeczytać list\n   - B) zobaczył coś niezwykłego po drugiej stronie podwórza\n   - C) raziło go słońce\n   - D) zawołała go dziewczynka\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — zobaczył coś niezwykłego po drugiej stronie podwórza<br>„Pan Tomasz spojrzał na drugą stronę podwórza i widać zobaczył coś niezwykłego, gdyż z pośpiechem założył na nos binokle”. Binokle to okulary bez zausznic, zakładane na nos.<\/details><br>\n5. Mecenas domyślił się, że dziewczynka nie widzi, ponieważ: *(4 pkt)*\n   - A) powiedziała mu o tym jej matka\n   - B) zobaczył, jak dziewczynka potyka się o meble\n   - C) usłyszał, jak dziewczynka pyta, czy jest noc\n   - D) zauważył, że dziewczynka nosi ciemne okulary\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Mecenas zobaczył, że dziewczynka „szeroko otwartymi oczyma patrzyła prosto w słońce” — człowiek widzący nie mógłby tego zrobić. Pułapka: żadnej z rzeczy z odpowiedzi A–D w tym fragmencie nie ma.<\/details><br>\n6. Wyraz ***nieruchawe*** w zdaniu ***Było to dziecko (…) blade i jakieś nieruchawe.*** znaczy: *(4 pkt)*\n   - A) mało ruchliwe, ospałe\n   - B) niegrzeczne\n   - C) chore na nogi\n   - D) wesołe\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — mało ruchliwe, ospałe<br>Dalej czytamy, że dziewczynka nigdy nie biegała, a lalkę ubierała „powoli, jakby z trudnością” — czyli ruszała się mało i ociężale. Tekst nic nie mówi o chorych nogach.<\/details><br>\n7. Zdanie ***W tej chwili doświadczył kłucia w oczach na samą myśl, że ktoś może wpatrywać się w słońce*** pokazuje, że mecenas: *(5 pkt)*\n   - A) był chory na oczy\n   - B) był obojętny wobec dziewczynki\n   - C) tak się przejął, że niemal sam poczuł ból\n   - D) gniewał się na dziewczynkę\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — tak się przejął, że niemal sam poczuł ból<br>Kłucie pojawiło się „na samą myśl” o patrzeniu w słońce — mecenas tak mocno przeżył to, co zobaczył, jakby sam patrzył w ogień. Pułapka: tekst nie mówi, że był chory na oczy.<\/details><br>\n8. Wyraz ***niby*** w zdaniu ***Na jej twarzyczce (…) grały teraz jakieś uczucia: niby radość, a niby żal…*** pokazuje, że: *(5 pkt)*\n   - A) narrator jest pewien, co czuje dziewczynka\n   - B) dziewczynka płakała\n   - C) dziewczynka niczego nie czuła\n   - D) uczucia dziewczynki były mieszane i trudne do nazwania\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — uczucia dziewczynki były mieszane i trudne do nazwania<br>„Niby… a niby…” znaczy tu „trochę tak, a trochę tak”. Narrator nie jest pewien, co dokładnie czuje dziewczynka, widzi tylko, że to „jakieś uczucia”. Słowo „jakieś” też wyraża niepewność.<\/details><br>\n\n## B. Tekst 2: Zegar w sieni\n\nPrzeczytaj wiersz (tekst własny) i odpowiedz na pytania.\n\n> **Zegar w sieni**\n>\n> W sieni babci, koło szafy,<br>\n> stoi zegar jak żyrafa:<br>\n> szyja długa, tarcza-głowa,<br>\n> a w niej tyka cicha mowa.\n>\n> Złote w środku ma wahadło,<br>\n> które nigdy nie przysiadło:<br>\n> buja się raz tu, raz tam,<br>\n> jak huśtawka — całkiem sam.\n>\n> Tik-tak, tik-tak — bez wytchnienia<br>\n> liczy chwile, liczy cienie,<br>\n> a o każdej pełnej godzinie<br>\n> dźwięczne „bim-bam” w sieni płynie.\n>\n> Rano, ledwie słońce wstanie,<br>\n> woła mnie już na śniadanie:<br>\n> „Bim-bam! Wstawaj już, leniuchu,<br>\n> babcia placki smaży w kuchni!”.\n>\n> Babcia mówi: „Zegar pamięta<br>\n> wszystkie dawne nasze święta<br>\n> i jak tata, chłopiec mały,<br>\n> psocił tutaj przez dzień cały”.\n>\n> Nocą, gdy już dom zasypia<br>\n> i przez szybę księżyc łypie,<br>\n> on jak strażnik w sieni stoi<br>\n> i niczego się nie boi.\n>\n> A ja siadam przy nim w ciszy,<br>\n> słucham — może mnie usłyszy?<br>\n> I tak proszę po kryjomu:<br>\n> „Tykaj wolniej w babci domu…”.\n\n9. Wiersz składa się z: *(3 pkt)*\n   - A) sześciu strof\n   - B) czterech strof po siedem wersów\n   - C) dwudziestu czterech wersów\n   - D) siedmiu strof po cztery wersy\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — siedmiu strof po cztery wersy<br>Strofa (zwrotka) to grupa wersów oddzielona odstępem. Tu jest 7 strof, w każdej 4 wersy, razem 28 wersów. Tytułu nie liczymy jako wersu.<\/details><br>\n10. Osobą mówiącą w wierszu (podmiotem lirycznym) jest: *(3 pkt)*\n    - A) babcia\n    - B) zegar\n    - C) wnuk lub wnuczka babci\n    - D) tata\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — wnuk lub wnuczka babci<br>Mówi ktoś, kto pisze „w sieni babci”, „jak tata (…) psocił”, „ja siadam przy nim” — czyli dziecko taty, a więc wnuk lub wnuczka babci. Pułapka: zegar i babcia też coś mówią w cudzysłowie, ale to tylko przytoczone słowa.<\/details><br>\n11. W wierszu zegar porównano do: *(4 pkt)*\n    - A) żyrafy i strażnika\n    - B) żyrafy i księżyca\n    - C) strażnika i szafy\n    - D) babci i strażnika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — żyrafy i strażnika<br>Porównanie poznasz po wyrazie „jak”: „stoi zegar jak żyrafa”, „on jak strażnik w sieni stoi”. Szafa i księżyc też są w wierszu, ale zegara do nich nie porównano.<\/details><br>\n12. Wyrazy ***tik-tak*** i ***bim-bam*** to: *(4 pkt)*\n    - A) zdrobnienia\n    - B) wyrazy dźwiękonaśladowcze\n    - C) epitety\n    - D) pytania retoryczne\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — wyrazy dźwiękonaśladowcze<br>Te wyrazy naśladują dźwięki: tykanie zegara i bicie godzin. Takie wyrazy nazywamy dźwiękonaśladowczymi (onomatopejami).<\/details><br>\n13. Prośba z ostatnich dwóch wersów wyraża: *(5 pkt)*\n    - A) złość na zegar\n    - B) strach przed nocą\n    - C) chęć, żeby zegar się zepsuł\n    - D) pragnienie, by czas u babci płynął wolniej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — pragnienie, by czas u babci płynął wolniej<br>Zegar „liczy chwile”, więc prośba „Tykaj wolniej w babci domu” znaczy: niech pobyt u babci trwa jak najdłużej. Pułapka: mówiący nie chce, żeby zegar przestał działać, tylko żeby czas mijał wolniej.<\/details><br>\n14. Z wiersza wynika, że: *(5 pkt)*\n    - A) zegar bije co pół godziny\n    - B) zegar dostała babcia od dziadka\n    - C) zegar stoi w pokoju babci\n    - D) zegar zrobił tata\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Zegar bije „o każdej pełnej godzinie”, czyli co godzinę, i stoi w sieni, a nie w pokoju. O dziadku i o tym, kto zrobił zegar, wiersz nic nie mówi — tata tylko „psocił tutaj”, gdy był mały.<\/details><br>\n\n## C. Tekst 3: Jeż przed zimą\n\nPrzeczytaj tekst popularnonaukowy (tekst własny) i odpowiedz na pytania.\n\n> **Jeż przed zimą**\n>\n> Jeż zwyczajny żyje w całej Polsce: w lasach, parkach, a nawet w przydomowych ogrodach. Jest zwierzęciem nocnym — w dzień śpi w kryjówce, a po zmroku wyrusza na poszukiwanie pożywienia. Zjada przede wszystkim chrząszcze, dżdżownice, gąsienice i ślimaki, dlatego ogrodnicy uważają go za sprzymierzeńca.\n>\n> Jesienią jeż musi zgromadzić zapas tłuszczu, bo mniej więcej od listopada do marca lub kwietnia zapada w sen zimowy. Temperatura jego ciała spada wtedy z około 35 do kilku stopni, a serce bije wiele razy wolniej niż latem. Zwierzę budzi się tylko na krótko. Młody jeż, który przed zimą waży mniej niż pół kilograma, prawdopodobnie nie przetrwa do wiosny.\n>\n> Na zimowe legowisko jeż wybiera stertę liści, gałęzi lub chrustu. Dlatego warto zostawić w kącie ogrodu trochę niesprzątniętych liści. Nie należy natomiast poić jeży mlekiem — ich organizm go nie trawi i zwierzę może się rozchorować.\n>\n> Jeże to jedne z najsympatyczniejszych mieszkańców naszych ogrodów. Gdy zobaczysz jeża w dzień, zwłaszcza zimą, najpewniej potrzebuje pomocy. Wtedy poproś dorosłego, żeby zadzwonił do lekarza weterynarii albo do ośrodka pomocy dzikim zwierzętom.\n\n15. Powyższy tekst to: *(3 pkt)*\n    - A) baśń\n    - B) tekst popularnonaukowy\n    - C) list\n    - D) legenda\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — tekst popularnonaukowy<br>Tekst w prosty sposób przekazuje prawdziwe wiadomości o przyrodzie (pokarm, sen zimowy, temperatura ciała) — to cechy tekstu popularnonaukowego. Nie ma w nim fikcyjnych postaci ani zdarzeń.<\/details><br>\n16. Tematem tekstu jest: *(3 pkt)*\n    - A) życie jeża i jego przygotowania do zimy\n    - B) hodowla jeży w domu\n    - C) praca lekarza weterynarii\n    - D) budowa kolców jeża\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — życie jeża i jego przygotowania do zimy<br>Tekst opowiada, gdzie jeż mieszka, co je, jak gromadzi tłuszcz i gdzie przesypia zimę. O kolcach nie ma ani słowa, a weterynarz pojawia się tylko w jednym zdaniu.<\/details><br>\n17. Z tekstu wynika, że jeż: *(3 pkt)*\n    - A) jest aktywny głównie w dzień\n    - B) przez całą zimę szuka pożywienia\n    - C) jest pożyteczny dla ogrodników\n    - D) żywi się głównie owocami\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest pożyteczny dla ogrodników<br>Jeż zjada szkodniki (gąsienice, ślimaki), „dlatego ogrodnicy uważają go za sprzymierzeńca”. Jest aktywny nocą, a zimą śpi.<\/details><br>\n18. Opinią, a nie informacją, którą da się sprawdzić, jest zdanie: *(4 pkt)*\n    - A) Jeż zwyczajny żyje w całej Polsce.\n    - B) Jest zwierzęciem nocnym.\n    - C) Zwierzę budzi się tylko na krótko.\n    - D) Jeże to jedne z najsympatyczniejszych mieszkańców naszych ogrodów.\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — Jeże to jedne z najsympatyczniejszych mieszkańców naszych ogrodów.<br>To, czy ktoś jest sympatyczny, zależy od czyjejś oceny — jeden uzna jeże za najsympatyczniejsze, inny wybierze wiewiórki. Pozostałe zdania podają fakty, które można sprawdzić.<\/details><br>\n19. Wyraz ***sprzymierzeńca*** w zdaniu ***ogrodnicy uważają go za sprzymierzeńca*** znaczy tu: *(4 pkt)*\n    - A) wroga\n    - B) sojusznika, kogoś, kto pomaga\n    - C) szkodnika\n    - D) sąsiada\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — sojusznika, kogoś, kto pomaga<br>Sprzymierzeniec to ktoś, kto jest po naszej stronie. Jeż zjada ślimaki i gąsienice, które niszczą rośliny, więc pomaga ogrodnikom.<\/details><br>\n20. Wyraz ***prawdopodobnie*** w zdaniu o młodym jeżu pokazuje, że autor tekstu: *(5 pkt)*\n    - A) jest całkowicie pewny, że taki jeż zginie\n    - B) żartuje z czytelnika\n    - C) uważa, że lekki jeż na pewno przeżyje zimę\n    - D) nie zna się na jeżach\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>„Prawdopodobnie” wyraża przypuszczenie: autor uważa, że taki jeż raczej nie przeżyje zimy, ale nie twierdzi, że na pewno. Takiej odpowiedzi nie ma wśród A–D. Pułapka: A brzmi podobnie, ale „całkowicie pewny” to coś innego niż „prawdopodobnie”.<\/details><br>\n21. Z tekstu NIE dowiemy się: *(5 pkt)*\n    - A) czym żywi się jeż\n    - B) gdzie jeż urządza zimowe legowisko\n    - C) ile lat żyje jeż\n    - D) dlaczego nie należy poić jeży mlekiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — ile lat żyje jeż<br>Tekst mówi o pokarmie (chrząszcze, dżdżownice…), legowisku (sterta liści) i mleku (organizm go nie trawi). O tym, jak długo żyje jeż, nie ma w nim ani słowa.<\/details><br>\n\n## D. Tekst 4: Noc w bibliotece\n\nPrzeczytaj zaproszenie (tekst własny) i odpowiedz na pytania.\n\n> **Noc w bibliotece**\n>\n> Drodzy Uczniowie klas 4–6!\n>\n> Samorząd Uczniowski i biblioteka szkolna zapraszają na „Noc w bibliotece”, która odbędzie się z piątku 20 na sobotę 21 listopada. Spotykamy się w piątek o godz. 19.00 w czytelni, a rodzice odbierają uczestników w sobotę o godz. 9.00, po wspólnym śniadaniu.\n>\n> W programie: czytanie przy latarkach, nocna gra terenowa po szkolnych korytarzach, konkurs na najstraszniejsze opowiadanie i maraton gier planszowych. Na pewno nikt nie będzie się nudził!\n>\n> Zabierz ze sobą: śpiwór, karimatę, latarkę, piżamę, szczoteczkę do zębów i ulubioną książkę. Telefony zostawiamy w domu.\n>\n> Liczba miejsc jest ograniczona — w nocy w bibliotece może wziąć udział 30 osób. Zgłoszenia z podpisaną zgodą rodziców przyjmuje pani Anna Kowal w bibliotece do środy 18 listopada. Decyduje kolejność zgłoszeń.\n>\n> Do zobaczenia!<br>\n> Samorząd Uczniowski\n\n22. Powyższy tekst to: *(3 pkt)*\n    - A) zaproszenie\n    - B) list prywatny\n    - C) opowiadanie\n    - D) instrukcja obsługi\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — zaproszenie<br>Tekst ma cechy zaproszenia: kto zaprasza, na co, kiedy i gdzie („zapraszają na »Noc w bibliotece«”, piątek, godz. 19.00, czytelnia).<\/details><br>\n23. Adresatami tekstu są: *(3 pkt)*\n    - A) wszyscy uczniowie szkoły\n    - B) rodzice uczniów\n    - C) nauczyciele\n    - D) uczniowie klas 4–6\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — uczniowie klas 4–6<br>Adresata poznasz po zwrocie na początku: „Drodzy Uczniowie klas 4–6!”. Rodzice są w tekście wspomniani, ale zaproszenie nie jest skierowane do nich.<\/details><br>\n24. Licząc od zbiórki do odbioru przez rodziców, uczestnicy spędzą w szkole: *(4 pkt)*\n    - A) całą dobę\n    - B) 12 godzin\n    - C) 14 godzin\n    - D) całą sobotę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — 14 godzin<br>Od 19.00 do północy jest 5 godzin, a od północy do 9.00 — 9 godzin. Razem 14 godzin. Doba to 24 godziny.<\/details><br>\n25. Z zaproszenia wynika, że: *(4 pkt)*\n    - A) każdy chętny na pewno weźmie udział\n    - B) bez zgody rodziców nie można się zgłosić\n    - C) telefony trzeba zabrać ze sobą\n    - D) zgłoszenia przyjmowane są do piątku\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — bez zgody rodziców nie można się zgłosić<br>Zgłoszenie składa się „z podpisaną zgodą rodziców”. Miejsc jest tylko 30, telefony zostają w domu, a zgłoszenia przyjmowane są do środy.<\/details><br>\n26. Zdanie ***Na pewno nikt nie będzie się nudził!*** ma przede wszystkim: *(5 pkt)*\n    - A) zachęcić do udziału\n    - B) ostrzec przed niebezpieczeństwem\n    - C) podać godzinę spotkania\n    - D) zniechęcić młodszych uczniów\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — zachęcić do udziału<br>Po opisie atrakcji pada obietnica dobrej zabawy — autorzy chcą, żeby jak najwięcej osób chciało przyjść. Zdanie nie podaje żadnej informacji, wyraża zachętę.<\/details><br>\n27. Zdanie ***Decyduje kolejność zgłoszeń.*** oznacza, że wezmą udział: *(5 pkt)*\n    - A) uczniowie z najlepszymi ocenami\n    - B) osoby, które zgłoszą się najwcześniej\n    - C) osoby wylosowane spośród chętnych\n    - D) najstarsi uczniowie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — osoby, które zgłoszą się najwcześniej<br>Miejsc jest 30, więc dostaną je pierwsze 30 osób, które oddadzą zgłoszenie. Nie ma losowania ani wyboru według ocen czy wieku.<\/details><br>\n\n## E. Sformułowania i intencje\n\nW tych zadaniach nie ma tekstu — trzeba zrozumieć, co mówiący naprawdę chce wyrazić: pewność czy przypuszczenie, prośbę czy rozkaz, pochwałę czy ironię.\n\n28. Sformułowanie ***Ani mi się śni!*** wyraża: *(3 pkt)*\n    - A) prośbę\n    - B) stanowczą odmowę\n    - C) senność\n    - D) wahanie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — stanowczą odmowę<br>„Ani mi się śni” znaczy „w żadnym wypadku tego nie zrobię”. Pułapka: to wyrażenie nie ma nic wspólnego ze spaniem ani ze snami.<\/details><br>\n29. Zdanie ***Czy mógłbyś zamknąć okno?*** wypowiedziane w zimnym pokoju jest: *(3 pkt)*\n    - A) pytaniem o to, czy ktoś potrafi zamknąć okno\n    - B) rozkazem wydanym ze złością\n    - C) skargą\n    - D) uprzejmą prośbą\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — uprzejmą prośbą<br>Mówiący nie pyta o umiejętności, tylko grzecznie prosi o zamknięcie okna. Tryb przypuszczający („mógłbyś”) sprawia, że prośba brzmi uprzejmie.<\/details><br>\n30. Pewność wyraża wyraz: *(4 pkt)*\n    - A) być może\n    - B) prawdopodobnie\n    - C) chyba\n    - D) zapewne\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Wszystkie cztery wyrażają przypuszczenie: mówiący sądzi, że coś jest prawdą, ale nie jest tego pewny. Pewność wyrażają np. „na pewno”, „z pewnością”, „bez wątpienia”. Pułapka: „zapewne” brzmi jak „na pewno”, ale znaczy „prawdopodobnie”.<\/details><br>\n31. Zdanie ***No pięknie, znowu się spóźniliśmy!*** wyraża: *(4 pkt)*\n    - A) zachwyt\n    - B) pochwałę\n    - C) niezadowolenie wyrażone z ironią\n    - D) radość\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — niezadowolenie wyrażone z ironią<br>Spóźnienie nie jest niczym pięknym — mówiący używa słowa „pięknie” na odwrót, żeby pokazać złość. Mówienie czegoś odwrotnego do tego, co się myśli, to ironia.<\/details><br>\n32. Zdanie ***Spróbuj tylko jeszcze raz wejść do mojego pokoju!*** jest: *(4 pkt)*\n    - A) groźbą\n    - B) zachętą\n    - C) zaproszeniem\n    - D) prośbą o spróbowanie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — groźbą<br>Mówiący wcale nie chce, żeby ktoś próbował — daje do zrozumienia, że jeśli ktoś wejdzie, spotka go coś nieprzyjemnego. Pułapka: zdanie ma formę zachęty („spróbuj”), ale jego sens jest odwrotny.<\/details><br>\n33. Sformułowanie ***Można sądzić*** wyraża: *(4 pkt)* *(Alfik 2025, zad. 11)*\n    - A) zdziwienie\n    - B) pewność\n    - C) przypuszczenie\n    - D) wątpliwość\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — przypuszczenie<br>„Można sądzić” znaczy „prawdopodobnie tak było” — piszący przypuszcza, ale nie ma pewności. Pułapka: to nie wątpliwość, bo piszący skłania się ku temu, że tak było.<\/details><br>\n34. Sformułowanie ***dobrze zorganizowaną drużynę***: *(4 pkt)* *(Alfik 2025, zad. 13)*\n    - A) nie wyraża oceny\n    - B) jest tylko informacją\n    - C) zawiera krytykę\n    - D) wyraża ocenę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — wyraża ocenę<br>Słowo „dobrze” to ocena — ktoś uznał, że drużyna była zorganizowana dobrze. Ocena jest pozytywna, więc to nie krytyka.<\/details><br>\n35. Podkreślone wyrazy w sformułowaniu ***świecą mocno, <u>muszą być<\/u> pancerni*** świadczą o tym, że mówiący: *(4 pkt)* *(Alfik 2024, zad. 20)*\n    - A) wie z pewnością\n    - B) wyciąga wnioski\n    - C) niczego nie wie\n    - D) nie rozumie tego, co widzi\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — wyciąga wnioski<br>Mówiący widzi, że coś mocno świeci, i z tego wnioskuje, że to zbroje. „Muszą być” znaczy tu „na pewno są, skoro…” — to wniosek z obserwacji, a nie pewna wiedza.<\/details><br>\n36. Zdanie „***wył wciąż smutno, jak gdyby błagał kogoś o sprawiedliwość***” wyraża: *(4 pkt)* *(Alfik 2023, zad. 12)*\n    - A) bezradność\n    - B) wściekłość\n    - C) potrzebę zwracania na siebie uwagi\n    - D) wieczne pretensje do świata\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — bezradność<br>Kto błaga o sprawiedliwość, sam nie potrafi się obronić i prosi o pomoc. Wycie jest smutne, a nie gniewne, więc to nie wściekłość.<\/details><br>\n37. Ze zdania ***Trzeba tylko strasznie, z całej siły wierzyć, że będzie lepiej, a będzie lepiej*** wynika, że: *(4 pkt)* *(Alfik 2016, zad. 12)*\n    - A) nie mamy wpływu na swój los\n    - B) nasz los zależy od naszego nastawienia\n    - C) los kpi z człowieka\n    - D) tylko pracą można do czegoś dojść\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — nasz los zależy od naszego nastawienia<br>Zdanie mówi: jeśli mocno wierzysz w lepsze jutro, to ono nadejdzie. Czyli to, jak się nastawiamy, wpływa na to, co nas spotka. Pułapka D: o pracy nie ma tu ani słowa.<\/details><br>\n38. Sformułowanie ***Jak już mówiłam po raz setny…*** świadczy o tym, że mówiąca: *(5 pkt)*\n    - A) dokładnie policzyła, ile razy to powiedziała\n    - B) jest zniecierpliwiona, że musi się powtarzać\n    - C) mówi o tym po raz pierwszy\n    - D) chwali słuchacza za uwagę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest zniecierpliwiona, że musi się powtarzać<br>„Po raz setny” to przesada (nikt nie liczy do stu), która pokazuje, że mówiąca powtarzała to już wiele razy i traci cierpliwość.<\/details><br>\n39. Zdanie ***Nie powiem, żeby ten film mi się podobał.*** oznacza, że mówiący: *(5 pkt)*\n    - A) nie chce zdradzić, czy film mu się podobał\n    - B) zachwycił się filmem\n    - C) nie widział tego filmu\n    - D) nie potrafi ocenić filmu\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>„Nie powiem, żeby…” to grzeczny sposób, by powiedzieć: „raczej mi się nie podobał”. Mówiący wyraża więc ocenę, tylko łagodnie. Takiej odpowiedzi nie ma wśród A–D. Pułapka: A — wydaje się, że mówiący „nie powie”, ale w rzeczywistości właśnie mówi, co myśli.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. A — pan Tomasz i dziewczynka z mieszkania po drugiej stronie podwórza\n2. C — nie bierze udziału w wydarzeniach\n3. D — bawiła się lalką powoli, jakby z trudnością\n4. B — zobaczył coś niezwykłego po drugiej stronie podwórza\n5. E — żadna z powyższych\n6. A — mało ruchliwe, ospałe\n7. C — tak się przejął, że niemal sam poczuł ból\n8. D — uczucia dziewczynki były mieszane i trudne do nazwania\n9. D — siedmiu strof po cztery wersy\n10. C — wnuk lub wnuczka babci\n11. A — żyrafy i strażnika\n12. B — wyrazy dźwiękonaśladowcze\n13. D — pragnienie, by czas u babci płynął wolniej\n14. E — żadna z powyższych\n15. B — tekst popularnonaukowy\n16. A — życie jeża i jego przygotowania do zimy\n17. C — jest pożyteczny dla ogrodników\n18. D — Jeże to jedne z najsympatyczniejszych mieszkańców naszych ogrodów.\n19. B — sojusznika, kogoś, kto pomaga\n20. E — żadna z powyższych\n21. C — ile lat żyje jeż\n22. A — zaproszenie\n23. D — uczniowie klas 4–6\n24. C — 14 godzin\n25. B — bez zgody rodziców nie można się zgłosić\n26. A — zachęcić do udziału\n27. B — osoby, które zgłoszą się najwcześniej\n28. B — stanowczą odmowę\n29. D — uprzejmą prośbą\n30. E — żadna z powyższych\n31. C — niezadowolenie wyrażone z ironią\n32. A — groźbą\n33. C — przypuszczenie *(Alfik 2025, zad. 11)*\n34. D — wyraża ocenę *(Alfik 2025, zad. 13)*\n35. B — wyciąga wnioski *(Alfik 2024, zad. 20)*\n36. A — bezradność *(Alfik 2023, zad. 12)*\n37. B — nasz los zależy od naszego nastawienia *(Alfik 2016, zad. 12)*\n38. B — jest zniecierpliwiona, że musi się powtarzać\n39. E — żadna z powyższych\n\n## Ściąga\n\n| Pytanie o tekst | Jak szukać odpowiedzi | Przykład |\n|---|---|---|\n| temat | o czym jest cały tekst, a nie jedno zdanie | życie jeża i przygotowania do zimy |\n| adresat | do kogo zwraca się tekst: zwrot na początku, słownictwo | „Drodzy Uczniowie klas 4–6!” |\n| rodzaj tekstu | wiersz (wersy, strofy), proza, tekst popularnonaukowy, zaproszenie, ogłoszenie, list | zaproszenie: kto, na co, kiedy, gdzie |\n| narrator / podmiot liryczny | kto mówi: „ja” w tekście czy ktoś spoza wydarzeń | „A ja siadam przy nim w ciszy” |\n| fakt a opinia | fakt da się sprawdzić, opinia to ocena | „żyje w całej Polsce” — fakt; „najsympatyczniejszy” — opinia |\n| „z tekstu wynika” | szukaj zdania, które to potwierdza; wiedza spoza tekstu się nie liczy | „uważają go za sprzymierzeńca” → jest pożyteczny |\n| „z tekstu NIE dowiemy się” | sprawdź każdą odpowiedź w tekście; zostaje ta, której brak | ile lat żyje jeż |\n| znaczenie wyrazu | czytaj całe zdanie i zdania obok | nieruchawe = mało ruchliwe |\n| przypuszczenie | prawdopodobnie, chyba, być może, zapewne, można sądzić, wydaje się | „prawdopodobnie nie przetrwa” |\n| pewność | na pewno, z pewnością, bez wątpienia | „Na pewno nikt nie będzie się nudził!” |\n| ironia | mówi się odwrotnie, niż się myśli | „No pięknie, znowu się spóźniliśmy!” |\n| intencja | prośba, rozkaz, groźba, ostrzeżenie, zachęta, odmowa | „Ani mi się śni!” — odmowa |\n"}, {"path": "humanistyczny/klasa-5/zadania-wg-typu/02-literatura-i-srodki-artystyczne.md", "id": "hum5/02-literatura-i-srodki-artystyczne", "kind": "dzial", "short": "02 Literatura i środki artystyczne", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# 02. Literatura i środki artystyczne\n\n**Dlaczego warto:** W każdym arkuszu Alfika jest kilka pytań o tekst jako utwór: czy to wiersz, czy proza, kto mówi (narrator czy podmiot liryczny) i jakie środki artystyczne zastosowano. Najłatwiej pomylić narratora z autorem, porównanie z przenośnią i wziąć każde „jak” za porównanie.\n\n- **W pliku:** 28 zadań: 22 nowych i 6 z prawdziwych arkuszy Alfika (10 za 3 pkt, 9 za 4 pkt, 9 za 5 pkt).\n\n**Wskazówki**\n- Trzy rodzaje literackie: **epika** (jest narrator, który opowiada), **liryka** (jest podmiot liryczny, który wyraża uczucia), **dramat** (nie ma narratora, są dialogi i didaskalia — tekst do wystawienia na scenie).\n- Wiersz czy proza to sprawa **zapisu** (wersy, rymy albo zwykłe akapity), a nie rodzaju: bajka pisana wierszem i tak jest utworem epickim, bo coś opowiada.\n- Autor to prawdziwy człowiek, który napisał tekst. Narrator i podmiot liryczny są „wymyśleni” razem z utworem — dorosły pisarz może oddać głos dziecku albo psu.\n- Narrator mówiący ***ja*** i biorący udział w wydarzeniach to narrator **pierwszoosobowy** (uczestnik). Narrator, który zna myśli i uczucia wszystkich bohaterów, to narrator **wszechwiedzący**.\n- **Porównanie** ma słówko łączące: *jak, niby, niczym, jakby, podobny do*. **Przenośnia** (metafora) mówi o czymś innymi słowami bez takiego słówka: ***morze łez***.\n- **Uosobienie**: rzecz, zwierzę albo zjawisko myśli, czuje lub zachowuje się jak człowiek (***księżyc się zamyślił***). **Epitet** to określenie rzeczownika, najczęściej przymiotnik (***złote liście***).\n- Pułapka: nie każde „jak” to porównanie — w ***zapytał, jak dojść*** nic do niczego nie porównujemy.\n\n**Spis treści**\n\n- [A. Rodzaje i gatunki literackie](#a-rodzaje-i-gatunki-literackie)\n- [B. Narrator, podmiot liryczny i bohater](#b-narrator-podmiot-liryczny-i-bohater)\n- [C. Środki artystyczne](#c-środki-artystyczne)\n- [Klucz odpowiedzi](#klucz-odpowiedzi)\n- [Ściąga](#ściąga)\n\n---\n\n## A. Rodzaje i gatunki literackie\n\nZanim odpowiesz, zapytaj: czy ktoś tu opowiada (epika), czy wyraża uczucia (liryka), czy postaci rozmawiają na scenie (dramat)?\n\n1. Didaskalia, czyli wskazówki dla aktorów zapisane zwykle w nawiasach, występują w: *(3 pkt)*\n   - A) legendzie\n   - B) bajce\n   - C) dramacie\n   - D) powieści\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — dramacie<br>Dramat jest pisany do wystawienia w teatrze, więc autor podpowiada w didaskaliach, co aktorzy mają robić i jak wygląda scena. W legendzie, bajce i powieści wydarzenia opowiada narrator.<\/details><br>\n2. Opowieść o Warsie i Sawie, która wyjaśnia, skąd wzięła się nazwa Warszawy, to: *(3 pkt)*\n   - A) legenda\n   - B) mit\n   - C) baśń\n   - D) bajka\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — legenda<br>Legenda jest związana z konkretnym, prawdziwym miejscem (tu: Warszawą) i często wyjaśnia pochodzenie jego nazwy. Mit opowiada o bogach i herosach, a baśń dzieje się „za siedmioma górami”, w nieokreślonym miejscu.<\/details><br>\n3. Morał, czyli pouczenie wypowiedziane wprost, najczęściej na końcu utworu, jest cechą: *(3 pkt)*\n   - A) mitu\n   - B) bajki\n   - C) legendy\n   - D) komiksu\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — bajki<br>Bajka (np. bajki Ignacego Krasickiego) to krótki utwór, w którym zwierzęta mają ludzkie cechy, a na końcu pada morał. Pułapka: nie myl bajki z baśnią — baśń jest dłuższa i nie ma morału zapisanego wprost.<\/details><br>\n4. Opowieść starożytnych Greków o bogach i herosach, która wyjaśnia na przykład, skąd się wzięły pory roku, to: *(4 pkt)*\n   - A) baśń\n   - B) legenda\n   - C) przypowieść\n   - D) mit\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — mit<br>Mity to opowieści o bogach i herosach, które wyjaśniały ludziom świat — np. mit o Demeter i Persefonie tłumaczy, dlaczego jest zima.<\/details><br>\n5. Do epiki NIE należy: *(4 pkt)*\n   - A) baśń\n   - B) legenda\n   - C) powieść\n   - D) opowiadanie\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Baśń, legenda, powieść i opowiadanie to gatunki epickie — we wszystkich narrator opowiada o wydarzeniach. Pułapka: w pytaniu z „NIE” trzeba sprawdzić każdą opcję; skoro wszystkie należą do epiki, poprawna jest E.<\/details><br>\n6. Dramat różni się od utworów epickich tym, że: *(4 pkt)*\n   - A) nie ma w nim narratora\n   - B) jest zawsze pisany wierszem\n   - C) zawsze kończy się szczęśliwie\n   - D) nie występują w nim bohaterowie\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — nie ma w nim narratora<br>W dramacie nikt nie opowiada — bohaterowie sami mówią (dialogi), a resztę podpowiadają didaskalia. Dramat może być pisany prozą albo wierszem i może kończyć się smutno.<\/details><br>\n7. Cechą baśni NIE jest: *(5 pkt)*\n   - A) walka dobra ze złem\n   - B) nieokreślony czas i miejsce akcji\n   - C) występowanie postaci fantastycznych\n   - D) dokładnie podana data i miejsce wydarzeń\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — dokładnie podana data i miejsce wydarzeń<br>Baśń zaczyna się zwykle od „dawno, dawno temu, za siedmioma górami” — czas i miejsce są nieokreślone. Są w niej czarownice, wróżki i smoki, a dobro wygrywa ze złem.<\/details><br>\n8. Wiersz, w którym ktoś wyraża swoje uczucia i przeżycia, należy do: *(5 pkt)*\n   - A) epiki\n   - B) dramatu\n   - C) liryki\n   - D) bajki\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — liryki<br>Liryka to rodzaj literacki, w którym najważniejsze są uczucia i przeżycia podmiotu lirycznego. Pułapka: bajka to gatunek, a nie rodzaj literacki — i należy do epiki.<\/details><br>\n\n## B. Narrator, podmiot liryczny i bohater\n\nKto mówi w tekście? W utworze epickim — narrator, w wierszu lirycznym — podmiot liryczny (osoba mówiąca). Żaden z nich nie jest autorem.\n\n9. Osobę, która wypowiada się w utworze lirycznym, nazywamy: *(3 pkt)*\n   - A) narratorem\n   - B) podmiotem lirycznym\n   - C) adresatem\n   - D) bohaterem tytułowym\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — podmiotem lirycznym<br>W liryce mówi podmiot liryczny, w epice — narrator. Adresat to ten, do kogo się mówi, a nie ten, kto mówi.<\/details><br>\n10. Narrator, który opowiada o wydarzeniach, w których sam brał udział, i mówi o sobie ***ja***, to narrator: *(3 pkt)*\n    - A) wszechwiedzący\n    - B) trzecioosobowy\n    - C) nieuczestniczący w wydarzeniach\n    - D) pierwszoosobowy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — pierwszoosobowy<br>Mówi w pierwszej osobie (***ja poszedłem***, ***widziałam***) i jest uczestnikiem zdarzeń. Narrator trzecioosobowy mówi o bohaterach ***on***, ***ona***, ***oni***.<\/details><br>\n11. Narrator, który mówi: ***Tamtego lata po raz pierwszy sam pojechałem na obóz.***: *(4 pkt)*\n    - A) jest uczestnikiem wydarzeń\n    - B) nie bierze udziału w wydarzeniach\n    - C) zna myśli wszystkich bohaterów\n    - D) jest dziewczynką\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — jest uczestnikiem wydarzeń<br>***Pojechałem*** — narrator mówi o sobie w pierwszej osobie, więc brał udział w tym, o czym opowiada. Forma ***pojechałem*** (a nie ***pojechałam***) pokazuje, że to chłopiec, a nie dziewczynka.<\/details><br>\n12. W zdaniu ***Kasia uśmiechała się do wszystkich, ale w środku drżała ze strachu, bo myślała tylko o jutrzejszym sprawdzianie.*** narrator: *(4 pkt)*\n    - A) jest Kasią\n    - B) mówi w pierwszej osobie\n    - C) zna myśli i uczucia bohaterki\n    - D) zwraca się do Kasi\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — zna myśli i uczucia bohaterki<br>Z zewnątrz widać tylko uśmiech, a narrator wie, że Kasia „drżała ze strachu” i o czym myślała — tak opowiada narrator wszechwiedzący. Mówi o niej ***ona*** (trzecia osoba), więc nie jest Kasią i nie mówi do niej.<\/details><br>\n13. Bohater, który pojawia się w utworze tylko raz i na krótko, to bohater: *(4 pkt)*\n    - A) główny\n    - B) pierwszoplanowy\n    - C) tytułowy\n    - D) zbiorowy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Taki bohater to bohater epizodyczny — a tej nazwy nie ma wśród odpowiedzi. Bohater główny i pierwszoplanowy są w centrum wydarzeń, tytułowy występuje w tytule, a zbiorowy to grupa ludzi (np. mieszkańcy wsi).<\/details><br>\n14. Wiersz napisała dorosła poetka, a zaczyna się od słów ***Mam dziesięć lat i boję się ciemności***. Prawdą jest, że: *(5 pkt)*\n    - A) podmiotem lirycznym jest poetka\n    - B) osobą mówiącą w wierszu jest dziecko\n    - C) w wierszu nie ma podmiotu lirycznego\n    - D) jest to utwór epicki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — osobą mówiącą w wierszu jest dziecko<br>Mówiący ma dziesięć lat, więc to dziecko. Pułapka: podmiot liryczny to nie autor — dorosła poetka może „oddać głos” dziecku.<\/details><br>\n15. W wierszu ***Lubię, kiedy deszcz stuka w szyby, / a ja siedzę z książką pod kocem.*** podmiot liryczny: *(5 pkt)*\n    - A) nie ujawnia się w wierszu\n    - B) zwraca się do deszczu\n    - C) mówi o sobie w pierwszej osobie\n    - D) opowiada o przygodach bohatera\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — mówi o sobie w pierwszej osobie<br>***Lubię***, ***ja siedzę*** — podmiot liryczny mówi wprost o sobie i swoich uczuciach. Do deszczu nie mówi, tylko o nim.<\/details><br>\n\n## C. Środki artystyczne\n\nSzukaj „znaków rozpoznawczych”: słówko *jak* lub *niczym* — porównanie; rzecz zachowuje się jak człowiek — uosobienie; przymiotnik przy rzeczowniku — epitet.\n\n16. W którym sformułowaniu jest porównanie? *(3 pkt)*\n    - A) ***złote liście***\n    - B) ***wiatr śpiewa***\n    - C) ***kap, kap, kap***\n    - D) ***oczy jak gwiazdy***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — ***oczy jak gwiazdy***<br>Porównanie zestawia dwie rzeczy za pomocą słówka ***jak***: oczy błyszczą jak gwiazdy. ***Złote liście*** to epitet, ***wiatr śpiewa*** — uosobienie, ***kap, kap*** — wyrazy dźwiękonaśladowcze.<\/details><br>\n17. Epitetami w sformułowaniu ***stary, drewniany most*** są wyrazy: *(3 pkt)*\n    - A) ***stary, drewniany***\n    - B) ***most***\n    - C) ***drewniany most***\n    - D) tylko ***stary***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — ***stary, drewniany***<br>Epitet to określenie rzeczownika — tu oba przymiotniki opisują most. Sam rzeczownik ***most*** epitetem nie jest.<\/details><br>\n18. Wyrazem dźwiękonaśladowczym jest: *(3 pkt)*\n    - A) ***las***\n    - B) ***kukuryku***\n    - C) ***wiatr***\n    - D) ***kot***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — ***kukuryku***<br>Wyraz dźwiękonaśladowczy naśladuje dźwięk — ***kukuryku*** to głos koguta. Pozostałe wyrazy tylko nazywają rzeczy i zwierzęta.<\/details><br>\n19. Sformułowanie ***czarnych chmur powodzi***: *(3 pkt)* *(Alfik 2024, zad. 8)*\n    - A) jest komiczne\n    - B) wprowadza radosny nastrój\n    - C) wprowadza ponury nastrój\n    - D) nie buduje nastroju\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — wprowadza ponury nastrój<br>Mnóstwo czarnych chmur kojarzy się z ciemnością i groźną pogodą, więc nastrój jest ponury.<\/details><br>\n20. Sformułowanie ***chmur powodzi***: *(3 pkt)* *(Alfik 2024, zad. 9)*\n    - A) ma charakter przenośny\n    - B) należy rozumieć dosłownie\n    - C) nie zawiera epitetu\n    - D) zawiera przymiotnik\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — ma charakter przenośny<br>Nie chodzi o prawdziwą powódź, tylko o ogromną masę chmur, która zalewa niebo jak woda — to przenośnia (metafora). Oba wyrazy to rzeczowniki, więc przymiotnika nie ma. Uwaga: skoro nie ma tu przymiotnika, można uznać, że nie ma też epitetu, i wtedy C też byłoby prawdziwe. Oficjalna odpowiedź to A.<\/details><br>\n21. Uosobienie występuje w sformułowaniu: *(4 pkt)*\n    - A) ***księżyc zamyślił się nad jeziorem***\n    - B) ***księżyc świecił jasno***\n    - C) ***księżyc jak rogalik***\n    - D) ***srebrny księżyc***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — ***księżyc zamyślił się nad jeziorem***<br>Myśleć potrafi człowiek — księżyc dostał ludzką cechę, to uosobienie. Świecenie to zwykła cecha księżyca, ***jak rogalik*** to porównanie, a ***srebrny*** — epitet.<\/details><br>\n22. Sformułowanie ***morze łez*** to: *(4 pkt)*\n    - A) epitet\n    - B) porównanie\n    - C) wyraz dźwiękonaśladowczy\n    - D) uosobienie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>***Morze łez*** to przenośnia (metafora): nie ma tu prawdziwego morza, tylko bardzo dużo łez. Nie ma słówka ***jak***, więc to nie porównanie. Pułapka: przenośni nie ma wśród odpowiedzi, więc poprawna jest E.<\/details><br>\n23. Wypowiedzenie ***młodość bucha z niej jak żar ze słońca***: *(4 pkt)* *(Alfik 2016, zad. 13)*\n    - A) zawiera porównanie\n    - B) należy rozumieć dosłownie\n    - C) zawiera epitety\n    - D) oznacza: starzeć się\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — zawiera porównanie<br>Porównanie zestawia dwie rzeczy za pomocą słów „jak”, „niby”, „jakby”: młodość bucha „jak żar ze słońca”. Epitet to określenie rzeczownika (np. „gorący żar”) — tu żadnego nie ma.<\/details><br>\n24. W którym zdaniu NIE ma porównania? *(5 pkt)*\n    - A) ***Biegł szybko jak strzała.***\n    - B) ***Jej włosy były niczym len.***\n    - C) ***Zapytał, jak dojść na dworzec.***\n    - D) ***Chmury płynęły niby statki.***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — ***Zapytał, jak dojść na dworzec.***<br>Tu ***jak*** znaczy „w jaki sposób” i niczego do niczego nie porównuje. W pozostałych zdaniach coś jest porównane do czegoś: do strzały, do lnu, do statków. Pułapka: nie każde ***jak*** tworzy porównanie.<\/details><br>\n25. W wersie ***Ojczyzno moja! ty jesteś jak zdrowie*** (Adam Mickiewicz) występuje: *(5 pkt)*\n    - A) tylko porównanie\n    - B) tylko zwrot do adresata\n    - C) wyraz dźwiękonaśladowczy\n    - D) porównanie i zwrot do adresata\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — porównanie i zwrot do adresata<br>Poeta zwraca się wprost do ojczyzny (***Ojczyzno moja!***) — to zwrot do adresata, czyli apostrofa. Porównuje ją do zdrowia (***jak zdrowie***). Są więc oba środki, dlatego „tylko” w A i B jest błędne.<\/details><br>\n26. Wypowiedzenie ***goniony przez Jacka i Placka jakby przez kąśliwe ogary***: *(5 pkt)* *(Alfik 2023, zad. 26)*\n    - A) oznacza: biegł wolno\n    - B) nie zawiera epitetu\n    - C) zawiera porównanie\n    - D) nie zawiera rzeczownika w formie biernika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — zawiera porównanie<br>Porównanie zestawia dwie rzeczy za pomocą słów jak, jakby, niczym — tu chłopców porównano do psów myśliwskich („jakby przez kąśliwe ogary”). Epitet jest („kąśliwe”), a po „przez” stoi biernik (przez kogo? co? — Jacka, ogary).<\/details><br>\n27. Zaznaczone określenie ***malarza, który sam był <u>płomieniem gorejącym<\/u>***: *(5 pkt)* *(Alfik 2019, zad. 23)*\n    - A) nie zawiera epitetu\n    - B) jest porównaniem\n    - C) ma charakter przenośny\n    - D) należy rozumieć dosłownie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — ma charakter przenośny<br>Malarz nie był prawdziwym ogniem — „płomień” oznacza tu jego zapał i żywiołowość, to przenośnia. Pułapka B: porównanie miałoby słowo „jak” (był jak płomień). *Gorejącym* to epitet, więc A odpada.<\/details><br>\n28. W zdaniu ***(…) ta nieznana mu jeszcze historia pachnie awanturą jak łąka sianem***: *(5 pkt)* *(Alfik 2018, zad. 30)*\n    - A) nie występuje czasownik w formie osobowej\n    - B) występuje porównanie\n    - C) nie ma rzeczownika w mianowniku\n    - D) wszystkie rzeczowniki mają formę mianownika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — występuje porównanie<br>Porównanie zestawia dwie rzeczy za pomocą słów *jak*, *niczym*, *jakby*: historia pachnie awanturą *jak* łąka sianem. *Pachnie* to czasownik w formie osobowej; *historia* i *łąka* są w mianowniku, a *awanturą* i *sianem* w narzędniku.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. C — dramacie\n2. A — legenda\n3. B — bajki\n4. D — mit\n5. E — żadna z powyższych\n6. A — nie ma w nim narratora\n7. D — dokładnie podana data i miejsce wydarzeń\n8. C — liryki\n9. B — podmiotem lirycznym\n10. D — pierwszoosobowy\n11. A — jest uczestnikiem wydarzeń\n12. C — zna myśli i uczucia bohaterki\n13. E — żadna z powyższych\n14. B — osobą mówiącą w wierszu jest dziecko\n15. C — mówi o sobie w pierwszej osobie\n16. D — ***oczy jak gwiazdy***\n17. A — ***stary, drewniany***\n18. B — ***kukuryku***\n19. C — wprowadza ponury nastrój *(Alfik 2024, zad. 8)*\n20. A — ma charakter przenośny *(Alfik 2024, zad. 9)*\n21. A — ***księżyc zamyślił się nad jeziorem***\n22. E — żadna z powyższych\n23. A — zawiera porównanie *(Alfik 2016, zad. 13)*\n24. C — ***Zapytał, jak dojść na dworzec.***\n25. D — porównanie i zwrot do adresata\n26. C — zawiera porównanie *(Alfik 2023, zad. 26)*\n27. C — ma charakter przenośny *(Alfik 2019, zad. 23)*\n28. B — występuje porównanie *(Alfik 2018, zad. 30)*\n\n## Ściąga\n\n| Pojęcie | Jak rozpoznać | Przykład |\n|---|---|---|\n| Epika | jest narrator, który opowiada o wydarzeniach | baśń, legenda, mit, bajka, opowiadanie, powieść |\n| Liryka | podmiot liryczny wyraża uczucia i przeżycia | wiersz o tęsknocie, o przyrodzie |\n| Dramat | brak narratora; dialogi, didaskalia, akty i sceny | „Zemsta” Fredry |\n| Baśń / legenda | baśń: czas i miejsce nieokreślone, czary; legenda: prawdziwe miejsce lub postać | „Kopciuszek” / „Wars i Sawa” |\n| Mit / bajka | mit: bogowie i herosi; bajka: zwierzęta z ludzkimi cechami i morał | mit o Demeter / bajki Krasickiego |\n| Narrator | pierwszoosobowy (***ja***, uczestnik) albo trzecioosobowy; wszechwiedzący zna myśli bohaterów | ***Pojechałem…*** / ***Kasia pomyślała…*** |\n| Podmiot liryczny | osoba mówiąca w wierszu — nie autor! | dorosły poeta może mówić głosem dziecka |\n| Epitet | określenie rzeczownika | ***złote liście*** |\n| Porównanie | *jak, niby, niczym, jakby, podobny do* | ***oczy jak gwiazdy*** |\n| Przenośnia (metafora) | znaczenie niedosłowne, bez słówka *jak* | ***morze łez*** |\n| Uosobienie | rzecz, zwierzę, zjawisko myśli lub czuje jak człowiek | ***księżyc się zamyślił*** |\n| Wyraz dźwiękonaśladowczy / apostrofa | naśladuje dźwięk / zwrot do kogoś lub czegoś | ***kukuryku*** / ***Ojczyzno moja!*** |\n"}, {"path": "humanistyczny/klasa-5/zadania-wg-typu/03-slownictwo-i-frazeologia.md", "id": "hum5/03-slownictwo-i-frazeologia", "kind": "dzial", "short": "03 Słownictwo i frazeologia", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# 03. Słownictwo i frazeologia\n\n**Dlaczego warto:** W każdym arkuszu Alfika kilka pytań brzmi „sformułowanie … oznacza” albo „podkreślony wyraz znaczy”. Trzeba znać znaczenie trudniejszych wyrazów i popularnych związków frazeologicznych, a pułapką bywa dosłowne odczytanie frazeologizmu albo wyraz podobnie brzmiący, ale niespokrewniony.\n\n- **W pliku:** 58 zadań: 22 nowych i 36 z prawdziwych arkuszy Alfika (9 za 3 pkt, 22 za 4 pkt, 27 za 5 pkt).\n\n**Wskazówki**\n- **Synonimy** to wyrazy o podobnym znaczeniu (***odważny – mężny***), **antonimy** — o przeciwnym (***hałaśliwy – cichy***). Sprawdź, wstawiając wyraz do tego samego zdania.\n- Wiele wyrazów ma kilka znaczeń (***zamek*** w drzwiach i ***zamek*** króla) — o znaczeniu decyduje **zdanie**, w którym wyraz stoi.\n- **Związek frazeologiczny** rozumiemy w przenośni, nie dosłownie: kto ***ma muchy w nosie***, nie ma owadów, tylko jest w złym humorze.\n- Przy nieznanym wyrazie poszukaj w nim znanej cząstki: ***łakomczuch*** — ***łakomy***, ***rychło*** — ***rychły***, czyli szybki.\n- **Wyrazy pokrewne** mają wspólny **rdzeń** i są połączone znaczeniem: ***las, lasek, leśniczy***. Podobne brzmienie nie wystarczy — ***lis*** nie należy do rodziny ***lasu***.\n- **Zdrobnienie** zmniejsza lub czuli (***domek***), **zgrubienie** powiększa lub wyraża niechęć (***domisko***). **Wyraz złożony** powstał z dwóch wyrazów (***długopis*** = ***długo*** + ***pisać***).\n\n**Spis treści**\n\n- [A. Znaczenie wyrazów, synonimy i antonimy](#a-znaczenie-wyrazów-synonimy-i-antonimy)\n- [B. Związki frazeologiczne i przysłowia](#b-związki-frazeologiczne-i-przysłowia)\n- [C. Budowa i pochodzenie wyrazów](#c-budowa-i-pochodzenie-wyrazów)\n- [Klucz odpowiedzi](#klucz-odpowiedzi)\n- [Ściąga](#ściąga)\n\n---\n\n## A. Znaczenie wyrazów, synonimy i antonimy\n\nWstaw każdą odpowiedź w miejsce wyrazu z pytania — poprawna nie zmieni sensu zdania (synonim) albo odwróci go (antonim).\n\n1. Synonimem wyrazu ***odważny*** jest: *(3 pkt)*\n   - A) mężny\n   - B) tchórzliwy\n   - C) ostrożny\n   - D) rozważny\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — mężny<br>Mężny znaczy „odważny, dzielny”. ***Tchórzliwy*** to antonim, a ostrożny i rozważny to zupełnie inne cechy.<\/details><br>\n2. Antonimem wyrazu ***hałaśliwy*** jest: *(3 pkt)*\n   - A) głośny\n   - B) wrzaskliwy\n   - C) cichy\n   - D) gwarny\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — cichy<br>Antonim ma znaczenie przeciwne. Głośny, wrzaskliwy i gwarny to synonimy wyrazu ***hałaśliwy***.<\/details><br>\n3. W zdaniu ***Zamek w drzwiach znowu się zaciął.*** wyraz ***zamek*** oznacza: *(3 pkt)*\n   - A) budowlę obronną\n   - B) suwak w kurtce\n   - C) budowlę z piasku\n   - D) urządzenie do zamykania\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — urządzenie do zamykania<br>***Zamek*** ma kilka znaczeń, a zdanie podpowiada, o które chodzi: zamek „w drzwiach” to urządzenie, które zamyka się na klucz.<\/details><br>\n4. Która para wyrazów NIE jest parą synonimów? *(4 pkt)*\n   - A) ***mądry – rozumny***\n   - B) ***szybki – prędki***\n   - C) ***smutny – markotny***\n   - D) ***dzielny – waleczny***\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Wszystkie cztery pary to synonimy: wyrazy w każdej parze znaczą prawie to samo. Pułapka: w pytaniu z „NIE” łatwo wybrać pierwszą lepszą parę — trzeba sprawdzić każdą.<\/details><br>\n5. W zdaniu ***Tomek skwapliwie przyjął zaproszenie.*** wyraz ***skwapliwie*** oznacza: *(4 pkt)*\n   - A) niechętnie\n   - B) chętnie i szybko\n   - C) z obawą\n   - D) z opóźnieniem\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — chętnie i szybko<br>Kto robi coś skwapliwie, robi to z zapałem, bez zastanawiania się, bo bardzo tego chce. Odpowiedź A znaczy coś odwrotnego.<\/details><br>\n6. ***Łakomczuch*** to ktoś, kto: *(4 pkt)*\n   - A) dużo śpi\n   - B) chętnie się dzieli\n   - C) lubi dużo i chciwie jeść\n   - D) jest bardzo leniwy\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — lubi dużo i chciwie jeść<br>W wyrazie ***łakomczuch*** jest cząstka ***łakomy***, czyli chciwy na jedzenie, zwłaszcza na smakołyki.<\/details><br>\n7. Sformułowanie ***most zwodzony z łoskotem opada*** informuje, że most opada: *(4 pkt)* *(Alfik 2024, zad. 19)*\n   - A) wolno\n   - B) majestatycznie\n   - C) efektownie\n   - D) głośno\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — głośno<br>Łoskot to głośny huk, trzask. „Z łoskotem” znaczy więc „głośno”.<\/details><br>\n8. Podkreślony wyraz w sformułowaniu ***<u>baczne<\/u> spojrzenie*** oznacza: *(4 pkt)* *(Alfik 2019, zad. 16)*\n   - A) nieufne\n   - B) uważne\n   - C) przelotne\n   - D) zalotne\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — uważne<br>*Baczny* znaczy uważny, czujny (pokrewne: baczność, zwracać baczną uwagę). Pułapka C: przelotne spojrzenie jest krótkie i nieuważne — to prawie przeciwieństwo.<\/details><br>\n9. Podkreślony wyraz we fragmencie ***– Tak sobie – <u>bąknąłem<\/u>*** oznacza: *(4 pkt)* *(Alfik 2019, zad. 18)*\n   - A) zdecydowanie zabrać głos\n   - B) zaznaczyć swoją obecność\n   - C) powiedzieć coś od niechcenia\n   - D) wyrazić niezadowolenie\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — powiedzieć coś od niechcenia<br>*Bąknąć* to powiedzieć coś cicho, niewyraźnie, mimochodem. Pułapka A: zdecydowanie zabrać głos to przeciwieństwo bąknięcia.<\/details><br>\n10. Wyraz ***sekret***: *(4 pkt)* *(Alfik 2017, zad. 16)*\n    - A) nie jest rzeczownikiem\n    - B) można zastąpić formą *tajemnica*\n    - C) nie odmienia się przez przypadki\n    - D) nie ma formy liczby mnogiej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — można zastąpić formą *tajemnica*<br>Sekret to tajemnica — to synonimy. „Sekret” jest rzeczownikiem, odmienia się (sekretu, sekretem) i ma liczbę mnogą (sekrety).<\/details><br>\n11. Podkreślony wyraz w wypowiedzeniu ***Byle tylko (…)/Między nami była <u>kwita<\/u>***: *(4 pkt)* *(Alfik 2017, zad. 19)*\n    - A) znaczy *konflikt*\n    - B) jest zaimkiem\n    - C) ma formę czasu przyszłego\n    - D) znaczy *zgoda*\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — znaczy *zgoda*<br>„Kwita” znaczy: jesteśmy rozliczeni, nikt nikomu nic nie jest winien — czyli zgoda, spokój. Pułapka A: to coś odwrotnego.<\/details><br>\n12. Podkreślony wyraz w sformułowaniu ***<u>głośnego<\/u> dziś uczonego*** oznacza: *(4 pkt)* *(Alfik 2014, zad. 19)*\n    - A) hałaśliwego\n    - B) sławnego\n    - C) poważnego\n    - D) mądrego\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — sławnego<br>„Głośny” uczony to taki, o którym dużo się mówi, czyli znany, sławny. Pułapka A: „głośny” zwykle znaczy „hałaśliwy”, ale tu ma znaczenie przenośne.<\/details><br>\n13. ***Niesnaski*** to: *(4 pkt)* *(Alfik 2014, zad. 20)*\n    - A) spory\n    - B) rozmowy\n    - C) zabawy\n    - D) śmiesznostki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — spory<br>Niesnaski to drobne kłótnie, nieporozumienia. W tekście po nich „odtwórca Wacława miał w garści kosmyk płowych włosów” — czyli doszło do bójki.<\/details><br>\n14. Antonimem wyrazu ***skąpy*** jest: *(5 pkt)*\n    - A) hojny\n    - B) chciwy\n    - C) oszczędny\n    - D) zachłanny\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — hojny<br>Skąpy żałuje innym pieniędzy i rzeczy, a hojny chętnie daje. Chciwy i zachłanny znaczą podobnie jak skąpy. Pułapka: oszczędny to nie przeciwieństwo — oszczędny człowiek po prostu nie marnuje pieniędzy.<\/details><br>\n15. W zdaniu ***Rychło wrócił do domu.*** wyraz ***rychło*** oznacza: *(5 pkt)*\n    - A) późno\n    - B) rzadko\n    - C) niechętnie\n    - D) szybko\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — szybko<br>***Rychło*** to dawny wyraz znaczący „szybko, wkrótce”. Znamy go z wyrażenia ***rychło w czas***, czyli „w ostatniej chwili, trochę za późno”. Pułapka: to wyrażenie mówi o spóźnieniu, ale sam wyraz ***rychło*** znaczy „szybko”.<\/details><br>\n16. Wyraz ***zintegrowania*** można zastąpić formą: *(5 pkt)* *(Alfik 2025, zad. 26)*\n    - A) złączenia\n    - B) rozdzielenia\n    - C) podboju\n    - D) panowania\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — złączenia<br>Zintegrować znaczy połączyć w jedną całość. Pułapka: „rozdzielenie” to wyraz o przeciwnym znaczeniu.<\/details><br>\n17. Użyte w tekście wyrazy ***miesiąc*** i ***księżyc***: *(5 pkt)* *(Alfik 2024, zad. 26)*\n    - A) znaczą to samo\n    - B) mają znaczenia przeciwstawne\n    - C) mają tę samą liczbę spółgłosek\n    - D) nie mają tyle samo sylab\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — znaczą to samo<br>„Miesiąc” to dawna, poetycka nazwa księżyca — to synonimy. Oba mają po 2 sylaby (mie-siąc, księ-życ), więc D odpada.<\/details><br>\n18. Podkreślony wyraz w zdaniu ***<u>Ciężkie<\/u> jednak życie miały zwierzęta domowe*** można zastąpić wyrazem: *(5 pkt)* *(Alfik 2023, zad. 24)*\n    - A) wesołe\n    - B) pracowite\n    - C) ważne\n    - D) trudne\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — trudne<br>„Ciężkie życie” to życie pełne kłopotów, czyli trudne. Pułapka: „ciężki” może też znaczyć „dużo ważący”, ale tu chodzi o znaczenie przenośne.<\/details><br>\n19. ***Zgiełk*** i ***wrzawa*** to wyrazy: *(5 pkt)* *(Alfik 2023, zad. 25)*\n    - A) o podobnym znaczeniu\n    - B) należące do różnych części mowy\n    - C) dwusylabowe\n    - D) nieodmienne przez przypadki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — o podobnym znaczeniu<br>Oba znaczą hałas, gwar — to synonimy. Oba są rzeczownikami i odmieniają się (zgiełku, wrzawy). „Zgiełk” ma tylko jedną sylabę.<\/details><br>\n20. W wypowiedzeniu ***<u>stroił<\/u> okropne miny*** podkreślony wyraz można zastąpić wyrazem: *(5 pkt)* *(Alfik 2022, zad. 27)*\n    - A) przybierał\n    - B) ubierał\n    - C) zakładał\n    - D) robił\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — robił<br>„Stroić miny” to związek frazeologiczny znaczący „robić miny”, wykrzywiać twarz. Pułapka B: „stroić” kojarzy się ze strojem, ale tu nie chodzi o ubieranie. Uwaga: „przybierał okropne miny” też brzmi sensownie, ale organizator uznał tylko D.<\/details><br>\n21. Podkreślony wyraz w zdaniu ***ale mi ją szkoda <u>zbrukać<\/u>*** można zastąpić formą: *(5 pkt)* *(Alfik 2021, zad. 30)*\n    - A) zabrudzić\n    - B) wypić\n    - C) posmakować\n    - D) stracić\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — zabrudzić<br>*Zbrukać* to staranniej powiedziane „zabrudzić”, „splamić”. Lis mówi, że chciałby się wykąpać, ale szkoda mu brudzić tak czystą wodę.<\/details><br>\n22. ***Obraz nie był podpisany*** czyli był: *(5 pkt)* *(Alfik 2019, zad. 24)*\n    - A) anonimowy\n    - B) bezwartościowy\n    - C) namalowany na płótnie\n    - D) nieoprawiony\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — anonimowy<br>Malarz podpisuje obraz swoim nazwiskiem. Bez podpisu nie widać, kto go namalował — dzieło jest anonimowe, czyli bez podanego autora. Pułapka D: nieoprawiony znaczy bez ramy, a to co innego.<\/details><br>\n23. Podkreślony wyraz w zdaniu ***To był <u>cudowny<\/u> malarz!*** oznacza: *(5 pkt)* *(Alfik 2019, zad. 25)*\n    - A) dziwny\n    - B) niezrozumiały\n    - C) uduchowiony\n    - D) znakomity\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — znakomity<br>*Cudowny* znaczy tu wspaniały, świetny, znakomity — to pochwała. Pułapka A: „cud” to coś niezwykłego, ale „cudowny malarz” nie znaczy „dziwny”.<\/details><br>\n24. Wyrazy ***literat*** i ***pisarz***: *(5 pkt)* *(Alfik 2019, zad. 29)*\n    - A) odnoszą się do „ludzi pióra”\n    - B) to wyraz potoczny i literacki\n    - C) mają znaczenie przeciwstawne\n    - D) mają różne znaczenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — odnoszą się do „ludzi pióra”<br>*Literat* i *pisarz* to synonimy — oba oznaczają kogoś, kto pisze książki. „Ludzie pióra” to właśnie pisarze. Żaden z tych wyrazów nie jest potoczny.<\/details><br>\n25. ***Mankament*** to: *(5 pkt)* *(Alfik 2017, zad. 21)*\n    - A) zaleta\n    - B) atut\n    - C) wada\n    - D) wyobrażenie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — wada<br>Mankament to wada, usterka, brak. Cześnik tak nazywa swoje choroby. Pułapka: zaleta i atut znaczą coś odwrotnego.<\/details><br>\n26. ***Świdrujące oczy*** to: *(5 pkt)* *(Alfik 2016, zad. 22)*\n    - A) nieszczere spojrzenie\n    - B) oczy kłamcy\n    - C) przenikliwy wzrok\n    - D) tępe spojrzenie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — przenikliwy wzrok<br>Świder wierci dziury — świdrujące oczy „przewiercają” wzrokiem, widzą wszystko. Irenka nimi „umiała wypatrzyć smętek w najbardziej mrocznym kącie”.<\/details><br>\n27. Podkreślone sformułowanie: ***Miały one (kalosze) bowiem tę <u>nieprzyjemną właściwość,<\/u> że znikały*** można zastąpić formą: *(5 pkt)* *(Alfik 2015, zad. 21)*\n    - A) walor\n    - B) wadę\n    - C) charakter\n    - D) sztukę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — wadę<br>Nieprzyjemna właściwość to cecha zła, czyli wada: „Miały one tę wadę, że znikały”. Pułapka A: walor to zaleta, czyli coś przeciwnego.<\/details><br>\n28. Poprawność określenia ***nieprzyjemny szok*** można by zakwestionować, gdyż: *(5 pkt)* *(Alfik 2015, zad. 24)*\n    - A) wyrazy mają odmienne znaczenie\n    - B) źle dopasowano formę gramatyczną\n    - C) „nie” z przymiotnikami piszemy oddzielnie\n    - D) szok sam w sobie jest doznaniem nieprzyjemnym – czyli znaczenie jednego wyrazu zawiera się już w drugim\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — szok sam w sobie jest doznaniem nieprzyjemnym – czyli znaczenie jednego wyrazu zawiera się już w drugim<br>Takie powtórzenie tej samej treści to pleonazm (jak „cofać się do tyłu”). Pułapka C: „nie” z przymiotnikami piszemy łącznie — „nieprzyjemny” jest zapisane dobrze.<\/details><br>\n29. Poprawność sformułowania ***zastygli nieruchomo*** można by zakwestionować, gdyż: *(5 pkt)* *(Alfik 2015, zad. 25)*\n    - A) związek jest nielogiczny\n    - B) jeden wyraz powtarza znaczenie drugiego\n    - C) wyraz *zastygnąć* nie może odnosić się do istot żywych\n    - D) zły jest szyk wyrazów – powinno być nieruchomo zastygli\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jeden wyraz powtarza znaczenie drugiego<br>Zastygnąć znaczy znieruchomieć, więc „nieruchomo” niczego nie dodaje. To pleonazm, jak w pytaniu 24.<\/details><br>\n30. ***Rozrzewnienie*** to inaczej: *(5 pkt)* *(Alfik 2014, zad. 22)*\n    - A) rozbawienie\n    - B) zdenerwowanie\n    - C) dokładność\n    - D) wzruszenie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — wzruszenie<br>Rozrzewnienie to wzruszenie, rozczulenie (wspominać z rozrzewnieniem — ze wzruszeniem, z łezką w oku).<\/details><br>\n31. Podkreślony wyraz w sformułowaniu ***kosmyk <u>płowych<\/u> włosów***: *(5 pkt)* *(Alfik 2014, zad. 23)*\n    - A) odnosi się do koloru włosów\n    - B) określa stan owłosienia\n    - C) nazywa typ fryzury\n    - D) wskazuje na długość włosów\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — odnosi się do koloru włosów<br>„Płowy” to jasnożółty, wyblakły, słomkowy kolor (płowe włosy — jasne jak słoma).<\/details><br>\n\n## B. Związki frazeologiczne i przysłowia\n\nFrazeologizm ma znaczenie przenośne — zastanów się, w jakiej sytuacji ludzie go używają, a nie co dosłownie znaczą jego słowa.\n\n32. Sformułowanie ***bujać w obłokach*** oznacza: *(3 pkt)*\n    - A) marzyć i nie zauważać tego, co dzieje się wokół\n    - B) latać samolotem\n    - C) kłamać\n    - D) huśtać się na huśtawce\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — marzyć i nie zauważać tego, co dzieje się wokół<br>Kto „buja w obłokach”, myślami jest daleko — marzy. Pułapka: samo ***bujać*** potocznie znaczy też „zmyślać, kłamać”, ale cały związek ***bujać w obłokach*** znaczy „marzyć”.<\/details><br>\n33. Kto ***ma muchy w nosie***, ten: *(3 pkt)*\n    - A) jest przeziębiony\n    - B) jest w złym humorze\n    - C) jest bardzo ciekawski\n    - D) boi się owadów\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest w złym humorze<br>***Mieć muchy w nosie*** to być naburmuszonym, obrażonym, w złym humorze.<\/details><br>\n34. Określenie ***rozpaczać jest to zło przydawać do zła*** oznacza: *(3 pkt)* *(Alfik 2021, zad. 10)*\n    - A) czasem dobrze jest nie posłuchać podszeptów rozumu\n    - B) w trudnym położeniu rozpacz jedynie pogarsza sprawę\n    - C) trzeba działać spontanicznie\n    - D) są w życiu sytuacje bez wyjścia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — w trudnym położeniu rozpacz jedynie pogarsza sprawę<br>„Przydawać zła do zła” to dokładać jedno nieszczęście do drugiego. Kto rozpacza, zamiast szukać wyjśc
