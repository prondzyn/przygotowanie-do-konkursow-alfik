zb 3 i 13? *(3 pkt)*\n   - A) 4\n   - B) 5\n   - C) 6\n   - D) 7\n   - E) 8\n   <details><summary>rozwiązanie<\/summary>E — 8<br>Odległość między 3 a 13 to 10, połowa to 5. 3 + 5 = 8 i 13 − 5 = 8. Pułapka: odpowiedź 5 to połowa odległości, a nie punkt.<\/details><br>\n5. Jeśli hektar to pole kwadratu o boku długości 100 metrów, to 1 km² – ile to hektarów? *(3 pkt)*\n   - A) 10\n   - B) 100\n   - C) 1000\n   - D) 10 000\n   - E) 100 000\n   <details><summary>rozwiązanie<\/summary>B — 100<br>1 km = 1000 m, czyli 10 razy więcej niż bok hektara. Kwadrat 1 km × 1 km mieści 10 · 10 = 100 kwadratów 100 m × 100 m.<\/details><br>\n6. Między każdymi dwoma wyspami w archipelagu 4 wysp zbudowano jeden most. Ile mostów zbudowano? *(3 pkt)*\n   - A) 4\n   - B) 5\n   - C) 6\n   - D) 12\n   - E) 16\n   <details><summary>rozwiązanie<\/summary>C — 6<br>Każda wyspa łączy się z 3 innymi: 4 · 3 = 12, ale każdy most policzyliśmy dwa razy (z obu końców). 12 : 2 = 6. Pułapka: odpowiedź 12.<\/details><br>\n7. Jedną krawędź sześcianu pomalowano na niebiesko. Pozostałe trzy krawędzie każdej ściany z niebieską krawędzią pomalowano na czerwono. Wszystkie pozostałe krawędzie sześcianu pomalowano na zielono. Ile zielonych krawędzi ma ten sześcian? *(3 pkt)*\n   - A) 4\n   - B) 5\n   - C) 6\n   - D) 7\n   - E) 8\n   <details><summary>rozwiązanie<\/summary>B — 5<br>Sześcian ma 12 krawędzi. Każda krawędź należy do 2 ścian, więc niebieska krawędź leży na 2 ścianach. Na każdej z nich 3 pozostałe krawędzie są czerwone — razem 6 czerwonych. Zielonych: 12 − 1 − 6 = 5.<\/details><br>\n8. Ile jest takich trzycyfrowych liczb podzielnych przez 9, które można ułożyć z cyfr 2, 3, 4 (wykorzystując każdą cyfrę najwyżej raz)? *(3 pkt)*\n   - A) 2\n   - B) 3\n   - C) 4\n   - D) 6\n   - E) 7\n   <details><summary>rozwiązanie<\/summary>D — 6<br>Liczba trzycyfrowa z różnych cyfr 2, 3, 4 musi zawierać wszystkie trzy. Suma cyfr 2 + 3 + 4 = 9, więc każda taka liczba dzieli się przez 9. Ułożeń jest 3 · 2 · 1 = 6: 234, 243, 324, 342, 423, 432.<\/details><br>\n9. Ile jest takich nieskracalnych ułamków, które są mniejsze od 1 i których licznik i mianownik to jednocyfrowe liczby o sumie 10? *(3 pkt)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) 5\n   <details><summary>rozwiązanie<\/summary>B — 2<br>Ułamek mniejszy od 1 ma licznik mniejszy od mianownika: 1/9, 2/8, 3/7, 4/6. Ułamki 2/8 i 4/6 można skrócić przez 2. Zostają 1/9 i 3/7 — dwa ułamki.<\/details><br>\n10. Jacek zaobserwował, że w trakcie wycieczki klasowej wskazówka minutowa zegara wykonała o 88 obrotów więcej niż wskazówka godzinowa. Ile dni trwała wycieczka? *(3 pkt)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>B — 4<br>W ciągu 12 godzin minutowa robi 12 obrotów, a godzinowa 1 — różnica 11. 88 : 11 = 8, czyli 8 razy po 12 godzin = 96 godzin = 4 doby.<\/details><br>\n\n## Zadania po 4 punkty\n\n11. Z 22 zapałek, żadnej nie łamiąc i wykorzystując je wszystkie, ułożono prostokąt o największym możliwym polu. Z ilu zapałek składał się dłuższy bok tego prostokąta? *(4 pkt)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 7\n    - E) 8\n    <details><summary>rozwiązanie<\/summary>C — 6<br>Obwód to 22 zapałki, więc długość + szerokość = 11. Możliwe pola: 10·1 = 10, 9·2 = 18, 8·3 = 24, 7·4 = 28, 6·5 = 30. Największe pole ma prostokąt 6 × 5, dłuższy bok to 6 zapałek.<\/details><br>\n12. Połączono ze sobą dwa koła zębate – większe ma 24 zęby, a mniejsze ma 16 zębów. Ile obrotów wykonuje mniejsze koło w czasie, gdy większe wykonuje 4 obroty? *(4 pkt)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 8\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>C — 6<br>Przy 4 obrotach większe koło „przesuwa” 4 · 24 = 96 zębów. Tyle samo zębów przesuwa mniejsze, czyli wykonuje 96 : 16 = 6 obrotów.<\/details><br>\n13. Chcemy pokolorować wszystkie wierzchołki pięciokąta, malując każdy wierzchołek jednym z dostępnych kolorów. Ile co najmniej kolorów musimy użyć, żeby każdy bok miał końce różnego koloru? *(4 pkt)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>B — 3<br>Dwoma kolorami musielibyśmy malować na przemian: biały, czarny, biały, czarny, biały — ale piąty wierzchołek sąsiaduje z pierwszym, a oba byłyby białe. Pięć to liczba nieparzysta, więc 2 kolory nie wystarczą. Trzy wystarczą: B, C, B, C, Z.<\/details><br>\n14. Ile jest takich jednocyfrowych liczb, które są równe iloczynowi wszystkich swoich dzielników? *(4 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) więcej niż 4\n    <details><summary>rozwiązanie<\/summary>E — więcej niż 4<br>Liczba pierwsza p ma dzielniki 1 i p, a ich iloczyn to p — pasują 2, 3, 5, 7. Pasuje też 1 (jedyny dzielnik to 1). Liczby 4, 6, 8, 9 nie pasują (np. 1 · 2 · 4 = 8). Razem 5 liczb, czyli więcej niż 4. ⚠ Uwaga: oficjalny klucz uznaje w tym zadaniu dwie odpowiedzi — D i E. Odpowiedź D (4) wychodzi, jeśli nie liczyć liczby 1; liczymy ją, bo 1 jest równe iloczynowi swoich dzielników.<\/details><br>\n15. Za dwa lata Ania będzie miała o trzy lata więcej niż jej brat Jacek miał cztery lata temu. O ile lat starszy od Ani jest Jacek? *(4 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) Ania jest starsza od Jacka\n    <details><summary>rozwiązanie<\/summary>C — 3<br>Wiek Ani za 2 lata to jej wiek + 2. Wiek Jacka 4 lata temu, powiększony o 3, to jego wiek − 1. Te liczby są równe: Ania + 2 = Jacek − 1, więc Jacek jest o 3 lata starszy. Przykład: Ania 10 lat, Jacek 13 — za 2 lata Ania ma 12, a Jacek 4 lata temu miał 9, i 12 = 9 + 3.<\/details><br>\n16. Jaką powierzchnię na mapie o skali 1 : 20 000 zajmuje kwadratowe pole uprawne o powierzchni 4 km²? *(4 pkt)*\n    - A) 10 cm²\n    - B) 20 cm²\n    - C) 100 cm²\n    - D) 200 cm²\n    - E) 1000 cm²\n    <details><summary>rozwiązanie<\/summary>C — 100 cm²<br>Kwadrat o polu 4 km² ma bok 2 km = 200 000 cm. W skali 1 : 20 000 to 200 000 : 20 000 = 10 cm. Na mapie mamy kwadrat 10 cm × 10 cm = 100 cm². Pułapka: nie dzielimy pola przez 20 000 — skala dotyczy długości.<\/details><br>\n17. Numerując wszystkie strony pewnej książki kolejnymi liczbami naturalnymi (zaczynając od numeru 1), zapisano łącznie 300 cyfr. Ile stron ma ta książka? *(4 pkt)*\n    - A) 100\n    - B) 124\n    - C) 130\n    - D) 134\n    - E) 136\n    <details><summary>rozwiązanie<\/summary>E — 136<br>Strony 1–9 to 9 cyfr, strony 10–99 to 90 · 2 = 180 cyfr; razem 189. Zostaje 300 − 189 = 111 cyfr, czyli 111 : 3 = 37 stron trzycyfrowych: od 100 do 136.<\/details><br>\n18. Zegarek Marka się popsuł i teraz wskazówki obracają się w nim z właściwą prędkością, ale „do tyłu”. Jeśli w południe Marek ustawił prawidłową godzinę, to którą godzinę wskaże jego zegarek o 16:30? *(4 pkt)*\n    - A) 6:30\n    - B) 7:00\n    - C) 7:30\n    - D) 8:00\n    - E) 8:30\n    <details><summary>rozwiązanie<\/summary>C — 7:30<br>Od południa do 16:30 minęło 4 godziny 30 minut. Zegarek cofa się od 12:00 o 4 h 30 min: 12:00 → 8:00 → 7:30.<\/details><br>\n19. Liczbę 1000 chcemy przedstawić w postaci iloczynu liczb parzystych. Ile najwięcej czynników może liczyć taki iloczyn? *(4 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) więcej niż 4\n    <details><summary>rozwiązanie<\/summary>C — 3<br>1000 = 2 · 2 · 2 · 5 · 5 · 5. Każdy czynnik parzysty musi zawierać co najmniej jedną dwójkę, a dwójki są tylko 3. Więc czynników jest najwyżej 3, np. 2 · 2 · 250.<\/details><br>\n20. W urnie są 3 kule zielone, 4 kule czerwone i 5 kul niebieskich. Ile co najmniej kul trzeba wyjąć z urny (bez oglądania), aby mieć pewność, że w urnie zostały kule najwyżej dwóch kolorów? *(4 pkt)*\n    - A) 5\n    - B) 6\n    - C) 8\n    - D) 9\n    - E) 10\n    <details><summary>rozwiązanie<\/summary>E — 10<br>Musimy mieć pewność, że jakiś kolor zniknął z urny całkowicie. Najgorszy przypadek: zostawiamy po jednej kuli każdego koloru, wyjmując 2 + 3 + 4 = 9 kul — wtedy w urnie są nadal 3 kolory. Dziesiąta wyjęta kula musi już zabrać ostatnią kulę któregoś koloru.<\/details><br>\n\n## Zadania po 5 punktów\n\n21. Pan Jacek ma kilkoro dzieci, między które podzielił 30 cukierków w taki sposób, że każdy chłopiec dostał tyle cukierków ile miał sióstr, a każda dziewczynka – tyle cukierków ile ma braci. Ile dzieci ma pan Jacek? *(5 pkt)*\n    - A) 5\n    - B) 6\n    - C) 7\n    - D) 8\n    - E) 9\n    <details><summary>rozwiązanie<\/summary>D — 8<br>Każdy chłopiec dostaje tyle, ile jest dziewczynek, więc chłopcy razem dostają (chłopcy · dziewczynki). Dziewczynki razem — tyle samo. Zatem 2 · chłopcy · dziewczynki = 30, czyli chłopcy · dziewczynki = 15. To 3 i 5 (8 dzieci) albo 1 i 15 (16 dzieci — tego nie ma wśród odpowiedzi i to nie „kilkoro”). Odpowiedź: 8.<\/details><br>\n22. W pewnej klasie dziewczynek jest dwa razy więcej niż chłopców, a chłopców jest o 8 mniej niż dziewczynek. Ilu uczniów liczy ta klasa? *(5 pkt)*\n    - A) 12\n    - B) 16\n    - C) 18\n    - D) 24\n    - E) 30\n    <details><summary>rozwiązanie<\/summary>D — 24<br>Dziewczynki to „dwóch chłopców”, więc różnica 8 to dokładnie liczba chłopców. Chłopców jest 8, dziewczynek 16, razem 24.<\/details><br>\n23. Jeśli prostokąt o wymiarach 12 cm × 17 cm rozetniemy na prostokąty o wymiarach 3 cm × 4 cm, to ile części otrzymamy? *(5 pkt)*\n    - A) 14\n    - B) 15\n    - C) 16\n    - D) 17\n    - E) nie da się przeprowadzić takiego rozcięcia\n    <details><summary>rozwiązanie<\/summary>D — 17<br>Pole: 12 · 17 = 204 cm², jedna część 3 · 4 = 12 cm², 204 : 12 = 17. Cięcie jest możliwe: bok 17 cm dzielimy na 8 + 9. Pasek 12 × 8 tniemy na 4 · 2 = 8 prostokątów (3 cm wzdłuż boku 12, 4 cm wzdłuż boku 8), a pasek 12 × 9 na 3 · 3 = 9 prostokątów (4 cm wzdłuż boku 12, 3 cm wzdłuż boku 9). Razem 8 + 9 = 17.<\/details><br>\n24. Dwumetrowy sznurek rozcięto na dwa kawałki. Pierwszy kawałek był o 40 cm dłuższy niż drugi. Jaka była długość drugiego kawałka? *(5 pkt)*\n    - A) 40 cm\n    - B) 50 cm\n    - C) 60 cm\n    - D) 80 cm\n    - E) 1 m\n    <details><summary>rozwiązanie<\/summary>D — 80 cm<br>2 m = 200 cm. Bez nadwyżki: 200 − 40 = 160 cm, połowa to 80 cm — to drugi kawałek. Pierwszy ma 120 cm. Sprawdzenie: 80 + 120 = 200.<\/details><br>\n25. W pudełku jest 20 kamyków. Możemy do tego pudełka dokładać kamyki (za każdym razem dokładając 9 kamyków) lub zabierać kamyki (za każdym razem zabierając 12 kamyków). Ile najmniej kamyków może zostać w pudełku po wykonaniu dowolnej liczby takich ruchów? *(5 pkt)*\n    - A) 0\n    - B) 1\n    - C) 2\n    - D) 3\n    - E) 4\n    <details><summary>rozwiązanie<\/summary>C — 2<br>9 i 12 dzielą się przez 3, więc reszta z dzielenia liczby kamyków przez 3 się nie zmienia: 20 daje resztę 2. Nie da się więc zejść do 0 ani 1. Dwa kamyki osiągniemy: 20 − 12 = 8, 8 + 9 = 17, 17 − 12 = 5, 5 + 9 = 14, 14 − 12 = 2.<\/details><br>\n26. Półtorej cegły waży o 4 kg więcej niż pół cegły. Ile waży cegła? *(5 pkt)*\n    - A) 1 kg\n    - B) 2 kg\n    - C) 3 kg\n    - D) 4 kg\n    - E) 6 kg\n    <details><summary>rozwiązanie<\/summary>D — 4 kg<br>Półtorej cegły to pół cegły i jeszcze cała cegła. Różnica 4 kg to więc dokładnie jedna cegła.<\/details><br>\n27. Długość prostokąta zmniejszono o 2 cm, a jego szerokość zwiększono o 2 cm, otrzymując kwadrat o polu 25 cm². Jakie pole miał wyjściowy prostokąt? *(5 pkt)*\n    - A) 20 cm²\n    - B) 21 cm²\n    - C) 24 cm²\n    - D) 25 cm²\n    - E) 30 cm²\n    <details><summary>rozwiązanie<\/summary>B — 21 cm²<br>Kwadrat ma bok 5 cm. Długość prostokąta była o 2 cm większa: 7 cm, a szerokość o 2 cm mniejsza: 3 cm. Pole: 7 · 3 = 21 cm². Pułapka: pole nie zostaje takie samo (25).<\/details><br>\n28. Bartek i Agata znaleźli skarb – kilkanaście monet, same dwuzłotówki i pięciozłotówki. Podzielili skarb w ten sposób, że Bartek wziął wszystkie dwuzłotówki, a Agata – pięciozłotówki. Okazało się, że każde z dzieci dostało taką samą kwotę pieniędzy. Jaka była wartość skarbu? *(5 pkt)*\n    - A) 20 zł\n    - B) 24 zł\n    - C) 36 zł\n    - D) 40 zł\n    - E) 60 zł\n    <details><summary>rozwiązanie<\/summary>D — 40 zł<br>Kwota każdego dziecka dzieli się przez 2 i przez 5, czyli przez 10. Przy 10 zł: 5 dwuzłotówek + 2 pięciozłotówki = 7 monet (za mało). Przy 20 zł: 10 + 4 = 14 monet — kilkanaście! Przy 30 zł byłoby już 21 monet. Skarb to 2 · 20 = 40 zł.<\/details><br>\n29. W każde swoje urodziny Ania porównuje sumę cyfr bieżącego roku z liczbą lat, które kończy. Wielokrotnie obie te liczby były równe, ale w ubiegłym roku równe nie były. Ile lat ma Ania, jeśli wiemy, że jest jeszcze niepełnoletnia? *(5 pkt)*\n    - A) 7\n    - B) 10\n    - C) 12\n    - D) 15\n    - E) 16\n    <details><summary>rozwiązanie<\/summary>E — 16<br>Konkurs był w 2023 roku. W latach 2010–2019 suma cyfr roku rośnie co roku o 1 (od 3 do 12), tak jak wiek. Jeśli w 2010 Ania kończyła 3 lata (urodzona w 2007), to liczby były równe 10 razy, aż do 2019. W 2020 suma cyfr spada do 4, więc w 2022 już nie były równe. W 2023 Ania kończy 16 lat. Inne odpowiedzi nie pasują, np. przy 7 latach (rok 2016) liczby były równe także w 2022.<\/details><br>\n30. Ile jest takich miesięcy w roku, w których pierwszy i przedostatni dzień wypadają w tym samym dniu tygodnia? *(5 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>D — 4<br>Ten sam dzień tygodnia co 1. mają dni 8., 15., 22., 29. Przedostatni dzień musi więc być 29., czyli miesiąc ma 30 dni. Takie miesiące to kwiecień, czerwiec, wrzesień i listopad — 4. (Luty w roku przestępnym ma przedostatni dzień 28., więc nie pasuje.)<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. E — 9\n2. A — 10\n3. B — 5\n4. E — 8\n5. B — 100\n6. C — 6\n7. B — 5\n8. D — 6\n9. B — 2\n10. B — 4\n11. C — 6\n12. C — 6\n13. B — 3\n14. E — więcej niż 4\n15. C — 3\n16. C — 100 cm²\n17. E — 136\n18. C — 7:30\n19. C — 3\n20. E — 10\n21. D — 8\n22. D — 24\n23. D — 17\n24. D — 80 cm\n25. C — 2\n26. D — 4 kg\n27. B — 21 cm²\n28. D — 40 zł\n29. E — 16\n30. D — 4\n"}, {"path": "testy-przeszle/alfik-2022.md", "id": "alfik-2022", "kind": "przeszly", "short": "Alfik 2022", "md": "# Alfik 2022\n\n<div class=\"test\" data-minuty=\"75\"><\/div>\n\n**Oryginalny arkusz** XXVIII edycji konkursu Alfik Matematyczny, klasa 5 szkoły podstawowej, 23 listopada 2022.\nŹródło: [arkusz PDF](https://jersz.pl/wp-content/uploads/2022/11/Zadania-ALFIK-2022-podstawowa-5.pdf) i [klucz odpowiedzi](https://jersz.pl/wp-content/uploads/2022/11/Klucz-ALFIK-2022-do-neta.pdf) na stronie organizatora, jersz.pl.\n30 zadań, 75 minut, za błędną odpowiedź −¼ punktów zadania. Wyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n## Zadania po 3 punkty\n\n1. Jaka jest długość obwodu kwadratu o polu 25 cm²? *(3 pkt)*\n   - A) 5 cm\n   - B) 10 cm\n   - C) 15 cm\n   - D) 20 cm\n   - E) 25 cm\n   <details><summary>rozwiązanie<\/summary>D — 20 cm<br>5 · 5 = 25, więc bok kwadratu ma 5 cm. Obwód to 4 boki: 4 · 5 = 20 cm. Pułapka: 25 to pole, a nie obwód.<\/details><br>\n2. Ile obrotów wykona wskazówka minutowa zegara w czasie, w którym wskazówka godzinowa wykona dwa i pół obrotu? *(3 pkt)*\n   - A) 12\n   - B) 15\n   - C) 18\n   - D) 24\n   - E) 30\n   <details><summary>rozwiązanie<\/summary>E — 30<br>Jeden obrót wskazówki godzinowej trwa 12 godzin, a w tym czasie minutowa robi 12 obrotów. Dwa i pół obrotu godzinowej to 2,5 · 12 = 30 obrotów minutowej.<\/details><br>\n3. Pierwszy i ostatni dzień pewnego miesiąca wypadły w tym samym dniu tygodnia. Ile dni liczył ten miesiąc? *(3 pkt)*\n   - A) 28\n   - B) 29\n   - C) 30\n   - D) 31\n   - E) opisana sytuacja jest niemożliwa\n   <details><summary>rozwiązanie<\/summary>B — 29<br>Ten sam dzień tygodnia powtarza się co 7 dni: 1., 8., 15., 22., 29. dnia miesiąca. Ostatni dzień musi więc być 29. — to luty w roku przestępnym.<\/details><br>\n4. Ile jest takich trzycyfrowych liczb, które można ułożyć z cyfr 2, 3, 5 (wykorzystując każdą cyfrę jeden raz)? *(3 pkt)*\n   - A) 2\n   - B) 3\n   - C) 4\n   - D) 5\n   - E) 6\n   <details><summary>rozwiązanie<\/summary>E — 6<br>Wypisujemy: 235, 253, 325, 352, 523, 532. Na pierwszym miejscu 3 możliwości, na drugim 2, na trzecim 1: 3 · 2 · 1 = 6.<\/details><br>\n5. W pudełku są kulki zielone i czerwone, przy czym kulek czerwonych jest o dwie więcej niż zielonych. Ile kulek czerwonych trzeba przemalować na zielono, żeby kulek zielonych było o dwie więcej niż czerwonych? *(3 pkt)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) 6\n   <details><summary>rozwiązanie<\/summary>B — 2<br>Przemalowanie jednej kulki zmniejsza liczbę czerwonych o 1 i zwiększa liczbę zielonych o 1, czyli zmienia różnicę o 2. Różnica ma się zmienić z „czerwonych o 2 więcej” na „zielonych o 2 więcej”, czyli o 4. Wystarczą 2 kulki. Przykład: 3 zielone i 5 czerwonych → 5 zielonych i 3 czerwone. Pułapka: odpowiedź 4.<\/details><br>\n6. Liczba palindromiczna to liczba, która czytana wprzód i wspak wygląda tak samo, np. 3223 lub 15251. Ile jest czterocyfrowych liczb palindromicznych o sumie cyfr równej 6? *(3 pkt)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) 5 lub więcej\n   <details><summary>rozwiązanie<\/summary>C — 3<br>Czterocyfrowy palindrom ma postać abba, więc suma cyfr to 2 · (a + b) = 6, czyli a + b = 3. Cyfra a nie może być zerem: 1221, 2112, 3003. Są 3 takie liczby.<\/details><br>\n7. Hektar to pole kwadratu o boku długości 100 metrów, zaś ar to pole kwadratu o boku długości 10 metrów. W takim razie jeden hektar to ile arów? *(3 pkt)*\n   - A) 10\n   - B) 20\n   - C) 100\n   - D) 1000\n   - E) 10 000\n   <details><summary>rozwiązanie<\/summary>C — 100<br>Hektar to 100 · 100 = 10 000 m², ar to 10 · 10 = 100 m². 10 000 : 100 = 100. Pułapka: bok jest 10 razy dłuższy, ale pole jest 10 · 10 = 100 razy większe.<\/details><br>\n8. Dla każdej pary boków kwadratu narysowano odcinek łączący środki tych boków. Rozcinając kwadrat wzdłuż narysowanych odcinków otrzymano pewną liczbę trójkątów. Ile części otrzymano? *(3 pkt)*\n   - A) 4\n   - B) 5\n   - C) 6\n   - D) 8\n   - E) 12\n   <details><summary>rozwiązanie<\/summary>D — 8<br>Kwadrat ma 4 boki, więc par boków jest 6. Cztery odcinki łączą środki sąsiednich boków i tworzą „romb” w środku, odcinając 4 trójkąty w rogach. Dwa odcinki łączą środki przeciwległych boków — tworzą krzyż, który tnie środkowy kwadrat na 4 trójkąty. Razem 4 + 4 = 8.<\/details><br>\n9. Narożne pola szachownicy rozmiaru 9×9 są białe. Jeśli szachownicę tę rozetniemy na kwadratowe szachownice rozmiaru 3×3, to ile z otrzymanych szachownic będzie miało narożne pola białe? *(3 pkt)*\n   - A) 4\n   - B) 5\n   - C) 6\n   - D) 8\n   - E) 9\n   <details><summary>rozwiązanie<\/summary>B — 5<br>Powstaje 9 małych szachownic ułożonych też jak 3×3. Sąsiednie małe szachownice mają narożniki w przeciwnych kolorach (przesunięcie o 3 pola, czyli o liczbę nieparzystą). Więc małe szachownice też ułożą się „w szachownicę”: białe narożniki mają te w rogach i w środku — 5 sztuk.<\/details><br>\n10. Ile jest dwucyfrowych wielokrotności liczby 11? *(3 pkt)*\n    - A) 6\n    - B) 7\n    - C) 8\n    - D) 9\n    - E) 10\n    <details><summary>rozwiązanie<\/summary>D — 9<br>To liczby 11, 22, 33, …, 99 — od 11 · 1 do 11 · 9, czyli 9 liczb. 110 jest już trzycyfrowe.<\/details><br>\n\n## Zadania po 4 punkty\n\n11. Suma pewnych pięciu kolejnych liczb wynosi 40. Jaką liczbą jest najmniejszy z tych pięciu składników? *(4 pkt)*\n    - A) 5\n    - B) 6\n    - C) 7\n    - D) 8\n    - E) 9\n    <details><summary>rozwiązanie<\/summary>B — 6<br>Środkowa z pięciu kolejnych liczb to średnia: 40 : 5 = 8. Liczby to 6, 7, 8, 9, 10, więc najmniejsza to 6. Pułapka: 8 to liczba środkowa, nie najmniejsza.<\/details><br>\n12. Jaka jest największa liczba części, na jaką można rozciąć koło trzema odcinkami? *(4 pkt)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>E — 7<br>Pierwszy odcinek dzieli koło na 2 części. Drugi, przecinając pierwszy, dokłada 2 części (razem 4). Trzeci może przeciąć oba poprzednie w dwóch różnych punktach i wtedy przechodzi przez 3 części, dzieląc każdą — dokłada 3. Razem 4 + 3 = 7.<\/details><br>\n13. W pewnym miesiącu wypadło pięć piątków, ale tylko cztery czwartki. W jakim dniu tygodnia wypadł pierwszy dzień tego miesiąca? *(4 pkt)*\n    - A) we wtorek\n    - B) w środę\n    - C) w czwartek\n    - D) w piątek\n    - E) w sobotę\n    <details><summary>rozwiązanie<\/summary>D — w piątek<br>W 28 dniach każdy dzień tygodnia jest dokładnie 4 razy. Piątych piątków może być tylko w „dodatkowych” dniach (29., 30., 31.). Gdyby przed piątkiem był w nich czwartek, czwartków też byłoby 5. Więc piątek musi być pierwszym z dodatkowych dni, czyli 29. jest piątkiem — a wtedy 1. dzień miesiąca też jest piątkiem.<\/details><br>\n14. Z prostokąta o długości 19 cm i szerokości 12 cm odcięto największy możliwy kwadrat, otrzymując mniejszy prostokąt. Z otrzymanego prostokąta znów odcięto największy możliwy kwadrat, otrzymując jeszcze mniejszy prostokąt. Procedurę tę kontynuowano tak długo, aż otrzymano prostokąt będący kwadratem. Jaka była długość boku tego kwadratu? *(4 pkt)*\n    - A) 1 cm\n    - B) 2 cm\n    - C) 3 cm\n    - D) 4 cm\n    - E) 5 cm\n    <details><summary>rozwiązanie<\/summary>A — 1 cm<br>Śledzimy wymiary: 19×12 → 12×7 → 7×5 → 5×2 → 3×2 → 2×1 → 1×1. Na końcu zostaje kwadrat o boku 1 cm.<\/details><br>\n15. Kilkuletni brat Jacka w przyszłym roku kończy tyle lat, ile wynosi suma cyfr roku jego urodzenia. Ile lat ma brat Jacka? *(4 pkt)*\n    - A) 5\n    - B) 6\n    - C) 7\n    - D) 8\n    - E) 9\n    <details><summary>rozwiązanie<\/summary>C — 7<br>Konkurs był w 2022 roku, więc „przyszły rok” to 2023. Sprawdzamy lata urodzenia: dla 2015 suma cyfr to 2 + 0 + 1 + 5 = 8, a w 2023 roku brat skończy 2023 − 2015 = 8 lat. Zgadza się! Teraz (w 2022, po urodzinach) ma 7 lat. Inne lata nie pasują, np. 2014 → suma 7, a skończy 9.<\/details><br>\n16. Jeśli liczbę, o której pomyślałem, pomnożę przez sumę jej cyfr, to otrzymam iloczyn 52. Jaka jest suma cyfr liczby, o której pomyślałem? *(4 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>D — 4<br>Liczba musi być dzielnikiem 52: 1, 2, 4, 13, 26, 52. Sprawdzamy: 13 ma sumę cyfr 4, a 13 · 4 = 52. Pozostałe nie pasują (np. 26 · 8 = 208, 4 · 4 = 16).<\/details><br>\n17. Długość obwodu dużego kwadratu jest dwa razy większa niż długość obwodu małego kwadratu. Ile razy większe jest pole dużego kwadratu od pola małego kwadratu? *(4 pkt)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 6\n    - E) 8\n    <details><summary>rozwiązanie<\/summary>C — 4<br>Skoro obwód jest 2 razy większy, to bok też jest 2 razy dłuższy. Np. boki 1 cm i 2 cm: pola 1 cm² i 4 cm². Duży kwadrat mieści 4 małe. Pułapka: odpowiedź 2.<\/details><br>\n18. Pewna klasa liczy dwudziestu kilku uczniów. Gdyby tych uczniów podzielić na grupy 9-osobowe, to dla dwóch uczniów zostałoby bez przydziału. Gdyby natomiast uczniów podzielić na grupy 7-osobowe, to jeden uczeń zostałby bez przydziału. Ilu uczniów zostanie bez przydziału, jeśli podzielimy uczniów na grupy 5-osobowe? *(4 pkt)*\n    - A) 0\n    - B) 1\n    - C) 2\n    - D) 3\n    - E) 4\n    <details><summary>rozwiązanie<\/summary>E — 4<br>Między 20 a 29 reszta 2 z dzielenia przez 9 jest dla 20 i 29. Reszta 1 z dzielenia przez 7: 22 i 29. Wspólna liczba to 29. Grupy 5-osobowe: 29 = 5 · 5 + 4, zostaje 4 uczniów.<\/details><br>\n19. Jeśli prostokąt o wymiarach 6 cm × 8 cm rozetniemy na prostokąty o wymiarach 2 cm × 3 cm, to ile części otrzymamy? *(4 pkt)*\n    - A) 8\n    - B) 9\n    - C) 10\n    - D) 11\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>A — 8<br>Pole dużego prostokąta: 6 · 8 = 48 cm², małego: 2 · 3 = 6 cm². 48 : 6 = 8 części. Takie cięcie jest możliwe: prostokąt 6 cm × 8 cm to dwa paski 3 cm × 8 cm, a każdy pasek tniemy na 4 kawałki 3 cm × 2 cm.<\/details><br>\n20. W pudełku są 2 kulki niebieskie, 3 kulki czerwone i 5 kulek zielonych. Ile co najmniej kulek trzeba wyjąć (bez oglądania) z pudełka, żeby mieć pewność, że nie wszystkie wyjęte kulki są tego samego koloru? *(4 pkt)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>D — 6<br>Najgorszy przypadek: wyciągamy same zielone — może ich być aż 5. Szósta kulka na pewno nie jest zielona, więc wtedy mamy pewność dwóch kolorów.<\/details><br>\n\n## Zadania po 5 punktów\n\n21. W działaniu: 2 + 3 + 4 + 5 + 6 + 7 + 8 + 9 = 10 należy niektóre ze znaków „+” zastąpić znakami „–” tak, aby otrzymać prawdziwą równość. Ile najmniej znaków trzeba zamienić? *(5 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>B — 2<br>Suma wszystkich liczb to 44. Zmiana „+” na „–” przed liczbą zmniejsza wynik o dwa razy tę liczbę. Trzeba zmniejszyć o 44 − 10 = 34, czyli liczby ze znakiem „–” mają dać razem 17. Jedna liczba to za mało (największa to 9), ale dwie wystarczą: 8 + 9 = 17. Sprawdzenie: 2 + 3 + 4 + 5 + 6 + 7 − 8 − 9 = 10.<\/details><br>\n22. Pewna dwucyfrowa liczba zwiększa się 7-krotnie, jeśli między obie jej cyfry wstawimy zero (otrzymując liczbę trzycyfrową). Jaka jest suma cyfr tej liczby? *(5 pkt)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>D — 6<br>Szukana liczba to 15: po wstawieniu zera mamy 105 = 7 · 15. Suma cyfr: 1 + 5 = 6. (Sprawdzenie wszystkich liczb dwucyfrowych pokazuje, że to jedyna taka liczba.)<\/details><br>\n23. Beata jest dwa razy starsza od Agaty, a Agata jest o 5 lat młodsza od Beaty. Ile lat mają łącznie obie dziewczynki? *(5 pkt)*\n    - A) 5\n    - B) 8\n    - C) 10\n    - D) 12\n    - E) 15\n    <details><summary>rozwiązanie<\/summary>E — 15<br>Beata ma tyle, co „dwie Agaty”, więc różnica wieku to jedna Agata. Różnica wynosi 5 lat, więc Agata ma 5 lat, a Beata 10. Razem 15.<\/details><br>\n24. Akwarium pełne wody waży 50 kg, a akwarium napełnione wodą do połowy waży 26 kg. Ile waży puste akwarium? *(5 pkt)*\n    - A) 1 kg\n    - B) 2 kg\n    - C) 3 kg\n    - D) 4 kg\n    - E) 5 kg\n    <details><summary>rozwiązanie<\/summary>B — 2 kg<br>Różnica 50 − 26 = 24 kg to waga połowy wody. Cała woda waży 48 kg, więc puste akwarium waży 50 − 48 = 2 kg.<\/details><br>\n25. Kwadratowa szachownica składa się z 36 pól. Ruch polega na wybraniu jednego rzędu albo jednej kolumny i przemalowaniu wszystkich pól w wybranym rzędzie (albo w wybranej kolumnie): pola białe przemalowujemy na czarno, a czarne – na biało. Ile najmniej ruchów potrzeba wykonać, aby wszystkie 36 pól było koloru czarnego? *(5 pkt)*\n    - A) 6\n    - B) 7\n    - C) 8\n    - D) 9\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>A — 6<br>Szachownica ma 6×6 pól. Przemalowujemy co drugi rząd (3 ruchy) — wtedy każda kolumna staje się jednokolorowa, na przemian biała i czarna. Teraz przemalowujemy 3 białe kolumny — razem 6 ruchów. Mniej się nie da: dwa sąsiednie pola w rzędzie mają różne kolory, więc z każdej pary kolumn 1–2, 3–4, 5–6 dokładnie jedną trzeba przemalować — to co najmniej 3 ruchy kolumnami. Tak samo co najmniej 3 ruchy rzędami. Razem co najmniej 6.<\/details><br>\n26. Dwumetrowy sznurek rozcięto na takie dwa kawałki, że pierwszy z nich był o 40 cm dłuższy niż drugi. Pierwszy kawałek sznurka był dłuższy od drugiego kawałka: *(5 pkt)*\n    - A) półtora raza\n    - B) dwa razy\n    - C) dwa i pół raza\n    - D) trzy razy\n    - E) cztery razy\n    <details><summary>rozwiązanie<\/summary>A — półtora raza<br>2 m = 200 cm. Odejmujemy nadwyżkę: 200 − 40 = 160 cm, dzielimy na pół: drugi kawałek ma 80 cm, pierwszy 120 cm. 120 : 80 = 1,5, czyli półtora raza.<\/details><br>\n27. Ile najwięcej piątków może wypaść w ciągu roku? *(5 pkt)*\n    - A) 51\n    - B) 52\n    - C) 53\n    - D) 54\n    - E) 55\n    <details><summary>rozwiązanie<\/summary>C — 53<br>Rok ma 365 dni = 52 tygodnie i 1 dzień (przestępny: 52 tygodnie i 2 dni). Każdy dzień tygodnia występuje 52 razy, a 1 lub 2 dni tygodnia — 53 razy. Jeśli rok zaczyna się w piątek, piątków jest 53.<\/details><br>\n28. Pewien człowiek urodził się w roku, którego numer był kwadratem liczby naturalnej i zmarł w dniu swoich urodzin, w XX wieku, w roku, którego numer również był kwadratem liczby naturalnej. Ile lat przeżył ten człowiek? *(5 pkt)*\n    - A) 43\n    - B) 44\n    - C) 86\n    - D) 87\n    - E) 88\n    <details><summary>rozwiązanie<\/summary>D — 87<br>XX wiek to lata 1901–2000. Jedyny kwadrat w tym przedziale to 44 · 44 = 1936. Poprzedni kwadrat to 43 · 43 = 1849 (jeszcze wcześniejszy, 1764, dałby 172 lata życia). Człowiek przeżył 1936 − 1849 = 87 lat.<\/details><br>\n29. W pewnej dwudziestokilkuosobowej klasie dziewczynek jest o połowę więcej niż chłopców. Ilu uczniów liczy ta klasa? *(5 pkt)*\n    - A) 22\n    - B) 23\n    - C) 24\n    - D) 25\n    - E) 27\n    <details><summary>rozwiązanie<\/summary>D — 25<br>„O połowę więcej” oznacza: na każdych 2 chłopców przypadają 3 dziewczynki. Uczniowie dzielą się więc na grupki po 5, a liczba uczniów jest wielokrotnością 5. Między 21 a 29 jest tylko 25 (10 chłopców i 15 dziewczynek).<\/details><br>\n30. Ile jest takich liczb trzycyfrowych, których suma cyfr jest równa iloczynowi cyfr? *(5 pkt)*\n    - A) 0\n    - B) 1\n    - C) 2\n    - D) 3\n    - E) 4 lub więcej\n    <details><summary>rozwiązanie<\/summary>E — 4 lub więcej<br>Cyfry 1, 2, 3: 1 + 2 + 3 = 6 i 1 · 2 · 3 = 6. Z tych cyfr można ułożyć 6 liczb: 123, 132, 213, 231, 312, 321. To już więcej niż 4 (a innych takich liczb trzycyfrowych nie ma).<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. D — 20 cm\n2. E — 30\n3. B — 29\n4. E — 6\n5. B — 2\n6. C — 3\n7. C — 100\n8. D — 8\n9. B — 5\n10. D — 9\n11. B — 6\n12. E — 7\n13. D — w piątek\n14. A — 1 cm\n15. C — 7\n16. D — 4\n17. C — 4\n18. E — 4\n19. A — 8\n20. D — 6\n21. B — 2\n22. D — 6\n23. E — 15\n24. B — 2 kg\n25. A — 6\n26. A — półtora raza\n27. C — 53\n28. D — 87\n29. D — 25\n30. E — 4 lub więcej\n"}, {"path": "testy-przeszle/alfik-2021.md", "id": "alfik-2021", "kind": "przeszly", "short": "Alfik 2021", "md": "# Alfik 2021\n\n<div class=\"test\" data-minuty=\"75\"><\/div>\n\n**Oryginalny arkusz** XXVII edycji konkursu Alfik Matematyczny, klasa 5 szkoły podstawowej, 24 listopada 2021.\nŹródło: [arkusz PDF](https://jersz.pl/wp-content/uploads/2020/08/ALFIK-MATEMATYCZNY-2021-5-SP.pdf) na stronie organizatora, jersz.pl. Organizator nie opublikował klucza dla klasy 5 — odpowiedzi ustaliliśmy sami i sprawdziliśmy programem.\n30 zadań, 75 minut, za błędną odpowiedź −¼ punktów zadania. Wyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n## Zadania po 3 punkty\n\n1. Pierwszy dzień dziesięciodniowego urlopu pani Marioli wypadł we wtorek. W jakim dniu tygodnia wypadł ostatni dzień jej urlopu? *(3 pkt)*\n   - A) wtorek\n   - B) środa\n   - C) czwartek\n   - D) piątek\n   - E) sobota\n   <details><summary>rozwiązanie<\/summary>C — czwartek<br>Ostatni dzień urlopu to dzień 10., czyli 9 dni po pierwszym. 7 dni później znów jest wtorek (dzień 8.), a 2 dni dalej — czwartek (dzień 10.). Pułapka: liczenie 10 dni po wtorku zamiast 9 daje piątek.<\/details><br>\n2. Jeśli wodę z dwunastu pełnych dwulitrowych butelek przelejemy do butelek półtoralitrowych, to ile butelek napełnimy? *(3 pkt)*\n   - A) 13\n   - B) 14\n   - C) 15\n   - D) 16\n   - E) 18\n   <details><summary>rozwiązanie<\/summary>D — 16<br>Wody jest 12 · 2 = 24 litry. Dwie butelki półtoralitrowe mieszczą 3 litry, więc 24 litry to 8 takich par, czyli 16 butelek.<\/details><br>\n3. Ile jest parzystych liczb dwucyfrowych o iloczynie cyfr równym 12? *(3 pkt)*\n   - A) 2\n   - B) 3\n   - C) 4\n   - D) 5\n   - E) więcej niż 5\n   <details><summary>rozwiązanie<\/summary>B — 3<br>12 jako iloczyn dwóch cyfr: 2 · 6 lub 3 · 4. Liczby: 26, 62, 34, 43. Parzyste są 26, 62 i 34 — razem 3 (43 jest nieparzysta).<\/details><br>\n4. Suma trzech kolejnych liczb (naturalnych) wynosi 24. Największą z tych trzech liczb jest: *(3 pkt)*\n   - A) 6\n   - B) 7\n   - C) 8\n   - D) 9\n   - E) 10\n   <details><summary>rozwiązanie<\/summary>D — 9<br>Środkowa z trzech kolejnych liczb to średnia: 24 : 3 = 8. Liczby to 7, 8, 9, więc największa to 9. Pułapka: 8 to środkowa, a nie największa.<\/details><br>\n5. Joasia kończy dziś tyle lat ile wynosi suma cyfr roku jej urodzenia. Ile lat ma Joasia, jeśli jest jeszcze niepełnoletnia? *(3 pkt)*\n   - A) 6\n   - B) 7\n   - C) 8\n   - D) 9\n   - E) 10 lub więcej\n   <details><summary>rozwiązanie<\/summary>B — 7<br>Konkurs był w 2021 roku. Joasia urodzona w 2014 ma 2021 − 2014 = 7 lat, a suma cyfr 2 + 0 + 1 + 4 = 7 — pasuje. Inne lata nie pasują, np. 2013 → 8 lat, suma 6; 2015 → 6 lat, suma 8; a dla lat 2004–2009 suma cyfr (6–11) jest mniejsza niż wiek (12–17).<\/details><br>\n6. Sto godzin po północy będzie godzina: *(3 pkt)*\n   - A) 0:00\n   - B) 2:00\n   - C) 4:00\n   - D) 6:00\n   - E) 8:00\n   <details><summary>rozwiązanie<\/summary>C — 4:00<br>100 godzin = 4 doby (96 godzin) + 4 godziny. Po 4 pełnych dobach znów jest północ, a 4 godziny później — 4:00.<\/details><br>\n7. Ile jest trzycyfrowych liczb podzielnych przez 4, które można ułożyć z cyfr 2, 3, 4 (każdą cyfrę wykorzystując tylko raz)? *(3 pkt)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) więcej niż 4\n   <details><summary>rozwiązanie<\/summary>B — 2<br>Liczba dzieli się przez 4, gdy jej dwie ostatnie cyfry tworzą liczbę podzielną przez 4. Możliwe końcówki: 23, 32, 24, 42, 34, 43 — przez 4 dzielą się tylko 32 i 24. Liczby: 432 i 324, czyli 2.<\/details><br>\n8. Gdyby Bartek miał o trzy lata mniej niż ma teraz, a Jacek miał o trzy lata więcej niż ma teraz, to Bartek byłby o dwa lata młodszy od Jacka. O ile lat starszy jest Bartek od Jacka? *(3 pkt)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) 5\n   <details><summary>rozwiązanie<\/summary>D — 4<br>Zabranie Bartkowi 3 lat i dodanie Jackowi 3 lat zmienia różnicę ich wieku o 6 lat na korzyść Jacka. Po tej zmianie Jacek jest starszy o 2 lata, więc przed nią Bartek był starszy o 6 − 2 = 4 lata. Np. Bartek 14, Jacek 10: 11 i 13.<\/details><br>\n9. Klasa Jacka liczy kilkunastu uczniów. Wczoraj, gdy dwóch uczniów było nieobecnych, nauczycielka podzieliła wszystkie obecne dzieci na 6-osobowe grupy. Ilu uczniów liczy klasa Jacka? *(3 pkt)*\n   - A) 14\n   - B) 15\n   - C) 16\n   - D) 17\n   - E) 18\n   <details><summary>rozwiązanie<\/summary>A — 14<br>Klasa ma od 11 do 19 uczniów, więc obecnych było od 9 do 17. Wśród tych liczb jedyna wielokrotność 6 to 12. Zatem w klasie jest 12 + 2 = 14 uczniów.<\/details><br>\n10. Liczba palindromiczna, to liczba, która czytana od lewej do prawej jest taka sama jak czytana od prawej do lewej, np. 343. Ile jest trzycyfrowych liczb palindromicznych o sumie cyfr równej 7? *(3 pkt)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>B — 3<br>Palindrom trzycyfrowy ma postać „a b a”, więc suma cyfr to a + a + b = 7. a = 1 → b = 5 (151), a = 2 → b = 3 (232), a = 3 → b = 1 (313); dla a = 4 już za dużo. Razem 3.<\/details><br>\n\n## Zadania po 4 punkty\n\n11. Pewną liczbę jednocyfrową pomnożyłem przez 4, a od wyniku mnożenia odjąłem 6. W ten sposób otrzymałem liczbę dwucyfrową o sumie cyfr 5. Jaką liczbę otrzymałem? *(4 pkt)*\n    - A) 14\n    - B) 23\n    - C) 32\n    - D) 41\n    - E) 50\n    <details><summary>rozwiązanie<\/summary>A — 14<br>Wynik + 6 musi być wielokrotnością 4 (najwyżej 4 · 9 = 36). Sprawdzamy opcje: 14 + 6 = 20 = 4 · 5 — pasuje. 23 + 6 = 29, 32 + 6 = 38, 41 + 6 = 47 nie dzielą się przez 4, a 50 + 6 = 56 = 4 · 14, ale 14 nie jest jednocyfrowa.<\/details><br>\n12. Jeśli minutę temu zegarek Agaty, który spieszy o minutę, wskazywał godzinę 12:17, to za minutę zegarek Bartka, który spóźnia się o minutę, wskaże godzinę: *(4 pkt)*\n    - A) 12:15\n    - B) 12:16\n    - C) 12:17\n    - D) 12:18\n    - E) 12:19\n    <details><summary>rozwiązanie<\/summary>C — 12:17<br>Minutę temu naprawdę była 12:16 (zegarek Agaty spieszy o minutę). Teraz jest 12:17, a za minutę będzie 12:18. Zegarek Bartka spóźnia się o minutę, więc pokaże 12:17.<\/details><br>\n13. Dwa lata temu pani Marzena miała o 3 lata więcej, niż łącznie wszystkie jej dzieci. Za rok jej dzieci łącznie będą miały o 3 lata więcej niż mama. Ile dzieci ma pani Marzena? *(4 pkt)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>B — 3<br>Od „dwa lata temu” do „za rok” mijają 3 lata. Mamie przybywają 3 lata. Na początku mama miała o 3 lata więcej niż dzieci razem, na końcu o 3 lata mniej — więc dzieciom razem przybyło o 6 lat więcej niż mamie, czyli 3 + 6 = 9 lat. Każdemu dziecku przybyły 3 lata, więc dzieci jest 9 : 3 = 3.<\/details><br>\n14. Ile jest takich trzycyfrowych liczb podzielnych przez 9, których cyfrą dziesiątek jest 9? *(4 pkt)*\n    - A) 8\n    - B) 9\n    - C) 10\n    - D) 90\n    - E) więcej niż 90\n    <details><summary>rozwiązanie<\/summary>C — 10<br>Suma cyfr musi dzielić się przez 9, więc cyfra setek + cyfra jedności = 9 lub 18. Suma 9: 198, 297, 396, 495, 594, 693, 792, 891, 990 (9 liczb). Suma 18: tylko 999. Razem 10. Pułapka: łatwo zapomnieć o 999 lub o 990.<\/details><br>\n15. Do północy zostało jeszcze dwa razy tyle czasu, ile upłynęło od południa. Która jest godzina? *(4 pkt)*\n    - A) 13:00\n    - B) 14:00\n    - C) 15:00\n    - D) 16:00\n    - E) 17:00\n    <details><summary>rozwiązanie<\/summary>D — 16:00<br>Od południa do północy jest 12 godzin, podzielonych na 1 część (minęło) i 2 części (zostało) — razem 3 części. Jedna część to 12 : 3 = 4 godziny, więc jest 12:00 + 4 h = 16:00. Sprawdzenie: do północy zostało 8 h = 2 · 4 h.<\/details><br>\n16. Iloczyn pięciu liczb (naturalnych) wynosi 360. Ile najwięcej spośród tych pięciu liczb może być parzystych? *(4 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>C — 3<br>360 = 2 · 2 · 2 · 45, a 45 jest nieparzyste — w iloczynie są tylko trzy dwójki. Każda liczba parzysta „zużywa” co najmniej jedną dwójkę, więc parzystych może być najwyżej 3. Przykład: 2 · 2 · 2 · 9 · 5 = 360.<\/details><br>\n17. Na biało-czarnej szachownicy o rozmiarach 4×4 niektóre z czarnych pól chcemy przemalować na czerwono tak, by każde białe pole szachownicy sąsiadowało z przynajmniej jednym polem czerwonym. Ile co najmniej pól musimy przemalować? *(4 pkt)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>B — 3<br>Białych pól jest 8, a czarne pole sąsiaduje (bokiem) najwyżej z 4 białymi. Biały narożnik sąsiaduje tylko z czarnymi polami brzegowymi, a te mają najwyżej 3 białych sąsiadów — więc 2 czerwone pola obejmą najwyżej 3 + 4 = 7 białych, za mało. 3 wystarczą: np. gdy lewy górny róg jest biały, czerwone pola to (rząd 1, kolumna 2), (rząd 3, kolumna 2) i (rząd 3, kolumna 4) — sprawdziliśmy też programem.<\/details><br>\n18. W sakiewce jest kilkanaście monet, z których każda ma nominał 1 zł, 2 zł lub 5 zł. Wiemy, że łączna wartość monet każdego nominału jest taka sama. Jaka jest łączna wartość monet w tej sakiewce? *(4 pkt)*\n    - A) 24 zł\n    - B) 27 zł\n    - C) 30 zł\n    - D) 33 zł\n    - E) 36 zł lub więcej\n    <details><summary>rozwiązanie<\/summary>C — 30 zł<br>Wartość monet jednego nominału musi dać się złożyć i z dwuzłotówek, i z pięciozłotówek, więc jest wielokrotnością 10 zł. Przy 10 zł: 10 złotówek + 5 dwuzłotówek + 2 pięciozłotówki = 17 monet (kilkanaście) i razem 30 zł. Przy 20 zł byłoby już 34 monety — za dużo.<\/details><br>\n19. Joasia ma kilkanaście monet, każda o nominale 1 zł, 2 zł lub 5 zł. Wiemy, że Joasia ma tyle samo dwuzłotówek, co pięciozłotówek oraz że jej pięciozłotówki są łącznie warte tyle co jej złotówki. Ile pieniędzy ma Joasia? *(4 pkt)*\n    - A) 20 zł\n    - B) 24 zł\n    - C) 25 zł\n    - D) 30 zł\n    - E) więcej niż 30 zł\n    <details><summary>rozwiązanie<\/summary>B — 24 zł<br>Na każdą pięciozłotówkę przypada jedna dwuzłotówka i 5 złotówek — to paczka 7 monet warta 5 + 2 + 5 = 12 zł. Kilkanaście monet to dokładnie 2 takie paczki (14 monet; 1 paczka to 7, 3 paczki to 21). Razem 2 · 12 = 24 zł.<\/details><br>\n20. Na każdej ścianie kostki do gry jest od 1 do 6 oczek (na każdej ścianie inna liczba). Na czterech ścianach sąsiadujących ze ścianą z 3 oczkami łącznie jest 14 oczek. Ile oczek jest na ścianie leżącej naprzeciw ściany z 3 oczkami? *(4 pkt)*\n    - A) 1\n    - B) 2\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>C — 4<br>Na całej kostce jest 1 + 2 + 3 + 4 + 5 + 6 = 21 oczek. Ściana z 3 oczkami, jej 4 sąsiadki i ściana naprzeciwko to wszystkie 6 ścian. Naprzeciwko jest więc 21 − 3 − 14 = 4 oczka. (Zgadza się to z prawdziwą kostką, gdzie przeciwległe ściany dają razem 7.)<\/details><br>\n\n## Zadania po 5 punktów\n\n21. Jeśli pierwszy dzień roku (nieprzestępnego) wypadnie w piątek, to w jakim dniu tygodnia wypadnie ostatni dzień tego roku? *(5 pkt)*\n    - A) w czwartek\n    - B) w piątek\n    - C) w sobotę\n    - D) w niedzielę\n    - E) w poniedziałek\n    <details><summary>rozwiązanie<\/summary>B — w piątek<br>Rok nieprzestępny ma 365 dni, a ostatni dzień jest 364 dni po pierwszym. 364 = 52 · 7, czyli dokładnie 52 tygodnie — ostatni dzień wypada w tym samym dniu tygodnia co pierwszy, w piątek. Pułapka: 365 dni po 1 stycznia to już 1 stycznia następnego roku (sobota).<\/details><br>\n22. Przez ile pól szachownicy o rozmiarze 3×4 będzie przechodził odcinek łączący prawy dolny róg szachownicy z lewym górnym rogiem szachownicy? *(5 pkt)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>D — 6<br>Idąc wzdłuż odcinka, wchodzimy do nowego pola za każdym razem, gdy przecinamy linię siatki. W poziomie przecinamy 3 linie pionowe, w pionie 2 linie poziome, i nigdy obie naraz (3 i 4 nie mają wspólnego dzielnika większego niż 1, więc odcinek nie trafia w żaden wewnętrzny wierzchołek). Pól jest 1 + 3 + 2 = 6.<\/details><br>\n23. Chcemy przygotować kostkę do gry, naklejając „oczka” na 6 ścian pustej kostki. Łącznie chcemy nakleić 22 oczka tak, żeby na każdej ścianie była inna liczba oczek i na każdej ścianie było przynajmniej jedno oczko. Ściana z największą liczbą oczek będzie zawierała: *(5 pkt)*\n    - A) 4 oczka\n    - B) 5 oczek\n    - C) 6 oczek\n    - D) 7 oczek\n    - E) 8 oczek\n    <details><summary>rozwiązanie<\/summary>D — 7 oczek<br>Sześć różnych liczb od 1 w górę daje co najmniej 1 + 2 + 3 + 4 + 5 + 6 = 21. Mamy 22, czyli jedno oczko „za dużo”. Dodać je można tylko do największej liczby (inaczej powtórzyłyby się dwie liczby): 1, 2, 3, 4, 5, 7. Największa ściana ma 7 oczek.<\/details><br>\n24. Ile co najmniej znaków „+” w działaniu: 7 + 6 + 5 + 4 + 3 + 2 + 1 = 12 trzeba zastąpić znakami „–”, aby otrzymać prawdziwe działanie? *(5 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>B — 2<br>Teraz lewa strona to 28, a ma być 12 — trzeba zmniejszyć o 16. Zamiana „+ a” na „− a” zmniejsza wynik o 2 · a, więc zamienione liczby muszą dawać razem 8. Jedna liczba z 1–6 nie wystarczy, ale dwie tak: 6 + 2 lub 5 + 3. Np. 7 − 6 + 5 + 4 + 3 − 2 + 1 = 12.<\/details><br>\n25. Jacek, Bartek i Aneta mają łącznie 42 lata. Jacek jest dwa razy starszy od Anety i dwa razy młodszy od Bartka. O ile starszy jest Bartek od Jacka? *(5 pkt)*\n    - A) mniej niż 10 lat\n    - B) 10 lat\n    - C) 11 lat\n    - D) 12 lat\n    - E) więcej niż 12 lat\n    <details><summary>rozwiązanie<\/summary>D — 12 lat<br>Aneta to 1 część, Jacek 2 części, Bartek 4 części — razem 7 części = 42 lata, więc część to 6 lat. Jacek ma 12, Bartek 24 lata. Bartek jest starszy o 12 lat.<\/details><br>\n26. Ile jest takich liczb dwucyfrowych, które zmniejszają się dokładnie 6 razy po usunięciu cyfry dziesiątek? *(5 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) nie ma takich liczb\n    <details><summary>rozwiązanie<\/summary>D — 4<br>Po usunięciu cyfry dziesiątek zostaje cyfra jedności, a liczba ma być 6 razy większa od niej. Liczba = 10 · dziesiątki + jedności = 6 · jedności, więc 10 · dziesiątki = 5 · jedności, czyli jedności = 2 · dziesiątki. Pasują 12, 24, 36, 48 (12 = 6 · 2, 24 = 6 · 4, 36 = 6 · 6, 48 = 6 · 8). Razem 4.<\/details><br>\n27. Puste akwarium waży 4 kg, a akwarium napełnione wodą do połowy waży 28 kg. Ile waży akwarium napełnione wodą po brzegi? *(5 pkt)*\n    - A) 48 kg\n    - B) 50 kg\n    - C) 52 kg\n    - D) 54 kg\n    - E) 56 kg\n    <details><summary>rozwiązanie<\/summary>C — 52 kg<br>Połowa wody waży 28 − 4 = 24 kg, więc cała woda 48 kg. Pełne akwarium: 4 + 48 = 52 kg. Pułapka: 2 · 28 = 56 kg liczy szkło akwarium dwa razy.<\/details><br>\n28. Dwumetrowy sznurek rozcięto na dwa kawałki, z których jeden był trzy razy dłuższy niż drugi. Jaka była długość krótszego kawałka? *(5 pkt)*\n    - A) 40 cm\n    - B) 60 cm\n    - C) 70 cm\n    - D) 75 cm\n    - E) inna odpowiedź\n    <details><summary>rozwiązanie<\/summary>E — inna odpowiedź<br>Krótszy kawałek to 1 część, dłuższy 3 części — razem 4 części = 200 cm. Krótszy ma 200 : 4 = 50 cm, a takiej liczby nie ma wśród odpowiedzi A–D. Pułapka: 200 : 3 ≈ 67 cm to nie to samo.<\/details><br>\n29. Łącząc środki boków kwadratu otrzymano mniejszy kwadrat. Jaki jest stosunek pól obu kwadratów? *(5 pkt)*\n    - A) 2 : 1\n    - B) 3 : 1\n    - C) 3 : 2\n    - D) 4 : 1\n    - E) 4 : 3\n    <details><summary>rozwiązanie<\/summary>A — 2 : 1<br>Narysuj obie przekątne małego kwadratu (łączą środki przeciwległych boków). Dzielą duży kwadrat na 4 mniejsze kwadraty, a każdy z nich bok małego kwadratu przecina na pół — połowa jest w małym kwadracie, połowa poza nim. Mały kwadrat ma więc połowę pola dużego: stosunek 2 : 1.<\/details><br>\n30. Kwadrat o obwodzie 20 cm rozcięto na dwa prostokąty. Ile wynosi łączny obwód obu tych prostokątów? *(5 pkt)*\n    - A) 20 cm\n    - B) 25 cm\n    - C) 30 cm\n    - D) 35 cm\n    - E) zależy od sposobu podziału\n    <details><summary>rozwiązanie<\/summary>C — 30 cm<br>Bok kwadratu to 20 : 4 = 5 cm. Żeby powstały dwa prostokąty, cięcie musi być prostą równoległą do boku, długości 5 cm. Oba obwody razem to obwód kwadratu plus dwa razy linia cięcia (należy do obu prostokątów): 20 + 2 · 5 = 30 cm — niezależnie od tego, gdzie tniemy.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. C — czwartek\n2. D — 16\n3. B — 3\n4. D — 9\n5. B — 7\n6. C — 4:00\n7. B — 2\n8. D — 4\n9. A — 14\n10. B — 3\n11. A — 14\n12. C — 12:17\n13. B — 3\n14. C — 10\n15. D — 16:00\n16. C — 3\n17. B — 3\n18. C — 30 zł\n19. B — 24 zł\n20. C — 4\n21. B — w piątek\n22. D — 6\n23. D — 7 oczek\n24. B — 2\n25. D — 12 lat\n26. D — 4\n27. C — 52 kg\n28. E — inna odpowiedź\n29. A — 2 : 1\n30. C — 30 cm\n"}, {"path": "testy-przeszle/alfik-2019.md", "id": "alfik-2019", "kind": "przeszly", "short": "Alfik 2019", "md": "# Alfik 2019\n\n<div class=\"test\" data-minuty=\"75\"><\/div>\n\n**Oryginalny arkusz** XXV edycji konkursu Alfik Matematyczny, klasa 5 szkoły podstawowej, 27 listopada 2019.\nŹródło: [arkusz PDF](https://jersz.pl/wp-content/uploads/2020/08/5-SP-ALFIK-2019.pdf) i [klucz odpowiedzi](https://jersz.pl/wp-content/uploads/2020/08/Klucz-ALFIK-2019-do-neta.pdf) na stronie organizatora, jersz.pl.\n30 zadań, 75 minut, za błędną odpowiedź −¼ punktów zadania. Wyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n## Zadania po 3 punkty\n\n1. Paczka banknotów to sto sztuk banknotów. W takim razie milion złotych – ile to paczek dziesięciozłotówek? *(3 pkt)*\n   - A) 1\n   - B) 10\n   - C) 100\n   - D) 1000\n   - E) 10 000\n   <details><summary>rozwiązanie<\/summary>D — 1000<br>Jedna paczka dziesięciozłotówek to 100 · 10 zł = 1000 zł. Milion złotych to 1 000 000 : 1000 = 1000 takich paczek.<\/details><br>\n2. Ile jest takich liczb trzycyfrowych, w których cyfra setek jest dwa razy większa od cyfry dziesiątek, a cyfra dziesiątek – dwa razy większa od cyfry jedności? *(3 pkt)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) 5\n   <details><summary>rozwiązanie<\/summary>B — 2<br>Cyfra setek jest 4 razy większa od cyfry jedności i musi być cyfrą (najwyżej 9). Jedności = 1 daje 421, jedności = 2 daje 842, a jedności = 3 dałyby setki 12 — za dużo. Jedności = 0 daje 000, a to nie jest liczba trzycyfrowa. Są więc 2 takie liczby.<\/details><br>\n3. Kwadrat o boku długości 12 cm rozcięto na 4 jednakowe kwadraty. Jaka jest długość boku każdego z otrzymanych kwadratów? *(3 pkt)*\n   - A) 2 cm\n   - B) 3 cm\n   - C) 4 cm\n   - D) 6 cm\n   - E) 8 cm\n   <details><summary>rozwiązanie<\/summary>D — 6 cm<br>4 jednakowe kwadraty układają się 2 na 2, więc bok małego kwadratu to połowa boku dużego: 12 : 2 = 6 cm. Pułapka: 12 : 4 = 3 cm byłoby dobre, gdyby kwadraty leżały w jednym rzędzie — ale wtedy nie złożyłyby się w kwadrat.<\/details><br>\n4. Zegar Zosi wskazuje godzinę 12:36, a zegar Antka wskazuje 12:38. Jeśli zegar Zosi spieszy o 2 minuty, to zegar Antka: *(3 pkt)*\n   - A) spieszy o 4 minuty\n   - B) spieszy o 2 minuty\n   - C) chodzi prawidłowo\n   - D) spóźnia się o 4 minuty\n   - E) spóźnia się o 2 minuty\n   <details><summary>rozwiązanie<\/summary>A — spieszy o 4 minuty<br>Zegar Zosi spieszy o 2 minuty, więc naprawdę jest 12:34. Zegar Antka pokazuje 12:38, czyli o 4 minuty więcej niż prawdziwa godzina — spieszy o 4 minuty.<\/details><br>\n5. W pudełku są 3 kulki czerwone, 4 zielone i 5 niebieskich. Ile co najmniej kulek trzeba wyjąć (bez oglądania) z tego pudełka, aby mieć pewność, że wśród wyjętych kulek są kulki przynajmniej w dwóch kolorach? *(3 pkt)*\n   - A) 3\n   - B) 4\n   - C) 5\n   - D) 6\n   - E) 7\n   <details><summary>rozwiązanie<\/summary>D — 6<br>Najgorszy przypadek: wyjmujemy same kulki najliczniejszego koloru, czyli 5 niebieskich. Szósta kulka musi już być innego koloru. Pułapka: 4 lub 5 kulek mogą wszystkie być niebieskie.<\/details><br>\n6. Jaś ma 32 zł w monetach o nominałach: 1 zł, 2 zł i 5 zł. Ile monet ma Jaś, jeśli ma taką samą liczbę monet każdego z nominałów? *(3 pkt)*\n   - A) 6\n   - B) 9\n   - C) 12\n   - D) 15\n   - E) 18\n   <details><summary>rozwiązanie<\/summary>C — 12<br>Komplet „1 zł + 2 zł + 5 zł” jest wart 8 zł. 32 zł to 32 : 8 = 4 takie komplety, a każdy ma 3 monety: 4 · 3 = 12 monet.<\/details><br>\n7. Której z poniższych liczb nie można przedstawić jako sumy dwóch liczb nieparzystych? *(3 pkt)*\n   - A) 24\n   - B) 28\n   - C) 32\n   - D) 36\n   - E) 39\n   <details><summary>rozwiązanie<\/summary>E — 39<br>Nieparzysta + nieparzysta = zawsze liczba parzysta. 39 jest nieparzyste, więc nie da się go tak zapisać. Pozostałe da się, np. 24 = 1 + 23.<\/details><br>\n8. W białym pudełku są 2 jednakowe żółte pudełka. W każdym żółtym pudełku są 3 jednakowe brązowe pudełka, a w każdym brązowym pudełku są 4 jednakowe czerwone pudełka. Ile łącznie pudełek (wszystkich kolorów) jest wewnątrz białego pudełka? *(3 pkt)*\n   - A) 24\n   - B) 28\n   - C) 30\n   - D) 32\n   - E) 33\n   <details><summary>rozwiązanie<\/summary>D — 32<br>Żółtych jest 2, brązowych 2 · 3 = 6, czerwonych 6 · 4 = 24. Razem 2 + 6 + 24 = 32. Pułapka: białego pudełka nie liczymy — pytamy o pudełka wewnątrz niego (33 to odpowiedź z białym).<\/details><br>\n9. Ile jest trzycyfrowych liczb o sumie cyfr równej 4? *(3 pkt)*\n   - A) 5\n   - B) 6\n   - C) 7\n   - D) 8\n   - E) więcej niż 8\n   <details><summary>rozwiązanie<\/summary>E — więcej niż 8<br>Wypisujemy według cyfry setek: 1 → 103, 112, 121, 130 (4 liczby); 2 → 202, 211, 220 (3); 3 → 301, 310 (2); 4 → 400 (1). Razem 4 + 3 + 2 + 1 = 10, czyli więcej niż 8.<\/details><br>\n10. Na każdym białym polu biało-czarnej szachownicy o wymiarach 4×4 ustawiono 1 czarny pionek, a na każdym czarnym polu ustawiono 2 białe pionki. Ile łącznie pionków obu kolorów ustawiono na całej szachownicy? *(3 pkt)*\n    - A) 16\n    - B) 18\n    - C) 20\n    - D) 24\n    - E) 32\n    <details><summary>rozwiązanie<\/summary>D — 24<br>Szachownica 4×4 ma 16 pól: 8 białych i 8 czarnych. Na białych stoi 8 · 1 = 8 pionków, na czarnych 8 · 2 = 16. Razem 24.<\/details><br>\n\n## Zadania po 4 punkty\n\n11. Jacek kończy dziś tyle lat ile wynosi suma cyfr roku jego urodzenia. Ile lat ma Jacek, jeśli jest jeszcze niepełnoletni? *(4 pkt)*\n    - A) 5\n    - B) 6\n    - C) 7\n    - D) 8\n    - E) 9 lub więcej\n    <details><summary>rozwiązanie<\/summary>B — 6<br>Konkurs był w 2019 roku. Sprawdzamy: urodzony w 2013 ma 2019 − 2013 = 6 lat, a suma cyfr 2 + 0 + 1 + 3 = 6 — pasuje! Dla innych lat nie pasuje, np. 2012 → 7 lat, suma 5; 2014 → 5 lat, suma 7.<\/details><br>\n12. Ściany sześciennej kostki do gry ponumerowane są liczbami od 1 do 6 (każda ściana inną liczbą). Jacek rzucił trzema kostkami i pomnożył trzy otrzymane liczby. Która z poniższych liczb nie mogła być wynikiem tego mnożenia? *(4 pkt)*\n    - A) 48\n    - B) 64\n    - C) 72\n    - D) 81\n    - E) 96\n    <details><summary>rozwiązanie<\/summary>D — 81<br>81 = 3 · 3 · 3 · 3. Na kostce „trójkę w środku” mają tylko 3 i 6, i to tylko jedną, więc trzy kostki dadzą najwyżej trzy trójki w iloczynie — za mało. Pozostałe się da: 48 = 2 · 4 · 6, 64 = 4 · 4 · 4, 72 = 2 · 6 · 6, 96 = 4 · 4 · 6.<\/details><br>\n13. Niektóre pola biało-czarnej szachownicy o wymiarach 8×8 pomalowano na czerwono tak, aby w każdym rzędzie tej szachownicy i w każdej kolumnie tej szachownicy było dokładnie jedno czerwone pole. Ile pól pomalowano na czerwono? *(4 pkt)*\n    - A) 6\n    - B) 8\n    - C) 10\n    - D) 12\n    - E) 16\n    <details><summary>rozwiązanie<\/summary>B — 8<br>Rzędów jest 8 i w każdym jest dokładnie jedno czerwone pole, więc czerwonych pól jest 8 (i wtedy w każdej kolumnie też jest po jednym, np. na przekątnej).<\/details><br>\n14. Dwa miasta na mapie o skali 1 : 15 000 000 są odległe o 1 cm. Jaka jest ich odległość w rzeczywistości? *(4 pkt)*\n    - A) 1,5 km\n    - B) 15 km\n    - C) 150 km\n    - D) 1500 km\n    - E) 15 000 km\n    <details><summary>rozwiązanie<\/summary>C — 150 km<br>1 cm na mapie to 15 000 000 cm w terenie. 15 000 000 cm = 150 000 m = 150 km.<\/details><br>\n15. Jakie wymiary może mieć biało-czarna prostokątna szachownica złożona z 36 pól, której wszystkie 4 narożne pola są białe? *(4 pkt)*\n    - A) 6×6\n    - B) 4×9\n    - C) 3×12\n    - D) 2×18\n    - E) taka szachownica nie istnieje\n    <details><summary>rozwiązanie<\/summary>E — taka szachownica nie istnieje<br>Idąc wzdłuż rzędu kolory się zmieniają. Żeby oba końce rzędu były tego samego koloru, rząd musi mieć nieparzystą liczbę pól; tak samo kolumna. Wtedy liczba wszystkich pól = nieparzysta · nieparzysta = nieparzysta. A 36 jest parzyste, więc takiej szachownicy nie ma.<\/details><br>\n16. Za 5 lat Darek będzie miał dokładnie dwa razy więcej lat niż miał rok temu. Ile lat ma Darek? *(4 pkt)*\n    - A) 5\n    - B) 6\n    - C) 7\n    - D) 8\n    - E) 9\n    <details><summary>rozwiązanie<\/summary>C — 7<br>Między „rok temu” a „za 5 lat” mija 6 lat. Skoro wiek się podwaja, to te 6 lat równa się wiekowi sprzed roku. Rok temu Darek miał 6 lat, czyli teraz ma 7. Sprawdzenie: za 5 lat 12 = 2 · 6.<\/details><br>\n17. Ile jest takich miesięcy w roku, w których drugi i przedostatni dzień wypadają w tym samym dniu tygodnia? *(4 pkt)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 7\n    - E) 8\n    <details><summary>rozwiązanie<\/summary>D — 7<br>Ten sam dzień tygodnia powtarza się co 7 dni. W miesiącu 31-dniowym przedostatni dzień to 30., a 30 − 2 = 28 = 4 · 7 — pasuje. W 30-dniowym: 29 − 2 = 27, nie pasuje; w lutym też nie. Miesięcy 31-dniowych jest 7 (styczeń, marzec, maj, lipiec, sierpień, październik, grudzień).<\/details><br>\n18. Na wycieczkę pojechało 12 uczniów klasy 5a razem z 12 uczniami klasy 5b. Łącznie na wycieczkę pojechało tyle samo chłopców co dziewczynek. Jeśli na wycieczce było dokładnie 8 chłopców z klasy 5a, to ile było dziewczynek z klasy 5b? *(4 pkt)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 7\n    - E) 8\n    <details><summary>rozwiązanie<\/summary>E — 8<br>Razem 24 uczniów, czyli 12 chłopców i 12 dziewczynek. Z 5a jest 8 chłopców, więc z 5b jest 12 − 8 = 4 chłopców. Klasa 5b ma 12 uczniów, więc dziewczynek z 5b jest 12 − 4 = 8.<\/details><br>\n19. Każdą z sześciu ścian sześciennej kostki do gry pomalowano na niebiesko albo na biało tak, że w każdym wierzchołku kostki schodziły się dwie ściany niebieskie i jedna biała. Ile niebieskich ścian miała ta kostka? *(4 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>D — 4<br>Kostka ma 8 wierzchołków, a każda ściana ma 4 wierzchołki. Biała ściana „obsługuje” 4 wierzchołki, a każdy wierzchołek ma dokładnie jedną białą ścianę, więc białych ścian jest 8 : 4 = 2. Niebieskich jest 6 − 2 = 4 (np. białe góra i dół, niebieskie boki).<\/details><br>\n20. Dwa lata temu Zosia miała dokładnie tyle lat, ile wynosił łączny wiek jej trzech braci. Za rok trzej bracia Zosi będą łącznie mieli 25 lat. Ile lat ma Zosia? *(4 pkt)*\n    - A) 16\n    - B) 18\n    - C) 20\n    - D) 22\n    - E) 24\n    <details><summary>rozwiązanie<\/summary>B — 18<br>Za rok bracia mają razem 25 lat, więc teraz mają 25 − 3 = 22 (każdy jest o rok młodszy). Dwa lata temu mieli 22 − 6 = 16. Wtedy Zosia miała 16 lat, więc teraz ma 18. Pułapka: wiek trzech osób zmienia się o 3 lata na rok, a nie o 1.<\/details><br>\n\n## Zadania po 5 punktów\n\n21. W pewnej klasie na każdego chłopca przypadały dwie dziewczynki. Po tym jak do klasy dołączyło 5 dziewcząt, na każdego chłopca przypadają trzy dziewczynki. Ilu uczniów liczy teraz ta klasa? *(5 pkt)*\n    - A) 12\n    - B) 15\n    - C) 16\n    - D) 18\n    - E) 20\n    <details><summary>rozwiązanie<\/summary>E — 20<br>Każdy chłopiec „dostał” jedną nową dziewczynkę do pary, a nowych dziewcząt jest 5 — więc chłopców jest 5. Teraz dziewcząt jest 3 · 5 = 15, a razem 5 + 15 = 20 uczniów.<\/details><br>\n22. W roku 2020 dzień 1 lutego wypada w innym dniu tygodnia niż dzień 1 marca. Jaki jest kolejny rok o tej samej własności? *(5 pkt)*\n    - A) 2021\n    - B) 2022\n    - C) 2023\n    - D) 2024\n    - E) 2025\n    <details><summary>rozwiązanie<\/summary>D — 2024<br>Od 1 lutego do 1 marca mija tyle dni, ile ma luty. Gdy luty ma 28 dni (4 pełne tygodnie), dzień tygodnia się powtarza. Inny dzień wychodzi tylko w roku przestępnym (luty ma 29 dni). Następny rok przestępny po 2020 to 2024.<\/details><br>\n23. Ile najwięcej piątków może wypaść w ciągu 100 kolejnych dni? *(5 pkt)*\n    - A) 13\n    - B) 14\n    - C) 15\n    - D) 16\n    - E) 17\n    <details><summary>rozwiązanie<\/summary>C — 15<br>100 dni = 14 pełnych tygodni (98 dni) + 2 dni. W 14 tygodniach jest dokładnie 14 piątków, a w 2 dodatkowych dniach może być jeszcze jeden. Najwięcej 15 — np. gdy pierwszy dzień jest piątkiem.<\/details><br>\n24. Gdyby uczniów pewnej klasy podzielić na 5-osobowe grupy, to jedna osoba zostałaby bez przydziału. Gdyby natomiast uczniów tej klasy podzielić na 7-osobowe grupy, to dwie osoby zostałyby bez przydziału. Ilu uczniów liczy ta klasa? *(5 pkt)*\n    - A) 26\n    - B) 23\n    - C) 22\n    - D) 21\n    - E) mniej niż 20\n    <details><summary>rozwiązanie<\/summary>E — mniej niż 20<br>Sprawdzamy opcje: 26 : 7 daje resztę 5, 23 : 5 resztę 3, 22 : 5 resztę 2, 21 : 5 resztę 1, ale 21 : 7 resztę 0. Żadna nie pasuje. Pasuje 16: 16 = 3 · 5 + 1 i 16 = 2 · 7 + 2 — a następna pasująca liczba to dopiero 51.<\/details><br>\n25. Iloczyn 5 liczb (naturalnych) wynosi 120, a ich suma jest liczbą nieparzystą. Ile liczb parzystych jest wśród tych pięciu liczb? *(5 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>B — 2<br>120 = 2 · 2 · 2 · 15, więc parzystych liczb może być 1, 2 albo 3. Suma pięciu liczb jest nieparzysta, gdy liczb nieparzystych jest nieparzyście wiele. 1 parzysta → 4 nieparzyste (suma parzysta), 3 parzyste → 2 nieparzyste (suma parzysta), 2 parzyste → 3 nieparzyste (suma nieparzysta). Przykład: 2 · 4 · 1 · 3 · 5 = 120, suma 15.<\/details><br>\n26. W pewnym hotelu jest łącznie 28 miejsc w pokojach 2-osobowych, 3-osobowych i 4-osobowych. Wiadomo, że dokładnie połowa pokoi to pokoje 2-osobowe. Ile pokoi jest w tym hotelu? *(5 pkt)*\n    - A) 8\n    - B) 9\n    - C) 10\n    - D) 11\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>C — 10<br>Połącz każdy pokój 2-osobowy w parę z innym pokojem: para ma 2 + 3 = 5 albo 2 + 4 = 6 miejsc. Liczba par p spełnia 5p ≤ 28 ≤ 6p, więc p = 5 (25 ≤ 28 ≤ 30). Pokoi jest 2 · 5 = 10, np. 5 dwójek, 2 trójki i 3 czwórki: 10 + 6 + 12 = 28.<\/details><br>\n27. W pudełku są kulki zielone i czerwone. Kulek zielonych jest o pięć mniej niż czerwonych, a kulek czerwonych jest o połowę więcej niż zielonych. Ile łącznie kulek (obu kolorów) jest w tym pudełku? *(5 pkt)*\n    - A) 18\n    - B) 20\n    - C) 21\n    - D) 24\n    - E) 25\n    <details><summary>rozwiązanie<\/summary>E — 25<br>Czerwonych jest o połowę zielonych więcej niż zielonych, a ta różnica wynosi 5. Zatem połowa zielonych to 5, czyli zielonych jest 10, a czerwonych 15. Razem 25.<\/details><br>\n28. Uczniów pewnej 24-osobowej klasy nie można podzielić na takie 3-osobowe grupy, by w każdej grupie były najwyżej dwie dziewczynki. Nie można ich też podzielić na takie 4-osobowe grupy, by w każdej grupie był najwyżej jeden chłopiec. Ile dziewczynek jest w tej klasie? *(5 pkt)*\n    - A) 14\n    - B) 15\n    - C) 16\n    - D) 17\n    - E) 18\n    <details><summary>rozwiązanie<\/summary>D — 17<br>Grup 3-osobowych byłoby 8 i każda potrzebuje co najmniej 1 chłopca — skoro się nie da, chłopców jest mniej niż 8. Grup 4-osobowych byłoby 6, każda może mieć najwyżej 1 chłopca — skoro się nie da, chłopców jest więcej niż 6. Zatem chłopców jest 7, a dziewczynek 24 − 7 = 17.<\/details><br>\n29. Jacek ma dwa razy więcej pieniędzy niż Ala, ale trzy razy mniej niż Bartek. Ile pieniędzy ma Jacek, jeśli łącznie cała trójka dzieci ma 27 złotych? *(5 pkt)*\n    - A) 3 zł\n    - B) 4 zł\n    - C) 5 zł\n    - D) 6 zł\n    - E) 7 zł\n    <details><summary>rozwiązanie<\/summary>D — 6 zł<br>Jeśli Ala ma 1 część, to Jacek ma 2 części, a Bartek 3 · 2 = 6 części. Razem 9 części = 27 zł, czyli część to 3 zł. Jacek ma 2 · 3 = 6 zł.<\/details><br>\n30. Pewna liczba dwucyfrowa zwiększa się 5 razy, gdy na jej początku (jako cyfrę setek) dopiszemy cyfrę 1. Jaka jest cyfra jedności tej liczby? *(5 pkt)*\n    - A) 2\n    - B) 3\n    - C) 5\n    - D) 6\n    - E) 8\n    <details><summary>rozwiązanie<\/summary>C — 5<br>Dopisanie jedynki z przodu dodaje 100. Nowa liczba to 5 razy stara, czyli dodaliśmy 4 razy starą liczbę: 4 · liczba = 100, więc liczba to 25 (125 = 5 · 25). Cyfra jedności to 5.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. D — 1000\n2. B — 2\n3. D — 6 cm\n4. A — spieszy o 4 minuty\n5. D — 6\n6. C — 12\n7. E — 39\n8. D — 32\n9. E — więcej niż 8\n10. D — 24\n11. B — 6\n12. D — 81\n13. B — 8\n14. C — 150 km\n15. E — taka szachownica nie istnieje\n16. C — 7\n17. D — 7\n18. E — 8\n19. D — 4\n20. B — 18\n21. E — 20\n22. D — 2024\n23. C — 15\n24. E — mniej niż 20\n25. B — 2\n26. C — 10\n27. E — 25\n28. D — 17\n29. D — 6 zł\n30. C — 5\n"}, {"path": "testy-przeszle/alfik-2018.md", "id": "alfik-2018", "kind": "przeszly", "short": "Alfik 2018", "md": "# Alfik 2018\n\n<div class=\"test\" data-minuty=\"75\"><\/div>\n\n**Oryginalny arkusz** XXIV edycji konkursu Alfik Matematyczny, klasa 5 szkoły podstawowej, 21 listopada 2018.\nŹródło: [arkusz PDF](https://jersz.pl/wp-content/uploads/2020/08/Zadania-ALFIK-2018-podstawowa-5.pdf) i [klucz odpowiedzi](https://jersz.pl/wp-content/uploads/2020/08/Klucz-ALFIK-2018-do-neta.pdf) na stronie organizatora, jersz.pl.\n30 zadań, 75 minut, za błędną odpowiedź −¼ punktów zadania. Wyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n## Zadania po 3 punkty\n\n1. Rok temu Ania obchodziła ósme urodziny, a Basia za rok będzie obchodziła dziesiąte urodziny. O ile starsza jest Basia od Ani? *(3 pkt)*\n   - A) rok\n   - B) 2 lata\n   - C) 3 lata\n   - D) 4 lata\n   - E) są w tym samym wieku\n   <details><summary>rozwiązanie<\/summary>E — są w tym samym wieku<br>Ania ósme urodziny miała rok temu, więc dziewiąte ma w tym roku. Basia dziesiąte urodziny będzie miała za rok, więc dziewiąte też ma w tym roku. Obie kończą 9 lat w tym samym roku — urodziły się w tym samym roku, są w tym samym wieku. Pułapka: odjąć 10 − 8 = 2.<\/details><br>\n2. Ania w pięciu rzutach sześcienną kostką do gry (której ściany opisane są liczbami od 1 do 6) uzyskała łączny wynik 14. Ile najwięcej szóstek mogła wyrzucić? *(3 pkt)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) 5\n   <details><summary>rozwiązanie<\/summary>A — 1<br>Dwie szóstki to 12, a pozostałe trzy rzuty dają co najmniej 1 + 1 + 1 = 3 — razem co najmniej 15, za dużo. Jedna szóstka wystarczy, np. 6 + 2 + 2 + 2 + 2 = 14.<\/details><br>\n3. Jeśli dwa długopisy kosztują 14 zł, zaś dwa ołówki – 8 zł, to o ile droższy jest długopis od ołówka? *(3 pkt)*\n   - A) 3 zł\n   - B) 4 zł\n   - C) 6 zł\n   - D) 8 zł\n   - E) 12 zł\n   <details><summary>rozwiązanie<\/summary>A — 3 zł<br>Długopis kosztuje 14 : 2 = 7 zł, ołówek 8 : 2 = 4 zł. Różnica: 7 − 4 = 3 zł. Pułapka: 14 − 8 = 6 zł to różnica dla dwóch sztuk.<\/details><br>\n4. Ile jest wszystkich liczb dwucyfrowych? *(3 pkt)*\n   - A) 89\n   - B) 90\n   - C) 91\n   - D) 99\n   - E) 100\n   <details><summary>rozwiązanie<\/summary>B — 90<br>Liczby od 10 do 99. Od 1 do 99 jest 99 liczb, odejmujemy 9 jednocyfrowych: 99 − 9 = 90.<\/details><br>\n5. Kwadrat o obwodzie długości 12 cm rozcięto na cztery jednakowe kwadraty. Jaki jest łączny obwód otrzymanych kwadratów? *(3 pkt)*\n   - A) 6 cm\n   - B) 12 cm\n   - C) 24 cm\n   - D) 36 cm\n   - E) 48 cm\n   <details><summary>rozwiązanie<\/summary>C — 24 cm<br>Bok dużego kwadratu to 12 : 4 = 3 cm, a małego — 1,5 cm. Obwód małego kwadratu to 4 · 1,5 = 6 cm, a czterech — 24 cm.<\/details><br>\n6. W każdym z pięciu akwariów pływają cztery rybki. Ile co najmniej rybek trzeba przełożyć do innego akwarium, żeby doprowadzić do sytuacji, gdy w każdym akwarium jest inna liczba rybek? *(3 pkt)*\n   - A) 3\n   - B) 4\n   - C) 5\n   - D) 6\n   - E) 7\n   <details><summary>rozwiązanie<\/summary>A — 3<br>Rybek jest 20. Można osiągnąć 2, 3, 4, 5, 6: z jednego akwarium przekładamy 2 rybki (do akwarium, które ma mieć 6), z drugiego 1 (do tego, które ma mieć 5) — razem 3 rybki. Mniej się nie da: liczby mają być różne, więc najwyżej jedno akwarium zostaje z 4 rybkami. Jeśli mniej niż 4 rybki mają mieć dwa akwaria, to różne liczby, np. 3 i 2 — trzeba z nich zabrać co najmniej 1 + 2 = 3. Jeśli tylko jedno albo żadne, to co najmniej trzy akwaria mają więcej niż 4 (5, 6, 7 lub więcej) — trzeba dołożyć co najmniej 1 + 2 + 3 = 6. A trzy lub więcej akwariów z mniej niż 4 rybkami to zabranie co najmniej 1 + 2 + 3 = 6.<\/details><br>\n7. Ile jest takich liczb trzycyfrowych, których iloczyn cyfr jest mniejszy niż 3? *(3 pkt)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) więcej niż 4\n   <details><summary>rozwiązanie<\/summary>E — więcej niż 4<br>Każda liczba z cyfrą 0 ma iloczyn cyfr równy 0, np. 100, 101, 102, 103, 110 — już 5 takich liczb. (Wszystkich jest aż 175.) Pułapka: zapomnieć o zerze i liczyć tylko 111, 112, 121, 211.<\/details><br>\n8. Staszek jest dzisiaj trzy razy starszy niż był 4 lata temu. Ile lat ma Staszek? *(3 pkt)*\n   - A) 6\n   - B) 8\n   - C) 9\n   - D) 10\n   - E) 12\n   <details><summary>rozwiązanie<\/summary>A — 6<br>Wiek sprzed 4 lat to 1 część, dzisiejszy — 3 części. Różnica 2 części to 4 lata, więc część to 2 lata, a Staszek ma dziś 6 lat. Sprawdzenie: 4 lata temu miał 2, a 6 = 3 · 2.<\/details><br>\n9. Dwa boki prostokąta skrócono o 2 cm, a pozostałe dwa boki wydłużono o 3 cm, otrzymując kwadrat o polu 16 cm². Jakie pole miał początkowy prostokąt? *(3 pkt)*\n   - A) 6 cm²\n   - B) 8 cm²\n   - C) 12 cm²\n   - D) 16 cm²\n   - E) 18 cm²\n   <details><summary>rozwiązanie<\/summary>A — 6 cm²<br>Kwadrat o polu 16 cm² ma bok 4 cm. Boki prostokąta przed zmianą: 4 + 2 = 6 cm i 4 − 3 = 1 cm. Pole: 6 · 1 = 6 cm².<\/details><br>\n10. Ile razy więcej obrotów wykona wskazówka minutowa zegara od wskazówki godzinowej w ciągu miesiąca? *(3 pkt)*\n    - A) 6\n    - B) 12\n    - C) 14\n    - D) 24\n    - E) zależy od długości miesiąca\n    <details><summary>rozwiązanie<\/summary>B — 12<br>Przez każde 12 godzin wskazówka godzinowa robi 1 obrót, a minutowa 12 obrotów. Ten stosunek jest zawsze taki sam, niezależnie od długości miesiąca: 12 razy więcej.<\/details><br>\n\n## Zadania po 4 punkty\n\n11. Z jaką prędkością jedzie samochód, który pokonuje 800 metrów w ciągu minuty? *(4 pkt)*\n    - A) 40 km/h\n    - B) 48 km/h\n    - C) 56 km/h\n    - D) 60 km/h\n    - E) 80 km/h\n    <details><summary>rozwiązanie<\/summary>B — 48 km/h<br>W godzinie jest 60 minut, więc samochód przejedzie 60 · 800 m = 48 000 m = 48 km. To 48 km/h.<\/details><br>\n12. Pan Jan przyjechał do hotelu w przedostatnim dniu przedostatniego miesiąca ubiegłego roku, a wyjechał w ostatnim dniu ostatniego miesiąca ubiegłego roku. Ile nocy spędził w tym hotelu? *(4 pkt)*\n    - A) 28\n    - B) 29\n    - C) 30\n    - D) 31\n    - E) 32\n    <details><summary>rozwiązanie<\/summary>E — 32<br>Przyjazd 29 listopada (listopad ma 30 dni), wyjazd 31 grudnia. Noce w listopadzie: z 29 na 30 i z 30 listopada na 1 grudnia — 2 noce. W grudniu: od 1 do 31 grudnia jest 30 nocy. Razem 32.<\/details><br>\n13. Liczbę 12345 chcemy zamienić w liczbę 34512, wykonując ruchy polegające na zamianie miejscami dwóch cyfr. Jaka jest najmniejsza liczba ruchów jaką musimy wykonać? *(4 pkt)*\n    - A) 4 lub mniej\n    - B) 5\n    - C) 6\n    - D) 7\n    - E) 8 lub więcej\n    <details><summary>rozwiązanie<\/summary>A — 4 lub mniej<br>Każdym ruchem możemy postawić jedną cyfrę na właściwym miejscu: 12345 → 32145 → 34125 → 34521 → 34512. Wystarczą 4 ruchy (a ostatni ruch zawsze ustawia od razu dwie cyfry).<\/details><br>\n14. Ile najwięcej sobót może wypaść w jednym miesiącu? *(4 pkt)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>C — 5<br>Miesiąc ma najwyżej 31 dni = 4 tygodnie i 3 dni. W 4 tygodniach są 4 soboty, a w 3 dodatkowych dniach może być jeszcze jedna. Razem najwyżej 5 (np. gdy miesiąc zaczyna się w sobotę).<\/details><br>\n15. Ile co najmniej dwulitrowych butelek potrzeba, żeby przelać do nich wodę z 12 pełnych półtoralitrowych butelek? *(4 pkt)*\n    - A) 8\n    - B) 9\n    - C) 10\n    - D) 11\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>B — 9<br>Wody jest 12 · 1,5 = 18 litrów. 18 : 2 = 9 butelek dwulitrowych.<\/details><br>\n16. W każde pole szachownicy o wymiarach 8×8 wpisujemy iloczyn numeru kolumny i numeru rzędu, w których znajduje się to pole (zarówno kolumny jak i rzędy numerujemy kolejnymi liczbami od 1 do 8). Jaka jest największa możliwa różnica dwóch liczb wpisanych w sąsiadujące pola (tzn. pola mające wspólny bok)? *(4 pkt)*\n    - A) 5\n    - B) 6\n    - C) 7\n    - D) 8\n    - E) 9 lub więcej\n    <details><summary>rozwiązanie<\/summary>D — 8<br>Sąsiednie pola różnią się numerem kolumny (albo rzędu) o 1, przy tym samym drugim numerze. Różnica liczb jest więc równa temu drugiemu numerowi, czyli najwyżej 8 — np. 8 · 8 = 64 i 8 · 7 = 56.<\/details><br>\n17. Na szachownicy o wymiarach 6×6 ustawiono 18 pionków białych i 18 pionków czarnych, ustawiając po jednym pionku na każdym polu. Jeśli na białych polach ustawiono 7 białych pionków, to ile czarnych pionków ustawiono na czarnych polach? *(4 pkt)*\n    - A) 7\n    - B) 8\n    - C) 9\n    - D) 11\n    - E) zależy od ustawienia pionków\n    <details><summary>rozwiązanie<\/summary>A — 7<br>Białych pionków jest 18; 7 stoi na białych polach, więc 11 na czarnych. Czarnych pól jest 18, zajętych przez 11 białych pionków — na pozostałych 7 czarnych polach stoją czarne pionki.<\/details><br>\n18. Pewna liczba dwucyfrowa jest dokładnie 5 razy większa od sumy swoich cyfr. Jaka jest cyfra dziesiątek tej liczby? *(4 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) inna odpowiedź\n    <details><summary>rozwiązanie<\/summary>D — 4<br>Liczba jest 5 razy większa od czegoś, więc dzieli się przez 5 — kończy się na 0 lub 5. Sprawdzamy: 45 ma sumę cyfr 9, a 5 · 9 = 45. Pasuje (i to jedyna taka liczba). Cyfra dziesiątek to 4.<\/details><br>\n19. Z 9 zapałek, nie łamiąc żadnej z nich i wykorzystując je wszystkie, ułożono trójkąt, którego każdy bok był innej długości. Z ilu zapałek składał się najdłuższy bok tego trójkąta? *(4 pkt)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>B — 4<br>Trzy różne długości o sumie 9: 1+2+6, 1+3+5, 2+3+4. W trójkącie najdłuższy bok musi być krótszy niż suma dwóch pozostałych — pasuje tylko 2, 3, 4. Najdłuższy bok ma 4 zapałki.<\/details><br>\n20. Ile jest takich dwucyfrowych liczb, które po pomnożeniu przez 6 dają w wyniku liczbę dwucyfrową? *(4 pkt)*\n    - A) 5\n    - B) 6\n    - C) 7\n    - D) 8\n    - E) więcej niż 8\n    <details><summary>rozwiązanie<\/summary>C — 7<br>Wynik ma być najwyżej 99, a 6 · 16 = 96, 6 · 17 = 102. Pasują liczby od 10 do 16 — jest ich 7.<\/details><br>\n\n## Zadania po 5 punktów\n\n21. W pewnym roku jeden z miesięcy rozpoczął się i zakończył niedzielą. Pierwszy dzień owego roku wypadł w: *(5 pkt)*\n    - A) wtorek\n    - B) środę\n    - C) czwartek\n    - D) piątek\n    - E) podana sytuacja jest niemożliwa\n    <details><summary>rozwiązanie<\/summary>C — czwartek<br>Pierwszy i ostatni dzień w tym samym dniu tygodnia ma tylko miesiąc 29-dniowy — luty roku przestępnego. 1 lutego to niedziela. Styczeń ma 31 dni = 4 tygodnie i 3 dni, więc 1 stycznia był 3 dni tygodnia wcześniej niż niedziela: w czwartek.<\/details><br>\n22. Przed wakacjami pan Jacek ważył o 7 kg więcej od pana Waldka, ale w czasie wakacji pan Jacek schudł dokładnie o tyle, ile przytył pan Waldek. O ile przytył pan Waldek, jeśli teraz waży o 3 kg więcej od pana Jacka? *(5 pkt)*\n    - A) 4 kg\n    - B) 5 kg\n    - C) 7 kg\n    - D) 8 kg\n    - E) 10 kg\n    <details><summary>rozwiązanie<\/summary>B — 5 kg<br>Różnica wag zmieniła się z „Jacek +7” na „Waldek +3”, czyli o 7 + 3 = 10 kg. Każdy kilogram, który Waldek przytył, a Jacek zgubił, zmienia różnicę o 2 kg. Zatem 10 : 2 = 5 kg.<\/details><br>\n23. W pewnej klasie chłopców jest półtora raza więcej niż dziewcząt, a dziewcząt – o 4 mniej niż chłopców. Ilu uczniów liczy ta klasa? *(5 pkt)*\n    - A) 15\n    - B) 16\n    - C) 18\n    - D) 20\n    - E) 24\n    <details><summary>rozwiązanie<\/summary>D — 20<br>Chłopców jest tyle co dziewcząt plus połowa dziewcząt. Ta połowa to różnica 4, więc dziewcząt jest 8, chłopców 12. Razem 20.<\/details><br>\n24. W koszyku są kulki w trzech kolorach: zielone, czerwone i niebieskie. Jeśli wylosujemy z koszyka 5 kulek, to wśród nich zawsze będą kule we wszystkich trzech kolorach, a jeśli wylosujemy 3 kule, to wśród nich zawsze będą kule w przynajmniej dwóch kolorach. Jaka jest największa możliwa liczba kulek w tym koszyku? *(5 pkt)*\n    - A) 6\n    - B) 7\n    - C) 8\n    - D) 9\n    - E) 10\n    <details><summary>rozwiązanie<\/summary>A — 6<br>Skoro 3 kule zawsze mają co najmniej 2 kolory, to żadnego koloru nie ma 3 lub więcej — każdego jest najwyżej 2. Zatem kulek jest najwyżej 2 + 2 + 2 = 6. I 6 pasuje: wyjmując 5 z 6, zostawiamy tylko jedną, więc każdy kolor zostaje wylosowany.<\/details><br>\n25. Wśród 12 monet – złotówek, dwuzłotówek i pięciozłotówek – o łącznej wartości 30 zł jest więcej pięciozłotówek niż dwuzłotówek. Ile złotówek jest wśród tych monet? *(5 pkt)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>E — 6<br>Gdyby wszystkie 12 monet było złotówkami, mielibyśmy 12 zł — brakuje 18 zł. Zamiana złotówki na dwuzłotówkę dodaje 1 zł, a na pięciozłotówkę 4 zł. Potrzeba więc: (liczba dwuzłotówek) + 4 · (liczba pięciozłotówek) = 18. Możliwości: 2 dwuzłotówki i 4 pięciozłotówki, 6 i 3, 10 i 2. Więcej pięciozłotówek jest tylko w pierwszej: 2 + 4 = 6 monet, więc złotówek jest 12 − 6 = 6.<\/details><br>\n26. Każdy spośród 24 uczniów pewnej klasy uczy się przynajmniej jednego spośród języków: angielski, niemiecki, francuski. Wiemy, że języka angielskiego uczy się 19 uczniów, niemieckiego – 17 uczniów, a francuskiego – 5 uczniów. Jeśli wszystkich trzech języków uczy się dwóch uczniów, to ilu uczniów uczy się dokładnie dwóch języków? *(5 pkt)*\n    - A) 10\n    - B) 11\n    - C) 12\n    - D) 13\n    - E) 14\n    <details><summary>rozwiązanie<\/summary>D — 13<br>Policzmy „zapisy na języki”: 19 + 17 + 5 = 41. Każdy uczeń ma co najmniej jeden zapis, to 24. Nadwyżka 41 − 24 = 17 bierze się z dodatkowych języków: uczeń z dwoma językami daje 1 nadwyżki, z trzema — 2. Dwaj uczniowie z trzema językami dają 4, zostaje 13 — tylu uczniów uczy się dokładnie dwóch języków.<\/details><br>\n27. Na stole leży jeden kawałek papieru. W każdym ruchu albo rozcinamy na dwie części każdy leżący na stole kawałek papieru albo zabieramy ze stołu jeden kawałek papieru. Jaka jest najmniejsza liczba ruchów, którymi doprowadzimy do sytuacji, gdy na stole będzie dokładnie 30 kawałków papieru? *(5 pkt)*\n    - A) 6\n    - B) 7\n    - C) 8\n    - D) 9\n    - E) 10 lub więcej\n    <details><summary>rozwiązanie<\/summary>A — 6<br>Rozcinanie wszystkiego podwaja liczbę kawałków. Najlepiej myśleć od końca: 30 to podwojone 15, 15 to 16 − 1, a 16 to 1 podwojone 4 razy. Czyli: 1 → 2 → 4 → 8 → 16 → 15 → 30 — 6 ruchów. W 5 ruchach liczby 30 nie da się otrzymać (można to sprawdzić, wypisując wszystkie możliwości), więc 6 to najmniej.<\/details><br>\n28. Suma pewnych pięciu liczb dwucyfrowych jest liczbą nieparzystą, a ich iloczyn jest liczbą parzystą, niepodzielną przez 8. Ile spośród tych pięciu liczb jest liczbami parzystymi? *(5 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>B — 2<br>Suma jest nieparzysta, więc liczb nieparzystych jest nieparzyście wiele (1, 3 lub 5), czyli parzystych: 4, 2 lub 0. Iloczyn jest parzysty, więc 0 odpada. Cztery liczby parzyste dają iloczyn podzielny przez 2 · 2 · 2 · 2 = 16, a więc i przez 8 — też odpada. Zostają 2 liczby parzyste (np. 10 · 14 · 11 · 13 · 15 — iloczyn dzieli się przez 4, ale nie przez 8).<\/details><br>\n29. W pewnym mieście są 4 linie metra, a na każdej linii są 4 stacje. Jaka jest łączna liczba stacji metra w tym mieście, jeśli każda stacja leży na dokładnie dwóch liniach metra? *(5 pkt)*\n    - A) 4\n    - B) 8\n    - C) 12\n    - D) 14\n    - E) 16\n    <details><summary>rozwiązanie<\/summary>B — 8<br>Gdyby policzyć stacje osobno na każdej linii, wyszłoby 4 · 4 = 16. Ale każdą stację policzyliśmy dwa razy (leży na dwóch liniach), więc stacji jest 16 : 2 = 8.<\/details><br>\n30. Basia kończy dziś tyle lat, ile wynosi suma cyfr roku jej urodzenia, zaś Asia rok temu skończyła tyle lat, ile wynosi suma cyfr roku jej urodzenia. O ile młodsza jest Asia od Basi, jeśli żadna z dziewczynek nie skończyła jeszcze 18 lat? *(5 pkt)*\n    - A) 5 lat\n    - B) 4 lata\n    - C) 3 lata\n    - D) 2 lata\n    - E) Asia jest starsza od Basi\n    <details><summary>rozwiązanie<\/summary>B — 4 lata<br>Konkurs odbył się w 2018 roku. Basia: urodzona w 2008 roku (suma cyfr 2 + 0 + 0 + 8 = 10) kończy w 2018 roku 10 lat — sprawdzając lata 2001–2018, tylko to pasuje. Asia: rok temu (2017) skończyła tyle lat, ile suma cyfr roku urodzenia — pasuje tylko 2012 (suma 5, a 2017 − 2012 = 5). Asia urodziła się 4 lata po Basi.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. E — są w tym samym wieku\n2. A — 1\n3. A — 3 zł\n4. B — 90\n5. C — 24 cm\n6. A — 3\n7. E — więcej niż 4\n8. A — 6\n9. A — 6 cm²\n10. B — 12\n11. B — 48 km/h\n12. E — 32\n13. A — 4 lub mniej\n14. C — 5\n15. B — 9\n16. D — 8\n17. A — 7\n18. D — 4\n19. B — 4\n20. C — 7\n21. C — czwartek\n22. B — 5 kg\n23. D — 20\n24. A — 6\n25. E — 6\n26. D — 13\n27. A — 6\n28. B — 2\n29. B — 8\n30. B — 4 lata\n"}, {"path": "testy-przeszle/alfik-2017.md", "id": "alfik-2017", "kind": "przeszly", "short": "Alfik 2017", "md": "# Alfik 2017\n\n<div class=\"test\" data-minuty=\"75\"><\/div>\n\n**Oryginalny arkusz** XXIII edycji konku
