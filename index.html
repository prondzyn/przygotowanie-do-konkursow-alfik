***: *(5 pkt)*\n    - A) odnoszą się do „ludzi pióra”\n    - B) to wyraz potoczny i literacki\n    - C) mają znaczenie przeciwstawne\n    - D) mają różne znaczenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — odnoszą się do „ludzi pióra”<br>*Literat* i *pisarz* to synonimy — oba oznaczają kogoś, kto pisze książki. „Ludzie pióra” to właśnie pisarze. Żaden z tych wyrazów nie jest potoczny.<\/details><br>\n30. W wyrazie ***pisarz***: *(5 pkt)*\n    - A) są trzy sylaby\n    - B) są cztery spółgłoski\n    - C) są trzy samogłoski\n    - D) jest więcej liter niż głosek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — jest więcej liter niż głosek<br>Pi-sarz ma 6 liter (p, i, s, a, r, z), ale 5 głosek, bo dwuznak *rz* to jedna głoska. Sylaby są 2, samogłoski 2 (i, a), spółgłoski 3 (p, s, rz).<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. C — powieści\n2. A — dialog\n3. B — mieszkanie bohatera\n4. D — pisarzem\n5. B — narratorem\n6. D — obrazy wiszące na ścianach\n7. A — był w przyjacielskich stosunkach z wieloma malarzami\n8. A — już umarł\n9. C — rozpoznała twórcę obrazu, ponieważ znała jego inne prace\n10. A — malarz rozpoznanego obrazu był utalentowany\n11. C — ma charakter pozytywny\n12. A — obraz ten jej się podoba\n13. C — brak praktycznego myślenia\n14. D — sposób traktowania otrzymanych dzieł\n15. E — żadna z powyższych\n16. B — uważne\n17. D — szybko zmieniła temat\n18. C — powiedzieć coś od niechcenia\n19. A — występuje przysłówek\n20. B — jest rzeczownikiem w formie dopełniacza\n21. C — 3. os. l. poj. cz. przeszłego\n22. D — podmiotem jest wyraz *coś*\n23. C — ma charakter przenośny\n24. A — anonimowy\n25. D — znakomity\n26. B — przydawki\n27. B — jest więcej spółgłosek niż samogłosek\n28. C — oznacza *są biedni*\n29. A — odnoszą się do „ludzi pióra”\n30. D — jest więcej liter niż głosek\n"}, {"path": "humanistyczny/klasa-5/testy-przeszle/alfik-2018.md", "id": "hum5/alfik-2018", "kind": "przeszly", "short": "Alfik 2018", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Alfik 2018\n\n<div class=\"test\" data-minuty=\"45\" data-start=\"30\"><\/div>\n\n**Oryginalny arkusz** XXII edycji konkursu Alfik Humanistyczny, klasa 5 szkoły podstawowej, 12 grudnia 2018.\nŹródło: [arkusz PDF](https://jersz.pl/wp-content/uploads/2020/08/DRUK-AH-2018-5-SP.pdf) i [klucz odpowiedzi](https://jersz.pl/wp-content/uploads/2020/08/AH_2018_klucz.pdf) na stronie organizatora, jersz.pl.\n30 pytań, 45 minut. Na start masz 30 pkt, za błędną odpowiedź tracisz ¼ punktów pytania.\nOdpowiedź E znaczy: żadna z odpowiedzi A–D nie jest poprawna. Wyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n## Tekst\n\n**Kornel Makuszyński, _Szatan z siódmej klasy_ (fragment)**\n\n> Zdumiał się Adaś, gdy mu oznajmiono szeptem, że profesor Gąsowski czeka w sąsiednim pokoju. Pomyślał w pierwszej chwili, że staruszek zjawił się jako pacjent u jego ojca; ojciec jednakże był nieobecny, a pan profesor żądał natychmiastowej rozmowy ze swym uczniem.\n>\n> — Młodzieńcze! — mówił staruszek po uroczystym przywitaniu — rozumiem twoje zdumienie. Nie obawiaj się… Nie masz niczego na sumieniu, zresztą dzisiaj jest pierwszy dzień wakacji i nie posiadam nad tobą żadnej władzy. Przede wszystkim zechciej mi przebaczyć, że cię publicznie nazwałem szatanem!\n>\n> — Ach, panie profesorze — uśmiechnął się Adaś — to tylko zaszczyt dla mnie…\n>\n> — Skoro tak, nie będę ukrywał, że postępki twoje budzą niepokój w ludziach prostego ducha. Zdumiewająca twoja przenikliwość napełnia mnie przerażeniem. (…) Rozmyślałem nad tym i przyszedłem do ciebie prosić o radę i o pomoc… Nie otwieraj oczów tak szeroko, bo mnie onieśmielasz… Tak jest drogi chłopcze! Potrzeba mi gwałtownie twojej pomocy… Znalazłem się w srogich tarapatach… Nie tyle ja osobiście, co moja rodzina. Dowiesz się o wszystkim w swoim czasie, przedtem jednak zechciej mi powiedzieć, jak i gdzie masz zamiar spędzić wakacje?\n>\n> — Nad morzem — odparł stropiony Adaś — Mamy wyjechać pojutrze.\n>\n> — W takim razie wszystko przepadło! — zawołał staruszek smutno. — Dla mnie nie wyrzekniesz się morza.\n>\n> Adaś spojrzał na niego bystro i widząc wielkie zmartwienie w poczciwych oczach rzekł szybko:\n>\n> — Gdybym wiedział, o co idzie, panie profesorze… Czy pan profesor naprawdę ma jakąś wielką zgryzotę?\n>\n> — Bardzo wielką, bardzo wielką! — odrzekł staruszek trąc ręką czoło. — Gdybyś mi jednak chciał pomóc, musiałbyś pojechać na wieś… Przepraszam, jak ci na imię?\n>\n> — Adam.\n>\n> — Prawda, już mi to mówiłeś parokrotnie… Otóż, kochany Adamie, przyjechała do mnie onegdaj moja bratanica, koza… To znaczy: nie koza we właściwym znaczeniu tego słowa, lecz usposobieniem żywo przypominająca kozę. Zawsze po mnie przyjeżdża, aby mnie zabrać na wieś, raz mi się bowiem zdarzyło, do dziś nie wiem dlaczego, że zamiast do mojego brata, zajechałem do jakichś obcych ludzi o sto kilometrów na wschód od ojczystej siedziby mego rodu. Zwyczajna ludzka pomyłka… Otóż ta moja bratanica przywiozła smutne wieści… Jakieś tajemnicze niebezpieczeństwo zawisło nad moim rodem. Pomyślałem sobie: „pójdę do tego piekielnika — nie gniewaj się, ale tak mi się jakoś pomyślało! — a on jeden mi poradzi”. I dlatego tutaj jestem… Dziwnego zaufania nabrałem do ciebie, kochany Piotrusiu…\n>\n> — Adamie, panie profesorze…\n>\n> — Prawda! Adamie… Skoro jednak wzywa cię morze, odejdę z rozpaczą.\n>\n> Adaś patrząc na beznadziejnie smutne oblicze najzacniejszego profesora rozmyślał gwałtownie. Serdecznie było mu żal starowiny. Być może, że „bratanica—koza” jakieś urojenie uważa za nieszczęście, z wszelką jednakże pewnością zmartwienie profesora nie jest urojeniem. Wprawdzie Adasia „wzywa morze”, jak szumnie powiada profesor, ale morze nie zając. Nie ucieknie. Należy się zastanowić. Nad morzem, poza doskonałą sposobnością do utonięcia, nie zdarzy żadna awantura, tymczasem ta nieznana mu jeszcze historia pachnie awanturą jak łąka sianem. Dzisiaj jest wtorek, a do czwartku ma czas do namysłu. Miłuje tego uroczego staruszka, nie mówiąc nawet o tym, że omal wielkiej nie wyrządził mu przykrości. Trzeba by się zastanowić, pomówić z ojcem, zapoznać się ze szczegółami „nieszczęścia”.\n>\n> — Panie profesorze! — mówił Adaś sącząc powoli słowa. — Bardzo wątpię, czy mógłbym się na co przydać, ale strasznie bym nie chciał, aby pan profesor odszedł smutny. W tej chwili nie mogę niczego obiecać, ale kto wie, czy po rozmowie z rodzicami…\n>\n> — Adamie! — zakrzyknął pan profesor ujrzawszy skrawek nadziei jak rąbek księżyca na niebie.\n>\n> — Czy pan profesor pozwoli mi odwiedzić się dzisiaj po południu?\n>\n> — We dnie i w nocy, kiedy zechcesz. (…) Więc mogę mieć nadzieję?\n>\n> (…) Staruszek, bardzo rozradowany, chciał wejść w szafę zamiast drzwi, chwycił laskę doktora zamiast swojego parasola i zapomniał kaloszów. (…) Usiłował wprawdzie wpaść na ulicy pod automobil, ale to mu się przypadkiem nie udało.\n\n## Pytania za 3 punkty\n\n1. Załączony fragment tekstu: *(3 pkt)*\n   - A) jest tekstem poetyckim\n   - B) może pochodzić z powieści\n   - C) należy do publicystyki\n   - D) jest tekstem naukowym\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — może pochodzić z powieści<br>Tekst jest napisany prozą, ma narratora, bohaterów i dialogi, a opowiada zmyśloną historię — tak wygląda fragment powieści. Nie ma wersów (to nie poezja) ani informacji o prawdziwych wydarzeniach (to nie publicystyka ani tekst naukowy).<\/details><br>\n2. W zaproponowanym fragmencie występuje: *(3 pkt)*\n   - A) fantastyka\n   - B) opis natury\n   - C) podmiot liryczny\n   - D) dialog\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — dialog<br>Większą część tekstu zajmuje rozmowa profesora z Adasiem — kolejne wypowiedzi zaczynają się od myślnika. Pułapka: podmiot liryczny występuje tylko w wierszach, a tu mówi narrator.<\/details><br>\n3. Przedstawiona w załączonym tekście sytuacja: *(3 pkt)*\n   - A) z pewnością miała miejsce w rzeczywistości\n   - B) jest wydarzeniem fikcyjnym\n   - C) ze względu na swój szczególny charakter jest mało prawdopodobna\n   - D) rozgrywa się w przyszłości\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — jest wydarzeniem fikcyjnym<br>To fragment powieści, więc historia jest wymyślona przez autora (fikcja literacka). Pułapka: wizyta nauczyciela u ucznia nie jest niczym nieprawdopodobnym, więc C odpada.<\/details><br>\n4. Przywołany tekst: *(3 pkt)*\n   - A) nie zawiera monologu wewnętrznego bohatera\n   - B) jest napisany prozą\n   - C) ma budowę stroficzną\n   - D) ma narratora, który nie zna myśli bohatera\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — jest napisany prozą<br>Tekst jest zapisany zwykłymi zdaniami w akapitach, bez wersów i zwrotek. Narrator zna myśli Adasia („Należy się zastanowić… Dzisiaj jest wtorek, a do czwartku ma czas do namysłu”), więc A i D są nieprawdziwe.<\/details><br>\n5. Przedstawione w tekście wydarzenie rozgrywa się: *(3 pkt)*\n   - A) w lecie\n   - B) pod koniec wakacji\n   - C) zimą\n   - D) po wakacjach\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — w lecie<br>Profesor mówi: „dzisiaj jest pierwszy dzień wakacji”, a wakacje zaczynają się latem. Pułapka: to początek, a nie koniec wakacji.<\/details><br>\n6. Miejscem akcji przedstawionego wydarzenia jest: *(3 pkt)*\n   - A) klasa\n   - B) mieszkanie rodziny Adasia\n   - C) mieszkanie profesora Gąsowskiego\n   - D) dworek rodziny profesora Gąsowskiego\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — mieszkanie rodziny Adasia<br>Profesor „czeka w sąsiednim pokoju”, a Adaś myśli, że przyszedł jako pacjent do jego ojca — to profesor odwiedza Adasia w jego domu. Pułapka: na wieś do rodziny profesora Adaś mógłby dopiero pojechać.<\/details><br>\n7. O profesorze możemy powiedzieć, że: *(3 pkt)*\n   - A) jest pedantem\n   - B) przywiązuje wagę do szczegółów\n   - C) jest człowiekiem roztargnionym\n   - D) jest człowiekiem nieznoszącym sprzeciwu\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — jest człowiekiem roztargnionym<br>Profesor kilka razy zapomina imienia Adasia (mówi do niego „Piotrusiu”), kiedyś pojechał do obcych ludzi zamiast do brata, a wychodząc chce wejść w szafę i bierze cudzą laskę. Pedant (A) i ktoś, kto dba o szczegóły (B), tak by się nie zachowywał.<\/details><br>\n8. Mówiąc ***znalazłem się w srogich tarapatach*** profesor: *(3 pkt)*\n   - A) chce wywrzeć wrażenie na słuchaczach\n   - B) żartuje\n   - C) kłamie\n   - D) informuje o swoich poważnych problemach\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — informuje o swoich poważnych problemach<br>Tarapaty to kłopoty, a „srogie” znaczy poważne. Profesor mówi to szczerze — potem dodaje, że ma „bardzo wielką” zgryzotę.<\/details><br>\n9. Z tekstu możemy dowiedzieć się, że ojciec Adasia: *(3 pkt)*\n   - A) rzadko bywa w domu\n   - B) jest lekarzem\n   - C) pracuje za granicą\n   - D) jest bardzo surowy\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — jest lekarzem<br>Adaś myśli, że profesor „zjawił się jako pacjent u jego ojca”, a na końcu profesor chwyta „laskę doktora”. Pułapka: ojca nie było w domu tylko tego dnia — tekst nie mówi, że rzadko w nim bywa.<\/details><br>\n10. Profesor szczególnie ceni u Adasia jego: *(3 pkt)*\n    - A) poczucie humoru\n    - B) wiedzę historyczną\n    - C) inteligencję\n    - D) odwagę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — inteligencję<br>Profesor mówi o „zdumiewającej przenikliwości” Adasia i przychodzi po radę, bo „on jeden mi poradzi”. Przenikliwość to bystrość umysłu, czyli inteligencja.<\/details><br>\n\n## Pytania za 4 punkty\n\n11. Celem wizyty profesora jest: *(4 pkt)*\n    - A) dowiedzenie się czy jego uczniowie wyjeżdżają na wakacje\n    - B) pożegnanie się z uczniem\n    - C) rozmowa o szkole\n    - D) prośba o pomoc\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — prośba o pomoc<br>Profesor mówi wprost: „przyszedłem do ciebie prosić o radę i o pomoc”. Pułapka: pyta o wakacje tylko po to, żeby sprawdzić, czy Adaś będzie mógł mu pomóc.<\/details><br>\n12. Z powyższego tekstu nie dowiemy się: *(4 pkt)*\n    - A) na czym dokładnie polega problem profesora\n    - B) kiedy Adaś odwiedzi profesora żeby dać mu odpowiedź\n    - C) czy Adaś lubi „*awantury*”\n    - D) jaki jest stosunek Adasia do profesora\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — na czym dokładnie polega problem profesora<br>Profesor mówi tylko o „jakimś tajemniczym niebezpieczeństwie” i obiecuje: „Dowiesz się o wszystkim w swoim czasie”. Pozostałe rzeczy w tekście są: Adaś przyjdzie „dzisiaj po południu”, historia „pachnie awanturą” (to go kusi), a staruszka „miłuje”.<\/details><br>\n13. Ostatnie zdanie przytoczonego fragmentu świadczy o tym, że osoba opowiadająca: *(4 pkt)*\n    - A) jest przerażona zachowaniem profesora\n    - B) traktuje profesora z przymrużeniem oka\n    - C) nie lubi profesora\n    - D) jest zdziwiona zachowaniem profesora\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — traktuje profesora z przymrużeniem oka<br>„Usiłował wprawdzie wpaść na ulicy pod automobil, ale to mu się przypadkiem nie udało” — narrator żartuje z roztargnienia profesora, pisze tak, jakby wpadnięcie pod auto było jego celem. Mówi o nim z humorem i sympatią, a nie ze strachem czy niechęcią.<\/details><br>\n14. Używając sformułowania ***morze nie zając*** Adaś ma na myśli, że: *(4 pkt)*\n    - A) może jest bezpieczne\n    - B) nad morzem jest nudno\n    - C) nad morze zawsze zdąży jeszcze pojechać\n    - D) nie lubi morza\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — nad morze zawsze zdąży jeszcze pojechać<br>Zaraz potem jest: „Nie ucieknie”. Zając szybko ucieka, a morze zostanie na miejscu, więc można tam pojechać później.<\/details><br>\n15. Z przywołanego fragmentu wynika, że Adaś: *(4 pkt)*\n    - A) jest nieufny\n    - B) bardzo lubi przygody\n    - C) boi się profesora\n    - D) chciałby jak najszybciej zakończyć rozmowę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — bardzo lubi przygody<br>Adaś myśli, że nad morzem „nie zdarzy żadna awantura”, a sprawa profesora „pachnie awanturą jak łąka sianem” — i to go przyciąga. Awantura znaczy tu przygoda.<\/details><br>\n16. Wyraz ***oznajmiono*** jest czasownikiem w formie: *(4 pkt)*\n    - A) bezokolicznika\n    - B) osobowej\n    - C) 1. os. l. mn.\n    - D) nieosobowej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — nieosobowej<br>Formy zakończone na *-no* i *-to* (oznajmiono, zrobiono, umyto) to nieosobowe formy czasownika — nie wiadomo, kto wykonał czynność. Pułapka: 1. os. l. mn. brzmiałaby „oznajmiliśmy”.<\/details><br>\n17. W wypowiedzeniu ***(…) profesor żądał natychmiastowej rozmowy ze swym uczniem***: *(4 pkt)*\n    - A) są dwa czasowniki\n    - B) wszystkie rzeczowniki mają formę mianownika\n    - C) występują trzy rzeczowniki\n    - D) przynajmniej dwa rzeczowniki są w tym samym przypadku\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — występują trzy rzeczowniki<br>Rzeczowniki to: *profesor* (mianownik), *rozmowy* (dopełniacz: żądał czego?), *uczniem* (narzędnik: z kim?). Każdy jest w innym przypadku, więc B i D odpadają. Czasownik jest jeden — *żądał*.<\/details><br>\n18. Wyraz ***ze*** jest: *(4 pkt)*\n    - A) spójnikiem\n    - B) przyimkiem\n    - C) zaimkiem\n    - D) wyrazem nienależącym do żadnej z wymienionych części mowy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — przyimkiem<br>*Ze* to inna postać przyimka *z* (ze swym uczniem, ze szkoły). Przyimek łączy się z rzeczownikiem i razem z nim tworzy wyrażenie przyimkowe. Pułapka: *że* z kropką to spójnik, a *ze* — przyimek.<\/details><br>\n19. W wypowiedzeniu ***rozumiem twoje zdumienie***: *(4 pkt)*\n    - A) jest jeden rzeczownik\n    - B) nie ma rzeczowników\n    - C) są dwa czasowniki\n    - D) nie występuje czasownik\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — jest jeden rzeczownik<br>*Zdumienie* to rzeczownik (rozumiem co?). *Rozumiem* to jedyny czasownik, a *twoje* to zaimek.<\/details><br>\n20. W wypowiedzeniu z pytania 19. wyraz ***rozumiem***: *(4 pkt)*\n    - A) jest podmiotem\n    - B) ma formę 3. os. l. poj.\n    - C) ma funkcję orzeczenia\n    - D) nie jest ani podmiotem, ani orzeczeniem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — ma funkcję orzeczenia<br>*Rozumiem* mówi, co robi osoba mówiąca — to orzeczenie w 1. os. l. poj. (ja rozumiem). Podmiot *ja* jest domyślny.<\/details><br>\n\n## Pytania za 5 punktów\n\n21. W wyrazach ***rozumiem*** i ***zdumienie***: *(5 pkt)*\n    - A) jest różna ilość sylab\n    - B) jest tyle samo samogłosek\n    - C) jest różna ilość spółgłosek\n    - D) nie występuje ***i*** zmiękczające\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest tyle samo samogłosek<br>Ro-zu-miem ma samogłoski o, u, e, a zdu-mie-nie: u, e, e — po 3. W obu wyrazach *i* tylko zmiękcza (mie, nie), więc nie jest samogłoską. Sylab jest po 3, spółgłosek po 4 (r, z, mi, m oraz z, d, mi, ni), więc A, C i D są fałszywe.<\/details><br>\n22. Zdanie ***(…) dzisiaj jest pierwszy dzień wakacji***: *(5 pkt)*\n    - A) nie zawiera przydawki\n    - B) zawiera jedną przydawkę\n    - C) jest zdaniem złożonym współrzędnie\n    - D) jest zdaniem pojedynczym\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — jest zdaniem pojedynczym<br>Jest tu tylko jedno orzeczenie (*jest*), więc to zdanie pojedyncze. Przydawka określa rzeczownik i odpowiada na pytania jaki? który? czyj? czego? — tu są dwie: dzień (który?) *pierwszy* i dzień (czego?) *wakacji*, więc A i B odpadają.<\/details><br>\n23. Wyraz ***dzień***: *(5 pkt)*\n    - A) jest jednosylabowy\n    - B) należy do nieodmiennej części mowy\n    - C) jest rodzaju nijakiego\n    - D) ma dwie sylaby\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — jest jednosylabowy<br>Ile samogłosek, tyle sylab. W *dzień* jest jedna samogłoska — e (i tylko zmiękcza). To rzeczownik rodzaju męskiego (ten dzień), który się odmienia (dnia, dniem).<\/details><br>\n24. Wyraz ***pierwszy***: *(5 pkt)*\n    - A) ma tę samą ilość liter i głosek\n    - B) jest jednosylabowy\n    - C) jest przymiotnikiem\n    - D) odmienia się przez przypadki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — odmienia się przez przypadki<br>Pierwszy, pierwszego, pierwszemu… — odmienia się. Pułapka: *pierwszy* odpowiada na pytanie „który z kolei?” i w szkole nazywa się go liczebnikiem porządkowym, a nie przymiotnikiem. Ma 2 sylaby (pierw-szy) i więcej liter niż głosek (*sz* to jedna głoska, a *i* tylko zmiękcza).<\/details><br>\n25. Podmiotem w wypowiedzeniu ***(…) postępki twoje budzą niepokój w ludziach prostego ducha*** jest wyraz: *(5 pkt)*\n    - A) twoje\n    - B) postępki\n    - C) niepokój\n    - D) ludziach\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — postępki<br>Podmiot odpowiada na pytanie kto? co? wykonuje czynność: co budzi niepokój? — *postępki*. Pułapka: *niepokój* to dopełnienie (budzą co?), a *twoje* to przydawka (postępki czyje?).<\/details><br>\n26. Sformułowanie ***prostego ducha*** składa się z wyrazów: *(5 pkt)*\n    - A) z których jeden jest przysłówkiem\n    - B) mających tę samą ilość sylab\n    - C) będących w różnych przypadkach\n    - D) będących w tym samym przypadku\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — będących w tym samym przypadku<br>Oba wyrazy są w dopełniaczu (kogo? czego? — ducha; jakiego? — prostego). Przymiotnik zawsze stoi w tym samym przypadku co rzeczownik, który określa. *Prostego* to przymiotnik, nie przysłówek; sylab jest 3 i 2.<\/details><br>\n27. Określenie ***ludzie prostego ducha***: *(5 pkt)*\n    - A) ma charakter metaforyczny\n    - B) oznacza ***ludzie niekulturalni***\n    - C) jest zabarwione ujemnie\n    - D) określa ludzi, z którymi z pewnością prof. Gąsowski się nie utożsamia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — ma charakter metaforyczny<br>Duch nie może być dosłownie „prosty” — to przenośnia (metafora) oznaczająca ludzi prostodusznych, naiwnych. Nie chodzi o brak kultury (B). Uwaga: można się spierać, że określenie jest lekko lekceważące (C), ale organizator uznał tylko A.<\/details><br>\n28. Wyraz ***niepokój***: *(5 pkt)*\n    - A) jest czasownikiem\n    - B) nie ma formy liczby mnogiej\n    - C) w mianowniku i bierniku ma różne formy\n    - D) jest rzeczownikiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — jest rzeczownikiem<br>*Niepokój* nazywa uczucie i odpowiada na pytanie co? — to rzeczownik. Ma liczbę mnogą (niepokoje), a w mianowniku i bierniku brzmi tak samo (jest niepokój — budzą niepokój).<\/details><br>\n29. Dwie sylaby znajdują się w wyrazie: *(5 pkt)*\n    - A) chciał\n    - B) wejść\n    - C) ludziach\n    - D) przykrości\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — ludziach<br>Lu-dziach: samogłoski u i a (i tylko zmiękcza „dz”). *Chciał* i *wejść* mają po jednej sylabie, a *przy-kro-ści* — trzy.<\/details><br>\n30. W zdaniu ***(…) ta nieznana mu jeszcze historia pachnie awanturą jak łąka sianem***: *(5 pkt)*\n    - A) nie występuje czasownik w formie osobowej\n    - B) występuje porównanie\n    - C) nie ma rzeczownika w mianowniku\n    - D) wszystkie rzeczowniki mają formę mianownika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — występuje porównanie<br>Porównanie zestawia dwie rzeczy za pomocą słów *jak*, *niczym*, *jakby*: historia pachnie awanturą *jak* łąka sianem. *Pachnie* to czasownik w formie osobowej; *historia* i *łąka* są w mianowniku, a *awanturą* i *sianem* w narzędniku.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. B — może pochodzić z powieści\n2. D — dialog\n3. B — jest wydarzeniem fikcyjnym\n4. B — jest napisany prozą\n5. A — w lecie\n6. B — mieszkanie rodziny Adasia\n7. C — jest człowiekiem roztargnionym\n8. D — informuje o swoich poważnych problemach\n9. B — jest lekarzem\n10. C — inteligencję\n11. D — prośba o pomoc\n12. A — na czym dokładnie polega problem profesora\n13. B — traktuje profesora z przymrużeniem oka\n14. C — nad morze zawsze zdąży jeszcze pojechać\n15. B — bardzo lubi przygody\n16. D — nieosobowej\n17. C — występują trzy rzeczowniki\n18. B — przyimkiem\n19. A — jest jeden rzeczownik\n20. C — ma funkcję orzeczenia\n21. B — jest tyle samo samogłosek\n22. D — jest zdaniem pojedynczym\n23. A — jest jednosylabowy\n24. D — odmienia się przez przypadki\n25. B — postępki\n26. D — będących w tym samym przypadku\n27. A — ma charakter metaforyczny\n28. D — jest rzeczownikiem\n29. C — ludziach\n30. B — występuje porównanie\n"}, {"path": "humanistyczny/klasa-5/testy-przeszle/alfik-2017.md", "id": "hum5/alfik-2017", "kind": "przeszly", "short": "Alfik 2017", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Alfik 2017\n\n<div class=\"test\" data-minuty=\"45\" data-start=\"30\"><\/div>\n\n**Oryginalny arkusz** XXI edycji konkursu Alfik Humanistyczny, klasa 5 szkoły podstawowej, 13 grudnia 2017.\nŹródło: [arkusz PDF](https://jersz.pl/wp-content/uploads/2020/08/AH-2017-5-SP.pdf), [tekst do czytania](https://jersz.pl/wp-content/uploads/2020/08/TEKSTY-DLA-KLAS-2SP-6-SP.pdf) i [klucz odpowiedzi](https://jersz.pl/wp-content/uploads/2020/08/AH_2017_klucz.pdf) na stronie organizatora, jersz.pl.\n30 pytań, 45 minut. Na start masz 30 pkt, za błędną odpowiedź tracisz ¼ punktów pytania.\nOdpowiedź E znaczy: żadna z odpowiedzi A–D nie jest poprawna. Wyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n## Tekst\n\n**Aleksander Fredro, _Zemsta_ (fragment)**\n\n> CZEŚNIK<br>\n> Ależ wdowa — doświadczona,<br>\n> Zna proporcję, mocium panie,<br>\n> I nie każe fircykować,<br>\n> Po kulikach balansować.<br>\n> *po krótkiej chwili*<br>\n> No — nie sekret, żem niemłody,<br>\n> Alem także i niestary.<br>\n> (...)\n>\n> DYNDALSKI<br>\n> W małżeńskim ciężko stanie;<br>\n> Pan zaś, mówiąc między nami,<br>\n> Masz pedogrę.\n>\n> CZEŚNIK<br>\n> *niekontent*<br>\n> Ej, czasami.\n>\n> DYNDALSKI<br>\n> Kurcz żołądka.\n>\n> CZEŚNIK<br>\n> Po przepiciu.\n>\n> DYNDALSKI<br>\n> Rumatyzmy jakieś łupią.\n>\n> CZEŚNIK<br>\n> *zniecierpliwiony*<br>\n> Ot, co powiesz, wszystko głupio.<br>\n> Ten mankament nic nie znaczy;<br>\n> Wszak i u niej, co w ukryciu,<br>\n> Bóg to tylko wiedzieć raczy;<br>\n> I nikt pewnie się nie spyta,<br>\n> Byle tylko w dalszym życiu<br>\n> Między nami była kwita.\n\n## Pytania za 3 punkty\n\n1. Tekst powyższy ma formę: *(3 pkt)*\n   - A) poematu\n   - B) powieści\n   - C) dialogu\n   - D) baśni\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — dialogu<br>Tekst to rozmowa dwóch postaci, Cześnika i Dyndalskiego. Przed każdą wypowiedzią jest imię osoby, która mówi — tak wygląda dialog w utworze scenicznym.<\/details><br>\n2. Budowa tekstu świadczy o tym, że: *(3 pkt)*\n   - A) można go wystawić na scenie\n   - B) jest to utwór przeznaczony wyłącznie do czytania\n   - C) utwór ten nie nadaje się na scenę\n   - D) jest on napisany prozą\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — można go wystawić na scenie<br>Tekst składa się z kwestii postaci i wskazówek dla aktorów (np. *zniecierpliwiony*) — to dramat, przeznaczony do wystawienia w teatrze. Pułapka D: jest napisany wierszem (wersy z rymami), nie prozą.<\/details><br>\n3. W tekście tym można znaleźć: *(3 pkt)*\n   - A) opisy\n   - B) rymy\n   - C) morał\n   - D) wiele wątków\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — rymy<br>Wersy się rymują: fircykować – balansować, głupio – łupią, znaczy – raczy, spyta – kwita.<\/details><br>\n4. O występujących postaciach możemy powiedzieć, że są: *(3 pkt)*\n   - A) twórcami\n   - B) narratorami\n   - C) „ja” mówiącymi\n   - D) bohaterami\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — bohaterami<br>Cześnik i Dyndalski to postacie, bohaterowie utworu. W dramacie nie ma narratora — postacie same mówią swoje kwestie.<\/details><br>\n5. Tekst poboczny (tzw. didaskalia) informuje nas: *(3 pkt)*\n   - A) o tym, co mówią bohaterowie\n   - B) o ocenach postępowania postaci\n   - C) o wszystkich okolicznościach związanych ze sceną\n   - D) wyłącznie o miejscu i czasie akcji\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — o wszystkich okolicznościach związanych ze sceną<br>Didaskalia to wskazówki autora: kto mówi, jak się zachowuje (*niekontent*, *zniecierpliwiony*), co robi, gdzie i kiedy dzieje się akcja. Pułapka D: nie tylko miejsce i czas. To, co mówią bohaterowie, to tekst główny.<\/details><br>\n6. Pojęciem związanym z gatunkiem, który reprezentuje powyższy tekst jest: *(3 pkt)*\n   - A) akapit\n   - B) akt\n   - C) rozdział\n   - D) tom\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — akt<br>*Zemsta* to komedia, czyli dramat. Dramat dzieli się na akty, a akty na sceny. Rozdziały i akapity mają powieści i opowiadania.<\/details><br>\n7. Temat powyższej sceny najlepiej oddaje sformułowanie: *(3 pkt)*\n   - A) wewnętrzna niezgoda na ślub\n   - B) wyobrażenie Cześnika o swoim przyszłym małżeństwie\n   - C) ośmieszenie Cześnika przez Dyndalskiego\n   - D) afera w domu Cześnika\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — wyobrażenie Cześnika o swoim przyszłym małżeństwie<br>Cześnik zastanawia się, jaka będzie wdowa jako żona, i mówi, czego oczekuje: „Byle tylko w dalszym życiu / Między nami była kwita”.<\/details><br>\n8. Z tekstu dowiadujemy się, że: *(3 pkt)*\n   - A) Cześnik dopiero szuka kandydatki na żonę\n   - B) żadna kandydatka nie odpowiada Cześnikowi\n   - C) Cześnik potrzebuje rady przyjaciela\n   - D) kandydatką na żonę Cześnika jest wdowa\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — kandydatką na żonę Cześnika jest wdowa<br>Cześnik zaczyna od słów „Ależ wdowa — doświadczona”, a potem mówi o niej jako o przyszłej żonie („u niej, co w ukryciu”). Pułapka A: kandydatkę już ma.<\/details><br>\n9. Z wypowiedzi Cześnika można wywnioskować, że w małżeństwie ceni sobie najbardziej: *(3 pkt)*\n   - A) miłość\n   - B) rozrywki\n   - C) spokój\n   - D) urodę żony\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — spokój<br>Cieszy się, że wdowa „nie każe fircykować, / Po kulikach balansować” (czyli nie będzie go ciągnąć na zabawy), i chce, żeby „między nami była kwita” — czyli zgoda i spokój. Pułapka B: rozrywek właśnie nie chce.<\/details><br>\n10. O Cześniku można powiedzieć, że: *(3 pkt)*\n    - A) ma wiele chorób\n    - B) jest ubogi\n    - C) jest wdowcem\n    - D) nie lubi Dyndalskiego\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — ma wiele chorób<br>Dyndalski wylicza: podagra (pedogra), kurcz żołądka, reumatyzm. Cześnik nie zaprzecza, tylko tłumaczy („Ej, czasami”, „Po przepiciu”).<\/details><br>\n\n## Pytania za 4 punkty\n\n11. To, że na wzmiankę o pedogrze (podagrze) Cześnik reaguje ***niekontent*** świadczy o tym, że: *(4 pkt)*\n    - A) roztkliwia się nad sobą\n    - B) rozmowy o stanie zdrowia nie są dla niego miłe\n    - C) lubi opowiadać o swoich chorobach\n    - D) cieszy się znakomitym zdrowiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — rozmowy o stanie zdrowia nie są dla niego miłe<br>„Niekontent” znaczy niezadowolony. Cześnik nie lubi, gdy ktoś wytyka mu choroby, więc je pomniejsza: „Ej, czasami”.<\/details><br>\n12. O Dyndalskim możemy powiedzieć, że: *(4 pkt)*\n    - A) nie wie jeszcze wszystkiego o Cześniku\n    - B) rozumie decyzję Cześnika w sprawie małżeństwa\n    - C) krótko zna Cześnika\n    - D) dobrze zna Cześnika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — dobrze zna Cześnika<br>Dyndalski wie o wszystkich jego dolegliwościach i mówi mu o nich otwarcie, „między nami” — tak może mówić tylko ktoś bliski, kto zna go od dawna. Pułapka B: Dyndalski raczej odradza ślub („W małżeńskim ciężko stanie”).<\/details><br>\n13. Wypowiedź Dyndalskiego ***W małżeńskim ciężko stanie*** świadczy o tym, że: *(4 pkt)*\n    - A) marzy o małżeństwie\n    - B) zazdrości Cześnikowi\n    - C) o małżeństwie myśli z niechęcią\n    - D) nie lubi wdowy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — o małżeństwie myśli z niechęcią<br>Dyndalski uważa, że w małżeństwie jest ciężko — nie ma o nim dobrego zdania. O samej wdowie nic złego nie mówi, więc D odpada.<\/details><br>\n14. Wypowiedź Cześnika ***Wszak i u niej, co w ukryciu*** świadczy o tym, że: *(4 pkt)*\n    - A) podejrzewa, że wdowa też ma swoje choroby\n    - B) liczy na bogactwa wdowy\n    - C) z niechęcią myśli o wdowie\n    - D) jest naiwny\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — podejrzewa, że wdowa też ma swoje choroby<br>Cześnik mówi: moje choroby („ten mankament”) nic nie znaczą, bo „i u niej, co w ukryciu, / Bóg to tylko wiedzieć raczy” — ona też może mieć ukryte dolegliwości.<\/details><br>\n15. Komizm do powyższej sceny wprowadza: *(4 pkt)*\n    - A) postać wdowy\n    - B) zdanie ***Byle tylko (...)/Między nami była kwita***\n    - C) wyliczanka chorób Cześnika skwitowana zdaniem ***Ten mankament nic nie znaczy***\n    - D) strach Cześnika przed małżeństwem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — wyliczanka chorób Cześnika skwitowana zdaniem ***Ten mankament nic nie znaczy***<br>Śmieszne jest to, że Dyndalski wylicza całą listę dolegliwości, a Cześnik zbywa je jednym zdaniem, jakby chodziło o drobiazg. Pułapka D: Cześnik nie boi się ślubu, tylko go planuje.<\/details><br>\n16. Wyraz ***sekret***: *(4 pkt)*\n    - A) nie jest rzeczownikiem\n    - B) można zastąpić formą *tajemnica*\n    - C) nie odmienia się przez przypadki\n    - D) nie ma formy liczby mnogiej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — można zastąpić formą *tajemnica*<br>Sekret to tajemnica — to synonimy. „Sekret” jest rzeczownikiem, odmienia się (sekretu, sekretem) i ma liczbę mnogą (sekrety).<\/details><br>\n17. Wyrazy ***balansować*** i ***fircykować*** są czasownikami: *(4 pkt)*\n    - A) w formie bezokolicznika\n    - B) w formie osobowej\n    - C) w czasie przeszłym\n    - D) nieodmiennymi przez osoby\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — w formie bezokolicznika<br>Bezokolicznik kończy się na -ć i odpowiada na pytanie co robić? — balansować, fircykować. Pułapka D: te czasowniki odmieniają się przez osoby (balansuję, balansujesz…), tylko tutaj użyto ich w bezokoliczniku.<\/details><br>\n18. W wypowiedzeniu ***W małżeńskim ciężko stanie*** występuje: *(4 pkt)*\n    - A) zaimek\n    - B) więcej niż jeden przyimek\n    - C) czasownik\n    - D) przysłówek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — przysłówek<br>„Ciężko” to przysłówek — odpowiada na pytanie jak? Pozostałe wyrazy: „w” (jeden przyimek), „małżeńskim” (przymiotnik), „stanie” (rzeczownik: w stanie). Pułapka C: „stanie” wygląda jak czasownik, ale tu znaczy „w stanie małżeńskim”.<\/details><br>\n19. Podkreślony wyraz w wypowiedzeniu ***Byle tylko (…)/Między nami była <u>kwita<\/u>***: *(4 pkt)*\n    - A) znaczy *konflikt*\n    - B) jest zaimkiem\n    - C) ma formę czasu przyszłego\n    - D) znaczy *zgoda*\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — znaczy *zgoda*<br>„Kwita” znaczy: jesteśmy rozliczeni, nikt nikomu nic nie jest winien — czyli zgoda, spokój. Pułapka A: to coś odwrotnego.<\/details><br>\n20. Wyrazy ***zaś*** i ***nami*** są: *(4 pkt)*\n    - A) w obu przypadkach nieodmienne\n    - B) innymi częściami mowy\n    - C) tą samą częścią mowy\n    - D) przyimkami\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — innymi częściami mowy<br>„Zaś” to spójnik (nieodmienny), a „nami” to zaimek — narzędnik od „my” (odmienny). Różne części mowy.<\/details><br>\n\n## Pytania za 5 punktów\n\n21. ***Mankament*** to: *(5 pkt)*\n    - A) zaleta\n    - B) atut\n    - C) wada\n    - D) wyobrażenie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — wada<br>Mankament to wada, usterka, brak. Cześnik tak nazywa swoje choroby. Pułapka: zaleta i atut znaczą coś odwrotnego.<\/details><br>\n22. W wypowiedzeniu ***Zna proporcję(…)/I nie każe fircykować***: *(5 pkt)*\n    - A) jest tylko jeden czasownik\n    - B) występuje spójnik\n    - C) brakuje orzeczenia\n    - D) nie ma partykuły\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — występuje spójnik<br>„I” to spójnik, łączy dwie części wypowiedzenia. Czasowniki są trzy (zna, każe, fircykować), orzeczenia dwa (zna, każe), a „nie” to partykuła.<\/details><br>\n23. Więcej liter niż głosek jest w wyrazie: *(5 pkt)*\n    - A) byle\n    - B) zna\n    - C) fircykować\n    - D) czasami\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — czasami<br>W „czasami” jest dwuznak „cz” — dwie litery, jedna głoska. Liter jest 7, głosek 6. W pozostałych wyrazach każda litera to osobna głoska.<\/details><br>\n24. Do nieodmiennych części mowy należy wyraz: *(5 pkt)*\n    - A) nic\n    - B) co\n    - C) między\n    - D) kurcz\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — między<br>„Między” to przyimek, a przyimki się nie odmieniają. „Nic” i „co” to zaimki (niczego, czego), „kurcz” to rzeczownik (kurczu) — odmieniają się.<\/details><br>\n25. Wyrazem czterosylabowym jest forma: *(5 pkt)*\n    - A) doświadczona\n    - B) małżeńskim\n    - C) niekontent\n    - D) zniecierpliwiony\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — doświadczona<br>Do-świad-czo-na — cztery sylaby. Mał-żeń-skim i nie-kon-tent mają trzy, znie-cier-pli-wio-ny — pięć. Pułapka: w „świad”, „nie”, „wio” litera i tylko zmiękcza i nie tworzy osobnej sylaby.<\/details><br>\n26. W zdaniu ***Reumatyzmy jakieś łupią***: *(5 pkt)*\n    - A) jest podmiot domyślny\n    - B) podmiotem jest wyraz *reumatyzmy*\n    - C) brak podmiotu\n    - D) brak orzeczenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — podmiotem jest wyraz *reumatyzmy*<br>Co łupie? — „reumatyzmy”: rzeczownik w mianowniku, więc to podmiot. Orzeczenie to „łupią” (łupać — tu: boleć, łamać w kościach).<\/details><br>\n27. Wyraz ***krótkiej***: *(5 pkt)*\n    - A) jest przysłówkiem\n    - B) nie odmienia się przez przypadki\n    - C) nie ma stopnia najwyższego\n    - D) można stopniować\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — można stopniować<br>„Krótkiej” to przymiotnik (chwili jakiej? krótkiej). Stopniuje się: krótki – krótszy – najkrótszy. Odmienia się przez przypadki, więc B też odpada.<\/details><br>\n28. W wypowiedzeniu ***Bóg to tylko wiedzieć raczy***: *(5 pkt)*\n    - A) występuje dopełnienie\n    - B) jest tylko jeden czasownik\n    - C) nie występuje czasownik w formie osobowej\n    - D) wszystkie czasowniki mają formę osobową\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — występuje dopełnienie<br>Dopełnienie odpowiada na pytania przypadków zależnych (kogo? czego? co?…). Raczy wiedzieć co? — „to”. Czasowniki są dwa: „raczy” (forma osobowa) i „wiedzieć” (bezokolicznik), więc B, C i D odpadają.<\/details><br>\n29. Sprawdzając pisownię wyrazu ***niemłody*** odwołasz się do zasady pisowni *nie* z: *(5 pkt)*\n    - A) przysłówkami\n    - B) rzeczownikami\n    - C) przymiotnikami\n    - D) zaimkami\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — przymiotnikami<br>„Młody” to przymiotnik (jaki?), a „nie” z przymiotnikami w stopniu równym piszemy łącznie: niemłody, niestary.<\/details><br>\n30. Rzeczownikiem nie jest wyraz: *(5 pkt)*\n    - A) panie\n    - B) kulikach\n    - C) czasami\n    - D) pedogrę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — czasami<br>W tekście „Ej, czasami” znaczy „niekiedy” — to przysłówek (kiedy?). „Panie”, „kulikach” (kulig) i „pedogrę” (podagra) to rzeczowniki. Uwaga: „czasami” bywa też narzędnikiem rzeczownika „czas” (np. „między czasami”), ale tu chodzi o znaczenie „niekiedy”.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. C — dialogu\n2. A — można go wystawić na scenie\n3. B — rymy\n4. D — bohaterami\n5. C — o wszystkich okolicznościach związanych ze sceną\n6. B — akt\n7. B — wyobrażenie Cześnika o swoim przyszłym małżeństwie\n8. D — kandydatką na żonę Cześnika jest wdowa\n9. C — spokój\n10. A — ma wiele chorób\n11. B — rozmowy o stanie zdrowia nie są dla niego miłe\n12. D — dobrze zna Cześnika\n13. C — o małżeństwie myśli z niechęcią\n14. A — podejrzewa, że wdowa też ma swoje choroby\n15. C — wyliczanka chorób Cześnika skwitowana zdaniem ***Ten mankament nic nie znaczy***\n16. B — można zastąpić formą *tajemnica*\n17. A — w formie bezokolicznika\n18. D — przysłówek\n19. D — znaczy *zgoda*\n20. B — innymi częściami mowy\n21. C — wada\n22. B — występuje spójnik\n23. D — czasami\n24. C — między\n25. A — doświadczona\n26. B — podmiotem jest wyraz *reumatyzmy*\n27. D — można stopniować\n28. A — występuje dopełnienie\n29. C — przymiotnikami\n30. C — czasami\n"}, {"path": "humanistyczny/klasa-5/testy-przeszle/alfik-2016.md", "id": "hum5/alfik-2016", "kind": "przeszly", "short": "Alfik 2016", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Alfik 2016\n\n<div class=\"test\" data-minuty=\"45\" data-start=\"30\"><\/div>\n\n**Oryginalny arkusz** XX edycji konkursu Alfik Humanistyczny, klasa 5 szkoły podstawowej, 14 grudnia 2016.\nŹródło: [arkusz PDF](https://jersz.pl/wp-content/uploads/2020/08/DRUK-AH-2016-5-SP.pdf), [tekst do czytania](https://jersz.pl/wp-content/uploads/2020/08/teksty-SP.pdf) i [klucz odpowiedzi](https://jersz.pl/wp-content/uploads/2020/08/AHU_2016_klucz.pdf) na stronie organizatora, jersz.pl.\n30 pytań, 45 minut. Na start masz 30 pkt, za błędną odpowiedź tracisz ¼ punktów pytania.\nOdpowiedź E znaczy: żadna z odpowiedzi A–D nie jest poprawna. Wyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n## Tekst\n\n**Kornel Makuszyński, _Panna z mokrą głową_**\n\n> Irence przybyło trzy lata, a babce ubyło pięć, czyli - że naturalny porządek rzeczy został zachowany. Wedle tego magicznego obliczenia musiało kiedyś dojść do zupełnego wyrównania wieku. Babcia była coraz bardziej żwawa, a Irenka coraz bardziej poważna. Prawdę powiedziawszy była to powaga dziwnego nabożeństwa, czasem bowiem uderzało jej coś do głowy, powaga pękała z hukiem, a jakieś nowe szaleństwo Irenki napełniało świat radosnym zgiełkiem. Mogło zdawać się, że w chudym, czarnym, zdrowym ciele tej dziewczyny mieszkały dwie dusze, które na zmianę odbywały wartę: jedna była rozważna, często głęboko zamyślona, pełna słodyczy i tkliwości, drugą zaś uradowałby się Tatar, gdy dziewczyna przypominała sobie nagle, że młodość bucha z niej jak żar ze słońca. Wtedy pytała wiatru, kto kogo przegoni, i pytała wiosny, kto roześmieje się jaśniej, dźwięczniej?\n>\n> Gdyby nie ona, smutno byłoby w białym domu. Ona jednak świdrującymi oczami umiała wypatrzyć smętek w najbardziej mrocznym kącie i biegła tam czym prędzej wypłoszyć go krzykiem i czarodziejstwem śmiechu. Wszelki smutek bał się jej jak diabeł święconej wody. Pojęła bystrze, że zgryzota, podobnie jak mętna woda, wciąż przybiera od deszczu łez; że jeśli smutkiem żywi się ją, rośnie bujnie jak chwast i wreszcie wszystko zagłuszy. Najlepiej jest nie poddać się smętkowi i gnać go na cztery wiatry, póki czas: otworzyć serce, jak okno, aby mógł przez nie wejść promień słońca, który wypija wilgoć łez i mętność zgryzoty. Smutek jest płochliwy i napada na tych tylko, co nie umieją obronić się, załamują ręce i głowę pochylają na piersi, z daleka jednak obchodzi tych, co go oczekują odważnie i z pogodnym czołem. Trzeba tylko strasznie, z całej siły wierzyć, że będzie lepiej, a będzie lepiej. Radość jest sprawiedliwa, chociaż nierychliwa. Pan Podkówka jednak mówił prawdę, powtarzając jej często złote zdanie, co w mądrej narodziło się głowie, że „stracony jest każdy dzień bez uśmiechu”.\n>\n> Szkoda pana Podkówki... Co się z nim dzieje w tej chwili? Irenka myślała o nim często, przygotowując książki i zeszyty, aby napić się z nich mądrości. Co pół roku jeździła do miasta na egzaminy i przywoziła papier świadczący, że posiada głowę mokrą wprawdzie, ale doskonale umeblowaną i tak zasobną w wiedzę jak ul w miody.\n\n## Pytania za 3 punkty\n\n1. Powyższy tekst: *(3 pkt)*\n   - A) jest napisany prozą\n   - B) jest utworem poetyckim\n   - C) zawiera refren\n   - D) dzieli się na zwrotki\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — jest napisany prozą<br>Tekst jest zapisany zwykłymi zdaniami w akapitach, bez wersów i rymów — to proza. Zwrotki i refren mają wiersze i piosenki.<\/details><br>\n2. Osobą mówiącą w tym fragmencie jest: *(3 pkt)*\n   - A) Irenka\n   - B) pan Podkówka\n   - C) narrator\n   - D) bohater\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — narrator<br>W prozie o wydarzeniach opowiada narrator. Tu opowiada o Irence w trzeciej osobie („Irenka myślała o nim często”), więc to nie ona mówi.<\/details><br>\n3. Osoba mówiąca w przedstawionym tekście: *(3 pkt)*\n   - A) nie ocenia bohaterów\n   - B) nie zna myśli bohaterów\n   - C) bierze udział w akcji\n   - D) nie uczestniczy w wydarzeniach\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — nie uczestniczy w wydarzeniach<br>Narrator mówi „ona”, „Irenka”, nigdy „ja” ani „my” — stoi z boku. Pułapka B: zna myśli bohaterki („Pojęła bystrze, że…”, „Irenka myślała o nim często”). Pułapka A: ocenia ją, np. „Pojęła bystrze”, głowa „doskonale umeblowana”.<\/details><br>\n4. Tematem powyższego tekstu jest: *(3 pkt)*\n   - A) opis domu\n   - B) charakterystyka Irenki\n   - C) opowiadanie o panu Podkówce\n   - D) opowiadanie o przeszłości rodziny\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — charakterystyka Irenki<br>Cały fragment mówi, jaka jest Irenka: jak wygląda (chuda, czarna), jaka jest (poważna, ale wesoła, mądra), jak walczy ze smutkiem. To jest charakterystyka postaci.<\/details><br>\n5. Osoba mówiąca: *(3 pkt)*\n   - A) ma pozytywny stosunek do Irenki\n   - B) krytykuje postępowanie bohaterki\n   - C) nie określa swojego stosunku do bohaterki\n   - D) nie wyraża swojego zdania wprost\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — ma pozytywny stosunek do Irenki<br>Narrator pisze o niej ciepło: „Gdyby nie ona, smutno byłoby w białym domu”, ma głowę „doskonale umeblowaną”.<\/details><br>\n6. Irenka jest osobą: *(3 pkt)*\n   - A) roztrzepaną\n   - B) nierozważną\n   - C) pogodną\n   - D) natrętną\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — pogodną<br>Irenka przegania smutek „krzykiem i czarodziejstwem śmiechu”, a smutek boi się jej „jak diabeł święconej wody” — jest radosna, pogodna. Pułapka B: jedna z jej „dusz” jest właśnie „rozważna”.<\/details><br>\n7. Ze zdania ***Irence przybyło trzy lata, a babce ubyło pięć*** wynika, że: *(3 pkt)*\n   - A) młodzi ludzie mają problemy z liczeniem\n   - B) starsi odejmują sobie lat\n   - C) akcja rozgrywa się w świecie fantastycznym\n   - D) osoba mówiąca nie wie wszystkiego\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — starsi odejmują sobie lat<br>Babcia przez trzy lata naprawdę się postarzała, ale mówi, że jest młodsza — to żart z tego, że starsze osoby lubią odmładzać się w rozmowie.<\/details><br>\n8. O Irence dowiadujemy się, że: *(3 pkt)*\n   - A) jest jak na swój wiek niezmiennie bardzo poważna i stateczna\n   - B) jest ruda\n   - C) jest chuda\n   - D) sprawia problemy domownikom\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — jest chuda<br>W tekście: „w chudym, czarnym, zdrowym ciele tej dziewczyny”. Pułapka B: „czarna” znaczy, że ma ciemne włosy, nie rude. Pułapka A: jej powaga czasem „pękała z hukiem”, więc nie jest niezmienna.<\/details><br>\n9. Ze zdania ***Gdyby nie ona, smutno byłoby w białym domu*** można wywnioskować, że: *(3 pkt)*\n   - A) rodzina ma jednak pewne kłopoty\n   - B) Irenka wdała się w swoją rodzinę\n   - C) Irenka jest pośmiewiskiem dla innych\n   - D) Irenka nie przejmuje się problemami rodziny\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — rodzina ma jednak pewne kłopoty<br>Skoro bez Irenki w domu byłoby smutno, to są powody do smutku — rodzina ma zmartwienia, a Irenka je rozprasza. Pułapka B: gdyby była taka jak rodzina, nie wyróżniałaby się radością.<\/details><br>\n10. Zdaniem Irenki: *(3 pkt)*\n    - A) problemy nie istnieją\n    - B) smutne myśli należy od siebie odegnać za wszelką cenę\n    - C) trzeba unikać smutnych ludzi\n    - D) wszystko trzeba dokładnie przemyśleć\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — smutne myśli należy od siebie odegnać za wszelką cenę<br>Irenka uważa, że „Najlepiej jest nie poddać się smętkowi i gnać go na cztery wiatry, póki czas”, bo inaczej smutek „rośnie bujnie jak chwast”.<\/details><br>\n\n## Pytania za 4 punkty\n\n11. Przywołane zdanie pana Podkówki: *(4 pkt)*\n    - A) jest sprzeczne z poglądami Irenki\n    - B) ma charakter humorystyczny\n    - C) jest maksymą, którą stara się kierować Irenka\n    - D) świadczy o niewielkiej mądrości jego autora\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest maksymą, którą stara się kierować Irenka<br>Maksyma to krótkie, mądre zdanie — wskazówka, jak żyć. „Stracony jest każdy dzień bez uśmiechu” pasuje do Irenki, która przegania smutek. Pułapka D: narrator nazywa je „złotym zdaniem” z „mądrej głowy”.<\/details><br>\n12. Ze zdania ***Trzeba tylko strasznie, z całej siły wierzyć, że będzie lepiej, a będzie lepiej*** wynika, że: *(4 pkt)*\n    - A) nie mamy wpływu na swój los\n    - B) nasz los zależy od naszego nastawienia\n    - C) los kpi z człowieka\n    - D) tylko pracą można do czegoś dojść\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — nasz los zależy od naszego nastawienia<br>Zdanie mówi: jeśli mocno wierzysz w lepsze jutro, to ono nadejdzie. Czyli to, jak się nastawiamy, wpływa na to, co nas spotka. Pułapka D: o pracy nie ma tu ani słowa.<\/details><br>\n13. Wypowiedzenie ***młodość bucha z niej jak żar ze słońca***: *(4 pkt)*\n    - A) zawiera porównanie\n    - B) należy rozumieć dosłownie\n    - C) zawiera epitety\n    - D) oznacza: starzeć się\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — zawiera porównanie<br>Porównanie zestawia dwie rzeczy za pomocą słów „jak”, „niby”, „jakby”: młodość bucha „jak żar ze słońca”. Epitet to określenie rzeczownika (np. „gorący żar”) — tu żadnego nie ma.<\/details><br>\n14. Podkreślone sformułowanie w wypowiedzeniu ***Wszelki smutek bał się jej <u>jak diabeł święconej wody<\/u>*** oznacza: *(4 pkt)*\n    - A) wcale\n    - B) bardzo\n    - C) mało\n    - D) w pewnych okolicznościach\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — bardzo<br>„Bać się czegoś jak diabeł święconej wody” to związek frazeologiczny: bardzo się czegoś bać, unikać za wszelką cenę.<\/details><br>\n15. Sformułowanie ***Radość jest sprawiedliwa, chociaż nierychliwa***: *(4 pkt)*\n    - A) jest przeróbką innego znanego powiedzonka\n    - B) ma pesymistyczny charakter\n    - C) stanowi smutną refleksję\n    - D) oznacza, że radość nigdy nie nadchodzi\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — jest przeróbką innego znanego powiedzonka<br>To przeróbka przysłowia „Pan Bóg nierychliwy, ale sprawiedliwy”. Znaczy: radość przychodzi powoli, ale na pewno przyjdzie — to myśl optymistyczna, więc B, C i D odpadają.<\/details><br>\n16. W zdaniu ***Irence przybyło trzy lata***: *(4 pkt)*\n    - A) jest jeden wyraz jednosylabowy\n    - B) są dwa wyrazy dwusylabowe\n    - C) są dwa wyrazy dwusylabowe\n    - D) jest jeden wyraz trzysylabowy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — jest jeden wyraz jednosylabowy<br>I-ren-ce (3 sylaby), przy-by-ło (3), trzy (1), la-ta (2). Jednosylabowy jest tylko „trzy”. Dwusylabowy jest jeden wyraz, a trzysylabowe są dwa. (Odpowiedzi B i C w arkuszu są takie same.)<\/details><br>\n17. Poprawnie podzielono na sylaby wyraz: *(4 pkt)*\n    - A) ub-yło\n    - B) podo-bnie\n    - C) sza-leń-stwo\n    - D) Iren-ka\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — sza-leń-stwo<br>Każda sylaba ma jedną samogłoskę: sza-leń-stwo. Pozostałe podziały są złe: u-by-ło (3 sylaby), po-dob-nie (3), I-ren-ka (3).<\/details><br>\n18. Głoska zapisywana za pomocą dwóch liter znajduje się w wyrazie: *(4 pkt)*\n    - A) zdrowym\n    - B) porządek\n    - C) nagle\n    - D) młodość\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — porządek<br>W „porządek” jest dwuznak „rz” — dwie litery, jedna głoska [ż]. Pułapka A: w „zdrowym” z i d to osobne głoski. W „młodość” ś i ć zapisano pojedynczymi literami.<\/details><br>\n19. Wyraz ***lepiej*** jest: *(4 pkt)*\n    - A) przymiotnikiem\n    - B) przyimkiem\n    - C) przysłówkiem\n    - D) zaimkiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — przysłówkiem<br>Przysłówek określa czasownik i odpowiada na pytanie jak? (będzie jak? lepiej). „Lepiej” to stopień wyższy przysłówka „dobrze”. Pułapka A: przymiotnik to „lepszy”.<\/details><br>\n20. W zdaniu ***Naturalny porządek rzeczy został zachowany***: *(4 pkt)*\n    - A) nie ma podmiotu\n    - B) mamy podmiot domyślny\n    - C) podmiot jest wyrażony rzeczownikiem\n    - D) podmiot nie jest wyrażony rzeczownikiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — podmiot jest wyrażony rzeczownikiem<br>Co zostało zachowane? — „porządek”. To rzeczownik w mianowniku.<\/details><br>\n\n## Pytania za 5 punktów\n\n21. Sformułowanie ***porządek rzeczy*** tworzą: *(5 pkt)*\n    - A) wyrazy należące do różnych części mowy\n    - B) rzeczowniki w tym samym przypadku\n    - C) rzeczowniki w mianowniku i bierniku\n    - D) rzeczowniki w różnych przypadkach\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — rzeczowniki w różnych przypadkach<br>Oba wyrazy to rzeczowniki. „Porządek” jest w mianowniku (kto? co?), a „rzeczy” w dopełniaczu (porządek czego? rzeczy). Pułapka C: to dopełniacz, nie biernik.<\/details><br>\n22. ***Świdrujące oczy*** to: *(5 pkt)*\n    - A) nieszczere spojrzenie\n    - B) oczy kłamcy\n    - C) przenikliwy wzrok\n    - D) tępe spojrzenie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — przenikliwy wzrok<br>Świder wierci dziury — świdrujące oczy „przewiercają” wzrokiem, widzą wszystko. Irenka nimi „umiała wypatrzyć smętek w najbardziej mrocznym kącie”.<\/details><br>\n23. W ostatnim zdaniu powyższego tekstu: *(5 pkt)*\n    - A) nie ma przenośni\n    - B) jest porównanie\n    - C) jest pięć orzeczeń\n    - D) jest jedno orzeczenie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest porównanie<br>Ostatnie zdanie kończy się porównaniem: głowa „tak zasobna w wiedzę jak ul w miody”. Orzeczenia są trzy: jeździła, przywoziła, posiada. Pułapka A: „głowa mokra… doskonale umeblowana” to przenośnia.<\/details><br>\n24. Podkreślony wyraz w zdaniu ***Nowe szaleństwo Irenki <u>napełniało<\/u> świat radosnym zgiełkiem***: *(5 pkt)*\n    - A) nie jest czasownikiem\n    - B) jest czasownikiem w formie nieosobowej\n    - C) nie ma funkcji orzeczenia\n    - D) jest czasownikiem w formie osobowej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — jest czasownikiem w formie osobowej<br>„Napełniało” to czasownik w 3. osobie liczby pojedynczej, czasie przeszłym, rodzaju nijakim (ono napełniało). Pokazuje osobę, więc jest w formie osobowej i jest orzeczeniem.<\/details><br>\n25. Wyraz ***zgiełk*** to: *(5 pkt)*\n    - A) rzeczownik\n    - B) przymiotnik\n    - C) przysłówek\n    - D) zaimek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — rzeczownik<br>Zgiełk to hałas, gwar. Odpowiada na pytanie co? i odmienia się przez przypadki (zgiełk, zgiełku, zgiełkiem) — to rzeczownik.<\/details><br>\n26. Czasownikiem w formie bezokolicznika jest wyraz: *(5 pkt)*\n    - A) przygotowując\n    - B) młodość\n    - C) stracony\n    - D) wypłoszyć\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — wypłoszyć<br>Bezokolicznik odpowiada na pytanie co robić? co zrobić? i kończy się na -ć, -c lub -ść: wypłoszyć. Pułapka B: „młodość” kończy się na -ść, ale to rzeczownik. „Przygotowując” i „stracony” to imiesłowy.<\/details><br>\n27. W zdaniu ***Irenka myślała o nim często***: *(5 pkt)*\n    - A) podmiot wyrażony jest zaimkiem\n    - B) mamy podmiot domyślny\n    - C) jest podmiot gramatyczny\n    - D) nie ma podmiotu\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest podmiot gramatyczny<br>Kto myślała? — „Irenka”: rzeczownik w mianowniku, czyli podmiot gramatyczny. Pułapka A: zaimkiem jest „nim”, ale to nie podmiot, tylko dopełnienie (o kim?).<\/details><br>\n28. W zdaniu ***Wtedy pytała wiatru, kto kogo przegoni***: *(5 pkt)*\n    - A) jest jedno orzeczenie\n    - B) są dwa orzeczenia\n    - C) orzeczenie wyrażone jest czasownikiem w formie nieosobowej\n    - D) nie ma orzeczenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — są dwa orzeczenia<br>Orzeczenie to czasownik w formie osobowej mówiący, co robi podmiot. Tu są dwa: „pytała” i „przegoni” — to zdanie złożone.<\/details><br>\n29. Więcej samogłosek niż spółgłosek znajduje się w wyrazie: *(5 pkt)*\n    - A) ona\n    - B) co\n    - C) nim\n    - D) miody\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — ona<br>O-n-a: dwie samogłoski (o, a), jedna spółgłoska (n). Pułapka D: w „miody” litera i tylko zmiękcza m, nie jest samogłoską — głoski to m′-o-d-y: dwie samogłoski i dwie spółgłoski.<\/details><br>\n30. W zdaniu ***Najlepiej jest nie poddać się smętkowi***: *(5 pkt)*\n    - A) jest przymiotnik w stopniu wyższym\n    - B) nie ma przymiotnika\n    - C) wszystkie czasowniki mają formę osobową\n    - D) nie ma rzeczownika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — nie ma przymiotnika<br>„Najlepiej” to przysłówek w stopniu najwyższym (dobrze – lepiej – najlepiej), a nie przymiotnik. Pułapka D: „smętkowi” to rzeczownik (smętek = smutek). Pułapka C: „poddać” to bezokolicznik.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. A — jest napisany prozą\n2. C — narrator\n3. D — nie uczestniczy w wydarzeniach\n4. B — charakterystyka Irenki\n5. A — ma pozytywny stosunek do Irenki\n6. C — pogodną\n7. B — starsi odejmują sobie lat\n8. C — jest chuda\n9. A — rodzina ma jednak pewne kłopoty\n10. B — smutne myśli należy od siebie odegnać za wszelką cenę\n11. C — jest maksymą, którą stara się kierować Irenka\n12. B — nasz los zależy od naszego nastawienia\n13. A — zawiera porównanie\n14. B — bardzo\n15. A — jest przeróbką innego znanego powiedzonka\n16. A — jest jeden wyraz jednosylabowy\n17. C — sza-leń-stwo\n18. B — porządek\n19. C — przysłówkiem\n20. C — podmiot jest wyrażony rzeczownikiem\n21. D — rzeczowniki w różnych przypadkach\n22. C — przenikliwy wzrok\n23. B — jest porównanie\n24. D — jest czasownikiem w formie osobowej\n25. A — rzeczownik\n26. D — wypłoszyć\n27. C — jest podmiot gramatyczny\n28. B — są dwa orzeczenia\n29. A — ona\n30. B — nie ma przymiotnika\n"}, {"path": "humanistyczny/klasa-5/testy-przeszle/alfik-2015.md", "id": "hum5/alfik-2015", "kind": "przeszly", "short": "Alfik 2015", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Alfik 2015\n\n<div class=\"test\" data-minuty=\"45\" data-start=\"30\"><\/div>\n\n**Oryginalny arkusz** XIX edycji konkursu Alfik Humanistyczny, klasa 5 szkoły podstawowej, 16 grudnia 2015.\nŹródło: [arkusz PDF](https://jersz.pl/wp-content/uploads/2020/08/DRUK-AHU_SP_5_2015.pdf) i [klucz odpowiedzi](https://jersz.pl/wp-content/uploads/2020/08/AHU_2015_klucz.pdf) na stronie organizatora, jersz.pl.\n30 pytań, 45 minut. Na start masz 30 pkt, za błędną odpowiedź tracisz ¼ punktów pytania.\nOdpowiedź E znaczy: żadna z odpowiedzi A–D nie jest poprawna. Wyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n## Tekst\n\n**Edmund Niziurski, _Siódme wtajemniczenie_ (fragment)**\n\n> Upłynęła jednak dłuższa chwila, zanim Partacz wszedł do sali zajęć. Wiedziałem, że ilekroć biedak ma przekroczyć próg naszej klasy, wzdryga się wewnętrznie na myśl, co go tym razem czeka, wzdycha ciężko i przeżywa moment pedagogicznej rozterki. Wszyscy mówili, że gdyby nie ów chroniczny nieżyt dróg oddechowych, Partacz dawno odszedłby do pracy w przemyśle. Ale podobno odstraszają go przeciągi fabryczne. Dlatego, chociaż się wzdryga wewnętrznie, jest zmuszony pracować w szkole.\n>\n> Tym razem jego rozterki duchowe trwały wyjątkowo długo, a westchnienie było tak potężne, że dało się słyszeć przez drzwi. Wszystko to wskazywało, że tego dnia Partacz był w gorszej niż zwykle formie. Przełamał się jednak i w końcu wszedł. W ręku trzymał kalosze. Od pewnego czasu zawsze wkraczał do klasy z kaloszami w ręku, doświadczenie nauczyło go, że nie należy kaloszy zostawiać w korytarzu i w ogóle nigdzie poza klasą. Miały one bowiem tę nieprzyjemną właściwość, że znikały, a mówiąc ściślej, zmieniały miejsce pobytu. Kiedy na przykład zostawiał je przy drzwiach, było niemal pewne, że odnajdzie je w ubikacji, a kiedy kładł je chytrze w kącie pod umywalką, odnajdywały się najniespodziewaniej pod kaloryferem albo na szafie, albo zgoła w szufladzie jego własnego stołu.\n>\n> Co najdziwniejsze, Partacz przez długi czas nie orientował się, na czym polega istota zjawiska, i składał wszystko na karb swojego roztargnienia i postępującego zaniku pamięci. Wreszcie pewnego razu Kowbojka poszła się wykąpać w nauczycielskiej łazience i przeżyła nieprzyjemny szok. Oto bowiem spostrzegła w wannie dwie czarne ryby, które po bliższym zbadaniu okazały się kaloszami pana Anielaka. Partacz i tym razem gotów był uwierzyć, że sam je włożył do wanny, ale Kowbojka odrzuciła stanowczo tę sugestię i orzekła, że ma się tu do czynienia z jeszcze jednym objawem złośliwości uczniów. Zarządziła z miejsca surowe śledztwo, które jednak nie dało żadnych wyników. Sprawa została następnie poruszona na specjalnej godzinie wychowawczej. Ale ani apele do sumienia młodzieży, ani groźby Kowbojki nie zdołały zlikwidować przykrego zjawiska, zapisanego w kronice szkolnej jako „fenomen kaloszy”. Kalosze znikały nadal, a sprawcy mimo zasadzek, jakie urządzał na nich woźny, pozostali niewykryci. W rezultacie pan Anielak zgorzkniał do reszty i uznał, że jedyne, co mu pozostaje, to zabierać kalosze z sobą do klasy, by mieć je stale na oku.\n>\n> Pozornie nic nie zapowiadało nowych złośliwości. Na widok wchodzącego Partacza wszyscy zastygli nieruchomo, każdy przy swoim warsztacie. Wszyscy z wyjątkiem małego Rymarskiego, który chodził na czworakach po sali i zaglądał zdenerwowany pod stoły.\n>\n> Partacz ulokował kalosze na widocznym miejscu pod tablicą, uwolnił szyję od szala, następnie przeczyścił gruntownie drogi oddechowe, wreszcie stanął za stołem i zmierzył podejrzliwym wzrokiem klasę. Wzorowa postawa młodzieży napełniła go nadzieją, że może tym razem lekcja przejdzie normalnie. Już miał odetchnąć zasadniczo, gdy wtem wzrok jego spoczął na Rymarskim.\n\n***Pamiętaj! Wszystkie pytania odnoszą się do powyższego tekstu!***\n\n## Pytania za 3 punkty\n\n1. Powyższy fragment tekstu można zaliczyć do: *(3 pkt)*\n   - A) literatury specjalistycznej\n   - B) publicystyki\n   - C) literatury pięknej\n   - D) poezji\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — literatury pięknej<br>To fragment powieści dla młodzieży — wymyślona historia z bohaterami i fabułą, czyli literatura piękna. Pułapka D: poezja to wiersze, a ten tekst jest napisany prozą.<\/details><br>\n2. W powyższym utworze możemy znaleźć: *(3 pkt)*\n   - A) narratora\n   - B) podmiot liryczny\n   - C) opis natury\n   - D) bohatera lirycznego\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — narratora<br>W utworze prozatorskim o wydarzeniach opowiada narrator („Wiedziałem, że…”). Podmiot liryczny i bohater liryczny występują w wierszach.<\/details><br>\n3. Przedstawiony tekst ma formę: *(3 pkt)*\n   - A) scenki\n   - B) opowiadania\n   - C) opisu\n   - D) dialogu\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — opowiadania<br>Narrator opowiada po kolei, co się działo: Partacz waha się, wchodzi z kaloszami, przypomina się historia „fenomenu kaloszy”. Nie ma tu rozmów bohaterów, więc to nie dialog ani scenka.<\/details><br>\n4. Charakter powyższej wypowiedzi można określić jako: *(3 pkt)*\n   - A) poważny\n   - B) żartobliwy\n   - C) dramatyczny\n   - D) nastrojowy\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — żartobliwy<br>Kalosze w wannie wzięte za „dwie czarne ryby”, nauczyciel noszący kalosze do klasy, „fenomen kaloszy” w kronice szkolnej — to wszystko jest zabawne.<\/details><br>\n5. Z kontekstu możemy wywnioskować, że miejscem akcji przedstawionej w powyższym tekście jest: *(3 pkt)*\n   - A) fabryka\n   - B) ulica\n   - C) urząd\n   - D) szkoła\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — szkoła<br>Partacz „jest zmuszony pracować w szkole”, wchodzi do klasy, jest woźny, godzina wychowawcza, kronika szkolna. Pułapka A: o fabryce jest tylko mowa, że Partacz wolałby tam pracować.<\/details><br>\n6. Osoba mówiąca: *(3 pkt)*\n   - A) ma obojętny stosunek do przedstawionych wydarzeń\n   - B) o wydarzeniach opowiada z lekkim rozbawieniem\n   - C) ma krytyczny stosunek do przedstawionych wydarzeń\n   - D) o wydarzeniach opowiada z oburzeniem\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — o wydarzeniach opowiada z lekkim rozbawieniem<br>Narrator nie potępia uczniów, tylko z humorem opisuje, jak kalosze „zmieniały miejsce pobytu” i trafiały do wanny.<\/details><br>\n7. Opowiadający: *(3 pkt)*\n   - A) bierze udział w wydarzeniach\n   - B) jest postacią spoza świata przedstawionego\n   - C) nie jest człowiekiem\n   - D) jest osobą dorosłą\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — bierze udział w wydarzeniach<br>Narrator mówi o „progu naszej klasy” — jest jednym z uczniów Partacza. Pułapka D: skoro jest uczniem, nie jest dorosły.<\/details><br>\n8. Wiedza osoby mówiącej na temat „fenomenu kaloszy” jest: *(3 pkt)*\n   - A) równa wiedzy wszystkich bohaterów\n   - B) mniejsza od wiedzy pana Anielaka\n   - C) większa od wiedzy niektórych bohaterów\n   - D) w zasadzie żadna (to znaczy – nie wie nic)\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — większa od wiedzy niektórych bohaterów<br>Narrator jako uczeń wie, że to sprawka uczniów, a Partacz długo myślał, że to jego roztargnienie, i nawet śledztwo nie wykryło sprawców.<\/details><br>\n9. Pan Anielak (Partacz) jest człowiekiem: *(3 pkt)*\n   - A) ponurym\n   - B) łatwowiernym\n   - C) refleksyjnym\n   - D) zapobiegliwym\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — łatwowiernym<br>Łatwowierny to taki, który łatwo we wszystko wierzy. Partacz „gotów był uwierzyć, że sam je włożył do wanny”. Pułapka D: noszenie kaloszy do klasy to trochę zapobiegliwość, ale tekst najmocniej podkreśla jego łatwowierność.<\/details><br>\n10. Zachowanie Partacza świadczy o tym, że: *(3 pkt)*\n    - A) lubi swoją pracę\n    - B) umie zapanować nad młodzieżą\n    - C) nie lubi tego, co robi\n    - D) jest typem silnej osobowości\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — nie lubi tego, co robi<br>Przed każdą lekcją „wzdryga się wewnętrznie” i „wzdycha ciężko”, a w szkole pracuje tylko z musu, bo „odstraszają go przeciągi fabryczne”.<\/details><br>\n\n## Pytania za 4 punkty\n\n11. Podkreślone sformułowanie: ***<u>Co najdziwniejsze,<\/u> Partacz przez długi czas nie orientował się, na czym polega istota zjawiska*** wyraża: *(4 pkt)*\n    - A) zachwyt osoby mówiącej\n    - B) zniecierpliwienie\n    - C) niedowierzanie\n    - D) złość\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — niedowierzanie<br>Narrator dziwi się, że nauczyciel tak długo nie odgadł, kto chowa mu kalosze — trudno mu w to uwierzyć.<\/details><br>\n12. Znajdujące się w zakończeniu powyższego fragmentu zdanie ***Pozornie nic nie zapowiadało nowych złośliwości*** sugeruje, że: *(4 pkt)*\n    - A) Partacz jest już bezpieczny\n    - B) ma dopiero nadejść\n    - C) wydarzenia właśnie się kończą\n    - D) zapanuje już spokój\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — ma dopiero nadejść<br>Słowo „pozornie” znaczy „tylko na pierwszy rzut oka” — czyli złośliwość dopiero nadejdzie. Zaraz potem wzrok Partacza pada na Rymarskiego, który chodzi na czworakach pod stołami.<\/details><br>\n13. Fakt, że Partacz ***zmierzył podejrzliwym wzrokiem klasę*** świadczy, że: *(4 pkt)*\n    - A) dba on o swój autorytet\n    - B) chce wzbudzić postrach\n    - C) jest człowiekiem niesympatycznym\n    - D) spodziewa się złośliwości ze strony uczniów\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — spodziewa się złośliwości ze strony uczniów<br>Podejrzliwy to taki, który podejrzewa, że ktoś coś knuje. Partacz po historii z kaloszami spodziewa się kolejnego psikusa.<\/details><br>\n14. Z kontekstu fragmentu możemy już wywnioskować, że ***wzorowa postawa młodzieży***: *(4 pkt)*\n    - A) jest wynikiem kultury osobistej uczniów\n    - B) wynika z szacunku do nauczyciela\n    - C) jest przysłowiową „ciszą przed burzą”\n    - D) od razu budzi nieufność nauczyciela\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest przysłowiową „ciszą przed burzą”<br>„Cisza przed burzą” to spokój, po którym przychodzi coś złego. Uczniowie siedzą grzecznie, ale tylko „pozornie”. Pułapka D: wzorowa postawa „napełniła go nadzieją”, a nie nieufnością.<\/details><br>\n15. Wyrażona nadzieja, że ***może tym razem lekcja przejdzie normalnie*** sugeruje, że podczas lekcji Partacza: *(4 pkt)*\n    - A) uczniowie często rozrabiają\n    - B) panuje na ogół spokój\n    - C) dyscyplina jest czymś normalnym\n    - D) uczniowie boją się odezwać\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — uczniowie często rozrabiają<br>Skoro Partacz ma nadzieję, że „tym razem” będzie normalnie, to zwykle normalnie nie jest — uczniowie broją.<\/details><br>\n16. Wypowiedzenie ***Upłynęła jednak dłuższa chwila, zanim Partacz wszedł do sali zajęć***: *(4 pkt)*\n    - A) jest zdaniem złożonym współrzędnie\n    - B) jest równoważnikiem zdania\n    - C) jest zdaniem złożonym podrzędnie\n    - D) jest zdaniem pojedynczym\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest zdaniem złożonym podrzędnie<br>Są dwa orzeczenia (upłynęła, wszedł), więc to zdanie złożone. Druga część zaczyna się od „zanim” i odpowiada na pytanie „kiedy upłynęła chwila?” — zależy od pierwszej, czyli zdanie jest złożone podrzędnie.<\/details><br>\n17. W tym samym zdaniu (pyt. 16.): *(4 pkt)*\n    - A) występuje jeden podmiot\n    - B) nie ma podmiotu\n    - C) są dwa podmioty\n    - D) pojawia się podmiot domyślny\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — są dwa podmioty<br>Co upłynęło? — „chwila”. Kto wszedł? — „Partacz”. Każde ze zdań składowych ma swój podmiot.<\/details><br>\n18. Wyraz ***dłuższa***: *(4 pkt)*\n    - A) należy do nieodmiennej części mowy\n    - B) jest przysłówkiem w stopniu równym\n    - C) jest przymiotnikiem w stopniu najwyższym\n    - D) jest przymiotnikiem w stopniu wyższym\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — jest przymiotnikiem w stopniu wyższym<br>Długi – dłuższy – najdłuższy. „Dłuższa” (chwila jaka?) to przymiotnik w stopniu wyższym. Stopień najwyższy zaczyna się od „naj-”.<\/details><br>\n19. Spójnikiem nie jest wyraz: *(4 pkt)*\n    - A) od\n    - B) że\n    - C) i\n    - D) ale\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — od<br>Spójnik łączy wyrazy lub zdania (i, ale, że, lecz, bo). „Od” to przyimek — stoi przed rzeczownikiem i łączy się z nim (od szala, od ściany).<\/details><br>\n20. W zdaniu ***Kaloszy nie było***: *(4 pkt)*\n    - A) podmiot wyrażony jest rzeczownikiem w mianowniku\n    - B) nie ma podmiotu\n    - C) podmiot nie jest wyrażony rzeczownikiem\n    - D) podmiot jest wyrażony rzeczownikiem w dopełniaczu\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — podmiot jest wyrażony rzeczownikiem w dopełniaczu<br>Zdanie twierdzące brzmiałoby „Kalosze były” — podmiotem są kalosze. Po zaprzeczeniu „nie było” rzeczownik przechodzi do dopełniacza (kogo? czego? — kaloszy). Uwaga: w szkole często uczy się, że podmiot jest zawsze w mianowniku, i wtedy takie zdanie nazywa się bezpodmiotowym (odpowiedź B); organizator uznał jednak podmiot w dopełniaczu.<\/details><br>\n\n## Pytania za 5 punktów\n\n21. Podkreślone sformułowanie: ***Miały one (kalosze) bowiem tę <u>nieprzyjemną właściwość,<\/u> że znikały*** można zastąpić formą: *(5 pkt)*\n    - A) walor\n    - B) wadę\n    - C) charakter\n    - D) sztukę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — wadę<br>Nieprzyjemna właściwość to cecha zła, czyli wada: „Miały one tę wadę, że znikały”. Pułapka A: walor to zaleta, czyli coś przeciwnego.<\/details><br>\n22. W sformułowaniu: ***pan Anielak <u>zgorzkniał<\/u>*** podkreślony wyraz oznacza w tym tekście: *(5 pkt)*\n    - A) zrobił się nie do wytrzymania\n    - B) stał się złośliwy\n    - C) bardzo posmutniał\n    - D) zaczął wierzyć we wszystko\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — bardzo posmutniał<br>Zgorzknieć to stać się rozgoryczonym, smutnym i zniechęconym po przykrych przeżyciach. Partacz po nieudanym śledztwie w sprawie kaloszy stracił nadzieję. Pułapka B: zgorzkniały człowiek bywa zgryźliwy, ale w tekście Partacz nikomu nie dokucza.<\/details><br>\n23. Określenie ***„fenomen kaloszy”*** zostało wzięte w cudzysłów ponieważ: *(5 pkt)*\n    - A) jest to cytat\n    - B) zostaje zasugerowane ironiczne znaczenie pojęcia\n    - C) to tytuł\n    - D) stało się terminem – nazwą zjawiska\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — stało się terminem – nazwą zjawiska<br>Sprawa została „zapisana w kronice szkolnej jako »fenomen kaloszy«” — tak nazwano to zjawisko w szkole. Cudzysłów wyróżnia tę nazwę.<\/details><br>\n24. Poprawność określenia ***nieprzyjemny szok*** można by zakwestionować, gdyż: *(5 pkt)*\n    - A) wyrazy mają odmienne znaczenie\n    - B) źle dopasowano formę gramatyczną\n    - C) „nie” z przymiotnikami piszemy oddzielnie\n    - D) szok sam w sobie jest doznaniem nieprzyjemnym – czyli znaczenie jednego wyrazu zawiera się już w drugim\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — szok sam w sobie jest doznaniem nieprzyjemnym – czyli znaczenie jednego wyrazu zawiera się już w drugim<br>Takie powtórzenie tej samej treści to pleonazm (jak „cofać się do tyłu”). Pułapka C: „nie” z przymiotnikami piszemy łącznie — „nieprzyjemny” jest zapisane dobrze.<\/details><br>\n25. Poprawność sformułowania ***zastygli nieruchomo*** można by zakwestionować, gdyż: *(5 pkt)*\n    - A) związek jest nielogiczny\n    - B) jeden wyraz powtarza znaczenie drugiego\n    - C) wyraz *zastygnąć* nie może odnosić się do istot żywych\n    - D) zły jest szyk wyrazów – powinno być nieruchomo zastygli\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jeden wyraz powtarza znaczenie drugiego<br>Zastygnąć znaczy znieruchomieć, więc „nieruchomo” niczego nie dodaje. To pleonazm, jak w pytaniu 24.<\/details><br>\n26. Czasownikiem w formie bezokolicznika nie jest wyraz: *(5 pkt)*\n    - A) złośliwość\n    - B) przekroczyć\n    - C) westchnąć\n    - D) zacząć\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — złośliwość<br>„Złośliwość” to rzeczownik (co? złośliwość), choć kończy się na -ść jak niektóre bezokoliczniki. Przekroczyć, westchnąć, zacząć to bezokoliczniki (co zrobić?).<\/details><br>\n27. Sformułowanie ***mieć coś na oku***: *(5 pkt)*\n    - A) oznacza *martwić się*\n    - B) jest niepoprawne\n    - C) ma znaczenie przenośne: obserwować\n    - D) oznacza: mieć słaby wzrok\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — ma znaczenie przenośne: obserwować<br>„Mieć coś na oku” to związek frazeologiczny: pilnować czegoś, nie spuszczać z oczu. Partacz chciał mieć kalosze stale przy sobie, żeby nie zniknęły.<\/details><br>\n28. W zdaniu ***Na widok wchodzącego Partacza wszyscy zastygli nieruchomo***: *(5 pkt)*\n    - A) orzeczeniem nie jest czasownik w formie osobowej\n    - B) podmiotem nie jest rzeczownik\n    - C) są dwa orzeczenia\n    - D) brakuje orzeczenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — podmiotem nie jest rzeczownik<br>Kto zastygł? — „wszyscy”. To zaimek, nie rzeczownik. Orzeczenie jest jedno: „zastygli” (czasownik w formie osobowej). Pułapka C: „wchodzącego” to imiesłów, nie orzeczenie.<\/details><br>\n29. Wyrazem jednosylabowym jest słowo: *(5 pkt)*\n    - A) jego\n    - B) chwila\n    - C) zanim\n    - D) czas\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — czas<br>Liczba sylab to liczba samogłosek. „Czas” ma jedną samogłoskę (a). Je-go, chwi-la, za-nim mają po dwie sylaby.<\/details><br>\n30. W wyrazie ***kalosze***: *(5 pkt)*\n    - A) jest tyle samo liter co głosek\n    - B) jest tyle samo spółgłosek co samogłosek\n    - C) są cztery spółgłoski\n    - D) są cztery samogłoski\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest tyle samo spółgłosek co samogłosek<br>Głoski: k-a-l-o-sz-e. Spółgłoski: k, l, sz (trzy), samogłoski: a, o, e (trzy). Pułapka A: liter jest 7, a głosek 6, bo „sz” to dwie litery, ale jedna głoska.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. C — literatury pięknej\n2. A — narratora\n3. B — opowiadania\n4. B — żartobliwy\n5. D — szkoła\n6. B — o wydarzeniach opowiada z lekkim rozbawieniem\n7. A — bierze udział w wydarzeniach\n8. C — większa od wiedzy niektórych bohaterów\n9. B — łatwowiernym\n10. C — nie lubi tego, co robi\n11. C — niedowierzanie\n12. B — ma dopiero nadejść\n13. D — spodziewa się złośliwości ze strony uczniów\n14. C — jest przysłowiową „ciszą przed burzą”\n15. A — uczniowie często rozrabiają\n16. C — jest zdaniem złożonym podrzędnie\n17. C — są dwa podmioty\n18. D — jest przymiotnikiem w stopniu wyższym\n19. A — od\n20. D — podmiot jest wyrażony rzeczownikiem w dopełniaczu\n21. B — wadę\n22. C — bardzo posmutniał\n23. D — stało się terminem – nazwą zjawiska\n24. D — szok sam w sobie jest doznaniem nieprzyjemnym – czyli znaczenie jednego wyrazu zawiera się już w drugim\n25. B — jeden wyraz powtarza znaczenie drugiego\n26. A — złośliwość\n27. C — ma znaczenie przenośne: obserwować\n28. B — podmiotem nie jest rzeczownik\n29. D — czas\n30. B — jest tyle samo spółgłosek co samogłosek\n"}, {"path": "humanistyczny/klasa-5/testy-przeszle/alfik-2014.md", "id": "hum5/alfik-2014", "kind": "przeszly", "short": "Alfik 2014", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Alfik 2014\n\n<div class=\"test\" data-minuty=\"45\" data-start=\"30\"><\/div>\n\n**Oryginalny arkusz** XVIII edycji konkursu Alfik Humanistyczny, klasa 5 szkoły podstawowej, 18 grudnia 2014.\nŹródło: [arkusz PDF](https://jersz.pl/wp-content/uploads/2020/08/AHU_SP_5_2015.pdf) i [klucz odpowiedzi](https://jersz.pl/wp-content/uploads/2020/08/AHU_2014_klucz.pdf) na stronie organizatora, jersz.pl.\n30 pytań, 45 minut. Na start masz 30 pkt, za błędną odpowiedź tracisz ¼ punktów pytania.\nOdpowiedź E znaczy: żadna z odpowiedzi A–D nie jest poprawna. Wyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n## Tekst\n\n**Kornel Makuszyński, _„Bezgrzeszne lata”_**\n\n> Już w klasie drugiej – same sztubaki – zagraliśmy *Zemstę*. Słowo honoru daję na to! (...) w najmilszym domu rodziców jednego z moich kolegów, głośnego dziś uczonego i profesora Uniwersytetu Lwowskiego, zagraliśmy *Zemstę*. Bogowie zapewne do dziś wspominają z rozrzewnieniem to boskie przedstawienie najlepszego w owym czasie zespołu teatralnego w tym mieście. Rozleciał się on z tego prostego powodu, żeśmy się wszyscy kochali w trzynastoletniej artystce, która grała Klarę, a ona (kobieta!) zdaje się, że wszystkim nam zawracała w głowie, co doprowadziło do małych niesnasek i wymiany zdań, po których zawsze wyborny odtwórca Wacława miał w garści kosmyk płowych włosów, wydartych z mądrej głowy Rejenta, ten zaś szukał odszkodowania na pałce Cześnika. Całemu towarzystwu groziło wyłysienie, wobec czego przekląwszy krwawym słowem uwodzicielkę, graliśmy jedynie sceny z *Kordiana* bez kobiet. Takiej prawdy wzruszenia nigdy już w życiu nie odczułem w teatrze. Dreszcz i zgroza przechodziły widzów (mama, siostra, kucharka i l
