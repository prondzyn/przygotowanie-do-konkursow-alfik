    <details><summary>rozwiązanie<\/summary>A — 13<br>Wszystkich „miejsc na lekcjach” jest 12 + 10 + 6 = 28. Dwóch uczniów zajmuje po 3 miejsca (razem 6), zostaje 22 miejsc dla uczniów z dwoma językami — to 22 : 2 = 11 uczniów. Razem 11 + 2 = 13.<\/details><br>\n30. Na stole leży 11 monet, wszystkie reszkami do góry. W każdym ruchu wybieramy dowolne 5 monet i odwracamy je. Jaka jest najmniejsza liczba ruchów pozwalająca odwrócić wszystkie monety orłami do góry? *(5 pkt)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) jest to niemożliwe\n    <details><summary>rozwiązanie<\/summary>B — 3<br>W 2 ruchach odwracamy tylko 10 razy, a każda z 11 monet musi być odwrócona choć raz — za mało. W 3 ruchach się da: monety X i Y odwracamy w każdym ruchu, a do nich dokładamy kolejno monety 1–3, 4–6, 7–9. X i Y są odwrócone 3 razy (kończą orłem), pozostałe po razie.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. E — 15 zł\n2. E — o 8 lat\n3. D — 6\n4. D — 12\n5. C — 2\n6. C — 9 cm\n7. D — 6\n8. D — 9\n9. E — 10\n10. C — 45\n11. B — 8\n12. A — 2 minuty\n13. E — 32\n14. A — 4\n15. D — 5\n16. B — 240\n17. D — 27\n18. B — 28\n19. A — 16\n20. B — 15\n21. B — w czwartek\n22. B — 4\n23. D — 9\n24. E — 36\n25. A — wtorkiem\n26. B — 5\n27. C — 8 zł\n28. D — 23\n29. A — 13\n30. B — 3\n", "dawne": "alfik-2016"}, {"path": "matematyczny/klasa-5/testy-przeszle/alfik-2015.md", "id": "mat5/alfik-2015", "kind": "przeszly", "short": "Alfik 2015", "sek": "mat5", "sekNazwa": "Matematyczny · kl. 5", "md": "# Alfik 2015\n\n<div class=\"test\" data-minuty=\"75\"><\/div>\n\n**Oryginalny arkusz** XXI edycji konkursu Alfik Matematyczny, klasa 5 szkoły podstawowej, 25 listopada 2015.\nŹródło: [arkusz PDF](https://jersz.pl/wp-content/uploads/2020/08/Zadania_ALFIK_2015_podstawowa_5.pdf) i [klucz odpowiedzi](https://jersz.pl/wp-content/uploads/2020/08/Klucz-ALFIK-2015-do-neta.pdf) na stronie organizatora, jersz.pl.\n30 zadań, 75 minut, za błędną odpowiedź −¼ punktów zadania. Wyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n## Zadania po 3 punkty\n\n1. Zegarmistrz zmontował zegar tak, że jego wskazówki przesuwają się z prawidłową prędkością, ale w odwrotnym kierunku („do tyłu”). Jeśli zegarmistrz ustawił prawidłowo zegar na godzinę 8:00, to którą godzinę zegar będzie wskazywał w południe? *(3 pkt)*\n   - A) 4:00\n   - B) 6:00\n   - C) 8:00\n   - D) 10:00\n   - E) 12:00\n   <details><summary>rozwiązanie<\/summary>A — 4:00<br>Od 8:00 do południa mijają 4 godziny. Zegar „cofa się”, więc zamiast pójść 4 godziny do przodu, cofnie się o 4 godziny: 8 − 4 = 4. Pokaże 4:00.<\/details><br>\n2. Kwadrat o boku 24 cm rozcięto na kwadraty o boku 4 cm. Ile kwadratów otrzymano? *(3 pkt)*\n   - A) 4\n   - B) 6\n   - C) 12\n   - D) 16\n   - E) 36\n   <details><summary>rozwiązanie<\/summary>E — 36<br>Wzdłuż jednego boku mieści się 24 : 4 = 6 małych kwadratów, więc jest 6 rzędów po 6 kwadratów: 6 · 6 = 36. Pułapka: odpowiedź 6 to tylko jeden rząd.<\/details><br>\n3. Jeśli pierwszy dzień pewnego miesiąca wypadł w środę, to w którym dniu miesiąca wypadła ostatnia niedziela tego miesiąca? *(3 pkt)*\n   - A) 26\n   - B) 27\n   - C) 28\n   - D) 29\n   - E) zależy od długości tego miesiąca\n   <details><summary>rozwiązanie<\/summary>A — 26<br>Środa 1., czwartek 2., piątek 3., sobota 4., niedziela 5. Kolejne niedziele to 12., 19., 26., a następna byłaby 33. — takiego dnia nie ma w żadnym miesiącu. Więc ostatnia niedziela to zawsze 26., niezależnie od długości miesiąca.<\/details><br>\n4. Ile białych pól ma szachownica o wymiarach 8×8? *(3 pkt)*\n   - A) 24\n   - B) 30\n   - C) 32\n   - D) 36\n   - E) 48\n   <details><summary>rozwiązanie<\/summary>C — 32<br>Szachownica ma 8 · 8 = 64 pola, a białych i czarnych jest po równo: 64 : 2 = 32.<\/details><br>\n5. Ile czasu trwał blok reklamowy składający się z trzynastu 30-sekundowych reklam i dziewięciu 10-sekundowych spotów? *(3 pkt)*\n   - A) 5 minut\n   - B) 6 minut\n   - C) 7 minut\n   - D) 8 minut\n   - E) 9 minut\n   <details><summary>rozwiązanie<\/summary>D — 8 minut<br>13 · 30 s = 390 s, 9 · 10 s = 90 s. Razem 480 s, a 480 : 60 = 8 minut.<\/details><br>\n6. Prostokąt o wymiarach 12 cm × 14 cm rozcięto na 21 jednakowych prostokątnych kawałków. Jakie jest pole każdego kawałka? *(3 pkt)*\n   - A) 6 cm²\n   - B) 8 cm²\n   - C) 10 cm²\n   - D) 12 cm²\n   - E) 14 cm²\n   <details><summary>rozwiązanie<\/summary>B — 8 cm²<br>Pole prostokąta to 12 · 14 = 168 cm². Dzielimy na 21 równych części: 168 : 21 = 8 cm².<\/details><br>\n7. Spośród trzech dodatnich liczb jednocyfrowych, druga liczba jest dwa razy większa niż pierwsza, a trzecia liczba jest trzy razy większa niż druga. Ile wynosi suma tych trzech liczb? *(3 pkt)*\n   - A) 6\n   - B) 8\n   - C) 9\n   - D) 10\n   - E) 12\n   <details><summary>rozwiązanie<\/summary>C — 9<br>Trzecia liczba jest 2 · 3 = 6 razy większa od pierwszej. Musi być jednocyfrowa, więc pierwsza to 1 (bo 6 · 2 = 12 ma już dwie cyfry). Liczby to 1, 2, 6, a ich suma to 9.<\/details><br>\n8. Za cztery lata Jacek będzie dokładnie dwa razy starszy niż rok temu. Ile lat ma Jacek? *(3 pkt)*\n   - A) 3\n   - B) 4\n   - C) 5\n   - D) 6\n   - E) 7\n   <details><summary>rozwiązanie<\/summary>D — 6<br>Między „rok temu” a „za cztery lata” mija 5 lat. Wiek się podwoił, więc rok temu Jacek miał 5 lat, a za cztery lata będzie miał 10. Teraz ma 6. Sprawdzenie: 6 + 4 = 10 = 2 · 5.<\/details><br>\n9. Jeśli 30 orzechów podzielimy po równo między Andrzeja i jego pięciu braci, to ile orzechów otrzyma każdy z nich? *(3 pkt)*\n   - A) 5\n   - B) 6\n   - C) 7\n   - D) 8\n   - E) 10\n   <details><summary>rozwiązanie<\/summary>A — 5<br>Andrzej i pięciu braci to 6 osób. 30 : 6 = 5. Pułapka: dzielenie przez 5 (zapominamy o Andrzeju) daje 6.<\/details><br>\n10. W ubiegłym tygodniu temperatura każdego dnia spadała o 2 stopnie. Jeśli w poniedziałek było 15°C, to w niedzielę było: *(3 pkt)*\n    - A) 1°C\n    - B) 2°C\n    - C) 3°C\n    - D) 4°C\n    - E) poniżej 0°C\n    <details><summary>rozwiązanie<\/summary>C — 3°C<br>Od poniedziałku do niedzieli jest 6 „przejść” na kolejny dzień: 6 · 2 = 12 stopni spadku. 15 − 12 = 3°C. Pułapka: liczenie 7 spadków zamiast 6.<\/details><br>\n\n## Zadania po 4 punkty\n\n11. Kasia rozmieniła posiadany banknot na cztery banknoty, a następnie każdy z otrzymanych banknotów rozmieniła na cztery monety. Banknot o jakim nominale Kasia miała na początku? *(4 pkt)*\n    - A) 10 zł\n    - B) 20 zł\n    - C) 50 zł\n    - D) 100 zł\n    - E) 200 zł\n    <details><summary>rozwiązanie<\/summary>C — 50 zł<br>Największa moneta to 5 zł, więc cztery monety dają najwyżej 20 zł. Zatem cztery mniejsze banknoty to dziesiątki lub dwudziestki (np. 10 zł = 5 + 2 + 2 + 1, 20 zł = 5 + 5 + 5 + 5). Cztery takie banknoty dają od 40 do 80 zł, a jedyny banknot w tym zakresie to 50 zł = 20 + 10 + 10 + 10.<\/details><br>\n12. Ile jest takich parzystych liczb dwucyfrowych, które są podzielne przez 9? *(4 pkt)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 8\n    - E) 9\n    <details><summary>rozwiązanie<\/summary>B — 5<br>Dwucyfrowe wielokrotności 9 to 18, 27, 36, 45, 54, 63, 72, 81, 90, 99. Parzyste z nich: 18, 36, 54, 72, 90 — jest ich 5.<\/details><br>\n13. Jeśli szerokość pewnego prostokąta zwiększymy o 3 cm, a długość zmniejszymy o 4 cm, to otrzymamy kwadrat o polu 25 cm². Jakie pole ma wyjściowy prostokąt? *(4 pkt)*\n    - A) 12 cm²\n    - B) 18 cm²\n    - C) 21 cm²\n    - D) 24 cm²\n    - E) 32 cm²\n    <details><summary>rozwiązanie<\/summary>B — 18 cm²<br>Kwadrat o polu 25 cm² ma bok 5 cm. Szerokość prostokąta była o 3 cm mniejsza: 2 cm, a długość o 4 cm większa: 9 cm. Pole: 2 · 9 = 18 cm².<\/details><br>\n14. Pani Marta zapłaciła za zakupy wręczając kasjerce trzy różne banknoty (żadne dwa z nich nie wystarczyły), a kasjerka wydała jej resztę w trzech jednakowych banknotach. Ile kosztowały zakupy? *(4 pkt)*\n    - A) 170 zł\n    - B) 220 zł\n    - C) 270 zł\n    - D) 290 zł\n    - E) 320 zł\n    <details><summary>rozwiązanie<\/summary>E — 320 zł<br>Banknoty to 10, 20, 50, 100, 200, 500 zł. Pasuje: pani Marta dała 200 + 100 + 50 = 350 zł i dostała resztę 3 · 10 zł = 30 zł, więc zakupy kosztowały 320 zł. Żadne dwa banknoty nie wystarczały (najwięcej 200 + 100 = 300 zł). Sprawdzenie wszystkich możliwości pokazuje, że żadna inna kwota z odpowiedzi nie da się tak uzyskać.<\/details><br>\n15. Na bal maskowy czterech kolegów przyszło w maskach. Najpierw pierwszy z drugim zamienili się maskami. Potem drugi z trzecim zamienili się maskami. Następnie trzeci z czwartym zamienili się maskami. Na końcu czwarty z pierwszym zamienili się maskami. Ilu chłopców po tych zamianach miało te maski, w których przyszli na bal? *(4 pkt)*\n    - A) 0\n    - B) 1\n    - C) 2\n    - D) 3\n    - E) 4\n    <details><summary>rozwiązanie<\/summary>B — 1<br>Oznaczmy maski 1, 2, 3, 4. Po kolejnych zamianach: (2, 1, 3, 4) → (2, 3, 1, 4) → (2, 3, 4, 1) → (1, 3, 4, 2). Swoją maskę ma tylko pierwszy chłopiec.<\/details><br>\n16. Akwarium pełne wody waży 100 kg, a puste waży 12 kg. Ile waży akwarium napełnione wodą do połowy? *(4 pkt)*\n    - A) 50 kg\n    - B) 54 kg\n    - C) 56 kg\n    - D) 60 kg\n    - E) 62 kg\n    <details><summary>rozwiązanie<\/summary>C — 56 kg<br>Sama woda waży 100 − 12 = 88 kg. Połowa wody to 44 kg, a z akwarium: 44 + 12 = 56 kg. Pułapka: 100 : 2 = 50 dzieli też szkło na pół.<\/details><br>\n17. Trójka dzieci pani Ani ma łącznie o 4 lata mniej niż ich mama. Kiedy pani Ania będzie mieć tyle lat co łącznie trójka jej dzieci? *(4 pkt)*\n    - A) za rok\n    - B) za 2 lata\n    - C) za 3 lata\n    - D) za 4 lata\n    - E) nigdy\n    <details><summary>rozwiązanie<\/summary>B — za 2 lata<br>Co roku mama starzeje się o 1 rok, a troje dzieci razem o 3 lata, więc różnica maleje o 2 lata rocznie. Różnica 4 lat zniknie po 4 : 2 = 2 latach.<\/details><br>\n18. 24-metrowy sznurek rozcięto na dwa kawałki, z których jeden był 3 razy dłuższy niż drugi. Jaką długość miał dłuższy kawałek? *(4 pkt)*\n    - A) 14 m\n    - B) 16 m\n    - C) 18 m\n    - D) 20 m\n    - E) 22 m\n    <details><summary>rozwiązanie<\/summary>C — 18 m<br>Krótszy kawałek to 1 część, dłuższy to 3 części — razem 4 części = 24 m. Jedna część to 6 m, a dłuższy kawałek 3 · 6 = 18 m.<\/details><br>\n19. Długość roku 2015 to 52 tygodnie i: *(4 pkt)*\n    - A) 1 dzień\n    - B) 2 dni\n    - C) 3 dni\n    - D) 4 dni\n    - E) 5 dni\n    <details><summary>rozwiązanie<\/summary>A — 1 dzień<br>Rok 2015 nie jest przestępny, ma 365 dni. 52 tygodnie to 52 · 7 = 364 dni, więc zostaje 1 dzień.<\/details><br>\n20. Dokładnie za rok Basia skończy tyle lat ile wynosi suma cyfr roku jej urodzenia. Ile lat ma Basia, jeśli wiemy, że jest jeszcze niepełnoletnia? *(4 pkt)*\n    - A) 7 lat\n    - B) 8 lat\n    - C) 9 lat\n    - D) 10 lat\n    - E) 11 lub więcej lat\n    <details><summary>rozwiązanie<\/summary>B — 8 lat<br>Konkurs był w 2015 roku, więc za rok jest rok 2016. Szukamy roku urodzenia 20_ _, dla którego 2016 − rok = suma cyfr. Dla 2007: 2016 − 2007 = 9 i 2 + 0 + 0 + 7 = 9 — pasuje. Za rok Basia skończy 9 lat, więc teraz ma 8. Inne lata (np. 1998–2015) nie pasują.<\/details><br>\n\n## Zadania po 5 punktów\n\n21. Zegar na wieży wybija każdą pełną godzinę (wykonując od 1 do 12 uderzeń – tyle ile wynosi numer godziny), a ponadto bije 1 raz pół godziny po każdej pełnej godzinie. Spotkanie w ratuszu rozpoczęło się, gdy zegar uderzył 1 raz i zakończyło się również wtedy, gdy zegar uderzył 1 raz. W trakcie spotkania słychać było jeszcze 21 innych uderzeń. Ile trwało spotkanie? *(5 pkt)*\n    - A) 2 godziny\n    - B) 3 godziny\n    - C) 4 godziny\n    - D) 5 godzin\n    - E) inna odpowiedź\n    <details><summary>rozwiązanie<\/summary>C — 4 godziny<br>Pojedyncze uderzenie słychać o każdej „wpół do” i o godzinie 1:00. Próbujemy różnych startów. Od 2:30 do 6:30 słychać: 3:00 (3), 3:30 (1), 4:00 (4), 4:30 (1), 5:00 (5), 5:30 (1), 6:00 (6) — razem 3 + 1 + 4 + 1 + 5 + 1 + 6 = 21 uderzeń. Pasuje też np. od 11:30 do 15:30: 12 + 1 + 1 + 1 + 2 + 1 + 3 = 21. Sprawdzenie wszystkich możliwości pokazuje, że spotkanie zawsze trwało 4 godziny.<\/details><br>\n22. W koszyku jest 12 kulek w czterech różnych kolorach: białym, zielonym, czerwonym i niebieskim. Kulek białych i zielonych razem jest tyle samo kulek czerwonych i niebieskich. Kulek białych jest o dwie więcej niż zielonych, a czerwonych jest o jedną mniej niż białych. Ile kulek niebieskich jest w tym koszyku? *(5 pkt)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>B — 3<br>Białych i zielonych jest razem połowa z 12, czyli 6. Białych jest o 2 więcej niż zielonych, więc białych 4, zielonych 2. Czerwonych jest o 1 mniej niż białych: 3. Niebieskich: 6 − 3 = 3.<\/details><br>\n23. Jaką cyfrę dziesiątek ma liczba dwucyfrowa, której iloczyn cyfr jest równy sumie cyfr? *(5 pkt)*\n    - A) 4\n    - B) 3\n    - C) 2\n    - D) 1\n    - E) nie ma takiej liczby\n    <details><summary>rozwiązanie<\/summary>C — 2<br>To liczba 22: 2 · 2 = 4 i 2 + 2 = 4. Sprawdzając wszystkie liczby dwucyfrowe, innej takiej nie ma (np. dla cyfry 1 iloczyn jest zawsze mniejszy od sumy).<\/details><br>\n24. Jacek ma dwa rodzaje szklanych kulek: małe i duże. Trzy duże kulki i jedna mała ważą tyle co cztery małe kulki i jedna duża. W takim razie cztery duże kulki ważą tyle co: *(5 pkt)*\n    - A) 5 małych\n    - B) 6 małych\n    - C) 7 małych\n    - D) 8 małych\n    - E) 9 małych\n    <details><summary>rozwiązanie<\/summary>B — 6 małych<br>Zdejmujemy z obu szalek po jednej dużej i jednej małej kulce: 2 duże ważą tyle co 3 małe. Podwajamy: 4 duże ważą tyle co 6 małych.<\/details><br>\n25. Trzecia lekcja zaczyna się o 9:45. O której kończy się ósma lekcja, jeśli każda lekcja trwa 45 minut, a każda przerwa – 10 minut? *(5 pkt)*\n    - A) 14:45\n    - B) 14:55\n    - C) 15:05\n    - D) 15:15\n    - E) 15:25\n    <details><summary>rozwiązanie<\/summary>C — 15:05<br>Od początku 3. do końca 8. lekcji jest 6 lekcji i 5 przerw między nimi: 6 · 45 + 5 · 10 = 270 + 50 = 320 minut = 5 h 20 min. 9:45 + 5 h 20 min = 15:05. Pułapka: doliczenie przerwy po ósmej lekcji.<\/details><br>\n26. Na pastwisku są krowy i gęsi, które łącznie mają 32 głowy i 100 nóg. Ile krów jest na tym pastwisku? *(5 pkt)*\n    - A) 12\n    - B) 14\n    - C) 16\n    - D) 18\n    - E) 20\n    <details><summary>rozwiązanie<\/summary>D — 18<br>Gdyby wszystkie 32 zwierzęta były gęśmi, miałyby 64 nogi. Brakuje 36 nóg, a każda krowa ma o 2 nogi więcej niż gęś: 36 : 2 = 18 krów. Sprawdzenie: 18 · 4 + 14 · 2 = 72 + 28 = 100.<\/details><br>\n27. Jacek, Wacek i Staszek mają łącznie 16 cukierków. Wiadomo przy tym, że Wacek ma o 1 cukierka więcej niż Jacek, a Staszek ma o 2 cukierki więcej niż Wacek. Ile cukierków mają łącznie Jacek i Wacek? *(5 pkt)*\n    - A) 8\n    - B) 9\n    - C) 10\n    - D) 11\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>B — 9<br>Wacek ma o 1 więcej niż Jacek, a Staszek o 3 więcej niż Jacek. Gdyby zabrać te nadwyżki (1 + 3 = 4), zostałoby 12 cukierków po równo: Jacek ma 4, Wacek 5, Staszek 7. Jacek i Wacek razem: 9.<\/details><br>\n28. Kasia ma cztery nietypowe sześcienne kostki do gry – każda z nich ma ściany opisane liczbami 1, 2, 4, 8, 16, 32 (każdą ścianę jedną liczbą). Kasia wykonała rzut tymi czterema kostkami i suma czterech liczb, które wypadły wyniosła 48. Która z poniższych liczb na pewno wypadła na jednej z kostek? *(5 pkt)*\n    - A) 2\n    - B) 4\n    - C) 8\n    - D) 16\n    - E) 32\n    <details><summary>rozwiązanie<\/summary>C — 8<br>Bez 16 i 32 cztery kostki dadzą najwyżej 4 · 8 = 32, za mało. Jeśli wypadło 32, pozostałe trzy kostki dają 16: tylko 8 + 4 + 4. Jeśli nie ma 32, to są szesnastki: 16 + 16 + 8 + 8. Są więc tylko dwa rozkłady (32, 8, 4, 4) i (16, 16, 8, 8) — w obu jest 8.<\/details><br>\n29. Na podłodze stoją trzy wiadra z wodą. W pierwszym i drugim jest łącznie 12 litrów wody, w drugim i trzecim jest łącznie 10 litrów, a w trzecim i pierwszym jest łącznie 16 litrów. Ile wody jest łącznie we wszystkich trzech wiadrach? *(5 pkt)*\n    - A) 18 litrów\n    - B) 19 litrów\n    - C) 24 litry\n    - D) 28 litrów\n    - E) 38 litrów\n    <details><summary>rozwiązanie<\/summary>B — 19 litrów<br>Dodając wszystkie trzy pary, każde wiadro liczymy dwa razy: 12 + 10 + 16 = 38 litrów to podwójna ilość wody. Wody jest więc 38 : 2 = 19 litrów. Pułapka: odpowiedź 38.<\/details><br>\n30. Jacek ma dwadzieścia kilka banknotów o nominałach 10 zł, 20 zł i 50 zł. Wiemy, że „dwudziestek” ma trzy razy tyle co „dziesiątek”, a łączna wartość jego „dwudziestek” jest taka sama jak wartość jego „pięćdziesiątek”. Ile pieniędzy ma Jacek? *(5 pkt)*\n    - A) 600 zł\n    - B) 650 zł\n    - C) 700 zł\n    - D) 750 zł\n    - E) 800 zł\n    <details><summary>rozwiązanie<\/summary>B — 650 zł<br>Dwudziestki są warte tyle co pięćdziesiątki, więc ich wartość dzieli się przez 100 (wspólna wielokrotność 20 i 50) — dwudziestek jest 5, 10, 15, … Jest ich 3 razy więcej niż dziesiątek, więc dwudziestek 15, dziesiątek 5, a pięćdziesiątek 300 : 50 = 6. Razem 26 banknotów („dwadzieścia kilka”). Kwota: 50 + 300 + 300 = 650 zł. Większa wersja (10, 30, 12) daje już 52 banknoty.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. A — 4:00\n2. E — 36\n3. A — 26\n4. C — 32\n5. D — 8 minut\n6. B — 8 cm²\n7. C — 9\n8. D — 6\n9. A — 5\n10. C — 3°C\n11. C — 50 zł\n12. B — 5\n13. B — 18 cm²\n14. E — 320 zł\n15. B — 1\n16. C — 56 kg\n17. B — za 2 lata\n18. C — 18 m\n19. A — 1 dzień\n20. B — 8 lat\n21. C — 4 godziny\n22. B — 3\n23. C — 2\n24. B — 6 małych\n25. C — 15:05\n26. D — 18\n27. B — 9\n28. C — 8\n29. B — 19 litrów\n30. B — 650 zł\n", "dawne": "alfik-2015"}, {"path": "matematyczny/klasa-5/testy-probne/test-1.md", "id": "mat5/test-1", "kind": "test", "short": "Test próbny 1", "sek": "mat5", "sekNazwa": "Matematyczny · kl. 5", "md": "# Test próbny 1\n\n<div class=\"test\" data-minuty=\"75\"><\/div>\n\n**Jak rozwiązywać:** 30 zadań, 75 minut — tak jak na prawdziwym Alfiku. W każdym zadaniu dokładnie jedna odpowiedź jest poprawna. Za brak odpowiedzi dostajesz 0 pkt, a za błędną odpowiedź tracisz ¼ punktów zadania (−0,75 / −1 / −1,25). Maksymalnie można zdobyć 120 pkt. Rada: zaznaczaj odpowiedź, gdy potrafisz odrzucić co najmniej 2 opcje — wtedy zgadywanie się opłaca.\n\n## Zadania po 3 punkty\n\n1. Film zaczął się o 17:45 i trwał 7 kwadransów. O której godzinie się skończył? *(3 pkt)*\n   - A) 18:45\n   - B) 19:00\n   - C) 19:15\n   - D) 19:30\n   - E) 19:45\n   <details><summary>rozwiązanie<\/summary>D — 19:30<br>Kwadrans to 15 minut, więc 7 kwadransów = 105 minut = 1 godzina 45 minut. 17:45 + 1 h = 18:45, a 18:45 + 45 min = 19:30.<\/details><br>\n2. Ile jest liczb dwucyfrowych, których suma cyfr wynosi 5? *(3 pkt)*\n   - A) 3\n   - B) 4\n   - C) 5\n   - D) 6\n   - E) więcej niż 6\n   <details><summary>rozwiązanie<\/summary>C — 5<br>Wypisujemy po kolei cyfrę dziesiątek 1, 2, 3, 4, 5: 14, 23, 32, 41, 50. To 5 liczb. Pułapka: łatwo zapomnieć o 50 (cyfra jedności może być zerem), a 05 nie jest liczbą dwucyfrową.<\/details><br>\n3. Kwadrat o boku 6 cm rozcięto na jeden kwadrat o boku 3 cm i pewną liczbę kwadracików o boku 1 cm. Ile części otrzymano? *(3 pkt)*\n   - A) 27\n   - B) 28\n   - C) 30\n   - D) 32\n   - E) 36\n   <details><summary>rozwiązanie<\/summary>B — 28<br>Duży kwadrat ma pole 36 cm², kwadrat 3 cm ma pole 9 cm². Zostaje 36 − 9 = 27 cm², czyli 27 kwadracików 1 cm. Razem z kwadratem 3 cm to 27 + 1 = 28 części. Pułapka: nie zapomnij doliczyć dużego kawałka.<\/details><br>\n4. Szachownica ma 5 wierszy i 7 kolumn, a jej pole w lewym górnym rogu jest białe. Ile białych pól ma ta szachownica? *(3 pkt)*\n   - A) 14\n   - B) 15\n   - C) 16\n   - D) 17\n   - E) 18\n   <details><summary>rozwiązanie<\/summary>E — 18<br>Wszystkich pól jest 5 · 7 = 35, liczba nieparzysta, więc jednego koloru jest o 1 więcej. Wszystkie cztery rogi mają ten sam kolor co lewy górny (biały), a kolor rogów „wygrywa”. Zatem białych jest 18, a czarnych 17.<\/details><br>\n5. Ola ma w skarbonce tylko dwuzłotówki i pięciozłotówki — razem 9 monet o łącznej wartości 30 zł. Ile pięciozłotówek ma Ola? *(3 pkt)*\n   - A) 3\n   - B) 4\n   - C) 5\n   - D) 6\n   - E) 7\n   <details><summary>rozwiązanie<\/summary>B — 4<br>Gdyby wszystkie 9 monet były dwuzłotówkami, byłoby 18 zł. Brakuje 12 zł. Zamiana jednej dwuzłotówki na pięciozłotówkę dodaje 3 zł, więc trzeba zamienić 12 : 3 = 4 monety. Sprawdzenie: 4 · 5 + 5 · 2 = 20 + 10 = 30 zł.<\/details><br>\n6. Tata jest dziś 4 razy starszy od Kuby, a razem mają 45 lat. Ile lat ma Kuba? *(3 pkt)*\n   - A) 9\n   - B) 10\n   - C) 11\n   - D) 12\n   - E) 15\n   <details><summary>rozwiązanie<\/summary>A — 9<br>Wiek Kuby to 1 część, wiek taty to 4 takie części — razem 5 części = 45 lat. Jedna część to 45 : 5 = 9. Kuba ma 9 lat, tata 36.<\/details><br>\n7. W koszyku są 4 jabłka czerwone, 6 zielonych i 7 żółtych. Ile co najmniej jabłek trzeba wyjąć z zamkniętymi oczami, aby mieć pewność, że wśród wyjętych są dwa jabłka tego samego koloru? *(3 pkt)*\n   - A) 2\n   - B) 3\n   - C) 4\n   - D) 7\n   - E) 8\n   <details><summary>rozwiązanie<\/summary>C — 4<br>Najgorszy przypadek: pierwsze trzy jabłka są w trzech różnych kolorach. Czwarte musi już powtórzyć któryś kolor, bo kolorów są tylko trzy. Liczby 4, 6, 7 nie mają tu znaczenia.<\/details><br>\n8. Ile jest liczb trzycyfrowych podzielnych przez 25? *(3 pkt)*\n   - A) 35\n   - B) 36\n   - C) 37\n   - D) 39\n   - E) 40\n   <details><summary>rozwiązanie<\/summary>B — 36<br>W każdej setce są 4 takie liczby (np. 100, 125, 150, 175). Setek z liczbami trzycyfrowymi jest 9 (od 100 do 999), więc razem 9 · 4 = 36.<\/details><br>\n9. Z 27 jednakowych sześciennych klocków zbudowano sześcian 3×3×3 i pomalowano całą jego powierzchnię na zielono. Ile klocków ma pomalowane dokładnie dwie ściany? *(3 pkt)*\n   - A) 6\n   - B) 8\n   - C) 9\n   - D) 10\n   - E) 12\n   <details><summary>rozwiązanie<\/summary>E — 12<br>Dwie pomalowane ściany mają klocki leżące na krawędzi dużego sześcianu, ale nie w rogu. Sześcian ma 12 krawędzi, a na każdej jest dokładnie 1 taki klocek (środkowy). Pułapka: 8 klocków w rogach ma pomalowane aż trzy ściany.<\/details><br>\n10. Suma siedmiu kolejnych liczb naturalnych wynosi 77. Jaka jest największa z tych liczb? *(3 pkt)*\n    - A) 11\n    - B) 13\n    - C) 14\n    - D) 15\n    - E) 17\n    <details><summary>rozwiązanie<\/summary>C — 14<br>Środkowa (czwarta) liczba to średnia: 77 : 7 = 11. Liczby to 8, 9, 10, 11, 12, 13, 14 — największa to 14.<\/details><br>\n\n## Zadania po 4 punkty\n\n11. W piątek Ola powiedziała: „Przedwczoraj minęło dokładnie 17 dni od moich urodzin”. W jakim dniu tygodnia były urodziny Oli? *(4 pkt)*\n    - A) w niedzielę\n    - B) w poniedziałek\n    - C) we wtorek\n    - D) w sobotę\n    - E) w piątek\n    <details><summary>rozwiązanie<\/summary>A — w niedzielę<br>Przedwczoraj (dwa dni przed piątkiem) była środa. 17 dni to 2 pełne tygodnie i jeszcze 3 dni. Cofając się 2 tygodnie, znów trafiamy na środę, a 3 dni wcześniej: wtorek, poniedziałek, <b>niedziela<\/b>.<\/details><br>\n12. Liczba palindromiczna czytana od lewej i od prawej wygląda tak samo, np. 474. Ile jest trzycyfrowych liczb palindromicznych podzielnych przez 5? *(4 pkt)*\n    - A) 5\n    - B) 9\n    - C) 10\n    - D) 18\n    - E) 20\n    <details><summary>rozwiązanie<\/summary>C — 10<br>Liczba podzielna przez 5 kończy się na 0 lub 5. Na 0 nie może, bo wtedy zaczynałaby się od 0. Zostają liczby postaci 5_5, a w środku może stać dowolna z 10 cyfr: 505, 515, …, 595.<\/details><br>\n13. W klasie jest 28 uczniów. Psa ma 17 z nich, kota ma 12, a 4 uczniów nie ma ani psa, ani kota. Ilu uczniów ma i psa, i kota? *(4 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>E — 5<br>Zwierzę ma 28 − 4 = 24 uczniów. Gdy dodamy 17 + 12 = 29, to osoby mające oba zwierzęta policzyliśmy dwa razy. Nadwyżka 29 − 24 = 5 to właśnie liczba uczniów z psem i kotem.<\/details><br>\n14. Z 20 zapałek, każda długości 1 cm, ułożono prostokąt, który nie jest kwadratem (wykorzystano wszystkie zapałki, żadnej nie łamiąc). Jakie największe pole może mieć ten prostokąt? *(4 pkt)*\n    - A) 9 cm²\n    - B) 16 cm²\n    - C) 21 cm²\n    - D) 24 cm²\n    - E) 25 cm²\n    <details><summary>rozwiązanie<\/summary>D — 24 cm²<br>Obwód to 20 cm, więc dwa sąsiednie boki mają razem 10 cm: 1+9, 2+8, 3+7, 4+6 lub 5+5. Pola: 9, 16, 21, 24, 25. Kwadrat 5×5 jest wykluczony, więc największe pole to 4 · 6 = 24 cm². Pułapka: 25 cm² daje kwadrat.<\/details><br>\n15. Ile jest liczb trzycyfrowych, których iloczyn cyfr jest równy 12? *(4 pkt)*\n    - A) 6\n    - B) 9\n    - C) 12\n    - D) 15\n    - E) 18\n    <details><summary>rozwiązanie<\/summary>D — 15<br>Trzy cyfry o iloczynie 12 to: 1, 2, 6 albo 1, 3, 4 albo 2, 2, 3. Trzy różne cyfry można ustawić na 6 sposobów, a cyfry 2, 2, 3 tylko na 3 sposoby (223, 232, 322). Razem 6 + 6 + 3 = 15.<\/details><br>\n16. Pociąg jedzie ze stałą prędkością 90 km/h. Ile metrów przejeżdża w ciągu jednej minuty? *(4 pkt)*\n    - A) 1500\n    - B) 1800\n    - C) 5400\n    - D) 9000\n    - E) 90 000\n    <details><summary>rozwiązanie<\/summary>A — 1500<br>W godzinę (60 minut) pociąg pokonuje 90 km = 90 000 m. W minutę: 90 000 : 60 = 1500 m. Pułapka: 5400 wychodzi, gdy pomnożymy 90 · 60 zamiast dzielić.<\/details><br>\n17. Ile wszystkich kwadratów (dowolnej wielkości, złożonych z całych pól) można wskazać na planszy 4×4? *(4 pkt)*\n    - A) 16\n    - B) 30\n    - C) 32\n    - D) 36\n    - E) 40\n    <details><summary>rozwiązanie<\/summary>B — 30<br>Kwadratów 1×1 jest 16, kwadratów 2×2 jest 3 · 3 = 9, kwadratów 3×3 jest 2 · 2 = 4 i jest 1 kwadrat 4×4. Razem 16 + 9 + 4 + 1 = 30.<\/details><br>\n18. Kot i pies ważą razem 15 kg, pies i królik — 19 kg, a kot i królik — 8 kg. Ile waży pies? *(4 pkt)*\n    - A) 9 kg\n    - B) 11 kg\n    - C) 12 kg\n    - D) 13 kg\n    - E) 14 kg\n    <details><summary>rozwiązanie<\/summary>D — 13 kg<br>Dodajmy wszystkie trzy ważenia: 15 + 19 + 8 = 42 kg — każde zwierzę zważyliśmy dwa razy. Więc wszystkie trzy razem ważą 21 kg. Kot i królik to 8 kg, zatem pies waży 21 − 8 = 13 kg.<\/details><br>\n19. W miejsce każdej gwiazdki w zapisie 1 * 2 * 3 * 4 * 5 * 6 * 7 = 14 wstawiamy znak „+” albo „−” tak, aby otrzymać prawdziwą równość. Ile najwięcej minusów można wstawić? *(4 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) nie da się otrzymać takiej równości\n    <details><summary>rozwiązanie<\/summary>B — 2<br>Same plusy dają 28. Zmiana „+” na „−” przed liczbą zmniejsza wynik o dwa razy tę liczbę. Musimy zmniejszyć o 28 − 14 = 14, więc liczby z minusem muszą mieć sumę 7. Można: 7 albo 2 + 5 albo 3 + 4. Trzech liczb się nie da, bo najmniejsze 2 + 3 + 4 = 9. Np. 1 + 2 − 3 − 4 + 5 + 6 + 7 = 14.<\/details><br>\n20. Pewna liczba naturalna mniejsza od 30 przy dzieleniu przez 4 daje resztę 3, a przy dzieleniu przez 5 daje resztę 4. Jaka to liczba? *(4 pkt)*\n    - A) 19\n    - B) 23\n    - C) 24\n    - D) 27\n    - E) 29\n    <details><summary>rozwiązanie<\/summary>A — 19<br>Reszta 4 przy dzieleniu przez 5 oznacza, że liczba kończy się na 4 lub 9: 4, 9, 14, 19, 24, 29. Reszta 3 przy dzieleniu przez 4: 4 → 0, 9 → 1, 14 → 2, <b>19 → 3<\/b>, 24 → 0, 29 → 1. Sztuczka: taka liczba jest o 1 mniejsza od wielokrotności 4 i 5, czyli 20 − 1 = 19.<\/details><br>\n\n## Zadania po 5 punktów\n\n21. W pewnym miesiącu dokładnie trzy niedziele wypadły w dni o numerach parzystych. Jakim dniem tygodnia był 20. dzień tego miesiąca? *(5 pkt)*\n    - A) poniedziałkiem\n    - B) wtorkiem\n    - C) środą\n    - D) czwartkiem\n    - E) piątkiem\n    <details><summary>rozwiązanie<\/summary>D — czwartkiem<br>Niedziele co 7 dni na zmianę wypadają w dni parzyste i nieparzyste. Aby parzyste były aż trzy, musi być 5 niedziel, i to pierwsza, trzecia i piąta parzysta: 2, 9, 16, 23, 30. Skoro 16. to niedziela, to 17. poniedziałek, 18. wtorek, 19. środa, 20. <b>czwartek<\/b>.<\/details><br>\n22. Mama ma 36 lat, a jej trzy córki mają 3, 6 i 9 lat. Za ile lat mama będzie miała tyle lat, ile jej trzy córki razem? *(5 pkt)*\n    - A) 3\n    - B) 5\n    - C) 6\n    - D) 7\n    - E) 9\n    <details><summary>rozwiązanie<\/summary>E — 9<br>Teraz córki mają razem 18 lat, czyli o 18 mniej niż mama. Co roku mama starzeje się o 1 rok, a córki razem o 3 lata, więc różnica maleje o 2 lata rocznie. 18 : 2 = 9 lat. Sprawdzenie: mama 45, córki 12 + 15 + 18 = 45.<\/details><br>\n23. W turnieju szachowym każdy uczestnik zagrał z każdym innym dokładnie jedną partię. Rozegrano 28 partii. Ilu było uczestników? *(5 pkt)*\n    - A) 8\n    - B) 9\n    - C) 14\n    - D) 16\n    - E) 28\n    <details><summary>rozwiązanie<\/summary>A — 8<br>Przy 8 graczach każdy gra 7 partii: 8 · 7 = 56, ale każdą partię liczymy wtedy dwa razy (raz dla każdego gracza), więc partii jest 56 : 2 = 28. Dla 9 graczy byłoby 9 · 8 : 2 = 36.<\/details><br>\n24. W pudełku jest 20 kulek: czerwone, zielone i niebieskie. Wśród dowolnych 13 kulek z tego pudełka zawsze jest co najmniej jedna czerwona, wśród dowolnych 14 — co najmniej jedna zielona, a wśród dowolnych 16 — co najmniej jedna niebieska. Ile jest zielonych kulek? *(5 pkt)*\n    - A) 5\n    - B) 6\n    - C) 7\n    - D) 8\n    - E) nie da się tego ustalić\n    <details><summary>rozwiązanie<\/summary>C — 7<br>Skoro każde 13 kulek zawiera czerwoną, to kulek „nieczerwonych” jest najwyżej 12, czyli czerwonych co najmniej 8. Tak samo: zielonych co najmniej 20 − 13 = 7, niebieskich co najmniej 20 − 15 = 5. Ale 8 + 7 + 5 = 20, więc wszystko jest „na styk”: jest dokładnie 8 czerwonych, 7 zielonych i 5 niebieskich.<\/details><br>\n25. Kasia ma 15 monet: złotówki, dwuzłotówki i pięciozłotówki — razem 40 zł. Złotówek ma tyle samo, co dwuzłotówek. Ile ma pięciozłotówek? *(5 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>E — 5<br>Złotówkę i dwuzłotówkę połączmy w „parę” wartą 3 zł. Liczba monet w parach jest parzysta, więc pięciozłotówek jest nieparzyście wiele. Próbujemy: 5 pięciozłotówek = 25 zł, zostaje 10 monet = 5 par = 15 zł; razem 40 zł. Pasuje! (3 pięciozłotówki dają 15 + 6 · 3 = 33 zł, 7 dają 35 + 4 · 3 = 47 zł.)<\/details><br>\n26. Z czterech jednakowych prostokątów o wymiarach 2 cm × 5 cm ułożono (bez nakładania) „wiatraczek” — kwadrat z kwadratową dziurą w środku, jak na rysunku. Jakie pole ma dziura? *(5 pkt)* <svg width=\"140\" height=\"140\" viewBox=\"0 0 140 140\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"1\" y=\"1\" width=\"99\" height=\"39\"/><rect x=\"100\" y=\"1\" width=\"39\" height=\"99\"/><rect x=\"40\" y=\"100\" width=\"99\" height=\"39\"/><rect x=\"1\" y=\"40\" width=\"39\" height=\"99\"/><\/svg>\n    - A) 9 cm²\n    - B) 10 cm²\n    - C) 16 cm²\n    - D) 25 cm²\n    - E) 40 cm²\n    <details><summary>rozwiązanie<\/summary>A — 9 cm²<br>Bok dużego kwadratu to 5 + 2 = 7 cm, więc jego pole to 49 cm². Cztery prostokąty mają razem 4 · 10 = 40 cm². Na dziurę zostaje 49 − 40 = 9 cm². (Bok dziury to 5 − 2 = 3 cm.)<\/details><br>\n27. Ile liczb spośród 1, 2, 3, …, 100 dzieli się przez 3 lub przez 5? *(5 pkt)*\n    - A) 20\n    - B) 33\n    - C) 41\n    - D) 45\n    - E) 47\n    <details><summary>rozwiązanie<\/summary>E — 47<br>Przez 3 dzieli się 33 liczby (3, 6, …, 99), przez 5 — 20 liczb. Ale liczby podzielne przez obie (czyli przez 15: 15, 30, 45, 60, 75, 90 — jest ich 6) policzyliśmy dwa razy. 33 + 20 − 6 = 47.<\/details><br>\n28. Na wyspie mieszkają rycerze, którzy zawsze mówią prawdę, i kłamcy, którzy zawsze kłamią. Przy okrągłym stole usiadło 7 mieszkańców wyspy i każdy z nich powiedział: „Obaj moi sąsiedzi są kłamcami”. Ilu najwięcej rycerzy mogło siedzieć przy tym stole? *(5 pkt)*\n    - A) 0\n    - B) 1\n    - C) 2\n    - D) 3\n    - E) 4\n    <details><summary>rozwiązanie<\/summary>D — 3<br>Obok rycerza siedzą sami kłamcy, więc dwóch rycerzy nie może siedzieć obok siebie. Przy 7 miejscach w kółku da się tak posadzić najwyżej 3 rycerzy (4 wymagałoby 8 miejsc). Sprawdzamy układ R K R K R K K: każdy kłamca ma obok co najmniej jednego rycerza, więc jego zdanie jest fałszywe — wszystko się zgadza.<\/details><br>\n29. Zapisano obok siebie wszystkie liczby od 1 do 60 i powstał długi ciąg cyfr: 123456789101112…5960. Jaka cyfra stoi na 50. miejscu? *(5 pkt)*\n    - A) 0\n    - B) 2\n    - C) 3\n    - D) 5\n    - E) 9\n    <details><summary>rozwiązanie<\/summary>C — 3<br>Liczby 1–9 zajmują 9 miejsc. Do 50. miejsca brakuje jeszcze 41 cyfr. Liczby dwucyfrowe mają po 2 cyfry: 20 liczb (10, 11, …, 29) zajmuje 40 miejsc, czyli miejsca 10–49. Miejsce 50 to pierwsza cyfra liczby 30, czyli <b>3<\/b>.<\/details><br>\n30. Ile co najmniej liczb trzeba wybrać spośród 1, 2, 3, …, 20, aby mieć pewność, że wśród wybranych są dwie liczby o sumie 21? *(5 pkt)*\n    - A) 10\n    - B) 11\n    - C) 12\n    - D) 19\n    - E) 20\n    <details><summary>rozwiązanie<\/summary>B — 11<br>Podzielmy liczby na 10 par o sumie 21: (1, 20), (2, 19), …, (10, 11) — to nasze „szufladki”. Można wybrać 10 liczb bez takiej pary (np. 1, 2, …, 10). Ale 11 liczb w 10 szufladkach — dwie muszą trafić do tej samej pary, a ich suma to 21.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. D — 19:30\n2. C — 5\n3. B — 28\n4. E — 18\n5. B — 4\n6. A — 9\n7. C — 4\n8. B — 36\n9. E — 12\n10. C — 14\n11. A — w niedzielę\n12. C — 10\n13. E — 5\n14. D — 24 cm²\n15. D — 15\n16. A — 1500\n17. B — 30\n18. D — 13 kg\n19. B — 2\n20. A — 19\n21. D — czwartkiem\n22. E — 9\n23. A — 8\n24. C — 7\n25. E — 5\n26. A — 9 cm²\n27. E — 47\n28. D — 3\n29. C — 3\n30. B — 11\n", "dawne": "test-1"}, {"path": "matematyczny/klasa-5/testy-probne/test-2.md", "id": "mat5/test-2", "kind": "test", "short": "Test próbny 2", "sek": "mat5", "sekNazwa": "Matematyczny · kl. 5", "md": "# Test próbny 2\n\n<div class=\"test\" data-minuty=\"75\"><\/div>\n\n**Jak rozwiązywać:** 30 zadań, 75 minut — ten test jest odrobinę trudniejszy od pierwszego. W każdym zadaniu dokładnie jedna odpowiedź jest poprawna. Za brak odpowiedzi dostajesz 0 pkt, a za błędną odpowiedź tracisz ¼ punktów zadania (−0,75 / −1 / −1,25). Maksymalnie można zdobyć 120 pkt. Rada: zaznaczaj odpowiedź, gdy potrafisz odrzucić co najmniej 2 opcje.\n\n## Zadania po 3 punkty\n\n1. Jaki kąt tworzą wskazówki zegara dokładnie o godzinie 4:00 (bierzemy mniejszy z dwóch kątów)? *(3 pkt)*\n   - A) 120°\n   - B) 130°\n   - C) 140°\n   - D) 150°\n   - E) 240°\n   <details><summary>rozwiązanie<\/summary>A — 120°<br>Tarcza zegara (360°) jest podzielona na 12 godzin, więc między sąsiednimi cyframi jest 360° : 12 = 30°. O 4:00 wskazówka minutowa stoi na 12, a godzinowa na 4 — dzielą je 4 „godziny”, czyli 4 · 30° = 120°. Pułapka: 240° to większy kąt, po drugiej stronie.<\/details><br>\n2. Ile jest liczb dwucyfrowych, w których cyfra dziesiątek jest większa od cyfry jedności? *(3 pkt)*\n   - A) 36\n   - B) 45\n   - C) 50\n   - D) 54\n   - E) 55\n   <details><summary>rozwiązanie<\/summary>B — 45<br>Gdy cyfra dziesiątek to 1, jedności może być tylko 0 (1 liczba); gdy 2 — 0 lub 1 (2 liczby); … ; gdy 9 — od 0 do 8 (9 liczb). Razem 1 + 2 + … + 9 = 45.<\/details><br>\n3. Kwadrat o obwodzie 24 cm rozcięto na dwa jednakowe prostokąty. Jaki obwód ma każdy z tych prostokątów? *(3 pkt)*\n   - A) 18 cm\n   - B) 20 cm\n   - C) 24 cm\n   - D) 30 cm\n   - E) 36 cm\n   <details><summary>rozwiązanie<\/summary>A — 18 cm<br>Bok kwadratu to 24 : 4 = 6 cm. Każdy prostokąt ma wymiary 6 cm × 3 cm, więc jego obwód to 6 + 3 + 6 + 3 = 18 cm. Pułapka: obwód nie dzieli się na pół — połowa z 24 to 12, a to nieprawda.<\/details><br>\n4. W pewnym roku 1 marca był wtorkiem. Jakim dniem tygodnia był 1 kwietnia tego roku? *(3 pkt)*\n   - A) czwartkiem\n   - B) piątkiem\n   - C) sobotą\n   - D) niedzielą\n   - E) poniedziałkiem\n   <details><summary>rozwiązanie<\/summary>B — piątkiem<br>Marzec ma 31 dni = 4 tygodnie i 3 dni. 1 kwietnia jest więc 3 dni tygodnia „dalej” niż 1 marca: wtorek → środa → czwartek → <b>piątek<\/b>.<\/details><br>\n5. Ile jest liczb trzycyfrowych, które zapisuje się wyłącznie cyframi nieparzystymi? *(3 pkt)*\n   - A) 25\n   - B) 75\n   - C) 125\n   - D) 243\n   - E) 500\n   <details><summary>rozwiązanie<\/summary>C — 125<br>Cyfry nieparzyste to 1, 3, 5, 7, 9 — jest ich 5. Na każde z trzech miejsc (setki, dziesiątki, jedności) wybieramy jedną z 5 cyfr: 5 · 5 · 5 = 125. Zero nie jest nieparzyste, więc nie ma problemu z setkami.<\/details><br>\n6. Trzy jabłka ważą tyle co dwie gruszki, a cztery gruszki ważą tyle co jeden melon. Ile jabłek waży tyle co dwa melony? *(3 pkt)*\n   - A) 12\n   - B) 16\n   - C) 18\n   - D) 24\n   - E) 32\n   <details><summary>rozwiązanie<\/summary>A — 12<br>Dwa melony = 8 gruszek. Dwie gruszki to 3 jabłka, więc 8 gruszek (czyli 4 razy po 2 gruszki) to 4 · 3 = 12 jabłek.<\/details><br>\n7. Ile co najmniej osób musi być w grupie, aby mieć pewność, że jakieś trzy z nich urodziły się w tym samym miesiącu? *(3 pkt)*\n   - A) 13\n   - B) 24\n   - C) 25\n   - D) 36\n   - E) 37\n   <details><summary>rozwiązanie<\/summary>C — 25<br>Miesięcy jest 12. W najgorszym razie w każdym miesiącu urodziły się po 2 osoby — to 24 osoby i jeszcze nie ma trójki. 25. osoba musi „dołożyć się” do któregoś miesiąca, w którym są już dwie.<\/details><br>\n8. Ile wynosi 100 − 99 + 98 − 97 + 96 − 95 + … + 4 − 3 + 2 − 1? *(3 pkt)*\n   - A) 0\n   - B) 1\n   - C) 25\n   - D) 49\n   - E) 50\n   <details><summary>rozwiązanie<\/summary>E — 50<br>Grupujemy w pary: (100 − 99) + (98 − 97) + … + (2 − 1). Każda para daje 1, a par jest 100 : 2 = 50. Wynik: 50.<\/details><br>\n9. W każde pole szachownicy 8×8 wpisano iloczyn numeru jej wiersza i numeru kolumny (wiersze i kolumny numerujemy od 1 do 8). W ilu polach wpisano liczbę parzystą? *(3 pkt)*\n   - A) 16\n   - B) 32\n   - C) 36\n   - D) 48\n   - E) 56\n   <details><summary>rozwiązanie<\/summary>D — 48<br>Iloczyn jest nieparzysty tylko wtedy, gdy oba czynniki są nieparzyste. Nieparzystych numerów jest 4 (1, 3, 5, 7), więc pól z liczbą nieparzystą jest 4 · 4 = 16. Pozostałe 64 − 16 = 48 pól ma liczbę parzystą.<\/details><br>\n10. Ile dzielników ma liczba 36 (licząc 1 i 36)? *(3 pkt)*\n    - A) 9\n    - B) 10\n    - C) 12\n    - D) 18\n    - E) 36\n    <details><summary>rozwiązanie<\/summary>A — 9<br>Szukamy par liczb, których iloczyn to 36: 1·36, 2·18, 3·12, 4·9, 6·6. Daje to dzielniki 1, 2, 3, 4, 6, 9, 12, 18, 36 — jest ich 9. Pułapka: 6 występuje w parze dwa razy, ale liczymy je raz.<\/details><br>\n\n## Zadania po 4 punkty\n\n11. W pewnym miesiącu było pięć poniedziałków i pięć śród, ale tylko cztery niedziele. Jakim dniem tygodnia był 25. dzień tego miesiąca? *(4 pkt)*\n    - A) poniedziałkiem\n    - B) wtorkiem\n    - C) środą\n    - D) czwartkiem\n    - E) piątkiem\n    <details><summary>rozwiązanie<\/summary>D — czwartkiem<br>Miesiąc ma 4 pełne tygodnie (28 dni) plus 0–3 dni „nadwyżki” — tylko dni z nadwyżki występują 5 razy. Muszą to być poniedziałek i środa, a więc też wtorek pomiędzy nimi: miesiąc ma 31 dni i zaczyna się w poniedziałek. Wtedy poniedziałki to 1, 8, 15, 22, 29, a 25. to <b>czwartek<\/b>.<\/details><br>\n12. Gdy Ala się urodziła, jej mama miała 27 lat. W tym roku Ala i mama mają razem 53 lata. Ile lat ma Ala? *(4 pkt)*\n    - A) 13\n    - B) 14\n    - C) 26\n    - D) 27\n    - E) 40\n    <details><summary>rozwiązanie<\/summary>A — 13<br>Mama jest zawsze o 27 lat starsza. Gdyby odjąć te 27 lat od sumy, zostałoby 53 − 27 = 26 — to dwa razy wiek Ali. Ala ma 26 : 2 = 13 lat, a mama 40.<\/details><br>\n13. Liczba palindromiczna czytana od lewej i od prawej wygląda tak samo, np. 3773. Ile jest czterocyfrowych liczb palindromicznych podzielnych przez 9? *(4 pkt)*\n    - A) 5\n    - B) 6\n    - C) 8\n    - D) 9\n    - E) 10\n    <details><summary>rozwiązanie<\/summary>E — 10<br>Taki palindrom ma postać abba, a jego suma cyfr to 2 · (a + b). Musi dzielić się przez 9, więc a + b = 9 lub a + b = 18. Dla a + b = 9 mamy 9 liczb: 1881, 2772, 3663, 4554, 5445, 6336, 7227, 8118, 9009. Dla a + b = 18 jest 9999. Razem 10. Pułapka: łatwo pominąć 9009 albo 9999.<\/details><br>\n14. Prostokąt ma obwód 30 cm, a jeden jego bok jest dwa razy dłuższy od drugiego. Jakie jest pole tego prostokąta? *(4 pkt)*\n    - A) 45 cm²\n    - B) 50 cm²\n    - C) 54 cm²\n    - D) 56 cm²\n    - E) 60 cm²\n    <details><summary>rozwiązanie<\/summary>B — 50 cm²<br>Połowa obwodu to 15 cm — tyle mają razem krótszy i dłuższy bok. Krótszy to 1 część, dłuższy 2 części, razem 3 części = 15 cm, więc krótszy bok ma 5 cm, a dłuższy 10 cm. Pole: 5 · 10 = 50 cm².<\/details><br>\n15. Na zwykłej kostce do gry suma oczek na przeciwległych ścianach wynosi 7. Trzy takie kostki postawiono na stole jedna na drugiej, tworząc wieżę. Obchodząc wieżę dookoła, widzimy jej górną ścianę i wszystkie ściany boczne (nie widać ścian, którymi kostki stykają się ze sobą i ze stołem). Ile najwięcej oczek łącznie możemy zobaczyć? *(4 pkt)*\n    - A) 42\n    - B) 45\n    - C) 47\n    - D) 48\n    - E) 63\n    <details><summary>rozwiązanie<\/summary>D — 48<br>Kostka ma razem 1 + 2 + … + 6 = 21 oczek. Góra i dół każdej kostki to para przeciwległych ścian, czyli 7 oczek, więc cztery ściany boczne mają zawsze 21 − 7 = 14 oczek. Trzy kostki dają 3 · 14 = 42 oczka z boków, a na górze wieży może być najwyżej 6. Razem 48.<\/details><br>\n16. Na ile sposobów można zapłacić dokładnie 10 zł, używając monet 1 zł, 2 zł i 5 zł (liczy się tylko to, ile monet każdego rodzaju użyjemy)? *(4 pkt)*\n    - A) 8\n    - B) 10\n    - C) 11\n    - D) 12\n    - E) 15\n    <details><summary>rozwiązanie<\/summary>B — 10<br>Bez piątek: dwuzłotówek może być 0, 1, 2, 3, 4 lub 5 (resztę dopłacamy złotówkami) — 6 sposobów. Z jedną piątką zostaje 5 zł: 0, 1 lub 2 dwuzłotówki — 3 sposoby. Dwie piątki — 1 sposób. Razem 6 + 3 + 1 = 10.<\/details><br>\n17. Z szachownicy 8×8 wycięto dwa przeciwległe pola narożne (lewe górne i prawe dolne). Ile najwięcej kostek domino 1×2 (każda zakrywa dokładnie dwa sąsiednie pola) można położyć na pozostałej części bez nakładania? *(4 pkt)*\n    - A) 28\n    - B) 29\n    - C) 30\n    - D) 31\n    - E) 32\n    <details><summary>rozwiązanie<\/summary>C — 30<br>Przeciwległe narożniki mają ten sam kolor, więc zostały 32 pola jednego koloru i 30 drugiego. Każde domino zakrywa jedno pole białe i jedno czarne, więc kostek może być najwyżej 30. I 30 rzeczywiście da się ułożyć. Pułapka: 31 = 62 : 2 wydaje się oczywiste, ale jest niemożliwe.<\/details><br>\n18. Suma dziesięciu kolejnych liczb naturalnych wynosi 245. Jaka jest największa z tych liczb? *(4 pkt)*\n    - A) 24\n    - B) 25\n    - C) 26\n    - D) 27\n    - E) 29\n    <details><summary>rozwiązanie<\/summary>E — 29<br>Połączmy liczby w pary: najmniejsza z największą, druga z przedostatnią itd. Każda z 5 par ma tę samą sumę: 245 : 5 = 49. Najmniejsza i największa różnią się o 9, więc to 20 i 29. Sprawdzenie: 20 + 21 + … + 29 = 245.<\/details><br>\n19. Jaka jest najmniejsza liczba większa od 1, która przy dzieleniu przez 2, przez 3, przez 4, przez 5 i przez 6 daje za każdym razem resztę 1? *(4 pkt)*\n    - A) 31\n    - B) 41\n    - C) 49\n    - D) 59\n    - E) 61\n    <details><summary>rozwiązanie<\/summary>E — 61<br>Liczba o 1 mniejsza musi dzielić się przez 2, 3, 4, 5 i 6. Najmniejsza taka liczba to 60 (dzieli się przez 4 i przez 3 i przez 5). Szukana liczba to 60 + 1 = 61. Pułapka: 31 daje resztę 3 przy dzieleniu przez 4.<\/details><br>\n20. Ktoś zjadł ciastko. Adam powiedział: „To nie ja”. Bartek: „To Czarek”. Czarek: „To Darek”. Darek: „Czarek kłamie”. Wiadomo, że ciastko zjadł jeden z nich i że prawdę powiedział tylko jeden chłopiec. Kto zjadł ciastko? *(4 pkt)*\n    - A) Adam\n    - B) Bartek\n    - C) Czarek\n    - D) Darek\n    - E) nie da się tego ustalić\n    <details><summary>rozwiązanie<\/summary>A — Adam<br>Czarek i Darek mówią przeciwne rzeczy, więc dokładnie jeden z nich mówi prawdę. Skoro prawdomówny jest tylko jeden, to Adam i Bartek kłamią. Kłamstwo Adama („To nie ja”) oznacza, że zjadł je właśnie <b>Adam<\/b>. Sprawdzenie: Bartek i Czarek kłamią, prawdę mówi tylko Darek.<\/details><br>\n\n## Zadania po 5 punktów\n\n21. W pewnym roku nieprzestępnym dokładnie trzy miesiące zaczęły się w niedzielę. Jakim dniem tygodnia był 1 stycznia tego roku? *(5 pkt)*\n    - A) poniedziałkiem\n    - B) wtorkiem\n    - C) środą\n    - D) czwartkiem\n    - E) piątkiem\n    <details><summary>rozwiązanie<\/summary>D — czwartkiem<br>Liczymy, o ile dni tygodnia „przesuwa się” pierwszy dzień każdego miesiąca względem 1 stycznia (styczeń 31 dni = przesunięcie o 3, luty 28 dni = 0 itd.). Luty, marzec i listopad zaczynają się wtedy w tym samym dniu tygodnia, 3 dni po 1 stycznia — i to jedyna trójka (pozostałe dni tygodnia są początkiem najwyżej dwóch miesięcy). Skoro to niedziela, to 1 stycznia był 3 dni wcześniej: <b>czwartek<\/b>.<\/details><br>\n22. Gdy na końcu pewnej liczby dwucyfrowej dopiszemy cyfrę 3, otrzymamy liczbę trzycyfrową większą od niej o 552. Jaka jest suma cyfr tej liczby dwucyfrowej? *(5 pkt)*\n    - A) 5\n    - B) 6\n    - C) 7\n    - D) 8\n    - E) 9\n    <details><summary>rozwiązanie<\/summary>C — 7<br>Dopisanie 3 na końcu to pomnożenie liczby przez 10 i dodanie 3. Nowa liczba jest więc o „9 razy liczba + 3” większa. Zatem 9 razy liczba = 552 − 3 = 549, czyli liczba to 549 : 9 = 61. Sprawdzenie: 613 − 61 = 552. Suma cyfr: 6 + 1 = 7.<\/details><br>\n23. Ile jest wszystkich prostokątów (wliczając kwadraty) złożonych z całych pól, które można wskazać na planszy o wymiarach 2×4 (2 wiersze, 4 kolumny)? *(5 pkt)*\n    - A) 8\n    - B) 20\n    - C) 30\n    - D) 36\n    - E) 40\n    <details><summary>rozwiązanie<\/summary>C — 30<br>Prostokąt wyznaczamy, wybierając jego wysokość i szerokość. W pionie: 1 wiersz (2 sposoby) albo oba wiersze (1 sposób) — 3 możliwości. W poziomie: 1 kolumna (4 sposoby), 2 kolumny obok siebie (3), 3 kolumny (2), 4 kolumny (1) — 10 możliwości. Razem 3 · 10 = 30.<\/details><br>\n24. W szufladzie leży 20 skarpetek czarnych, 20 białych i 20 szarych. Ile co najmniej skarpetek trzeba wyjąć po ciemku, aby mieć pewność, że można z nich ułożyć dwie pary (para to dwie skarpetki tego samego koloru)? *(5 pkt)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 7\n    - E) 8\n    <details><summary>rozwiązanie<\/summary>C — 6<br>Pięć skarpetek nie wystarczy: np. 3 czarne, 1 biała, 1 szara to tylko jedna para. Sześć wystarcza: w każdym kolorze najwyżej jedna skarpetka zostaje bez pary. Gdyby bez pary zostały 3 (po jednej z każdego koloru), to w parach byłyby 3 skarpetki — a to niemożliwe, bo w parach jest zawsze parzyście wiele skarpetek. Więc bez pary zostają najwyżej 2, a w parach są co najmniej 4 skarpetki, czyli 2 pary. Pułapka: przy dwóch kolorach wystarczyłoby 5.<\/details><br>\n25. Dziadek ma dziś tyle lat, ile wszystkie jego wnuki razem. Za 6 lat wnuki będą miały łącznie o 30 lat więcej niż dziadek. Ilu wnuków ma dziadek? *(5 pkt)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>D — 6<br>Za 6 lat dziadek będzie o 6 lat starszy, a każde wnuczę też o 6 lat. Gdy wnuków jest n, ich suma wieku wzrośnie o 6 · n. Różnica 30 lat bierze się z tego, że wnuki „dostały” o 30 lat więcej niż dziadek: 6 · n − 6 = 30, więc 6 · n = 36 i n = 6.<\/details><br>\n26. Prostokąt podzielono dwoma odcinkami (jednym poziomym i jednym pionowym) na cztery mniejsze prostokąty. Lewy górny ma pole 12 cm², prawy górny — 18 cm², a lewy dolny — 30 cm². Jakie pole ma prawy dolny prostokąt? *(5 pkt)*\n    - A) 36 cm²\n    - B) 40 cm²\n    - C) 42 cm²\n    - D) 45 cm²\n    - E) 48 cm²\n    <details><summary>rozwiązanie<\/summary>D — 45 cm²<br>Górne prostokąty mają tę samą wysokość, więc prawy górny jest 18 : 12 = 1,5 raza szerszy od lewego górnego. Dolne prostokąty też mają wspólną wysokość i te same szerokości co górne, więc prawy dolny jest 1,5 raza większy od lewego dolnego: 30 · 1,5 = 45 cm². Np. kolumny 2 cm i 3 cm, wiersze 6 cm i 15 cm.<\/details><br>\n27. Skoczek szachowy porusza się „literą L”: o 2 pola w jednym kierunku (poziomo lub pionowo) i o 1 pole w bok. Stoi w lewym dolnym rogu szachownicy 8×8. Ile najmniej ruchów potrzebuje, aby dotrzeć do prawego górnego rogu? *(5 pkt)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>E — 6<br>Skoczek musi przesunąć się o 7 pól w prawo i 7 w górę — razem 14 kratek, a jeden ruch daje najwyżej 3, więc trzeba co najmniej 5 ruchów. Ale każdy ruch zmienia kolor pola, a oba rogi mają ten sam kolor — liczba ruchów musi być parzysta, więc co najmniej 6. Sześć wystarcza, np. a1 → b3 → c5 → d7 → f8 → g6 → h8.<\/details><br>\n28. Ile jest liczb czterocyfrowych zapisanych tylko cyframi 1 i 2 (każda może występować dowolnie wiele razy), które są podzielne przez 4? *(5 pkt)*\n    - A) 2\n    - B) 4\n    - C) 6\n    - D) 8\n    - E) 16\n    <details><summary>rozwiązanie<\/summary>B — 4<br>Liczba dzieli się przez 4, gdy liczba utworzona z dwóch ostatnich cyfr dzieli się przez 4. Z cyfr 1 i 2 możemy mieć końcówki 11, 12, 21, 22 — przez 4 dzieli się tylko 12. Dwie pierwsze cyfry są dowolne: 2 · 2 = 4 możliwości (1112, 1212, 2112, 2212).<\/details><br>\n29. Zapisano ciąg: 1, 2, 2, 3, 3, 3, 4, 4, 4, 4, … — każda liczba n powtarza się n razy. Jaka liczba stoi na 100. miejscu tego ciągu? *(5 pkt)*\n    - A) 13\n    - B) 14\n    - C) 15\n    - D) 16\n    - E) 50\n    <details><summary>rozwiązanie<\/summary>B — 14<br>Liczby od 1 do n zajmują 1 + 2 + … + n miejsc. Dla n = 13 to 13 · 14 : 2 = 91 miejsc, a dla n = 14 to 105 miejsc. Miejsca od 92. do 105. zajmuje liczba 14, więc na 100. miejscu stoi <b>14<\/b>.<\/details><br>\n30. W rzędzie stoi 10 osób. Każda jest rycerzem (zawsze mówi prawdę) albo kłamcą (zawsze kłamie). Każda z nich powiedziała: „Na prawo ode mnie stoi więcej kłamców niż rycerzy”. Ilu rycerzy jest w tym rzędzie? *(5 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>E — 5<br>Zacznijmy od prawego końca. Ostatni nie ma nikogo po prawej (0 kłamców to nie więcej niż 0 rycerzy), więc kłamie — jest kłamcą. Przedostatni ma po prawej 1 kłamcę, więc mówi prawdę — rycerz. Trzeci od końca ma po prawej 1 kłamcę i 1 rycerza, więc kłamie. I tak dalej: osoby na zmianę są kłamcami i rycerzami, więc w 10 osobach jest 5 rycerzy.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. A — 120°\n2. B — 45\n3. A — 18 cm\n4. B — piątkiem\n5. C — 125\n6. A — 12\n7. C — 25\n8. E — 50\n9. D — 48\n10. A — 9\n11. D — czwartkiem\n12. A — 13\n13. E — 10\n14. B — 50 cm²\n15. D — 48\n16. B — 10\n17. C — 30\n18. E — 29\n19. E — 61\n20. A — Adam\n21. D — czwartkiem\n22. C — 7\n23. C — 30\n24. C — 6\n25. D — 6\n26. D — 45 cm²\n27. E — 6\n28. B — 4\n29. B — 14\n30. E — 5\n", "dawne": "test-2"}]</script>

<script>
(function () {
  const PAGES = JSON.parse(document.getElementById('pages').textContent);
  const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
  const byPath = Object.fromEntries(PAGES.map(p => [p.path, p]));
  const content = document.getElementById('content');
  const chips = document.getElementById('chips');
  const wynik = document.getElementById('wynik');
  const resetbox = document.getElementById('resetbox');
  const nav = document.getElementById('nav');
  let timerId = null;

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };

  const dawne = Object.fromEntries(PAGES.filter(p => p.dawne).map(p => [p.dawne, p.id]));
  for (const p of PAGES.filter(p => p.dawne)) {
    for (const k of ['postep:', 'test:', 'historia:']) {
      const v = store.get(k + p.dawne, null);
      if (v !== null && store.get(k + p.id, null) === null) store.set(k + p.id, v);
      if (v !== null) store.del(k + p.dawne);
    }
  }

  // Pasek: na stronie klasy okruszek z nazwą klasy i jej strony informacyjne.
  function renderNav(cur) {
    nav.innerHTML = '';
    if (!cur.sek) return;
    const mk = (p, txt, cls) => { const a = document.createElement('a'); a.href = '#' + p.id; a.textContent = txt; if (cls) a.className = cls; return a; };
    const info = PAGES.filter(p => p.sek === cur.sek && p.kind === 'info');
    const start = info.find(p => p.id === cur.sek + '/start');
    if (start) nav.append(mk(start, cur.sekNazwa, 'sek'));
    info.filter(p => p !== start).forEach(p => nav.append(mk(p, p.short)));
  }

  // Menu na stronie głównej: każdy nagłówek w <div class="menu"> z listą pod nim to jedna karta.
  function menuCards() {
    content.querySelectorAll('.menu').forEach(m => {
      [...m.querySelectorAll(':scope > h2')].forEach(h => {
        const sec = document.createElement('section');
        h.before(sec);
        let el = h;
        while (el && (el === h || el.tagName !== 'H2')) { const nx = el.nextElementSibling; sec.append(el); el = nx; }
      });
      m.querySelectorAll('li').forEach(li => {
        const a = li.querySelector('a');
        if (!a) return;
        const rest = [...li.childNodes].filter(n => n !== a);
        const opis = document.createElement('span'); opis.className = 'opis';
        rest.forEach(n => opis.append(n));
        if (opis.textContent.trim()) li.append(opis);
        if (/^\s*wkrótce\s*$/i.test(opis.textContent)) li.classList.add('wkrotce');
      });
    });
  }

  function slug(t) {
    return t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');
  }
  function resolve(base, rel) {
    const out = [];
    for (const p of (base + rel).split('/')) {
      if (p === '..') out.pop(); else if (p && p !== '.') out.push(p);
    }
    return out.join('/');
  }
  function hashKey(s) {
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }
  const fmt = n => (Math.round(n * 100) / 100).toLocaleString('pl-PL');

  function setHdr() {
    const h = document.querySelector('header').offsetHeight;
    document.documentElement.style.setProperty('--hdr', h + 'px');
  }

  // Rozmowa „Na pewno?” wewnątrz strony (okienka confirm() nie działają w podglądzie).
  function confirmButton(label, ask, onYes) {
    resetbox.innerHTML = '';
    const b = document.createElement('button');
    b.className = 'btn ghost small'; b.type = 'button'; b.textContent = label;
    b.addEventListener('click', () => {
      resetbox.innerHTML = '';
      const box = document.createElement('span'); box.className = 'confirm';
      const yes = document.createElement('button'); yes.className = 'btn small'; yes.type = 'button'; yes.textContent = 'Tak, wyczyść';
      const no = document.createElement('button'); no.className = 'btn ghost small'; no.type = 'button'; no.textContent = 'Nie';
      box.append(ask, yes, no); resetbox.append(box);
      yes.addEventListener('click', onYes);
      no.addEventListener('click', () => confirmButton(label, ask, onYes));
    });
    resetbox.append(b);
  }

  function renderChips(cur) {
    chips.innerHTML = '';
    if (!['dzial', 'test', 'przeszly'].includes(cur.kind)) { chips.hidden = true; return; }
    const list = PAGES.filter(p => p.kind === cur.kind && p.sek === cur.sek);
    for (const p of list) {
      const a = document.createElement('a');
      a.href = '#' + p.id;
      a.textContent = p.short;
      if (p.id === cur.id) a.setAttribute('aria-current', 'page');
      const pr = store.get('postep:' + p.id, null);
      if (p.kind === 'dzial' && pr && pr.total) {
        const s = document.createElement('small');
        s.textContent = Object.keys(pr.solved || {}).length + '/' + pr.total;
        a.append(s);
      } else if (p.kind === 'test' || p.kind === 'przeszly') {
        const h = store.get('historia:' + p.id, []);
        if (h.length) { const s = document.createElement('small'); s.textContent = fmt(Math.max(...h.map(x => x.pts))) + ' pkt'; a.append(s); }
      }
      chips.append(a);
    }
    chips.hidden = false;
  }

  function prevNext(cur) {
    const list = PAGES.filter(p => p.kind === cur.kind && p.sek === cur.sek);
    const i = list.findIndex(p => p.id === cur.id);
    const box = document.createElement('div'); box.className = 'prevnext';
    const mk = (p, txt) => { if (!p) return document.createElement('span'); const a = document.createElement('a'); a.href = '#' + p.id; a.textContent = txt; return a; };
    box.append(mk(list[i - 1], list[i - 1] ? '← ' + list[i - 1].short : ''), mk(list[i + 1], list[i + 1] ? list[i + 1].short + ' →' : ''));
    content.append(box);
  }

  // Zbiera zadania: <li> z listą opcji A)–E) i polem <details> z odpowiedzią.
  function collectTasks(root) {
    const tasks = [];
    root.querySelectorAll('details').forEach(det => {
      let li = det.closest('li');
      // Markdown dokleja pole odpowiedzi do ostatniej opcji (E) — przenosimy je pod listę opcji.
      if (li && li.parentElement.tagName === 'UL' && /^\s*[A-E]\)/.test(li.textContent)) {
        const ul0 = li.parentElement;
        li.querySelectorAll(':scope > br').forEach(b => b.remove());
        ul0.after(det);
        li = ul0.closest('li');
      }
      const ul = li && [...li.children].find(c => c.tagName === 'UL');
      if (!ul) return;
      const c = det.cloneNode(true);
      c.querySelector('summary')?.remove();
      const first = c.innerHTML.split(/<br\s*\/?>/i)[0].replace(/<[^>]+>/g, '').trim();
      const m = first.match(/^([A-E])\s+—/);
      if (!m) return;
      const opts = [];
      [...ul.children].forEach(oli => {
        const t = oli.innerHTML.match(/^\s*([A-E])\)\s*([\s\S]*)$/);
        if (!t) return;
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.dataset.l = t[1];
        b.innerHTML = '<span class="lit">' + t[1] + '</span><span>' + t[2] + '</span>';
        oli.innerHTML = ''; oli.append(b);
        opts.push(b);
      });
      if (!opts.length) return;
      ul.classList.add('opts');
      li.parentElement.classList.add('zad');
      const q = li.cloneNode(true);
      q.querySelectorAll('details, ul').forEach(x => x.remove());
      const pk = li.querySelector('.pkt');
      tasks.push({ li, det, opts, ans: m[1], pts: pk ? +pk.dataset.p : 0, key: hashKey(q.textContent.replace(/\s+/g, ' ').trim() + '|' + first) });
    });
    return tasks;
  }

  function practice(page, tasks) {
    const K = 'postep:' + page.id;
    const st = store.get(K, { solved: {}, first: {}, tried: {} });
    st.solved = st.solved || {}; st.first = st.first || {}; st.tried = st.tried || {};
    st.total = tasks.length;
    store.set(K, st);
    const score = () => {
      const n = tasks.filter(t => st.solved[t.key]).length;
      const f = tasks.filter(t => st.first[t.key]).length;
      wynik.hidden = false;
      wynik.textContent = 'Rozwiązane: ' + n + '/' + tasks.length + ' · za 1. razem: ' + f;
    };
    const solve = (t, open) => {
      t.opts.forEach(o => { o.disabled = true; if (o.dataset.l === t.ans) o.classList.add('ok'); });
      if (open) t.det.open = true;
    };
    tasks.forEach(t => {
      (st.tried[t.key] || []).forEach(l => t.opts.find(o => o.dataset.l === l)?.classList.add('bad'));
      if (st.solved[t.key]) solve(t, false);
      t.opts.forEach(o => o.addEventListener('click', () => {
        if (o.disabled) return;
        if (o.dataset.l === t.ans) {
          st.solved[t.key] = 1;
          if (!(st.tried[t.key] || []).length) st.first[t.key] = 1;
          solve(t, true);
        } else {
          o.classList.add('bad'); o.disabled = true;
          (st.tried[t.key] = st.tried[t.key] || []).push(o.dataset.l);
        }
        store.set(K, st); score(); renderChips(page);
      }));
    });
    score();
    confirmButton('Zresetuj postęp', 'Wyczyścić odpowiedzi na tej stronie?', () => { store.del(K); render(); });
  }

  function testMode(page, tasks, marker) {
    const K = 'test:' + page.id, H = 'historia:' + page.id;
    const minutes = +marker.dataset.minuty || 75;
    // Alfik Humanistyczny: uczestnik dostaje na start tyle punktów, ile jest pytań (data-start="30")
    const bonus = +marker.dataset.start || 0;
    const max = bonus + tasks.reduce((s, t) => s + t.pts, 0);
    let st = store.get(K, { sel: {}, start: null, done: false });

    // Klucz i rozwiązania ukryte do końca testu
    const keyH = [...content.querySelectorAll('h2')].find(h => /klucz/i.test(h.textContent));
    const keyEls = [];
    if (keyH) {
      let el = keyH.previousElementSibling && keyH.previousElementSibling.tagName === 'HR' ? keyH.previousElementSibling : keyH;
      while (el) { keyEls.push(el); el = el.nextElementSibling; }
    }

    const box = document.createElement('div'); box.className = 'testbox';
    marker.replaceWith(box);
    tasks.forEach(t => { const f = document.createElement('span'); f.className = 'q-flag'; t.li.insertBefore(f, t.li.querySelector('ul')); });

    const save = () => store.set(K, st);
    const left = () => Math.max(0, minutes * 60 - Math.floor((Date.now() - st.start) / 1000));
    const mmss = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

    function finish() {
      if (st.done) return;
      st.done = true; st.end = Date.now();
      const r = grade();
      const h = store.get(H, []); h.push({ pts: r.pts, ok: r.ok, bad: r.bad, at: st.end, min: Math.round((st.end - (st.start || st.end)) / 60000) }); store.set(H, h);
      save(); draw(); renderChips(page);
      box.scrollIntoView({ block: 'nearest' });
    }
    function grade() {
      let pts = bonus, ok = 0, bad = 0, none = 0;
      tasks.forEach(t => {
        const s = st.sel[t.key];
        if (!s) none++; else if (s === t.ans) { ok++; pts += t.pts; } else { bad++; pts -= t.pts / 4; }
      });
      return { pts, ok, bad, none };
    }
    function draw() {
      clearInterval(timerId); timerId = null;
      box.innerHTML = '';
      tasks.forEach(t => {
        const s = st.sel[t.key];
        t.li.classList.remove('st-ok', 'st-bad', 'st-none');
        t.opts.forEach(o => { o.className = 'opt'; o.disabled = st.done; if (s === o.dataset.l) o.classList.add('sel'); });
        t.li.classList.toggle('lock', !st.done);
        if (st.done) {
          const flag = t.li.querySelector('.q-flag');
          t.opts.forEach(o => {
            o.classList.remove('sel');
            if (o.dataset.l === t.ans) o.classList.add(s === t.ans ? 'ok' : 'missed');
            else if (o.dataset.l === s) o.classList.add('bad');
          });
          if (!s) { t.li.classList.add('st-none'); flag.textContent = '0'; }
          else if (s === t.ans) { t.li.classList.add('st-ok'); flag.textContent = '+' + t.pts; }
          else { t.li.classList.add('st-bad'); flag.textContent = '−' + fmt(t.pts / 4); }
        }
      });
      keyEls.forEach(e => e.classList.toggle('hidden-key', !st.done));
      const answered = tasks.filter(t => st.sel[t.key]).length;

      if (st.done) {
        const r = grade();
        const res = document.createElement('div'); res.className = 'result';
        res.innerHTML = '<div><strong>' + fmt(r.pts) + '</strong> / ' + max + ' pkt</div>' +
          '<span>dobrze: <b>' + r.ok + '</b></span><span>źle: <b>' + r.bad + '</b></span><span>bez odpowiedzi: <b>' + r.none + '</b></span>' +
          '<span>Rozwiązania są pod zadaniami (kliknij „rozwiązanie”).</span>';
        const again = document.createElement('button'); again.className = 'btn ghost'; again.type = 'button'; again.textContent = 'Rozwiąż od nowa';
        again.addEventListener('click', () => { st = { sel: {}, start: null, done: false }; save(); draw(); });
        box.append(res, again);
      } else {
        const clock = document.createElement('span'); clock.className = 'clock';
        const info = document.createElement('span'); info.className = 'info';
        const go = document.createElement('button'); go.type = 'button';
        box.append(clock, info, go);
        const tick = () => {
          if (!st.start) { clock.textContent = mmss(minutes * 60); return; }
          const s = left(); clock.textContent = mmss(s); clock.classList.toggle('low', s < 300);
          if (s === 0) finish();
        };
        info.textContent = st.start ? 'Zaznaczone: ' + answered + '/' + tasks.length + '. Kliknij jeszcze raz, żeby odznaczyć.' : 'Zegar ruszy po kliknięciu Start albo po pierwszej odpowiedzi.';
        if (!st.start) {
          go.className = 'btn'; go.textContent = 'Start';
          go.addEventListener('click', () => { st.start = Date.now(); save(); draw(); });
        } else {
          go.className = 'btn'; go.textContent = 'Zakończ i sprawdź';
          go.addEventListener('click', finish);
          timerId = setInterval(tick, 1000);
        }
        tick();
      }
      const h = store.get(H, []);
      if (h.length) {
        const hist = document.createElement('div'); hist.className = 'history'; hist.style.width = '100%';
        hist.innerHTML = 'Poprzednie podejścia: ' + h.slice(-5).map(x => '<b>' + fmt(x.pts) + '</b> (' + new Date(x.at).toLocaleDateString('pl-PL') + ', ' + x.min + ' min)').join(' · ');
        box.append(hist);
      }
      wynik.hidden = st.done || !st.start;
      wynik.textContent = 'Zaznaczone: ' + answered + '/' + tasks.length;
    }

    tasks.forEach(t => t.opts.forEach(o => o.addEventListener('click', () => {
      if (st.done) return;
      if (!st.start) st.start = Date.now();
      st.sel[t.key] = st.sel[t.key] === o.dataset.l ? undefined : o.dataset.l;
      if (!st.sel[t.key]) delete st.sel[t.key];
      save(); draw();
    })));
    draw();
    confirmButton('Wyczyść historię', 'Usunąć wyniki i bieżące podejście?', () => { store.del(K); store.del(H); render(); });
  }

  // Przełącznik „Wszystkie / Z arkuszy / Nowe” na stronach działów.
  function sourceFilter(page, tasks) {
    const orig = tasks.filter(t => t.li.classList.contains('oryg')).length;
    if (!orig || orig === tasks.length) return;
    tasks.forEach(t => { t.li.value = [...t.li.parentElement.children].indexOf(t.li) + +(t.li.parentElement.start || 1); });
    const modes = [['all', 'Wszystkie', tasks.length], ['oryg', 'Z arkuszy Alfika', orig], ['nowe', 'Nowe', tasks.length - orig]];
    const bar = document.createElement('div'); bar.className = 'filtr'; bar.setAttribute('role', 'group'); bar.setAttribute('aria-label', 'Pokaż zadania');
    const lab = document.createElement('span'); lab.textContent = 'Pokaż:'; bar.append(lab);
    const apply = mode => {
      tasks.forEach(t => { const o = t.li.classList.contains('oryg'); t.li.hidden = mode === 'oryg' ? !o : mode === 'nowe' ? o : false; });
      bar.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === mode)));
      store.set('filtr', mode);
    };
    for (const [m, txt, n] of modes) {
      const b = document.createElement('button'); b.type = 'button'; b.dataset.m = m;
      b.innerHTML = txt + ' <small>' + n + '</small>';
      b.addEventListener('click', () => apply(m));
      bar.append(b);
    }
    const first = tasks[0].li.parentElement.previousElementSibling;
    let h = first; while (h && h.tagName !== 'H2') h = h.previousElementSibling;
    (h || tasks[0].li.parentElement).before(bar);
    apply(store.get('filtr', 'all'));
  }

  function render() {
    clearInterval(timerId); timerId = null;
    let id = decodeURIComponent(location.hash.slice(1));
    if (!byId[id] && dawne[id]) { history.replaceState(null, '', '#' + dawne[id]); id = dawne[id]; }
    if (!byId[id]) id = 'start';
    const page = byId[id];
    const base = page.path.includes('/') ? page.path.slice(0, page.path.lastIndexOf('/') + 1) : '';
    content.innerHTML = marked.parse(page.md);
    document.title = page.id === 'start' ? 'Alfik — trening' : (page.kind === 'info' && page.id.endsWith('/start') ? page.sekNazwa : page.short + ' · ' + page.sekNazwa) + ' · Alfik';

    content.querySelectorAll('h1, h2, h3, h4').forEach(h => { h.id = slug(h.textContent); });
    content.querySelectorAll('table').forEach(t => { const d = document.createElement('div'); d.className = 'tbl'; t.replaceWith(d); d.append(t); });
    content.querySelectorAll('em').forEach(em => {
      const m = em.textContent.match(/^\((\d) pkt\)$/);
      if (m) { const s = document.createElement('span'); s.className = 'pkt'; s.dataset.p = m[1]; s.textContent = m[1] + ' pkt'; em.replaceWith(s); return; }
      // *(Alfik 2019, zad. 14)* — zadanie z prawdziwego arkusza: odznaka z linkiem do całego testu
      const z = em.textContent.match(/^\(Alfik (\d{4}), zad\. (\d+)\)$/);
      if (z) {
        const arkusz = page.sek + '/alfik-' + z[1];
        const a = document.createElement(byId[arkusz] ? 'a' : 'span');
        a.className = 'zrodlo'; a.textContent = 'Alfik ' + z[1] + ' · zad. ' + z[2];
        if (a.tagName === 'A') { a.href = '#' + arkusz; a.title = 'Cały arkusz z ' + z[1] + ' roku'; }
        const li = em.closest('li'); if (li && li.parentElement.tagName === 'OL') li.classList.add('oryg');
        em.replaceWith(a);
      }
    });
    content.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      // Tytuł strony linkuje do niej samej (dla czytających README na GitHubie), więc otwiera się w tej samej karcie
      if (/^[a-z]+:/i.test(href)) { if (!a.closest('h1')) { a.target = '_blank'; a.rel = 'noopener'; } return; }
      if (href.startsWith('#')) { if (!byId[href.slice(1)]) a.dataset.anchor = href.slice(1); return; }
      const [p, hash] = href.split('#');
      const target = byPath[resolve(base, p)];
      if (target) { a.href = '#' + target.id; if (hash) a.dataset.then = hash; }
    });

    menuCards();
    const tasks = collectTasks(content);
    wynik.hidden = true; resetbox.innerHTML = '';
    const marker = content.querySelector('.test');
    if (marker && tasks.length) testMode(page, tasks, marker);
    else if (tasks.length) practice(page, tasks);
    if (page.kind === 'dzial') sourceFilter(page, tasks);
    if (['dzial', 'test', 'przeszly'].includes(page.kind)) prevNext(page);
    renderNav(page);
    renderChips(page);
    setHdr();
    const then = sessionStorage && (() => { try { return sessionStorage.getItem('then'); } catch (e) { return null; } })();
    if (then) { try { sessionStorage.removeItem('then'); } catch (e) {} document.getElementById(decodeURIComponent(then))?.scrollIntoView(); }
    else window.scrollTo(0, 0);
  }

  // Kotwice wewnątrz strony przewijają bez zmiany adresu (adres # służy do wyboru strony).
  document.addEventListener('click', e => {
    const a = e.target.closest('a');
    if (!a) return;
    if (a.dataset.anchor) {
      e.preventDefault();
      document.getElementById(decodeURIComponent(a.dataset.anchor))?.scrollIntoView({ behavior: 'smooth' });
    } else if (a.dataset.then) {
      try { sessionStorage.setItem('then', a.dataset.then); } catch (err) {}
    }
  });
  window.addEventListener('hashchange', render);
  window.addEventListener('resize', setHdr);
  try { render(); } catch (err) {
    content.innerHTML = '<p id="error">Nie udało się wyświetlić strony: ' + err.message + '</p>';
  }
})();
</script>
</html>
