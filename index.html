<script id="pages" type="application/json">[{"path": "README.md", "id": "start", "kind": "info", "short": "Start", "md": "# Alfik Matematyczny, klasa 5: trening\n\nZadania do nauki przed Ogólnopolskim Konkursem Matematycznym **Alfik Matematyczny** dla klasy 5\nszkoły podstawowej. Strona zawiera 300 oryginalnych zadań z arkuszy z lat 2015–2025 i 191 nowych\nzadań w stylu Alfika. Każda odpowiedź została sprawdzona programem komputerowym.\n\n- **[Zadania według typu](zadania-wg-typu/README.md)** to 9 działów, od kalendarza po szachownice.\n  Zadania z prawdziwych arkuszy są wymieszane z nowymi i oznaczone odznaką z rokiem.\n  Klikasz odpowiedź: zielona jest dobra i od razu pokazuje się rozwiązanie, czerwona jest zła\n  i możesz próbować dalej.\n- **[Testy przeszłe](testy-przeszle/README.md)** to 10 oryginalnych arkuszy dla klasy 5\n  (2015–2025) do rozwiązania na czas, z punktacją jak na konkursie.\n- **[Testy próbne](testy-probne/README.md)** to pełne arkusze: 30 zadań, 75 minut, punktacja\n  jak na konkursie, razem z punktami ujemnymi.\n\nPostęp zapisuje się w przeglądarce, osobno dla każdej strony. Przycisk u góry czyści tylko bieżącą stronę.\n\n---\n\n## Jak wygląda konkurs (klasa 5)\n\n| | |\n|---|---|\n| Czas | **75 minut** |\n| Zadania | **30**, jednokrotnego wyboru, odpowiedzi A–E |\n| Punkty | zadania 1–10 po **3 pkt**, 11–20 po **4 pkt**, 21–30 po **5 pkt** (razem 120) |\n| Brak odpowiedzi | 0 pkt |\n| Zła odpowiedź | **minus ¼** punktów zadania (−0,75 / −1 / −1,25) |\n| Termin | zwykle druga połowa listopada (2025: 20 listopada). Dokładną datę podaje szkoła i organizator na [jersz.pl](https://jersz.pl) |\n\n### Czy zgadywać?\n\nPoliczmy dla zadania za 4 pkt. Jeśli strzelasz na ślepo spośród 5 odpowiedzi, trafiasz średnio\nraz na 5 razy: +4 raz, −1 cztery razy, czyli średnio **0 pkt**. Strzelanie w ciemno nic nie daje.\n\nAle gdy **odrzucisz choć jedną** odpowiedź, strzał już się opłaca. Przy 4 pozostałych:\n+4 raz, −1 trzy razy, średnio +¼ pkt. Przy 3 pozostałych: +4 raz, −1 dwa razy, średnio +⅔ pkt.\n\n**Zasada:** nie zgaduj na ślepo. Jeśli umiesz skreślić choć jedną odpowiedź, zaznacz którąś z pozostałych.\n\n### Wskazówki na sam test\n\n1. Najpierw przejdź wszystkie zadania za 3 pkt, potem za 4 i 5. Nie utykaj na jednym zadaniu dłużej niż 4–5 minut.\n2. Sprawdzaj odpowiedzi **od tyłu**: wstaw każdą opcję do treści zadania. W Alfiku często to jest najszybsza droga.\n3. Rysuj! Kalendarz, kratka, drzewko możliwości, kreski zamiast kulek.\n4. Uważaj na słowa „co najmniej”, „najwięcej”, „mieć pewność”, „o ile”, „ile razy”.\n5. Opcja E bywa podchwytliwa („5 lub więcej”, „nie da się ustalić”). Czasem to ona jest dobra.\n\n---\n\n## Plan na 3 tygodnie\n\n| Tydzień | Co robić |\n|---|---|\n| 1 | Działy 01–03 (kalendarz, cyfry, podzielność): po jednym dziale dziennie, potem ściąga z końca działu do zeszytu. |\n| 2 | Działy 04–06 (zadania tekstowe, liczenie, logika) i **Test próbny 1** na czas. |\n| 3 | Działy 07–09 (geometria, kratki, działania), **Test próbny 2**, a potem **testy przeszłe** od najnowszego: Alfik 2025, 2024, 2023… |\n\nPo każdym teście przejrzyj zadania, w których straciłeś punkty, i wróć do ich działu.\n\n## Oryginalne arkusze\n\nWszystkie arkusze dla klasy 5 z lat 2015–2025 są w zakładce [Testy przeszłe](testy-przeszle/README.md).\nOryginały w PDF są na stronie organizatora, [jersz.pl](https://jersz.pl/alfik-matematyczny/).\nArkusze i klucze są własnością organizatora konkursu (Łowcy Talentów – JERSZ).\n\n<details><summary>Dla rodzica: jak dodać własne zadanie<\/summary>\n\nPliki z zadaniami to zwykłe pliki <code>.md<\/code> w katalogach <code>zadania-wg-typu<\/code> i <code>testy-probne<\/code>.\nZadanie wygląda tak (5 opcji A–E, pod nimi pole z odpowiedzią w jednej linii):\n\n<pre>\n7. Treść zadania. *(4 pkt)*\n   - A) 10\n   - B) 12\n   - C) 14\n   - D) 16\n   - E) 18\n   &lt;details&gt;&lt;summary&gt;rozwiązanie&lt;/summary&gt;C — 14&lt;br&gt;Wyjaśnienie.&lt;/details&gt;&lt;br&gt;\n<\/pre>\n\nJeśli zmieniasz arkusz w <code>testy-przeszle<\/code>, najpierw uruchom <code>python narzedzia/scal_oryginaly.py<\/code>.\nSkrypt przeniesie zmiany do działów według <code>narzedzia/klasyfikacja.json<\/code>.\nPo zmianach uruchom <code>python zbuduj.py<\/code>. Skrypt złoży wszystko na nowo w plik <code>index.html<\/code>.\nNa GitHubie nie trzeba tego robić ręcznie, bo po każdym pushu na <code>main<\/code> akcja „Strona” sama\nprzebudowuje i publikuje stronę.\n\n<\/details>\n\n<details><summary>Dla rodzica: jak uruchomić stronę na GitHub Pages<\/summary>\n\n1. Wrzuć cały katalog do nowego repozytorium na GitHubie (gałąź <code>main<\/code>).\n2. W repozytorium wejdź w <b>Settings → Pages<\/b> i w <b>Source<\/b> wybierz <b>GitHub Actions<\/b>.\n3. Po minucie strona będzie pod adresem <code>https://&lt;login&gt;.github.io/&lt;nazwa-repozytorium&gt;/<\/code>.\n\nSam plik <code>index.html<\/code> działa też bez GitHuba, po dwukliku na komputerze (potrzebny internet do czcionek).\n\n<\/details>\n"}, {"path": "zadania-wg-typu/README.md", "id": "dzialy", "kind": "info", "short": "Zadania wg typu", "md": "# Zadania według typu\n\n431 zadań w 9 działach. Na każdy typ, który pojawia się w Alfiku, przypada jeden plik.\nW każdym dziale są dwa rodzaje zadań:\n\n- **nowe**, napisane w stylu Alfika (131 zadań),\n- **oryginalne** z arkuszy Alfika dla klasy 5 z lat 2015–2025 (300 zadań). Mają kratkowane tło\n  i odznakę z rokiem, np. „Alfik 2019 · zad. 14”. Kliknięcie odznaki otwiera cały arkusz.\n\nNa górze działu możesz wybrać, które zadania widać: wszystkie, tylko z arkuszy albo tylko nowe.\nW każdym dziale zadania idą od łatwych (3 pkt) do trudnych (5 pkt). Na końcu działu jest\n**klucz odpowiedzi** i **ściąga** z najważniejszymi sztuczkami.\n\n| # | Dział | Zadań (w tym z arkuszy) | Co w środku |\n|---|---|---|---|\n| 01 | [Kalendarz i zegar](01-kalendarz-i-zegar.md) | 53 (39) | dni tygodnia, lata przestępne, wskazówki zegara, zegar elektroniczny |\n| 02 | [Liczby i cyfry](02-liczby-i-cyfry.md) | 42 (28) | suma i iloczyn cyfr, palindromy, największa/najmniejsza liczba, numerowanie stron |\n| 03 | [Podzielność i reszty](03-podzielnosc-i-reszty.md) | 47 (33) | cechy podzielności, wielokrotności, reszty, ostatnia cyfra |\n| 04 | [Zadania tekstowe](04-zadania-tekstowe.md) | 99 (84) | wiek, ważenie, zakupy, przekładanie, ruch |\n| 05 | [Liczenie i kombinatoryka](05-kombinatoryka.md) | 24 (9) | ile liczb, ile meczów, ile dróg, ile prostokątów |\n| 06 | [Logika i zasada szufladkowa](06-logika-i-szufladki.md) | 29 (14) | „żeby mieć pewność”, rycerze i łotrzy, ważenie, przelewanie |\n| 07 | [Geometria: pola, obwody, jednostki](07-geometria-pola-i-obwody.md) | 44 (29) | pole i obwód, ar i hektar, kąty, pomalowane kostki |\n| 08 | [Kratki, szachownice i cięcie](08-kratki-szachownice-ciecie.md) | 53 (39) | szachownice, kwadraty na kratce, domino, kostka do gry |\n| 09 | [Działania, ciągi i wzorki](09-dzialania-i-wzorki.md) | 40 (25) | znaki i nawiasy, sprytne liczenie, ciągi, ułamki |\n\n**Jak pracować z działem**\n\n1. Rozwiązuj na kartce, a dopiero potem klikaj odpowiedź. Licznik u góry pokazuje też, ile zadań\n   wyszło **za pierwszym razem**, bo tylko to liczy się na konkursie.\n2. Po złej odpowiedzi nie klikaj od razu następnej. Najpierw znajdź swój błąd.\n3. Po każdym rozwiązanym zadaniu przeczytaj rozwiązanie, nawet jeśli wynik był dobry. Często jest tam szybszy sposób.\n4. Ściągę z końca działu przepisz do zeszytu.\n"}, {"path": "testy-przeszle/README.md", "id": "przeszle", "kind": "info", "short": "Testy przeszłe", "md": "# Testy przeszłe\n\nOryginalne arkusze Alfika Matematycznego dla **klasy 5** z 10 edycji konkursu. Rozwiązujesz je\njak na konkursie: 30 zadań, 75 minut, punkty ujemne za złe odpowiedzi, wynik od razu po zakończeniu.\nW 2020 roku konkursu nie było.\n\n| Arkusz | Edycja | Klucz |\n|---|---|---|\n| [Alfik 2025](alfik-2025.md) | XXXI | oficjalny |\n| [Alfik 2024](alfik-2024.md) | XXX | oficjalny |\n| [Alfik 2023](alfik-2023.md) | XXIX | oficjalny |\n| [Alfik 2022](alfik-2022.md) | XXVIII | oficjalny |\n| [Alfik 2021](alfik-2021.md) | XXVII | nasz: organizator nie opublikował klucza dla klasy 5 |\n| [Alfik 2019](alfik-2019.md) | XXV | oficjalny |\n| [Alfik 2018](alfik-2018.md) | XXIV | oficjalny |\n| [Alfik 2017](alfik-2017.md) | XXIII | oficjalny |\n| [Alfik 2016](alfik-2016.md) | XXII | oficjalny |\n| [Alfik 2015](alfik-2015.md) | XXI | oficjalny |\n\nKażdą odpowiedź z klucza sprawdziliśmy dodatkowo, rozwiązując zadanie programem komputerowym.\nWyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n**Jak z tego korzystać**\n\n- Zacznij od najnowszych arkuszy. Najlepiej oddają to, czego można się spodziewać w tym roku.\n- Rób jeden arkusz na raz, przy biurku, bez przerw. Po teście przejrzyj zadania, w których straciłeś punkty.\n- Te same zadania są też w [działach według typu](../zadania-wg-typu/README.md), oznaczone\n  odznaką z rokiem. Jeśli jakiś typ zadań sprawia kłopot, poćwicz go tam.\n\nArkusze i klucze są własnością organizatora konkursu, Łowcy Talentów – JERSZ. Oryginały w PDF są\nna stronie [jersz.pl](https://jersz.pl/alfik-matematyczny/).\n"}, {"path": "testy-probne/README.md", "id": "testy", "kind": "info", "short": "Testy próbne", "md": "# Testy próbne\n\nPełne arkusze ułożone jak na prawdziwym Alfiku: 30 zadań, 75 minut, 10 zadań za 3 pkt,\n10 za 4 pkt i 10 za 5 pkt. Za złą odpowiedź odejmowana jest ¼ punktów zadania. Najwięcej można zdobyć 120 pkt.\n\n| Test | Poziom |\n|---|---|\n| [Test próbny 1](test-1.md) | jak typowy arkusz |\n| [Test próbny 2](test-2.md) | trochę trudniejszy |\n\n**Jak to działa na stronie**\n\n- Zegar rusza po kliknięciu **Start** albo po pierwszej odpowiedzi. Gdy czas się skończy, test sprawdzi się sam.\n- Odpowiedź zaznaczasz kliknięciem. Drugie kliknięcie ją odznacza, bo puste pole to 0 pkt, a nie minus.\n- Rozwiązania i klucz pokazują się dopiero po kliknięciu **Zakończ i sprawdź**.\n- Wyniki kolejnych podejść zapisują się w przeglądarce, więc widać postęp.\n\n**Najlepiej:** siądź przy biurku z kartką na obliczenia, wyłącz inne rzeczy i rób test za jednym\nzamachem, jak na konkursie. Po teście omów z rodzicem każde zadanie, w którym straciłeś punkty.\n"}, {"path": "zadania-wg-typu/01-kalendarz-i-zegar.md", "id": "01-kalendarz-i-zegar", "kind": "dzial", "short": "01 Kalendarz i zegar", "md": "# 01. Kalendarz i zegar\n\n**Dlaczego warto:** W prawie każdym arkuszu Alfika jest 1–3 zadania o dniach tygodnia, latach przestępnych albo o zegarze. Rachunki są w nich krótkie, ale łatwo pomylić się o jeden dzień, zapomnieć o roku przestępnym albo o tym, że wskazówka godzinowa też się porusza.\n\n- **W pliku:** 53 zadań: 14 nowych i 39 z prawdziwych arkuszy Alfika (18 za 3 pkt, 16 za 4 pkt, 19 za 5 pkt).\n\n**Wskazówki**\n- Dni tygodnia powtarzają się co 7 dni, więc liczy się tylko **reszta z dzielenia przez 7**: za 100 dni = za 14 tygodni i 2 dni.\n- Rok zwykły ma 365 dni = 52 tygodnie i 1 dzień, a rok przestępny 366 dni = 52 tygodnie i 2 dni. Dlatego 1 stycznia przesuwa się co roku o 1 dzień tygodnia (albo o 2 po roku przestępnym).\n- W miesiącu „nadmiarowe” dni 29., 30., 31. to te same dni tygodnia co 1., 2., 3. — właśnie te dni tygodnia występują w miesiącu 5 razy.\n- Wskazówka minutowa przesuwa się o 6° na minutę, a godzinowa o 30° na godzinę, czyli o pół stopnia na minutę.\n- Zegar elektroniczny pokazuje godziny 00–23 i minuty 00–59: pierwsza cyfra minut nigdy nie jest większa niż 5.\n- Gdy czas „przechodzi przez północ”, policz osobno: do 24:00 i od 0:00.\n\n**Spis treści**\n\n- [A. Dni tygodnia i lata przestępne](#a-dni-tygodnia-i-lata-przestępne)\n- [B. Zegar ze wskazówkami](#b-zegar-ze-wskazówkami)\n- [C. Zegar elektroniczny i upływ czasu](#c-zegar-elektroniczny-i-upływ-czasu)\n- [Klucz odpowiedzi](#klucz-odpowiedzi)\n- [Ściąga](#ściąga)\n\n---\n\n## A. Dni tygodnia i lata przestępne\n\nCo 7 dni dzień tygodnia się powtarza — dlatego zamiast liczyć dzień po dniu, dziel przez 7 i patrz na resztę.\n\n1. Dzisiaj jest środa. Jaki dzień tygodnia będzie za 100 dni? *(3 pkt)*\n   - A) poniedziałek\n   - B) wtorek\n   - C) środa\n   - D) czwartek\n   - E) piątek\n   <details><summary>rozwiązanie<\/summary>E — piątek<br>100 = 14 · 7 + 2. Po 14 pełnych tygodniach (98 dniach) znów będzie środa, a potem zostają jeszcze 2 dni: czwartek, piątek. Pułapka: 100 nie dzieli się przez 7 — reszta 2 mówi, o ile dni trzeba się przesunąć.<\/details><br>\n2. Rok 2027 nie jest przestępny, a 1 stycznia 2027 roku wypada w piątek. Ile piątków będzie w roku 2027? *(3 pkt)*\n   - A) 50\n   - B) 51\n   - C) 52\n   - D) 53\n   - E) 54\n   <details><summary>rozwiązanie<\/summary>D — 53<br>365 = 52 · 7 + 1. W 52 pełnych tygodniach są 52 piątki. Zostaje 1 dzień — ostatni dzień roku, 31 grudnia — i jest to ten sam dzień tygodnia co 1 stycznia, czyli piątek. Razem 52 + 1 = 53.<\/details><br>\n3. Pierwszy i ostatni dzień pewnego miesiąca wypadły w tym samym dniu tygodnia. Ile dni liczył ten miesiąc? *(3 pkt)* *(Alfik 2022, zad. 3)*\n   - A) 28\n   - B) 29\n   - C) 30\n   - D) 31\n   - E) opisana sytuacja jest niemożliwa\n   <details><summary>rozwiązanie<\/summary>B — 29<br>Ten sam dzień tygodnia powtarza się co 7 dni: 1., 8., 15., 22., 29. dnia miesiąca. Ostatni dzień musi więc być 29. — to luty w roku przestępnym.<\/details><br>\n4. Pierwszy dzień dziesięciodniowego urlopu pani Marioli wypadł we wtorek. W jakim dniu tygodnia wypadł ostatni dzień jej urlopu? *(3 pkt)* *(Alfik 2021, zad. 1)*\n   - A) wtorek\n   - B) środa\n   - C) czwartek\n   - D) piątek\n   - E) sobota\n   <details><summary>rozwiązanie<\/summary>C — czwartek<br>Ostatni dzień urlopu to dzień 10., czyli 9 dni po pierwszym. 7 dni później znów jest wtorek (dzień 8.), a 2 dni dalej — czwartek (dzień 10.). Pułapka: liczenie 10 dni po wtorku zamiast 9 daje piątek.<\/details><br>\n5. Jeśli pierwszy dzień pewnego miesiąca wypadł w środę, to w którym dniu miesiąca wypadła ostatnia niedziela tego miesiąca? *(3 pkt)* *(Alfik 2015, zad. 3)*\n   - A) 26\n   - B) 27\n   - C) 28\n   - D) 29\n   - E) zależy od długości tego miesiąca\n   <details><summary>rozwiązanie<\/summary>A — 26<br>Środa 1., czwartek 2., piątek 3., sobota 4., niedziela 5. Kolejne niedziele to 12., 19., 26., a następna byłaby 33. — takiego dnia nie ma w żadnym miesiącu. Więc ostatnia niedziela to zawsze 26., niezależnie od długości miesiąca.<\/details><br>\n6. Ile dni minęło od 1 stycznia 2020 roku do 1 stycznia 2025 roku? *(4 pkt)*\n   - A) 1825\n   - B) 1826\n   - C) 1827\n   - D) 1828\n   - E) 1830\n   <details><summary>rozwiązanie<\/summary>C — 1827<br>Minęło 5 pełnych lat: 2020, 2021, 2022, 2023 i 2024. Lata 2020 i 2024 są przestępne (dzielą się przez 4), więc mają po 366 dni. 5 · 365 = 1825 i do tego 2 dodatkowe dni (dwa razy 29 lutego): 1825 + 2 = 1827. Pułapka: łatwo zapomnieć o jednym roku przestępnym (1826) albo o obu (1825).<\/details><br>\n7. W pewnym miesiącu było 5 sobót i 5 niedziel, ale tylko 4 piątki. Jakim dniem tygodnia był pierwszy dzień tego miesiąca? *(4 pkt)*\n   - A) piątek\n   - B) sobota\n   - C) niedziela\n   - D) poniedziałek\n   - E) nie da się tego ustalić\n   <details><summary>rozwiązanie<\/summary>B — sobota<br>Pierwsze 28 dni to 4 pełne tygodnie — każdy dzień tygodnia jest w nich 4 razy. Piąty raz pojawiają się tylko dni tygodnia z dni 29., 30. i 31., a to te same dni tygodnia co 1., 2. i 3. dzień miesiąca. Sobota i niedziela są 5 razy, a piątek nie — więc 1. dzień to sobota, 2. to niedziela. Pułapka: nie wiemy, czy miesiąc ma 30, czy 31 dni, ale to nie przeszkadza — w obu przypadkach zaczyna się w sobotę.<\/details><br>\n8. W pewnym miesiącu wypadło pięć piątków, ale tylko cztery czwartki. W jakim dniu tygodnia wypadł pierwszy dzień tego miesiąca? *(4 pkt)* *(Alfik 2022, zad. 13)*\n   - A) we wtorek\n   - B) w środę\n   - C) w czwartek\n   - D) w piątek\n   - E) w sobotę\n   <details><summary>rozwiązanie<\/summary>D — w piątek<br>W 28 dniach każdy dzień tygodnia jest dokładnie 4 razy. Piątych piątków może być tylko w „dodatkowych” dniach (29., 30., 31.). Gdyby przed piątkiem był w nich czwartek, czwartków też byłoby 5. Więc piątek musi być pierwszym z dodatkowych dni, czyli 29. jest piątkiem — a wtedy 1. dzień miesiąca też jest piątkiem.<\/details><br>\n9. Ile jest takich miesięcy w roku, w których drugi i przedostatni dzień wypadają w tym samym dniu tygodnia? *(4 pkt)* *(Alfik 2019, zad. 17)*\n   - A) 4\n   - B) 5\n   - C) 6\n   - D) 7\n   - E) 8\n   <details><summary>rozwiązanie<\/summary>D — 7<br>Ten sam dzień tygodnia powtarza się co 7 dni. W miesiącu 31-dniowym przedostatni dzień to 30., a 30 − 2 = 28 = 4 · 7 — pasuje. W 30-dniowym: 29 − 2 = 27, nie pasuje; w lutym też nie. Miesięcy 31-dniowych jest 7 (styczeń, marzec, maj, lipiec, sierpień, październik, grudzień).<\/details><br>\n10. Pan Jan przyjechał do hotelu w przedostatnim dniu przedostatniego miesiąca ubiegłego roku, a wyjechał w ostatnim dniu ostatniego miesiąca ubiegłego roku. Ile nocy spędził w tym hotelu? *(4 pkt)* *(Alfik 2018, zad. 12)*\n    - A) 28\n    - B) 29\n    - C) 30\n    - D) 31\n    - E) 32\n    <details><summary>rozwiązanie<\/summary>E — 32<br>Przyjazd 29 listopada (listopad ma 30 dni), wyjazd 31 grudnia. Noce w listopadzie: z 29 na 30 i z 30 listopada na 1 grudnia — 2 noce. W grudniu: od 1 do 31 grudnia jest 30 nocy. Razem 32.<\/details><br>\n11. Ile najwięcej sobót może wypaść w jednym miesiącu? *(4 pkt)* *(Alfik 2018, zad. 14)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>C — 5<br>Miesiąc ma najwyżej 31 dni = 4 tygodnie i 3 dni. W 4 tygodniach są 4 soboty, a w 3 dodatkowych dniach może być jeszcze jedna. Razem najwyżej 5 (np. gdy miesiąc zaczyna się w sobotę).<\/details><br>\n12. Jacek powiedział: „Pojutrze minie 10 dni od mojej niedzielnej wyprawy w góry.” W jakim dniu tygodnia to powiedział? *(4 pkt)* *(Alfik 2017, zad. 14)*\n    - A) w niedzielę\n    - B) w sobotę\n    - C) w środę\n    - D) we wtorek\n    - E) w poniedziałek\n    <details><summary>rozwiązanie<\/summary>E — w poniedziałek<br>10 dni po niedzieli to 7 dni (znów niedziela) i jeszcze 3 dni — środa. Skoro środa jest „pojutrze”, to dziś jest poniedziałek.<\/details><br>\n13. Długość roku 2015 to 52 tygodnie i: *(4 pkt)* *(Alfik 2015, zad. 19)*\n    - A) 1 dzień\n    - B) 2 dni\n    - C) 3 dni\n    - D) 4 dni\n    - E) 5 dni\n    <details><summary>rozwiązanie<\/summary>A — 1 dzień<br>Rok 2015 nie jest przestępny, ma 365 dni. 52 tygodnie to 52 · 7 = 364 dni, więc zostaje 1 dzień.<\/details><br>\n14. 1 stycznia 2026 roku wypadł w czwartek. W którym najbliższym roku 1 stycznia znów wypadnie w czwartek? *(5 pkt)*\n    - A) 2031\n    - B) 2032\n    - C) 2033\n    - D) 2034\n    - E) 2037\n    <details><summary>rozwiązanie<\/summary>B — 2032<br>Po roku zwykłym 1 stycznia przesuwa się o 1 dzień tygodnia, a po przestępnym o 2. Liczymy: 2027 — piątek, 2028 — sobota, 2029 — poniedziałek (rok 2028 jest przestępny, więc skok o 2 dni), 2030 — wtorek, 2031 — środa, 2032 — czwartek. Pułapka: kto zapomni o roku przestępnym 2028, dostanie 2033.<\/details><br>\n15. Kasia dodała do siebie numery wszystkich dni pewnego miesiąca, które wypadły w niedzielę. Wyszło jej 80. Jakim dniem tygodnia był pierwszy dzień tego miesiąca? *(5 pkt)*\n    - A) czwartek\n    - B) piątek\n    - C) sobota\n    - D) niedziela\n    - E) poniedziałek\n    <details><summary>rozwiązanie<\/summary>C — sobota<br>Kolejne niedziele różnią się o 7 dni. Gdyby były 4 niedziele, to suma byłaby równa 4 razy pierwsza niedziela plus 7 + 14 + 21 = 42; ale 80 − 42 = 38 nie dzieli się przez 4 — nie pasuje. Więc niedziel jest 5: 5 razy pierwsza niedziela plus 7 + 14 + 21 + 28 = 70. Zostaje 80 − 70 = 10, czyli pierwsza niedziela to 10 : 5 = 2. dzień miesiąca. Sprawdzenie: 2 + 9 + 16 + 23 + 30 = 80. Skoro 2. jest niedziela, to 1. jest sobota.<\/details><br>\n16. W styczniu pewnego roku wypadło pięć piątków, ale tylko cztery soboty. W jakim dniu tygodnia wypadł pierwszy dzień tego stycznia? *(5 pkt)* *(Alfik 2024, zad. 25)*\n    - A) w środę\n    - B) w czwartek\n    - C) w piątek\n    - D) w sobotę\n    - E) w niedzielę\n    <details><summary>rozwiązanie<\/summary>A — w środę<br>Styczeń ma 31 dni = 4 pełne tygodnie i 3 dni. Pięć razy występują tylko dni tygodnia z dat 29, 30 i 31 (takie same jak 1, 2 i 3 stycznia). Piątek jest wśród nich, a sobota nie — więc piątek to ostatni z nich, 31 stycznia (i 3 stycznia). Zatem 1 stycznia to środa.<\/details><br>\n17. Ile jest takich miesięcy w roku, w których pierwszy i przedostatni dzień wypadają w tym samym dniu tygodnia? *(5 pkt)* *(Alfik 2023, zad. 30)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>D — 4<br>Ten sam dzień tygodnia co 1. mają dni 8., 15., 22., 29. Przedostatni dzień musi więc być 29., czyli miesiąc ma 30 dni. Takie miesiące to kwiecień, czerwiec, wrzesień i listopad — 4. (Luty w roku przestępnym ma przedostatni dzień 28., więc nie pasuje.)<\/details><br>\n18. Ile najwięcej piątków może wypaść w ciągu roku? *(5 pkt)* *(Alfik 2022, zad. 27)*\n    - A) 51\n    - B) 52\n    - C) 53\n    - D) 54\n    - E) 55\n    <details><summary>rozwiązanie<\/summary>C — 53<br>Rok ma 365 dni = 52 tygodnie i 1 dzień (przestępny: 52 tygodnie i 2 dni). Każdy dzień tygodnia występuje 52 razy, a 1 lub 2 dni tygodnia — 53 razy. Jeśli rok zaczyna się w piątek, piątków jest 53.<\/details><br>\n19. Jeśli pierwszy dzień roku (nieprzestępnego) wypadnie w piątek, to w jakim dniu tygodnia wypadnie ostatni dzień tego roku? *(5 pkt)* *(Alfik 2021, zad. 21)*\n    - A) w czwartek\n    - B) w piątek\n    - C) w sobotę\n    - D) w niedzielę\n    - E) w poniedziałek\n    <details><summary>rozwiązanie<\/summary>B — w piątek<br>Rok nieprzestępny ma 365 dni, a ostatni dzień jest 364 dni po pierwszym. 364 = 52 · 7, czyli dokładnie 52 tygodnie — ostatni dzień wypada w tym samym dniu tygodnia co pierwszy, w piątek. Pułapka: 365 dni po 1 stycznia to już 1 stycznia następnego roku (sobota).<\/details><br>\n20. W roku 2020 dzień 1 lutego wypada w innym dniu tygodnia niż dzień 1 marca. Jaki jest kolejny rok o tej samej własności? *(5 pkt)* *(Alfik 2019, zad. 22)*\n    - A) 2021\n    - B) 2022\n    - C) 2023\n    - D) 2024\n    - E) 2025\n    <details><summary>rozwiązanie<\/summary>D — 2024<br>Od 1 lutego do 1 marca mija tyle dni, ile ma luty. Gdy luty ma 28 dni (4 pełne tygodnie), dzień tygodnia się powtarza. Inny dzień wychodzi tylko w roku przestępnym (luty ma 29 dni). Następny rok przestępny po 2020 to 2024.<\/details><br>\n21. Ile najwięcej piątków może wypaść w ciągu 100 kolejnych dni? *(5 pkt)* *(Alfik 2019, zad. 23)*\n    - A) 13\n    - B) 14\n    - C) 15\n    - D) 16\n    - E) 17\n    <details><summary>rozwiązanie<\/summary>C — 15<br>100 dni = 14 pełnych tygodni (98 dni) + 2 dni. W 14 tygodniach jest dokładnie 14 piątków, a w 2 dodatkowych dniach może być jeszcze jeden. Najwięcej 15 — np. gdy pierwszy dzień jest piątkiem.<\/details><br>\n22. W pewnym roku jeden z miesięcy rozpoczął się i zakończył niedzielą. Pierwszy dzień owego roku wypadł w: *(5 pkt)* *(Alfik 2018, zad. 21)*\n    - A) wtorek\n    - B) środę\n    - C) czwartek\n    - D) piątek\n    - E) podana sytuacja jest niemożliwa\n    <details><summary>rozwiązanie<\/summary>C — czwartek<br>Pierwszy i ostatni dzień w tym samym dniu tygodnia ma tylko miesiąc 29-dniowy — luty roku przestępnego. 1 lutego to niedziela. Styczeń ma 31 dni = 4 tygodnie i 3 dni, więc 1 stycznia był 3 dni tygodnia wcześniej niż niedziela: w czwartek.<\/details><br>\n23. Jaka jest największa możliwa liczba takich miesięcy w jednym roku, których pierwszy i ostatni dzień wypadają w tym samym dniu tygodnia? *(5 pkt)* *(Alfik 2017, zad. 29)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>A — 1<br>Pierwszy i ostatni dzień miesiąca wypadają w tym samym dniu tygodnia, gdy od 1. do ostatniego dnia mija pełna liczba tygodni, czyli miesiąc ma 29 dni (1 + 28). Taki jest tylko luty w roku przestępnym — najwyżej jeden miesiąc w roku.<\/details><br>\n24. Jeśli pierwszy dzień bieżącego roku był niedzielą, to jakim dniem tygodnia będzie ostatni dzień tego roku? *(5 pkt)* *(Alfik 2017, zad. 30)*\n    - A) środą\n    - B) czwartkiem\n    - C) piątkiem\n    - D) sobotą\n    - E) niedzielą\n    <details><summary>rozwiązanie<\/summary>E — niedzielą<br>Bieżący rok to 2017 — nie jest przestępny, ma 365 dni = 52 tygodnie i 1 dzień. Dzień 365. (31 grudnia) przypada więc w tym samym dniu tygodnia co 1 stycznia: w niedzielę. (W roku przestępnym byłby to poniedziałek, ale takiej odpowiedzi nie ma.)<\/details><br>\n25. Jeśli pierwszy dzień pewnego roku (nieprzestępnego) wypadł w czwartek, to ostatni dzień owego roku wypadnie: *(5 pkt)* *(Alfik 2016, zad. 21)*\n    - A) w środę\n    - B) w czwartek\n    - C) w piątek\n    - D) w sobotę\n    - E) w niedzielę\n    <details><summary>rozwiązanie<\/summary>B — w czwartek<br>Rok ma 365 dni = 52 tygodnie i 1 dzień. Ostatni dzień (365.) jest o 364 dni = dokładnie 52 tygodnie po pierwszym, więc to ten sam dzień tygodnia — czwartek.<\/details><br>\n26. W pewnym miesiącu wypadło 5 wtorków i 5 czwartków, ale tylko 4 piątki. Jakim dniem tygodnia zaczął się ten miesiąc? *(5 pkt)* *(Alfik 2016, zad. 25)*\n    - A) wtorkiem\n    - B) środą\n    - C) czwartkiem\n    - D) piątkiem\n    - E) sobotą\n    <details><summary>rozwiązanie<\/summary>A — wtorkiem<br>Miesiąc to 4 pełne tygodnie i 0–3 dodatkowe dni; 5 razy występują tylko dni „dodatkowe” z początku miesiąca. Muszą to być wtorek i czwartek, ale nie piątek — więc dodatkowe dni to wtorek, środa, czwartek. Miesiąc ma 31 dni i zaczyna się we wtorek.<\/details><br>\n\n## B. Zegar ze wskazówkami\n\nCała tarcza to 360°, a liczby od 1 do 12 dzielą ją na 12 części po 30°. Pamiętaj: wskazówka godzinowa też cały czas się przesuwa!\n\n27. Jaki kąt tworzą wskazówki zegara dokładnie o godzinie 5:00? *(3 pkt)*\n    - A) 100°\n    - B) 120°\n    - C) 135°\n    - D) 150°\n    - E) 155°\n    <details><summary>rozwiązanie<\/summary>D — 150°<br>Między dwiema sąsiednimi liczbami na tarczy jest 360° : 12 = 30°. O 5:00 wskazówka minutowa wskazuje 12, a godzinowa 5 — dzieli je 5 takich odstępów, czyli 5 · 30° = 150°.<\/details><br>\n28. Zegar Tomka spóźnia się o 3 minuty na każdą godzinę. Tomek ustawił go na dokładny czas o 8:00 rano. Jaką godzinę pokaże ten zegar, gdy naprawdę będzie 16:00? *(3 pkt)*\n    - A) 15:36\n    - B) 15:52\n    - C) 15:57\n    - D) 16:24\n    - E) 16:36\n    <details><summary>rozwiązanie<\/summary>A — 15:36<br>Od 8:00 do 16:00 mija 8 godzin. W każdej godzinie zegar „gubi” 3 minuty, razem 8 · 3 = 24 minuty. Pokaże więc 16:00 − 24 min = 15:36. Pułapka: zegar, który się spóźnia, pokazuje <b>wcześniejszą<\/b> godzinę niż prawdziwa, a nie późniejszą (16:24).<\/details><br>\n29. Zegarmistrz zmontował zegar tak, że jego wskazówki obracają się z właściwą prędkością, ale do tyłu. Jeśli o godzinie 8:30 zegarmistrz ustawił prawidłowy czas, to którą godzinę zegar będzie wskazywał w południe? *(3 pkt)* *(Alfik 2025, zad. 9)*\n    - A) 4:00\n    - B) 4:30\n    - C) 5:00\n    - D) 5:30\n    - E) 6:00\n    <details><summary>rozwiązanie<\/summary>C — 5:00<br>Od 8:30 do 12:00 mijają 3 i pół godziny. Zegar cofa się o tyle samo: 8:30 − 3 h 30 min = 5:00.<\/details><br>\n30. Jacek zaobserwował, że w trakcie wycieczki klasowej wskazówka minutowa zegara wykonała o 88 obrotów więcej niż wskazówka godzinowa. Ile dni trwała wycieczka? *(3 pkt)* *(Alfik 2023, zad. 10)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>B — 4<br>W ciągu 12 godzin minutowa robi 12 obrotów, a godzinowa 1 — różnica 11. 88 : 11 = 8, czyli 8 razy po 12 godzin = 96 godzin = 4 doby.<\/details><br>\n31. Ile obrotów wykona wskazówka minutowa zegara w czasie, w którym wskazówka godzinowa wykona dwa i pół obrotu? *(3 pkt)* *(Alfik 2022, zad. 2)*\n    - A) 12\n    - B) 15\n    - C) 18\n    - D) 24\n    - E) 30\n    <details><summary>rozwiązanie<\/summary>E — 30<br>Jeden obrót wskazówki godzinowej trwa 12 godzin, a w tym czasie minutowa robi 12 obrotów. Dwa i pół obrotu godzinowej to 2,5 · 12 = 30 obrotów minutowej.<\/details><br>\n32. Ile razy więcej obrotów wykona wskazówka minutowa zegara od wskazówki godzinowej w ciągu miesiąca? *(3 pkt)* *(Alfik 2018, zad. 10)*\n    - A) 6\n    - B) 12\n    - C) 14\n    - D) 24\n    - E) zależy od długości miesiąca\n    <details><summary>rozwiązanie<\/summary>B — 12<br>Przez każde 12 godzin wskazówka godzinowa robi 1 obrót, a minutowa 12 obrotów. Ten stosunek jest zawsze taki sam, niezależnie od długości miesiąca: 12 razy więcej.<\/details><br>\n33. Ile obrotów wykonuje wskazówka minutowa zegara w czasie, w którym wskazówka godzinowa wykonuje 2 obroty? *(3 pkt)* *(Alfik 2017, zad. 1)*\n    - A) 6\n    - B) 12\n    - C) 18\n    - D) 24\n    - E) 48\n    <details><summary>rozwiązanie<\/summary>D — 24<br>Wskazówka godzinowa robi jeden pełny obrót w 12 godzin, więc 2 obroty to 24 godziny. Wskazówka minutowa robi jeden obrót co godzinę, czyli w 24 godziny wykona 24 obroty.<\/details><br>\n34. Zegarmistrz zmontował zegar tak, że jego wskazówki przesuwają się z prawidłową prędkością, ale w odwrotnym kierunku („do tyłu”). Jeśli zegarmistrz ustawił prawidłowo zegar na godzinę 8:00, to którą godzinę zegar będzie wskazywał w południe? *(3 pkt)* *(Alfik 2015, zad. 1)*\n    - A) 4:00\n    - B) 6:00\n    - C) 8:00\n    - D) 10:00\n    - E) 12:00\n    <details><summary>rozwiązanie<\/summary>A — 4:00<br>Od 8:00 do południa mijają 4 godziny. Zegar „cofa się”, więc zamiast pójść 4 godziny do przodu, cofnie się o 4 godziny: 8 − 4 = 4. Pokaże 4:00.<\/details><br>\n35. Jaki kąt tworzą wskazówki zegara o godzinie 3:30? *(4 pkt)*\n    - A) 60°\n    - B) 75°\n    - C) 80°\n    - D) 90°\n    - E) 105°\n    <details><summary>rozwiązanie<\/summary>B — 75°<br>Wskazówka minutowa wskazuje 6. Godzinowa przez pół godziny przeszła połowę drogi od 3 do 4, czyli połowę z 30°, to jest 15°. Od 3 do 6 są 3 odstępy po 30°, czyli 90°, ale godzinowa jest już o 15° bliżej szóstki: 90° − 15° = 75°. Pułapka: 90° wychodzi, gdy myślimy, że godzinowa stoi dokładnie na 3.<\/details><br>\n36. Zegarmistrz omyłkowo zmontował mechanizm zegara w taki sposób, że jego wskazówki poruszały się z właściwą prędkością, ale do tyłu. Jeśli zegarmistrz ustawił prawidłową godzinę, to po jakim czasie nastąpi pierwszy moment, gdy zegar znów wskaże prawidłowy czas? *(4 pkt)* *(Alfik 2024, zad. 16)*\n    - A) po 3 godz.\n    - B) po 6 godz.\n    - C) po 9 godz.\n    - D) po 12 godz.\n    - E) po 24 godz.\n    <details><summary>rozwiązanie<\/summary>B — po 6 godz.<br>Prawdziwy czas idzie do przodu, a zegar tak samo szybko do tyłu, więc co godzinę „rozjeżdżają się” o 2 godziny. Spotkają się znów, gdy różnica wyniesie pełne 12 godzin tarczy, czyli po 12 : 2 = 6 godzinach. Np. ustawione na 12:00: po 6 h prawdziwa godzina to 6:00, a zegar cofnął się o 6 h — też wskazuje 6:00.<\/details><br>\n37. Zegarek Marka się popsuł i teraz wskazówki obracają się w nim z właściwą prędkością, ale „do tyłu”. Jeśli w południe Marek ustawił prawidłową godzinę, to którą godzinę wskaże jego zegarek o 16:30? *(4 pkt)* *(Alfik 2023, zad. 18)*\n    - A) 6:30\n    - B) 7:00\n    - C) 7:30\n    - D) 8:00\n    - E) 8:30\n    <details><summary>rozwiązanie<\/summary>C — 7:30<br>Od południa do 16:30 minęło 4 godziny 30 minut. Zegarek cofa się od 12:00 o 4 h 30 min: 12:00 → 8:00 → 7:30.<\/details><br>\n38. Ile razy w ciągu jednej doby (od 0:00 do 24:00) wskazówki zegara tworzą kąt prosty? *(5 pkt)*\n    - A) 22\n    - B) 24\n    - C) 44\n    - D) 48\n    - E) 96\n    <details><summary>rozwiązanie<\/summary>C — 44<br>W ciągu 12 godzin wskazówka minutowa dogania godzinową 11 razy (spotykają się o 12:00, potem około 1:05, 2:11 itd., aż znów o 12:00). Między dwoma spotkaniami minutowa „okrąża” godzinową, więc dokładnie 2 razy jest od niej o ćwierć obrotu — raz z jednej strony, raz z drugiej. To daje 11 · 2 = 22 kąty proste w 12 godzin, czyli 44 w ciągu doby. Pułapka: 48 wychodzi, gdy myślimy, że w każdej godzinie są 2 kąty proste — a np. między 2:00 a 4:00 są tylko 3 (około 2:27, o 3:00 i około 3:33).<\/details><br>\n39. Ile razy między godziną 9:00 a 15:00 zdarzy się sytuacja, w której wskazówki zegara (godzinowa i minutowa) pokryją się? *(5 pkt)* *(Alfik 2016, zad. 26)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 7\n    - E) 8\n    <details><summary>rozwiązanie<\/summary>B — 5<br>Wskazówki pokrywają się mniej więcej raz na godzinę, ale między 11 a 13 tylko raz (dokładnie o 12:00). Pokrycia: ok. 9:49, 10:55, 12:00, 13:05, 14:11 — razem 5. O 9:00 i 15:00 wskazówki się nie pokrywają.<\/details><br>\n40. Zegar na wieży wybija każdą pełną godzinę (wykonując od 1 do 12 uderzeń – tyle ile wynosi numer godziny), a ponadto bije 1 raz pół godziny po każdej pełnej godzinie. Spotkanie w ratuszu rozpoczęło się, gdy zegar uderzył 1 raz i zakończyło się również wtedy, gdy zegar uderzył 1 raz. W trakcie spotkania słychać było jeszcze 21 innych uderzeń. Ile trwało spotkanie? *(5 pkt)* *(Alfik 2015, zad. 21)*\n    - A) 2 godziny\n    - B) 3 godziny\n    - C) 4 godziny\n    - D) 5 godzin\n    - E) inna odpowiedź\n    <details><summary>rozwiązanie<\/summary>C — 4 godziny<br>Pojedyncze uderzenie słychać o każdej „wpół do” i o godzinie 1:00. Próbujemy różnych startów. Od 2:30 do 6:30 słychać: 3:00 (3), 3:30 (1), 4:00 (4), 4:30 (1), 5:00 (5), 5:30 (1), 6:00 (6) — razem 3 + 1 + 4 + 1 + 5 + 1 + 6 = 21 uderzeń. Pasuje też np. od 11:30 do 15:30: 12 + 1 + 1 + 1 + 2 + 1 + 3 = 21. Sprawdzenie wszystkich możliwości pokazuje, że spotkanie zawsze trwało 4 godziny.<\/details><br>\n\n## C. Zegar elektroniczny i upływ czasu\n\nZegar elektroniczny pokazuje godziny od 00:00 do 23:59. Nie każdy układ czterech cyfr jest prawdziwą godziną!\n\n41. Ile razy w ciągu doby zegar elektroniczny (od 00:00 do 23:59) pokazuje godzinę zapisaną czterema jednakowymi cyframi? *(3 pkt)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>A — 3<br>Pasują tylko 00:00, 11:11 i 22:22. Godziny 33:33, 44:44 itd. nie istnieją, bo godzin jest najwyżej 23.<\/details><br>\n42. Sto godzin po północy będzie godzina: *(3 pkt)* *(Alfik 2021, zad. 6)*\n    - A) 0:00\n    - B) 2:00\n    - C) 4:00\n    - D) 6:00\n    - E) 8:00\n    <details><summary>rozwiązanie<\/summary>C — 4:00<br>100 godzin = 4 doby (96 godzin) + 4 godziny. Po 4 pełnych dobach znów jest północ, a 4 godziny później — 4:00.<\/details><br>\n43. Zegar Zosi wskazuje godzinę 12:36, a zegar Antka wskazuje 12:38. Jeśli zegar Zosi spieszy o 2 minuty, to zegar Antka: *(3 pkt)* *(Alfik 2019, zad. 4)*\n    - A) spieszy o 4 minuty\n    - B) spieszy o 2 minuty\n    - C) chodzi prawidłowo\n    - D) spóźnia się o 4 minuty\n    - E) spóźnia się o 2 minuty\n    <details><summary>rozwiązanie<\/summary>A — spieszy o 4 minuty<br>Zegar Zosi spieszy o 2 minuty, więc naprawdę jest 12:34. Zegar Antka pokazuje 12:38, czyli o 4 minuty więcej niż prawdziwa godzina — spieszy o 4 minuty.<\/details><br>\n44. Ile kwadransów trwa półtoragodzinny film? *(3 pkt)* *(Alfik 2017, zad. 3)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 7\n    - E) 8\n    <details><summary>rozwiązanie<\/summary>C — 6<br>Półtorej godziny to 90 minut, a kwadrans to 15 minut. 90 : 15 = 6.<\/details><br>\n45. Ile czasu trwał blok reklamowy składający się z trzynastu 30-sekundowych reklam i dziewięciu 10-sekundowych spotów? *(3 pkt)* *(Alfik 2015, zad. 5)*\n    - A) 5 minut\n    - B) 6 minut\n    - C) 7 minut\n    - D) 8 minut\n    - E) 9 minut\n    <details><summary>rozwiązanie<\/summary>D — 8 minut<br>13 · 30 s = 390 s, 9 · 10 s = 90 s. Razem 480 s, a 480 : 60 = 8 minut.<\/details><br>\n46. Pociąg wyjechał z Gdańska o 22:47, a do Zakopanego dojechał następnego dnia o 6:15. Ile trwała podróż? *(4 pkt)*\n    - A) 7 h 28 min\n    - B) 7 h 32 min\n    - C) 8 h 28 min\n    - D) 8 h 32 min\n    - E) 16 h 32 min\n    <details><summary>rozwiązanie<\/summary>A — 7 h 28 min<br>Od 22:47 do północy (24:00) mija 1 h 13 min. Od północy do 6:15 mija 6 h 15 min. Razem 1 h 13 min + 6 h 15 min = 7 h 28 min. Pułapka: 16 h 32 min wychodzi z odejmowania 22:47 − 6:15, a to liczy czas „w drugą stronę”.<\/details><br>\n47. Godzina 12:21 na zegarze elektronicznym czyta się tak samo od lewej do prawej i od prawej do lewej. Ile takich „lustrzanych” godzin pokazuje ten zegar (od 00:00 do 23:59) w ciągu doby? *(4 pkt)*\n    - A) 12\n    - B) 14\n    - C) 15\n    - D) 16\n    - E) 24\n    <details><summary>rozwiązanie<\/summary>D — 16<br>Minuty to cyfry godziny zapisane w odwrotnej kolejności (13:31, 05:50). Minut jest najwyżej 59, więc druga cyfra godziny może być tylko 0, 1, 2, 3, 4 lub 5. Pasują godziny 00–05 (6 sztuk), 10–15 (6 sztuk) i 20–23 (4 sztuki): 6 + 6 + 4 = 16. Pułapka: 06:60 albo 19:91 nie są prawdziwymi godzinami.<\/details><br>\n48. Jeśli minutę temu zegarek Agaty, który spieszy o minutę, wskazywał godzinę 12:17, to za minutę zegarek Bartka, który spóźnia się o minutę, wskaże godzinę: *(4 pkt)* *(Alfik 2021, zad. 12)*\n    - A) 12:15\n    - B) 12:16\n    - C) 12:17\n    - D) 12:18\n    - E) 12:19\n    <details><summary>rozwiązanie<\/summary>C — 12:17<br>Minutę temu naprawdę była 12:16 (zegarek Agaty spieszy o minutę). Teraz jest 12:17, a za minutę będzie 12:18. Zegarek Bartka spóźnia się o minutę, więc pokaże 12:17.<\/details><br>\n49. Do północy zostało jeszcze dwa razy tyle czasu, ile upłynęło od południa. Która jest godzina? *(4 pkt)* *(Alfik 2021, zad. 15)*\n    - A) 13:00\n    - B) 14:00\n    - C) 15:00\n    - D) 16:00\n    - E) 17:00\n    <details><summary>rozwiązanie<\/summary>D — 16:00<br>Od południa do północy jest 12 godzin, podzielonych na 1 część (minęło) i 2 części (zostało) — razem 3 części. Jedna część to 12 : 3 = 4 godziny, więc jest 12:00 + 4 h = 16:00. Sprawdzenie: do północy zostało 8 h = 2 · 4 h.<\/details><br>\n50. Pociąg, którym Jaś przyjechał do Warszawy spóźnił się o 12 minut, a pociąg z Warszawy do Gdańska, na który miał się przesiąść odjechał z 5-minutowym opóźnieniem. Ile czasu miał Jaś na przesiadkę, jeśli według rozkładu powinien mieć 9 minut? *(4 pkt)* *(Alfik 2016, zad. 12)*\n    - A) 2 minuty\n    - B) 3 minuty\n    - C) 4 minuty\n    - D) 5 minut\n    - E) pociąg do Gdańska odjechał przed przyjazdem pociągu do Warszawy\n    <details><summary>rozwiązanie<\/summary>A — 2 minuty<br>Spóźnienie pierwszego pociągu „zjada” 12 minut z przesiadki, a opóźnienie drugiego dodaje 5 minut: 9 − 12 + 5 = 2 minuty.<\/details><br>\n51. Zegar elektroniczny pokazuje 20:26. Po ilu najmniej minutach zegar znów pokaże te same cztery cyfry 2, 0, 2, 6 (w dowolnej kolejności)? *(5 pkt)*\n    - A) 40\n    - B) 60\n    - C) 80\n    - D) 96\n    - E) 100\n    <details><summary>rozwiązanie<\/summary>E — 100<br>Z cyfr 2, 0, 2, 6 da się ułożyć tylko takie prawdziwe godziny: 02:26, 06:22, 20:26 i 22:06 (20:62 i 22:60 odpadają, bo minut jest najwyżej 59, a godzina 26 nie istnieje). Najbliższa po 20:26 jest 22:06. Od 20:26 do 22:06 mija 1 h 40 min, czyli 100 minut. Pułapka: 21:06 (po 40 minutach) ma cyfry 2, 1, 0, 6, a nie 2, 0, 2, 6.<\/details><br>\n52. Za ile godzin wybije północ, jeśli do północy zostało jeszcze trzy razy tyle czasu ile upłynęło od południa? *(5 pkt)* *(Alfik 2016, zad. 23)*\n    - A) 6\n    - B) 7\n    - C) 8\n    - D) 9\n    - E) 10\n    <details><summary>rozwiązanie<\/summary>D — 9<br>Od południa do północy jest 12 godzin, podzielonych w stosunku 1 : 3, czyli na 4 równe części po 3 godziny. Od południa minęły 3 godziny, do północy zostało 9.<\/details><br>\n53. Trzecia lekcja zaczyna się o 9:45. O której kończy się ósma lekcja, jeśli każda lekcja trwa 45 minut, a każda przerwa – 10 minut? *(5 pkt)* *(Alfik 2015, zad. 25)*\n    - A) 14:45\n    - B) 14:55\n    - C) 15:05\n    - D) 15:15\n    - E) 15:25\n    <details><summary>rozwiązanie<\/summary>C — 15:05<br>Od początku 3. do końca 8. lekcji jest 6 lekcji i 5 przerw między nimi: 6 · 45 + 5 · 10 = 270 + 50 = 320 minut = 5 h 20 min. 9:45 + 5 h 20 min = 15:05. Pułapka: doliczenie przerwy po ósmej lekcji.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. E — piątek\n2. D — 53\n3. B — 29 *(Alfik 2022, zad. 3)*\n4. C — czwartek *(Alfik 2021, zad. 1)*\n5. A — 26 *(Alfik 2015, zad. 3)*\n6. C — 1827\n7. B — sobota\n8. D — w piątek *(Alfik 2022, zad. 13)*\n9. D — 7 *(Alfik 2019, zad. 17)*\n10. E — 32 *(Alfik 2018, zad. 12)*\n11. C — 5 *(Alfik 2018, zad. 14)*\n12. E — w poniedziałek *(Alfik 2017, zad. 14)*\n13. A — 1 dzień *(Alfik 2015, zad. 19)*\n14. B — 2032\n15. C — sobota\n16. A — w środę *(Alfik 2024, zad. 25)*\n17. D — 4 *(Alfik 2023, zad. 30)*\n18. C — 53 *(Alfik 2022, zad. 27)*\n19. B — w piątek *(Alfik 2021, zad. 21)*\n20. D — 2024 *(Alfik 2019, zad. 22)*\n21. C — 15 *(Alfik 2019, zad. 23)*\n22. C — czwartek *(Alfik 2018, zad. 21)*\n23. A — 1 *(Alfik 2017, zad. 29)*\n24. E — niedzielą *(Alfik 2017, zad. 30)*\n25. B — w czwartek *(Alfik 2016, zad. 21)*\n26. A — wtorkiem *(Alfik 2016, zad. 25)*\n27. D — 150°\n28. A — 15:36\n29. C — 5:00 *(Alfik 2025, zad. 9)*\n30. B — 4 *(Alfik 2023, zad. 10)*\n31. E — 30 *(Alfik 2022, zad. 2)*\n32. B — 12 *(Alfik 2018, zad. 10)*\n33. D — 24 *(Alfik 2017, zad. 1)*\n34. A — 4:00 *(Alfik 2015, zad. 1)*\n35. B — 75°\n36. B — po 6 godz. *(Alfik 2024, zad. 16)*\n37. C — 7:30 *(Alfik 2023, zad. 18)*\n38. C — 44\n39. B — 5 *(Alfik 2016, zad. 26)*\n40. C — 4 godziny *(Alfik 2015, zad. 21)*\n41. A — 3\n42. C — 4:00 *(Alfik 2021, zad. 6)*\n43. A — spieszy o 4 minuty *(Alfik 2019, zad. 4)*\n44. C — 6 *(Alfik 2017, zad. 3)*\n45. D — 8 minut *(Alfik 2015, zad. 5)*\n46. A — 7 h 28 min\n47. D — 16\n48. C — 12:17 *(Alfik 2021, zad. 12)*\n49. D — 16:00 *(Alfik 2021, zad. 15)*\n50. A — 2 minuty *(Alfik 2016, zad. 12)*\n51. E — 100\n52. D — 9 *(Alfik 2016, zad. 23)*\n53. C — 15:05 *(Alfik 2015, zad. 25)*\n\n## Ściąga\n\n| Fakt | Do czego się przydaje |\n|---|---|\n| Tydzień = 7 dni | dzień tygodnia za N dni: reszta z N : 7 |\n| Rok zwykły = 365 dni = 52 tyg. + 1 dzień | 1 stycznia przesuwa się o 1 dzień tygodnia |\n| Rok przestępny = 366 dni = 52 tyg. + 2 dni | 1 stycznia przesuwa się o 2 dni tygodnia |\n| Rok przestępny: dzieli się przez 4 (pełne setki tylko gdy dzielą się przez 400: 2000 tak, 1900 nie) | 2020, 2024, 2028 są przestępne |\n| Miesiąc 30 dni: 2 dni tygodnia po 5 razy; 31 dni: 3 dni tygodnia po 5 razy | „ile piątków w miesiącu” |\n| Między liczbami na tarczy: 30° | kąt o pełnych godzinach = liczba odstępów · 30° |\n| Minutowa: 6° na minutę; godzinowa: ½° na minutę | kąty o godzinach typu 3:30, 9:20 |\n| Wskazówki pokrywają się 11 razy w 12 h; kąt prosty 22 razy w 12 h | zadania „ile razy w ciągu doby” |\n| Zegar elektroniczny: 00:00–23:59 | pierwsza cyfra minut ≤ 5, godziny ≤ 23 |\n"}, {"path": "zadania-wg-typu/02-liczby-i-cyfry.md", "id": "02-liczby-i-cyfry", "kind": "dzial", "short": "02 Liczby i cyfry", "md": "# 02. Liczby i cyfry\n\n**Dlaczego warto:** W każdym arkuszu Alfika są 2–4 zadania o cyfrach: suma albo iloczyn cyfr, palindromy, dopisywanie cyfr, „największa liczba, która…” czy numerowanie stron. Nie trzeba w nich dużo liczyć — trzeba za to porządnie wypisać wszystkie możliwości i żadnej nie zgubić.\n\n- **W pliku:** 42 zadań: 14 nowych i 28 z prawdziwych arkuszy Alfika (15 za 3 pkt, 15 za 4 pkt, 12 za 5 pkt).\n\n**Wskazówki**\n- Wypisuj możliwości **po kolei** (np. od najmniejszej pierwszej cyfry) — wtedy łatwo zauważyć, czy czegoś nie brakuje.\n- Pamiętaj o cyfrze 0: może stać w środku i na końcu liczby, ale nie na początku. A jeśli iloczyn cyfr ma być różny od 0, to zera w liczbie być nie może.\n- Najmniejsza liczba: jak najmniej cyfr, a na początku jak najmniejsza cyfra. Największa liczba: jak najwięcej cyfr, a na początku jak największa.\n- Dopisanie zera na końcu = pomnożenie liczby przez 10. Dopisanie cyfry na początku liczby dwucyfrowej = dodanie 100, 200, … .\n- Przy numerowaniu stron: strony 1–9 zużywają 9 cyfr, strony 10–99 zużywają 180 cyfr, razem 189.\n- Przy liczeniu, ile razy pisze się cyfrę, licz osobno miejsce jedności i miejsce dziesiątek.\n\n**Spis treści**\n\n- [A. Suma i iloczyn cyfr](#a-suma-i-iloczyn-cyfr)\n- [B. Palindromy i dopisywanie cyfr](#b-palindromy-i-dopisywanie-cyfr)\n- [C. Największa i najmniejsza liczba](#c-największa-i-najmniejsza-liczba)\n- [D. Liczenie cyfr i numerowanie stron](#d-liczenie-cyfr-i-numerowanie-stron)\n- [Klucz odpowiedzi](#klucz-odpowiedzi)\n- [Ściąga](#ściąga)\n\n---\n\n## A. Suma i iloczyn cyfr\n\nTu najważniejsze jest uporządkowane wypisywanie: najpierw ustal, jakie cyfry mogą wystąpić, a potem — na ile sposobów da się je ustawić.\n\n1. Ile jest liczb dwucyfrowych, których suma cyfr wynosi 9? *(3 pkt)*\n   - A) 8\n   - B) 9\n   - C) 10\n   - D) 11\n   - E) 18\n   <details><summary>rozwiązanie<\/summary>B — 9<br>Są to: 18, 27, 36, 45, 54, 63, 72, 81, 90 — razem 9 liczb. Pułapka: łatwo zapomnieć o 90 (zero też jest cyfrą), a 09 nie jest liczbą dwucyfrową.<\/details><br>\n2. Ile jest parzystych liczb dwucyfrowych o iloczynie cyfr równym 12? *(3 pkt)* *(Alfik 2021, zad. 3)*\n   - A) 2\n   - B) 3\n   - C) 4\n   - D) 5\n   - E) więcej niż 5\n   <details><summary>rozwiązanie<\/summary>B — 3<br>12 jako iloczyn dwóch cyfr: 2 · 6 lub 3 · 4. Liczby: 26, 62, 34, 43. Parzyste są 26, 62 i 34 — razem 3 (43 jest nieparzysta).<\/details><br>\n3. Ile jest takich liczb trzycyfrowych, w których cyfra setek jest dwa razy większa od cyfry dziesiątek, a cyfra dziesiątek – dwa razy większa od cyfry jedności? *(3 pkt)* *(Alfik 2019, zad. 2)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) 5\n   <details><summary>rozwiązanie<\/summary>B — 2<br>Cyfra setek jest 4 razy większa od cyfry jedności i musi być cyfrą (najwyżej 9). Jedności = 1 daje 421, jedności = 2 daje 842, a jedności = 3 dałyby setki 12 — za dużo. Jedności = 0 daje 000, a to nie jest liczba trzycyfrowa. Są więc 2 takie liczby.<\/details><br>\n4. Ile jest trzycyfrowych liczb o sumie cyfr równej 4? *(3 pkt)* *(Alfik 2019, zad. 9)*\n   - A) 5\n   - B) 6\n   - C) 7\n   - D) 8\n   - E) więcej niż 8\n   <details><summary>rozwiązanie<\/summary>E — więcej niż 8<br>Wypisujemy według cyfry setek: 1 → 103, 112, 121, 130 (4 liczby); 2 → 202, 211, 220 (3); 3 → 301, 310 (2); 4 → 400 (1). Razem 4 + 3 + 2 + 1 = 10, czyli więcej niż 8.<\/details><br>\n5. Ile jest takich liczb trzycyfrowych, których iloczyn cyfr jest mniejszy niż 3? *(3 pkt)* *(Alfik 2018, zad. 7)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) więcej niż 4\n   <details><summary>rozwiązanie<\/summary>E — więcej niż 4<br>Każda liczba z cyfrą 0 ma iloczyn cyfr równy 0, np. 100, 101, 102, 103, 110 — już 5 takich liczb. (Wszystkich jest aż 175.) Pułapka: zapomnieć o zerze i liczyć tylko 111, 112, 121, 211.<\/details><br>\n6. Ile jest takich liczb dwucyfrowych, których suma cyfr wynosi 3? *(3 pkt)* *(Alfik 2017, zad. 9)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) więcej niż 4\n   <details><summary>rozwiązanie<\/summary>C — 3<br>Cyfra dziesiątek może być 1, 2 lub 3: to liczby 12, 21 i 30. Pułapka: łatwo zapomnieć o 30 (zero też jest cyfrą).<\/details><br>\n7. Iloczyn cyfr pewnej liczby trzycyfrowej wynosi 12. Ile jest takich liczb trzycyfrowych? *(4 pkt)*\n   - A) 9\n   - B) 12\n   - C) 15\n   - D) 18\n   - E) 24\n   <details><summary>rozwiązanie<\/summary>C — 15<br>Zera nie może być (iloczyn byłby 0). 12 jako iloczyn trzech cyfr to: 1 · 2 · 6, 1 · 3 · 4 albo 2 · 2 · 3. Cyfry 1, 2, 6 da się ustawić na 6 sposobów (126, 162, 216, 261, 612, 621), cyfry 1, 3, 4 też na 6 sposobów, a cyfry 2, 2, 3 tylko na 3 sposoby (223, 232, 322), bo dwie dwójki są takie same. Razem 6 + 6 + 3 = 15. Pułapka: zapomnienie o 2 · 2 · 3 daje 12.<\/details><br>\n8. Ile jest liczb trzycyfrowych, w których suma cyfr jest równa iloczynowi cyfr? *(4 pkt)*\n   - A) 0\n   - B) 1\n   - C) 2\n   - D) 3\n   - E) 6\n   <details><summary>rozwiązanie<\/summary>E — 6<br>Zera być nie może (iloczyn byłby 0, a suma nie). Gdy wszystkie cyfry są co najmniej 2, iloczyn jest większy od sumy (2 · 2 · 2 = 8, a 2 + 2 + 2 = 6, a dla większych cyfr różnica jeszcze rośnie). Dwie jedynki też nie pasują: suma 1 + 1 + trzecia cyfra jest zawsze o 2 większa niż iloczyn 1 · 1 · trzecia cyfra. Zostaje jedna jedynka — próbując, znajdujemy 1 + 2 + 3 = 6 = 1 · 2 · 3. Cyfry 1, 2, 3 da się ustawić na 6 sposobów: 123, 132, 213, 231, 312, 321. Pułapka: odpowiedź 1 — zapominamy, że cyfry można przestawiać.<\/details><br>\n9. Ile jest takich liczb dwucyfrowych, które mają sumę cyfr równą 6, a iloczyn cyfr większy niż 6? *(4 pkt)* *(Alfik 2024, zad. 15)*\n   - A) 0\n   - B) 1\n   - C) 2\n   - D) 3\n   - E) 4\n   <details><summary>rozwiązanie<\/summary>D — 3<br>Liczby o sumie cyfr 6: 15, 24, 33, 42, 51, 60. Iloczyny: 5, 8, 9, 8, 5, 0. Większy niż 6 mają 24, 33 i 42 — to 3 liczby.<\/details><br>\n10. Jeśli liczbę, o której pomyślałem, pomnożę przez sumę jej cyfr, to otrzymam iloczyn 52. Jaka jest suma cyfr liczby, o której pomyślałem? *(4 pkt)* *(Alfik 2022, zad. 16)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>D — 4<br>Liczba musi być dzielnikiem 52: 1, 2, 4, 13, 26, 52. Sprawdzamy: 13 ma sumę cyfr 4, a 13 · 4 = 52. Pozostałe nie pasują (np. 26 · 8 = 208, 4 · 4 = 16).<\/details><br>\n11. Pewna liczba dwucyfrowa jest dokładnie 5 razy większa od sumy swoich cyfr. Jaka jest cyfra dziesiątek tej liczby? *(4 pkt)* *(Alfik 2018, zad. 18)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) inna odpowiedź\n    <details><summary>rozwiązanie<\/summary>D — 4<br>Liczba jest 5 razy większa od czegoś, więc dzieli się przez 5 — kończy się na 0 lub 5. Sprawdzamy: 45 ma sumę cyfr 9, a 5 · 9 = 45. Pasuje (i to jedyna taka liczba). Cyfra dziesiątek to 4.<\/details><br>\n12. Ile jest takich trzycyfrowych liczb, których iloczyn cyfr wynosi 9? *(4 pkt)* *(Alfik 2017, zad. 18)*\n    - A) 1\n    - B) 3\n    - C) 6\n    - D) 9\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>C — 6<br>9 jako iloczyn trzech cyfr: 1 · 1 · 9 albo 1 · 3 · 3. Z cyfr 1, 1, 9 są liczby 119, 191, 911, a z cyfr 1, 3, 3 — 133, 313, 331. Razem 6.<\/details><br>\n13. Jacek zapomniał czterocyfrowego PIN-u do swojego telefonu. Pamiętał jedynie, że cyfry były ustawione w kolejności rosnącej (od najmniejszej do największej), iloczyn wszystkich cyfr był równy 70, a suma – 15. Jaka była trzecia cyfra PIN-u? *(4 pkt)* *(Alfik 2016, zad. 15)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>D — 5<br>70 = 2 · 5 · 7, a czwarta cyfra musi być 1 (cyfry są różne, bo rosną). PIN to 1257: suma 1 + 2 + 5 + 7 = 15 — zgadza się. Trzecia cyfra to 5.<\/details><br>\n14. Ile jest liczb dwucyfrowych, które są 4 razy większe od sumy swoich cyfr? *(5 pkt)*\n    - A) 1\n    - B) 2\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>C — 4<br>Liczba dwucyfrowa to 10 razy cyfra dziesiątek plus cyfra jedności. Cztery razy suma cyfr to 4 razy cyfra dziesiątek plus 4 razy cyfra jedności. Gdy porównamy obie strony i „zabierzemy” to, co wspólne, zostaje: 6 razy cyfra dziesiątek = 3 razy cyfra jedności, czyli cyfra jedności jest 2 razy większa od cyfry dziesiątek. Pasują 12, 24, 36, 48 (przy cyfrze dziesiątek 5 cyfra jedności musiałaby wynosić 10 — a to nie jest cyfra). Sprawdzenie: 36 = 4 · (3 + 6).<\/details><br>\n15. Ile jest takich liczb dwucyfrowych, które są dokładnie 6 razy większe od swojej cyfry jedności? *(5 pkt)* *(Alfik 2025, zad. 23)*\n    - A) 0\n    - B) 1\n    - C) 2\n    - D) 3\n    - E) 4 lub więcej\n    <details><summary>rozwiązanie<\/summary>E — 4 lub więcej<br>Sprawdzamy: 12 = 6 · 2, 24 = 6 · 4, 36 = 6 · 6, 48 = 6 · 8. Działa, gdy cyfra jedności jest dwa razy większa od cyfry dziesiątek — są 4 takie liczby.<\/details><br>\n16. W każde swoje urodziny Ania porównuje sumę cyfr bieżącego roku z liczbą lat, które kończy. Wielokrotnie obie te liczby były równe, ale w ubiegłym roku równe nie były. Ile lat ma Ania, jeśli wiemy, że jest jeszcze niepełnoletnia? *(5 pkt)* *(Alfik 2023, zad. 29)*\n    - A) 7\n    - B) 10\n    - C) 12\n    - D) 15\n    - E) 16\n    <details><summary>rozwiązanie<\/summary>E — 16<br>Konkurs był w 2023 roku. W latach 2010–2019 suma cyfr roku rośnie co roku o 1 (od 3 do 12), tak jak wiek. Jeśli w 2010 Ania kończyła 3 lata (urodzona w 2007), to liczby były równe 10 razy, aż do 2019. W 2020 suma cyfr spada do 4, więc w 2022 już nie były równe. W 2023 Ania kończy 16 lat. Inne odpowiedzi nie pasują, np. przy 7 latach (rok 2016) liczby były równe także w 2022.<\/details><br>\n17. Ile jest takich liczb trzycyfrowych, których suma cyfr jest równa iloczynowi cyfr? *(5 pkt)* *(Alfik 2022, zad. 30)*\n    - A) 0\n    - B) 1\n    - C) 2\n    - D) 3\n    - E) 4 lub więcej\n    <details><summary>rozwiązanie<\/summary>E — 4 lub więcej<br>Cyfry 1, 2, 3: 1 + 2 + 3 = 6 i 1 · 2 · 3 = 6. Z tych cyfr można ułożyć 6 liczb: 123, 132, 213, 231, 312, 321. To już więcej niż 4 (a innych takich liczb trzycyfrowych nie ma).<\/details><br>\n18. Ile cyfr ma najmniejsza taka liczba, której cyfrą jedności jest 4, i której suma cyfr jest równa iloczynowi cyfr? *(5 pkt)* *(Alfik 2016, zad. 22)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) nie ma takiej liczby\n    <details><summary>rozwiązanie<\/summary>B — 4<br>Dwucyfrowa: a + 4 = 4 · a nie ma rozwiązania w cyfrach. Trzycyfrowa: sprawdzając cyfry (np. 1, 1, 4: suma 6, iloczyn 4; 1, 2, 4: suma 7, iloczyn 8) — żadna nie pasuje. Czterocyfrowa 1124: suma 1 + 1 + 2 + 4 = 8 i iloczyn 1 · 1 · 2 · 4 = 8. Najmniejsza taka liczba ma 4 cyfry.<\/details><br>\n19. Jaką cyfrę dziesiątek ma liczba dwucyfrowa, której iloczyn cyfr jest równy sumie cyfr? *(5 pkt)* *(Alfik 2015, zad. 23)*\n    - A) 4\n    - B) 3\n    - C) 2\n    - D) 1\n    - E) nie ma takiej liczby\n    <details><summary>rozwiązanie<\/summary>C — 2<br>To liczba 22: 2 · 2 = 4 i 2 + 2 = 4. Sprawdzając wszystkie liczby dwucyfrowe, innej takiej nie ma (np. dla cyfry 1 iloczyn jest zawsze mniejszy od sumy).<\/details><br>\n\n## B. Palindromy i dopisywanie cyfr\n\nPalindrom to liczba, która czyta się tak samo od lewej i od prawej, np. 727 albo 4554.\n\n20. Ile jest palindromów trzycyfrowych większych od 500? *(3 pkt)*\n    - A) 40\n    - B) 44\n    - C) 45\n    - D) 49\n    - E) 50\n    <details><summary>rozwiązanie<\/summary>E — 50<br>Pierwsza cyfra (taka sama jak ostatnia) może być 5, 6, 7, 8 lub 9 — 5 możliwości. Środkowa cyfra dowolna, od 0 do 9 — 10 możliwości. Razem 5 · 10 = 50. Najmniejszy z nich to 505, a on jest większy od 500.<\/details><br>\n21. Do pewnej liczby dwucyfrowej dopisano na końcu cyfrę 0. Nowa liczba jest o 252 większa od początkowej. Jaka była początkowa liczba? *(3 pkt)*\n    - A) 25\n    - B) 28\n    - C) 32\n    - D) 36\n    - E) 42\n    <details><summary>rozwiązanie<\/summary>B — 28<br>Dopisanie zera na końcu to pomnożenie liczby przez 10. Nowa liczba to 10 takich liczb, stara to 1 taka liczba, więc różnica to 9 takich liczb. 252 : 9 = 28. Sprawdzenie: 280 − 28 = 252.<\/details><br>\n22. Liczba palindromiczna to liczba, która czytana wprzód i wspak wygląda tak samo, np. 3223 lub 15251. Ile jest czterocyfrowych liczb palindromicznych o sumie cyfr równej 6? *(3 pkt)* *(Alfik 2022, zad. 6)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5 lub więcej\n    <details><summary>rozwiązanie<\/summary>C — 3<br>Czterocyfrowy palindrom ma postać abba, więc suma cyfr to 2 · (a + b) = 6, czyli a + b = 3. Cyfra a nie może być zerem: 1221, 2112, 3003. Są 3 takie liczby.<\/details><br>\n23. Liczba palindromiczna, to liczba, która czytana od lewej do prawej jest taka sama jak czytana od prawej do lewej, np. 343. Ile jest trzycyfrowych liczb palindromicznych o sumie cyfr równej 7? *(3 pkt)* *(Alfik 2021, zad. 10)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>B — 3<br>Palindrom trzycyfrowy ma postać „a b a”, więc suma cyfr to a + a + b = 7. a = 1 → b = 5 (151), a = 2 → b = 3 (232), a = 3 → b = 1 (313); dla a = 4 już za dużo. Razem 3.<\/details><br>\n24. Liczba palindromiczna to liczba, która czytana wprzód i wspak wygląda jednakowo, np. 2552. Ile lat o numerach palindromicznych wystąpiło w ciągu ostatnich stu lat? *(3 pkt)* *(Alfik 2016, zad. 5)*\n    - A) 0\n    - B) 1\n    - C) 2\n    - D) 3\n    - E) 4\n    <details><summary>rozwiązanie<\/summary>C — 2<br>W latach 1917–2016 palindromami są tylko 1991 i 2002. Następny będzie dopiero 2112.<\/details><br>\n25. Jaką najmniejszą liczbę trzeba dodać do 2026, aby otrzymać palindrom? *(4 pkt)*\n    - A) 76\n    - B) 86\n    - C) 96\n    - D) 106\n    - E) 186\n    <details><summary>rozwiązanie<\/summary>B — 86<br>Palindrom czterocyfrowy zaczynający się od 2 musi kończyć się na 2 i mieć dwie jednakowe cyfry w środku: 2002, 2112, 2222, … Liczba 2002 jest mniejsza od 2026, więc najbliższy większy palindrom to 2112. 2112 − 2026 = 86.<\/details><br>\n26. Liczba palindromiczna to liczba, która czytana wprzód wygląda tak samo jak czytana wspak, np. 242 lub 3553. Ile jest trzycyfrowych liczb palindromicznych o sumie cyfr 10? *(4 pkt)* *(Alfik 2024, zad. 18)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 9\n    - E) 10\n    <details><summary>rozwiązanie<\/summary>B — 5<br>Palindrom trzycyfrowy ma postać aba, a suma cyfr to a + b + a = 10. Pierwsza cyfra a może być 1, 2, 3, 4 lub 5 (dla 6 byłoby już 12 > 10): 181, 262, 343, 424, 505. To 5 liczb.<\/details><br>\n27. Liczbę 12345 chcemy zamienić w liczbę 34512, wykonując ruchy polegające na zamianie miejscami dwóch cyfr. Jaka jest najmniejsza liczba ruchów jaką musimy wykonać? *(4 pkt)* *(Alfik 2018, zad. 13)*\n    - A) 4 lub mniej\n    - B) 5\n    - C) 6\n    - D) 7\n    - E) 8 lub więcej\n    <details><summary>rozwiązanie<\/summary>A — 4 lub mniej<br>Każdym ruchem możemy postawić jedną cyfrę na właściwym miejscu: 12345 → 32145 → 34125 → 34521 → 34512. Wystarczą 4 ruchy (a ostatni ruch zawsze ustawia od razu dwie cyfry).<\/details><br>\n28. Liczba palindromiczna to taka liczba, która czytana od lewej do prawej i czytana od prawej do lewej wygląda tak samo, np. 3553 lub 727. Ile jest trzycyfrowych liczb palindromicznych o sumie cyfr równej 10? *(4 pkt)* *(Alfik 2017, zad. 11)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) więcej niż 4\n    <details><summary>rozwiązanie<\/summary>E — więcej niż 4<br>Palindrom trzycyfrowy ma postać „aba”, a suma cyfr to a + b + a. Pasują: 181, 262, 343, 424, 505 — to już 5 liczb (dla a = 6 suma przekracza 10).<\/details><br>\n29. Do liczby dwucyfrowej dopisano cyfrę 1 na początku i cyfrę 1 na końcu. Powstała liczba czterocyfrowa jest 23 razy większa od początkowej. Jaka była początkowa liczba? *(5 pkt)*\n    - A) 44\n    - B) 55\n    - C) 66\n    - D) 77\n    - E) 88\n    <details><summary>rozwiązanie<\/summary>D — 77<br>Liczba 1 _ _ 1 to 1000 + 1 + 10 razy nasza liczba, czyli 1001 + 10 razy nasza liczba. Ma to być 23 razy nasza liczba. Zatem 1001 to 23 − 10 = 13 razy nasza liczba: 1001 : 13 = 77. Sprawdzenie: 77 · 23 = 1771. Można też po prostu sprawdzić odpowiedzi: np. 1441 : 44 nie dzieli się bez reszty.<\/details><br>\n30. Pewna dwucyfrowa liczba zwiększa się 7-krotnie, jeśli między obie jej cyfry wstawimy zero (otrzymując liczbę trzycyfrową). Jaka jest suma cyfr tej liczby? *(5 pkt)* *(Alfik 2022, zad. 22)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>D — 6<br>Szukana liczba to 15: po wstawieniu zera mamy 105 = 7 · 15. Suma cyfr: 1 + 5 = 6. (Sprawdzenie wszystkich liczb dwucyfrowych pokazuje, że to jedyna taka liczba.)<\/details><br>\n31. Ile jest takich liczb dwucyfrowych, które zmniejszają się dokładnie 6 razy po usunięciu cyfry dziesiątek? *(5 pkt)* *(Alfik 2021, zad. 26)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) nie ma takich liczb\n    <details><summary>rozwiązanie<\/summary>D — 4<br>Po usunięciu cyfry dziesiątek zostaje cyfra jedności, a liczba ma być 6 razy większa od niej. Liczba = 10 · dziesiątki + jedności = 6 · jedności, więc 10 · dziesiątki = 5 · jedności, czyli jedności = 2 · dziesiątki. Pasują 12, 24, 36, 48 (12 = 6 · 2, 24 = 6 · 4, 36 = 6 · 6, 48 = 6 · 8). Razem 4.<\/details><br>\n32. Pewna liczba dwucyfrowa zwiększa się 5 razy, gdy na jej początku (jako cyfrę setek) dopiszemy cyfrę 1. Jaka jest cyfra jedności tej liczby? *(5 pkt)* *(Alfik 2019, zad. 30)*\n    - A) 2\n    - B) 3\n    - C) 5\n    - D) 6\n    - E) 8\n    <details><summary>rozwiązanie<\/summary>C — 5<br>Dopisanie jedynki z przodu dodaje 100. Nowa liczba to 5 razy stara, czyli dodaliśmy 4 razy starą liczbę: 4 · liczba = 100, więc liczba to 25 (125 = 5 · 25). Cyfra jedności to 5.<\/details><br>\n\n## C. Największa i najmniejsza liczba\n\nNajmniejsza liczba: jak najmniej cyfr i jak najmniejsza cyfra na początku. Największa liczba: jak najwięcej cyfr i jak największa cyfra na początku.\n\n33. Jaka jest najmniejsza liczba naturalna, której suma cyfr wynosi 30? *(3 pkt)*\n    - A) 3999\n    - B) 5799\n    - C) 6699\n    - D) 9993\n    - E) 39999\n    <details><summary>rozwiązanie<\/summary>A — 3999<br>Trzy cyfry dają najwyżej 9 + 9 + 9 = 27, a to za mało, więc potrzeba co najmniej 4 cyfr. Żeby liczba czterocyfrowa była jak najmniejsza, pierwsza cyfra ma być jak najmniejsza, a pozostałe jak największe: trzy dziewiątki dają 27, więc pierwsza cyfra to 30 − 27 = 3. Wynik: 3999.<\/details><br>\n34. Jaka jest największa liczba o różnych cyfrach, której suma cyfr wynosi 20? *(4 pkt)*\n    - A) 9821\n    - B) 98210\n    - C) 863210\n    - D) 953210\n    - E) 963110\n    <details><summary>rozwiązanie<\/summary>D — 953210<br>Im więcej cyfr, tym większa liczba. Siedem różnych cyfr ma sumę co najmniej 0 + 1 + 2 + 3 + 4 + 5 + 6 = 21, czyli za dużo — więc najwyżej 6 cyfr. Na początku chcemy 9; wtedy pięć pozostałych różnych cyfr musi dać 11, a jedyny sposób to 0, 1, 2, 3, 5. Ustawiamy malejąco: 953210. Pułapka: 963110 jest większa, ale ma dwie jedynki — cyfry się powtarzają.<\/details><br>\n35. Ile jest takich dwucyfrowych liczb, które po pomnożeniu przez 6 dają w wyniku liczbę dwucyfrową? *(4 pkt)* *(Alfik 2018, zad. 20)*\n    - A) 5\n    - B) 6\n    - C) 7\n    - D) 8\n    - E) więcej niż 8\n    <details><summary>rozwiązanie<\/summary>C — 7<br>Wynik ma być najwyżej 99, a 6 · 16 = 96, 6 · 17 = 102. Pasują liczby od 10 do 16 — jest ich 7.<\/details><br>\n36. Jaka jest najmniejsza liczba naturalna, której iloczyn cyfr wynosi 360? *(5 pkt)*\n    - A) 589\n    - B) 598\n    - C) 2459\n    - D) 3358\n    - E) 12589\n    <details><summary>rozwiązanie<\/summary>A — 589<br>Dwie cyfry dają iloczyn najwyżej 9 · 9 = 81, więc potrzeba co najmniej trzech. 360 dzieli się przez 5, a jedyna cyfra podzielna przez 5 (oprócz zera) to 5 — więc jedna cyfra to 5. Zostaje 360 : 5 = 72, a 72 jako iloczyn dwóch cyfr to tylko 8 · 9. Cyfry 5, 8, 9 ustawiamy od najmniejszej: 589. Pułapka: 2459 i 3358 też mają iloczyn cyfr 360, ale są czterocyfrowe, więc większe.<\/details><br>\n\n## D. Liczenie cyfr i numerowanie stron\n\nLicz osobno cyfry na miejscu jedności, dziesiątek i setek. Przy stronach książki dziel strony na jednocyfrowe, dwucyfrowe i trzycyfrowe.\n\n37. Ile razy trzeba napisać cyfrę 7, zapisując wszystkie liczby od 1 do 100? *(3 pkt)*\n    - A) 10\n    - B) 11\n    - C) 19\n    - D) 20\n    - E) 21\n    <details><summary>rozwiązanie<\/summary>D — 20<br>Siódemka jako cyfra jedności: 7, 17, 27, …, 97 — 10 razy. Siódemka jako cyfra dziesiątek: 70, 71, …, 79 — 10 razy. Razem 20. W liczbie 77 siódemkę piszemy dwa razy i obie są policzone. Pułapka: 19 to liczba <b>liczb<\/b> zawierających siódemkę, a pytamy o liczbę napisanych <b>cyfr<\/b>.<\/details><br>\n38. Ile jest wszystkich liczb dwucyfrowych? *(3 pkt)* *(Alfik 2018, zad. 4)*\n    - A) 89\n    - B) 90\n    - C) 91\n    - D) 99\n    - E) 100\n    <details><summary>rozwiązanie<\/summary>B — 90<br>Liczby od 10 do 99. Od 1 do 99 jest 99 liczb, odejmujemy 9 jednocyfrowych: 99 − 9 = 90.<\/details><br>\n39. Ile jedynek ma w swoim zapisie liczba *sto jedenaście milionów sto jedenaście*? *(3 pkt)* *(Alfik 2016, zad. 3)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>D — 6<br>Ta liczba to 111 000 111 — ma sześć jedynek (trzy w milionach i trzy w jednościach).<\/details><br>\n40. Do ponumerowania wszystkich stron książki (zaczynając od 1) zużyto 192 cyfry. Ile stron ma ta książka? *(4 pkt)*\n    - A) 96\n    - B) 99\n    - C) 100\n    - D) 101\n    - E) 192\n    <details><summary>rozwiązanie<\/summary>C — 100<br>Strony 1–9 to 9 cyfr. Strony 10–99 to 90 stron po 2 cyfry, czyli 180 cyfr. Razem 189 cyfr. Do 192 brakuje jeszcze 3 cyfr — to dokładnie jedna strona trzycyfrowa, strona 100.<\/details><br>\n41. Numerując wszystkie strony pewnej książki kolejnymi liczbami naturalnymi (zaczynając od numeru 1), zapisano łącznie 300 cyfr. Ile stron ma ta książka? *(4 pkt)* *(Alfik 2023, zad. 17)*\n    - A) 100\n    - B) 124\n    - C) 130\n    - D) 134\n    - E) 136\n    <details><summary>rozwiązanie<\/summary>E — 136<br>Strony 1–9 to 9 cyfr, strony 10–99 to 90 · 2 = 180 cyfr; razem 189. Zostaje 300 − 189 = 111 cyfr, czyli 111 : 3 = 37 stron trzycyfrowych: od 100 do 136.<\/details><br>\n42. Ola numeruje kolejne strony bardzo grubego zeszytu, zaczynając od 1. Na której stronie skończy, jeśli zużyje dokładnie 2026 cyfr? *(5 pkt)*\n    - A) 612\n    - B) 613\n    - C) 711\n    - D) 712\n    - E) nie da się zużyć dokładnie 2026 cyfr\n    <details><summary>rozwiązanie<\/summary>E — nie da się zużyć dokładnie 2026 cyfr<br>Strony 1–99 zużywają 189 cyfr. Na strony trzycyfrowe zostaje 2026 − 189 = 1837 cyfr. Każda strona trzycyfrowa zużywa 3 cyfry, a 1837 nie dzieli się przez 3 (1837 = 3 · 612 + 1). Po stronie 711 (to 612. strona trzycyfrowa) zużytych jest 2025 cyfr, a po stronie 712 — już 2028. Do stron czterocyfrowych nie dojdziemy, bo strony 1–999 to aż 2889 cyfr. Pułapka: 612 to liczba stron trzycyfrowych, a nie numer ostatniej strony.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. B — 9\n2. B — 3 *(Alfik 2021, zad. 3)*\n3. B — 2 *(Alfik 2019, zad. 2)*\n4. E — więcej niż 8 *(Alfik 2019, zad. 9)*\n5. E — więcej niż 4 *(Alfik 2018, zad. 7)*\n6. C — 3 *(Alfik 2017, zad. 9)*\n7. C — 15\n8. E — 6\n9. D — 3 *(Alfik 2024, zad. 15)*\n10. D — 4 *(Alfik 2022, zad. 16)*\n11. D — 4 *(Alfik 2018, zad. 18)*\n12. C — 6 *(Alfik 2017, zad. 18)*\n13. D — 5 *(Alfik 2016, zad. 15)*\n14. C — 4\n15. E — 4 lub więcej *(Alfik 2025, zad. 23)*\n16. E — 16 *(Alfik 2023, zad. 29)*\n17. E — 4 lub więcej *(Alfik 2022, zad. 30)*\n18. B — 4 *(Alfik 2016, zad. 22)*\n19. C — 2 *(Alfik 2015, zad. 23)*\n20. E — 50\n21. B — 28\n22. C — 3 *(Alfik 2022, zad. 6)*\n23. B — 3 *(Alfik 2021, zad. 10)*\n24. C — 2 *(Alfik 2016, zad. 5)*\n25. B — 86\n26. B — 5 *(Alfik 2024, zad. 18)*\n27. A — 4 lub mniej *(Alfik 2018, zad. 13)*\n28. E — więcej niż 4 *(Alfik 2017, zad. 11)*\n29. D — 77\n30. D — 6 *(Alfik 2022, zad. 22)*\n31. D — 4 *(Alfik 2021, zad. 26)*\n32. C — 5 *(Alfik 2019, zad. 30)*\n33. A — 3999\n34. D — 953210\n35. C — 7 *(Alfik 2018, zad. 20)*\n36. A — 589\n37. D — 20\n38. B — 90 *(Alfik 2018, zad. 4)*\n39. D — 6 *(Alfik 2016, zad. 3)*\n40. C — 100\n41. E — 136 *(Alfik 2023, zad. 17)*\n42. E — nie da się zużyć dokładnie 2026 cyfr\n\n## Ściąga\n\n| Fakt | Przykład |\n|---|---|\n| Liczb dwucyfrowych jest 90 (10–99), trzycyfrowych 900 (100–999) | |\n| Palindromów trzycyfrowych jest 9 · 10 = 90 | 101, 111, …, 999 |\n| Trzy różne cyfry ustawisz na 6 sposobów, trzy cyfry z dwiema takimi samymi — na 3 | 126, 162, 216, 261, 612, 621 / 223, 232, 322 |\n| Dopisanie 0 na końcu = mnożenie przez 10 | 28 → 280 |\n| Dopisanie cyfry 1 na początku liczby dwucyfrowej = dodanie 100 | 28 → 128 |\n| Numerowanie stron: 1–9 → 9 cyfr, 1–99 → 189 cyfr, 1–999 → 2889 cyfr | |\n| Od 1 do 100 każda cyfra 1–9 pojawia się 20 razy (cyfra 1 — 21 razy, przez 100) | cyfra 7: 20 razy |\n| Najmniejsza liczba o danej sumie cyfr: na końcu same dziewiątki, reszta z przodu | suma 30 → 3999 |\n| Najmniejsza liczba o danym iloczynie cyfr: jak najmniej cyfr (duże cyfry 9, 8), ustawione rosnąco | iloczyn 360 → 589 |\n"}, {"path": "zadania-wg-typu/03-podzielnosc-i-reszty.md", "id": "03-podzielnosc-i-reszty", "kind": "dzial", "short": "03 Podzielność i reszty", "md": "# 03. Podzielność i reszty\n\n**Dlaczego warto:** W każdym arkuszu Alfika jest kilka zadań, w których pomaga podzielność: cechy podzielności przez 3, 4, 5, 9, liczenie wielokrotności, wspólne wielokrotności („kiedy znów razem?”), reszty z dzielenia i ostatnia cyfra wyniku. Kto zna cechy podzielności i sztuczkę „dodaj 1, żeby reszta zniknęła”, rozwiązuje takie zadania w minutę.\n\n- **W pliku:** 47 zadań: 14 nowych i 33 z prawdziwych arkuszy Alfika (18 za 3 pkt, 14 za 4 pkt, 15 za 5 pkt).\n\n**Wskazówki**\n- Cechy podzielności: przez 3 i przez 9 — patrz na **sumę cyfr**; przez 4 — na **dwie ostatnie cyfry**; przez 5 — ostatnia cyfra 0 lub 5; przez 6 — parzysta i podzielna przez 3; przez 12 — przez 4 i przez 3.\n- Ile wielokrotności liczby 6 jest od 1 do 100? Podziel 100 : 6 i weź wynik bez reszty: 16.\n- „Przez 4 lub przez 6”: dodaj obie grupy, a potem odejmij te liczby, które policzyłeś dwa razy (podzielne przez obie).\n- „Kiedy znów razem?” — szukasz najmniejszej wspólnej wielokrotności. „Jak najwięcej jednakowych paczek?” — szukasz największego wspólnego dzielnika.\n- Gdy przy każdym dzieleniu brakuje 1 do pełnej grupy (reszta 5 z dzielenia przez 6, reszta 7 z dzielenia przez 8…), dodaj 1 — wtedy wszystko dzieli się bez reszty.\n- Ostatnia cyfra wyniku mnożenia zależy tylko od ostatnich cyfr mnożonych liczb. Ostatnie cyfry kolejnych potęg powtarzają się co 4.\n\n**Spis treści**\n\n- [A. Cechy podzielności](#a-cechy-podzielności)\n- [B. Wielokrotności i wspólne dzielniki](#b-wielokrotności-i-wspólne-dzielniki)\n- [C. Dzielenie z resztą](#c-dzielenie-z-resztą)\n- [D. Ostatnia cyfra i zera na końcu](#d-ostatnia-cyfra-i-zera-na-końcu)\n- [Klucz odpowiedzi](#klucz-odpowiedzi)\n- [Ściąga](#ściąga)\n\n---\n\n## A. Cechy podzielności\n\nCechy podzielności pozwalają sprawdzić, czy liczba dzieli się przez 3, 4, 5, 9…, bez wykonywania dzielenia.\n\n1. W liczbie 52□4 w miejsce □ wpisano cyfrę tak, że powstała liczba podzielna przez 9. Jaka to cyfra? *(3 pkt)*\n   - A) 1\n   - B) 3\n   - C) 7\n   - D) 8\n   - E) 9\n   <details><summary>rozwiązanie<\/summary>C — 7<br>Liczba dzieli się przez 9, gdy jej suma cyfr dzieli się przez 9. Bez brakującej cyfry suma to 5 + 2 + 4 = 11. Do 18 brakuje 7, a do 27 brakowałoby 16 — za dużo na jedną cyfrę. Więc cyfra to 7: 5274 : 9 = 586.<\/details><br>\n2. Ile jest cyfr, które można wpisać w miejsce □ w liczbie 41□6, żeby otrzymać liczbę podzielną przez 4? *(3 pkt)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) 5\n   <details><summary>rozwiązanie<\/summary>E — 5<br>Liczba dzieli się przez 4, gdy liczba utworzona z jej dwóch ostatnich cyfr dzieli się przez 4. Sprawdzamy □6: 16, 36, 56, 76, 96 dzielą się przez 4, a 06, 26, 46, 66, 86 — nie. Pasują cyfry 1, 3, 5, 7, 9, czyli 5 cyfr. Pułapka: to, że liczba jest parzysta, jeszcze nie wystarcza do podzielności przez 4.<\/details><br>\n3. Suma 5 liczb dwucyfrowych wynosi 100. Ile najwięcej liczb nieparzystych może być wśród tych pięciu liczb? *(3 pkt)* *(Alfik 2025, zad. 8)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) 5\n   <details><summary>rozwiązanie<\/summary>D — 4<br>Suma nieparzystej liczby liczb nieparzystych jest nieparzysta, a 100 jest parzyste — więc liczb nieparzystych musi być parzyście wiele: 5 odpada. 4 się da: 11 + 11 + 11 + 11 + 56 = 100.<\/details><br>\n4. Znając cyfrę jedności i cyfrę dziesiątek liczby trzycyfrowej nie można jednoznacznie ustalić, czy liczba ta jest podzielna przez: *(3 pkt)* *(Alfik 2024, zad. 8)*\n   - A) 2\n   - B) 3\n   - C) 4\n   - D) 5\n   - E) 10\n   <details><summary>rozwiązanie<\/summary>B — 3<br>Podzielność przez 2, 5 i 10 zależy tylko od cyfry jedności, a przez 4 — od dwóch ostatnich cyfr. Podzielność przez 3 zależy od sumy WSZYSTKICH cyfr, więc bez cyfry setek nie da się jej ustalić (np. 112 nie dzieli się przez 3, a 312 — tak).<\/details><br>\n5. Z czterech spośród poniższych cyfr można ułożyć (wykorzystując każdą cyfrę raz) czterocyfrową liczbę podzielną przez 9. Której cyfry nie użyjemy? *(3 pkt)* *(Alfik 2024, zad. 9)*\n   - A) 0\n   - B) 1\n   - C) 2\n   - D) 3\n   - E) 4\n   <details><summary>rozwiązanie<\/summary>B — 1<br>Liczba dzieli się przez 9, gdy suma jej cyfr dzieli się przez 9. Wszystkie cyfry 0 + 1 + 2 + 3 + 4 dają 10. Żeby zostało 9, musimy pominąć cyfrę 1 — np. 4320 dzieli się przez 9.<\/details><br>\n6. Ile jest takich trzycyfrowych liczb podzielnych przez 9, które można ułożyć z cyfr 2, 3, 4 (wykorzystując każdą cyfrę najwyżej raz)? *(3 pkt)* *(Alfik 2023, zad. 8)*\n   - A) 2\n   - B) 3\n   - C) 4\n   - D) 6\n   - E) 7\n   <details><summary>rozwiązanie<\/summary>D — 6<br>Liczba trzycyfrowa z różnych cyfr 2, 3, 4 musi zawierać wszystkie trzy. Suma cyfr 2 + 3 + 4 = 9, więc każda taka liczba dzieli się przez 9. Ułożeń jest 3 · 2 · 1 = 6: 234, 243, 324, 342, 423, 432.<\/details><br>\n7. Której z poniższych liczb nie można przedstawić jako sumy dwóch liczb nieparzystych? *(3 pkt)* *(Alfik 2019, zad. 7)*\n   - A) 24\n   - B) 28\n   - C) 32\n   - D) 36\n   - E) 39\n   <details><summary>rozwiązanie<\/summary>E — 39<br>Nieparzysta + nieparzysta = zawsze liczba parzysta. 39 jest nieparzyste, więc nie da się go tak zapisać. Pozostałe da się, np. 24 = 1 + 23.<\/details><br>\n8. Suma pewnych 13 liczb naturalnych (niekoniecznie różnych) jest równa 100. Ile najwięcej liczb nieparzystych może być wśród tych liczb? *(3 pkt)* *(Alfik 2017, zad. 2)*\n   - A) 9\n   - B) 10\n   - C) 11\n   - D) 12\n   - E) 13\n   <details><summary>rozwiązanie<\/summary>D — 12<br>Suma nieparzystej liczby liczb nieparzystych jest nieparzysta, a 100 jest parzyste — więc liczb nieparzystych musi być parzyście wiele. Wszystkie 13 odpada, ale 12 się da: dwanaście jedynek i liczba 88 (12 + 88 = 100).<\/details><br>\n9. Suma trzynastu liczb całkowitych jest równa 100. Ile najwięcej spośród tych liczb może być liczbami nieparzystymi? *(3 pkt)* *(Alfik 2016, zad. 4)*\n   - A) 9\n   - B) 10\n   - C) 11\n   - D) 12\n   - E) 13\n   <details><summary>rozwiązanie<\/summary>D — 12<br>Suma nieparzystej liczby liczb nieparzystych jest nieparzysta, a 100 jest parzyste — więc liczb nieparzystych musi być parzyście wiele, najwyżej 12. Przykład: dwanaście jedynek i liczba 88.<\/details><br>\n10. Ile jest dwucyfrowych liczb nieparzystych (dodatnich)? *(3 pkt)* *(Alfik 2016, zad. 10)*\n    - A) 40\n    - B) 44\n    - C) 45\n    - D) 46\n    - E) 50\n    <details><summary>rozwiązanie<\/summary>C — 45<br>Liczb dwucyfrowych jest 90 (od 10 do 99), a nieparzysta jest co druga: 90 : 2 = 45.<\/details><br>\n11. Ile jest liczb trzycyfrowych podzielnych przez 5, których suma cyfr wynosi 10? *(4 pkt)*\n    - A) 9\n    - B) 10\n    - C) 13\n    - D) 14\n    - E) 15\n    <details><summary>rozwiązanie<\/summary>D — 14<br>Ostatnia cyfra to 0 albo 5. Gdy na końcu jest 0, pierwsze dwie cyfry dają sumę 10: 190, 280, 370, 460, 550, 640, 730, 820, 910 — to 9 liczb. Gdy na końcu jest 5, pierwsze dwie cyfry dają sumę 5: 145, 235, 325, 415, 505 — to 5 liczb (055 nie jest trzycyfrowa). Razem 9 + 5 = 14. Pułapka: 9 — gdy zapomnimy o liczbach kończących się na 5.<\/details><br>\n12. Ile jest takich trzycyfrowych liczb podzielnych przez 9, których cyfrą dziesiątek jest 9? *(4 pkt)* *(Alfik 2021, zad. 14)*\n    - A) 8\n    - B) 9\n    - C) 10\n    - D) 90\n    - E) więcej niż 90\n    <details><summary>rozwiązanie<\/summary>C — 10<br>Suma cyfr musi dzielić się przez 9, więc cyfra setek + cyfra jedności = 9 lub 18. Suma 9: 198, 297, 396, 495, 594, 693, 792, 891, 990 (9 liczb). Suma 18: tylko 999. Razem 10. Pułapka: łatwo zapomnieć o 999 lub o 990.<\/details><br>\n13. W liczbie 7□3□ w miejsca □ wpisano cyfry (mogą być takie same lub różne) tak, że powstała liczba podzielna przez 12. Ile różnych liczb można w ten sposób otrzymać? *(5 pkt)*\n    - A) 6\n    - B) 7\n    - C) 8\n    - D) 9\n    - E) 10\n    <details><summary>rozwiązanie<\/summary>B — 7<br>Liczba dzieli się przez 12, gdy dzieli się i przez 4, i przez 3. Przez 4: dwie ostatnie cyfry 3□ muszą tworzyć 32 albo 36. Przez 3: suma cyfr musi dzielić się przez 3. Gdy końcówka to 32, suma to 7 + 3 + 2 = 12 plus brakująca cyfra, więc ta cyfra to 0, 3, 6 lub 9 (4 liczby). Gdy końcówka to 36, suma to 16 plus brakująca cyfra, więc cyfra to 2, 5 lub 8 (3 liczby). Razem 4 + 3 = 7.<\/details><br>\n14. Iloczyn 5 liczb (naturalnych) wynosi 120, a ich suma jest liczbą nieparzystą. Ile liczb parzystych jest wśród tych pięciu liczb? *(5 pkt)* *(Alfik 2019, zad. 25)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>B — 2<br>120 = 2 · 2 · 2 · 15, więc parzystych liczb może być 1, 2 albo 3. Suma pięciu liczb jest nieparzysta, gdy liczb nieparzystych jest nieparzyście wiele. 1 parzysta → 4 nieparzyste (suma parzysta), 3 parzyste → 2 nieparzyste (suma parzysta), 2 parzyste → 3 nieparzyste (suma nieparzysta). Przykład: 2 · 4 · 1 · 3 · 5 = 120, suma 15.<\/details><br>\n15. Suma pewnych pięciu liczb dwucyfrowych jest liczbą nieparzystą, a ich iloczyn jest liczbą parzystą, niepodzielną przez 8. Ile spośród tych pięciu liczb jest liczbami parzystymi? *(5 pkt)* *(Alfik 2018, zad. 28)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>B — 2<br>Suma jest nieparzysta, więc liczb nieparzystych jest nieparzyście wiele (1, 3 lub 5), czyli parzystych: 4, 2 lub 0. Iloczyn jest parzysty, więc 0 odpada. Cztery liczby parzyste dają iloczyn podzielny przez 2 · 2 · 2 · 2 = 16, a więc i przez 8 — też odpada. Zostają 2 liczby parzyste (np. 10 · 14 · 11 · 13 · 15 — iloczyn dzieli się przez 4, ale nie przez 8).<\/details><br>\n\n## B. Wielokrotności i wspólne dzielniki\n\nWielokrotności liczby 6 to 6, 12, 18, … Wspólne wielokrotności dwóch liczb to te liczby, które są na obu listach.\n\n16. Ile liczb od 1 do 100 dzieli się przez 6? *(3 pkt)*\n    - A) 16\n    - B) 17\n    - C) 18\n    - D) 20\n    - E) 25\n    <details><summary>rozwiązanie<\/summary>A — 16<br>100 : 6 = 16 reszty 4. Wielokrotności szóstki to 6, 12, …, 96 — jest ich 16, bo 16 · 6 = 96, a 17 · 6 = 102 to już więcej niż 100.<\/details><br>\n17. Ile jest takich ułamków nieskracalnych, których licznik i mianownik to liczby jednocyfrowe o sumie 12? *(3 pkt)* *(Alfik 2025, zad. 3)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>B — 2<br>Pary cyfr o sumie 12: 3 i 9, 4 i 8, 5 i 7, 6 i 6 (w obu kolejnościach). 3/9, 4/8, 6/6 i odwrotności 9/3, 8/4 da się skrócić. Nieskracalne są tylko 5/7 i 7/5 — dwa ułamki.<\/details><br>\n18. Ile jest nieskracalnych ułamków, których licznik jest dodatnią liczbą jednocyfrową, a mianownik jest o 2 większy od licznika? *(3 pkt)* *(Alfik 2024, zad. 3)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5 lub więcej\n    <details><summary>rozwiązanie<\/summary>E — 5 lub więcej<br>Ułamki to 1/3, 2/4, 3/5, 4/6, 5/7, 6/8, 7/9, 8/10, 9/11. Gdy licznik jest parzysty, mianownik też jest parzysty i ułamek da się skrócić przez 2. Gdy licznik jest nieparzysty, licznik i mianownik różnią się o 2 i nie mają wspólnego dzielnika. Zostaje 1/3, 3/5, 5/7, 7/9, 9/11 — to 5 ułamków.<\/details><br>\n19. Największy wspólny dzielnik dwóch liczb jednocyfrowych wynosi 2, a ich najmniejsza wspólna wielokrotność to 12. Ile wynosi suma tych dwóch liczb? *(3 pkt)* *(Alfik 2023, zad. 2)*\n    - A) 10\n    - B) 12\n    - C) 14\n    - D) 16\n    - E) 24\n    <details><summary>rozwiązanie<\/summary>A — 10<br>Obie liczby są parzyste i dzielą 12: to mogą być 2, 4, 6. Pasują 4 i 6: NWD = 2, NWW = 12. Suma 4 + 6 = 10. (2 i 6 mają NWW 6, a 2 i 4 mają NWD 2, ale NWW 4.)<\/details><br>\n20. Ile jest dwucyfrowych wielokrotności liczby 11? *(3 pkt)* *(Alfik 2022, zad. 10)*\n    - A) 6\n    - B) 7\n    - C) 8\n    - D) 9\n    - E) 10\n    <details
