okaj za drzwiami), kiedy sobie car z wielkim księciem gadali:\n>\n> „Gdzie się owa piękna Angielka podziała, lat szesnaście, niewinna, płocha, jak śnieg biała?...”\n>\n> Ha!\n>\n> Sędzia śledczy nie umie tak zmienić głosu w sztylet, torturując pytaniami zbrodniarza! Gdyby nie drobne zajście, car bowiem pobił za kulisami wielkiego księcia, łotr ten bowiem ukradł mu bokobrody, żywot tego teatru byłby pełen wieczystej chwały…”\n\n***Pamiętaj! Wszystkie pytania odnoszą się do powyższego tekstu!***\n\n## Pytania za 3 punkty\n\n1. Tekst powyższy ma charakter: *(3 pkt)*\n   - A) sprawozdania\n   - B) wspomnienia\n   - C) streszczenia\n   - D) komedii\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — wspomnienia<br>Dorosły autor opowiada o tym, co przeżył jako uczeń („Już w klasie drugiej… zagraliśmy”, „nigdy już w życiu nie odczułem”). Opowieść o własnej przeszłości to wspomnienie. Pułapka: w tekście mowa o *Zemście*, która jest komedią, ale sam tekst komedią nie jest — nie ma podziału na role i dialogów.<\/details><br>\n2. Z kontekstu wypowiedzi można wywnioskować, że akcja dzieje się: *(3 pkt)*\n   - A) w przyszłości\n   - B) w dawnych czasach\n   - C) w świecie fantastycznym\n   - D) w budynku teatru\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — w dawnych czasach<br>Narrator wspomina dzieciństwo, a kolega jest „dziś” sławnym profesorem — minęło wiele lat. Mowa też o „owym czasie” i o lokaju. Pułapka: przedstawienie odbyło się nie w teatrze, tylko „w najmilszym domu rodziców jednego z moich kolegów”.<\/details><br>\n3. W tekście osobą mówiącą jest: *(3 pkt)*\n   - A) dziecko\n   - B) narrator – uczestnik wydarzeń\n   - C) podmiot liryczny\n   - D) narrator wszechwiedzący\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — narrator – uczestnik wydarzeń<br>Narrator mówi „zagraliśmy”, „graliśmy”, „odczułem” — sam grał w tym teatrzyku. Pułapka: w wydarzeniach brał udział jako dziecko, ale opowiada o nich jako dorosły. Podmiot liryczny występuje w wierszach, a to jest proza.<\/details><br>\n4. Wydarzenia przedstawione w tekście: *(3 pkt)*\n   - A) są całkowicie wymyślone\n   - B) przypuszczalnie miały miejsce w rzeczywistości\n   - C) nie mogły wydarzyć się w rzeczywistości\n   - D) musiały w rzeczywistości mieć całkowicie inny przebieg\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — przypuszczalnie miały miejsce w rzeczywistości<br>To wspomnienia pisarza z jego szkolnych lat we Lwowie; nie ma w nich nic nieprawdopodobnego. Autor mógł coś ubarwić dla żartu, dlatego „przypuszczalnie”, a nie „na pewno”.<\/details><br>\n5. O wydarzeniach mówiący opowiada: *(3 pkt)*\n   - A) z przymrużeniem oka\n   - B) ze smutkiem\n   - C) relacjonując bez emocji przebieg wypadków\n   - D) nie znając zakończenia opowiadanej historii\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — z przymrużeniem oka<br>„Z przymrużeniem oka” znaczy żartobliwie, z humorem. Autor śmieje się z dziecięcego teatrzyku: „Bogowie zapewne do dziś wspominają”, „Całemu towarzystwu groziło wyłysienie”, car ukradł bokobrody.<\/details><br>\n6. Zdanie ***(…) zagraliśmy Zemstę (...) w najmilszym domu rodziców jednego z moich kolegów (…)*** świadczy o: *(3 pkt)*\n   - A) poczuciu humoru mówiącego\n   - B) rozżaleniu mówiącego\n   - C) sympatii mówiącego do kolegi i jego rodziny\n   - D) tym, że mówiący był człowiekiem samotnym\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — sympatii mówiącego do kolegi i jego rodziny<br>Słowo „najmilszym” pokazuje, że narrator ciepło wspomina ten dom i ludzi, którzy w nim mieszkali.<\/details><br>\n7. Sformułowanie ***Słowo honoru daję na to!*** padające na początku tekstu sugeruje, że narrator: *(3 pkt)*\n   - A) świadczy o niepewności mówiącego\n   - B) poddaje w wątpliwość wygłaszane opinie\n   - C) chce, żeby odbiorca mu uwierzył w coś, co może wydawać się nieprawdopodobne\n   - D) narrator wie, że wszyscy mu uwierzą\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — chce, żeby odbiorca mu uwierzył w coś, co może wydawać się nieprawdopodobne<br>Drugoklasiści grający poważną sztukę to rzecz trudna do uwierzenia, więc narrator zapewnia „słowem honoru”. Pułapka: gdyby był pewien, że wszyscy mu uwierzą (D), nie musiałby niczego przysięgać.<\/details><br>\n8. Stwierdzenie ***boskie przedstawienie najlepszego w owym czasie zespołu teatralnego w tym mieście***: *(3 pkt)*\n   - A) jest opinią uznanego autorytetu\n   - B) wyraża powszechne przekonanie\n   - C) jest wynikiem trzeźwej oceny\n   - D) nie może być rozumiane dosłownie\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — nie może być rozumiane dosłownie<br>Teatrzyk dzieci w prywatnym mieszkaniu nie był najlepszym zespołem w mieście. Autor żartuje i celowo przesadza.<\/details><br>\n9. Powodem rozpadu trupy teatralnej: *(3 pkt)*\n   - A) były problemy sercowe\n   - B) był niski poziom aktorstwa\n   - C) były różnice poglądów na temat sztuki\n   - D) były problemy finansowe\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — były problemy sercowe<br>Tekst mówi wprost: „Rozleciał się on z tego prostego powodu, żeśmy się wszyscy kochali w trzynastoletniej artystce”.<\/details><br>\n10. Największą zaletą premiery ***Kordiana***: *(3 pkt)*\n    - A) były role kobiece\n    - B) był brak kobiet w obsadzie\n    - C) był udział w jego wystawieniu pięknej Klary\n    - D) była rola głównego bohatera\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — był brak kobiet w obsadzie<br>Chłopcy grali „sceny z *Kordiana* bez kobiet” właśnie po to, żeby nikt się już nie kłócił o „artystkę”. Pułapka: Klara przestała grać, więc C odpada.<\/details><br>\n\n## Pytania za 4 punkty\n\n11. Wielki książę i car podczas spektaklu: *(4 pkt)*\n    - A) pobili się na scenie\n    - B) kłócili się, ale wyłącznie w ramach swoich ról\n    - C) za bardzo zaangażowali się w swoje role\n    - D) pobili się, ale na szczęście nie na scenie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — pobili się, ale na szczęście nie na scenie<br>W tekście: „car bowiem pobił za kulisami wielkiego księcia”. Za kulisami, czyli poza sceną. Pułapka: A — bójka była, ale nie na scenie.<\/details><br>\n12. Publicznością ***najlepszego teatru w mieście***: *(4 pkt)*\n    - A) były najważniejsze osoby w mieście\n    - B) byli szkolni koledzy\n    - C) byli najbliżsi i domownicy\n    - D) mógł być każdy, kto kupił bilet\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — byli najbliżsi i domownicy<br>Narrator wylicza widzów w nawiasie: „mama, siostra, kucharka i lokaj za drzwiami”.<\/details><br>\n13. Zdanie ***Takiej prawdy wzruszenia nigdy już w życiu nie odczułem w teatrze:*** *(4 pkt)*\n    - A) jest nieszczere\n    - B) świadczy o tym, że młodzi aktorzy rzeczywiście przeżywali swoje występy\n    - C) wyraża opinię wyraźnie przesadzoną\n    - D) krytycznie ocenia teraźniejszość autora\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — świadczy o tym, że młodzi aktorzy rzeczywiście przeżywali swoje występy<br>Dzieci grały całym sercem — „prawda wzruszenia” to szczere, prawdziwe przeżywanie roli. Uwaga: cały tekst jest żartobliwy, więc odpowiedź C (przesada) też wydaje się sensowna; organizator uznał jednak B.<\/details><br>\n14. W kontekście przywołanego tekstu zdanie ***Całemu towarzystwu groziło wyłysienie***: *(4 pkt)*\n    - A) ma charakter dramatyczny\n    - B) brzmi groźnie\n    - C) brzmi humorystycznie\n    - D) stanowi poważne ostrzeżenie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — brzmi humorystycznie<br>Chodzi o to, że chłopcy wyrywali sobie włosy podczas kłótni o dziewczynę. Wyłysienie dzieci w teatrzyku to żart, nie prawdziwe zagrożenie.<\/details><br>\n15. W wypowiedzeniu ***żywot tego teatru byłby pełen wieczystej chwały:*** *(4 pkt)*\n    - A) brak cech stylu potocznego\n    - B) występują wyrazy potoczne\n    - C) nie ma podmiotu\n    - D) wszystkie rzeczowniki mają formę mianownika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — brak cech stylu potocznego<br>„Żywot”, „wieczysta chwała” to słowa podniosłe, uroczyste, a nie potoczne (codzienne). Pułapka C: podmiot jest — to „żywot”. Pułapka D: „teatru” i „chwały” są w dopełniaczu.<\/details><br>\n16. Wyraz ***wieczystej*** jest: *(4 pkt)*\n    - A) liczebnikiem\n    - B) przymiotnikiem\n    - C) zaimkiem\n    - D) przyimkiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — przymiotnikiem<br>Przymiotnik określa cechę rzeczownika i odpowiada na pytania jaki? jaka? jakie? — chwały jakiej? wieczystej.<\/details><br>\n17. Wyraz ***najmilszym***: *(4 pkt)*\n    - A) jest przysłówkiem\n    - B) nie odmienia się przez przypadki\n    - C) jest przymiotnikiem\n    - D) nie podlega stopniowaniu\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest przymiotnikiem<br>„Najmilszym” to przymiotnik „miły” w stopniu najwyższym (miły – milszy – najmilszy), w miejscowniku: w najmilszym domu. Pułapka D: właśnie widać, że się stopniuje.<\/details><br>\n18. W wypowiedzeniu ***wszyscy kochali (się) w trzynastoletniej artystce:*** *(4 pkt)*\n    - A) podmiot nie jest wyrażony rzeczownikiem\n    - B) brak podmiotu\n    - C) podmiot jest domyślny\n    - D) podmiotem jest rzeczownik w mianowniku\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — podmiot nie jest wyrażony rzeczownikiem<br>Podmiot odpowiada na pytanie kto? co? — kto kochał? „wszyscy”. „Wszyscy” to zaimek, nie rzeczownik. Pułapka C: podmiot jest wypowiedziany w zdaniu, więc nie jest domyślny.<\/details><br>\n19. Podkreślony wyraz w sformułowaniu ***<u>głośnego<\/u> dziś uczonego*** oznacza: *(4 pkt)*\n    - A) hałaśliwego\n    - B) sławnego\n    - C) poważnego\n    - D) mądrego\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — sławnego<br>„Głośny” uczony to taki, o którym dużo się mówi, czyli znany, sławny. Pułapka A: „głośny” zwykle znaczy „hałaśliwy”, ale tu ma znaczenie przenośne.<\/details><br>\n20. ***Niesnaski*** to: *(4 pkt)*\n    - A) spory\n    - B) rozmowy\n    - C) zabawy\n    - D) śmiesznostki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — spory<br>Niesnaski to drobne kłótnie, nieporozumienia. W tekście po nich „odtwórca Wacława miał w garści kosmyk płowych włosów” — czyli doszło do bójki.<\/details><br>\n\n## Pytania za 5 punktów\n\n21. Czasownikiem w bezokoliczniku jest wyraz: *(5 pkt)*\n    - A) torturując\n    - B) garść\n    - C) zmienić\n    - D) pobił\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — zmienić<br>Bezokolicznik to podstawowa forma czasownika, zakończona na -ć, -c lub -ść (co robić? co zrobić?). Pułapka A: „torturując” to imiesłów, nie bezokolicznik; „garść” kończy się na -ść, ale to rzeczownik.<\/details><br>\n22. ***Rozrzewnienie*** to inaczej: *(5 pkt)*\n    - A) rozbawienie\n    - B) zdenerwowanie\n    - C) dokładność\n    - D) wzruszenie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — wzruszenie<br>Rozrzewnienie to wzruszenie, rozczulenie (wspominać z rozrzewnieniem — ze wzruszeniem, z łezką w oku).<\/details><br>\n23. Podkreślony wyraz w sformułowaniu ***kosmyk <u>płowych<\/u> włosów***: *(5 pkt)*\n    - A) odnosi się do koloru włosów\n    - B) określa stan owłosienia\n    - C) nazywa typ fryzury\n    - D) wskazuje na długość włosów\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — odnosi się do koloru włosów<br>„Płowy” to jasnożółty, wyblakły, słomkowy kolor (płowe włosy — jasne jak słoma).<\/details><br>\n24. W wyrazie ***słowo***: *(5 pkt)*\n    - A) jest tylko jedna samogłoska\n    - B) jest jedna sylaba\n    - C) występują trzy spółgłoski\n    - D) więcej jest samogłosek niż spółgłosek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — występują trzy spółgłoski<br>S-ł-o-w-o: spółgłoski s, ł, w (trzy), samogłoski o, o (dwie). Są więc dwie sylaby (sło-wo), bo w wyrazie jest tyle sylab, ile samogłosek.<\/details><br>\n25. Wyrazem czterosylabowym jest słowo: *(5 pkt)*\n    - A) najmilszym\n    - B) kochali\n    - C) lwowskiego\n    - D) zagraliśmy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — zagraliśmy<br>Za-gra-li-śmy — cztery sylaby. Naj-mil-szym, ko-cha-li i lwow-skie-go mają po trzy. Pułapka: w „lwowskiego” litera i po k tylko zmiękcza, nie tworzy osobnej sylaby.<\/details><br>\n26. Cudzysłów w powyższym tekście wyodrębnia: *(5 pkt)*\n    - A) cytat\n    - B) tytuł\n    - C) słowa mające odmienne znaczenie od dosłownego\n    - D) wyrazy potoczne\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — cytat<br>W cudzysłowie są słowa cara z *Kordiana* Juliusza Słowackiego: „Gdzie się owa piękna Angielka podziała…”. Przytoczone dokładnie cudze słowa to cytat. Tytuły w tym tekście są zapisane kursywą, nie w cudzysłowie.<\/details><br>\n27. Wyraz ***nam***: *(5 pkt)*\n    - A) nie odmienia się przez przypadki\n    - B) jest zaimkiem\n    - C) jest rzeczownikiem\n    - D) ma dwie samogłoski\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest zaimkiem<br>„Nam” to celownik zaimka „my” (my, nas, nam, nas, nami, o nas) — zastępuje rzeczownik. Ma jedną samogłoskę (a) i odmienia się przez przypadki.<\/details><br>\n28. Rzeczownikiem nie jest wyraz: *(5 pkt)*\n    - A) przedstawieniem\n    - B) wymiany\n    - C) teatralnego\n    - D) wzruszenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — teatralnego<br>„Teatralny” to przymiotnik — odpowiada na pytanie jaki? (zespołu jakiego? teatralnego). Przedstawienie, wymiana i wzruszenie to rzeczowniki (kto? co?).<\/details><br>\n29. Podkreślone wyrazy w sformułowaniu ***<u>uczonego<\/u> i <u>profesora<\/u>***: *(5 pkt)*\n    - A) są w różnych przypadkach\n    - B) są rzeczownikami\n    - C) należą do nieodmiennych części mowy\n    - D) mają różne ilości sylab\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — są rzeczownikami<br>„Uczony” to tu osoba (naukowiec), tak jak „profesor” — oba nazywają ludzi, więc są rzeczownikami. Oba są w dopełniaczu i mają po cztery sylaby (u-czo-ne-go, pro-fe-so-ra). Pułapka: „uczony” wygląda jak przymiotnik, ale tu nazywa osobę.<\/details><br>\n30. Sformułowanie ***zawracała w głowie*** oznacza: *(5 pkt)*\n    - A) okłamywała\n    - B) wodziła za nos\n    - C) rozkochiwała w sobie\n    - D) dokuczała\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — rozkochiwała w sobie<br>„Zawracać komuś w głowie” to sprawiać, że ktoś się zakochuje, traci dla kogoś głowę. Pułapka B: „wodzić za nos” znaczy oszukiwać, zwodzić — to inny frazeologizm.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. B — wspomnienia\n2. B — w dawnych czasach\n3. B — narrator – uczestnik wydarzeń\n4. B — przypuszczalnie miały miejsce w rzeczywistości\n5. A — z przymrużeniem oka\n6. C — sympatii mówiącego do kolegi i jego rodziny\n7. C — chce, żeby odbiorca mu uwierzył w coś, co może wydawać się nieprawdopodobne\n8. D — nie może być rozumiane dosłownie\n9. A — były problemy sercowe\n10. B — był brak kobiet w obsadzie\n11. D — pobili się, ale na szczęście nie na scenie\n12. C — byli najbliżsi i domownicy\n13. B — świadczy o tym, że młodzi aktorzy rzeczywiście przeżywali swoje występy\n14. C — brzmi humorystycznie\n15. A — brak cech stylu potocznego\n16. B — przymiotnikiem\n17. C — jest przymiotnikiem\n18. A — podmiot nie jest wyrażony rzeczownikiem\n19. B — sławnego\n20. A — spory\n21. C — zmienić\n22. D — wzruszenie\n23. A — odnosi się do koloru włosów\n24. C — występują trzy spółgłoski\n25. D — zagraliśmy\n26. A — cytat\n27. B — jest zaimkiem\n28. C — teatralnego\n29. B — są rzeczownikami\n30. C — rozkochiwała w sobie\n"}, {"path": "humanistyczny/klasa-5/testy-probne/test-1.md", "id": "hum5/test-1", "kind": "test", "short": "Test próbny 1", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Test próbny 1\n\n<div class=\"test\" data-minuty=\"45\" data-start=\"30\"><\/div>\n\n**Test próbny** ułożony jak arkusz Alfika Humanistycznego dla klasy 5: tekst, 30 pytań, 45 minut. Na start masz 30 pkt, za błędną odpowiedź tracisz ¼ punktów pytania. Odpowiedź E znaczy: żadna z odpowiedzi A–D nie jest poprawna.\n\n## Tekst\n\n**Janusz Korczak, _Król Maciuś Pierwszy_ (fragment)**\n\n> Wcale niełatwo nauczyć się gwizdać, jeśli nie ma nikogo, kto by pokazał. Ale Maciuś miał silną wolę, więc się nauczył.\n>\n> I gwizdnął.\n>\n> Gwizdnął tylko na próbę, żeby się przekonać, czy umie. I jakież było jego zdumienie, gdy w chwilę później stanął przed nim wyciągnięty jak struna — Felek we własnej osobie.\n>\n> — Jakeś ty się tu dostał?\n>\n> — Przelazłem przez kratę.\n>\n> W ogrodzie królewskim rosły bardzo gęste maliny. Więc tam ukrył się król Maciuś ze swym przyjacielem, żeby się naradzić, co dalej robić.\n>\n> — Słuchaj Felku, jestem bardzo nieszczęśliwym królem. Od czasu kiedy nauczyłem się pisać, podpisuję wszystkie papiery, nazywa się, że rządzę całym państwem, a właściwie robię to, co mi każą, a każą mi robić same nudne rzeczy i zabraniają wszystkiego, co przyjemne.\n>\n> — A któż waszej królewskiej mości zabrania i rozkazuje?\n>\n> — Ministrowie — powiedział Maciuś. — Kiedy był tatuś, robiłem, co on kazał.\n>\n> — No tak, byłeś wówczas królewską wysokością, następcą tronu, a tatuś twój był jego królewską mością — królem. — Ale teraz…\n>\n> — Właśnie teraz jest stokroć gorzej. Tych ministrów jest cała kupa.\n>\n> — Wojskowi czy cywile?\n>\n> — Jeden jest tylko wojskowy, minister wojny.\n>\n> — A reszta cywile?\n>\n> — Ja nie wiem, co znaczy cywile.\n>\n> — Cywile — to tacy, którzy nie noszą mundurów i szabel.\n>\n> — No tak, cywile.\n>\n> Felek włożył do ust pełną garść malin i głęboko się zamyślił. Po czym powoli i z pewnym wahaniem zapytał:\n>\n> — Czy w ogrodzie królewskim są wiśnie?\n>\n> Zdziwiło Maciusia to pytanie, ale że miał do Felka duże zaufanie, więc wyznał, że są wiśnie i gruszki i obiecał, że będzie przez kratę podawał je Felkowi, ile ten tylko zapragnie.\n\nŹródło tekstu: [Wolne Lektury](https://wolnelektury.pl/katalog/lektura/krol-macius-pierwszy/).\n\n## Pytania za 3 punkty\n\n1. Przedstawiony fragment pochodzi z: *(3 pkt)*\n   - A) powieści\n   - B) wiersza\n   - C) dramatu\n   - D) reportażu\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — powieści<br>Tekst jest napisany prozą (nie ma wersów ani rymów), ma narratora, bohaterów i dialogi. „Król Maciuś Pierwszy” to powieść. Dramat ma tylko kwestie postaci i wskazówki dla aktorów, bez narratora.<\/details><br>\n2. W przedstawionym fragmencie przeważa: *(3 pkt)*\n   - A) opis przyrody\n   - B) list\n   - C) dialog\n   - D) sprawozdanie\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — dialog<br>Większość tekstu to rozmowa Maciusia z Felkiem — kwestie zaczynają się od myślnika. Opisu jest tylko kilka zdań.<\/details><br>\n3. Rozmowa chłopców odbywa się: *(3 pkt)*\n   - A) w sali tronowej\n   - B) w gabinecie ministra\n   - C) na ulicy przed pałacem\n   - D) w gęstych malinach w królewskim ogrodzie\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — w gęstych malinach w królewskim ogrodzie<br>„W ogrodzie królewskim rosły bardzo gęste maliny. Więc tam ukrył się król Maciuś ze swym przyjacielem”.<\/details><br>\n4. Felek dostał się do ogrodu: *(3 pkt)*\n   - A) przez bramę\n   - B) przez kratę\n   - C) z pomocą strażnika\n   - D) podkopem pod parkanem\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — przez kratę<br>Felek sam mówi: „Przelazłem przez kratę”.<\/details><br>\n5. Felek zjawił się przy Maciusiu, gdy ten: *(3 pkt)*\n   - A) gwizdnął\n   - B) napisał do niego list\n   - C) zawołał go przez okno\n   - D) zaczął płakać\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — gwizdnął<br>Maciuś gwizdnął „na próbę” i „w chwilę później stanął przed nim (…) Felek”.<\/details><br>\n6. Z tekstu wynika, że Maciuś nauczył się gwizdać: *(3 pkt)*\n   - A) od Felka\n   - B) bardzo szybko i łatwo\n   - C) od ministra wojny\n   - D) sam, bo miał silną wolę\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — sam, bo miał silną wolę<br>Nie było nikogo, „kto by pokazał”, „ale Maciuś miał silną wolę, więc się nauczył”. Pułapka: B — w tekście jest „wcale niełatwo”.<\/details><br>\n7. Maciuś czuje się nieszczęśliwym królem, ponieważ: *(3 pkt)*\n   - A) nie umie jeszcze pisać\n   - B) ministrowie każą mu nosić mundur\n   - C) musi robić nudne rzeczy, a przyjemnych mu zabraniają\n   - D) Felek nie chce się z nim przyjaźnić\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — musi robić nudne rzeczy, a przyjemnych mu zabraniają<br>Maciuś mówi: „każą mi robić same nudne rzeczy i zabraniają wszystkiego, co przyjemne”. Pisać już umie — podpisuje papiery.<\/details><br>\n8. Maciuś i Felek ukryli się w malinach, żeby: *(3 pkt)*\n   - A) najeść się malin\n   - B) pobawić się w wojsko\n   - C) uciec z pałacu\n   - D) napisać list do ministrów\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>W tekście: ukryli się, „żeby się naradzić, co dalej robić”. Tej odpowiedzi nie ma wśród A–D. Pułapka: Felek je maliny, ale nie po to chłopcy się schowali.<\/details><br>\n9. Z rozmowy wynika, że ojciec Maciusia: *(3 pkt)*\n   - A) jest ministrem wojny\n   - B) był królem\n   - C) zabraniał Maciusiowi gwizdać\n   - D) jest cywilem\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — był królem<br>Felek mówi: „tatuś twój był jego królewską mością — królem”. Teraz królem jest Maciuś.<\/details><br>\n10. Narrator tego fragmentu: *(3 pkt)*\n    - A) jest Maciusiem\n    - B) jest Felkiem\n    - C) jest jednym z ministrów\n    - D) nie bierze udziału w wydarzeniach\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — nie bierze udziału w wydarzeniach<br>Narrator opowiada o chłopcach w trzeciej osobie („Maciuś miał silną wolę”, „Felek włożył do ust”), a nie o sobie. „Ja” mówią tylko bohaterowie w dialogu.<\/details><br>\n\n## Pytania za 4 punkty\n\n11. Z tekstu nie dowiemy się: *(4 pkt)*\n    - A) jak Felek dostał się do ogrodu\n    - B) co znaczy słowo „cywile”\n    - C) ilu dokładnie ministrów ma Maciuś\n    - D) jakie owoce rosną w królewskim ogrodzie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — ilu dokładnie ministrów ma Maciuś<br>Maciuś mówi tylko, że ministrów jest „cała kupa”, a wojskowy jest jeden. Pozostałe informacje w tekście są: Felek przelazł przez kratę, Felek wyjaśnia słowo „cywile”, a w ogrodzie rosną maliny, wiśnie i gruszki.<\/details><br>\n12. Sformułowanie ***stanął przed nim wyciągnięty jak struna*** oznacza, że Felek: *(4 pkt)*\n    - A) stanął wyprostowany jak żołnierz na baczność\n    - B) był bardzo zmęczony\n    - C) położył się na trawie\n    - D) przyniósł instrument muzyczny\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — stanął wyprostowany jak żołnierz na baczność<br>Napięta struna jest prosta jak linijka. Felek stanął przed królem prosto, jak żołnierz przed dowódcą. To porównanie, a nie mowa o prawdziwej strunie.<\/details><br>\n13. Maciuś nie wiedział: *(4 pkt)*\n    - A) kto mu rozkazuje\n    - B) czy w ogrodzie rosną wiśnie\n    - C) który minister jest wojskowy\n    - D) co znaczy słowo „cywile”\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — co znaczy słowo „cywile”<br>Maciuś przyznaje: „Ja nie wiem, co znaczy cywile”. Wie natomiast, że rozkazują mu ministrowie, że wojskowy jest minister wojny i że w ogrodzie są wiśnie.<\/details><br>\n14. Felek zwraca się do Maciusia: *(4 pkt)*\n    - A) tylko na „ty”, jak do kolegi\n    - B) raz jak do króla, a raz na „ty”, jak do kolegi\n    - C) tylko „wasza królewska mość”\n    - D) przez „pan”\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — raz jak do króla, a raz na „ty”, jak do kolegi<br>Felek pyta: „A któż waszej królewskiej mości zabrania” — to zwrot do króla. Ale zaraz potem mówi: „byłeś wówczas królewską wysokością”, „tatuś twój” — to zwracanie się na „ty”.<\/details><br>\n15. Pytanie Felka o wiśnie: *(4 pkt)*\n    - A) ucieszyło Maciusia\n    - B) rozgniewało Maciusia\n    - C) zdziwiło Maciusia\n    - D) przestraszyło Maciusia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — zdziwiło Maciusia<br>W tekście wprost: „Zdziwiło Maciusia to pytanie”. Mimo to Maciuś obiecał podawać Felkowi owoce przez kratę.<\/details><br>\n16. Wyrażenie ***cała kupa*** w zdaniu ***Tych ministrów jest cała kupa*** znaczy: *(4 pkt)*\n    - A) bardzo dużo\n    - B) dokładnie dwóch\n    - C) niewielu\n    - D) stos papierów\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — bardzo dużo<br>„Cała kupa” to potoczne wyrażenie znaczące „mnóstwo, bardzo dużo”. Maciuś narzeka, że ministrów jest tak wielu.<\/details><br>\n17. Wyraz ***stokroć*** w zdaniu ***Właśnie teraz jest stokroć gorzej*** można zastąpić wyrażeniem: *(4 pkt)*\n    - A) trochę\n    - B) tak samo\n    - C) wcale nie\n    - D) o wiele\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — o wiele<br>„Stokroć” to dosłownie „sto razy”. Maciuś nie liczy dokładnie, tylko podkreśla, że teraz jest o wiele gorzej niż za życia taty.<\/details><br>\n18. W zdaniu ***Przelazłem przez kratę***: *(4 pkt)*\n    - A) nie ma orzeczenia\n    - B) jest podmiot domyślny\n    - C) podmiotem jest wyraz *kratę*\n    - D) są dwa przyimki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest podmiot domyślny<br>Orzeczenie to „przelazłem”. Kto przelazł? — ja. Wyrazu „ja” nie ma w zdaniu, ale poznajemy go po końcówce „-łem”, więc to podmiot domyślny. „Kratę” odpowiada na pytanie co?, ale jest w bierniku, a nie w mianowniku, więc nie jest podmiotem. Przyimek jest jeden: przez.<\/details><br>\n19. Wyraz ***kratę*** w zdaniu z pyt. 18. ma formę: *(4 pkt)*\n    - A) mianownika\n    - B) dopełniacza\n    - C) biernika\n    - D) narzędnika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — biernika<br>Biernik odpowiada na pytania kogo? co? (widzę): przez co? — przez kratę. Mianownik to „krata”, dopełniacz „kraty”, narzędnik „kratą”.<\/details><br>\n20. Wyrazem nieodmiennym jest: *(4 pkt)*\n    - A) królem\n    - B) maliny\n    - C) nauczył\n    - D) ministrów\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Wszystkie podane wyrazy się odmieniają: „królem”, „maliny” i „ministrów” to rzeczowniki (król, króla…), a „nauczył” to czasownik (nauczyłem, nauczyła…). Nieodmienne są np. przyimki, spójniki i przysłówki, takie jak „bardzo”.<\/details><br>\n\n## Pytania za 5 punktów\n\n21. Podkreślony wyraz w zdaniu ***W ogrodzie królewskim rosły bardzo gęste <u>maliny<\/u>*** jest: *(5 pkt)*\n    - A) orzeczeniem\n    - B) podmiotem\n    - C) dopełnieniem\n    - D) przydawką\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — podmiotem<br>Orzeczenie to „rosły”. Kto? co rosło? — maliny. To podmiot. Pułapka: podmiot stoi tu na samym końcu zdania.<\/details><br>\n22. W zdaniu z pyt. 21.: *(5 pkt)*\n    - A) są trzy rzeczowniki\n    - B) nie ma przysłówka\n    - C) są dwa czasowniki\n    - D) są dwa przymiotniki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — są dwa przymiotniki<br>Przymiotniki to „królewskim” (w jakim ogrodzie?) i „gęste” (jakie maliny?). Rzeczowniki są dwa (ogrodzie, maliny), czasownik jeden (rosły), a „bardzo” to przysłówek.<\/details><br>\n23. Wyraz ***królewskim*** w zdaniu z pyt. 21. jest: *(5 pkt)*\n    - A) okolicznikiem\n    - B) dopełnieniem\n    - C) przydawką\n    - D) podmiotem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — przydawką<br>Przydawka określa rzeczownik i odpowiada na pytania jaki? który? czyj?: w ogrodzie (jakim?) królewskim.<\/details><br>\n24. W wyrazie ***szabel***: *(5 pkt)*\n    - A) jest więcej liter niż głosek\n    - B) są trzy sylaby\n    - C) jest tyle samo liter co głosek\n    - D) są trzy samogłoski\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — jest więcej liter niż głosek<br>Liter jest 6 (s, z, a, b, e, l), a głosek 5 (sz, a, b, e, l), bo „sz” to dwie litery, ale jedna głoska. Samogłoski są dwie (a, e), więc sylaby też dwie: sza-bel.<\/details><br>\n25. Wyraz ***mundurów*** w zdaniu ***nie noszą mundurów i szabel*** jest: *(5 pkt)*\n    - A) w mianowniku liczby pojedynczej\n    - B) w dopełniaczu liczby mnogiej\n    - C) w bierniku liczby mnogiej\n    - D) przymiotnikiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — w dopełniaczu liczby mnogiej<br>Nie noszą (kogo? czego?) mundurów — to dopełniacz. Pułapka: po czasowniku z „nie” zamiast biernika pojawia się dopełniacz. Biernik liczby mnogiej brzmiałby „mundury” (noszą mundury).<\/details><br>\n26. Wyraz ***nieszczęśliwym*** ma: *(5 pkt)*\n    - A) trzy sylaby\n    - B) pięć sylab\n    - C) dwie sylaby\n    - D) sześć sylab\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Nie-szczę-śli-wym — cztery sylaby, bo są cztery samogłoski: e, ę, i, y. Pułapka: „i” w „nie” tylko zmiękcza n, a nie tworzy osobnej sylaby.<\/details><br>\n27. Wyraz ***nieszczęśliwym*** piszemy łącznie, ponieważ: *(5 pkt)*\n    - A) *nie* z czasownikami piszemy łącznie\n    - B) to wyjątek od reguły\n    - C) to *nie* z przymiotnikiem w stopniu równym\n    - D) wszystkie wyrazy z *nie* piszemy łącznie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — to *nie* z przymiotnikiem w stopniu równym<br>Jakim królem? nieszczęśliwym — to przymiotnik. „Nie” z przymiotnikami w stopniu równym piszemy łącznie. Z czasownikami „nie” piszemy osobno (nie wiem), więc A i D są fałszywe.<\/details><br>\n28. W zdaniu ***Ja nie wiem, co znaczy cywile***: *(5 pkt)*\n    - A) jest jedno orzeczenie\n    - B) nie ma zaimka\n    - C) wyraz *ja* jest przyimkiem\n    - D) są dwa orzeczenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — są dwa orzeczenia<br>Orzeczenia to „wiem” i „znaczy” — dlatego to zdanie złożone. Zaimki są dwa: „ja” i „co”.<\/details><br>\n29. Wyraz ***Felku*** w zdaniu ***Słuchaj Felku, jestem bardzo nieszczęśliwym królem*** ma formę: *(5 pkt)*\n    - A) wołacza\n    - B) mianownika\n    - C) dopełniacza\n    - D) narzędnika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — wołacza<br>Wołacza używamy, gdy zwracamy się do kogoś: „Felku!”. Mianownik to „Felek”, dopełniacz „Felka”, narzędnik „Felkiem”.<\/details><br>\n30. Wyrazem o znaczeniu przeciwnym do wyrazu ***nudne*** (w tekście: ***każą mi robić same nudne rzeczy***) jest: *(5 pkt)*\n    - A) nieciekawe\n    - B) męczące\n    - C) długie\n    - D) monotonne\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Przeciwieństwem „nudnych” rzeczy są rzeczy ciekawe, zabawne, przyjemne. „Nieciekawe” i „monotonne” znaczą prawie to samo co „nudne”, a „męczące” i „długie” też do nich pasują, a nie są ich przeciwieństwem.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. A — powieści\n2. C — dialog\n3. D — w gęstych malinach w królewskim ogrodzie\n4. B — przez kratę\n5. A — gwizdnął\n6. D — sam, bo miał silną wolę\n7. C — musi robić nudne rzeczy, a przyjemnych mu zabraniają\n8. E — żadna z powyższych\n9. B — był królem\n10. D — nie bierze udziału w wydarzeniach\n11. C — ilu dokładnie ministrów ma Maciuś\n12. A — stanął wyprostowany jak żołnierz na baczność\n13. D — co znaczy słowo „cywile”\n14. B — raz jak do króla, a raz na „ty”, jak do kolegi\n15. C — zdziwiło Maciusia\n16. A — bardzo dużo\n17. D — o wiele\n18. B — jest podmiot domyślny\n19. C — biernika\n20. E — żadna z powyższych\n21. B — podmiotem\n22. D — są dwa przymiotniki\n23. C — przydawką\n24. A — jest więcej liter niż głosek\n25. B — w dopełniaczu liczby mnogiej\n26. E — żadna z powyższych\n27. C — to *nie* z przymiotnikiem w stopniu równym\n28. D — są dwa orzeczenia\n29. A — wołacza\n30. E — żadna z powyższych\n"}, {"path": "humanistyczny/klasa-5/testy-probne/test-2.md", "id": "hum5/test-2", "kind": "test", "short": "Test próbny 2", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# Test próbny 2\n\n<div class=\"test\" data-minuty=\"45\" data-start=\"30\"><\/div>\n\n**Test próbny** ułożony jak arkusz Alfika Humanistycznego dla klasy 5: tekst, 30 pytań, 45 minut. Na start masz 30 pkt, za błędną odpowiedź tracisz ¼ punktów pytania. Odpowiedź E znaczy: żadna z odpowiedzi A–D nie jest poprawna.\n\n## Tekst\n\n**Adam Mickiewicz, _Powrót taty_ (fragment)**\n\n> Wtem słychać tarkot, wozy jadą drogą,<br>\n> I wóz znajomy na przedzie;<br>\n> Skoczyły dzieci, i krzyczą, jak mogą:<br>\n> „Tato, ach tato nasz jedzie!”\n>\n> Obaczył kupiec, łzy radośne leje,<br>\n> Z wozu na ziemię wylata:<br>\n> „Ha, jak się macie, co się u was dzieje?<br>\n> Czyście tęskniły do tata?\n>\n> Mama czy zdrowa? ciotunia? domowi?<br>\n> A ot! rozynki w koszyku…”<br>\n> Ten sobie mówi, a ten sobie mówi,<br>\n> Pełno radości i krzyku.\n>\n> „Ruszajcie! kupiec na sługi zawoła,<br>\n> Ja z dziećmi pójdę ku miastu”.<br>\n> Idzie… aż zbójcy obskoczą dokoła,<br>\n> A zbójców było dwunastu.\n>\n> Brody ich długie, kręcone wąsiska,<br>\n> Wzrok dziki, suknia plugawa;<br>\n> Noże za pasem, miecz u boku błyska,<br>\n> W ręku ogromna buława.\n>\n> Krzyknęły dziatki, do ojca przypadły,<br>\n> Tulą się pod płaszcz na łonie,<br>\n> Truchleją sługi, struchlał pan wybladły,<br>\n> Drżące ku zbójcom wzniósł dłonie:\n>\n> „Ach! bierzcie wozy, ach! bierzcie dostatek,<br>\n> Tylko puszczajcie nas zdrowo,<br>\n> Nie róbcie małych sierotami dziatek,<br>\n> I młodej małżonki wdową”.\n>\n> Nie słucha zgraja, ten już wóz wyprzęga,<br>\n> Zabiera konie, a drugi:<br>\n> „Pieniędzy” krzyczy, i buławą sięga;<br>\n> Ów z mieczem wpada na sługi.\n>\n> Wtem: „Stójcie, stójcie!” krzyknie starszy zbójca,<br>\n> I spędza bandę precz z drogi,<br>\n> A wypuściwszy i dzieci i ojca,<br>\n> „Idźcie, rzekł, dalej bez trwogi”.\n>\n> Kupiec dziękuje, a zbójca odpowie:<br>\n> „Nie dziękuj! wyznam ci szczerze,<br>\n> Pierwszybym pałkę strzaskał na twej głowie,<br>\n> Gdyby nie dziatek pacierze.\n>\n> Dziatki sprawiły, że uchodzisz cało,<br>\n> Darzą cię życiem i zdrowiem;<br>\n> Im więc podziękuj za to, co się stało,<br>\n> A jak się stało, opowiem:\n>\n> Z dawna już słysząc o przejeździe kupca,<br>\n> I ja i moje kamraty,<br>\n> Tutaj za miastem, przy wzgórku, u słupca,<br>\n> Zasiadaliśmy na czaty.\n>\n> Dzisiaj nadchodzę, patrzę między chrusty:<br>\n> Modlą się dziatki do Boga;<br>\n> Słucham, z początku porwał mię śmiech pusty,<br>\n> A potem litość i trwoga.\n>\n> Słucham, ojczyste przyszły na myśl strony,<br>\n> Buława upadła z ręki:<br>\n> Ach! ja mam żonę, i u mojej żony<br>\n> Jest synek taki maleńki.<br>\n> (…)\n\nŹródło tekstu: [Wolne Lektury](https://wolnelektury.pl/katalog/lektura/ballady-i-romanse-powrot-taty/).\n\n## Pytania za 3 punkty\n\n1. Przedstawiony tekst: *(3 pkt)*\n   - A) jest napisany prozą\n   - B) jest utworem poetyckim\n   - C) jest dramatem\n   - D) jest listem\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — jest utworem poetyckim<br>Tekst ma wersy, zwrotki i rymy (drogą – mogą, przedzie – jedzie), więc jest napisany wierszem. Nie jest dramatem, bo ma narratora, a nie tylko kwestie postaci.<\/details><br>\n2. Rymy w pierwszej zwrotce są: *(3 pkt)*\n   - A) parzyste (aabb)\n   - B) okalające (abba)\n   - C) krzyżowe (abab)\n   - D) w tej zwrotce nie ma rymów\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — krzyżowe (abab)<br>Rymują się wersy 1. i 3. (drogą – mogą) oraz 2. i 4. (przedzie – jedzie). Rymy „na krzyż”, czyli abab, to rymy krzyżowe.<\/details><br>\n3. Kupiec wracał do domu: *(3 pkt)*\n   - A) pieszo\n   - B) konno\n   - C) statkiem\n   - D) wozem\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — wozem<br>Dzieci widzą „wóz znajomy na przedzie”, a kupiec „z wozu na ziemię wylata”. Pułapka: wozy ciągnęły konie, ale kupiec nie jechał wierzchem, czyli konno.<\/details><br>\n4. Dzieci poznały, że wraca ojciec, po: *(3 pkt)*\n   - A) znajomym wozie\n   - B) głosie ojca\n   - C) płaszczu ojca\n   - D) koniach\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — znajomym wozie<br>„Wtem słychać tarkot, wozy jadą drogą, / I wóz znajomy na przedzie; / Skoczyły dzieci” — dzieci rozpoznały wóz taty.<\/details><br>\n5. Kupiec przywiózł dzieciom w koszyku: *(3 pkt)*\n   - A) zabawki\n   - B) książeczkę\n   - C) cukierki\n   - D) pierniki\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Kupiec mówi: „A ot! rozynki w koszyku…”. Rozynki to dawna nazwa rodzynek — suszonych winogron. Takiej odpowiedzi nie ma wśród A–D.<\/details><br>\n6. Zbójców było: *(3 pkt)*\n   - A) trzech\n   - B) siedmiu\n   - C) dwunastu\n   - D) dwudziestu\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — dwunastu<br>W tekście: „A zbójców było dwunastu”.<\/details><br>\n7. Opis wyglądu zbójców (***Brody ich długie, kręcone wąsiska, / Wzrok dziki, suknia plugawa***) ma przede wszystkim: *(3 pkt)*\n   - A) rozśmieszyć czytelnika\n   - B) wzbudzić strach\n   - C) zachwycić strojem zbójców\n   - D) wzbudzić sympatię do zbójców\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — wzbudzić strach<br>Dziki wzrok, brudne (plugawe) ubranie, noże, miecz i ogromna buława — wszystko to ma budzić grozę. Dzieci i słudzy rzeczywiście bardzo się przestraszyli.<\/details><br>\n8. Kupiec prosił zbójców, aby: *(3 pkt)*\n   - A) zabrali tylko konie\n   - B) zostawili mu chociaż jeden wóz\n   - C) wzięli wozy i majątek, ale puścili ich zdrowych\n   - D) pozwolili mu walczyć\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — wzięli wozy i majątek, ale puścili ich zdrowych<br>„Ach! bierzcie wozy, ach! bierzcie dostatek, / Tylko puszczajcie nas zdrowo”. Dostatek to majątek, bogactwo.<\/details><br>\n9. Napad przerwał: *(3 pkt)*\n   - A) starszy zbójca\n   - B) kupiec\n   - C) jeden ze sług\n   - D) mama dzieci\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — starszy zbójca<br>„Wtem: «Stójcie, stójcie!» krzyknie starszy zbójca, / I spędza bandę precz z drogi”.<\/details><br>\n10. Starszy zbójca puścił kupca, ponieważ: *(3 pkt)*\n    - A) kupiec zapłacił mu okup\n    - B) przestraszył się sług kupca\n    - C) nadjechała straż miejska\n    - D) poruszyła go modlitwa dzieci\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — poruszyła go modlitwa dzieci<br>Zbójca mówi wprost: „Pierwszybym pałkę strzaskał na twej głowie, / Gdyby nie dziatek pacierze”. Słuchając modlitwy, przypomniał sobie własną żonę i synka.<\/details><br>\n\n## Pytania za 4 punkty\n\n11. Każda zwrotka przedstawionego fragmentu ma: *(4 pkt)*\n    - A) trzy wersy\n    - B) pięć wersów\n    - C) sześć wersów\n    - D) osiem wersów\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Każda zwrotka ma cztery wersy (linijki), a takiej odpowiedzi nie ma wśród A–D. Pułapka: wers to jedna linijka wiersza, a nie jedno zdanie.<\/details><br>\n12. Z tekstu wynika, że zbójcy: *(4 pkt)*\n    - A) spotkali kupca przypadkiem\n    - B) od dawna czekali na przejazd kupca\n    - C) zostali wynajęci przez sługi kupca\n    - D) pochodzili z tego samego miasta co kupiec\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — od dawna czekali na przejazd kupca<br>„Z dawna już słysząc o przejeździe kupca, / I ja i moje kamraty, / (…) Zasiadaliśmy na czaty” — zbójcy wiedzieli, że kupiec będzie jechał, i czekali na niego.<\/details><br>\n13. Gdy zbójca usłyszał modlitwę dzieci, najpierw ogarnął go: *(4 pkt)*\n    - A) gniew\n    - B) smutek\n    - C) śmiech\n    - D) strach\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — śmiech<br>„Słucham, z początku porwał mię śmiech pusty, / A potem litość i trwoga”. Pułapka: trwoga (strach) przyszła dopiero potem — pytanie dotyczy tego, co było najpierw.<\/details><br>\n14. Osobą mówiącą w trzech ostatnich zwrotkach fragmentu jest: *(4 pkt)*\n    - A) kupiec\n    - B) jedno z dzieci\n    - C) narrator\n    - D) starszy zbójca\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — starszy zbójca<br>Starszy zbójca opowiada kupcowi, co się stało: „I ja i moje kamraty”, „Ach! ja mam żonę”. Te zwrotki są częścią jego wypowiedzi, która zaczyna się od słów „Nie dziękuj!”.<\/details><br>\n15. Wyraz ***kamraty*** oznacza: *(4 pkt)*\n    - A) towarzyszy, kompanów\n    - B) wrogów\n    - C) żołnierzy\n    - D) kupców\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — towarzyszy, kompanów<br>„Ja i moje kamraty” to zbójca i jego towarzysze z bandy. „Kamrat” to dawne słowo znaczące „kolega, kompan”.<\/details><br>\n16. Sformułowanie ***zasiadaliśmy na czaty*** oznacza: *(4 pkt)*\n    - A) siadaliśmy do posiłku\n    - B) odpoczywaliśmy po podróży\n    - C) modliliśmy się\n    - D) czekaliśmy w ukryciu na kupca\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — czekaliśmy w ukryciu na kupca<br>Czatować to czekać w ukryciu i wypatrywać kogoś. Zbójcy czaili się przy wzgórku, żeby napaść na kupca.<\/details><br>\n17. Wyraz ***obaczył*** to dawna forma wyrazu: *(4 pkt)*\n    - A) zobaczył\n    - B) obawiał się\n    - C) obraził się\n    - D) obudził się\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — zobaczył<br>„Obaczył kupiec” — kupiec zobaczył swoje dzieci i zaczął płakać z radości.<\/details><br>\n18. Wyrazy ***truchleją*** i ***struchlał*** w zwrotce o napadzie znaczą, że sługi i kupiec: *(4 pkt)*\n    - A) cieszą się\n    - B) zamierają ze strachu\n    - C) złoszczą się\n    - D) uciekają\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — zamierają ze strachu<br>Truchleć to tak się przestraszyć, że nie można się ruszyć. Kupiec jest przy tym „wybladły” i ma drżące dłonie — to oznaki strachu.<\/details><br>\n19. Wyraz ***dwunastu*** w zdaniu ***A zbójców było dwunastu*** to: *(4 pkt)*\n    - A) rzeczownik\n    - B) przymiotnik\n    - C) liczebnik\n    - D) przysłówek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — liczebnik<br>Liczebnik odpowiada na pytanie ilu? ile?: ilu było zbójców? — dwunastu.<\/details><br>\n20. Wyrazy ***wąsiska*** i ***synek***: *(4 pkt)*\n    - A) są oba zdrobnieniami\n    - B) są oba zgrubieniami\n    - C) to zdrobnienie i zgrubienie\n    - D) to zgrubienie i zdrobnienie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — to zgrubienie i zdrobnienie<br>„Wąsiska” to zgrubienie od „wąsy” — brzmi groźnie i niechętnie. „Synek” to zdrobnienie od „syn” — brzmi czule. Pułapka: kolejność ma znaczenie, więc C odpada.<\/details><br>\n\n## Pytania za 5 punktów\n\n21. Wypowiedzenie ***Wzrok dziki, suknia plugawa***: *(5 pkt)*\n    - A) nie ma orzeczenia\n    - B) ma dwa orzeczenia\n    - C) ma jedno orzeczenie\n    - D) zawiera czasownik w czasie przeszłym\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — nie ma orzeczenia<br>Nie ma tu żadnego czasownika w formie osobowej: „wzrok” i „suknia” to rzeczowniki, a „dziki” i „plugawa” to przymiotniki. Bez czasownika nie ma orzeczenia — to równoważnik zdania.<\/details><br>\n22. W zdaniu ***Krzyknęły dziatki***: *(5 pkt)*\n    - A) nie ma podmiotu\n    - B) podmiotem jest wyraz *dziatki*\n    - C) jest podmiot domyślny\n    - D) orzeczeniem jest wyraz *dziatki*\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — podmiotem jest wyraz *dziatki*<br>Orzeczenie to „krzyknęły”. Kto krzyknął? — dziatki, czyli dzieci. Podmiot jest w zdaniu, więc nie jest domyślny.<\/details><br>\n23. W wyrazie ***zbójców***: *(5 pkt)*\n    - A) są trzy sylaby\n    - B) jest więcej liter niż głosek\n    - C) jest tyle samo liter co głosek\n    - D) są trzy samogłoski\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest tyle samo liter co głosek<br>Z, b, ó, j, c, ó, w — 7 liter i 7 głosek, bo nie ma tu dwuznaków (jak sz, ch) ani zmiękczającego „i”. Samogłoski są dwie (ó, ó), więc sylaby też dwie: zbój-ców.<\/details><br>\n24. Wyraz ***buławą*** w zdaniu ***i buławą sięga*** ma formę: *(5 pkt)*\n    - A) mianownika\n    - B) biernika\n    - C) miejscownika\n    - D) narzędnika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — narzędnika<br>Sięga (kim? czym?) buławą — to narzędnik. Pułapka: biernik ma końcówkę „-ę” (widzę buławę), a narzędnik „-ą”.<\/details><br>\n25. W zdaniu ***Buława upadła z ręki***: *(5 pkt)*\n    - A) jest jeden przyimek\n    - B) są dwa przyimki\n    - C) nie ma podmiotu\n    - D) są dwa czasowniki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — jest jeden przyimek<br>Przyimek to „z”. Podmiot to „buława” (co upadło?), a czasownik jest jeden: „upadła”.<\/details><br>\n26. Wyraz ***ręki*** w zdaniu z pyt. 25. ma formę: *(5 pkt)*\n    - A) mianownika liczby mnogiej\n    - B) dopełniacza liczby pojedynczej\n    - C) celownika liczby pojedynczej\n    - D) narzędnika liczby pojedynczej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — dopełniacza liczby pojedynczej<br>Upadła z (kogo? czego?) ręki — dopełniacz. Mianownik liczby mnogiej to „ręce”, celownik „ręce” (komu? czemu?), a narzędnik „ręką”.<\/details><br>\n27. Rzeczownikiem nie jest wyraz: *(5 pkt)*\n    - A) płaszcz\n    - B) trwoga\n    - C) wzrok\n    - D) szczerze\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — szczerze<br>„Szczerze” odpowiada na pytanie jak? (wyznam jak? — szczerze) i się nie odmienia — to przysłówek. Płaszcz, trwoga i wzrok to rzeczowniki (co?).<\/details><br>\n28. Zaimkiem nie jest wyraz: *(5 pkt)*\n    - A) ja\n    - B) twej\n    - C) im\n    - D) ów\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Wszystkie są zaimkami: „ja” (osobowy), „twej”, czyli twojej (dzierżawczy — czyja?), „im” (komu? — dzieciom: „Im więc podziękuj”) i „ów”, czyli dawne „tamten” (wskazujący).<\/details><br>\n29. Wyrazem jednosylabowym jest wyraz: *(5 pkt)*\n    - A) dziatki\n    - B) synek\n    - C) trwoga\n    - D) ręki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Wszystkie mają po dwie sylaby: dziat-ki, sy-nek, trwo-ga, rę-ki. Pułapka: w „dziatki” litera „i” tylko zmiękcza „dz” i nie tworzy osobnej sylaby.<\/details><br>\n30. Wyraz ***maleńki*** w zdaniu ***Jest synek taki maleńki*** to: *(5 pkt)*\n    - A) rzeczownik\n    - B) czasownik\n    - C) przymiotnik\n    - D) przysłówek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — przymiotnik<br>Jaki synek? — maleńki. Przymiotnik odpowiada na pytanie jaki? i odmienia się (maleńkiego, maleńkiemu). Pułapka: przysłówek brzmiałby „maleńko”.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. B — jest utworem poetyckim\n2. C — krzyżowe (abab)\n3. D — wozem\n4. A — znajomym wozie\n5. E — żadna z powyższych\n6. C — dwunastu\n7. B — wzbudzić strach\n8. C — wzięli wozy i majątek, ale puścili ich zdrowych\n9. A — starszy zbójca\n10. D — poruszyła go modlitwa dzieci\n11. E — żadna z powyższych\n12. B — od dawna czekali na przejazd kupca\n13. C — śmiech\n14. D — starszy zbójca\n15. A — towarzyszy, kompanów\n16. D — czekaliśmy w ukryciu na kupca\n17. A — zobaczył\n18. B — zamierają ze strachu\n19. C — liczebnik\n20. D — to zgrubienie i zdrobnienie\n21. A — nie ma orzeczenia\n22. B — podmiotem jest wyraz *dziatki*\n23. C — jest tyle samo liter co głosek\n24. D — narzędnika\n25. A — jest jeden przyimek\n26. B — dopełniacza liczby pojedynczej\n27. D — szczerze\n28. E — żadna z powyższych\n29. E — żadna z powyższych\n30. C — przymiotnik\n"}, {"path": "matematyczny/klasa-5/README.md", "id": "mat5/start", "kind": "info", "short": "Start", "sek": "mat5", "sekNazwa": "Matematyczny · kl. 5", "md": "# Alfik Matematyczny, klasa 5: trening\n\nZadania do nauki przed Ogólnopolskim Konkursem Matematycznym **Alfik Matematyczny** dla klasy 5\nszkoły podstawowej. Strona zawiera 300 oryginalnych zadań z arkuszy z lat 2015–2025 i 191 nowych\nzadań w stylu Alfika. Każda odpowiedź została sprawdzona programem komputerowym.\n\n- **[Zadania według typu](zadania-wg-typu/README.md)** to 9 działów, od kalendarza po szachownice.\n  Zadania z prawdziwych arkuszy są wymieszane z nowymi i oznaczone odznaką z rokiem.\n  Klikasz odpowiedź: zielona jest dobra i od razu pokazuje się rozwiązanie, czerwona jest zła\n  i możesz próbować dalej.\n- **[Testy przeszłe](testy-przeszle/README.md)** to 10 oryginalnych arkuszy dla klasy 5\n  (2015–2025) do rozwiązania na czas, z punktacją jak na konkursie.\n- **[Testy próbne](testy-probne/README.md)** to pełne arkusze: 30 zadań, 75 minut, punktacja\n  jak na konkursie, razem z punktami ujemnymi.\n\nPostęp zapisuje się w przeglądarce, osobno dla każdej strony. Przycisk u góry czyści tylko bieżącą stronę.\n\n---\n\n## Jak wygląda konkurs (klasa 5)\n\n| | |\n|---|---|\n| Czas | **75 minut** |\n| Zadania | **30**, jednokrotnego wyboru, odpowiedzi A–E |\n| Punkty | zadania 1–10 po **3 pkt**, 11–20 po **4 pkt**, 21–30 po **5 pkt** (razem 120) |\n| Brak odpowiedzi | 0 pkt |\n| Zła odpowiedź | **minus ¼** punktów zadania (−0,75 / −1 / −1,25) |\n| Termin | zwykle druga połowa listopada (2025: 20 listopada). Dokładną datę podaje szkoła i organizator na [jersz.pl](https://jersz.pl) |\n\n### Czy zgadywać?\n\nPoliczmy dla zadania za 4 pkt. Jeśli strzelasz na ślepo spośród 5 odpowiedzi, trafiasz średnio\nraz na 5 razy: +4 raz, −1 cztery razy, czyli średnio **0 pkt**. Strzelanie w ciemno nic nie daje.\n\nAle gdy **odrzucisz choć jedną** odpowiedź, strzał już się opłaca. Przy 4 pozostałych:\n+4 raz, −1 trzy razy, średnio +¼ pkt. Przy 3 pozostałych: +4 raz, −1 dwa razy, średnio +⅔ pkt.\n\n**Zasada:** nie zgaduj na ślepo. Jeśli umiesz skreślić choć jedną odpowiedź, zaznacz którąś z pozostałych.\n\n### Wskazówki na sam test\n\n1. Najpierw przejdź wszystkie zadania za 3 pkt, potem za 4 i 5. Nie utykaj na jednym zadaniu dłużej niż 4–5 minut.\n2. Sprawdzaj odpowiedzi **od tyłu**: wstaw każdą opcję do treści zadania. W Alfiku często to jest najszybsza droga.\n3. Rysuj! Kalendarz, kratka, drzewko możliwości, kreski zamiast kulek.\n4. Uważaj na słowa „co najmniej”, „najwięcej”, „mieć pewność”, „o ile”, „ile razy”.\n5. Opcja E bywa podchwytliwa („5 lub więcej”, „nie da się ustalić”). Czasem to ona jest dobra.\n\n---\n\n## Plan na 3 tygodnie\n\n| Tydzień | Co robić |\n|---|---|\n| 1 | Działy 01–03 (kalendarz, cyfry, podzielność): po jednym dziale dziennie, potem ściąga z końca działu do zeszytu. |\n| 2 | Działy 04–06 (zadania tekstowe, liczenie, logika) i **Test próbny 1** na czas. |\n| 3 | Działy 07–09 (geometria, kratki, działania), **Test próbny 2**, a potem **testy przeszłe** od najnowszego: Alfik 2025, 2024, 2023… |\n\nPo każdym teście przejrzyj zadania, w których straciłeś punkty, i wróć do ich działu.\n\n## Oryginalne arkusze\n\nWszystkie arkusze dla klasy 5 z lat 2015–2025 są w zakładce [Testy przeszłe](testy-przeszle/README.md).\nOryginały w PDF są na stronie organizatora, [jersz.pl](https://jersz.pl/alfik-matematyczny/).\nArkusze i klucze są własnością organizatora konkursu (Łowcy Talentów – JERSZ).\n"}, {"path": "matematyczny/klasa-5/zadania-wg-typu/README.md", "id": "mat5/dzialy", "kind": "info", "short": "Zadania wg typu", "sek": "mat5", "sekNazwa": "Matematyczny · kl. 5", "md": "# Zadania według typu\n\n431 zadań w 9 działach. Na każdy typ, który pojawia się w Alfiku, przypada jeden plik.\nW każdym dziale są dwa rodzaje zadań:\n\n- **nowe**, napisane w stylu Alfika (131 zadań),\n- **oryginalne** z arkuszy Alfika dla klasy 5 z lat 2015–2025 (300 zadań). Mają kratkowane tło\n  i odznakę z rokiem, np. „Alfik 2019 · zad. 14”. Kliknięcie odznaki otwiera cały arkusz.\n\nNa górze działu możesz wybrać, które zadania widać: wszystkie, tylko z arkuszy albo tylko nowe.\nW każdym dziale zadania idą od łatwych (3 pkt) do trudnych (5 pkt). Na końcu działu jest\n**klucz odpowiedzi** i **ściąga** z najważniejszymi sztuczkami.\n\n| # | Dział | Zadań (w tym z arkuszy) | Co w środku |\n|---|---|---|---|\n| 01 | [Kalendarz i zegar](01-kalendarz-i-zegar.md) | 53 (39) | dni tygodnia, lata przestępne, wskazówki zegara, zegar elektroniczny |\n| 02 | [Liczby i cyfry](02-liczby-i-cyfry.md) | 42 (28) | suma i iloczyn cyfr, palindromy, największa/najmniejsza liczba, numerowanie stron |\n| 03 | [Podzielność i reszty](03-podzielnosc-i-reszty.md) | 47 (33) | cechy podzielności, wielokrotności, reszty, ostatnia cyfra |\n| 04 | [Zadania tekstowe](04-zadania-tekstowe.md) | 99 (84) | wiek, ważenie, zakupy, przekładanie, ruch |\n| 05 | [Liczenie i kombinatoryka](05-kombinatoryka.md) | 24 (9) | ile liczb, ile meczów, ile dróg, ile prostokątów |\n| 06 | [Logika i zasada szufladkowa](06-logika-i-szufladki.md) | 29 (14) | „żeby mieć pewność”, rycerze i łotrzy, ważenie, przelewanie |\n| 07 | [Geometria: pola, obwody, jednostki](07-geometria-pola-i-obwody.md) | 44 (29) | pole i obwód, ar i hektar, kąty, pomalowane kostki |\n| 08 | [Kratki, szachownice i cięcie](08-kratki-szachownice-ciecie.md) | 53 (39) | szachownice, kwadraty na kratce, domino, kostka do gry |\n| 09 | [Działania, ciągi i wzorki](09-dzialania-i-wzorki.md) | 40 (25) | znaki i nawiasy, sprytne liczenie, ciągi, ułamki |\n\n**Jak pracować z działem**\n\n1. Rozwiązuj na kartce, a dopiero potem klikaj odpowiedź. Licznik u góry pokazuje też, ile zadań\n   wyszło **za pierwszym razem**, bo tylko to liczy się na konkursie.\n2. Po złej odpowiedzi nie klikaj od razu następnej. Najpierw znajdź swój błąd.\n3. Po każdym rozwiązanym zadaniu przeczytaj rozwiązanie, nawet jeśli wynik był dobry. Często jest tam szybszy sposób.\n4. Ściągę z końca działu przepisz do zeszytu.\n", "dawne": "dzialy"}, {"path": "matematyczny/klasa-5/testy-przeszle/README.md", "id": "mat5/przeszle", "kind": "info", "short": "Testy przeszłe", "sek": "mat5", "sekNazwa": "Matematyczny · kl. 5", "md": "# Testy przeszłe\n\nOryginalne arkusze Alfika Matematycznego dla **klasy 5** z 10 edycji konkursu. Rozwiązujesz je\njak na konkursie: 30 zadań, 75 minut, punkty ujemne za złe odpowiedzi, wynik od razu po zakończeniu.\nW 2020 roku konkursu nie było.\n\n| Arkusz | Edycja | Klucz |\n|---|---|---|\n| [Alfik 2025](alfik-2025.md) | XXXI | oficjalny |\n| [Alfik 2024](alfik-2024.md) | XXX | oficjalny |\n| [Alfik 2023](alfik-2023.md) | XXIX | oficjalny |\n| [Alfik 2022](alfik-2022.md) | XXVIII | oficjalny |\n| [Alfik 2021](alfik-2021.md) | XXVII | nasz: organizator nie opublikował klucza dla klasy 5 |\n| [Alfik 2019](alfik-2019.md) | XXV | oficjalny |\n| [Alfik 2018](alfik-2018.md) | XXIV | oficjalny |\n| [Alfik 2017](alfik-2017.md) | XXIII | oficjalny |\n| [Alfik 2016](alfik-2016.md) | XXII | oficjalny |\n| [Alfik 2015](alfik-2015.md) | XXI | oficjalny |\n\nKażdą odpowiedź z klucza sprawdziliśmy dodatkowo, rozwiązując zadanie programem komputerowym.\nWyjaśnienia pod zadaniami są nasze, nie organizatora.\n\n**Jak z tego korzystać**\n\n- Zacznij od najnowszych arkuszy. Najlepiej oddają to, czego można się spodziewać w tym roku.\n- Rób jeden arkusz na raz, przy biurku, bez przerw. Po teście przejrzyj zadania, w których straciłeś punkty.\n- Te same zadania są też w [działach według typu](../zadania-wg-typu/README.md), oznaczone\n  odznaką z rokiem. Jeśli jakiś typ zadań sprawia kłopot, poćwicz go tam.\n\nArkusze i klucze są własnością organizatora konkursu, Łowcy Talentów – JERSZ. Oryginały w PDF są\nna stronie [jersz.pl](https://jersz.pl/alfik-matematyczny/).\n", "dawne": "przeszle"}, {"path": "matematyczny/klasa-5/testy-probne/README.md", "id": "mat5/testy", "kind": "info", "short": "Testy próbne", "sek": "mat5", "sekNazwa": "Matematyczny · kl. 5", "md": "# Testy próbne\n\nPełne arkusze ułożone jak na prawdziwym Alfiku: 30 zadań, 75 minut, 10 zadań za 3 pkt,\n10 za 4 pkt i 10 za 5 pkt. Za złą odpowiedź odejmowana jest ¼ punktów zadania. Najwięcej można zdobyć 120 pkt.\n\n| Test | Poziom |\n|---|---|\n| [Test próbny 1](test-1.md) | jak typowy arkusz |\n| [Test próbny 2](test-2.md) | trochę trudniejszy |\n\n**Jak to działa na stronie**\n\n- Zegar rusza po kliknięciu **Start** albo po pierwszej odpowiedzi. Gdy czas się skończy, test sprawdzi się sam.\n- Odpowiedź zaznaczasz kliknięciem. Drugie kliknięcie ją odznacza, bo puste pole to 0 pkt, a nie minus.\n- Rozwiązania i klucz pokazują się dopiero po kliknięciu **Zakończ i sprawdź**.\n- Wyniki kolejnych podejść zapisują się w przeglądarce, więc widać postęp.\n\n**Najlepiej:** siądź przy biurku z kartką na obliczenia, wyłącz inne rzeczy i rób test za jednym\nzamachem, jak na konkursie. Po teście omów z rodzicem każde zadanie, w którym straciłeś punkty.\n", "dawne": "testy"}, {"path": "matematyczny/klasa-5/zadania-wg-typu/01-kalendarz-i-zegar.md", "id": "mat5/01-kalendarz-i-zegar", "kind": "dzial", "short": "01 Kalendarz i zegar", "sek": "mat5", "sekNazwa": "Matematyczny · kl. 5", "md": "# 01. Kalendarz i zegar\n\n**Dlaczego warto:** W prawie każdym arkuszu Alfika jest 1–3 zadania o dniach tygodnia, latach przestępnych albo o zegarze. Rachunki są w nich krótkie, ale łatwo pomylić się o jeden dzień, zapomnieć o roku przestępnym albo o tym, że wskazówka godzinowa też się porusza.\n\n- **W pliku:** 53 zadań: 14 nowych i 39 z prawdziwych arkuszy Alfika (18 za 3 pkt, 16 za 4 pkt, 19 za 5 pkt).\n\n**Wskazówki**\n- Dni tygodnia powtarzają się co 7 dni, więc liczy się tylko **reszta z dzielenia przez 7**: za 100 dni = za 14 tygodni i 2 dni.\n- Rok zwykły ma 365 dni = 52 tygodnie i 1 dzień, a rok przestępny 366 dni = 52 tygodnie i 2 dni. Dlatego 1 stycznia przesuwa się co roku o 1 dzień tygodnia (albo o 2 po roku przestępnym).\n- W miesiącu „nadmiarowe” dni 29., 30., 31. to te same dni tygodnia co 1., 2., 3. — właśnie te dni tygodnia występują w miesiącu 5 razy.\n- Wskazówka minutowa przesuwa się o 6° na minutę, a godzinowa o 30° na godzinę, czyli o pół stopnia na minutę.\n- Zegar elektroniczny pokazuje godziny 00–23 i minuty 00–59: pierwsza cyfra minut nigdy nie jest większa niż 5.\n- Gdy czas „przechodzi przez północ”, policz osobno: do 24:00 i od 0:00.\n\n**Spis treści**\n\n- [A. Dni tygodnia i lata przestępne](#a-dni-tygodnia-i-lata-przestępne)\n- [B. Zegar ze wskazówkami](#b-zegar-ze-wskazówkami)\n- [C. Zegar elektroniczny i upływ czasu](#c-zegar-elektroniczny-i-upływ-czasu)\n- [Klucz odpowiedzi](#klucz-odpowiedzi)\n- [Ściąga](#ściąga)\n\n---\n\n## A. Dni tygodnia i lata przestępne\n\nCo 7 dni dzień tygodnia się powtarza — dlatego zamiast liczyć dzień po dniu, dziel przez 7 i patrz na resztę.\n\n1. Dzisiaj jest środa. Jaki dzień tygodnia będzie za 100 dni? *(3 pkt)*\n   - A) poniedziałek\n   - B) wtorek\n   - C) środa\n   - D) czwartek\n   - E) piątek\n   <details><summary>rozwiązanie<\/summary>E — piątek<br>100 = 14 · 7 + 2. Po 14 pełnych tygodniach (98 dniach) znów będzie środa, a potem zostają jeszcze 2 dni: czwartek, piątek. Pułapka: 100 nie dzieli się przez 7 — reszta 2 mówi, o ile dni trzeba się przesunąć.<\/details><br>\n2. Rok 2027 nie jest przestępny, a 1 stycznia 2027 roku wypada w piątek. Ile piątków będzie w roku 2027? *(3 pkt)*\n   - A) 50\n   - B) 51\n   - C) 52\n   - D) 53\n   - E) 54\n   <details><summary>rozwiązanie<\/summary>D — 53<br>365 = 52 · 7 + 1. W 52 pełnych tygodniach są 52 piątki. Zostaje 1 dzień — ostatni dzień roku, 31 grudnia — i jest to ten sam dzień tygodnia co 1 stycznia, czyli piątek. Razem 52 + 1 = 53.<\/details><br>\n3. Pierwszy i ostatni dzień pewnego miesiąca wypadły w tym samym dniu tygodnia. Ile dni liczył ten miesiąc? *(3 pkt)* *(Alfik 2022, zad. 3)*\n   - A) 28\n   - B) 29\n   - C) 30\n   - D) 31\n   - E) opisana sytuacja jest niemożliwa\n   <details><summary>rozwiązanie<\/summary>B — 29<br>Ten sam dzień tygodnia powtarza się co 7 dni: 1., 8., 15., 22., 29. dnia miesiąca. Ostatni dzień musi więc być 29. — to luty w roku przestępnym.<\/details><br>\n4. Pierwszy dzień dziesięciodniowego urlopu pani Marioli wypadł we wtorek. W jakim dniu tygodnia wypadł ostatni dzień jej urlopu? *(3 pkt)* *(Alfik 2021, zad. 1)*\n   - A) wtorek\n   - B) środa\n   - C) czwartek\n   - D) piątek\n   - E) sobota\n   <details><summary>rozwiązanie<\/summary>C — czwartek<br>Ostatni dzień urlopu to dzień 10., czyli 9 dni po pierwszym. 7 dni później znów jest wtorek (dzień 8.), a 2 dni dalej — czwartek (dzień 10.). Pułapka: liczenie 10 dni po wtorku zamiast 9 daje piątek.<\/details><br>\n5. Jeśli pierwszy dzień pewnego miesiąca wypadł w środę, to w którym dniu miesiąca wypadła ostatnia niedziela tego miesiąca? *(3 pkt)* *(Alfik 2015, zad. 3)*\n   - A) 26\n   - B) 27\n   - C) 28\n   - D) 29\n   - E) zależy od długości tego miesiąca\n   <details><summary>rozwiązanie<\/summary>A — 26<br>Środa 1., czwartek 2., piątek 3., sobota 4., niedziela 5. Kolejne niedziele to 12., 19., 26., a następna byłaby 33. — takiego dnia nie ma w żadnym miesiącu. Więc ostatnia niedziela to zawsze 26., niezależnie od długości miesiąca.<\/details><br>\n6. Ile dni minęło od 1 stycznia 2020 roku do 1 stycznia 2025 roku? *(4 pkt)*\n   - A) 1825\n   - B) 1826\n   - C) 1827\n   - D) 1828\n   - E) 1830\n   <details><summary>rozwiązanie<\/summary>C — 1827<br>Minęło 5 pełnych lat: 2020, 2021, 2022, 2023 i 2024. Lata 2020 i 2024 są przestępne (dzielą się przez 4), więc mają po 366 dni. 5 · 365 = 1825 i do tego 2 dodatkowe dni (dwa razy 29 lutego): 1825 + 2 = 1827. Pułapka: łatwo zapomnieć o jednym roku przestępnym (1826) albo o obu (1825).<\/details><br>\n7. W pewnym miesiącu było 5 sobót i 5 niedziel, ale tylko 4 piątki. Jakim dniem tygodnia był pierwszy dzień tego miesiąca? *(4 pkt)*\n   - A) piątek\n   - B) sobota\n   - C) niedziela\n   - D) poniedziałek\n   - E) nie da się tego ustalić\n   <details><summary>rozwiązanie<\/summary>B — sobota<br>Pierwsze 28 dni to 4 pełne tygodnie — każdy dzień tygodnia jest w nich 4 razy. Piąty raz pojawiają się tylko dni tygodnia z dni 29., 30. i 31., a to te same dni tygodnia co 1., 2. i 3. dzień miesiąca. Sobota i niedziela są 5 razy, a piątek nie — więc 1. dzień to sobota, 2. to niedziela. Pułapka: nie wiemy, czy miesiąc ma 30, czy 31 dni, ale to nie przeszkadza — w obu przypadkach zaczyna się w sobotę.<\/details><br>\n8. W pewnym miesiącu wypadło pięć piątków, ale tylko cztery czwartki. W jakim dniu tygodnia wypadł pierwszy dzień tego miesiąca? *(4 pkt)* *(Alfik 2022, zad. 13)*\n   - A) we wtorek\n   - B) w środę\n   - C) w czwartek\n   - D) w piątek\n   - E) w sobotę\n   <details><summary>rozwiązanie<\/summary>D — w piątek<br>W 28 dniach każdy dzień tygodnia jest dokładnie 4 razy. Piątych piątków może być tylko w „dodatkowych” dniach (29., 30., 31.). Gdyby przed piątkiem był w nich czwartek, czwartków też byłoby 5. Więc piątek musi być pierwszym z dodatkowych dni, czyli 29. jest piątkiem — a wtedy 1. dzień miesiąca też jest piątkiem.<\/details><br>\n9. Ile jest takich miesięcy w roku, w których drugi i przedostatni dzień wypadają w tym samym dniu tygodnia? *(4 pkt)* *(Alfik 2019, zad. 17)*\n   - A) 4\n   - B) 5\n   - C) 6\n   - D) 7\n   - E) 8\n   <details><summary>rozwiązanie<\/summary>D — 7<br>Ten sam dzień tygodnia powtarza się co 7 dni. W miesiącu 31-dniowym przedostatni dzień to 30., a 30 − 2 = 28 = 4 · 7 — pasuje. W 30-dniowym: 29 − 2 = 27, nie pasuje; w lutym też nie. Miesięcy 31-dniowych jest 7 (styczeń, marzec, maj, lipiec, sierpień, październik, grudzień).<\/details><br>\n10. Pan Jan przyjechał do hotelu w przedostatnim dniu przedostatniego miesiąca ubiegłego roku, a wyjechał w ostatnim dniu ostatniego miesiąca ubiegłego roku. Ile nocy spędził w tym hotelu? *(4 pkt)* *(Alfik 2018, zad. 12)*\n    - A) 28\n    - B) 29\n    - C) 30\n    - D) 31\n    - E) 32\n    <details><summary>rozwiązanie<\/summary>E — 32<br>Przyjazd 29 listopada (listopad ma 30 dni), wyjazd 31 grudnia. Noce w listopadzie: z 29 na 30 i z 30 listopada na 1 grudnia — 2 noce. W grudniu: od 1 do 31 grudnia jest 30 nocy. Razem 32.<\/details><br>\n11. Ile najwięcej sobót może wypaść w jednym miesiącu? *(4 pkt)* *(Alfik 2018, zad. 14)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>C — 5<br>Miesiąc ma najwyżej 31 dni = 4 tygodnie i 3 dni. W 4 tygodniach są 4 soboty, a w 3 dodatkowych dniach może być jeszcze jedna. Razem najwyżej 5 (np. gdy miesiąc zaczyna się w sobotę).<\/details><br>\n12. Jacek powiedział: „Pojutrze minie 10 dni od mojej niedzielnej wyprawy w góry.” W jakim dniu tygodnia to powiedział? *(4 pkt)* *(Alfik 2017, zad. 14)*\n    - A) w niedzielę\n    - B) w sobotę\n    - C) w środę\n    - D) we wtorek\n    - E) w poniedziałek\n    <details><summary>rozwiązanie<\/summary>E — w poniedziałek<br>10 dni po niedzieli to 7 dni (znów niedziela) i jeszcze 3 dni — środa. Skoro środa jest „pojutrze”, to dziś jest poniedziałek.<\/details><br>\n13. Długość roku 2015 to 52 tygodnie i: *(4 pkt)* *(Alfik 2015, zad. 19)*\n    - A) 1 dzień\n    - B) 2 dni\n    - C) 3 dni\n    - D) 4 dni\n    - E) 5 dni\n    <details><summary>rozwiązanie<\/summary>A — 1 dzień<br>Rok 2015 nie jest przestępny, ma 365 dni. 52 tygodnie to 52 · 7 = 364 dni, więc zostaje 1 dzień.<\/details><br>\n14. 1 stycznia 2026 roku wypadł w czwartek. W którym najbliższym roku 1 stycznia znów wypadnie w czwartek? *(5 pkt)*\n    - A) 2031\n    - B) 2032\n    - C) 2033\n    - D) 2034\n    - E) 2037\n    <details><summary>rozwiązanie<\/summary>B — 2032<br>Po roku zwykłym 1 stycznia przesuwa się o 1 dzień tygodnia, a po przestępnym o 2. Liczymy: 2027 — piątek, 2028 — sobota, 2029 — poniedziałek (rok 2028 jest przestępny, więc skok o 2 dni), 2030 — wtorek, 2031 — środa, 2032 — czwartek. Pułapka: kto zapomni o roku przestępnym 2028, dostanie 2033.<\/details><br>\n15. Kasia dodała do siebie numery wszystkich dni pewnego miesiąca, które wypadły w niedzielę. Wyszło jej 80. Jakim dniem tygodnia był pierwszy dzień tego miesiąca? *(5 pkt)*\n    - A) czwartek\n    - B) piątek\n    - C) sobota\n    - D) niedziela\n    - E) poniedziałek\n    <details><summary>rozwiązanie<\/summary>C — sobota<br>Kolejne niedziele różnią się o 7 dni. Gdyby były 4 niedziele, to suma byłaby równa 4 razy pierwsza niedziela plus 7 + 14 + 21 = 42; ale 80 − 42 = 38 nie dzieli się przez 4 — nie pasuje. Więc niedziel jest 5: 5 razy pierwsza niedziela plus 7 + 14 + 21 + 28 = 70. Zostaje 80 − 70 = 10, czyli pierwsza niedziela to 10 : 5 = 2. dzień miesiąca. Sprawdzenie: 2 + 9 + 16 + 23 + 30 = 80. Skoro 2. jest niedziela, to 1. jest sobota.<\/details><br>\n16. W styczniu pewnego roku wypadło pięć piątków, ale tylko cztery soboty. W jakim dniu tygodnia wypadł pierwszy dzień tego stycznia? *(5 pkt)* *(Alfik 2024, zad. 25)*\n    - A) w środę\n    - B) w czwartek\n    - C) w piątek\n    - D) w sobotę\n    - E) w niedzielę\n    <details><summary>rozwiązanie<\/summary>A — w środę<br>Styczeń ma 31 dni = 4 pełne tygodnie i 3 dni. Pięć razy występują tylko dni tygodnia z dat 29, 30 i 31 (takie same jak 1, 2 i 3 stycznia). Piątek jest wśród nich, a sobota nie — więc piątek to ostatni z nich, 31 stycznia (i 3 stycznia). Zatem 1 stycznia to środa.<\/details><br>\n17. Ile jest takich miesięcy w roku, w których pierwszy i przedostatni dzień wypadają w tym samym dniu tygodnia? *(5 pkt)* *(Alfik 2023, zad. 30)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>D — 4<br>Ten sam dzień tygodnia co 1. mają dni 8., 15., 22., 29. Przedostatni dzień musi więc być 29., czyli miesiąc ma 30 dni. Takie miesiące to kwiecień, czerwiec, wrzesień i listopad — 4. (Luty w roku przestępnym ma przedostatni dzień 28., więc nie pasuje.)<\/details><br>\n18. Ile najwięcej piątków może wypaść w ciągu roku? *(5 pkt)* *(Alfik 2022, zad. 27)*\n    - A) 51\n    - B) 52\n    - C) 53\n    - D) 54\n    - E) 55\n    <details><summary>rozwiązanie<\/summary>C — 53<br>Rok ma 365 dni = 52 tygodnie i 1 dzień (przestępny: 52 tygodnie i 2 dni). Każdy dzień tygodnia występuje 52 razy, a 1 lub 2 dni tygodnia — 53 razy. Jeśli rok zaczyna się w piątek, piątków jest 53.<\/details><br>\n19. Jeśli pierwszy dzień roku (nieprzestępnego) wypadnie w piątek, to w jakim dniu tygodnia wypadnie ostatni dzień tego roku? *(5 pkt)* *(Alfik 2021, zad. 21)*\n    - A) w czwartek\n    - B) w piątek\n    - C) w sobotę\n    - D) w niedzielę\n    - E) w poniedziałek\n    <details><summary>rozwiązanie<\/summary>B — w piątek<br>Rok nieprzestępny ma 365 dni, a ostatni dzień jest 364 dni po pierwszym. 364 = 52 · 7, czyli dokładnie 52 tygodnie — ostatni dzień wypada w tym samym dniu tygodnia co pierwszy, w piątek. Pułapka: 365 dni po 1 stycznia to już 1 stycznia następnego roku (sobota).<\/details><br>\n20. W roku 2020 dzień 1 lutego wypada w innym dniu tygodnia niż dzień 1 marca. Jaki jest kolejny rok o tej samej własności? *(5 pkt)* *(Alfik 2019, zad. 22)*\n    - A) 2021\n    - B) 2022\n    - C) 2023\n    - D) 2024\n    - E) 2025\n    <details><summary>rozwiązanie<\/summary>D — 2024<br>Od 1 lutego do 1 marca mija tyle dni, ile ma luty. Gdy luty ma 28 dni (4 pełne tygodnie), dzień tygodnia się powtarza. Inny dzień wychodzi tylko w roku przestępnym (luty ma 29 dni). Następny rok przestępny po 2020 to 2024.<\/details><br>\n21. Ile najwięcej piątków może wypaść w ciągu 100 kolejnych dni? *(5 pkt)* *(Alfik 2019, zad. 23)*\n    - A) 13\n    - B) 14\n    - C) 15\n    - D) 16\n    - E) 17\n    <details><summary>rozwiązanie<\/summary>C — 15<br>100 dni = 14 pełnych tygodni (98 dni) + 2 dni. W 14 tygodniach jest dokładnie 14 piątków, a w 2 dodatkowych dniach może być jeszcze jeden. Najwięcej 15 — np. gdy pierwszy dzień jest piątkiem.<\/details><br>\n22. W pewnym roku jeden z miesięcy rozpoczął się i zakończył niedzielą. Pierwszy dzień owego roku wypadł w: *(5 pkt)* *(Alfik 2018, zad. 21)*\n    - A) wtorek\n    - B) środę\n    - C) czwartek\n    - D) piątek\n    - E) podana sytuacja jest niemożliwa\n    <details><summary>rozwiązanie<\/summary>C — czwartek<br>Pierwszy i ostatni dzień w tym samym dniu tygodnia ma tylko miesiąc 29-dniowy — luty roku przestępnego. 1 lutego to niedziela. Styczeń ma 31 dni = 4 tygodnie i 3 dni, więc 1 stycznia był 3 dni tygodnia wcześniej niż niedziela: w czwartek.<\/details><br>\n23. Jaka jest największa możliwa liczba takich miesięcy w jednym roku, których pierwszy i ostatni dzień wypadają w tym samym dniu tygodnia? *(5 pkt)* *(Alfik 2017, zad. 29)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>A — 1<br>Pierwszy i ostatni dzień miesiąca wypadają w tym samym dniu tygodnia, gdy od 1. do ostatniego dnia mija pełna liczba tygodni, czyli miesiąc ma 29 dni (1 + 28). Taki jest tylko luty w roku przestępnym — najwyżej jeden miesiąc w roku.<\/details><br>\n24. Jeśli pierwszy dzień bieżącego roku był niedzielą, to jakim dniem tygodnia będzie ostatni dzień tego roku? *(5 pkt)* *(Alfik 2017, zad. 30)*\n    - A) środą\n    - B) czwartkiem\n    - C) piątkiem\n    - D) sobotą\n    - E) niedzielą\n    <details><summary>rozwiązanie<\/summary>E — niedzielą<br>Bieżący rok to 2017 — nie jest przestępny, ma 365 dni = 52 tygodnie i 1 dzień. Dzień 365. (31 grudnia) przypada więc w tym samym dniu tygodnia co 1 stycznia: w niedzielę. (W roku przestępnym byłby to poniedziałek, ale takiej odpowiedzi nie ma.)<\/details><br>\n25. Jeśli pierwszy dzień pewnego roku (nieprzestępnego) wypadł w czwartek, to ostatni dzień owego roku wypadnie: *(5 pkt)* *(Alfik 2016, zad. 21)*\n    - A) w środę\n    - B) w czwartek\n    - C) w piątek\n    - D) w sobotę\n    - E) w niedzielę\n    <details><summary>rozwiązanie<\/summary>B — w czwartek<br>Rok ma 365 dni = 52 tygodnie i 1 dzień. Ostatni dzień (365.) jest o 364 dni = dokładnie 52 tygodnie po pierwszym, więc to ten sam dzień tygodnia — czwartek.<\/details><br>\n26. W pewnym miesiącu wypadło 5 wtorków i 5 czwartków, ale tylko 4 piątki. Jakim dniem tygodnia zaczął się ten miesiąc? *(5 pkt)* *(Alfik 2016, zad. 25)*\n    - A) wtorkiem\n    - B) środą\n    - C) czwartkiem\n    - D) piątkiem\n    - E) sobotą\n    <details><summary>rozwiązanie<\/summary>A — wtorkiem<br>Miesiąc to 4 pełne tygodnie i 0–3 dodatkowe dni; 5 razy występują tylko dni „dodatkowe” z początku miesiąca. Muszą to być wtorek i czwartek, ale nie piątek — więc dodatkowe dni to wtorek, środa, czwartek. Miesiąc ma 31 dni i zaczyna się we wtorek.<\/details><br>\n\n## B. Zegar ze wskazówkami\n\nCała tarcza to 360°, a liczby od 1 do 12 dzielą ją na 12 części po 30°. Pamiętaj: wskazówka godzinowa też cały czas się przesuwa!\n\n27. Jaki kąt tworzą wskazówki zegara dokładnie o godzinie 5:00? *(3 pkt)*\n    - A) 100°\n    - B) 120°\n    - C) 135°\n    - D) 150°\n    - E) 155°\n    <details><summary>rozwiązanie<\/summary>D — 150°<br>Między dwiema sąsiednimi liczbami na tarczy jest 360° : 12 = 30°. O 5:00 wskazówka minutowa wskazuje 12, a godzinowa 5 — dzieli je 5 takich odstępów, czyli 5 · 30° = 150°.<\/details><br>\n28. Zegar Tomka spóźnia się o 3 minuty na każdą godzinę. Tomek ustawił go na dokładny czas o 8:00 rano. Jaką godzinę pokaże ten zegar, gdy naprawdę będzie 16:00? *(3 pkt)*\n    - A) 15:36\n    - B) 15:52\n    - C) 15:57\n    - D) 16:24\n    - E) 16:36\n    <details><summary>rozwiązanie<\/summary>A — 15:36<br>Od 8:00 do 16:00 mija 8 godzin. W każdej godzinie zegar „gubi” 3 minuty, razem 8 · 3 = 24 minuty. Pokaże więc 16:00 − 24 min = 15:36. Pułapka: zegar, który się spóźnia, pokazuje <b>wcześniejszą<\/b> godzinę niż prawdziwa, a nie późniejszą (16:24).<\/details><br>\n29. Zegarmistrz zmontował zegar tak, że jego wskazówki obracają się z właściwą prędkością, ale do tyłu. Jeśli o godzinie 8:30 zegarmistrz ustawił prawidłowy czas, to którą godzinę zegar będzie wskazywał w południe? *(3 pkt)* *(Alfik 2025, zad. 9)*\n    - A) 4:00\n    - B) 4:30\n    - C) 5:00\n    - D) 5:30\n    - E) 6:00\n    <details><summary>rozwiązanie<\/summary>C — 5:00<br>Od 8:30 do 12:00 mijają 3 i pół godziny. Zegar cofa się o tyle samo: 8:30 − 3 h 30 min = 5:00.<\/details><br>\n30. Jacek zaobserwował, że w trakcie wycieczki klasowej wskazówka minutowa zegara wykonała o 88 obrotów więcej niż wskazówka godzinowa. Ile dni trwała wycieczka? *(3 pkt)* *(Alfik 2023, zad. 10)*\n    - A) 3\n    - B) 4\n    - C) 5\n    - D) 6\n    - E) 7\n    <details><summary>rozwiązanie<\/summary>B — 4<br>W ciągu 12 godzin minutowa robi 12 obrotów, a godzinowa 1 — różnica 11. 88 : 11 = 8, czyli 8 razy po 12 godzin = 96 godzin = 4 doby.<\/details><br>\n31. Ile obrotów wykona wskazówka minutowa zegara w czasie, w którym wskazówka godzinowa wykona dwa i pół obrotu? *(3 pkt)* *(Alfik 2022, zad. 2)*\n    - A) 12\n    - B) 15\n    - C) 18\n    - D) 24\n    - E) 30\n    <details><summary>rozwiązanie<\/summary>E — 30<br>Jeden obrót wskazówki godzinowej trwa 12 godzin, a w tym czasie minutowa robi 12 obrotów. Dwa i pół obrotu godzinowej to 2,5 · 12 = 30 obrotów minutowej.<\/details><br>\n32. Ile razy więcej obrotów wykona wskazówka minutowa zegara od wskazówki godzinowej w ciągu miesiąca? *(3 pkt)* *(Alfik 2018, zad. 10)*\n    - A) 6\n    - B) 12\n    - C) 14\n    - D) 24\n    - E) zależy od długości miesiąca\n    <details><summary>rozwiązanie<\/summary>B — 12<br>Przez każde 12 godzin wskazówka godzinowa robi 1 obrót, a minutowa 12 obrotów. Ten stosunek jest zawsze taki sam, niezależnie od długości miesiąca: 12 razy więcej.<\/details><br>\n33. Ile obrotów wykonuje wskazówka minutowa zegara w czasie, w którym wskazówka godzinowa wykonuje 2 obroty? *(3 pkt)* *(Alfik 2017, zad. 1)*\n    - A) 6\n    - B) 12\n    - C) 18\n    - D) 24\n    - E) 48\n    <details><summary>rozwiązanie<\/summary>D — 24<br>Wskazówka godzinowa robi jeden pełny obrót w 12 godzin, więc 2 obroty to 24 godziny. Wskazówka minutowa robi jeden obrót co godzinę, czyli w 24 godziny wykona 24 obroty.<\/details><br>\n34. Zegarmistrz zmontował zegar tak, że jego wskazówki przesuwają się z prawidłową prędkością, ale w odwrotnym kierunku („do tyłu”). Jeśli zegarmistrz ustawił prawidłowo zegar na godzinę 8:00, to którą godzinę zegar będzie wskazywał w południe? *(3 pkt)* *(Alfik 2015, zad. 1)*\n    - A) 4:00\n    - B) 6:00\n    - C) 8:00\n    - D) 10:00\n    - E) 12:00\n    <details><summary>rozwiązanie<\/summary>A — 4:00<br>Od 8:00 do południa mijają 4 godziny. Zegar „cofa się”, więc zamiast pójść 4 godziny do przodu, cofnie się o 4 godziny: 8 − 4 = 4. Pokaże 4:00.<\/details><br>\n35. Jaki kąt tworzą wskazówki zegara o godzinie 3:30? *(4 pkt)*\n    - A) 60°\n    - B) 75°\n    - C) 80°\n    - D) 90°\n    - E) 105°\n    <details><summary>rozwiązanie<\/summary>B — 75°<br>Wskazówka minutowa wskazuje 6. Godzinowa przez pół godziny przeszła połowę drogi od 3 do 4, czyli połowę z 30°, to jest 15°. Od 3 do 6 są 3 odstępy po 30°, czyli 90°, ale godzinowa jest już o 15° bliżej szóstki: 90° − 15° = 75°. Pułapka: 90° wychodzi, gdy myślimy, że godzinowa stoi dokładnie na 3.<\/details><br>\n36. Zegarmistrz omyłkowo zmontował mechanizm zegara w taki sposób, że jego wskazówki poruszały się z właściwą prędkością, ale do tyłu. Jeśli zegarmistrz ustawił prawidłową godzinę, to po jakim czasie nastąpi pierwszy moment, gdy zegar znów wskaże prawidłowy czas? *(4 pkt)* *(Alfik 2024, zad. 16)*\n    - A) po 3 godz.\n    - B) po 6 godz.\n    - C) po 9 godz.\n    - D) po 12 godz.\n    - E) po 24 godz.\n    <details><summary>rozwiązanie<\/summary>B — po 6 godz.<br>Prawdziwy czas idzie do przodu, a zegar tak samo szybko do tyłu, więc co godzinę „rozjeżdżają się” o 2 godziny. Spotkają się znów, gdy różnica wyniesie pełne 12 godzin tarczy, czyli po 12 : 2 = 6 godzinach. Np. ustawione na 12:00: po 6 h prawdziwa godzina to 6:00, a zegar cofnął się o 6 h — też wskazuje 6:00.<\/details><br>\n37. Zegarek Marka się popsuł i teraz wskazówki obracają się w nim z właściwą prędkością, ale „do tyłu”. Jeśli w południe Marek ustawił prawidłową godzinę, to którą godzinę wskaże jego zegarek o 16:30? *(4 pkt)* *(Alfik 2023, zad. 18)*\n    - A) 6:30\n    - B) 7:00\n    - C) 7:30\n    - D) 8:00\n    - E) 8:30\n    <details><summary>rozwiązanie<\/summary>C — 7:30<br>Od południa do 16:30 minęło 4 godziny 30 minut. Zegarek cofa się od 12:00 o 4 h 30 min: 12:00 → 8:00 → 7:30.<\/details><br>\n38. Ile razy w ciągu jednej doby (od 0:00 do 24:00) wskazówki zegara tworzą kąt prosty? *(5 pkt)*\n    - A) 22\n    - B) 24\n    - C) 44\n    - D) 48\n    - E) 96\n    <details><summary>rozwiązanie<\/summary>C — 44<br>W ciągu 12 godzin wskazówka minutowa dogania godzinową 11 razy (spotykają się o 12:00, potem około 1:05, 2:11 itd., aż znów o 12:00). Między dwoma spotkaniami minutowa „okrąża” godzinową, więc dokładnie 2 razy jest od niej o ćwierć obrotu — raz z jednej strony, raz z drugiej. To daje 11 · 2 = 22 kąty proste w 12 godzin, czyli 44 w ciągu doby. Pułapka: 48 wychodzi, gdy myślimy, że w każdej godzinie są 2 kąty proste — a np. między 2:00 a 4:00 są tylko 3 (około 2:27, o 3:00 i około 3:33).<\/details><br>\n39. Ile razy między godziną 9:00 a 15:00 zdarzy się sytuacja, w której wskazówki zegara (godzinowa i minutowa) pokryją się? *(5 pkt)* *(Alfik 2016, zad. 26)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 7\n    - E) 8\n    <details><summa
