trójka ma więc 38 : 2 = 19 lat (Marta 7, Jacek 3, Basia 9).<\/details><br>\n26. Bartek ma brata starszego o rok i siostrę młodszą o dwa lata. Cała trójka rodzeństwa łącznie ma 35 lat. Ile lat ma Bartek? *(5 pkt)* *(Alfik 2025, zad. 28)*\n    - A) 10\n    - B) 11\n    - C) 12\n    - D) 13\n    - E) 14\n    <details><summary>rozwiązanie<\/summary>C — 12<br>Gdyby wszyscy mieli tyle lat co Bartek, suma zmieniłaby się o −1 (brat) i +2 (siostra), czyli wynosiłaby 36. Bartek ma więc 36 : 3 = 12 lat (brat 13, siostra 10; 13 + 12 + 10 = 35).<\/details><br>\n27. Beata jest dwa razy starsza od Agaty, a Agata jest o 5 lat młodsza od Beaty. Ile lat mają łącznie obie dziewczynki? *(5 pkt)* *(Alfik 2022, zad. 23)*\n    - A) 5\n    - B) 8\n    - C) 10\n    - D) 12\n    - E) 15\n    <details><summary>rozwiązanie<\/summary>E — 15<br>Beata ma tyle, co „dwie Agaty”, więc różnica wieku to jedna Agata. Różnica wynosi 5 lat, więc Agata ma 5 lat, a Beata 10. Razem 15.<\/details><br>\n28. Pewien człowiek urodził się w roku, którego numer był kwadratem liczby naturalnej i zmarł w dniu swoich urodzin, w XX wieku, w roku, którego numer również był kwadratem liczby naturalnej. Ile lat przeżył ten człowiek? *(5 pkt)* *(Alfik 2022, zad. 28)*\n    - A) 43\n    - B) 44\n    - C) 86\n    - D) 87\n    - E) 88\n    <details><summary>rozwiązanie<\/summary>D — 87<br>XX wiek to lata 1901–2000. Jedyny kwadrat w tym przedziale to 44 · 44 = 1936. Poprzedni kwadrat to 43 · 43 = 1849 (jeszcze wcześniejszy, 1764, dałby 172 lata życia). Człowiek przeżył 1936 − 1849 = 87 lat.<\/details><br>\n29. Jacek, Bartek i Aneta mają łącznie 42 lata. Jacek jest dwa razy starszy od Anety i dwa razy młodszy od Bartka. O ile starszy jest Bartek od Jacka? *(5 pkt)* *(Alfik 2021, zad. 25)*\n    - A) mniej niż 10 lat\n    - B) 10 lat\n    - C) 11 lat\n    - D) 12 lat\n    - E) więcej niż 12 lat\n    <details><summary>rozwiązanie<\/summary>D — 12 lat<br>Aneta to 1 część, Jacek 2 części, Bartek 4 części — razem 7 części = 42 lata, więc część to 6 lat. Jacek ma 12, Bartek 24 lata. Bartek jest starszy o 12 lat.<\/details><br>\n30. Basia kończy dziś tyle lat, ile wynosi suma cyfr roku jej urodzenia, zaś Asia rok temu skończyła tyle lat, ile wynosi suma cyfr roku jej urodzenia. O ile młodsza jest Asia od Basi, jeśli żadna z dziewczynek nie skończyła jeszcze 18 lat? *(5 pkt)* *(Alfik 2018, zad. 30)*\n    - A) 5 lat\n    - B) 4 lata\n    - C) 3 lata\n    - D) 2 lata\n    - E) Asia jest starsza od Basi\n    <details><summary>rozwiązanie<\/summary>B — 4 lata<br>Konkurs odbył się w 2018 roku. Basia: urodzona w 2008 roku (suma cyfr 2 + 0 + 0 + 8 = 10) kończy w 2018 roku 10 lat — sprawdzając lata 2001–2018, tylko to pasuje. Asia: rok temu (2017) skończyła tyle lat, ile suma cyfr roku urodzenia — pasuje tylko 2012 (suma 5, a 2017 − 2012 = 5). Asia urodziła się 4 lata po Basi.<\/details><br>\n31. Staszek ma tyle lat co łącznie wszyscy jego bracia, a za 2 lata będzie miał o 8 lat mniej niż łącznie jego bracia. Ilu braci ma Staszek? *(5 pkt)* *(Alfik 2017, zad. 22)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>D — 5<br>Za 2 lata Staszek będzie starszy o 2 lata, a każdy brat też o 2 lata. Dziś różnica wynosi 0, a ma wynosić 8 na korzyść braci. Każdy brat „dokłada” bratom 2 lata, a Staszek 2 lata sobie — więc bracia muszą zyskać 2 + 8 = 10 lat, czyli braci jest 10 : 2 = 5.<\/details><br>\n\n## B. Ważenie i porównywanie\n\nTu porównujemy dwie sytuacje (np. pełne i do połowy pełne naczynie) albo kilka ważeń naraz. Szukaj różnicy albo dodawaj ważenia do siebie.\n\n32. Pełny słoik miodu waży 900 g, a pusty słoik waży 150 g. Ile waży ten słoik napełniony miodem do połowy? *(3 pkt)*\n    - A) 375 g\n    - B) 450 g\n    - C) 500 g\n    - D) 525 g\n    - E) 600 g\n    <details><summary>rozwiązanie<\/summary>D — 525 g<br>Sam miód w pełnym słoiku waży 900 − 150 = 750 g. Połowa miodu to 375 g. Do tego trzeba doliczyć słoik: 375 + 150 = 525 g. Pułapki: 450 g to połowa z 900 (podzielono też słoik), a 375 g to sam miód bez słoika.<\/details><br>\n33. Akwarium pełne wody waży 32 kg, a to samo akwarium napełnione wodą do połowy waży 18 kg. Ile waży puste akwarium? *(4 pkt)*\n    - A) 4 kg\n    - B) 9 kg\n    - C) 10 kg\n    - D) 14 kg\n    - E) 16 kg\n    <details><summary>rozwiązanie<\/summary>A — 4 kg<br>Różnica 32 − 18 = 14 kg to waga połowy wody. Cała woda waży więc 28 kg. Puste akwarium: 32 − 28 = 4 kg. Sprawdzenie: do połowy to 4 + 14 = 18 kg — zgadza się. Pułapka: 14 kg to połowa wody, a nie akwarium.<\/details><br>\n34. Kot i pies ważą razem 12 kg, pies i królik ważą razem 15 kg, a kot i królik ważą razem 9 kg. Ile waży pies? *(4 pkt)*\n    - A) 6 kg\n    - B) 7 kg\n    - C) 8 kg\n    - D) 9 kg\n    - E) 10 kg\n    <details><summary>rozwiązanie<\/summary>D — 9 kg<br>Dodajmy wszystkie trzy ważenia: 12 + 15 + 9 = 36 kg. Każde zwierzę zostało zważone dwa razy, więc wszystkie trzy razem ważą 36 : 2 = 18 kg. Kot z królikiem ważą 9 kg, więc pies waży 18 − 9 = 9 kg. (Kot waży 3 kg, królik 6 kg.)<\/details><br>\n35. Piotr przed wakacjami ważył o 2 kg więcej niż Marek. W czasie wakacji Piotr schudł o 1 kg, a Marek przytył o 3 kg i teraz: *(4 pkt)* *(Alfik 2025, zad. 20)*\n    - A) Piotr waży o 2 kg mniej niż Marek\n    - B) Piotr waży o 1 kg mniej niż Marek\n    - C) Piotr waży o 2 kg więcej niż Marek\n    - D) Piotr waży o 1 kg więcej niż Marek\n    - E) Piotr ma tę samą wagę co Marek\n    <details><summary>rozwiązanie<\/summary>A — Piotr waży o 2 kg mniej niż Marek<br>Przewaga Piotra (2 kg) maleje o 1 kg (schudł) i o 3 kg (Marek przytył), czyli razem o 4 kg. Teraz to Marek jest cięższy o 2 kg. Np. 42 kg i 40 kg → 41 kg i 43 kg.<\/details><br>\n36. Pani Magda przed wakacjami ważyła o 3 kg więcej od pani Beaty. W czasie wakacji pani Magda schudła o 2 kg, a pani Beata przytyła o 2 kg. Która z pań waży teraz więcej? *(4 pkt)* *(Alfik 2024, zad. 11)*\n    - A) pani Magda waży o 1 kg więcej od pani Beaty\n    - B) pani Magda waży o 2 kg więcej od pani Beaty\n    - C) pani Beata waży o 1 kg więcej od pani Magdy\n    - D) pani Beata waży o 2 kg więcej od pani Magdy\n    - E) obie panie ważą tyle samo\n    <details><summary>rozwiązanie<\/summary>C — pani Beata waży o 1 kg więcej od pani Magdy<br>Różnica 3 kg na korzyść Magdy zmniejsza się o 2 kg (Magda schudła) i jeszcze o 2 kg (Beata przytyła), czyli razem o 4 kg. 3 − 4 oznacza, że teraz Beata jest cięższa o 1 kg. Np. Magda 63 kg, Beata 60 kg → po wakacjach 61 kg i 62 kg.<\/details><br>\n37. Akwarium pełne wody waży 100 kg, a puste waży 12 kg. Ile waży akwarium napełnione wodą do połowy? *(4 pkt)* *(Alfik 2015, zad. 16)*\n    - A) 50 kg\n    - B) 54 kg\n    - C) 56 kg\n    - D) 60 kg\n    - E) 62 kg\n    <details><summary>rozwiązanie<\/summary>C — 56 kg<br>Sama woda waży 100 − 12 = 88 kg. Połowa wody to 44 kg, a z akwarium: 44 + 12 = 56 kg. Pułapka: 100 : 2 = 50 dzieli też szkło na pół.<\/details><br>\n38. Trzy jabłka i dwie gruszki ważą razem 800 g, a dwa jabłka i trzy gruszki ważą razem 900 g. Wszystkie jabłka ważą tyle samo i wszystkie gruszki ważą tyle samo. Ile ważą razem jedno jabłko i jedna gruszka? *(5 pkt)*\n    - A) 300 g\n    - B) 320 g\n    - C) 340 g\n    - D) 360 g\n    - E) 380 g\n    <details><summary>rozwiązanie<\/summary>C — 340 g<br>Połóżmy oba zestawy razem na wadze: 5 jabłek i 5 gruszek ważą 800 + 900 = 1700 g. To jest 5 par „jabłko + gruszka”, więc jedna para waży 1700 : 5 = 340 g. Nie trzeba wcale liczyć, ile waży samo jabłko (120 g) i sama gruszka (220 g).<\/details><br>\n39. Cegła waży o 2 kg więcej niż pół cegły. Ile waży cegła? *(5 pkt)* *(Alfik 2025, zad. 27)*\n    - A) 2 kg\n    - B) 3 kg\n    - C) 4 kg\n    - D) 5 kg\n    - E) 6 kg\n    <details><summary>rozwiązanie<\/summary>C — 4 kg<br>Cegła to „pół cegły + pół cegły”. Skoro waży o 2 kg więcej niż pół cegły, to druga połowa waży 2 kg, a cała cegła 4 kg. Pułapka: odpowiedź 2 kg to waga połowy cegły.<\/details><br>\n40. Na Igrzyskach Olimpijskich reprezentacja pewnego kraju zdobyła łącznie 3 medale złote i srebrne, łącznie 5 medali złotych i brązowych oraz łącznie 6 medali srebrnych i brązowych. Ile medali zdobyła reprezentacja tego kraju? *(5 pkt)* *(Alfik 2024, zad. 24)*\n    - A) 7\n    - B) 8\n    - C) 9\n    - D) 11\n    - E) 14\n    <details><summary>rozwiązanie<\/summary>A — 7<br>Dodajemy wszystkie trzy liczby: 3 + 5 + 6 = 14. W tej sumie każdy rodzaj medalu został policzony dwa razy, więc medali jest 14 : 2 = 7 (1 złoty, 2 srebrne, 4 brązowe).<\/details><br>\n41. Półtorej cegły waży o 4 kg więcej niż pół cegły. Ile waży cegła? *(5 pkt)* *(Alfik 2023, zad. 26)*\n    - A) 1 kg\n    - B) 2 kg\n    - C) 3 kg\n    - D) 4 kg\n    - E) 6 kg\n    <details><summary>rozwiązanie<\/summary>D — 4 kg<br>Półtorej cegły to pół cegły i jeszcze cała cegła. Różnica 4 kg to więc dokładnie jedna cegła.<\/details><br>\n42. Akwarium pełne wody waży 50 kg, a akwarium napełnione wodą do połowy waży 26 kg. Ile waży puste akwarium? *(5 pkt)* *(Alfik 2022, zad. 24)*\n    - A) 1 kg\n    - B) 2 kg\n    - C) 3 kg\n    - D) 4 kg\n    - E) 5 kg\n    <details><summary>rozwiązanie<\/summary>B — 2 kg<br>Różnica 50 − 26 = 24 kg to waga połowy wody. Cała woda waży 48 kg, więc puste akwarium waży 50 − 48 = 2 kg.<\/details><br>\n43. Puste akwarium waży 4 kg, a akwarium napełnione wodą do połowy waży 28 kg. Ile waży akwarium napełnione wodą po brzegi? *(5 pkt)* *(Alfik 2021, zad. 27)*\n    - A) 48 kg\n    - B) 50 kg\n    - C) 52 kg\n    - D) 54 kg\n    - E) 56 kg\n    <details><summary>rozwiązanie<\/summary>C — 52 kg<br>Połowa wody waży 28 − 4 = 24 kg, więc cała woda 48 kg. Pełne akwarium: 4 + 48 = 52 kg. Pułapka: 2 · 28 = 56 kg liczy szkło akwarium dwa razy.<\/details><br>\n44. Przed wakacjami pan Jacek ważył o 7 kg więcej od pana Waldka, ale w czasie wakacji pan Jacek schudł dokładnie o tyle, ile przytył pan Waldek. O ile przytył pan Waldek, jeśli teraz waży o 3 kg więcej od pana Jacka? *(5 pkt)* *(Alfik 2018, zad. 22)*\n    - A) 4 kg\n    - B) 5 kg\n    - C) 7 kg\n    - D) 8 kg\n    - E) 10 kg\n    <details><summary>rozwiązanie<\/summary>B — 5 kg<br>Różnica wag zmieniła się z „Jacek +7” na „Waldek +3”, czyli o 7 + 3 = 10 kg. Każdy kilogram, który Waldek przytył, a Jacek zgubił, zmienia różnicę o 2 kg. Zatem 10 : 2 = 5 kg.<\/details><br>\n45. Jeśli 3 ołówki kosztują tyle samo co 2 długopisy, to który z poniższych zestawów kosztuje najmniej? *(5 pkt)* *(Alfik 2017, zad. 28)*\n    - A) 5 ołówków\n    - B) 4 ołówki i 1 długopis\n    - C) 3 ołówki i 2 długopisy\n    - D) 2 ołówki i 3 długopisy\n    - E) 1 ołówek i 4 długopisy\n    <details><summary>rozwiązanie<\/summary>A — 5 ołówków<br>Długopis jest droższy od ołówka (2 długopisy = 3 ołówki). Każdy zestaw ma 5 sztuk, więc najtańszy jest ten, w którym jest najwięcej ołówków — 5 ołówków.<\/details><br>\n46. Jacek ma dwa rodzaje szklanych kulek: małe i duże. Trzy duże kulki i jedna mała ważą tyle co cztery małe kulki i jedna duża. W takim razie cztery duże kulki ważą tyle co: *(5 pkt)* *(Alfik 2015, zad. 24)*\n    - A) 5 małych\n    - B) 6 małych\n    - C) 7 małych\n    - D) 8 małych\n    - E) 9 małych\n    <details><summary>rozwiązanie<\/summary>B — 6 małych<br>Zdejmujemy z obu szalek po jednej dużej i jednej małej kulce: 2 duże ważą tyle co 3 małe. Podwajamy: 4 duże ważą tyle co 6 małych.<\/details><br>\n\n## C. Kulki, zakupy i „połowa”\n\nPrzekładanie kulek, liczenie reszty w sklepie i słowa „o połowę więcej / o połowę mniej”. Najczęstszy błąd: mylenie „o połowę więcej” z „dwa razy więcej”.\n\n47. W dwóch pudełkach jest razem 30 kulek. Ania przełożyła 4 kulki z pierwszego pudełka do drugiego i teraz w obu pudełkach jest tyle samo kulek. Ile kulek było na początku w pierwszym pudełku? *(3 pkt)*\n    - A) 11\n    - B) 13\n    - C) 15\n    - D) 17\n    - E) 19\n    <details><summary>rozwiązanie<\/summary>E — 19<br>Po przełożeniu w każdym pudełku jest po 30 : 2 = 15 kulek. Z pierwszego zabrano 4 kulki, więc wcześniej było tam 15 + 4 = 19 kulek (a w drugim 11). Pułapka: odpowiedź 17 wychodzi, gdy ktoś myśli, że różnica między pudełkami wynosiła 4 — a wynosiła 8, bo jedno pudełko straciło 4, a drugie zyskało 4.<\/details><br>\n48. Bartek kupił 3 zeszyty po 4,50 zł i długopis za 2,80 zł. Zapłacił banknotem 20 zł. Ile reszty powinien dostać? *(3 pkt)*\n    - A) 3,70 zł\n    - B) 4,20 zł\n    - C) 4,30 zł\n    - D) 4,70 zł\n    - E) 6,50 zł\n    <details><summary>rozwiązanie<\/summary>A — 3,70 zł<br>Zeszyty kosztują 3 · 4,50 = 13,50 zł. Razem z długopisem: 13,50 + 2,80 = 16,30 zł. Reszta: 20 − 16,30 = 3,70 zł. Pułapka: 6,50 zł to reszta, gdy zapomni się o długopisie.<\/details><br>\n49. W urnie są 4 kule czerwone i 8 kul niebieskich. Ile kul niebieskich trzeba przemalować na czerwono, żeby w każdym kolorze była taka sama liczba kul? *(3 pkt)* *(Alfik 2024, zad. 1)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 5\n    <details><summary>rozwiązanie<\/summary>B — 2<br>Wszystkich kul jest 12, więc na końcu ma być po 6 w każdym kolorze. Czerwonych jest 4, brakuje 2 — przemalowujemy 2 niebieskie (zostanie 8 − 2 = 6 niebieskich). Pułapka: różnica 8 − 4 = 4 to nie jest odpowiedź, bo przemalowanie jednej kuli zmniejsza różnicę aż o 2.<\/details><br>\n50. W pudełku są kulki zielone i czerwone, przy czym kulek czerwonych jest o dwie więcej niż zielonych. Ile kulek czerwonych trzeba przemalować na zielono, żeby kulek zielonych było o dwie więcej niż czerwonych? *(3 pkt)* *(Alfik 2022, zad. 5)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 4\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>B — 2<br>Przemalowanie jednej kulki zmniejsza liczbę czerwonych o 1 i zwiększa liczbę zielonych o 1, czyli zmienia różnicę o 2. Różnica ma się zmienić z „czerwonych o 2 więcej” na „zielonych o 2 więcej”, czyli o 4. Wystarczą 2 kulki. Przykład: 3 zielone i 5 czerwonych → 5 zielonych i 3 czerwone. Pułapka: odpowiedź 4.<\/details><br>\n51. Jeśli wodę z dwunastu pełnych dwulitrowych butelek przelejemy do butelek półtoralitrowych, to ile butelek napełnimy? *(3 pkt)* *(Alfik 2021, zad. 2)*\n    - A) 13\n    - B) 14\n    - C) 15\n    - D) 16\n    - E) 18\n    <details><summary>rozwiązanie<\/summary>D — 16<br>Wody jest 12 · 2 = 24 litry. Dwie butelki półtoralitrowe mieszczą 3 litry, więc 24 litry to 8 takich par, czyli 16 butelek.<\/details><br>\n52. Jaś ma 32 zł w monetach o nominałach: 1 zł, 2 zł i 5 zł. Ile monet ma Jaś, jeśli ma taką samą liczbę monet każdego z nominałów? *(3 pkt)* *(Alfik 2019, zad. 6)*\n    - A) 6\n    - B) 9\n    - C) 12\n    - D) 15\n    - E) 18\n    <details><summary>rozwiązanie<\/summary>C — 12<br>Komplet „1 zł + 2 zł + 5 zł” jest wart 8 zł. 32 zł to 32 : 8 = 4 takie komplety, a każdy ma 3 monety: 4 · 3 = 12 monet.<\/details><br>\n53. Jeśli dwa długopisy kosztują 14 zł, zaś dwa ołówki – 8 zł, to o ile droższy jest długopis od ołówka? *(3 pkt)* *(Alfik 2018, zad. 3)*\n    - A) 3 zł\n    - B) 4 zł\n    - C) 6 zł\n    - D) 8 zł\n    - E) 12 zł\n    <details><summary>rozwiązanie<\/summary>A — 3 zł<br>Długopis kosztuje 14 : 2 = 7 zł, ołówek 8 : 2 = 4 zł. Różnica: 7 − 4 = 3 zł. Pułapka: 14 − 8 = 6 zł to różnica dla dwóch sztuk.<\/details><br>\n54. Jeśli wodę z dwóch pełnych półtoralitrowych butelek przelejemy do butelek ćwierćlitrowych, to ile butelek napełnimy? *(3 pkt)* *(Alfik 2017, zad. 6)*\n    - A) 4\n    - B) 6\n    - C) 8\n    - D) 10\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>E — 12<br>Dwie butelki po 1,5 l to razem 3 litry. W jednym litrze mieszczą się 4 ćwierćlitrowe butelki, więc w 3 litrach — 3 · 4 = 12.<\/details><br>\n55. Beata przeczytała połowę 60-kartkowej książki. Ile stron przeczytała? *(3 pkt)* *(Alfik 2017, zad. 7)*\n    - A) 15\n    - B) 30\n    - C) 60\n    - D) 90\n    - E) 120\n    <details><summary>rozwiązanie<\/summary>C — 60<br>Połowa z 60 kartek to 30 kartek. Każda kartka ma dwie strony, więc 30 kartek to 60 stron. Pułapka: kartka i strona to nie to samo.<\/details><br>\n56. Której z poniższych kwot nie można wypłacić przy użyciu dokładnie czterech monet? *(3 pkt)* *(Alfik 2017, zad. 10)*\n    - A) 5 zł\n    - B) 6 zł\n    - C) 7 zł\n    - D) 8 zł\n    - E) każdą z wymienionych kwot można w ten sposób wypłacić\n    <details><summary>rozwiązanie<\/summary>E — każdą z wymienionych kwot można w ten sposób wypłacić<br>5 zł = 2 + 1 + 1 + 1, 6 zł = 2 + 2 + 1 + 1, 7 zł = 2 + 2 + 2 + 1, 8 zł = 2 + 2 + 2 + 2. Każda kwota da się wypłacić czterema monetami.<\/details><br>\n57. Której z poniższych kwot nie da się odliczyć czterema monetami? *(3 pkt)* *(Alfik 2016, zad. 1)*\n    - A) 5 zł\n    - B) 6 zł\n    - C) 10 zł\n    - D) 12 zł\n    - E) 15 zł\n    <details><summary>rozwiązanie<\/summary>E — 15 zł<br>Pozostałe się da: 5 = 2 + 1 + 1 + 1, 6 = 2 + 2 + 1 + 1, 10 = 5 + 2 + 2 + 1, 12 = 5 + 5 + 1 + 1. A 15 zł: trzy piątki dają już 15 zł, a czwarta moneta coś dokłada; bez trzech piątek najwięcej to 5 + 5 + 2 + 2 = 14 zł. Nie da się.<\/details><br>\n58. Banknoty pakowane są w paczki po sto sztuk. Ile paczek dwudziestozłotówek jest warte tyle co 4 paczki pięćdziesięciozłotówek? *(3 pkt)* *(Alfik 2016, zad. 9)*\n    - A) 5\n    - B) 6\n    - C) 8\n    - D) 9\n    - E) 10\n    <details><summary>rozwiązanie<\/summary>E — 10<br>Paczka pięćdziesięciozłotówek to 5000 zł, więc 4 paczki to 20 000 zł. Paczka dwudziestozłotówek to 2000 zł, a 20 000 : 2000 = 10 paczek.<\/details><br>\n59. Jeśli 30 orzechów podzielimy po równo między Andrzeja i jego pięciu braci, to ile orzechów otrzyma każdy z nich? *(3 pkt)* *(Alfik 2015, zad. 9)*\n    - A) 5\n    - B) 6\n    - C) 7\n    - D) 8\n    - E) 10\n    <details><summary>rozwiązanie<\/summary>A — 5<br>Andrzej i pięciu braci to 6 osób. 30 : 6 = 5. Pułapka: dzielenie przez 5 (zapominamy o Andrzeju) daje 6.<\/details><br>\n60. Ania ma o połowę więcej naklejek niż Bartek, a Bartek ma o połowę mniej naklejek niż Celina. Razem mają 90 naklejek. Ile naklejek ma Ania? *(4 pkt)*\n    - A) 30\n    - B) 36\n    - C) 40\n    - D) 45\n    - E) 60\n    <details><summary>rozwiązanie<\/summary>A — 30<br>Niech Bartek ma 2 „paczki” naklejek. „O połowę więcej” to 2 + 1 = 3 paczki — tyle ma Ania. Bartek ma połowę tego, co Celina, więc Celina ma 4 paczki. Razem 2 + 3 + 4 = 9 paczek = 90 naklejek, czyli paczka to 10 naklejek. Ania ma 3 · 10 = 30. Sprawdzenie: 30 + 20 + 40 = 90. Pułapka: „o połowę więcej” to nie „dwa razy więcej”.<\/details><br>\n61. Wśród 9 monet jest więcej złotówek niż dwuzłotówek i więcej dwuzłotówek niż pięciozłotówek. Jaka jest łączna wartość tych monet, jeśli w każdym z tych trzech nominałów są przynajmniej dwie monety? *(4 pkt)* *(Alfik 2025, zad. 11)*\n    - A) 16 zł\n    - B) 17 zł\n    - C) 18 zł\n    - D) 19 zł\n    - E) 20 zł\n    <details><summary>rozwiązanie<\/summary>E — 20 zł<br>Pięciozłotówek co najmniej 2, dwuzłotówek więcej, czyli co najmniej 3, złotówek jeszcze więcej, czyli co najmniej 4. To już 2 + 3 + 4 = 9 monet, więc jest dokładnie tak: 4 · 1 + 3 · 2 + 2 · 5 = 4 + 6 + 10 = 20 zł.<\/details><br>\n62. Dwumetrowy sznurek rozcięto na dwa kawałki, z których jeden był o metr krótszy niż drugi. Jaka była długość krótszego kawałka? *(4 pkt)* *(Alfik 2025, zad. 18)*\n    - A) 30 cm\n    - B) 40 cm\n    - C) 50 cm\n    - D) 60 cm\n    - E) 70 cm\n    <details><summary>rozwiązanie<\/summary>C — 50 cm<br>Odejmujemy różnicę: 200 cm − 100 cm = 100 cm to dwa jednakowe krótsze kawałki, więc krótszy ma 50 cm, a dłuższy 150 cm.<\/details><br>\n63. W woreczku jest 12 kulek – każda czerwona albo zielona. Gdyby dwie kulki zielone przemalować na czerwono, to w każdym kolorze byłoby tyle samo kulek. Ile zielonych kulek jest w woreczku? *(4 pkt)* *(Alfik 2025, zad. 19)*\n    - A) 6\n    - B) 7\n    - C) 8\n    - D) 9\n    - E) 10\n    <details><summary>rozwiązanie<\/summary>C — 8<br>Po przemalowaniu byłoby po 6 kulek każdego koloru. Przed przemalowaniem zielonych było o 2 więcej: 6 + 2 = 8 (a czerwonych 4).<\/details><br>\n64. W sakiewce jest kilkanaście monet, z których każda ma nominał 1 zł, 2 zł lub 5 zł. Wiemy, że łączna wartość monet każdego nominału jest taka sama. Jaka jest łączna wartość monet w tej sakiewce? *(4 pkt)* *(Alfik 2021, zad. 18)*\n    - A) 24 zł\n    - B) 27 zł\n    - C) 30 zł\n    - D) 33 zł\n    - E) 36 zł lub więcej\n    <details><summary>rozwiązanie<\/summary>C — 30 zł<br>Wartość monet jednego nominału musi dać się złożyć i z dwuzłotówek, i z pięciozłotówek, więc jest wielokrotnością 10 zł. Przy 10 zł: 10 złotówek + 5 dwuzłotówek + 2 pięciozłotówki = 17 monet (kilkanaście) i razem 30 zł. Przy 20 zł byłoby już 34 monety — za dużo.<\/details><br>\n65. Joasia ma kilkanaście monet, każda o nominale 1 zł, 2 zł lub 5 zł. Wiemy, że Joasia ma tyle samo dwuzłotówek, co pięciozłotówek oraz że jej pięciozłotówki są łącznie warte tyle co jej złotówki. Ile pieniędzy ma Joasia? *(4 pkt)* *(Alfik 2021, zad. 19)*\n    - A) 20 zł\n    - B) 24 zł\n    - C) 25 zł\n    - D) 30 zł\n    - E) więcej niż 30 zł\n    <details><summary>rozwiązanie<\/summary>B — 24 zł<br>Na każdą pięciozłotówkę przypada jedna dwuzłotówka i 5 złotówek — to paczka 7 monet warta 5 + 2 + 5 = 12 zł. Kilkanaście monet to dokładnie 2 takie paczki (14 monet; 1 paczka to 7, 3 paczki to 21). Razem 2 · 12 = 24 zł.<\/details><br>\n66. Na wycieczkę pojechało 12 uczniów klasy 5a razem z 12 uczniami klasy 5b. Łącznie na wycieczkę pojechało tyle samo chłopców co dziewczynek. Jeśli na wycieczce było dokładnie 8 chłopców z klasy 5a, to ile było dziewczynek z klasy 5b? *(4 pkt)* *(Alfik 2019, zad. 18)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 7\n    - E) 8\n    <details><summary>rozwiązanie<\/summary>E — 8<br>Razem 24 uczniów, czyli 12 chłopców i 12 dziewczynek. Z 5a jest 8 chłopców, więc z 5b jest 12 − 8 = 4 chłopców. Klasa 5b ma 12 uczniów, więc dziewczynek z 5b jest 12 − 4 = 8.<\/details><br>\n67. W restauracji jest 12 jednakowych kwadratowych stolików i przy każdym są cztery miejsca. Niektóre stoliki są złączone, tworząc dłuższy stół (złożony dwóch stolików), przy którym jest sześć miejsc. Ile stolików jest ustawionych pojedynczo, jeśli w całej restauracji jest 40 miejsc? *(4 pkt)* *(Alfik 2016, zad. 14)*\n    - A) 4\n    - B) 6\n    - C) 8\n    - D) 9\n    - E) 10\n    <details><summary>rozwiązanie<\/summary>A — 4<br>Gdyby wszystkie 12 stolików stało osobno, byłoby 48 miejsc. Każde złączenie dwóch stolików zabiera 2 miejsca. Brakuje 8 miejsc, więc są 4 złączone pary (8 stolików), a pojedynczo stoją 12 − 8 = 4 stoliki. Sprawdzenie: 4 · 4 + 4 · 6 = 40.<\/details><br>\n68. W klasie Asi chłopców jest o 5 więcej niż dziewcząt. Ilu uczniów liczy klasa, jeśli dziewcząt jest o połowę mniej niż chłopców? *(4 pkt)* *(Alfik 2016, zad. 20)*\n    - A) 12\n    - B) 15\n    - C) 18\n    - D) 24\n    - E) za mało danych do rozwiązania zadania\n    <details><summary>rozwiązanie<\/summary>B — 15<br>Chłopców jest dwa razy więcej niż dziewcząt, czyli chłopcy = dziewczęta + tyle samo dziewcząt. Ta „nadwyżka” to 5, więc dziewcząt jest 5, chłopców 10. Razem 15.<\/details><br>\n69. Kasia rozmieniła posiadany banknot na cztery banknoty, a następnie każdy z otrzymanych banknotów rozmieniła na cztery monety. Banknot o jakim nominale Kasia miała na początku? *(4 pkt)* *(Alfik 2015, zad. 11)*\n    - A) 10 zł\n    - B) 20 zł\n    - C) 50 zł\n    - D) 100 zł\n    - E) 200 zł\n    <details><summary>rozwiązanie<\/summary>C — 50 zł<br>Największa moneta to 5 zł, więc cztery monety dają najwyżej 20 zł. Zatem cztery mniejsze banknoty to dziesiątki lub dwudziestki (np. 10 zł = 5 + 2 + 2 + 1, 20 zł = 5 + 5 + 5 + 5). Cztery takie banknoty dają od 40 do 80 zł, a jedyny banknot w tym zakresie to 50 zł = 20 + 10 + 10 + 10.<\/details><br>\n70. Pani Marta zapłaciła za zakupy wręczając kasjerce trzy różne banknoty (żadne dwa z nich nie wystarczyły), a kasjerka wydała jej resztę w trzech jednakowych banknotach. Ile kosztowały zakupy? *(4 pkt)* *(Alfik 2015, zad. 14)*\n    - A) 170 zł\n    - B) 220 zł\n    - C) 270 zł\n    - D) 290 zł\n    - E) 320 zł\n    <details><summary>rozwiązanie<\/summary>E — 320 zł<br>Banknoty to 10, 20, 50, 100, 200, 500 zł. Pasuje: pani Marta dała 200 + 100 + 50 = 350 zł i dostała resztę 3 · 10 zł = 30 zł, więc zakupy kosztowały 320 zł. Żadne dwa banknoty nie wystarczały (najwięcej 200 + 100 = 300 zł). Sprawdzenie wszystkich możliwości pokazuje, że żadna inna kwota z odpowiedzi nie da się tak uzyskać.<\/details><br>\n71. 24-metrowy sznurek rozcięto na dwa kawałki, z których jeden był 3 razy dłuższy niż drugi. Jaką długość miał dłuższy kawałek? *(4 pkt)* *(Alfik 2015, zad. 18)*\n    - A) 14 m\n    - B) 16 m\n    - C) 18 m\n    - D) 20 m\n    - E) 22 m\n    <details><summary>rozwiązanie<\/summary>C — 18 m<br>Krótszy kawałek to 1 część, dłuższy to 3 części — razem 4 części = 24 m. Jedna część to 6 m, a dłuższy kawałek 3 · 6 = 18 m.<\/details><br>\n72. Jeśli Kuba kupi 5 jednakowych lizaków, zostaną mu 2 zł. Gdyby chciał kupić 7 takich lizaków, zabrakłoby mu 1,60 zł. Ile pieniędzy ma Kuba? *(5 pkt)*\n    - A) 9,00 zł\n    - B) 11,00 zł\n    - C) 12,60 zł\n    - D) 13,40 zł\n    - E) 14,00 zł\n    <details><summary>rozwiązanie<\/summary>B — 11,00 zł<br>Dwa dodatkowe lizaki (od 5 do 7) kosztują tyle, ile Kubie zostaje, plus tyle, ile by mu brakowało: 2 + 1,60 = 3,60 zł. Jeden lizak kosztuje więc 1,80 zł. Pięć lizaków to 9 zł, a do tego zostaje 2 zł, więc Kuba ma 11 zł. Sprawdzenie: 7 lizaków kosztuje 12,60 zł, a 12,60 − 11 = 1,60 zł.<\/details><br>\n73. Ola, Ela i Iza miały cukierki. Najpierw Ola dała Eli tyle cukierków, ile Ela wtedy miała. Potem Ela dała Izie tyle cukierków, ile Iza wtedy miała. Na koniec każda z dziewczynek miała po 12 cukierków. Ile cukierków miała Ola na początku? *(5 pkt)*\n    - A) 12\n    - B) 15\n    - C) 18\n    - D) 21\n    - E) 24\n    <details><summary>rozwiązanie<\/summary>D — 21<br>Liczymy od końca. Iza dostała tyle, ile miała, czyli podwoiła swoje cukierki: przed tym miała 12 : 2 = 6, a Ela oddała jej 6, więc wcześniej Ela miała 12 + 6 = 18. Ela też wcześniej podwoiła swoje cukierki dzięki Oli: miała 18 : 2 = 9, a Ola dała jej 9, więc Ola miała 12 + 9 = 21. Sprawdzenie: na początku 21, 9, 6 (razem 36 = 3 · 12). Pułapka: 18 to cukierki Eli, a nie Oli.<\/details><br>\n74. Ania ma trochę monet – same złotówki i dwuzłotówki. Ile pieniędzy ma Ania, jeśli złotówek ma o 2 sztuki więcej niż dwuzłotówek, ale jej dwuzłotówki są o 2 zł więcej warte niż jej złotówki? *(5 pkt)* *(Alfik 2024, zad. 27)*\n    - A) 13 zł\n    - B) 14 zł\n    - C) 15 zł\n    - D) 16 zł\n    - E) 17 zł\n    <details><summary>rozwiązanie<\/summary>B — 14 zł<br>Próbujemy: 4 dwuzłotówki (8 zł) i 6 złotówek (6 zł) — złotówek jest o 2 więcej, a dwuzłotówki są warte o 2 zł więcej. Razem 8 + 6 = 14 zł. (Dla 3 dwuzłotówek: 6 zł i 5 zł — różnica tylko 1 zł; dla 5: 10 zł i 7 zł — różnica 3 zł.)<\/details><br>\n75. Dwumetrowy sznurek rozcięto na dwa kawałki, z których pierwszy był 3 razy dłuższy niż drugi. O ile dłuższy był pierwszy kawałek sznurka od drugiego kawałka? *(5 pkt)* *(Alfik 2024, zad. 28)*\n    - A) 50 cm\n    - B) 100 cm\n    - C) 120 cm\n    - D) 130 cm\n    - E) 150 cm\n    <details><summary>rozwiązanie<\/summary>B — 100 cm<br>Sznurek to 4 równe części (3 w pierwszym kawałku i 1 w drugim). 200 cm : 4 = 50 cm, więc kawałki mają 150 cm i 50 cm. Różnica to 100 cm. Pułapka: 150 cm to długość pierwszego kawałka, a nie różnica.<\/details><br>\n76. Pan Jacek ma kilkoro dzieci, między które podzielił 30 cukierków w taki sposób, że każdy chłopiec dostał tyle cukierków ile miał sióstr, a każda dziewczynka – tyle cukierków ile ma braci. Ile dzieci ma pan Jacek? *(5 pkt)* *(Alfik 2023, zad. 21)*\n    - A) 5\n    - B) 6\n    - C) 7\n    - D) 8\n    - E) 9\n    <details><summary>rozwiązanie<\/summary>D — 8<br>Każdy chłopiec dostaje tyle, ile jest dziewczynek, więc chłopcy razem dostają (chłopcy · dziewczynki). Dziewczynki razem — tyle samo. Zatem 2 · chłopcy · dziewczynki = 30, czyli chłopcy · dziewczynki = 15. To 3 i 5 (8 dzieci) albo 1 i 15 (16 dzieci — tego nie ma wśród odpowiedzi i to nie „kilkoro”). Odpowiedź: 8.<\/details><br>\n77. W pewnej klasie dziewczynek jest dwa razy więcej niż chłopców, a chłopców jest o 8 mniej niż dziewczynek. Ilu uczniów liczy ta klasa? *(5 pkt)* *(Alfik 2023, zad. 22)*\n    - A) 12\n    - B) 16\n    - C) 18\n    - D) 24\n    - E) 30\n    <details><summary>rozwiązanie<\/summary>D — 24<br>Dziewczynki to „dwóch chłopców”, więc różnica 8 to dokładnie liczba chłopców. Chłopców jest 8, dziewczynek 16, razem 24.<\/details><br>\n78. Dwumetrowy sznurek rozcięto na dwa kawałki. Pierwszy kawałek był o 40 cm dłuższy niż drugi. Jaka była długość drugiego kawałka? *(5 pkt)* *(Alfik 2023, zad. 24)*\n    - A) 40 cm\n    - B) 50 cm\n    - C) 60 cm\n    - D) 80 cm\n    - E) 1 m\n    <details><summary>rozwiązanie<\/summary>D — 80 cm<br>2 m = 200 cm. Bez nadwyżki: 200 − 40 = 160 cm, połowa to 80 cm — to drugi kawałek. Pierwszy ma 120 cm. Sprawdzenie: 80 + 120 = 200.<\/details><br>\n79. Bartek i Agata znaleźli skarb – kilkanaście monet, same dwuzłotówki i pięciozłotówki. Podzielili skarb w ten sposób, że Bartek wziął wszystkie dwuzłotówki, a Agata – pięciozłotówki. Okazało się, że każde z dzieci dostało taką samą kwotę pieniędzy. Jaka była wartość skarbu? *(5 pkt)* *(Alfik 2023, zad. 28)*\n    - A) 20 zł\n    - B) 24 zł\n    - C) 36 zł\n    - D) 40 zł\n    - E) 60 zł\n    <details><summary>rozwiązanie<\/summary>D — 40 zł<br>Kwota każdego dziecka dzieli się przez 2 i przez 5, czyli przez 10. Przy 10 zł: 5 dwuzłotówek + 2 pięciozłotówki = 7 monet (za mało). Przy 20 zł: 10 + 4 = 14 monet — kilkanaście! Przy 30 zł byłoby już 21 monet. Skarb to 2 · 20 = 40 zł.<\/details><br>\n80. Dwumetrowy sznurek rozcięto na takie dwa kawałki, że pierwszy z nich był o 40 cm dłuższy niż drugi. Pierwszy kawałek sznurka był dłuższy od drugiego kawałka: *(5 pkt)* *(Alfik 2022, zad. 26)*\n    - A) półtora raza\n    - B) dwa razy\n    - C) dwa i pół raza\n    - D) trzy razy\n    - E) cztery razy\n    <details><summary>rozwiązanie<\/summary>A — półtora raza<br>2 m = 200 cm. Odejmujemy nadwyżkę: 200 − 40 = 160 cm, dzielimy na pół: drugi kawałek ma 80 cm, pierwszy 120 cm. 120 : 80 = 1,5, czyli półtora raza.<\/details><br>\n81. W pewnej dwudziestokilkuosobowej klasie dziewczynek jest o połowę więcej niż chłopców. Ilu uczniów liczy ta klasa? *(5 pkt)* *(Alfik 2022, zad. 29)*\n    - A) 22\n    - B) 23\n    - C) 24\n    - D) 25\n    - E) 27\n    <details><summary>rozwiązanie<\/summary>D — 25<br>„O połowę więcej” oznacza: na każdych 2 chłopców przypadają 3 dziewczynki. Uczniowie dzielą się więc na grupki po 5, a liczba uczniów jest wielokrotnością 5. Między 21 a 29 jest tylko 25 (10 chłopców i 15 dziewczynek).<\/details><br>\n82. Dwumetrowy sznurek rozcięto na dwa kawałki, z których jeden był trzy razy dłuższy niż drugi. Jaka była długość krótszego kawałka? *(5 pkt)* *(Alfik 2021, zad. 28)*\n    - A) 40 cm\n    - B) 60 cm\n    - C) 70 cm\n    - D) 75 cm\n    - E) inna odpowiedź\n    <details><summary>rozwiązanie<\/summary>E — inna odpowiedź<br>Krótszy kawałek to 1 część, dłuższy 3 części — razem 4 części = 200 cm. Krótszy ma 200 : 4 = 50 cm, a takiej liczby nie ma wśród odpowiedzi A–D. Pułapka: 200 : 3 ≈ 67 cm to nie to samo.<\/details><br>\n83. W pewnej klasie na każdego chłopca przypadały dwie dziewczynki. Po tym jak do klasy dołączyło 5 dziewcząt, na każdego chłopca przypadają trzy dziewczynki. Ilu uczniów liczy teraz ta klasa? *(5 pkt)* *(Alfik 2019, zad. 21)*\n    - A) 12\n    - B) 15\n    - C) 16\n    - D) 18\n    - E) 20\n    <details><summary>rozwiązanie<\/summary>E — 20<br>Każdy chłopiec „dostał” jedną nową dziewczynkę do pary, a nowych dziewcząt jest 5 — więc chłopców jest 5. Teraz dziewcząt jest 3 · 5 = 15, a razem 5 + 15 = 20 uczniów.<\/details><br>\n84. W pewnym hotelu jest łącznie 28 miejsc w pokojach 2-osobowych, 3-osobowych i 4-osobowych. Wiadomo, że dokładnie połowa pokoi to pokoje 2-osobowe. Ile pokoi jest w tym hotelu? *(5 pkt)* *(Alfik 2019, zad. 26)*\n    - A) 8\n    - B) 9\n    - C) 10\n    - D) 11\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>C — 10<br>Połącz każdy pokój 2-osobowy w parę z innym pokojem: para ma 2 + 3 = 5 albo 2 + 4 = 6 miejsc. Liczba par p spełnia 5p ≤ 28 ≤ 6p, więc p = 5 (25 ≤ 28 ≤ 30). Pokoi jest 2 · 5 = 10, np. 5 dwójek, 2 trójki i 3 czwórki: 10 + 6 + 12 = 28.<\/details><br>\n85. W pudełku są kulki zielone i czerwone. Kulek zielonych jest o pięć mniej niż czerwonych, a kulek czerwonych jest o połowę więcej niż zielonych. Ile łącznie kulek (obu kolorów) jest w tym pudełku? *(5 pkt)* *(Alfik 2019, zad. 27)*\n    - A) 18\n    - B) 20\n    - C) 21\n    - D) 24\n    - E) 25\n    <details><summary>rozwiązanie<\/summary>E — 25<br>Czerwonych jest o połowę zielonych więcej niż zielonych, a ta różnica wynosi 5. Zatem połowa zielonych to 5, czyli zielonych jest 10, a czerwonych 15. Razem 25.<\/details><br>\n86. Jacek ma dwa razy więcej pieniędzy niż Ala, ale trzy razy mniej niż Bartek. Ile pieniędzy ma Jacek, jeśli łącznie cała trójka dzieci ma 27 złotych? *(5 pkt)* *(Alfik 2019, zad. 29)*\n    - A) 3 zł\n    - B) 4 zł\n    - C) 5 zł\n    - D) 6 zł\n    - E) 7 zł\n    <details><summary>rozwiązanie<\/summary>D — 6 zł<br>Jeśli Ala ma 1 część, to Jacek ma 2 części, a Bartek 3 · 2 = 6 części. Razem 9 części = 27 zł, czyli część to 3 zł. Jacek ma 2 · 3 = 6 zł.<\/details><br>\n87. W pewnej klasie chłopców jest półtora raza więcej niż dziewcząt, a dziewcząt – o 4 mniej niż chłopców. Ilu uczniów liczy ta klasa? *(5 pkt)* *(Alfik 2018, zad. 23)*\n    - A) 15\n    - B) 16\n    - C) 18\n    - D) 20\n    - E) 24\n    <details><summary>rozwiązanie<\/summary>D — 20<br>Chłopców jest tyle co dziewcząt plus połowa dziewcząt. Ta połowa to różnica 4, więc dziewcząt jest 8, chłopców 12. Razem 20.<\/details><br>\n88. Wśród 12 monet – złotówek, dwuzłotówek i pięciozłotówek – o łącznej wartości 30 zł jest więcej pięciozłotówek niż dwuzłotówek. Ile złotówek jest wśród tych monet? *(5 pkt)* *(Alfik 2018, zad. 25)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>E — 6<br>Gdyby wszystkie 12 monet było złotówkami, mielibyśmy 12 zł — brakuje 18 zł. Zamiana złotówki na dwuzłotówkę dodaje 1 zł, a na pięciozłotówkę 4 zł. Potrzeba więc: (liczba dwuzłotówek) + 4 · (liczba pięciozłotówek) = 18. Możliwości: 2 dwuzłotówki i 4 pięciozłotówki, 6 i 3, 10 i 2. Więcej pięciozłotówek jest tylko w pierwszej: 2 + 4 = 6 monet, więc złotówek jest 12 − 6 = 6.<\/details><br>\n89. W klasie Marty dziewcząt jest o połowę więcej niż chłopców, a chłopców jest o 6 mniej niż dziewcząt. Ile dziewcząt jest w tej klasie? *(5 pkt)* *(Alfik 2017, zad. 24)*\n    - A) 9\n    - B) 10\n    - C) 12\n    - D) 15\n    - E) 18\n    <details><summary>rozwiązanie<\/summary>E — 18<br>„O połowę więcej” oznacza, że dziewcząt jest tyle co chłopców plus połowa chłopców. Ta połowa to właśnie różnica 6, więc chłopców jest 12, a dziewcząt 12 + 6 = 18.<\/details><br>\n90. Maciek wyjął z kieszeni trzy monety o łącznej wartości 6 zł, po czym wrzucił je z powrotem do kieszeni. Jeszcze raz z tej samej kieszeni wyjął trzy monety i tym razem ich łączna wartość wyniosła 3 zł. Ile pieniędzy miał w kieszeni Maciek, jeśli wiemy, że miał dokładnie cztery monety? *(5 pkt)* *(Alfik 2016, zad. 27)*\n    - A) 6 zł\n    - B) 7 zł\n    - C) 8 zł\n    - D) 9 zł\n    - E) 10 zł\n    <details><summary>rozwiązanie<\/summary>C — 8 zł<br>Za każdym razem w kieszeni zostaje jedna moneta. Za drugim razem wyjęto o 3 zł mniej, więc moneta pozostawiona w kieszeni za drugim razem jest o 3 zł droższa niż za pierwszym. Jedyne takie monety to 5 zł i 2 zł. Razem: 6 + 2 = 8 zł (monety 5 zł, 2 zł, 50 gr, 50 gr).<\/details><br>\n91. W koszyku jest 12 kulek w czterech różnych kolorach: białym, zielonym, czerwonym i niebieskim. Kulek białych i zielonych razem jest tyle samo kulek czerwonych i niebieskich. Kulek białych jest o dwie więcej niż zielonych, a czerwonych jest o jedną mniej niż białych. Ile kulek niebieskich jest w tym koszyku? *(5 pkt)* *(Alfik 2015, zad. 22)*\n    - A) 2\n    - B) 3\n    - C) 4\n    - D) 5\n    - E) 6\n    <details><summary>rozwiązanie<\/summary>B — 3<br>Białych i zielonych jest razem połowa z 12, czyli 6. Białych jest o 2 więcej niż zielonych, więc białych 4, zielonych 2. Czerwonych jest o 1 mniej niż białych: 3. Niebieskich: 6 − 3 = 3.<\/details><br>\n92. Na pastwisku są krowy i gęsi, które łącznie mają 32 głowy i 100 nóg. Ile krów jest na tym pastwisku? *(5 pkt)* *(Alfik 2015, zad. 26)*\n    - A) 12\n    - B) 14\n    - C) 16\n    - D) 18\n    - E) 20\n    <details><summary>rozwiązanie<\/summary>D — 18<br>Gdyby wszystkie 32 zwierzęta były gęśmi, miałyby 64 nogi. Brakuje 36 nóg, a każda krowa ma o 2 nogi więcej niż gęś: 36 : 2 = 18 krów. Sprawdzenie: 18 · 4 + 14 · 2 = 72 + 28 = 100.<\/details><br>\n93. Jacek, Wacek i Staszek mają łącznie 16 cukierków. Wiadomo przy tym, że Wacek ma o 1 cukierka więcej niż Jacek, a Staszek ma o 2 cukierki więcej niż Wacek. Ile cukierków mają łącznie Jacek i Wacek? *(5 pkt)* *(Alfik 2015, zad. 27)*\n    - A) 8\n    - B) 9\n    - C) 10\n    - D) 11\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>B — 9<br>Wacek ma o 1 więcej niż Jacek, a Staszek o 3 więcej niż Jacek. Gdyby zabrać te nadwyżki (1 + 3 = 4), zostałoby 12 cukierków po równo: Jacek ma 4, Wacek 5, Staszek 7. Jacek i Wacek razem: 9.<\/details><br>\n94. Jacek ma dwadzieścia kilka banknotów o nominałach 10 zł, 20 zł i 50 zł. Wiemy, że „dwudziestek” ma trzy razy tyle co „dziesiątek”, a łączna wartość jego „dwudziestek” jest taka sama jak wartość jego „pięćdziesiątek”. Ile pieniędzy ma Jacek? *(5 pkt)* *(Alfik 2015, zad. 30)*\n    - A) 600 zł\n    - B) 650 zł\n    - C) 700 zł\n    - D) 750 zł\n    - E) 800 zł\n    <details><summary>rozwiązanie<\/summary>B — 650 zł<br>Dwudziestki są warte tyle co pięćdziesiątki, więc ich wartość dzieli się przez 100 (wspólna wielokrotność 20 i 50) — dwudziestek jest 5, 10, 15, … Jest ich 3 razy więcej niż dziesiątek, więc dwudziestek 15, dziesiątek 5, a pięćdziesiątek 300 : 50 = 6. Razem 26 banknotów („dwadzieścia kilka”). Kwota: 50 + 300 + 300 = 650 zł. Większa wersja (10, 30, 12) daje już 52 banknoty.<\/details><br>\n\n## D. Ruch i prędkość\n\nPrędkość 60 km/h znaczy: w 1 godzinę 60 km, czyli 1 km na minutę. Często wygodnie jest liczyć, o ile jeden pojazd „zbliża się” do drugiego w każdej godzinie.\n\n95. Ewa jedzie rowerem ze stałą prędkością 15 km/h. Ile minut zajmie jej przejechanie 5 km? *(3 pkt)*\n    - A) 10\n    - B) 12\n    - C) 15\n    - D) 18\n    - E) 20\n    <details><summary>rozwiązanie<\/summary>E — 20<br>15 km/h znaczy, że w 60 minut Ewa przejeżdża 15 km. Odcinek 5 km to trzecia część z 15 km, więc zajmie trzecią część godziny: 60 : 3 = 20 minut. Pułapka: 60 : 5 = 12 to błąd — 5 km to nie piąta część tego, co Ewa przejeżdża w godzinę, tylko trzecia.<\/details><br>\n96. Połączono ze sobą dwa koła zębate – większe ma 24 zęby, a mniejsze ma 16 zębów. Ile obrotów wykonuje mniejsze koło w czasie, gdy większe wykonuje 4 obroty? *(4 pkt)* *(Alfik 2023, zad. 12)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 8\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>C — 6<br>Przy 4 obrotach większe koło „przesuwa” 4 · 24 = 96 zębów. Tyle samo zębów przesuwa mniejsze, czyli wykonuje 96 : 16 = 6 obrotów.<\/details><br>\n97. Z jaką prędkością jedzie samochód, który pokonuje 800 metrów w ciągu minuty? *(4 pkt)* *(Alfik 2018, zad. 11)*\n    - A) 40 km/h\n    - B) 48 km/h\n    - C) 56 km/h\n    - D) 60 km/h\n    - E) 80 km/h\n    <details><summary>rozwiązanie<\/summary>B — 48 km/h<br>W godzinie jest 60 minut, więc samochód przejedzie 60 · 800 m = 48 000 m = 48 km. To 48 km/h.<\/details><br>\n98. Samochód w ciągu kwadransa pokonuje odległość dwa razy większą niż rowerzysta pokonuje w ciągu godziny. Ile razy szybciej niż rowerzysta porusza się samochód? *(4 pkt)* *(Alfik 2017, zad. 12)*\n    - A) 2 razy\n    - B) 4 razy\n    - C) 8 razy\n    - D) 16 razy\n    - E) oba pojazdy poruszają się z taką samą prędkością\n    <details><summary>rozwiązanie<\/summary>C — 8 razy<br>W godzinie są 4 kwadranse. W każdym kwadransie samochód przejeżdża 2 „rowerowe godziny”, więc w ciągu godziny przejedzie 4 · 2 = 8 razy więcej niż rowerzysta.<\/details><br>\n99. Tata wyjechał z domu o 9:00 samochodem ze stałą prędkością 60 km/h. O 9:30 tą samą drogą wyjechała za nim mama ze stałą prędkością 90 km/h. O której godzinie mama dogoni tatę? *(5 pkt)*\n    - A) 10:00\n    - B) 10:15\n    - C) 10:30\n    - D) 11:00\n    - E) 11:30\n    <details><summary>rozwiązanie<\/summary>C — 10:30<br>Do 9:30 tata przejechał 30 km (pół godziny po 60 km/h). Od tej chwili mama w każdej godzinie przejeżdża o 90 − 60 = 30 km więcej niż tata, czyli zbliża się do niego o 30 km na godzinę. Odrobienie 30 km zajmie jej 1 godzinę, więc dogoni tatę o 10:30. Sprawdzenie: o 10:30 tata przejechał 1,5 · 60 = 90 km, mama 1 · 90 = 90 km.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. C — 29\n2. A — 2 *(Alfik 2025, zad. 5)*\n3. E — 9 *(Alfik 2025, zad. 6)*\n4. B — 7 *(Alfik 2021, zad. 5)*\n5. D — 4 *(Alfik 2021, zad. 8)*\n6. E — są w tym samym wieku *(Alfik 2018, zad. 1)*\n7. A — 6 *(Alfik 2018, zad. 8)*\n8. E — o 8 lat *(Alfik 2016, zad. 2)*\n9. D — 6 *(Alfik 2015, zad. 8)*\n10. B — 4\n11. B — 12\n12. E — 12 *(Alfik 2025, zad. 15)*\n13. A — 4 *(Alfik 2024, zad. 13)*\n14. D — 18 *(Alfik 2024, zad. 17)*\n15. C — 3 *(Alfik 2023, zad. 15)*\n16. C — 7 *(Alfik 2022, zad. 15)*\n17. B — 3 *(Alfik 2021, zad. 13)*\n18. B — 6 *(Alfik 2019, zad. 11)*\n19. C — 7 *(Alfik 2019, zad. 16)*\n20. B — 18 *(Alfik 2019, zad. 20)*\n21. E — 32 *(Alfik 2016, zad. 13)*\n22. B — za 2 lata *(Alfik 2015, zad. 17)*\n23. B — 8 lat *(Alfik 2015, zad. 20)*\n24. E — 70\n25. A — 19 *(Alfik 2025, zad. 25)*\n26. C — 12 *(Alfik 2025, zad. 28)*\n27. E — 15 *(Alfik 2022, zad. 23)*\n28. D — 87 *(Alfik 2022, zad. 28)*\n29. D — 12 lat *(Alfik 2021, zad. 25)*\n30. B — 4 lata *(Alfik 2018, zad. 30)*\n31. D — 5 *(Alfik 2017, zad. 22)*\n32. D — 525 g\n33. A — 4 kg\n34. D — 9 kg\n35. A — Piotr waży o 2 kg mniej niż Marek *(Alfik 2025, zad. 20)*\n36. C — pani Beata waży o 1 kg więcej od pani Magdy *(Alfik 2024, zad. 11)*\n37. C — 56 kg *(Alfik 2015, zad. 16)*\n38. C — 340 g\n39. C — 4 kg *(Alfik 2025, zad. 27)*\n40. A — 7 *(Alfik 2024, zad. 24)*\n41. D — 4 kg *(Alfik 2023, zad. 26)*\n42. B — 2 kg *(Alfik 2022, zad. 24)*\n43. C — 52 kg *(Alfik 2021, zad. 27)*\n44. B — 5 kg *(Alfik 2018, zad. 22)*\n45. A — 5 ołówków *(Alfik 2017, zad. 28)*\n46. B — 6 małych *(Alfik 2015, zad. 24)*\n47. E — 19\n48. A — 3,70 zł\n49. B — 2 *(Alfik 2024, zad. 1)*\n50. B — 2 *(Alfik 2022, zad. 5)*\n51. D — 16 *(Alfik 2021, zad. 2)*\n52. C — 12 *(Alfik 2019, zad. 6)*\n53. A — 3 zł *(Alfik 2018, zad. 3)*\n54. E — 12 *(Alfik 2017, zad. 6)*\n55. C — 60 *(Alfik 2017, zad. 7)*\n56. E — każdą z wymienionych kwot można w ten sposób wypłacić *(Alfik 2017, zad. 10)*\n57. E — 15 zł *(Alfik 2016, zad. 1)*\n58. E — 10 *(Alfik 2016, zad. 9)*\n59. A — 5 *(Alfik 2015, zad. 9)*\n60. A — 30\n61. E — 20 zł *(Alfik 2025, zad. 11)*\n62. C — 50 cm *(Alfik 2025, zad. 18)*\n63. C — 8 *(Alfik 2025, zad. 19)*\n64. C — 30 zł *(Alfik 2021, zad. 18)*\n65. B — 24 zł *(Alfik 2021, zad. 19)*\n66. E — 8 *(Alfik 2019, zad. 18)*\n67. A — 4 *(Alfik 2016, zad. 14)*\n68. B — 15 *(Alfik 2016, zad. 20)*\n69. C — 50 zł *(Alfik 2015, zad. 11)*\n70. E — 320 zł *(Alfik 2015, zad. 14)*\n71. C — 18 m *(Alfik 2015, zad. 18)*\n72. B — 11,00 zł\n73. D — 21\n74. B — 14 zł *(Alfik 2024, zad. 27)*\n75. B — 100 cm *(Alfik 2024, zad. 28)*\n76. D — 8 *(Alfik 2023, zad. 21)*\n77. D — 24 *(Alfik 2023, zad. 22)*\n78. D — 80 cm *(Alfik 2023, zad. 24)*\n79. D — 40 zł *(Alfik 2023, zad. 28)*\n80. A — półtora raza *(Alfik 2022, zad. 26)*\n81. D — 25 *(Alfik 2022, zad. 29)*\n82. E — inna odpowiedź *(Alfik 2021, zad. 28)*\n83. E — 20 *(Alfik 2019, zad. 21)*\n84. C — 10 *(Alfik 2019, zad. 26)*\n85. E — 25 *(Alfik 2019, zad. 27)*\n86. D — 6 zł *(Alfik 2019, zad. 29)*\n87. D — 20 *(Alfik 2018, zad. 23)*\n88. E — 6 *(Alfik 2018, zad. 25)*\n89. E — 18 *(Alfik 2017, zad. 24)*\n90. C — 8 zł *(Alfik 2016, zad. 27)*\n91. B — 3 *(Alfik 2015, zad. 22)*\n92. D — 18 *(Alfik 2015, zad. 26)*\n93. B — 9 *(Alfik 2015, zad. 27)*\n94. B — 650 zł *(Alfik 2015, zad. 30)*\n95. E — 20\n96. C — 6 *(Alfik 2023, zad. 12)*\n97. B — 48 km/h *(Alfik 2018, zad. 11)*\n98. C — 8 razy *(Alfik 2017, zad. 12)*\n99. C — 10:30\n\n## Ściąga\n\n| Sytuacja | Co robić |\n|---|---|\n| Wiek, „za ile lat / ile lat temu” | Różnica wieku jest stała. Dodając lata, dodaj je **każdej** osobie. |\n| „X razy starszy” | Różnica wieku = (X − 1) części młodszej osoby. |\n| Pełne / do połowy pełne | Pełne − do połowy = połowa zawartości. Naczynie = pełne − cała zawartość. |\n| Kilka ważeń w parach | Dodaj wszystkie ważenia, podziel przez to, ile razy każda rzecz się pojawia. |\n| Przekładanie k przedmiotów | Różnica między pojemnikami zmienia się o 2 · k. |\n| Oddawanie / podwajanie | Licz od końca: „podwoił” ↔ „podziel przez 2”. |\n| „O połowę więcej” | To 1,5 razy tyle (np. 20 → 30), a nie 2 razy tyle. |\n| „O połowę mniej” | To połowa (np. 40 → 20). |\n| Prędkość | droga = prędkość · czas; 60 km/h = 1 km na minutę. |\n| Pościg | Szybszy zbliża się o (różnicę prędkości) w każdej godzinie. |\n", "dawne": "04-zadania-tekstowe"}, {"path": "matematyczny/klasa-5/zadania-wg-typu/05-kombinatoryka.md", "id": "mat5/05-kombinatoryka", "kind": "dzial", "short": "05 Liczenie i kombinatoryka", "sek": "mat5", "sekNazwa": "Matematyczny · kl. 5", "md": "# 05. Liczenie i kombinatoryka\n\n**Dlaczego warto:** W arkuszu Alfika prawie zawsze są 3–5 zadań typu „ile jest…”: liczb o danych cyfrach, meczów, dróg, prostokątów na rysunku albo strojów. Trudność polega na tym, żeby niczego nie pominąć i niczego nie policzyć dwa razy.\n\n- **W pliku:** 24 zadań: 15 nowych i 9 z prawdziwych arkuszy Alfika (10 za 3 pkt, 7 za 4 pkt, 7 za 5 pkt).\n\n**Wskazówki**\n- Gdy wybierasz kolejno kilka rzeczy (cyfrę dziesiątek, potem jedności; bluzkę, potem spódnicę), **mnożysz** liczby możliwości.\n- Uważaj na zero: liczba nie może zaczynać się od 0.\n- Przy uściskach dłoni i meczach „każdy z każdym” jedno spotkanie łączy dwie osoby — dlatego dzielisz przez 2.\n- Drogi w kratce licz „ile dróg prowadzi do tego punktu” — dopisuj liczby przy skrzyżowaniach (każda liczba = suma liczby z lewej i liczby z dołu).\n- Gdy liczysz figury na rysunku, rób to po kolei według wielkości albo według boków — nigdy „na oko”.\n- Jeśli wypisanie wszystkich przypadków zajmie minutę, wypisz je — to najpewniejsza metoda.\n\n**Spis treści**\n\n- [A. Liczby z danych cyfr](#a-liczby-z-danych-cyfr)\n- [B. Uściski dłoni i mecze](#b-uściski-dłoni-i-mecze)\n- [C. Drogi i trasy](#c-drogi-i-trasy)\n- [D. Figury na rysunku](#d-figury-na-rysunku)\n- [E. Stroje i kanapki](#e-stroje-i-kanapki)\n- [Klucz odpowiedzi](#klucz-odpowiedzi)\n- [Ściąga](#ściąga)\n\n---\n\n## A. Liczby z danych cyfr\n\nUstalamy cyfry po kolei: najpierw pierwszą, potem drugą itd., i mnożymy liczby możliwości. Czasem lepiej po prostu wypisać wszystkie liczby.\n\n1. Ile liczb dwucyfrowych można zapisać za pomocą cyfr 1, 3 i 5, jeśli cyfry w liczbie nie mogą się powtarzać? *(3 pkt)*\n   - A) 3\n   - B) 5\n   - C) 6\n   - D) 8\n   - E) 9\n   <details><summary>rozwiązanie<\/summary>C — 6<br>Cyfrę dziesiątek wybieramy na 3 sposoby, a cyfrę jedności już tylko na 2 (bo nie może być taka sama). 3 · 2 = 6. Wypisane: 13, 15, 31, 35, 51, 53. Pułapka: 9 to wynik, gdy cyfry mogą się powtarzać (11, 33, 55 też).<\/details><br>\n2. Ile jest takich liczb trzycyfrowych, które zapisywane są przy użyciu jednej jedynki i dwóch dwójek? *(3 pkt)* *(Alfik 2025, zad. 10)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) 6\n   <details><summary>rozwiązanie<\/summary>C — 3<br>Wystarczy wybrać miejsce dla jedynki (setki, dziesiątki albo jedności): 122, 212, 221. Pułapka: 6 wychodzi, gdy traktujemy obie dwójki jako różne cyfry.<\/details><br>\n3. Ile jest takich trzycyfrowych liczb, które można ułożyć z cyfr 2, 3, 5 (wykorzystując każdą cyfrę jeden raz)? *(3 pkt)* *(Alfik 2022, zad. 4)*\n   - A) 2\n   - B) 3\n   - C) 4\n   - D) 5\n   - E) 6\n   <details><summary>rozwiązanie<\/summary>E — 6<br>Wypisujemy: 235, 253, 325, 352, 523, 532. Na pierwszym miejscu 3 możliwości, na drugim 2, na trzecim 1: 3 · 2 · 1 = 6.<\/details><br>\n4. Ile jest trzycyfrowych liczb podzielnych przez 4, które można ułożyć z cyfr 2, 3, 4 (każdą cyfrę wykorzystując tylko raz)? *(3 pkt)* *(Alfik 2021, zad. 7)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) więcej niż 4\n   <details><summary>rozwiązanie<\/summary>B — 2<br>Liczba dzieli się przez 4, gdy jej dwie ostatnie cyfry tworzą liczbę podzielną przez 4. Możliwe końcówki: 23, 32, 24, 42, 34, 43 — przez 4 dzielą się tylko 32 i 24. Liczby: 432 i 324, czyli 2.<\/details><br>\n5. Ile jest liczb dwucyfrowych, które można ułożyć z cyfr 2, 5, 7 (wykorzystując każdą cyfrę najwyżej raz)? *(3 pkt)* *(Alfik 2016, zad. 7)*\n   - A) 3\n   - B) 4\n   - C) 5\n   - D) 6\n   - E) więcej niż 6\n   <details><summary>rozwiązanie<\/summary>D — 6<br>Cyfrę dziesiątek wybieramy na 3 sposoby, cyfrę jedności spośród pozostałych dwóch: 3 · 2 = 6. To 25, 27, 52, 57, 72, 75.<\/details><br>\n6. Ile liczb trzycyfrowych można zapisać za pomocą cyfr 0, 2, 4, 6, jeśli cyfry w liczbie nie mogą się powtarzać? *(4 pkt)*\n   - A) 12\n   - B) 18\n   - C) 24\n   - D) 27\n   - E) 48\n   <details><summary>rozwiązanie<\/summary>B — 18<br>Cyfra setek nie może być zerem, więc mamy na nią 3 możliwości (2, 4 lub 6). Na cyfrę dziesiątek zostają 3 cyfry (teraz już można użyć zera), a na cyfrę jedności 2 cyfry. 3 · 3 · 2 = 18. Pułapka: 4 · 3 · 2 = 24 liczy też „liczby” zaczynające się od 0, np. 024.<\/details><br>\n7. Ile jest liczb trzycyfrowych, w których iloczyn cyfr jest równy 8? *(4 pkt)*\n   - A) 6\n   - B) 7\n   - C) 9\n   - D) 10\n   - E) 12\n   <details><summary>rozwiązanie<\/summary>D — 10<br>Zera być nie może (iloczyn byłby 0). Trzy cyfry o iloczynie 8 to: {1, 2, 4}, {1, 1, 8} oraz {2, 2, 2}. Trzy różne cyfry 1, 2, 4 można ustawić na 6 sposobów (124, 142, 214, 241, 412, 421). Cyfry 1, 1, 8 dają tylko 3 liczby: 118, 181, 811. Cyfry 2, 2, 2 dają jedną liczbę: 222. Razem 6 + 3 + 1 = 10. Pułapka: 6 — gdy pominiemy zestawy z powtarzającymi się cyframi.<\/details><br>\n8. Bartek nie pamięta numeru PIN do swojego telefonu, ale pamięta, że składał się on z 4 cyfr ustawionych od najmniejszej do największej i ostatnią cyfrą było 4. Ile co najmniej kombinacji musiałby wypróbować, żeby mieć pewność, że jedna z nich będzie prawidłowym numerem PIN? *(4 pkt)* *(Alfik 2024, zad. 19)*\n   - A) 1\n   - B) 2\n   - C) 3\n   - D) 4\n   - E) 5\n   <details><summary>rozwiązanie<\/summary>D — 4<br>Przed czwórką stoją trzy różne cyfry mniejsze od 4, ustawione rosnąco — wybieramy je z 0, 1, 2, 3. Wystarczy wybrać, której z tych czterech cyfr brakuje: 1234, 0234, 0134, 0124. To 4 możliwości.<\/details><br>\n9. Z cyfr 1, 2, 3, 4 (każdej użytej dokładnie raz) tworzymy liczby czterocyfrowe. Ile z nich jest podzielnych przez 4? *(5 pkt)*\n   - A) 6\n   - B) 8\n   - C) 12\n   - D) 18\n   - E) 24\n   <details><summary>rozwiązanie<\/summary>A — 6<br>Liczba dzieli się przez 4, gdy jej dwie ostatnie cyfry tworzą liczbę podzielną przez 4. Z naszych cyfr (różnych) da się ułożyć takie końcówki: 12, 24, 32 (a 14, 34, 42 się nie dzielą). Przy każdej końcówce dwie pozostałe cyfry ustawiamy z przodu na 2 sposoby, np. 3412 i 4312. Razem 3 · 2 = 6. Pułapka: 12 to liczba wszystkich liczb <i>parzystych<\/i>, a nie podzielnych przez 4.<\/details><br>\n\n## B. Uściski dłoni i mecze\n\n„Każdy z każdym” — każda osoba spotyka wszystkie pozostałe, ale jedno spotkanie liczymy raz, a nie dwa razy.\n\n10. Sześcioro przyjaciół spotkało się w parku i każdy podał rękę każdemu innemu dokładnie jeden raz. Ile było uścisków dłoni? *(3 pkt)*\n    - A) 12\n    - B) 15\n    - C) 18\n    - D) 30\n    - E) 36\n    <details><summary>rozwiązanie<\/summary>B — 15<br>Pierwsza osoba podaje rękę 5 innym, druga — 4 nowym (z pierwszą już się przywitała), trzecia — 3 nowym, i tak dalej: 5 + 4 + 3 + 2 + 1 = 15. Inaczej: każdy z 6 podaje rękę 5 osobom, 6 · 5 = 30, ale każdy uścisk policzyliśmy dwa razy, więc 30 : 2 = 15. Pułapka: 30.<\/details><br>\n11. Między każdymi dwoma wyspami w archipelagu 4 wysp zbudowano jeden most. Ile mostów zbudowano? *(3 pkt)* *(Alfik 2023, zad. 6)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 12\n    - E) 16\n    <details><summary>rozwiązanie<\/summary>C — 6<br>Każda wyspa łączy się z 3 innymi: 4 · 3 = 12, ale każdy most policzyliśmy dwa razy (z obu końców). 12 : 2 = 6. Pułapka: odpowiedź 12.<\/details><br>\n12. W turnieju piłkarskim każda drużyna zagrała z każdą inną dokładnie jeden mecz. Rozegrano 21 meczów. Ile drużyn wzięło udział w turnieju? *(4 pkt)*\n    - A) 7\n    - B) 9\n    - C) 11\n    - D) 14\n    - E) 21\n    <details><summary>rozwiązanie<\/summary>A — 7<br>Przy n drużynach meczów jest 1 + 2 + … + (n − 1). Dodajemy po kolei: 1, 3, 6, 10, 15, 21 — suma 21 wychodzi przy dodaniu liczb od 1 do 6, czyli drużyn jest 7. Sprawdzenie: 7 · 6 : 2 = 21. Pułapka: 14 = 2 · 7 albo 21 (jakby każdy mecz to była nowa drużyna).<\/details><br>\n13. W turnieju piłki nożnej każda z 8 drużyn rozegrała jeden mecz z każdą z pozostałych. Ile meczy rozegrano? *(4 pkt)* *(Alfik 2016, zad. 18)*\n    - A) 27\n    - B) 28\n    - C) 30\n    - D) 32\n    - E) 56\n    <details><summary>rozwiązanie<\/summary>B — 28<br>Każda drużyna gra 7 meczów: 8 · 7 = 56, ale każdy mecz liczymy wtedy dwa razy (dla obu drużyn). Meczów jest 56 : 2 = 28. Pułapka: odpowiedź 56.<\/details><br>\n14. Na zbiórce harcerskiej każdy harcerz podał rękę każdemu innemu dokładnie raz. Tylko dwaj bracia Kowalscy nie podali sobie ręki, bo widzieli się już rano w domu. Razem było 44 uściski dłoni. Ilu harcerzy było na zbiórce? *(5 pkt)*\n    - A) 6\n    - B) 7\n    - C) 8\n    - D) 9\n    - E) 10\n    <details><summary>rozwiązanie<\/summary>E — 10<br>Gdyby bracia też podali sobie rękę, uścisków byłoby 44 + 1 = 45. Szukamy liczby harcerzy, dla której „każdy z każdym” daje 45: 1 + 2 + 3 + … + 9 = 45, więc harcerzy jest 10. Sprawdzenie: 10 · 9 : 2 = 45, minus uścisk braci = 44. Pułapka: 9 harcerzy daje tylko 9 · 8 : 2 = 36 uścisków.<\/details><br>\n15. W turnieju szachowym każdy szachista miał rozegrać z każdym innym jedną partię. Jeden z uczestników, Jacek, rozchorował się i wycofał się z turnieju po rozegraniu tylko części z zaplanowanych partii. Łącznie rozegrano 20 partii. Ilu szachistów (wliczając Jacka) brało udział w turnieju? *(5 pkt)* *(Alfik 2025, zad. 30)*\n    - A) 4\n    - B) 5\n    - C) 6\n    - D) 7\n    - E) 8\n    <details><summary>rozwiązanie<\/summary>D — 7<br>Pozostali gracze rozegrali wszystkie partie między sobą. Przy 6 pozostałych to 6 · 5 : 2 = 15 partii, a Jacek zagrał 5 z 6 zaplanowanych — razem 20. Przy 5 pozostałych byłoby 10 + co najwyżej 4 &lt; 20, a przy 7 pozostałych już 21 &gt; 20. Zatem graczy było 6 + 1 = 7.<\/details><br>\n16. W pewnym mieście są 4 linie metra, a na każdej linii są 4 stacje. Jaka jest łączna liczba stacji metra w tym mieście, jeśli każda stacja leży na dokładnie dwóch liniach metra? *(5 pkt)* *(Alfik 2018, zad. 29)*\n    - A) 4\n    - B) 8\n    - C) 12\n    - D) 14\n    - E) 16\n    <details><summary>rozwiązanie<\/summary>B — 8<br>Gdyby policzyć stacje osobno na każdej linii, wyszłoby 4 · 4 = 16. Ale każdą stację policzyliśmy dwa razy (leży na dwóch liniach), więc stacji jest 16 : 2 = 8.<\/details><br>\n\n## C. Drogi i trasy\n\nGdy trasa ma kilka etapów, mnożymy liczby możliwości na każdym etapie. W kratce dopisujemy przy każdym skrzyżowaniu, iloma drogami można do niego dojść.\n\n17. Z domu Zosi do szkoły prowadzą 3 różne ścieżki, a ze szkoły do parku 4 różne ścieżki. Na ile sposobów Zosia może przejść z domu do parku, idąc przez szkołę? *(3 pkt)*\n    - A) 7\n    - B) 10\n    - C) 12\n    - D) 14\n    - E) 16\n    <details><summary>rozwiązanie<\/summary>C — 12<br>Każdą z 3 ścieżek do szkoły można połączyć z każdą z 4 ścieżek do parku: 3 · 4 = 12 tras. Pułapka: 3 + 4 = 7 — dodawanie zamiast mnożenia.<\/details><br>\n18. Plan osiedla to kwadrat podzielony ulicami na 3 · 3 = 9 jednakowych kwadratowych kwartałów (4 ulice poziome i 4 pionowe). Mrówka idzie ulicami z lewego dolnego rogu do prawego górnego rogu i porusza się tylko w prawo albo w górę. Iloma różnymi drogami może przejść? *(5 pkt)*\n    - A) 6\n    - B) 9\n    - C) 12\n    - D) 16\n    - E) 20\n    <details><summary>rozwiązanie<\/summary>E — 20<br>Przy każdym skrzyżowaniu wpisujemy, iloma drogami da się do niego dojść. Na dolnej ulicy i lewej ulicy wszędzie jest 1. Każde inne skrzyżowanie = liczba z lewej + liczba z dołu. Rzędy od dołu: 1, 1, 1, 1 → 1, 2, 3, 4 → 1, 3, 6, 10 → 1, 4, 10, 20. W prawym górnym rogu jest 20. Pułapka: 16 to liczba skrzyżowań, a nie dróg.<\/details><br>\n\n## D. Figury na rysunku\n\nProstokąt wyznaczają dwie linie pionowe i dwie poziome. Licz figury systematycznie: najpierw złożone z jednej części, potem z dwóch, z trzech…\n\n19. Prostokąt podzielono trzema pionowymi odcinkami na 4 węższe prostokąty ułożone obok siebie w jednym rzędzie. Ile wszystkich prostokątów widać na tym rysunku? *(3 pkt)*\n    - A) 4\n    - B) 5\n    - C) 8\n    - D) 10\n    - E) 12\n    <details><summary>rozwiązanie<\/summary>D — 10<br>Liczymy według szerokości: z jednego paska — 4 prostokąty, z dwóch sąsiednich pasków — 3, z trzech — 2, z czterech (cały prostokąt) — 1. Razem 4 + 3 + 2 + 1 = 10. Pułapka: 5 to tylko 4 małe paski i cały prostokąt.<\/details><br>\n20. Z wierzchołka trójkąta poprowadzono 3 odcinki do przeciwległego boku, tak jak na rysunku (dolny bok jest podzielony na 4 części). Ile wszystkich trójkątów jest na tym rysunku? <svg width=\"220\" height=\"120\" viewBox=\"0 0 220 120\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" style=\"display:block\"><path d=\"M110 10 L10 110 L210 110 Z\"/><path d=\"M110 10 L60 110 M110 10 L110 110 M110 10 L160 110\"/><\/svg> *(4 pkt)*\n    - A) 4\n    - B) 6\n    - C) 10\n    - D) 12\n    - E) 16\n    <details><summary>rozwiązanie<\/summary>C — 10<br>Każdy trójkąt na rysunku ma górny wierzchołek, a jego dolny bok to kawałek dolnej linii między dwoma z 5 zaznaczonych punktów. Liczymy dolne boki: złożone z 1 części — 4, z 2 części — 3, z 3 części — 2, z 4 części — 1. Razem 4 + 3 + 2 + 1 = 10. Pułapka: 4 to tylko najmniejsze trójkąty.<\/details><br>\n21. Prostokąt podzielono na 6 jednakowych kwadratów: 2 rzędy po 3 kwadraty (jak na rysunku). Ile wszystkich prostokątów (licząc także kwadraty) widać na tym rysunku? <svg width=\"130\" height=\"90\" viewBox=\"0 0 130 90\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" style=\"display:block\"><rect x=\"5\" y=\"5\" width=\"120\" height=\"80\"/><path d=\"M45 5 V85 M85 5 V85 M5 45 H125\"/><\/svg> *(5 pkt)*\n    - A) 6\n    - B) 8\n    - C) 12\n    - D) 15\n    - E) 18\n    <details><summary>rozwiązanie<\/summary>E — 18<br>Prostokąt wyznaczamy, wybierając 2 z 4 linii pionowych i 2 z 3 linii poziomych. Dwie linie pionowe z czterech można wybrać na 6 sposobów (tak jak w zadaniu 10: 3 + 2 + 1), a dwie poziome z trzech na 3 sposoby. 6 · 3 = 18. Można też policzyć po kształtach: 1×1 — 6, 1×2 — 4, 1×3 — 2, 2×1 — 3, 2×2 — 2, 2×3 — 1; razem 18. Pułapka: zapomnieć o prostokątach „stojących” (2×1) albo o całym prostokącie.<\/details><br>\n\n## E. Stroje i kanapki\n\nKażdy wybór „jedno z tego i jedno z tamtego” to mnożenie. Gdy są zakazy (np. „nie w tym samym kolorze”), najprościej policzyć wszystko i odjąć zakazane.\n\n22. Kasia ma 3 różne bluzki i 4 różne spódnice. Ile różnych strojów „bluzka + spódnica” może ułożyć? *(3 pkt)*\n    - A) 7\n    - B) 12\n    - C) 14\n    - D) 16\n    - E) 24\n    <details><summary>rozwiązanie<\/summary>B — 12<br>Do każdej z 3 bluzek można założyć każdą z 4 spódnic: 3 · 4 = 12 strojów. Pułapka: 3 + 4 = 7.<\/details><br>\n23. W szkolnym sklepiku robi się kanapki. Najpierw wybiera się chleb: jasny albo ciemny. Potem wybiera się dodatki: albo jeden dodatek, albo dwa różne dodatki spośród czterech: ser, szynka, jajko, pomidor. Kolejność dodatków nie ma znaczenia. Ile różnych kanapek można zrobić? *(4 pkt)*\n    - A) 20\n    - B) 24\n    - C) 28\n    - D) 32\n    - E) 36\n    <details><summary>rozwiązanie<\/summary>A — 20<br>Z jednym dodatkiem są 4 możliwości. Z dwoma różnymi dodatkami: ser-szynka, ser-jajko, ser-pomidor, szynka-jajko, szynka-pomidor, jajko-pomidor — 6 możliwości. Razem 4 + 6 = 10 zestawów dodatków, a każdy może być na jasnym lub ciemnym chlebie: 2 · 10 = 20. Pułapka: 32 wychodzi, gdy „ser + szynka” i „szynka + ser” liczy się jako dwie różne kanapki.<\/details><br>\n24. Ola ma 4 bluzki: czerwoną, niebieską, zieloną i żółtą, oraz 3 spódnice: czerwoną, niebieską i białą. Nie chce założyć bluzki i spódnicy w tym samym kolorze. Do każdego stroju może też założyć kapelusz albo pójść bez kapelusza. Ile różnych strojów może ułożyć Ola? *(5 pkt)*\n    - A) 10\n    - B) 12\n    - C) 14\n    - D) 20\n    - E) 24\n    <details><summary>rozwiązanie<\/summary>D — 20<br>Wszystkich par „bluzka + spódnica” jest 4 · 3 = 12. Zakazane są dwie: czerwona z czerwoną i niebieska z niebieską. Zostaje 12 − 2 = 10 par. Każdą parę można nosić z kapeluszem albo bez, więc strojów jest 10 · 2 = 20. Pułapki: 10 (zapomniany kapelusz) i 24 (zapomniany zakaz).<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. C — 6\n2. C — 3 *(Alfik 2025, zad. 10)*\n3. E — 6 *(Alfik 2022, zad. 4)*\n4. B — 2 *(Alfik 2021, zad. 7)*\n5. D — 6 *(Alfik 2016, zad. 7)*\n6. B — 18\n7. D — 10\n8. D — 4 *(Alfik 2024, zad. 19)*\n9. A — 6\n10. B — 15\n11. C — 6 *(Alfik 2023, zad. 6)*\n12. A — 7\n13. B — 28 *(Alfik 2016, zad. 18)*\n14. E — 10\n15. D — 7 *(Alfik 2025, zad. 30)*\n16. B — 8 *(Alfik 2018, zad. 29)*\n17. C — 12\n18. E — 20\n19. D — 10\n20. C — 10\n21. E — 18\n22. B — 12\n23. A — 20\n24. D — 20\n\n## Ściąga\n\n| Sytuacja | Jak liczyć | Przykład |\n|---|---|---|\n| Wybieram po kolei (cyfry, bluzka i spódnica) | mnożę liczby możliwości | 3 bluzki, 4 spódnice → 3 · 4 = 12 |\n| Cyfry bez powtórzeń | za każdym razem jedna cyfra mniej | z 1, 3, 5: 3 · 2 = 6 |\n| Pierwsza cyfra | nie może być 0 | z 0, 2, 4, 6: 3 · 3 · 2 = 18 |\n| „Każdy z każdym” (n osób) | n · (n − 1) : 2 = 1 + 2 + … + (n − 1) | 6 osób → 15, 7 drużyn → 21, 10 → 45 |\n| Drogi w kratce (tylko w prawo/w górę) | przy skrzyżowaniu: lewa + dolna | kratka 2×2 → 6, 3×3 → 20 |\n| Prostokąty w pasku z n części | 1 + 2 + … + n | 4 paski → 10 |\n| Prostokąty w kratce | (pary linii pionowych) · (pary linii poziomych) | 2×3 → 6 · 3 = 18 |\n| Trójkąty „wachlarz” z n częściami podstawy | 1 + 2 + … + n | 4 części → 10 |\n| Są zakazy | policz wszystko, odejmij zakazane | 12 − 2 = 10 |\n\nLiczby „trójkątne” warto znać na pamięć: 1, 3, 6, 10, 15, 21, 28, 36, 45, 55.\n", "dawne": "05-kombinatoryka"}, {"path": "matematyczny/klasa-5/zadania-wg-typu/06-logika-i-szufladki.md", "id": "mat5/06-logika-i-szufladki", "kind": "dzial", "short": "06 Logika i zasada szufladkowa", "sek": "mat5", "sekNazwa": "Matematyczny · kl. 5", "md": "# 06. Logika i zasada szufladkowa\n\n**Dlaczego warto:** W każdym arkuszu Alfika są 3–5 zadań, w których nie trzeba prawie nic liczyć, tylko dobrze pomyśleć: „ile trzeba wyjąć, żeby mieć pewność”, kto mówi prawdę, kto stoi w kolejce, jak coś zważyć lub przelać. Kłopot polega na tym, że łatwo pomylić „może się zdarzyć” z „na pewno się zdarzy”.\n\n- **W pliku:** 29 zadań: 15 nowych i 14 z prawdziwych arkuszy Alfika (8 za 3 pkt, 11 za 4 pkt, 10 za 5 pkt).\n\n**Wskazówki**\n- „Mieć pewność” = wyobraź sobie największego pecha. Policz, ile można wyjąć, **nie** spełniając warunku, i dodaj 1.\n- W zadaniach o rycerzach i łotrach sprawdzaj przypadki: „załóżmy, że Adam jest rycerzem — czy wszystko się zgadza?”. Sprzeczność wyklucza przypadek.\n- Zdanie „Jesteśmy obaj rycerzami” nie może paść z ust rycerza obok łotra — tak szybko wykryjesz kłamstwo.\n- Kolejność w szeregu: narysuj kreskę i ustawiaj osoby po kolei, zaczynając od najpewniejszych informacji („zaraz za”).\n- Ważenie na wadze szalkowej ma 3 wyniki (lewa cięższa, prawa cięższa, równowaga), dlatego dziel monety na 3 grupy.\n- W przelewaniu i przeprawach zapisuj stan po każdym ruchu, np. (5 l, 0 l) → (2 l, 3 l).\n\n**Spis treści**\n\n- [A. Ile trzeba wyjąć, żeby mieć pewność](#a-ile-trzeba-wyjąć-żeby-mieć-pewność)\n- [B. Prawdomówni i kłamcy](#b-prawdomówni-i-kłamcy)\n- [C. Kto jest kim i kolejność](#c-kto-jest-kim-i-kolejność)\n- [D. Ważenie](#d-ważenie)\n- [E. Przelewanie i przeprawy](#e-przelewanie-i-przeprawy)\n- [Klucz odpowiedzi](#klucz-odpowiedzi)\n- [Ściąga](#ściąga)\n\n---\n\n## A. Ile trzeba wyjąć, żeby mieć pewność\n\nTo jest zasada szufladkowa: jeśli rozłożysz więcej przedmiotów niż jest szufladek, w którejś szufladce będą co najmniej dwa. Zawsze myśl o najgorszym możliwym losowaniu.\n\n1. W szufladzie leży 6 czerwonych i 8 niebieskich skarpetek. Jest ciemno. Ile co najmniej skarpetek trzeba wyjąć, żeby mieć pewność, że wśród nich są dwie skarpetki tego samego koloru? *(3 pkt)*\n   - A) 3\n   - B) 7\n   - C) 8\n   - D) 9\n   - E) 14\n   <details><summary>rozwiązanie<\/summary>A — 3<br>Są tylko 2 kolory. Największy pech: pierwsze dwie skarpetki są w różnych kolorach (czerwona i niebieska). Trzecia skarpetka musi być czerwona albo niebieska, więc na pewno powstanie para. Pułapka: 9 to liczba potrzebna, żeby mieć na pewno <i>czerwoną<\/i> skarpetkę (8 niebieskich + 1) — a pytanie jest o dwie tego samego koloru.<\/details><br>\n2. W pudełku jest 5 kulek czerwonych, 7 zielonych i 4 żółte. Ile co najmniej kulek trzeba wyjąć bez patrzenia, żeby mieć pewność, że wśród nich są 3 kulki tego samego koloru? *(3 pkt)*\n   - A) 3\n   - B) 6\n   - C) 7\n   - D) 9\n   - E) 13\n   <details><summary>rozwiązanie<\/summary>C — 7<br>Największy pech: wyciągamy po 2 kulki każdego koloru, czyli 6 kulek, i wciąż nie ma trzech jednakowych. Siódma kulka ma któryś z trzech kolorów, więc dołączy do jakiejś pary i będą 3 tego samego koloru. Pułapka: 6 to jeszcze za mało (2 + 2 + 2).<\/details><br>\n3. W pudełku są 3 kulki czerwone, 4 zielone i 5 niebieskich. Ile co najmniej kulek trzeba wyjąć (bez oglądania) z tego pudełka, aby mieć pewność, że wśród wyjętych kulek są kulki przynajmniej w dwóch kolorach? *(3 pkt)* *(Alfik 2019, zad. 5)*\n   - A) 3\n   - B) 4\n   - C) 5\n   - D) 6\n   - E) 7\n   <details><summary>rozwiązanie<\/summary>D — 6<br>Najgorszy przypadek: wyjmujemy same kulki najliczniejszego koloru, czyli 5 niebieskich. Szósta kulka musi już być innego koloru. Pułapka: 4 lub 5 kulek mogą wszystkie być niebieskie.<\/details><br>\n4. W puszce jest tuzin kul: 4 czerwone, 4 zielone i 4 niebieskie. Ile co najmniej kul trzeba wylosować z tej puszki, aby mieć pewność, że wśród wylosowanych kul będzie przynajmniej jedna kula w każdym kolorze? *(3 pkt)* *(Alfik 2016, zad. 8)*\n   - A) 3\n   - B) 5\n   - C) 7\n   - D) 9\n   - E) 11\n   <details><summary>rozwiązanie<\/summary>D — 9<br>Najgorszy przypadek: najpierw wyciągamy wszystkie 4 kule jednego koloru i wszystkie 4 drugiego — to 8 kul w dwóch kolorach. Dziewiąta musi być w trzecim kolorze.<\/details><br>\n5. W tym samym pudełku (5 kulek czerwonych, 7 zielonych i 4 żółte) ile co najmniej kulek trzeba wyjąć bez patrzenia, żeby mieć pewność, że wśród nich są kulki wszystkich trzech kolorów? *(4 pkt)*\n   - A) 3\n   - B) 10\n   - C) 12\n   - D) 13\n   - E) 14\n   <details><summary>rozwiązanie<\/summary>D — 13<br>Największy pech: wyjmujemy wszystkie kulki dwóch najliczniejszych kolorów — 7 zielonych i 5 czerwonych, czyli 12 kulek — i nadal brakuje żółtej. Trzynasta kulka musi być żółta. Pułapka: 12 to właśnie „pech”, a nie pewność; 10 wychodzi, gdy zamiast dwóch największych grup weźmie się dwie najmniejsze (5 + 4 + 1).<\/details><br>\n6. W pudełku są 3 kule niebieskie, 4 kule zielone i 5 kul czerwonych. Ile co najmniej kul trzeba wyjąć z pudełka (nie oglądając wyjmowanych kulek), by mieć pewność, że wyjmiemy przynajmniej jedną kulę każdego koloru? *(4 pkt)* *(Alfik 2025, zad. 17)*\n   - A) 6\n   - B) 7\n   - C) 8\n   - D) 9\n   - E) 10\n   <details><summary>rozwiązanie<\/summary>E — 10<br>Najgorszy przypadek: najpierw wyjmujemy wszystkie kule dwóch najliczniejszych kolorów — 5 czerwonych i 4 zielone, czyli 9 kul, i wciąż nie mamy niebieskiej. Dziesiąta kula musi być niebieska.<\/details><br>\n7. W urnie są 3 kule zielone, 4 kule czerwone i 5 kul niebieskich. Ile co najmniej kul trzeba wyjąć z urny (bez oglądania), aby mieć pewność, że w urnie zostały kule najwyżej dwóch kolorów? *(4 pkt)* *(Alfik 2023, zad. 20)*\n   - A) 5\n   - B) 6\n   - C) 8\n   - D) 9\n   - E) 10\n   <details><summary>rozwiązanie<\/summary>E — 10<br>Musimy mieć pewność, że jakiś kolor zniknął z urny całkowicie. Najgorszy przypadek: zostawiamy po jednej kuli każdego koloru, wyjmując 2 + 3 + 4 = 9 kul — wtedy w urnie są nadal 3 kolory. Dziesiąta wyjęta kula musi już zabrać ostatnią kulę któregoś koloru.<\/details><br>\n8. W pudełku są 2 kulki niebieskie, 3 kulki czerwone i 5 kulek zielonych. Ile co najmniej kulek trzeba wyjąć (bez oglądania) z pudełka, żeby mieć pewność, że nie wszystkie wyjęte kulki są tego samego koloru? *(4 pkt)* *(Alfik 2022, zad. 20)*\n   - A) 3\n   - B) 4\n   - C) 5\n   - D) 6\n   - E) 7\n   <details><summary>rozwiązanie<\/summary>D — 6<br>Najgorszy przypadek: wyciągamy same zielone — może ich być aż 5. Szósta kulka na pewno nie jest zielona, więc wtedy mamy pewność dwóch kolorów.<\/details><br>\n9. Ile co najmniej osób musi być w grupie, żeby na pewno co najmniej 5 z nich urodziło się w tym samym dniu tygodnia (np. wszystkie w środę)? *(5 pkt)*\n   - A) 8\n   - B) 12\n   - C) 22\n   - D) 28\n   - E) 29\n   <details><summary>rozwiązanie<\/summary>E — 29<br>Dni tygodnia jest 7 — to nasze „szufladki”. Pech: w każdym dniu urodziły się po 4 osoby, to 7 · 4 = 28 osób, a piątki wciąż nie ma. Gdy dojdzie 29. osoba, jej dzień urodzenia będzie miał już 5 osób. Pułapka: 28 (zapomniane „+1”).<\/details><br>\n10. Uczniów pewnej 24-osobowej klasy nie można podzielić na takie 3-osobowe grupy, by w każdej grupie były najwyżej dwie dziewczynki. Nie można ich też podzielić na takie 4-osobowe grupy, by w każdej grupie był najwyżej jeden chłopiec. Ile dziewczynek jest w tej klasie? *(5 pkt)* *(Alfik 2019, zad. 28)*\n    - A) 14\n    - B) 15\n    - C) 16\n    - D) 17\n    - E) 18\n    <details><summary>rozwiązanie<\/summary>D — 17<br>Grup 3-osobowych byłoby 8 i każda potrzebuje co najmniej 1 chłopca — skoro się nie da, chłopców jest mniej niż 8. Grup 4-osobowych byłoby 6, każda może mieć najwyżej 1 chłopca — skoro się nie da, chłopców jest więcej niż 6. Zatem chłopców jest 7, a dziewczynek 24 − 7 = 17.<\/details><br>\n11. W koszyku są kulki w trzech kolorach: zielone, czerwone i niebieskie. Jeśli wylosujemy z koszyka 5 kulek, to wśród nich zawsze będą kule we wszystkich trzech kolorach, a jeśli wylosujemy 3 kule, to wśród nich zawsze będą kule w przynajmniej dwóch kolorach. Jaka jest największa możliwa liczba kulek w tym koszyku? *(5 pkt)* *(Alfik 2018, zad. 24)*\n    - A) 6\n    - B) 7\n    - C) 8\n    - D) 9\n    - E) 10\n    <details><summary>rozwiązanie<\/summary>A — 6<br>Skoro 3 kule zawsze mają co najmniej 2 kolory, to żadnego koloru nie ma 3 lub więcej — każdego jest najwyżej 2. Zatem kulek jest najwyżej 2 + 2 + 2 = 6. I 6 pasuje: wyjmując 5 z 6, zostawiamy tylko jedną, więc każdy kolor zostaje wylosowany.<\/details><br>\n\n## B. Prawdomówni i kłamcy\n\nNa wyspie mieszkają <b>rycerze<\/b>, którzy zawsze mówią prawdę, i <b>łotrzy<\/b>, którzy zawsze kłamią. Sprawdzaj kolejne możliwości i odrzucaj te, które prowadzą do sprzeczności.\n\n12. Spotykamy dwóch mieszkańców wyspy rycerzy i łotrów. Adam mówi: „Bolek jest łotrem”. Bolek mówi: „Obaj jesteśmy rycerzami”. Kto z nich jest rycerzem? *(3 pkt)*\n    - A) tylko Adam\n    - B) tylko Bolek\n    - C) obaj\n    - D) żaden\n    - E) nie da się ustalić\n    <details><summary>rozwiązanie<\/summary>A — tylko Adam<br>Gdyby Bolek był rycerzem, to jego zdanie byłoby prawdą, więc Adam też byłby rycerzem — ale wtedy Adam powiedziałby prawdę, że Bolek jest łotrem. Sprzeczność! Zatem Bolek jest łotrem. Wtedy zdanie Adama „Bolek jest łotrem” jest prawdziwe, więc Adam jest rycerzem. A zdanie Bolka jest fałszywe — zgadza się.<\/details><br>\n13. Trzech mieszkańców wyspy rycerzy i łotrów powiedziało coś o sobie. Pierwszy: „Wśród nas trzech jest dokładnie jeden łotr”. Drugi: „Wśród nas trzech jest dokładnie dwóch łotrów”. Trzeci: „Wszyscy trzej jesteśmy łotrami”. Ilu rycerzy jest wśród nich? *(4 pkt)*\n    - A) 0\n    - B) 1\n    - C) 2\n    - D) 3\n    - E) nie da się ustalić\n    <details><summary>rozwiązanie<\/summary>B — 1<br>Każdy podaje inną liczbę łotrów, więc najwyżej jedno zdanie jest prawdziwe — czyli jest najwyżej jeden rycerz. Gdyby nie było żadnego rycerza, wszyscy byliby łotrami i zdanie trzeciego byłoby prawdziwe — a łotr nie mówi prawdy. Sprzeczność. Zatem jest dokładnie jeden rycerz i dwóch łotrów, a rycerzem jest drugi (jego zdanie „dwóch łotrów” jest prawdziwe).<\/details><br>\n14. Przy okrągłym stole siedzi 5 mieszkańców wyspy rycerzy i łotrów. Każdy z nich powiedział: „Obaj moi sąsiedzi przy stole to łotrzy”. Ilu łotrów siedzi przy stole? *(5 pkt)*\n    - A) 0\n    - B) 1\n    - C) 2\n    - D) 3\n    - E) nie da się ustalić\n    <details><summary>rozwiązanie<\/summary>D — 3<br>Rycerz mówi prawdę, więc obok rycerza siedzą dwaj łotrzy — dwaj rycerze nie mogą siedzieć obok siebie. Łotr kłamie, więc obok łotra siedzi co najmniej jeden rycerz. Wszyscy łotrami być nie mogą (wtedy mówiliby prawdę). Jeden rycerz też za mało: dwaj łotrzy siedzący najdalej od niego mieliby po obu stronach samych łotrów i powiedzieliby prawdę. Trzech rycerzy przy 5 miejscach musiałoby gdzieś usiąść obok siebie. Zostaje 2 rycerzy i 5 − 2 = 3 łotrów (np. R, Ł, R, Ł, Ł) — i to działa.<\/details><br>\n\n## C. Kto jest kim i kolejność\n\nRysuj tabelkę albo kreskę z miejscami. Zaczynaj od wskazówek, które mówią najwięcej (np. „zaraz za”), i skreślaj niemożliwe.\n\n15. Pięcioro dzieci stoi w kolejce do sklepiku. Ada stoi zaraz za Bartkiem. Darek stoi za Adą, ale przed Celiną. Celina stoi przed Ewą. Kto stoi na końcu kolejki? *(3 pkt)*\n    - A) Ada\n    - B) Bartek\n    - C) Celina\n    - D) Darek\n    - E) Ewa\n    <details><summary>rozwiązanie<\/summary>E — Ewa<br>Bartek jest przed Adą, Ada przed Darkiem, Darek przed Celiną, a Celina przed Ewą. Kolejka wygląda więc tak: Bartek, Ada, Darek, Celina, Ewa. Na końcu stoi Ewa.<\/details><br>\n16. Dzieci stoją w jednym szeregu. Kasia jest ósma, licząc od lewej, i szósta, licząc od prawej. Ile dzieci stoi w szeregu? *(3 pkt)*\n    - A) 12\n    - B) 13\n    - C) 14\n    - D) 15\n    - E) 48\n    <details><summary>rozwiązanie<\/summary>B — 13<br>Na lewo od Kasi stoi 7 dzieci, a na prawo od niej 5 dzieci. Razem z Kasią: 7 + 1 + 5 = 13. Pułapka: 8 + 6 = 14 — wtedy Kasię liczy się dwa razy.<\/details><br>\n17. Ania, Basia i Celina mają bluzki w kolorach: czerwonym, zielonym i niebieskim (każda inny kolor) oraz spódnice w tych samych trzech kolorach (też każda inny). Żadna dziewczynka nie ma bluzki i spódnicy w tym samym kolorze. Ania ma zieloną bluzkę, a Basia czerwoną spódnicę. Jakiego koloru bluzkę ma Celina? *(4 pkt)*\n    - A) czerwonego\n    - B) zielonego\n    - C) niebieskiego\n    - D) nie da się tego ustalić\n    - E) opisana sytuacja jest niemożliwa\n    <details><summary>rozwiązanie<\/summary>A — czerwonego<br>Basia ma czerwoną spódnicę, więc jej bluzka nie może być czerwona. Zielona bluzka jest Ani, więc Basia ma niebieską bluzkę. Dla Celiny zostaje czerwona bluzka. (Spódnice: Ania nie może mieć zielonej, czerwona jest Basi — więc Ania ma niebieską, a Celina zieloną. Wszystko się zgadza.)<\/details><br>\n18. W klasie Maćka jest 12 uczniów trenujących judo i jest 15 uczniów trenujących tenisa. Ilu uczniów liczy ta klasa, jeśli tylko dwóch uczniów uprawia obie te dyscypliny i tylko jeden nie trenuje żadnej z nich? *(4 pkt)* *(Alfik 2017, zad. 13)*\n    - A) 25\n    - B) 26\n    - C) 27\n    - D) 28\n    - E) 29\n    <details><summary>rozwiązanie<\/summary>B — 26<br>12 + 15 = 27, ale dwóch uczniów policzyliśmy dwa razy, więc trenujących cokolwiek jest 25. Dodajemy jednego, który nie trenuje niczego: 26.<\/details><br>\n19. Na bal maskowy czterech kolegów przyszło w maskach. Najpierw pierwszy z drugim zamienili się maskami. Potem drugi z trzecim zamienili się maskami. Następnie trzeci z czwartym zamienili się maskami. Na końcu czwarty z pierwszym zamienili się maskami. Ilu chłopców po tych zamianach miało te maski, w których przyszli na bal? *(4 pkt)* *(Alfik 2015, zad. 15)*\n    - A) 0\n    - B) 1\n    - C) 2\n    - D) 3\n    - E) 4\n    <details><summary>rozwiązanie<\/summary>B — 1<br>Oznaczmy maski 1, 2, 3, 4. Po kolejnych zamianach: (2, 1, 3, 4) → (2, 3, 1, 4) → (2, 3, 4, 1) → (1, 3, 4, 2). Swoją maskę ma tylko pierwszy chłopiec.<\/details><br>\n20. Pięciu chłopców — Adam, Bartek, Czarek, Darek i Emil — biegło w wyścigu i każdy dobiegł na metę w innym czasie. Adam przybiegł przed Bartkiem, ale za Czarkiem. Darek przybiegł zaraz po Bartku. Czarek nie wygrał. Kto przybiegł ostatni? *(5 pkt)*\n    - A) Adam\n    - B) Bartek\n    - C) Czarek\n    - D) Darek\n    - E) Emil\n    <details><summary>rozwiązanie<\/summary>D — Darek<br>Wiemy, że kolejno byli: Czarek, potem (gdzieś dalej) Adam, potem Bartek, a zaraz za Bartkiem Darek. Adam, Bartek i Darek są za Czarkiem, a Czarek nie wygrał — więc wygrać mógł tylko Emil. Wtedy kolejność jest jedyna możliwa: Emil, Czarek, Adam, Bartek, Darek. Ostatni był Darek.<\/details><br>\n21. Każdy spośród 24 uczniów pewnej klasy uczy się przynajmniej jednego spośród języków: angielski, niemiecki, francuski. Wiemy, że języka angielskiego uczy się 19 uczniów, niemieckiego – 17 uczniów, a francuskiego – 5 uczniów. Jeśli wszystkich trzech języków uczy się dwóch uczniów, to ilu uczniów uczy się dokładnie dwóch języków? *(5 pkt)* *(Alfik 2018, zad. 26)*\n    - A) 10\n    - B) 11\n    - C) 12\n    - D) 13\n    - E) 14\n    <details><summary>rozwiązanie<\/summary>D — 13<br>Policzmy „zapisy na języki”: 19 + 17 + 5 = 41. Każdy uczeń ma co najmniej jeden zapis, to 24. Nadwyżka 41 − 24 = 17 bierze się z dodatkowych języków: uczeń z dwoma językami daje 1 nadwyżki, z trzema — 2. Dwaj uczniowie z trzema językami dają 4, zostaje 13 — tylu uczniów uczy się dokładnie dwóch języków.<\/details><br>\n22. Zegarek Jacka 5 minut temu wskazywał tę samą godzinę, którą zegarek Marka wskazywał minutę temu, a którą zegarek Beaty wskaże za 2 minuty. Jeden z tych trzech zegarków chodzi prawidłowo, jeden spieszy, a jeden się spóźnia. Zatem zegarek Beaty: *(5 pkt)* *(Alfik 2017, zad. 26)*\n    - A) spóźnia się o 3 minuty\n    - B) spóźnia się o 1 minutę\n    - C) chodzi prawidłowo\n    - D) spieszy o 1 minutę\n    - E) spieszy o 3 minuty\n    <details><summary>rozwiązanie<\/summary>A — spóźnia się o 3 minuty<br>Tę samą godzinę Jacek miał najwcześniej, Marek 4 minuty później, Beata 7 minut po Jacku. Kto pokazuje daną godzinę wcześniej, ten spieszy. Zatem zegarek Jacka spieszy najbardziej, a Beaty spóźnia się najbardziej — prawidłowy musi być środkowy, Marka. Beata pokaże tę godzinę 3 minuty po Marku, więc jej zegarek spóźnia się o 3 minuty.<\/details><br>\n\n## D. Ważenie\n\nWaga szalkowa porównuje dwie szalki. Jedno ważenie ma trzy możliwe wyniki, więc dobrze jest dzielić rzeczy na trzy grupy. Odważniki można czasem kłaść na obie szalki.\n\n23. Mamy 10 jednakowo wyglądających monet. Jedna z nich jest fałszywa i jest lżejsza od pozostałych (prawdziwe ważą tyle samo). Mamy wagę szalkową bez odważników. Ile co najmniej ważeń trzeba, żeby na pewno znaleźć fałszywą monetę? *(4 pkt)*\n    - A) 1\n    - B) 2\n    - C) 3\n    - D) 5\n    - E) 9\n    <details><summary>rozwiązanie<\/summary>C — 3<br>Trzy ważenia wystarczą: kładziemy 3 monety na lewą szalkę i 3 na prawą, 4 odkładamy. Jeśli któraś szalka jest lżejsza, fałszywka jest wśród jej 3 monet — jedno ważenie „1 na 1” ją wskaże. Jeśli jest równowaga, fałszywka jest wśród 4 odłożonych — ważymy 1 na 1, a gdy jest równowaga, ważymy ostatnie 2 monety. Dwa ważenia nie wystarczą: każde ma 3 wy
