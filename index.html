ia, tylko pogarsza swoją sytuację.<\/details><br>\n35. Związek ***mieć duszę na ramieniu*** oznacza: *(4 pkt)*\n    - A) być dobrym człowiekiem\n    - B) być bardzo zmęczonym\n    - C) bardzo się bać\n    - D) dźwigać ciężar\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — bardzo się bać<br>Ktoś, kto ma duszę na ramieniu, jest bardzo przestraszony, np. przed klasówką.<\/details><br>\n36. Przysłowie ***Nie chwal dnia przed zachodem słońca*** radzi, żeby: *(4 pkt)*\n    - A) wieczorem nie wychodzić z domu\n    - B) chwalić innych tylko wieczorem\n    - C) wcześnie chodzić spać\n    - D) nie cieszyć się z sukcesu, zanim sprawa się nie zakończy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — nie cieszyć się z sukcesu, zanim sprawa się nie zakończy<br>Dzień może się jeszcze źle skończyć — tak samo każda sprawa. Przysłowie mówi, żeby nie ogłaszać zwycięstwa za wcześnie.<\/details><br>\n37. Przysłowie ***Gdzie kucharek sześć, tam…*** kończy się słowami: *(4 pkt)*\n    - A) każdy coś zje\n    - B) obiad gotowy w mig\n    - C) zupa zawsze przesolona\n    - D) jest wesoło w kuchni\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Pełne przysłowie brzmi: ***Gdzie kucharek sześć, tam nie ma co jeść*** — gdy zbyt wiele osób rządzi jedną sprawą, nic z tego nie wychodzi. Takiego zakończenia nie ma wśród odpowiedzi.<\/details><br>\n38. Zdanie „***czasem beknął żałośnie bez powodu, że się ludziom serce krajało***”: *(4 pkt)* *(Alfik 2023, zad. 15)*\n    - A) zawiera stały związek wyrazów oznaczający *rozpacz*\n    - B) nie zawiera czasowników\n    - C) zawiera tylko jeden rzeczownik\n    - D) nie ma orzeczenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — zawiera stały związek wyrazów oznaczający *rozpacz*<br>„Serce się kraje” to związek frazeologiczny: tak mówimy o wielkim żalu i smutku. Czasowniki są (beknął, krajało), rzeczowniki są trzy (powodu, ludziom, serce), a orzeczenie to np. „beknął”.<\/details><br>\n39. Głos pana Walickiego ***wychodził z niego jak z grobu*** czyli: *(4 pkt)* *(Alfik 2022, zad. 11)*\n    - A) był donośny\n    - B) przerażał\n    - C) zadziwiał\n    - D) miał piękną barwę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — przerażał<br>Grób kojarzy się ze śmiercią. Głos „jak z grobu” jest głuchy, ponury i straszny — taki, jaki pasował do ról morderców. Pułapka A: grobowy głos nie musi być głośny.<\/details><br>\n40. (…) ***z żywością muchy przeniosła się na inny temat*** czyli: *(4 pkt)* *(Alfik 2019, zad. 17)*\n    - A) niezręcznie wspomniała o czymś\n    - B) mówiła wolno\n    - C) krążyła wokół jakiejś kwestii\n    - D) szybko zmieniła temat\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — szybko zmieniła temat<br>Mucha jest żywa i szybka, przelatuje z miejsca na miejsce. „Przenieść się na inny temat” to zmienić temat rozmowy, a „z żywością muchy” — bardzo szybko.<\/details><br>\n41. Podkreślone sformułowanie w wypowiedzeniu ***Wszelki smutek bał się jej <u>jak diabeł święconej wody<\/u>*** oznacza: *(4 pkt)* *(Alfik 2016, zad. 14)*\n    - A) wcale\n    - B) bardzo\n    - C) mało\n    - D) w pewnych okolicznościach\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — bardzo<br>„Bać się czegoś jak diabeł święconej wody” to związek frazeologiczny: bardzo się czegoś bać, unikać za wszelką cenę.<\/details><br>\n42. Sformułowanie ***Radość jest sprawiedliwa, chociaż nierychliwa***: *(4 pkt)* *(Alfik 2016, zad. 15)*\n    - A) jest przeróbką innego znanego powiedzonka\n    - B) ma pesymistyczny charakter\n    - C) stanowi smutną refleksję\n    - D) oznacza, że radość nigdy nie nadchodzi\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — jest przeróbką innego znanego powiedzonka<br>To przeróbka przysłowia „Pan Bóg nierychliwy, ale sprawiedliwy”. Znaczy: radość przychodzi powoli, ale na pewno przyjdzie — to myśl optymistyczna, więc B, C i D odpadają.<\/details><br>\n43. Osobę skąpą opisuje związek: *(5 pkt)*\n    - A) ***ma złote serce***\n    - B) ***ma węża w kieszeni***\n    - C) ***ma głowę na karku***\n    - D) ***ma lekką rękę***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — ***ma węża w kieszeni***<br>Skąpiec boi się sięgnąć do kieszeni po pieniądze, jakby siedział tam wąż. ***Złote serce*** ma ktoś dobry, ***głowę na karku*** — ktoś zaradny, a ***lekką rękę*** — ktoś, kto łatwo wydaje pieniądze.<\/details><br>\n44. Który związek frazeologiczny oznacza „mówić nie wprost, krążyć wokół tematu”? *(5 pkt)*\n    - A) ***owijać w bawełnę***\n    - B) ***strzępić sobie język***\n    - C) ***trzymać język za zębami***\n    - D) ***mieć coś na końcu języka***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — ***owijać w bawełnę***<br>Kto owija w bawełnę, nie mówi czegoś prosto z mostu. ***Strzępić język*** to mówić na próżno, ***trzymać język za zębami*** — milczeć, a ***mieć coś na końcu języka*** — prawie sobie coś przypomnieć.<\/details><br>\n45. Sformułowanie ***coś mu się w rozumie pomieszało*** oznacza: *(5 pkt)* *(Alfik 2023, zad. 27)*\n    - A) ucieszył się\n    - B) wystraszył się\n    - C) roześmiał się\n    - D) oszalał\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — oszalał<br>Komu „pomieszało się w rozumie”, ten stracił rozum, czyli oszalał. Pułapka: zając był przestraszony, ale samo sformułowanie mówi o szaleństwie, nie o strachu.<\/details><br>\n46. Sformułowanie ***w nogi*** oznacza: *(5 pkt)* *(Alfik 2021, zad. 29)*\n    - A) upaść\n    - B) wyskoczyć\n    - C) uciekać\n    - D) przechytrzyć\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — uciekać<br>„Rzucić się w nogi”, „wziąć nogi za pas”, „w nogi!” — to związki frazeologiczne znaczące „uciekać”.<\/details><br>\n47. Podkreślone sformułowanie w zdaniu ***malarze <u>chodzą bez butów<\/u>***: *(5 pkt)* *(Alfik 2019, zad. 28)*\n    - A) chodzą boso\n    - B) są skąpi\n    - C) oznacza *są biedni*\n    - D) zachowują się dziwnie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — oznacza *są biedni*<br>Kto nie ma pieniędzy nawet na buty, jest bardzo biedny. Pułapka A: to znaczenie dosłowne, a tu chodzi o przenośnię — malarze rozdają obrazy i nic na nich nie zarabiają.<\/details><br>\n48. Sformułowanie ***mieć coś na oku***: *(5 pkt)* *(Alfik 2015, zad. 27)*\n    - A) oznacza *martwić się*\n    - B) jest niepoprawne\n    - C) ma znaczenie przenośne: obserwować\n    - D) oznacza: mieć słaby wzrok\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — ma znaczenie przenośne: obserwować<br>„Mieć coś na oku” to związek frazeologiczny: pilnować czegoś, nie spuszczać z oczu. Partacz chciał mieć kalosze stale przy sobie, żeby nie zniknęły.<\/details><br>\n49. Sformułowanie ***zawracała w głowie*** oznacza: *(5 pkt)* *(Alfik 2014, zad. 30)*\n    - A) okłamywała\n    - B) wodziła za nos\n    - C) rozkochiwała w sobie\n    - D) dokuczała\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — rozkochiwała w sobie<br>„Zawracać komuś w głowie” to sprawiać, że ktoś się zakochuje, traci dla kogoś głowę. Pułapka B: „wodzić za nos” znaczy oszukiwać, zwodzić — to inny frazeologizm.<\/details><br>\n\n## C. Budowa i pochodzenie wyrazów\n\nWyrazy pokrewne mają wspólny rdzeń i są związane znaczeniem — nie wystarczy, że brzmią podobnie.\n\n50. Do rodziny wyrazu ***las*** NIE należy wyraz: *(3 pkt)*\n    - A) ***leśniczy***\n    - B) ***lasek***\n    - C) ***zalesić***\n    - D) ***lis***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — ***lis***<br>Leśniczy pilnuje lasu, lasek to mały las, a zalesić to obsadzić lasem — wszystkie mają znaczenie związane z lasem. Pułapka: ***lis*** brzmi podobnie i żyje w lesie, ale nie pochodzi od wyrazu ***las***.<\/details><br>\n51. Wspólna część wyrazów pokrewnych, np. ***dom, domek, domowy***, to: *(3 pkt)*\n    - A) końcówka\n    - B) przedrostek\n    - C) przyrostek\n    - D) zakończenie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Wspólną częścią wyrazów pokrewnych jest **rdzeń** (tu: ***dom***), a tej nazwy nie ma wśród odpowiedzi.<\/details><br>\n52. Zdrobnieniem jest wyraz: *(3 pkt)*\n    - A) ***domisko***\n    - B) ***domownik***\n    - C) ***domek***\n    - D) ***domowy***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — ***domek***<br>Zdrobnienie nazywa coś małego albo mówi o tym czule: domek to mały dom. ***Domisko*** to zgrubienie, ***domownik*** — osoba mieszkająca w domu, ***domowy*** — przymiotnik.<\/details><br>\n53. Wyraz ***psisko*** to: *(4 pkt)*\n    - A) zdrobnienie\n    - B) zgrubienie\n    - C) wyraz złożony\n    - D) wyraz dźwiękonaśladowczy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — zgrubienie<br>Przyrostek ***-isko*** tworzy zgrubienia: psisko to duży pies (albo pies, o którym mówimy z niechęcią lub żartobliwie). Zdrobnieniem byłby ***piesek***.<\/details><br>\n54. Wyrazem złożonym, czyli powstałym z połączenia dwóch wyrazów, jest: *(4 pkt)*\n    - A) ***długopis***\n    - B) ***kotek***\n    - C) ***piekarz***\n    - D) ***zegarek***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — ***długopis***<br>***Długopis*** powstał z wyrazów ***długo*** i ***pisać***. ***Kotek*** i ***zegarek*** to wyrazy z przyrostkiem ***-ek***, a ***piekarz*** — z przyrostkiem ***-arz***.<\/details><br>\n55. Wyraz ***miasteczko*** odnosi się do miasta, które jest: *(4 pkt)* *(Alfik 2023, zad. 20)*\n    - A) brzydkie\n    - B) stare\n    - C) małe\n    - D) sławne\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — małe<br>„Miasteczko” to zdrobnienie od „miasto” (przyrostek -eczko), a zdrobnienia mówią, że coś jest małe.<\/details><br>\n56. Forma ***kozieł*** ma taką postać w tytule ponieważ: *(4 pkt)* *(Alfik 2021, zad. 16)*\n    - A) to nazwa własna\n    - B) jest to rzeczownik nazywający dawne zwierzę\n    - C) to forma współczesna\n    - D) jest to dawna postać wyrazu *kozioł*\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — jest to dawna postać wyrazu *kozioł*<br>Mickiewicz pisał prawie 200 lat temu i używał dawnych form wyrazów. Dziś mówimy „kozioł”. To nie imię (A) ani nazwa wymarłego zwierzęcia (B).<\/details><br>\n57. Wyrazem zapożyczonym z języka angielskiego jest: *(5 pkt)*\n    - A) ***spaghetti***\n    - B) ***kotlet***\n    - C) ***weekend***\n    - D) ***sushi***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — ***weekend***<br>***Weekend*** po angielsku znaczy „koniec tygodnia”. ***Spaghetti*** pochodzi z włoskiego, ***kotlet*** z francuskiego, a ***sushi*** z japońskiego.<\/details><br>\n58. W którym zestawie WSZYSTKIE wyrazy są pokrewne? *(5 pkt)*\n    - A) ***kot, kotek, kotlet***\n    - B) ***woda, wodny, wodospad***\n    - C) ***mleko, mleczny, młotek***\n    - D) ***słońce, słoneczny, słoma***\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — ***woda, wodny, wodospad***<br>Wszystkie trzy mają rdzeń ***wod-*** i znaczenie związane z wodą. W pozostałych zestawach jest „intruz”, który tylko brzmi podobnie: ***kotlet*** nie pochodzi od kota, ***młotek*** od mleka, a ***słoma*** od słońca.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. A — mężny\n2. C — cichy\n3. D — urządzenie do zamykania\n4. E — żadna z powyższych\n5. B — chętnie i szybko\n6. C — lubi dużo i chciwie jeść\n7. D — głośno *(Alfik 2024, zad. 19)*\n8. B — uważne *(Alfik 2019, zad. 16)*\n9. C — powiedzieć coś od niechcenia *(Alfik 2019, zad. 18)*\n10. B — można zastąpić formą *tajemnica* *(Alfik 2017, zad. 16)*\n11. D — znaczy *zgoda* *(Alfik 2017, zad. 19)*\n12. B — sławnego *(Alfik 2014, zad. 19)*\n13. A — spory *(Alfik 2014, zad. 20)*\n14. A — hojny\n15. D — szybko\n16. A — złączenia *(Alfik 2025, zad. 26)*\n17. A — znaczą to samo *(Alfik 2024, zad. 26)*\n18. D — trudne *(Alfik 2023, zad. 24)*\n19. A — o podobnym znaczeniu *(Alfik 2023, zad. 25)*\n20. D — robił *(Alfik 2022, zad. 27)*\n21. A — zabrudzić *(Alfik 2021, zad. 30)*\n22. A — anonimowy *(Alfik 2019, zad. 24)*\n23. D — znakomity *(Alfik 2019, zad. 25)*\n24. A — odnoszą się do „ludzi pióra” *(Alfik 2019, zad. 29)*\n25. C — wada *(Alfik 2017, zad. 21)*\n26. C — przenikliwy wzrok *(Alfik 2016, zad. 22)*\n27. B — wadę *(Alfik 2015, zad. 21)*\n28. D — szok sam w sobie jest doznaniem nieprzyjemnym – czyli znaczenie jednego wyrazu zawiera się już w drugim *(Alfik 2015, zad. 24)*\n29. B — jeden wyraz powtarza znaczenie drugiego *(Alfik 2015, zad. 25)*\n30. D — wzruszenie *(Alfik 2014, zad. 22)*\n31. A — odnosi się do koloru włosów *(Alfik 2014, zad. 23)*\n32. A — marzyć i nie zauważać tego, co dzieje się wokół\n33. B — jest w złym humorze\n34. B — w trudnym położeniu rozpacz jedynie pogarsza sprawę *(Alfik 2021, zad. 10)*\n35. C — bardzo się bać\n36. D — nie cieszyć się z sukcesu, zanim sprawa się nie zakończy\n37. E — żadna z powyższych\n38. A — zawiera stały związek wyrazów oznaczający *rozpacz* *(Alfik 2023, zad. 15)*\n39. B — przerażał *(Alfik 2022, zad. 11)*\n40. D — szybko zmieniła temat *(Alfik 2019, zad. 17)*\n41. B — bardzo *(Alfik 2016, zad. 14)*\n42. A — jest przeróbką innego znanego powiedzonka *(Alfik 2016, zad. 15)*\n43. B — ***ma węża w kieszeni***\n44. A — ***owijać w bawełnę***\n45. D — oszalał *(Alfik 2023, zad. 27)*\n46. C — uciekać *(Alfik 2021, zad. 29)*\n47. C — oznacza *są biedni* *(Alfik 2019, zad. 28)*\n48. C — ma znaczenie przenośne: obserwować *(Alfik 2015, zad. 27)*\n49. C — rozkochiwała w sobie *(Alfik 2014, zad. 30)*\n50. D — ***lis***\n51. E — żadna z powyższych\n52. C — ***domek***\n53. B — zgrubienie\n54. A — ***długopis***\n55. C — małe *(Alfik 2023, zad. 20)*\n56. D — jest to dawna postać wyrazu *kozioł* *(Alfik 2021, zad. 16)*\n57. C — ***weekend***\n58. B — ***woda, wodny, wodospad***\n\n## Ściąga\n\n| Pojęcie | Co to znaczy | Przykład |\n|---|---|---|\n| Synonimy | wyrazy o podobnym znaczeniu | ***odważny – mężny***, ***szybki – prędki*** |\n| Antonimy | wyrazy o przeciwnym znaczeniu | ***skąpy – hojny***, ***hałaśliwy – cichy*** |\n| Wyraz wieloznaczny | ma kilka znaczeń; decyduje zdanie | ***zamek*** w drzwiach / ***zamek*** króla |\n| Związek frazeologiczny | stałe połączenie wyrazów o znaczeniu przenośnym | ***mieć muchy w nosie*** = być w złym humorze |\n| Ludzkie cechy we frazeologii | ***złote serce*** — dobry; ***głowa na karku*** — zaradny; ***wąż w kieszeni*** — skąpy | ***dusza na ramieniu*** — strach |\n| Mówienie we frazeologii | ***owijać w bawełnę*** — nie wprost; ***trzymać język za zębami*** — milczeć | ***prosto z mostu*** — wprost |\n| Przysłowie | krótka mądrość ludowa | ***Gdzie kucharek sześć, tam nie ma co jeść*** |\n| Wyrazy pokrewne | wspólny rdzeń i związek znaczeniowy | ***las, lasek, leśniczy*** (ale nie ***lis***) |\n| Zdrobnienie / zgrubienie | ***-ek, -ka, -ko*** / ***-isko*** | ***domek*** / ***domisko***, ***psisko*** |\n| Wyraz złożony | powstał z dwóch wyrazów | ***długopis*** = ***długo*** + ***pisać*** |\n| Zapożyczenie | wyraz z obcego języka | ***weekend*** (ang.), ***spaghetti*** (wł.), ***kotlet*** (fr.) |\n"}, {"path": "humanistyczny/klasa-5/zadania-wg-typu/04-czesci-mowy.md", "id": "hum5/04-czesci-mowy", "kind": "dzial", "short": "04 Części mowy", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# 04. Części mowy\n\n**Dlaczego warto:** W każdym arkuszu Alfika, zwykle wśród pytań za 5 punktów, jest kilka zadań w rodzaju „W zdaniu … są dwa przyimki” albo „Wyraz … jest zaimkiem”. Najłatwiej pomylić się przy wyrazach, które tylko wyglądają na inną część mowy: *pływanie* to rzeczownik, a nie czasownik, *nasz* to zaimek, a nie przymiotnik, a *wesoło* to przysłówek, a nie przymiotnik.\n\n- **W pliku:** 64 zadań: 22 nowych i 42 z prawdziwych arkuszy Alfika (7 za 3 pkt, 28 za 4 pkt, 29 za 5 pkt).\n\n**Wskazówki**\n- Zadaj pytanie: rzeczownik — kto? co?; czasownik — co robi? co się z nim dzieje?; przymiotnik — jaki? jaka? jakie? który?; liczebnik — ile? który z kolei?; przysłówek — jak? gdzie? kiedy?\n- Odmienne części mowy: rzeczownik, czasownik, przymiotnik, liczebnik, zaimek. Nieodmienne: przysłówek, przyimek, spójnik, partykuła, wykrzyknik.\n- Wyrazy na *-anie*, *-enie*, *-cie* (pływanie, czytanie, wyjście) to rzeczowniki — nazywają czynność, ale odmieniają się przez przypadki, a nie przez osoby.\n- Zaimek zastępuje inną część mowy: *ja, ty, mi, nimi, ktoś* (zamiast rzeczownika), *mój, nasz, tamten, jaki* (zamiast przymiotnika). Pułapka: *nasz dom* — *nasz* to zaimek, nie przymiotnik.\n- *Nie* przy czasowniku to partykuła. Przyimek (*w, na, z, do, pod, przez, dla*) zawsze łączy się z rzeczownikiem lub zaimkiem: razem tworzą wyrażenie przyimkowe (*pod mostem, z nimi*).\n- Spójniki (*i, a, ale, lub, oraz, więc, bo, że, gdy*) łączą wyrazy albo zdania.\n- Przysłówki często kończą się na *-o* lub *-e* (*wesoło, dobrze*) i dają się stopniować (*dobrze – lepiej – najlepiej*), ale przez przypadki się nie odmieniają.\n\n**Spis treści**\n\n- [A. Odmienne części mowy](#a-odmienne-części-mowy)\n- [B. Nieodmienne części mowy](#b-nieodmienne-części-mowy)\n- [C. Części mowy w zdaniu](#c-części-mowy-w-zdaniu)\n- [Klucz odpowiedzi](#klucz-odpowiedzi)\n- [Ściąga](#ściąga)\n\n---\n\n## A. Odmienne części mowy\n\nRzeczownik, czasownik, przymiotnik, liczebnik i zaimek zmieniają swoją formę — rozpoznasz je po pytaniach, na które odpowiadają.\n\n1. W zdaniu ***Babcia kupiła wnukom trzy kolorowe balony.*** są: *(3 pkt)*\n   - A) dwa rzeczowniki\n   - B) trzy rzeczowniki\n   - C) dwa przymiotniki\n   - D) dwa czasowniki\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — trzy rzeczowniki<br>Rzeczowniki to: babcia, wnukom, balony. Przymiotnik jest jeden (kolorowe), czasownik też jeden (kupiła), a „trzy” to liczebnik. Pułapka: „wnukom” to rzeczownik w celowniku (komu?), łatwo go przeoczyć.<\/details><br>\n2. Same czasowniki są w szeregu: *(3 pkt)*\n   - A) biegać, bieg, biegacz\n   - B) pisze, pismo, pisarski\n   - C) śpiewał, śpiewa, zaśpiewa\n   - D) skok, skoczny, skoczyć\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — śpiewał, śpiewa, zaśpiewa<br>Wszystkie trzy wyrazy mówią, co ktoś robi (w różnych czasach). W pozostałych szeregach są wyrazy pokrewne, ale to rzeczowniki (bieg, biegacz, pismo, skok) albo przymiotniki (pisarski, skoczny).<\/details><br>\n3. Rzeczownikiem jest wyraz: *(3 pkt)*\n   - A) radość\n   - B) radosny\n   - C) radośnie\n   - D) radować\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — radość<br>Co? — radość. Rzeczowniki nazywają nie tylko rzeczy, które da się dotknąć, ale też uczucia i cechy. „Radosny” to przymiotnik, „radośnie” — przysłówek, „radować” — czasownik.<\/details><br>\n4. Zaimka NIE ma w zdaniu: *(4 pkt)*\n   - A) Daj mi książkę.\n   - B) Ktoś zapukał do drzwi.\n   - C) Tamten pies głośno szczeka.\n   - D) Kot wskoczył na parapet.\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — Kot wskoczył na parapet.<br>W zdaniu D są tylko rzeczowniki (kot, parapet), czasownik (wskoczył) i przyimek (na). W pozostałych są zaimki: „mi”, „ktoś”, „tamten”.<\/details><br>\n5. Same przymiotniki są w szeregu: *(4 pkt)*\n   - A) zielony, zieleń, zielenieć\n   - B) szybki, szybko, szybkość\n   - C) wesoły, smutek, zły\n   - D) drewniany, drewno, drwal\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>W każdym szeregu jest tylko jeden przymiotnik albo dwa: zieleń, smutek, szybkość, drewno, drwal to rzeczowniki, zielenieć — czasownik, szybko — przysłówek. Pułapka: w C „wesoły” i „zły” to przymiotniki, ale „smutek” to rzeczownik (co?).<\/details><br>\n6. Wyraz ***pięcioro***: *(4 pkt)*\n   - A) jest liczebnikiem\n   - B) jest rzeczownikiem\n   - C) jest przymiotnikiem\n   - D) nie odmienia się\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — jest liczebnikiem<br>Ile? — pięcioro (dzieci). To liczebnik, który liczy np. dzieci lub zwierzęta młode. Odmienia się: pięciorga, pięciorgu, z pięciorgiem.<\/details><br>\n7. Wyraz ***książęcy***: *(4 pkt)* *(Alfik 2025, zad. 17)*\n   - A) to przysłówek\n   - B) jest przymiotnikiem\n   - C) nie odmienia się przez przypadki\n   - D) podlega stopniowaniu\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — jest przymiotnikiem<br>Jaki tron? książęcy — przymiotnik odpowiada na pytanie jaki? Odmienia się (książęcego, książęcemu), ale nie da się go stopniować (nie mówimy „bardziej książęcy”, „najbardziej książęcy”).<\/details><br>\n8. Podkreślony wyraz w sformułowaniu ***<u>ciche<\/u> miasteczko***: *(4 pkt)* *(Alfik 2023, zad. 19)*\n   - A) nie jest określeniem\n   - B) jest przymiotnikiem\n   - C) jest nieodmienny\n   - D) ma formę dopełniacza\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — jest przymiotnikiem<br>Przymiotnik odpowiada na pytania jaki? jaka? jakie? — jakie miasteczko? ciche. Odmienia się (cichego, cichemu…), a tu stoi w mianowniku.<\/details><br>\n9. Rzeczownikiem jest wyraz: *(4 pkt)* *(Alfik 2022, zad. 20)*\n   - A) odnieść\n   - B) niechęć\n   - C) temu\n   - D) całego\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — niechęć<br>*Niechęć* nazywa uczucie i odpowiada na pytanie co? — to rzeczownik. *Odnieść* to czasownik (bezokolicznik), *temu* — zaimek, *całego* — przymiotnik.<\/details><br>\n10. Wyraz ***wieczystej*** jest: *(4 pkt)* *(Alfik 2014, zad. 16)*\n    - A) liczebnikiem\n    - B) przymiotnikiem\n    - C) zaimkiem\n    - D) przyimkiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — przymiotnikiem<br>Przymiotnik określa cechę rzeczownika i odpowiada na pytania jaki? jaka? jakie? — chwały jakiej? wieczystej.<\/details><br>\n11. Wyraz ***najmilszym***: *(4 pkt)* *(Alfik 2014, zad. 17)*\n    - A) jest przysłówkiem\n    - B) nie odmienia się przez przypadki\n    - C) jest przymiotnikiem\n    - D) nie podlega stopniowaniu\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest przymiotnikiem<br>„Najmilszym” to przymiotnik „miły” w stopniu najwyższym (miły – milszy – najmilszy), w miejscowniku: w najmilszym domu. Pułapka D: właśnie widać, że się stopniuje.<\/details><br>\n12. Ile czasowników jest w zdaniu ***Przed wyjściem na spacer musisz zjeść śniadanie i umyć zęby.***? *(5 pkt)*\n    - A) jeden\n    - B) dwa\n    - C) trzy\n    - D) cztery\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — trzy<br>Czasowniki to: musisz, zjeść, umyć. Pułapka: „wyjściem” i „śniadanie” to rzeczowniki (z czym? co?), choć „wyjście” nazywa czynność.<\/details><br>\n13. Wyraz ***nimi*** w zdaniu ***Poszłam z nimi do kina.*** to: *(5 pkt)*\n    - A) rzeczownik w narzędniku\n    - B) przyimek\n    - C) zaimek w celowniku\n    - D) zaimek w narzędniku\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — zaimek w narzędniku<br>„Nimi” zastępuje rzeczownik (np. z koleżankami), więc to zaimek (oni). Pytamy: z kim? z czym? — to narzędnik. Przyimkiem jest „z”, a nie „nimi”.<\/details><br>\n14. Wyraz ***rozległego***: *(5 pkt)* *(Alfik 2025, zad. 25)*\n    - A) jest przysłówkiem\n    - B) nie odmienia się\n    - C) należy do tej samej części mowy co wyraz *terenu*\n    - D) należy do tej samej części mowy co wyraz *nowym*\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — należy do tej samej części mowy co wyraz *nowym*<br>„Rozległego” i „nowym” to przymiotniki (jakiego? jakim?). „Terenu” to rzeczownik.<\/details><br>\n15. Wyraz ***im*** to: *(5 pkt)* *(Alfik 2025, zad. 29)*\n    - A) zaimek *oni* w formie celownika\n    - B) przyimek\n    - C) przysłówek\n    - D) partykuła\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — zaimek *oni* w formie celownika<br>Oni, ich, im — „im” to celownik (komu? czemu?) zaimka „oni”.<\/details><br>\n16. Wyraz ***możliwość*** jest: *(5 pkt)* *(Alfik 2025, zad. 30)*\n    - A) rzeczownikiem\n    - B) czasownikiem w formie bezokolicznika\n    - C) czasownikiem w formie osobowej\n    - D) zaimkiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — rzeczownikiem<br>Co? możliwość — to rzeczownik. Pułapka: zakończenie „-ść” przypomina bezokolicznik (np. nieść, kraść), ale „możliwość” nie nazywa czynności, tylko to, że coś jest możliwe.<\/details><br>\n17. Wyraz ***wszyscy***: *(5 pkt)* *(Alfik 2023, zad. 21)*\n    - A) odmienia się przez przypadki\n    - B) ma formę celownika\n    - C) jest rzeczownikiem\n    - D) ma formę liczby pojedynczej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — odmienia się przez przypadki<br>Wszyscy, wszystkich, wszystkim… — wyraz się odmienia. To zaimek w mianowniku liczby mnogiej, więc B, C i D są nieprawdziwe.<\/details><br>\n18. Wyraz ***jego***: *(5 pkt)* *(Alfik 2022, zad. 23)*\n    - A) nie odmienia się przez przypadki\n    - B) jest przyimkiem\n    - C) jest zaimkiem\n    - D) ma więcej samogłosek niż spółgłosek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest zaimkiem<br>Zaimek zastępuje inną część mowy: *jego* postać = postać Walickiego. To forma zaimka *on* (on, jego, jemu), więc się odmienia. Samogłoski e, o i spółgłoski j, g — po dwie.<\/details><br>\n19. Wyraz ***pierwszy***: *(5 pkt)* *(Alfik 2018, zad. 24)*\n    - A) ma tę samą ilość liter i głosek\n    - B) jest jednosylabowy\n    - C) jest przymiotnikiem\n    - D) odmienia się przez przypadki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — odmienia się przez przypadki<br>Pierwszy, pierwszego, pierwszemu… — odmienia się. Pułapka: *pierwszy* odpowiada na pytanie „który z kolei?” i w szkole nazywa się go liczebnikiem porządkowym, a nie przymiotnikiem. Ma 2 sylaby (pierw-szy) i więcej liter niż głosek (*sz* to jedna głoska, a *i* tylko zmiękcza).<\/details><br>\n20. Wyraz ***niepokój***: *(5 pkt)* *(Alfik 2018, zad. 28)*\n    - A) jest czasownikiem\n    - B) nie ma formy liczby mnogiej\n    - C) w mianowniku i bierniku ma różne formy\n    - D) jest rzeczownikiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — jest rzeczownikiem<br>*Niepokój* nazywa uczucie i odpowiada na pytanie co? — to rzeczownik. Ma liczbę mnogą (niepokoje), a w mianowniku i bierniku brzmi tak samo (jest niepokój — budzą niepokój).<\/details><br>\n21. Rzeczownikiem nie jest wyraz: *(5 pkt)* *(Alfik 2017, zad. 30)*\n    - A) panie\n    - B) kulikach\n    - C) czasami\n    - D) pedogrę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — czasami<br>W tekście „Ej, czasami” znaczy „niekiedy” — to przysłówek (kiedy?). „Panie”, „kulikach” (kulig) i „pedogrę” (podagra) to rzeczowniki. Uwaga: „czasami” bywa też narzędnikiem rzeczownika „czas” (np. „między czasami”), ale tu chodzi o znaczenie „niekiedy”.<\/details><br>\n22. Wyraz ***zgiełk*** to: *(5 pkt)* *(Alfik 2016, zad. 25)*\n    - A) rzeczownik\n    - B) przymiotnik\n    - C) przysłówek\n    - D) zaimek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — rzeczownik<br>Zgiełk to hałas, gwar. Odpowiada na pytanie co? i odmienia się przez przypadki (zgiełk, zgiełku, zgiełkiem) — to rzeczownik.<\/details><br>\n23. Wyraz ***nam***: *(5 pkt)* *(Alfik 2014, zad. 27)*\n    - A) nie odmienia się przez przypadki\n    - B) jest zaimkiem\n    - C) jest rzeczownikiem\n    - D) ma dwie samogłoski\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest zaimkiem<br>„Nam” to celownik zaimka „my” (my, nas, nam, nas, nami, o nas) — zastępuje rzeczownik. Ma jedną samogłoskę (a) i odmienia się przez przypadki.<\/details><br>\n24. Rzeczownikiem nie jest wyraz: *(5 pkt)* *(Alfik 2014, zad. 28)*\n    - A) przedstawieniem\n    - B) wymiany\n    - C) teatralnego\n    - D) wzruszenia\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — teatralnego<br>„Teatralny” to przymiotnik — odpowiada na pytanie jaki? (zespołu jakiego? teatralnego). Przedstawienie, wymiana i wzruszenie to rzeczowniki (kto? co?).<\/details><br>\n\n## B. Nieodmienne części mowy\n\nPrzysłówek, przyimek, spójnik, partykuła i wykrzyknik zawsze mają tę samą formę — bez względu na to, w jakim zdaniu stoją.\n\n25. Nieodmienny jest wyraz: *(3 pkt)*\n    - A) dom\n    - B) wczoraj\n    - C) mały\n    - D) czytać\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — wczoraj<br>„Wczoraj” to przysłówek (kiedy?) — zawsze ma tę samą formę. Dom (domu), mały (małego) i czytać (czytam) się odmieniają.<\/details><br>\n26. W zdaniu ***Kot spał pod stołem, a pies leżał przy drzwiach.*** są: *(3 pkt)*\n    - A) dwa przyimki i jeden spójnik\n    - B) jeden przyimek i dwa spójniki\n    - C) trzy przyimki\n    - D) dwa spójniki i jeden przyimek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — dwa przyimki i jeden spójnik<br>Przyimki: pod, przy (łączą się z rzeczownikami: pod stołem, przy drzwiach). Spójnik: a (łączy dwa zdania).<\/details><br>\n27. Partykułą jest podkreślony wyraz w zdaniu: *(4 pkt)*\n    - A) Idę <u>do<\/u> sklepu.\n    - B) Mama <u>i<\/u> tata pracują.\n    - C) Ania <u>nie<\/u> lubi deszczu.\n    - D) Wrócę <u>jutro<\/u>.\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — Ania <u>nie<\/u> lubi deszczu.<br>„Nie” przy czasowniku to partykuła. „Do” to przyimek, „i” — spójnik, „jutro” — przysłówek (kiedy?).<\/details><br>\n28. Przysłówkiem NIE jest wyraz: *(4 pkt)*\n    - A) dzisiaj\n    - B) wysoko\n    - C) bardzo\n    - D) dzielny\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — dzielny<br>„Dzielny” odpowiada na pytanie jaki? i odmienia się (dzielnego), więc to przymiotnik. Dzisiaj (kiedy?), wysoko (gdzie? jak?) i bardzo (jak?) to przysłówki.<\/details><br>\n29. Wyraz ***dobrze***: *(4 pkt)*\n    - A) jest przymiotnikiem\n    - B) odmienia się przez przypadki\n    - C) można stopniować\n    - D) jest rzeczownikiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — można stopniować<br>„Dobrze” to przysłówek (jak?): dobrze – lepiej – najlepiej. Przez przypadki się nie odmienia. Pułapka: przysłówek jest nieodmienny, a mimo to wiele przysłówków ma stopień wyższy i najwyższy.<\/details><br>\n30. Do nieodmiennej części mowy zalicza się wyraz: *(4 pkt)* *(Alfik 2025, zad. 20)*\n    - A) po\n    - B) im\n    - C) pierwszy\n    - D) żydowski\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — po<br>„Po” to przyimek, a przyimki się nie odmieniają. „Im” to zaimek (oni, ich, im), „pierwszy” to liczebnik, a „żydowski” przymiotnik — wszystkie się odmieniają.<\/details><br>\n31. Wyraz ***ze*** jest: *(4 pkt)* *(Alfik 2018, zad. 18)*\n    - A) spójnikiem\n    - B) przyimkiem\n    - C) zaimkiem\n    - D) wyrazem nienależącym do żadnej z wymienionych części mowy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — przyimkiem<br>*Ze* to inna postać przyimka *z* (ze swym uczniem, ze szkoły). Przyimek łączy się z rzeczownikiem i razem z nim tworzy wyrażenie przyimkowe. Pułapka: *że* z kropką to spójnik, a *ze* — przyimek.<\/details><br>\n32. Wyrazy ***zaś*** i ***nami*** są: *(4 pkt)* *(Alfik 2017, zad. 20)*\n    - A) w obu przypadkach nieodmienne\n    - B) innymi częściami mowy\n    - C) tą samą częścią mowy\n    - D) przyimkami\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — innymi częściami mowy<br>„Zaś” to spójnik (nieodmienny), a „nami” to zaimek — narzędnik od „my” (odmienny). Różne części mowy.<\/details><br>\n33. Wyraz ***lepiej*** jest: *(4 pkt)* *(Alfik 2016, zad. 19)*\n    - A) przymiotnikiem\n    - B) przyimkiem\n    - C) przysłówkiem\n    - D) zaimkiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — przysłówkiem<br>Przysłówek określa czasownik i odpowiada na pytanie jak? (będzie jak? lepiej). „Lepiej” to stopień wyższy przysłówka „dobrze”. Pułapka A: przymiotnik to „lepszy”.<\/details><br>\n34. Spójnikiem nie jest wyraz: *(4 pkt)* *(Alfik 2015, zad. 19)*\n    - A) od\n    - B) że\n    - C) i\n    - D) ale\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — od<br>Spójnik łączy wyrazy lub zdania (i, ale, że, lecz, bo). „Od” to przyimek — stoi przed rzeczownikiem i łączy się z nim (od szala, od ściany).<\/details><br>\n35. Ile wyrazów nieodmiennych jest w zdaniu ***Ojej, chyba znowu zgubiłem klucze od domu!***? *(5 pkt)*\n    - A) trzy\n    - B) cztery\n    - C) pięć\n    - D) dwa\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — cztery<br>Nieodmienne są: ojej (wykrzyknik), chyba (partykuła), znowu (przysłówek), od (przyimek). Zgubiłem, klucze i domu się odmieniają.<\/details><br>\n36. W zdaniu ***Nad jeziorem było bardzo cicho i chłodno.***: *(5 pkt)*\n    - A) są cztery przysłówki\n    - B) są dwa przyimki\n    - C) nie ma spójnika\n    - D) jest przymiotnik\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Przysłówki są trzy (bardzo, cicho, chłodno), przyimek jeden (nad), spójnik jest („i”). Przymiotnika nie ma. Pułapka: „cicho” i „chłodno” to przysłówki (jak było?), przymiotniki brzmiałyby „cichy”, „chłodny”.<\/details><br>\n37. W sformułowaniu ***coraz to ciemniej***: *(5 pkt)* *(Alfik 2024, zad. 21)*\n    - A) jest przymiotnik\n    - B) są dwa przysłówki\n    - C) jest czasownik\n    - D) jest rzeczownik\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — są dwa przysłówki<br>Przysłówek odpowiada na pytania jak? kiedy? gdzie? i się nie odmienia. „Coraz” i „ciemniej” (stopień wyższy od „ciemno”) to przysłówki, a „to” jest tu partykułą. Pułapka: „ciemniej” to nie przymiotnik — przymiotnik brzmiałby „ciemniejszy”.<\/details><br>\n38. Przysłówkiem jest wyraz: *(5 pkt)* *(Alfik 2022, zad. 26)*\n    - A) głucho\n    - B) prawo\n    - C) wiodło\n    - D) udawało\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — głucho<br>Przysłówek określa czasownik i odpowiada na pytanie jak? — jęczał (jak?) *głucho*. Pułapka B: *prawo* („mieć prawo”) to rzeczownik. *Wiodło* i *udawało* to czasowniki.<\/details><br>\n39. Do nieodmiennej części mowy należy wyraz: *(5 pkt)* *(Alfik 2022, zad. 29)*\n    - A) ukaże się\n    - B) wojowniczo\n    - C) szczęście\n    - D) odegrać\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — wojowniczo<br>*Wojowniczo* to przysłówek (jak?), a przysłówki się nie odmieniają. *Ukaże się* i *odegrać* to czasowniki, a *szczęście* to rzeczownik — części mowy odmienne. Pułapka D: bezokolicznik się nie zmienia, ale czasownik jako część mowy jest odmienny.<\/details><br>\n40. Do nieodmiennych części mowy należy wyraz: *(5 pkt)* *(Alfik 2017, zad. 24)*\n    - A) nic\n    - B) co\n    - C) między\n    - D) kurcz\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — między<br>„Między” to przyimek, a przyimki się nie odmieniają. „Nic” i „co” to zaimki (niczego, czego), „kurcz” to rzeczownik (kurczu) — odmieniają się.<\/details><br>\n\n## C. Części mowy w zdaniu\n\nTen sam „rdzeń” może tworzyć różne części mowy — o tym, czym jest wyraz, decyduje jego forma i pytanie, na które odpowiada w zdaniu.\n\n41. W zdaniu ***Pies głośno szczekał na listonosza.*** wyraz ***głośno*** to: *(3 pkt)*\n    - A) przymiotnik\n    - B) przysłówek\n    - C) czasownik\n    - D) rzeczownik\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — przysłówek<br>Jak szczekał? — głośno. Przysłówek określa czasownik. Przymiotnik brzmiałby „głośny” (jaki?).<\/details><br>\n42. Wyrażeniem przyimkowym jest: *(3 pkt)*\n    - A) bardzo ładnie\n    - B) i my\n    - C) nadmorski\n    - D) szybko biegnie\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Wyrażenie przyimkowe to przyimek + rzeczownik lub zaimek, np. nad morzem. W A są dwa przysłówki, w B spójnik i zaimek, w D przysłówek i czasownik. Pułapka: „nadmorski” zaczyna się od „nad”, ale to jeden wyraz — przymiotnik.<\/details><br>\n43. Rzeczownikiem jest podkreślony wyraz w zdaniu: *(4 pkt)*\n    - A) <u>Pływanie<\/u> to mój ulubiony sport.\n    - B) Lubię <u>pływać<\/u> w jeziorze.\n    - C) Ola <u>pływa<\/u> najszybciej.\n    - D) Dziadek <u>pływał<\/u> codziennie.\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — <u>Pływanie<\/u> to mój ulubiony sport.<br>Co jest ulubionym sportem? — pływanie. Odmienia się jak rzeczownik (pływania, pływaniem). Pozostałe to czasowniki. Pułapka: „pływanie” nazywa czynność, ale nie odmienia się przez osoby.<\/details><br>\n44. Wyraz ***mi*** w zdaniu ***Podaj mi sól.*** zastępuje: *(4 pkt)*\n    - A) rzeczownik\n    - B) przymiotnik\n    - C) czasownik\n    - D) przysłówek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — rzeczownik<br>„Mi” to zaimek (forma od „ja”). Zastępuje rzeczownik — zamiast „Podaj mi” można powiedzieć np. „Podaj Kasi”.<\/details><br>\n45. W zdaniu ***Trzej chłopcy zbudowali wysoką wieżę z klocków.***: *(4 pkt)*\n    - A) są dwa przymiotniki\n    - B) nie ma przyimka\n    - C) są dwa czasowniki\n    - D) jest jeden liczebnik\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — jest jeden liczebnik<br>Liczebnik to „trzej” (ilu?). Przymiotnik jest jeden (wysoką), czasownik jeden (zbudowali), a „z” to przyimek.<\/details><br>\n46. W zdaniu ***Mieszko objął tron książęcy po śmierci ojca***: *(4 pkt)* *(Alfik 2025, zad. 16)*\n    - A) są dwa rzeczowniki\n    - B) nie ma czasownika\n    - C) są cztery czasowniki\n    - D) są cztery rzeczowniki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — są cztery rzeczowniki<br>Rzeczowniki (kto? co?) to: Mieszko, tron, śmierci, ojca. Czasownik jest jeden: objął. „Książęcy” to przymiotnik, a „po” to przyimek.<\/details><br>\n47. Sformułowanie ***życie chłopców***: *(4 pkt)* *(Alfik 2023, zad. 18)*\n    - A) zawiera czasownik\n    - B) składa się z wyrazów o różnej liczbie sylab\n    - C) składa się z dwóch rzeczowników\n    - D) składa się z dwóch rzeczowników w tym samym przypadku\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — składa się z dwóch rzeczowników<br>„Życie” i „chłopców” to rzeczowniki (kto? co?). Pułapka: są w różnych przypadkach — „życie” w mianowniku, „chłopców” w dopełniaczu (kogo?), więc D odpada. Oba wyrazy mają po 2 sylaby (ży-cie, chłop-ców).<\/details><br>\n48. W wypowiedzeniu ***był (…) aktorem w teatrze***: *(4 pkt)* *(Alfik 2022, zad. 16)*\n    - A) są dwa rzeczowniki\n    - B) wszystkie wyrazy należą do odmiennych części mowy\n    - C) jest rzeczownik w dopełniaczu\n    - D) nie ma czasownika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — są dwa rzeczowniki<br>Rzeczowniki to *aktorem* (narzędnik) i *teatrze* (miejscownik), więc C odpada. *Był* to czasownik, a *w* to przyimek — część mowy nieodmienna, więc B też odpada.<\/details><br>\n49. Wyrazy ***zasadniczo*** oraz ***nieszczęśliwym***: *(4 pkt)* *(Alfik 2022, zad. 17)*\n    - A) to dwa przymiotniki\n    - B) nie mają tyle samo sylab\n    - C) to przysłówek i przymiotnik\n    - D) mają tyle samo liter co głosek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — to przysłówek i przymiotnik<br>*Zasadniczo* odpowiada na pytanie jak? — to przysłówek. *Nieszczęśliwym* odpowiada na pytanie jakim? — to przymiotnik. Oba mają po 4 sylaby (za-sad-ni-czo, nie-szczę-śli-wym), a dwuznaki *cz*, *sz* sprawiają, że liter jest więcej niż głosek.<\/details><br>\n50. W wypowiedzeniu ***W teatrze też mu się nie wiodło***: *(4 pkt)* *(Alfik 2022, zad. 19)*\n    - A) nie ma orzeczenia\n    - B) nie ma czasownika\n    - C) występuje jeden rzeczownik\n    - D) nie ma wyrazów jednosylabowych\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — występuje jeden rzeczownik<br>Jedyny rzeczownik to *teatrze*. *Nie wiodło się* to czasownik w funkcji orzeczenia, a wyrazy *w*, *też*, *mu*, *się*, *nie* są jednosylabowe.<\/details><br>\n51. W zdaniu ***Zbliżyła się szybko do ściany***: *(4 pkt)* *(Alfik 2019, zad. 19)*\n    - A) występuje przysłówek\n    - B) nie ma czasownika w formie osobowej\n    - C) nie ma przyimka\n    - D) jest przymiotnik w stopniu równym\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — występuje przysłówek<br>*Szybko* to przysłówek — określa czasownik i odpowiada na pytanie jak? *Zbliżyła się* to forma osobowa, *do* to przyimek, a przymiotnika tu nie ma.<\/details><br>\n52. W wypowiedzeniu ***(…) profesor żądał natychmiastowej rozmowy ze swym uczniem***: *(4 pkt)* *(Alfik 2018, zad. 17)*\n    - A) są dwa czasowniki\n    - B) wszystkie rzeczowniki mają formę mianownika\n    - C) występują trzy rzeczowniki\n    - D) przynajmniej dwa rzeczowniki są w tym samym przypadku\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — występują trzy rzeczowniki<br>Rzeczowniki to: *profesor* (mianownik), *rozmowy* (dopełniacz: żądał czego?), *uczniem* (narzędnik: z kim?). Każdy jest w innym przypadku, więc B i D odpadają. Czasownik jest jeden — *żądał*.<\/details><br>\n53. W wypowiedzeniu ***rozumiem twoje zdumienie***: *(4 pkt)* *(Alfik 2018, zad. 19)*\n    - A) jest jeden rzeczownik\n    - B) nie ma rzeczowników\n    - C) są dwa czasowniki\n    - D) nie występuje czasownik\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — jest jeden rzeczownik<br>*Zdumienie* to rzeczownik (rozumiem co?). *Rozumiem* to jedyny czasownik, a *twoje* to zaimek.<\/details><br>\n54. W wypowiedzeniu ***W małżeńskim ciężko stanie*** występuje: *(4 pkt)* *(Alfik 2017, zad. 18)*\n    - A) zaimek\n    - B) więcej niż jeden przyimek\n    - C) czasownik\n    - D) przysłówek\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — przysłówek<br>„Ciężko” to przysłówek — odpowiada na pytanie jak? Pozostałe wyrazy: „w” (jeden przyimek), „małżeńskim” (przymiotnik), „stanie” (rzeczownik: w stanie). Pułapka C: „stanie” wygląda jak czasownik, ale tu znaczy „w stanie małżeńskim”.<\/details><br>\n55. W zdaniu ***Nasz nowy sąsiad często gra na skrzypcach.*** są: *(5 pkt)*\n    - A) dwa przymiotniki\n    - B) dwa rzeczowniki\n    - C) dwa czasowniki\n    - D) dwa przyimki\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — dwa rzeczowniki<br>Rzeczowniki: sąsiad, skrzypcach. Czasownik jest jeden (gra), przyimek jeden (na). Pułapka: „nasz” to zaimek, a nie przymiotnik, więc przymiotnik jest tylko jeden (nowy).<\/details><br>\n56. W zdaniu ***Za tydzień pojedziemy z kuzynem nad morze.***: *(5 pkt)*\n    - A) jest jedno wyrażenie przyimkowe\n    - B) są dwa wyrażenia przyimkowe\n    - C) są trzy wyrażenia przyimkowe\n    - D) nie ma czasownika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — są trzy wyrażenia przyimkowe<br>Za tydzień, z kuzynem, nad morze — w każdym jest przyimek i rzeczownik. Czasownik to „pojedziemy”.<\/details><br>\n57. W zdaniu ***Na pewno należały do nich tereny zamieszkane przez Polan i Goplan***: *(5 pkt)* *(Alfik 2025, zad. 21)*\n    - A) są trzy zaimki\n    - B) są trzy przyimki\n    - C) jest jeden przyimek\n    - D) nie ma zaimka\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — są trzy przyimki<br>Przyimki to: na, do, przez. Zaimek jest jeden: nich. Uwaga: „na pewno” to stałe wyrażenie znaczące „pewnie”; jeśli nie liczyć w nim „na” jako osobnego przyimka, wyszłyby tylko dwa przyimki. Oficjalna odpowiedź to B.<\/details><br>\n58. W zdaniu ***Zależało im na zjednoczeniu kraju ze względu na możliwość poszerzenia swoich wpływów***: *(5 pkt)* *(Alfik 2025, zad. 28)*\n    - A) są dwa czasowniki\n    - B) jest jeden czasownik\n    - C) są dwa orzeczenia\n    - D) jest przydawka\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — jest jeden czasownik<br>Jedyny czasownik to „zależało”. „Zjednoczeniu” i „poszerzenia” wyglądają podobnie do czasowników, ale to rzeczowniki (co? zjednoczenie, poszerzenie). Uwaga: w zdaniu jest też przydawka — „swoich” (czyich wpływów?) — więc D wydaje się również prawdziwe. Oficjalna odpowiedź to B.<\/details><br>\n59. Wyrazy ***wiatr północny***: *(5 pkt)* *(Alfik 2024, zad. 22)*\n    - A) są w różnych przypadkach\n    - B) nie odmieniają się przez przypadki\n    - C) to dwa rzeczowniki\n    - D) to rzeczownik i przymiotnik\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — to rzeczownik i przymiotnik<br>„Wiatr” to rzeczownik (co?), a „północny” to przymiotnik (jaki wiatr?). Oba są w mianowniku i oba się odmieniają (wiatru północnego).<\/details><br>\n60. Związek wyrazów ***we mgle***: *(5 pkt)* *(Alfik 2024, zad. 24)*\n    - A) to zaimek i przyimek\n    - B) zawiera rzeczownik w dopełniaczu\n    - C) to wyrażenie przyimkowe\n    - D) nie zawiera rzeczownika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — to wyrażenie przyimkowe<br>Wyrażenie przyimkowe to przyimek + rzeczownik (lub inny wyraz odmienny): „we” to przyimek, „mgle” to rzeczownik. „Mgle” jest w miejscowniku (o czym? o mgle), nie w dopełniaczu.<\/details><br>\n61. Sformułowanie ***smak lodu*** składa się z: *(5 pkt)* *(Alfik 2021, zad. 25)*\n    - A) dwóch rzeczowników\n    - B) rzeczownika i przymiotnika\n    - C) dwóch rzeczowników w tym samym przypadku\n    - D) dwóch rzeczowników w dopełniaczu\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — dwóch rzeczowników<br>*Smak* (mianownik) i *lodu* (dopełniacz: smak czego?) to rzeczowniki, ale w różnych przypadkach, więc C i D odpadają. Przymiotnika tu nie ma.<\/details><br>\n62. W wypowiedzeniu ***Zna proporcję(…)/I nie każe fircykować***: *(5 pkt)* *(Alfik 2017, zad. 22)*\n    - A) jest tylko jeden czasownik\n    - B) występuje spójnik\n    - C) brakuje orzeczenia\n    - D) nie ma partykuły\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — występuje spójnik<br>„I” to spójnik, łączy dwie części wypowiedzenia. Czasowniki są trzy (zna, każe, fircykować), orzeczenia dwa (zna, każe), a „nie” to partykuła.<\/details><br>\n63. W zdaniu ***Najlepiej jest nie poddać się smętkowi***: *(5 pkt)* *(Alfik 2016, zad. 30)*\n    - A) jest przymiotnik w stopniu wyższym\n    - B) nie ma przymiotnika\n    - C) wszystkie czasowniki mają formę osobową\n    - D) nie ma rzeczownika\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — nie ma przymiotnika<br>„Najlepiej” to przysłówek w stopniu najwyższym (dobrze – lepiej – najlepiej), a nie przymiotnik. Pułapka D: „smętkowi” to rzeczownik (smętek = smutek). Pułapka C: „poddać” to bezokolicznik.<\/details><br>\n64. Podkreślone wyrazy w sformułowaniu ***<u>uczonego<\/u> i <u>profesora<\/u>***: *(5 pkt)* *(Alfik 2014, zad. 29)*\n    - A) są w różnych przypadkach\n    - B) są rzeczownikami\n    - C) należą do nieodmiennych części mowy\n    - D) mają różne ilości sylab\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — są rzeczownikami<br>„Uczony” to tu osoba (naukowiec), tak jak „profesor” — oba nazywają ludzi, więc są rzeczownikami. Oba są w dopełniaczu i mają po cztery sylaby (u-czo-ne-go, pro-fe-so-ra). Pułapka: „uczony” wygląda jak przymiotnik, ale tu nazywa osobę.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. B — trzy rzeczowniki\n2. C — śpiewał, śpiewa, zaśpiewa\n3. A — radość\n4. D — Kot wskoczył na parapet.\n5. E — żadna z powyższych\n6. A — jest liczebnikiem\n7. B — jest przymiotnikiem *(Alfik 2025, zad. 17)*\n8. B — jest przymiotnikiem *(Alfik 2023, zad. 19)*\n9. B — niechęć *(Alfik 2022, zad. 20)*\n10. B — przymiotnikiem *(Alfik 2014, zad. 16)*\n11. C — jest przymiotnikiem *(Alfik 2014, zad. 17)*\n12. C — trzy\n13. D — zaimek w narzędniku\n14. D — należy do tej samej części mowy co wyraz *nowym* *(Alfik 2025, zad. 25)*\n15. A — zaimek *oni* w formie celownika *(Alfik 2025, zad. 29)*\n16. A — rzeczownikiem *(Alfik 2025, zad. 30)*\n17. A — odmienia się przez przypadki *(Alfik 2023, zad. 21)*\n18. C — jest zaimkiem *(Alfik 2022, zad. 23)*\n19. D — odmienia się przez przypadki *(Alfik 2018, zad. 24)*\n20. D — jest rzeczownikiem *(Alfik 2018, zad. 28)*\n21. C — czasami *(Alfik 2017, zad. 30)*\n22. A — rzeczownik *(Alfik 2016, zad. 25)*\n23. B — jest zaimkiem *(Alfik 2014, zad. 27)*\n24. C — teatralnego *(Alfik 2014, zad. 28)*\n25. B — wczoraj\n26. A — dwa przyimki i jeden spójnik\n27. C — Ania <u>nie<\/u> lubi deszczu.\n28. D — dzielny\n29. C — można stopniować\n30. A — po *(Alfik 2025, zad. 20)*\n31. B — przyimkiem *(Alfik 2018, zad. 18)*\n32. B — innymi częściami mowy *(Alfik 2017, zad. 20)*\n33. C — przysłówkiem *(Alfik 2016, zad. 19)*\n34. A — od *(Alfik 2015, zad. 19)*\n35. B — cztery\n36. E — żadna z powyższych\n37. B — są dwa przysłówki *(Alfik 2024, zad. 21)*\n38. A — głucho *(Alfik 2022, zad. 26)*\n39. B — wojowniczo *(Alfik 2022, zad. 29)*\n40. C — między *(Alfik 2017, zad. 24)*\n41. B — przysłówek\n42. E — żadna z powyższych\n43. A — <u>Pływanie<\/u> to mój ulubiony sport.\n44. A — rzeczownik\n45. D — jest jeden liczebnik\n46. D — są cztery rzeczowniki *(Alfik 2025, zad. 16)*\n47. C — składa się z dwóch rzeczowników *(Alfik 2023, zad. 18)*\n48. A — są dwa rzeczowniki *(Alfik 2022, zad. 16)*\n49. C — to przysłówek i przymiotnik *(Alfik 2022, zad. 17)*\n50. C — występuje jeden rzeczownik *(Alfik 2022, zad. 19)*\n51. A — występuje przysłówek *(Alfik 2019, zad. 19)*\n52. C — występują trzy rzeczowniki *(Alfik 2018, zad. 17)*\n53. A — jest jeden rzeczownik *(Alfik 2018, zad. 19)*\n54. D — przysłówek *(Alfik 2017, zad. 18)*\n55. B — dwa rzeczowniki\n56. C — są trzy wyrażenia przyimkowe\n57. B — są trzy przyimki *(Alfik 2025, zad. 21)*\n58. B — jest jeden czasownik *(Alfik 2025, zad. 28)*\n59. D — to rzeczownik i przymiotnik *(Alfik 2024, zad. 22)*\n60. C — to wyrażenie przyimkowe *(Alfik 2024, zad. 24)*\n61. A — dwóch rzeczowników *(Alfik 2021, zad. 25)*\n62. B — występuje spójnik *(Alfik 2017, zad. 22)*\n63. B — nie ma przymiotnika *(Alfik 2016, zad. 30)*\n64. B — są rzeczownikami *(Alfik 2014, zad. 29)*\n\n## Ściąga\n\n| Część mowy | Pytania / rozpoznanie | Przykłady |\n|---|---|---|\n| rzeczownik (odm.) | kto? co? | mama, radość, pływanie |\n| czasownik (odm.) | co robi? co się z nim dzieje? | pisze, zjeść, musisz |\n| przymiotnik (odm.) | jaki? jaka? jakie? który? | nowy, dzielny, kolorowe |\n| liczebnik (odm.) | ile? który z kolei? | trzy, trzej, pięcioro, siódmy |\n| zaimek (odm.) | zastępuje inną część mowy | ja, mi, nimi, ktoś, nasz, tamten |\n| przysłówek (nieodm.) | jak? gdzie? kiedy?; często da się stopniować | wesoło, dobrze, wczoraj, bardzo |\n| przyimek (nieodm.) | stoi przed rzeczownikiem lub zaimkiem | w, na, z, do, pod, nad, przez |\n| spójnik (nieodm.) | łączy wyrazy lub zdania | i, a, ale, lub, więc, bo, że |\n| partykuła (nieodm.) | dodaje odcień znaczenia, przeczy, pyta | nie, chyba, czy, niech |\n| wykrzyknik (nieodm.) | wyraża uczucia, naśladuje dźwięki | ach, ojej, hura, bum |\n| wyrażenie przyimkowe | przyimek + rzeczownik/zaimek | pod mostem, z nimi, nad morze |\n"}, {"path": "humanistyczny/klasa-5/zadania-wg-typu/05-odmiana-wyrazow.md", "id": "hum5/05-odmiana-wyrazow", "kind": "dzial", "short": "05 Odmiana wyrazów", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# 05. Odmiana wyrazów\n\n**Dlaczego warto:** W arkuszach Alfika często pada pytanie, w jakim przypadku, liczbie albo czasie jest wyraz z tekstu, oraz zadania o stopniowaniu i o temacie i końcówce. Najczęstsze pułapki to przypadki o tej samej formie (*brata* bywa dopełniaczem i biernikiem), czas przyszły, który brzmi jak teraźniejszy (*zjem, przeczytam*), i stopniowanie nieregularne (*dobry – lepszy*).\n\n- **W pliku:** 44 zadań: 24 nowych i 20 z prawdziwych arkuszy Alfika (8 za 3 pkt, 13 za 4 pkt, 23 za 5 pkt).\n\n**Wskazówki**\n- Przypadki i pytania: mianownik (kto? co?), dopełniacz (kogo? czego?), celownik (komu? czemu?), biernik (kogo? co?), narzędnik (z kim? z czym?), miejscownik (o kim? o czym?), wołacz (o!).\n- Gdy dopełniacz i biernik mają tę samą formę (*brata*), podstaw rzeczownik rodzaju żeńskiego: *widzę siostrę* (biernik), *nie ma siostry* (dopełniacz).\n- Czasowniki dokonane (*zjem, przeczytam, pójdę*) nie mają czasu teraźniejszego — forma, która brzmi jak teraźniejsza, to czas przyszły.\n- Tryb rozkazujący wydaje polecenia (*zrób, zróbcie*), tryb przypuszczający ma cząstkę *-by* (*zrobiłbym, pojechałyby*), tryb oznajmujący po prostu informuje.\n- Stopniowanie: proste (*mądry – mądrzejszy – najmądrzejszy*), opisowe (*bardziej, najbardziej*) i nieregularne (*dobry – lepszy, zły – gorszy, mały – mniejszy, duży – większy*). Przymiotniki od nazw materiałów (*drewniany*) się nie stopniują.\n- Temat to część wyrazu, która zostaje w odmianie; końcówka to to, co się zmienia. Gdy po temacie nic nie ma (*dom*), końcówka jest zerowa.\n- W temacie mogą wymieniać się głoski: *noga – nodze* (g : dz), *ręka – ręce* (k : c), *pies – psa* (e znika).\n\n**Spis treści**\n\n- [A. Rzeczownik: przypadki, liczba, rodzaj](#a-rzeczownik-przypadki-liczba-rodzaj)\n- [B. Czasownik: osoba, czas, tryb, forma](#b-czasownik-osoba-czas-tryb-forma)\n- [C. Stopniowanie przymiotnika i przysłówka](#c-stopniowanie-przymiotnika-i-przysłówka)\n- [D. Temat i końcówka](#d-temat-i-końcówka)\n- [Klucz odpowiedzi](#klucz-odpowiedzi)\n- [Ściąga](#ściąga)\n\n---\n\n## A. Rzeczownik: przypadki, liczba, rodzaj\n\nPrzypadek rozpoznasz, zadając pytanie od wyrazu, od którego rzeczownik zależy w zdaniu.\n\n1. W zdaniu ***Dałem psu kość.*** wyraz ***psu*** jest w: *(3 pkt)*\n   - A) dopełniaczu\n   - B) celowniku\n   - C) bierniku\n   - D) miejscowniku\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — celowniku<br>Dałem komu? czemu? — psu. To celownik. „Kość” jest w bierniku (dałem co?).<\/details><br>\n2. Rzeczownikiem rodzaju nijakiego jest: *(3 pkt)*\n   - A) kolega\n   - B) noc\n   - C) imię\n   - D) dzień\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — imię<br>Mówimy: to imię (jak: to okno). „Ten kolega”, „ten dzień” — rodzaj męski, „ta noc” — żeński. Pułapka: „kolega” kończy się na -a, ale jest rodzaju męskiego.<\/details><br>\n3. Tylko w liczbie mnogiej występuje rzeczownik: *(4 pkt)*\n   - A) kot\n   - B) książka\n   - C) mleko\n   - D) nożyczki\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>D — nożyczki<br>Nie ma formy „jedna nożyczka” — nawet jedne nożyczki nazywamy w liczbie mnogiej. Kot i książka mają obie liczby, a „mleko” używamy zwykle w liczbie pojedynczej.<\/details><br>\n4. W zdaniu ***Ola pisze list do babci ołówkiem.*** NIE ma rzeczownika w: *(4 pkt)*\n   - A) mianowniku\n   - B) bierniku\n   - C) dopełniaczu\n   - D) narzędniku\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Wszystkie te przypadki są w zdaniu: Ola — mianownik (kto?), list — biernik (pisze co?), do babci — dopełniacz (do kogo?), ołówkiem — narzędnik (czym?).<\/details><br>\n5. W zdaniu ***Wczoraj widziałem twojego brata z kolegami.*** rzeczowniki są w: *(5 pkt)*\n   - A) bierniku i narzędniku\n   - B) dopełniaczu i narzędniku\n   - C) dopełniaczu i celowniku\n   - D) bierniku i miejscowniku\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — bierniku i narzędniku<br>Widziałem kogo? co? — brata (biernik); z kim? — z kolegami (narzędnik). Pułapka: „brata” wygląda jak dopełniacz, ale gdy podstawimy siostrę, wyjdzie „widziałem siostrę”, a to biernik.<\/details><br>\n6. Mianownik liczby mnogiej rzeczownika ***człowiek*** to: *(5 pkt)*\n   - A) człowieki\n   - B) ludzie\n   - C) człowieków\n   - D) ludzi\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>B — ludzie<br>Jeden człowiek, wielu — ludzie (kto?). Pułapka: „ludzi” to dopełniacz (nie ma kogo? ludzi), a nie mianownik.<\/details><br>\n7. Wyraz ***tereny***: *(5 pkt)* *(Alfik 2025, zad. 22)*\n   - A) ma formę liczby mnogiej\n   - B) ma końcówkę -eny\n   - C) nie odmienia się przez przypadki\n   - D) jest w liczbie pojedynczej\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — ma formę liczby mnogiej<br>Jeden teren, wiele terenów — „tereny” to liczba mnoga. Końcówka to tylko „-y” (temat: teren-).<\/details><br>\n8. Wyrazy ***ról*** i ***bohaterów***: *(5 pkt)* *(Alfik 2022, zad. 24)*\n   - A) są w formie dopełniacza\n   - B) nie mają liczby pojedynczej\n   - C) są w różnych przypadkach\n   - D) w mianowniku l. poj. mają tę samą końcówkę\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — są w formie dopełniacza<br>Nie nadawała się do (czego?) ról (kogo?) bohaterów — oba w dopełniaczu liczby mnogiej. Liczba pojedyncza istnieje: rola, bohater — i ma różne końcówki (-a i końcówka zerowa).<\/details><br>\n9. Wyrazy: ***opryszków, zbójców, morderców*** mają formę: *(5 pkt)* *(Alfik 2022, zad. 28)*\n   - A) miejscownika\n   - B) biernika\n   - C) dopełniacza\n   - D) liczby pojedynczej\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>C — dopełniacza<br>Opryszków, zbójców, morderców to forma dopełniacza liczby mnogiej (nie ma kogo? czego? — opryszków). Uwaga: w tekście czytamy „grywał (kogo? co?) opryszków, zbójców, morderców”, czyli wyrazy te pełnią rolę biernika; u rzeczowników męskoosobowych biernik liczby mnogiej brzmi tak samo jak dopełniacz, więc B też da się obronić. Organizator uznał C.<\/details><br>\n10. Sformułowanie ***prostego ducha*** składa się z wyrazów: *(5 pkt)* *(Alfik 2018, zad. 26)*\n    - A) z których jeden jest przysłówkiem\n    - B) mających tę samą ilość sylab\n    - C) będących w różnych przypadkach\n    - D) będących w tym samym przypadku\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — będących w tym samym przypadku<br>Oba wyrazy są w dopełniaczu (kogo? czego? — ducha; jakiego? — prostego). Przymiotnik zawsze stoi w tym samym przypadku co rzeczownik, który określa. *Prostego* to przymiotnik, nie przysłówek; sylab jest 3 i 2.<\/details><br>\n11. Sformułowanie ***porządek rzeczy*** tworzą: *(5 pkt)* *(Alfik 2016, zad. 21)*\n    - A) wyrazy należące do różnych części mowy\n    - B) rzeczowniki w tym samym przypadku\n    - C) rzeczowniki w mianowniku i bierniku\n    - D) rzeczowniki w różnych przypadkach\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — rzeczowniki w różnych przypadkach<br>Oba wyrazy to rzeczowniki. „Porządek” jest w mianowniku (kto? co?), a „rzeczy” w dopełniaczu (porządek czego? rzeczy). Pułapka C: to dopełniacz, nie biernik.<\/details><br>\n\n## B. Czasownik: osoba, czas, tryb, forma\n\nCzasownik odmienia się przez osoby, liczby, czasy i tryby; jego podstawową formą jest bezokolicznik.\n\n12. Czasownik ***czytaliśmy*** jest w: *(3 pkt)*\n    - A) czasie przeszłym\n    - B) czasie teraźniejszym\n    - C) czasie przyszłym\n    - D) trybie rozkazującym\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — czasie przeszłym<br>„Czytaliśmy” mówi o tym, co już się działo (1. osoba liczby mnogiej, czas przeszły). Teraz: czytamy, w przyszłości: będziemy czytać.<\/details><br>\n13. Bezokolicznikiem jest: *(3 pkt)*\n    - A) pisz\n    - B) piszę\n    - C) pisałby\n    - D) pisać\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — pisać<br>Bezokolicznik nie wskazuje osoby ani czasu i kończy się zwykle na -ć (pisać, czytać). „Pisz” to tryb rozkazujący, „piszę” — czas teraźniejszy, „pisałby” — tryb przypuszczający.<\/details><br>\n14. Forma ***zróbcie*** to tryb: *(4 pkt)*\n    - A) oznajmujący\n    - B) przypuszczający\n    - C) rozkazujący\n    - D) bezokolicznik\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — rozkazujący<br>„Zróbcie!” to polecenie wydane kilku osobom (2. osoba liczby mnogiej). Tryb przypuszczający miałby -by (zrobilibyście).<\/details><br>\n15. W zdaniu ***Jutro będziemy grali w piłkę.*** czasownik jest w: *(4 pkt)*\n    - A) 1. osobie liczby mnogiej, w czasie przyszłym\n    - B) 3. osobie liczby mnogiej, w czasie przeszłym\n    - C) 1. osobie liczby pojedynczej, w czasie przyszłym\n    - D) 2. osobie liczby mnogiej, w czasie teraźniejszym\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — 1. osobie liczby mnogiej, w czasie przyszłym<br>„Będziemy grali” — my (1. osoba liczby mnogiej), jutro, czyli czas przyszły. Pułapka: część „grali” wygląda jak czas przeszły, ale z „będziemy” tworzy czas przyszły złożony.<\/details><br>\n16. Wyrazy ***był*** i ***witał*** są: *(4 pkt)* *(Alfik 2021, zad. 19)*\n    - A) nieosobowymi formami czasownika\n    - B) czasownikami w formie bezokoliczników\n    - C) czasownikami w czasie przeszłym\n    - D) czasownikami w formie 2.os.l.poj.\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — czasownikami w czasie przeszłym<br>(On) był, (on) witał — 3. osoba liczby pojedynczej czasu przeszłego. Bezokoliczniki to „być” i „witać”, a 2. osoba to „byłeś”, „witałeś”.<\/details><br>\n17. Wyraz ***oznajmiono*** jest czasownikiem w formie: *(4 pkt)* *(Alfik 2018, zad. 16)*\n    - A) bezokolicznika\n    - B) osobowej\n    - C) 1. os. l. mn.\n    - D) nieosobowej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — nieosobowej<br>Formy zakończone na *-no* i *-to* (oznajmiono, zrobiono, umyto) to nieosobowe formy czasownika — nie wiadomo, kto wykonał czynność. Pułapka: 1. os. l. mn. brzmiałaby „oznajmiliśmy”.<\/details><br>\n18. Wyrazy ***balansować*** i ***fircykować*** są czasownikami: *(4 pkt)* *(Alfik 2017, zad. 17)*\n    - A) w formie bezokolicznika\n    - B) w formie osobowej\n    - C) w czasie przeszłym\n    - D) nieodmiennymi przez osoby\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — w formie bezokolicznika<br>Bezokolicznik kończy się na -ć i odpowiada na pytanie co robić? — balansować, fircykować. Pułapka D: te czasowniki odmieniają się przez osoby (balansuję, balansujesz…), tylko tutaj użyto ich w bezokoliczniku.<\/details><br>\n19. Czasownik ***pojechałyby*** jest w: *(5 pkt)*\n    - A) 3. osobie liczby pojedynczej, w trybie przypuszczającym\n    - B) 3. osobie liczby mnogiej, w trybie przypuszczającym\n    - C) 3. osobie liczby mnogiej, w czasie przeszłym\n    - D) 2. osobie liczby mnogiej, w trybie rozkazującym\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — 3. osobie liczby mnogiej, w trybie przypuszczającym<br>One pojechałyby — 3. osoba liczby mnogiej, a cząstka -by oznacza tryb przypuszczający. Liczba pojedyncza to „pojechałaby”. Pułapka: przez -ł- forma wygląda na czas przeszły.<\/details><br>\n20. W czasie teraźniejszym jest czasownik: *(5 pkt)*\n    - A) przeczytam\n    - B) napisał\n    - C) zjem\n    - D) pójdę\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>„Napisał” to czas przeszły, a „przeczytam”, „zjem”, „pójdę” to czas przyszły — mówią o tym, co dopiero się stanie. Pułapka: te formy brzmią jak teraźniejsze, ale czasowniki dokonane (zjeść, przeczytać) czasu teraźniejszego nie mają.<\/details><br>\n21. Wyrazy ***wleźli*** i ***zajrzeli***: *(5 pkt)* *(Alfik 2023, zad. 22)*\n    - A) nie odmieniają się przez osoby\n    - B) mają formę czasu teraźniejszego\n    - C) to czasowniki\n    - D) są w stronie biernej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — to czasowniki<br>Oba wyrazy mówią, co ktoś zrobił, więc to czasowniki. Są w czasie przeszłym (3. osoba liczby mnogiej) i w stronie czynnej, a przez osoby się odmieniają (wlazłem, wlazłeś…).<\/details><br>\n22. Podkreślony wyraz w zdaniu ***<u>Dawano<\/u> mu***: *(5 pkt)* *(Alfik 2022, zad. 25)*\n    - A) jest czasownikiem w formie osobowej\n    - B) jest czasownikiem w formie bezokolicznika\n    - C) jest czasownikiem w formie nieosobowej\n    - D) nie jest czasownikiem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — jest czasownikiem w formie nieosobowej<br>Formy na *-no* i *-to* (dawano, mówiono, zrobiono) to nieosobowe formy czasownika — nie wiadomo, kto dawał. Bezokolicznik to „dawać”.<\/details><br>\n23. Podkreślony wyraz w sformułowaniu ***wodę <u>zbierano<\/u>***: *(5 pkt)* *(Alfik 2021, zad. 21)*\n    - A) to czasownik w formie nieosobowej\n    - B) to czasownik w formie bezokolicznika\n    - C) to czasownik w formie liczby mnogiej\n    - D) nie jest orzeczeniem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — to czasownik w formie nieosobowej<br>Formy na *-no* i *-to* (zbierano, zrobiono, umyto) to nieosobowe formy czasownika — nie wiadomo, kto zbierał. W zdaniu pełnią funkcję orzeczenia, więc D jest fałszywe.<\/details><br>\n24. Czasownik ***zbliżyła się*** ma formę: *(5 pkt)* *(Alfik 2019, zad. 21)*\n    - A) nieosobową\n    - B) bezokolicznika\n    - C) 3. os. l. poj. cz. przeszłego\n    - D) 2 os. l. poj.\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — 3. os. l. poj. cz. przeszłego<br>(Ona) zbliżyła się — 3. osoba, liczba pojedyncza, czas przeszły. Bezokolicznik to „zbliżyć się”, a 2. osoba — „(ty) zbliżyłaś się”.<\/details><br>\n25. Podkreślony wyraz w zdaniu ***Nowe szaleństwo Irenki <u>napełniało<\/u> świat radosnym zgiełkiem***: *(5 pkt)* *(Alfik 2016, zad. 24)*\n    - A) nie jest czasownikiem\n    - B) jest czasownikiem w formie nieosobowej\n    - C) nie ma funkcji orzeczenia\n    - D) jest czasownikiem w formie osobowej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — jest czasownikiem w formie osobowej<br>„Napełniało” to czasownik w 3. osobie liczby pojedynczej, czasie przeszłym, rodzaju nijakim (ono napełniało). Pokazuje osobę, więc jest w formie osobowej i jest orzeczeniem.<\/details><br>\n26. Czasownikiem w formie bezokolicznika jest wyraz: *(5 pkt)* *(Alfik 2016, zad. 26)*\n    - A) przygotowując\n    - B) młodość\n    - C) stracony\n    - D) wypłoszyć\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — wypłoszyć<br>Bezokolicznik odpowiada na pytanie co robić? co zrobić? i kończy się na -ć, -c lub -ść: wypłoszyć. Pułapka B: „młodość” kończy się na -ść, ale to rzeczownik. „Przygotowując” i „stracony” to imiesłowy.<\/details><br>\n27. Czasownikiem w formie bezokolicznika nie jest wyraz: *(5 pkt)* *(Alfik 2015, zad. 26)*\n    - A) złośliwość\n    - B) przekroczyć\n    - C) westchnąć\n    - D) zacząć\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — złośliwość<br>„Złośliwość” to rzeczownik (co? złośliwość), choć kończy się na -ść jak niektóre bezokoliczniki. Przekroczyć, westchnąć, zacząć to bezokoliczniki (co zrobić?).<\/details><br>\n28. Czasownikiem w bezokoliczniku jest wyraz: *(5 pkt)* *(Alfik 2014, zad. 21)*\n    - A) torturując\n    - B) garść\n    - C) zmienić\n    - D) pobił\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — zmienić<br>Bezokolicznik to podstawowa forma czasownika, zakończona na -ć, -c lub -ść (co robić? co zrobić?). Pułapka A: „torturując” to imiesłów, nie bezokolicznik; „garść” kończy się na -ść, ale to rzeczownik.<\/details><br>\n\n## C. Stopniowanie przymiotnika i przysłówka\n\nPrzymiotniki i przysłówki mają trzy stopnie: równy, wyższy i najwyższy — ale nie wszystkie da się stopniować.\n\n29. Stopień wyższy przymiotnika ***dobry*** to: *(3 pkt)*\n    - A) dobrszy\n    - B) najlepszy\n    - C) bardziej dobry\n    - D) lepszy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — lepszy<br>„Dobry” stopniuje się nieregularnie: dobry – lepszy – najlepszy. „Najlepszy” to stopień najwyższy, a „dobrszy” i „bardziej dobry” to błędy.<\/details><br>\n30. Przysłówek ***najszybciej*** jest w stopniu: *(3 pkt)*\n    - A) najwyższym\n    - B) wyższym\n    - C) równym\n    - D) nie stopniuje się\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — najwyższym<br>Szybko – szybciej – najszybciej. Przedrostek naj- oznacza stopień najwyższy.<\/details><br>\n31. NIE da się stopniować wyrazu: *(4 pkt)*\n    - A) mądry\n    - B) wysoko\n    - C) drewniany\n    - D) ciekawy\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — drewniany<br>Coś jest z drewna albo nie — nie może być „bardziej drewniane”. Przymiotników od nazw materiałów się nie stopniuje. Mądry – mądrzejszy, wysoko – wyżej, ciekawy – ciekawszy.<\/details><br>\n32. Wszystkie przymiotniki stopniują się nieregularnie w szeregu: *(4 pkt)*\n    - A) dobry, zły, mały\n    - B) dobry, mądry, zły\n    - C) mały, miły, duży\n    - D) ładny, dobry, mały\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — dobry, zły, mały<br>Lepszy, gorszy, mniejszy — stopień wyższy ma zupełnie inny temat. W pozostałych szeregach jest wyraz stopniowany regularnie: mądry – mądrzejszy, miły – milszy, ładny – ładniejszy.<\/details><br>\n33. Wyraz ***dłuższa***: *(4 pkt)* *(Alfik 2015, zad. 18)*\n    - A) należy do nieodmiennej części mowy\n    - B) jest przysłówkiem w stopniu równym\n    - C) jest przymiotnikiem w stopniu najwyższym\n    - D) jest przymiotnikiem w stopniu wyższym\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — jest przymiotnikiem w stopniu wyższym<br>Długi – dłuższy – najdłuższy. „Dłuższa” (chwila jaka?) to przymiotnik w stopniu wyższym. Stopień najwyższy zaczyna się od „naj-”.<\/details><br>\n34. W zdaniu ***Ten plecak jest lżejszy od mojego.*** wyraz ***lżejszy*** to: *(5 pkt)*\n    - A) przysłówek w stopniu wyższym\n    - B) przymiotnik w stopniu wyższym\n    - C) przymiotnik w stopniu najwyższym\n    - D) przymiotnik w stopniu równym\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — przymiotnik w stopniu wyższym<br>Jaki plecak? — lżejszy. Lekki – lżejszy – najlżejszy, więc to stopień wyższy przymiotnika. Przysłówek brzmiałby „lżej”.<\/details><br>\n35. Stopień najwyższy przysłówka ***źle*** to: *(5 pkt)*\n    - A) najgorszy\n    - B) najźlej\n    - C) najgorzej\n    - D) gorzej\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — najgorzej<br>Źle – gorzej – najgorzej (stopniowanie nieregularne). Pułapka: „najgorszy” to stopień najwyższy przymiotnika „zły”, a nie przysłówka.<\/details><br>\n36. Wyraz ***krótkiej***: *(5 pkt)* *(Alfik 2017, zad. 27)*\n    - A) jest przysłówkiem\n    - B) nie odmienia się przez przypadki\n    - C) nie ma stopnia najwyższego\n    - D) można stopniować\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — można stopniować<br>„Krótkiej” to przymiotnik (chwili jakiej? krótkiej). Stopniuje się: krótki – krótszy – najkrótszy. Odmienia się przez przypadki, więc B też odpada.<\/details><br>\n\n## D. Temat i końcówka\n\nTemat to część wyrazu, która zostaje w odmianie; końcówka zmienia się razem z przypadkiem, liczbą czy osobą.\n\n37. W wyrazie ***kotami*** końcówką jest: *(3 pkt)*\n    - A) -ami\n    - B) -mi\n    - C) -tami\n    - D) -i\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — -ami<br>Kot, kot-a, kot-em, kot-ami — temat „kot-” się nie zmienia, więc końcówką jest „-ami”.<\/details><br>\n38. Końcówkę zerową ma rzeczownik: *(3 pkt)*\n    - A) domu\n    - B) domy\n    - C) dom\n    - D) domem\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — dom<br>Temat to „dom-”. W formie „dom” po temacie nic już nie ma — mówimy, że końcówka jest zerowa. Pozostałe formy mają końcówki -u, -y, -em.<\/details><br>\n39. Tematem wyrazu ***książkami*** jest: *(4 pkt)*\n    - A) książ-\n    - B) książk-\n    - C) książka-\n    - D) książkam-\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>B — książk-<br>Książk-a, książk-i, książk-ami — „książk-” powtarza się we wszystkich formach, a końcówką jest „-ami”.<\/details><br>\n40. Oboczność (wymiana głosek) w temacie występuje w parze: *(4 pkt)*\n    - A) kot – kota\n    - B) lampa – lampy\n    - C) okno – okna\n    - D) noga – nodze\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — noga – nodze<br>Nog-a, nodz-e — w temacie „g” wymienia się na „dz”. W pozostałych parach temat się nie zmienia (kot-, lamp-, okn-).<\/details><br>\n41. Tematem w odmianie przez przypadki wyrazu ***ojca*** jest: *(4 pkt)* *(Alfik 2025, zad. 19)*\n    - A) ojc-\n    - B) -a\n    - C) oj-\n    - D) ojca\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>A — ojc-<br>Temat to część wyrazu, która zostaje, gdy odetniemy końcówkę: ojc-a, ojc-u, ojc-em. „-a” to końcówka, nie temat.<\/details><br>\n42. Temat i końcówkę poprawnie oddzielono w wyrazie: *(5 pkt)*\n    - A) rybam-i\n    - B) kwia-tów\n    - C) książka-mi\n    - D) ok-nach\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>E — żadna z powyższych<br>Poprawnie: ryb-ami, kwiat-ów, książk-ami, okn-ach. Żeby znaleźć temat, porównaj kilka form: ryb-a, ryb-y, ryb-ami.<\/details><br>\n43. Rzeczownik ***pies*** w dopełniaczu ma formę ***psa***. Co dzieje się z tematem? *(5 pkt)*\n    - A) temat się nie zmienia\n    - B) zmienia się tylko końcówka, a temat to wciąż *pies-*\n    - C) temat się wydłuża\n    - D) w temacie znika samogłoska *e*\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>D — w temacie znika samogłoska *e*<br>Pies – ps-a, ps-u, ps-em: w temacie znika „e” (tak samo: sen – snu, dzień – dnia). Temat ma więc dwie postaci: „pies-” i „ps-”.<\/details><br>\n44. W wyrazie ***lodu*** końcówką fleksyjną (w odmianie) jest: *(5 pkt)* *(Alfik 2021, zad. 26)*\n    - A) -odu\n    - B) -du\n    - C) -u\n    - D) brak końcówki (zero fleksyjne)\n    - E) żadna z powyższych\n    <details><summary>rozwiązanie<\/summary>C — -u<br>Końcówka to część wyrazu, która zmienia się w odmianie: lod-u, lod-em, lod-zie. Stała część *lod-* to temat. Końcówkę zerową ma mianownik: lód.<\/details><br>\n\n---\n\n## Klucz odpowiedzi\n\n1. B — celowniku\n2. C — imię\n3. D — nożyczki\n4. E — żadna z powyższych\n5. A — bierniku i narzędniku\n6. B — ludzie\n7. A — ma formę liczby mnogiej *(Alfik 2025, zad. 22)*\n8. A — są w formie dopełniacza *(Alfik 2022, zad. 24)*\n9. C — dopełniacza *(Alfik 2022, zad. 28)*\n10. D — będących w tym samym przypadku *(Alfik 2018, zad. 26)*\n11. D — rzeczowniki w różnych przypadkach *(Alfik 2016, zad. 21)*\n12. A — czasie przeszłym\n13. D — pisać\n14. C — rozkazujący\n15. A — 1. osobie liczby mnogiej, w czasie przyszłym\n16. C — czasownikami w czasie przeszłym *(Alfik 2021, zad. 19)*\n17. D — nieosobowej *(Alfik 2018, zad. 16)*\n18. A — w formie bezokolicznika *(Alfik 2017, zad. 17)*\n19. B — 3. osobie liczby mnogiej, w trybie przypuszczającym\n20. E — żadna z powyższych\n21. C — to czasowniki *(Alfik 2023, zad. 22)*\n22. C — jest czasownikiem w formie nieosobowej *(Alfik 2022, zad. 25)*\n23. A — to czasownik w formie nieosobowej *(Alfik 2021, zad. 21)*\n24. C — 3. os. l. poj. cz. przeszłego *(Alfik 2019, zad. 21)*\n25. D — jest czasownikiem w formie osobowej *(Alfik 2016, zad. 24)*\n26. D — wypłoszyć *(Alfik 2016, zad. 26)*\n27. A — złośliwość *(Alfik 2015, zad. 26)*\n28. C — zmienić *(Alfik 2014, zad. 21)*\n29. D — lepszy\n30. A — najwyższym\n31. C — drewniany\n32. A — dobry, zły, mały\n33. D — jest przymiotnikiem w stopniu wyższym *(Alfik 2015, zad. 18)*\n34. B — przymiotnik w stopniu wyższym\n35. C — najgorzej\n36. D — można stopniować *(Alfik 2017, zad. 27)*\n37. A — -ami\n38. C — dom\n39. B — książk-\n40. D — noga – nodze\n41. A — ojc- *(Alfik 2025, zad. 19)*\n42. E — żadna z powyższych\n43. D — w temacie znika samogłoska *e*\n44. C — -u *(Alfik 2021, zad. 26)*\n\n## Ściąga\n\n| Zagadnienie | Reguła | Przykład |\n|---|---|---|\n| Przypadki | M kto? co? · D kogo? czego? · C komu? czemu? · B kogo? co? · N z kim? z czym? · Ms o kim? o czym? · W o! | pies, psa, psu, psa, psem, o psie, psie! |\n| Dopełniacz czy biernik? | podstaw rzeczownik żeński | widzę brata → widzę siostrę (B) |\n| Rodzaj rzeczownika | ten (m.), ta (ż.), to (n.) | ten kolega, ta noc, to imię |\n| Tylko liczba mnoga | nie ma formy pojedynczej | nożyczki, drzwi, spodnie, okulary |\n| Czas przyszły | dokonany: jedna forma; niedokonany: będę + czasownik | zjem; będziemy grali |\n| Tryby | oznajmujący · rozkazujący (polecenie) · przypuszczający (-by) | robię · zrób · zrobiłbym |\n| Stopniowanie proste | -szy / -ejszy, naj- | mądry – mądrzejszy – najmądrzejszy |\n| Stopniowanie opisowe | bardziej, najbardziej | bardziej chory – najbardziej chory |\n| Stopniowanie nieregularne | inny temat | dobry – lepszy, zły – gorszy, mały – mniejszy, duży – większy, źle – gorzej |\n| Nie stopniujemy | przymiotniki od nazw materiałów i narodowości | drewniany, szklany, polski |\n| Temat i końcówka | temat zostaje, końcówka się zmienia; brak końcówki = zerowa | kot-ami, dom-Ø |\n| Oboczności w temacie | wymiana lub zanik głosek | noga – nodze, ręka – ręce, pies – psa |\n"}, {"path": "humanistyczny/klasa-5/zadania-wg-typu/06-zdanie-i-jego-czesci.md", "id": "hum5/06-zdanie-i-jego-czesci", "kind": "dzial", "short": "06 Zdanie i jego części", "sek": "hum5", "sekNazwa": "Humanistyczny · kl. 5", "md": "# 06. Zdanie i jego części\n\n**Dlaczego warto:** W prawie każdym arkuszu Alfika jest pytanie o podmiot albo orzeczenie, często za 4–5 punktów, a do tego pytania o rodzaj wypowiedzenia. Najłatwiej pomylić się, gdy podmiot nie stoi na początku zdania, gdy jest zaimkiem albo gdy go w ogóle nie widać (podmiot domyślny).\n\n- **W pliku:** 45 zadań: 24 nowych i 21 z prawdziwych arkuszy Alfika (9 za 3 pkt, 13 za 4 pkt, 23 za 5 pkt).\n\n**Wskazówki**\n- Podmiot odpowiada na pytanie **kto? co?** i jest w mianowniku. Zadaj pytanie orzeczeniu: *kto zakopał?* — *pies*.\n- Orzeczenie to czasownik w formie osobowej: mówi, co robi podmiot albo co się z nim dzieje. Bezokolicznik (*czytać*) sam nie jest orzeczeniem.\n- Czas przyszły złożony to jedno orzeczenie z dwóch wyrazów: *będziemy pisać*, *będzie czytała*.\n- Podmiot nie musi stać na początku: *Na drzewie siedziały <u>sroki<\/u>.* Nie myl go z wyrazem w celowniku (*Mamie* spodobał się…) — to dopełnienie.\n- Podmiot domyślny: nie ma go w zdaniu, ale poznajemy go po końcówce czasownika (*Poszliśmy* → my). Zdanie bez podmiotu i bez możliwości jego dopowiedzenia (*Grzmi.*) to zdanie bezpodmiotowe.\n- Przydawka określa rzeczownik (jaki? który? czyj? ile?), dopełnienie odpowiada na pytania przypadków zależnych (kogo? czego? komu? czemu? kogo? co? z kim? z czym? o kim? o czym?), okolicznik określa czasownik (gdzie? kiedy? jak? dlaczego? po co?).\n- Liczysz zdania składowe? Policz orzeczenia. Brak czasownika w formie osobowej = równoważnik zdania.\n\n**Spis treści**\n\n- [A. Podmiot i orzeczenie](#a-podmiot-i-orzeczenie)\n- [B. Przydawka, dopełnienie, okolicznik](#b-przydawka-dopełnienie-okolicznik)\n- [C. Rodzaje zdań i wypowiedzeń](#c-rodzaje-zdań-i-wypowiedzeń)\n- [Klucz odpowiedzi](#klucz-odpowiedzi)\n- [Ściąga](#ściąga)\n\n---\n\n## A. Podmiot i orzeczenie\n\nNajpierw znajdź orzeczenie (czasownik w formie osobowej), a potem zapytaj je: kto? co?\n\n1. Podmiotem w zdaniu ***Wczoraj nasz pies zakopał w ogrodzie kość.*** jest wyraz: *(3 pkt)*\n   - A) pies\n   - B) wczoraj\n   - C) nasz\n   - D) kość\n   - E) żadna z powyższych\n   <details><summary>rozwiązanie<\/summary>A — pies<br>Kto zakopał? — pies. To rzeczownik w mianowniku, czyli podmiot. Puła
